# Manual cluster credential: never commit a real token; for GitOps use ../cluster-onboarding/.
# Never put a saTokenLookup Secret under a self-healing GitOps tool: the dashboard
# rewrites it in place with the looked-up token, which self-heal would overwrite.
# No caData: TLS uses the platform trust store (system roots plus configured dashboard CA bundles).
apiVersion: v1
kind: Secret
metadata:
  name: gsd-cluster-ocp-east
  namespace: group-sync-dashboard
  labels:
    groupsync-dashboard.io/secret-type: cluster
type: Opaque
stringData:
  name: ocp-east
  server: https://api.ocp-east.example.com:6443
  config: |
    {
      "bearerToken": "<paste a token>",
      "tlsClientConfig": {"insecure": false}
    }
