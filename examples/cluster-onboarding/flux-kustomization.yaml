# Apply separately with Flux instead of the Argo CD Application.
# Point the existing flux-system GitRepository named cluster-config at your repository.
# kustomization.yaml includes only configmap.yaml, excluding both controller manifests.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-onboarding
  namespace: flux-system
spec:
  interval: 5m
  path: ./examples/cluster-onboarding
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-config
  targetNamespace: group-sync-dashboard
