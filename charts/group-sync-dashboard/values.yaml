# Defaults reproduce exactly what is running today, so `helm install` with no overrides
# yields the deployment that was verified on the cluster. Everything below is here because
# it is plausibly environment-specific; anything genuinely invariant stays in the templates.

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  # repository and tag are written by local-development/build-and-push-external.sh, which
  # tags <version>-<git-sha>. Editing them by hand works, but the script keeps them
  # consistent with an image that actually exists in the registry.
  repository: quay.io/ephico2real/group-sync-dashboard
  tag: "0.6.0-d62a92d229"
  pullPolicy: Always

  # Only needed for a PRIVATE registry. Leave empty for a public repository: an empty
  # secret reference makes a pod fail to schedule rather than falling back to anonymous
  # pull, so it must be absent rather than blank.
  pullSecrets: []
  # pullSecrets:
  #   - name: quay-pull-secret

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Workload
# ---------------------------------------------------------------------------
# RECOMMENDED: 1.
#
# This polls every 60s and serves a handful of operators; it is not in anyone's request
# path. A node drain costs one missed poll, which the next one heals. What a second replica
# actually buys is HTTP uptime, and it pays for it in DIVERGENT HISTORY — each pod only has
# the timeline since its own database existed, so the Service answers "when did this user
# leave?" differently depending on which pod you reach. That history is the irreplaceable
# part; current state self-heals within one poll.
#
# If you do raise it, the chart switches GSD_DB_PATH to /data/$(POD_NAME)/gsd.db so each pod
# gets its OWN file. That is deliberate and not optional: SQLite WAL coordinates writers
# through an mmap'd -shm file that assumes all processes are on one host, so sharing a
# single file across a ReadWriteMany volume corrupts rather than errors. A shared VOLUME
# with unshared FILES is safe; a shared FILE is not.
#
# Requirements for >1: ReadWriteMany persistence, and leaderElection DISABLED — with
# per-pod databases a pod that lost the lease would stop polling while still serving reads
# from its own now-stale copy, which is worse than no election at all.
#
# Note a ReadWriteOnce PVC restricts to one NODE, not one pod, so several pods CAN share it
# if they land on the same node — but relying on that means pinning them there, and losing
# that node then loses every replica.
replicaCount: 1

# A PDB on one replica governs DRAINS, not availability — there is no second pod.
#   maxUnavailable: 1  the drain proceeds, the pod moves, one poll is missed (default)
#   minAvailable: 1    the drain BLOCKS indefinitely, because one replica can never satisfy
#                      it. Cluster admins hit this during maintenance and cannot see whose
#                      workload is stalling them. Only choose it if a human must be involved
#                      before this pod moves.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  minAvailable: ""     # set this INSTEAD of maxUnavailable to block drains

leaderElection:
  # Only the lease holder polls; every replica still serves the API and /metrics.
  #
  # BEST-EFFORT, not a write fence. Leadership is checked once before each poll cycle and
  # never again during it, so a pod that stalls after the check can lose the lease and
  # still finish its writes. Two pods can also both consider themselves leader briefly,
  # since expiry is judged against each pod's own clock. Treat this as reducing the
  # ordinary overlap cases, not as a guarantee that one process writes — the guarantee
  # comes from the deployment shape: one replica, Recreate, one database file.
  #
  # Worth leaving on even at one replica: `Recreate` is not instantaneous, `kubectl scale`
  # is one keystroke, and a partitioned node can leave an old pod running while a new one
  # starts. Each of those puts two pollers on one database.
  #
  # MUST be false above one replica, and the chart refuses to render otherwise. Each pod then
  # owns its own database file, so a pod that loses the lease would stop polling while still
  # serving reads from a copy that never updates again.
  enabled: true
  leaseName: group-sync-dashboard

# Empty derives it: Recreate at one replica, where overlapping pods would contend for the
# same database file, and RollingUpdate above one, where each pod owns its own file and
# Recreate would take the whole deployment down on every upgrade. Set it explicitly to
# override.
strategy: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# ---------------------------------------------------------------------------
# Probes
# ---------------------------------------------------------------------------
# Neither probe is gated on a reachable cluster: an unreachable cluster is a thing this
# dashboard exists to DISPLAY, so failing a probe for one would take it down exactly when
# it has something to report.
#
# The 1s default timeout is deliberately not used. On a host that suspends and resumes,
# every in-flight probe fails with "context deadline exceeded" and liveness kills a healthy
# process — observed here, and it cascaded into a ~4h outage. Liveness is the more forgiving
# of the two because a failed readiness only removes the pod from the Service, while a
# failed liveness destroys in-flight state and forces an image re-pull.
#
# THE TWO PERIODS ARE DELIBERATELY FAR APART, and the reason is what each probe costs when
# it is wrong. Readiness runs every 15s because it is cheap to be wrong: the pod leaves the
# Service and comes back. Liveness runs every 5min because it is expensive to be wrong: it
# destroys in-flight state and forces a container restart, and this process holds the only
# copy of accumulated history between checkpoints.
#
# failureThreshold moved 6 -> 2 with that period. It has to: 6 failures at a 300s period is
# a THIRTY MINUTE wait before a genuinely wedged pod is restarted, which is not a health
# check. At 2 the budget is 10 minutes of sustained failure — still more forgiving than the
# 3 minutes this had at 30s x 6, because the period, not the threshold, is what protects a
# healthy-but-briefly-slow process.
probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 300     # 5 min — see the threshold note above before raising this
    timeoutSeconds: 5
    failureThreshold: 2    # 2 x 300s = 10 min to restart a wedged pod
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
config:
  # 60s. Measured on the reference cluster, one poll is TWO list calls — groupsyncs and
  # groups — because 62 groups fit in a single 500-item page. That is 2880 calls a day per
  # cluster, which is nothing, and it buys the thing this dashboard exists for.
  #
  # The precision argument, since it is the only one that matters here. A sync event
  # carries the operator's own lastSyncSuccessTime, so a slow poll delays when a sync is
  # NOTICED without distorting the recorded timeline. A MEMBERSHIP event has no upstream
  # timestamp — observed_at is ours — so the poll interval IS the error bar on "when did
  # this person lose access?". At 60s that is +/-1 minute; at 900s it was +/-15. Neither
  # loses the change; the slower one just cannot say when it happened. That history is the
  # irreplaceable part, so it gets the resolution.
  #
  # THREE VALUES ARE TIED TO THIS and move with it. Changing pollIntervalSeconds alone
  # breaks all three, and two fail loudly:
  #   * scheduleGraceSeconds below            (or every healthy CR flaps to `late`)
  #   * monitoring.prometheusRule.notPollingSeconds (or that alert fires forever)
  #   * bindingIntervalSeconds below          (or bindings refresh faster than groups)
  pollIntervalSeconds: 60

  # Slack before a CR is called late. Without it the state flaps every cycle: a sync lands
  # 3-14s after its cron minute and is observed up to a POLL INTERVAL later, so a healthy
  # CR briefly exceeds one interval on EVERY pass.
  #
  # Must stay above pollIntervalSeconds — the observation lag it absorbs IS the poll
  # interval. 120 = 60 for that lag plus a minute for scheduler latency.
  scheduleGraceSeconds: 120

  # Bindings are listed across every namespace, far more expensive than the two group
  # calls — ~154 paged requests at 100x the reference cluster — and they change on
  # administrative action rather than on a schedule, so minute-level freshness buys
  # nothing. Deliberately slower than the group poll, which means it moves when the group
  # poll moves, or the expensive call becomes the frequent one.
  bindingIntervalSeconds: 300

  requestTimeoutSeconds: 15

  # SQLite locking. The defaults are tested; change them only for a diagnosed problem.
  sqlite:
    # How long a write waits for a lock another CONNECTION holds before giving up. SQLite's
    # own default is 0 — it raises "database is locked" instantly, with no retry — and that
    # default is the usual cause of the error. The collision this covers is the `Recreate`
    # rollover, where the outgoing pod still holds the lock as the incoming one opens the
    # file. Threads inside one pod are already serialised and never reach this.
    busyTimeoutMs: 5000
    # Deliberately shorter than the writer's: /readyz performs a read and the probe gives up
    # at 5s, so a reader inheriting 5000 would turn contention into a restarted pod.
    readerBusyTimeoutMs: 2000
    # NORMAL is the documented companion to WAL — a power loss can lose the last commits but
    # cannot corrupt the file, and what is lost is one poll of history that the next poll
    # largely re-derives. FULL fsyncs every commit of a 50k-row refresh instead.
    synchronous: NORMAL
    # Truncate the write-ahead log once it passes this size. Checkpointing yields to open
    # readers, so a steady read load can starve it and the WAL grows until the VOLUME fills
    # while the database file itself stays small. Watch gsd_sqlite_wal_bytes.
    walCheckpointMb: 8

  # Periodic backup of the accumulated sync and membership history.
  #
  # THIS IS THE ONLY EXISTENTIAL RISK IN THE SYSTEM. Everything else the dashboard stores
  # is a cache that the next poll re-fetches; the history exists only because this process
  # observed it, and nothing upstream can replay it. Until this existed, a corrupted or
  # deleted PVC lost it outright.
  #
  # VACUUM INTO, not a file copy: it takes a read transaction for the duration, so the
  # output is consistent even while the poller writes. Copying gsd.db with a live WAL
  # produces a torn file that opens without complaint and is missing the newest commits —
  # a backup that restores, which is the worst kind.
  #
  # HALF AN ANSWER BY DESIGN. These land on the SAME volume they protect against, so they
  # cover corruption, a bad migration and accidental deletion — not loss of the volume.
  # Ship them off it with a CronJob mounting the same PVC read-only; the dashboard
  # deliberately does not grow credentials for object storage.
  backup:
    enabled: true
    dir: /data/backup
    intervalHours: 6
    keep: 4     # 4 x 6h = the last day, at roughly the size of the database each

  # Unmanaged-grant DISCOVERY. This feature writes nothing — and to be exact about the
  # dashboard as a whole, the only object it writes on any cluster is its own
  # leader-election Lease, which is its coordination and not anything it reports on.
  #
  # A binding is `unmanaged` when it names an operator-synced group but carries neither the
  # policy operator's config-source label nor an `rbac.ocp.io/unmanaged-exception`
  # annotation — somebody granted access by hand, outside the governance system, and nothing
  # on the cluster reports it.
  #
  # `log` publishes each finding as a self-contained line a log pipeline can alert on:
  #
  #   UNMANAGED GRANT DISCOVERED — crc-local: ClusterRoleBinding demo-cluster-admin-crb
  #   (cluster-wide) grants cluster-admin to group app-ocp-rbac-demo-cluster-admin, outside
  #   the policy system (no config-source label, no exception annotation)
  #
  # The same findings are in the RBAC policy tab and at
  # GET /api/clusters/{id}/bindings/findings. The discovery IS the deliverable.
  #
  # THERE WAS AN `annotate` MODE. IT WAS REMOVED, and this is the reason, so nobody
  # reintroduces it: it labelled the objects themselves so they could be selected with
  # `oc get ... -l rbac.ocp.io/unmanaged=true`, and Kubernetes will not allow it. Privilege
  # escalation prevention requires the writer of an RBAC object to already hold every
  # permission that object grants, even for a metadata-only patch. Measured on a live
  # cluster: 4 findings planned, 0 landed, and the API server demanded 175 additional rule
  # sets to label a binding granting nothing but `view` — a full wildcard for the
  # cluster-admin one. Making it work means giving a read-only auditing tool the most
  # privilege on precisely the most dangerous grants.
  #
  # SUPPRESSING A FINDING IS A CLUSTER-ADMIN TASK, performed on the object:
  #
  #   oc annotate clusterrolebinding <name> \
  #     rbac.ocp.io/unmanaged-exception="approved in TICKET-123, break-glass access"
  #
  # The dashboard READS that annotation and stops classifying the binding as unmanaged, so it
  # leaves the log, the RBAC policy tab and the API together. Two properties follow from doing
  # it this way round rather than keeping a suppression list in the dashboard: the
  # justification lives next to the object it excuses, where anyone running `oc describe` finds
  # it, and the acknowledgement is made by somebody who holds the privileges — which the
  # dashboard deliberately does not. Separation of duties, not a limitation.
  #
  # If you also want the objects LABELLED so they can be selected with
  # `oc get ... -l rbac.ocp.io/unmanaged=true`, an admin or a privileged CI job can apply
  # `rbac.ocp.io/unmanaged=true` the same way. The dashboard notices a label applied by anyone
  # and reports `unmanaged grant RESOLVED` when that binding stops being unmanaged, telling
  # whoever applied it that the label is now stale.
  unmanagedAudit:
    # off | log   (anything unrecognised is treated as off; `annotate` runs as `log`
     #              and says so, rather than failing to off and taking the findings away
     #              from a cluster that had it set)
    #
    # `off` runs no discovery code at all. `log` needs no extra RBAC — the ServiceAccount
    # stays read-only, which is checkable: the ClusterRole's binding verbs are get and list.
    #
    # DEFAULTS TO `log`, and the default moved from `off` deliberately. `off` was right while
    # this feature could write: a default that patches cluster objects has to be opted into.
    # It writes nothing now, so the only thing `off` buys is a governance tool that has found
    # a hand-made cluster-admin grant and declines to mention it. A cluster with no unmanaged
    # grants logs nothing at all, so the cost of the new default is zero where there is
    # nothing to report.
    #
    # Set `off` if you have a reason — a noisy known-bad cluster mid-migration, or an alerting
    # pipeline you have not tuned yet. Findings stay visible in the RBAC policy tab and the
    # API either way; `off` only silences the log.
    mode: "log"
    # At most this many findings LISTED individually per 300s refresh, so a misclassification
    # bug fills one screenful of log per cycle instead of the whole cluster at once.
    #
    # The cap does NOT shrink the headline number: the summary reports every finding awaiting
    # acknowledgement and then says how many of those it listed, because the total is what an
    # operator escalates on. It reported the capped count until 2026-08-03, so a cluster with
    # 500 unmanaged grants announced 20.
    #
    # "Awaiting acknowledgement" is narrower than "on the cluster": an object already carrying
    # the rbac.ocp.io/unmanaged label is a finding but is not re-announced. For the cluster-wide
    # set, use GET /api/clusters/{id}/bindings/findings, which the summary line links.
    #
    # Resolutions are never capped — a closed finding must not queue behind new ones.
    maxPerCycle: 20

  # Who used the dashboard. Requires oauthProxy.enabled — with the proxy off there is no
  # authentication, X-Forwarded-User would be whatever the caller typed, and recording it
  # would manufacture an audit trail rather than keep one. Nothing is recorded in that mode
  # no matter what `enabled` says here.
  #
  # AGGREGATED, one row per user per UTC day: first seen, last seen, request count. It is
  # deliberately not a page-view log. That bounds the table at users x days instead of
  # growing without limit, and it answers "who uses this and when" without accumulating a
  # record of which colleague read whose group membership. Read it at
  # /api/dashboard/activity, which is authenticated and self-scoped by default.
  #
  # NOT via /metrics. There is no gsd_dashboard_active_users gauge; this comment used to point
  # at one and it was removed on purpose (metrics.py:170). /metrics is deliberately
  # unauthenticated so Prometheus can scrape it without credentials, and even an unlabelled
  # count of distinct users is personnel information — it tells anyone who can reach the
  # Service how many people worked on a given day. Unlabelled is not anonymous enough to
  # publish without authentication.
  #
  # NOTE this cannot see logins. The proxy owns the session; the app only ever observes
  # requests that are already authenticated, so there is no login or logout event to
  # record and "session" here means the first-to-last-seen window on a given day.
  #
  # WHO CAN READ IT — `visibility` below. Default `self`: each user sees only their own
  # row. This response is identifiable personnel data (who was present, on which days,
  # between which times, how often), and the argument that carries the rest of this
  # dashboard — "you could read the groups with oc anyway" — is true of group membership
  # and false of who looked at it. It previously returned everyone to everyone.
  #
  # ABOVE ONE REPLICA it is per-pod, like the rest of the history: each pod counts only the
  # requests it served, into its own database. So /api/dashboard/activity answers for whichever
  # pod served the request, and there is no cluster-wide total — adding the pods' figures would
  # double-count anyone who hit more than one.
  userActivity:
    enabled: true
    # self | all.
    #   self  each authenticated user sees only their own activity (default)
    #   all   everyone sees everyone — the pre-existing behaviour, now an explicit choice
    # Anything else is treated as `self`: an unrecognised value must never be the one that
    # widens access to a personnel dataset.
    #
    # THE BLUNT OVERRIDE, and it still wins. `all` here means every admitted reader sees every
    # row, and it takes precedence over the usage tier below — the pre-existing escape hatch,
    # unchanged, for a deployment that genuinely wants the old everyone-sees-everyone view.
    #
    # DELIBERATELY INDEPENDENT of the wide `visibility.adminSar` tier. This knob governs data
    # the dashboard GENERATED about its own readers, and it must NOT merge with the tier that
    # gates CLUSTER data: handing this dataset to `adminSar` would let every cluster-reader see
    # colleagues' presence records. Passing `adminSar` therefore does NOT widen this view.
    #
    # What DOES widen it, when this is left at `self`, is the separate, stricter
    # `visibility.usageAdminSar` check below — a write verb cluster-reader fails and
    # cluster-admin passes — so a full administrator is ungated on Usage while the auditor is
    # not. If you want an admins-only door for the whole dashboard instead, that is
    # oauthProxy.sar.
    #
    # ONE EDGE WORTH KNOWING, measured: with `visibility.enabled=false` the usage tier is not
    # consulted at all, so this view stays per-person for EVERY reader including a
    # cluster-admin, and `all` here becomes the only thing that widens it. That is deliberate
    # and it is the safe direction — switching off scoping for CLUSTER data must not, as a side
    # effect, publish presence records. It also means no SubjectAccessReview is attempted in
    # that state, which is why the auth-delegator grant may be absent there without breaking
    # anything.
    visibility: self
    # Requests are buffered in memory and written once per interval. A write per request
    # would put every API call behind the SQLite writer lock, contending with the poll's
    # bulk write — the latency the WAL work exists to prevent. The cost is that an
    # ungraceful kill loses up to this many seconds of counts; a graceful one flushes.
    flushSeconds: 60
    # Aggregation already bounds the table, so this is a backstop for a long-lived
    # deployment rather than the growth control a request log would need. 0 disables it.
    retentionDays: 400

# DEBUG | INFO | WARNING | ERROR | CRITICAL. Case does not matter; anything else refuses to render.
#
# EACH LEVEL IS A PROMISE, and the app is instrumented to keep it:
#   CRITICAL  the process cannot serve truthfully. Exactly one line in the codebase can emit it —
#             a poll failed AND the store could not record that it failed, so the dashboard reports
#             healthy while serving frozen data under a stale status. Expect never to see it.
#   ERROR     an operator must act; something advertised is broken and will not self-heal. RBAC
#             missing on the Lease, a PVC that cannot support shared memory.
#   WARNING   degraded but scoped or self-healing: one poll failed, one cluster unreachable, or a
#             feature configured but inert (capture on without the RBAC to read pod logs).
#   INFO      one line per completed unit of work or state change, readable at steady state.
#   DEBUG     THIS APP'S OWN REASONING — what it read, what it skipped, and why a number is the
#             number. Per-pod login-capture accounting, the poll cycle's timing and the countdown to
#             the next binding refresh, row counts per read, which replica holds the Lease and how stale its
#             renewal is, and why a given reader was put on the narrow tier.
#
# NOT HTTP REQUEST LINES. This value used to claim DEBUG added them; it does not. `httpx` logs
# `HTTP Request: GET <url> "200 OK"` at INFO itself, so they are already present at the default —
# measured identical at both levels. The layer below (`httpcore`, socket and TLS events) IS pinned to
# WARNING, because unpinned it was 97% of DEBUG output: 356 lines of framing per 10 of the app's own.
# Set GSD_DEBUG_HTTP=true to unpin it when diagnosing a handshake against a corporate CA.
#
# INBOUND REQUESTS ARE OUTSIDE THIS VALUE ENTIRELY. uvicorn logs one access line per request on its
# own loggers, which carry propagate=False and their own handlers at INFO, so `logLevel` cannot raise
# or lower them — at CRITICAL you still get a line per request and lose every app diagnostic.
#
# NOT TO BE CONFUSED WITH `authLogLevel` BELOW, which is a different log level, on a different
# object, in a different vocabulary. That one sets spec.logLevel (Normal | Debug | Trace | TraceAll)
# on authentications.operator.openshift.io/cluster and is what makes the oauth-server EMIT the login
# lines this dashboard reads. `Debug` is the only word valid in both. If the Logins tab is empty,
# that is the one to check — not this one.
logLevel: INFO

# Timezone for LOG LINES ONLY. Set it to whoever reads the logs at 3am — correlating an
# incident against a wall clock is easier than doing UTC arithmetic under pressure.
#
# It changes nothing that is stored or served. Every timestamp in the application is
# datetime.now(UTC) and every stored string ends in Z, the API returns UTC, the dashboard
# renders UTC, and the Usage tab buckets by UTC day. Only the log prefix moves.
#
# Log lines carry the OFFSET (%z), so "2026-08-02 17:17:59-0400" is unambiguous against a
# stored "2026-08-02T21:17:59Z" whatever this is set to. Leave empty for UTC.
#
# Requires tzdata, which the Containerfile installs. It is not in ubi9-minimal by default,
# and its absence fails misleadingly rather than loudly: Python reads TZ as a POSIX spec,
# takes "America" from "America/New_York" as the zone name, finds no offset, and reports
# tzname=('America','America') while the clock stays UTC — a New York label over UTC times.
timezone: "America/New_York"

# Clusters to observe. The default observes the cluster the pod runs on, using its own
# projected ServiceAccount token — which kubelet rotates and the app re-reads every poll, so
# there is no long-lived credential to mint or expire.
#
# Adding entries here enables multi-cluster, but note the authorization caveat in
# docs/PLAN_oauth_proxy.md: OAuth authenticates against the HOSTING cluster only, so one
# instance holding several clusters' data can show a user membership from a cluster they
# have no rights on.
clusters:
  - name: crc-local
    apiUrl: https://kubernetes.default.svc
    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    caBundleFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    enabled: true

# ---------------------------------------------------------------------------
# ArgoCD / GitOps
# ---------------------------------------------------------------------------
# Adds Argo-specific annotations. Off by default because they are inert noise when you are
# not running GitOps, and misleading metadata is worse than none.
#
# Two distinct problems, both of which cost you data or sleep if unhandled:
#
# 1. PRUNING THE PVC. Argo deletes what leaves the source, and cascades on Application
#    delete. That volume holds the accumulated sync timeline and membership history, which
#    the Kubernetes API cannot reproduce — so a routine prune destroys the only
#    irreplaceable state in the system. `helm.sh/resource-policy: keep` does NOT help here:
#    Argo does not run Helm's uninstall path, it reconciles manifests.
#
# 2. THE INJECTED CA ConfigMap. The chart ships it EMPTY and OpenShift writes
#    `data.ca-bundle.crt` into it. Argo sees live data the manifest lacks, reports
#    OutOfSync permanently, and with self-heal on will WIPE the CA bundle the pod depends
#    on — turning every external cluster unreachable on a sync.
argocd:
  enabled: false

  # Prune=false     — not removed when it leaves the source
  # Delete=false    — not removed when the Application itself is deleted (cascade)
  # PruneLast=true  — if ever pruned deliberately, it goes after the workload, so the pod is
  #                   not left running with its volume pulled out from under it
  preservePVC: true

  # NOTE: `compare-options: IgnoreExtraneous` is deliberately NOT used here. Per the ArgoCD
  # docs it is for resources NOT declared in git — ones "generated by a tool" — and applying
  # it to a resource the Application itself creates defeats the purpose of tracking
  # deployment state. Binding drift on the PVC is handled with ignoreDifferences on the
  # Application instead; see the chart README.

  # ServerSideApply lets the operator keep ownership of the fields it writes. It reduces the
  # fight but does not end it: Argo still diffs the data it does not know about, so the
  # Application ALSO needs an ignoreDifferences entry. See the chart README — the chart
  # cannot set that, because it lives on the Application, not on the resource.
  serverSideApplyInjectedCA: true

# ---------------------------------------------------------------------------
# Trusted CA bundle (for EXTERNAL clusters)
# ---------------------------------------------------------------------------
# Creates an empty ConfigMap labelled `config.openshift.io/inject-trusted-cabundle: "true"`,
# which OpenShift fills with the system trust store merged with the corporate CA from
# proxy/cluster.spec.trustedCA, and mounts it.
#
# Needed because an external cluster's API server is usually signed by a corporate CA that
# is not in Python's default trust store. Without it, verification fails and the cluster
# renders as unreachable — a TLS problem that looks like an outage.
#
# Used only as a FALLBACK: a cluster entry naming its own caBundleFile keeps it, because
# that is a specific statement about what it trusts.
#
# Harmless when observing only the local cluster (the SA's own ca.crt is named explicitly),
# so it defaults on. Set false on non-OpenShift, where nothing injects it.
trustedCA:
  # METHOD 1 — injected. An empty ConfigMap labelled
  # `config.openshift.io/inject-trusted-cabundle: "true"`, which OpenShift fills with the
  # system trust store merged with proxy/cluster.spec.trustedCA. Nothing to maintain, but
  # it only carries CAs the CLUSTER already knows about.
  injected:
    enabled: true

  # METHOD 2 — a ConfigMap you supply. For a CA the cluster has not been told about: a
  # partner's internal CA, a lab signer, or an external cluster whose CA is not in your
  # corporate bundle. Create it yourself, out of band:
  #
  #   oc create configmap enterprise-ca --from-file=ca-bundle.crt=/path/to/ca.pem \
  #     -n <namespace>
  #
  # Deliberately NOT templated into the chart: certificates in values.yaml end up in git,
  # in `helm get values`, and in every CI log that echoes them.
  existingConfigMap:
    enabled: false
    name: enterprise-ca
    key: ca-bundle.crt

  # BOTH may be enabled at once. They are concatenated into one bundle at startup, in the
  # order injected-then-manual, because a bundle is just a list of PEM blocks and there is
  # no reason to make the operator choose. Enabling neither falls back to Python's default
  # trust store.
  mountPath: /etc/pki/ca-trust/extracted/pem

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
# The accumulated sync timeline and membership history are the ONLY things that cannot be
# re-fetched from the API (PLAN §2). An emptyDir would silently reset them on every restart,
# so persistence defaults to on.
persistence:
  enabled: true
  size: 1Gi
  # ReadWriteMany, so the volume never has to be recreated to scale and so it works on the
  # shared storage most clusters actually provide.
  #
  # This trades away an ENFORCED guarantee for an advisory one, and that is worth knowing.
  # ReadWriteOncePod makes two pods on one database structurally impossible — the scheduler
  # refuses the second. RWX does not: nothing stops two pods mounting this volume. At one
  # replica they would share a single /data/gsd.db, which is the case SQLite must not be in.
  # Three things keep that from happening, none of them enforced by storage:
  #   * strategy Recreate at one replica, so the outgoing pod is gone before the incoming one
  #     starts (this is why the derived strategy matters more under RWX than it did before),
  #   * leader election, so only the lease holder polls, and
  #   * config.sqlite.busyTimeoutMs, so a rollover overlap waits for the lock instead of
  #     failing on it.
  # Above one replica the shared-file problem disappears anyway: each pod gets its own
  # /data/$POD_NAME/gsd.db.
  #
  # WATCH THE FILESYSTEM UNDERNEATH. RWX in practice usually means NFS, and SQLite refuses
  # WAL there — it coordinates through an mmap'd -shm file that assumes one host. The switch
  # fails SILENTLY and readers then block on every write. The chart reads the mode back and
  # alerts on it (GroupSyncDashboardWalDisabled, gsd_sqlite_wal_enabled); do not ignore it.
  # Block storage or a CSI RWX filesystem with real POSIX locking is fine. NFS/EFS/SMB is not.
  #
  # Set ReadWriteOncePod to get the enforced single-pod guarantee back at one replica.
  # Empty derives it: ReadWriteMany above one replica, ReadWriteOncePod at one.
  accessMode: ReadWriteMany
  storageClass: ""     # "" -> cluster default
  existingClaim: ""    # set to reuse a claim instead of creating one

# ---------------------------------------------------------------------------
# RBAC
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # Creates a ClusterRole + binding granting get/list on groupsyncs, groups, users,
  # rolebindings and clusterrolebindings. No watch, and no write verb on any of them. The
  # role's only write is get/create/update on the dashboard's own leader-election Lease.
  create: true

  # RoleBindings/ClusterRoleBindings power the "Access granted" view and dangling-binding
  # detection. Disable to drop that grant; the dashboard degrades to group data only.
  bindings: true

  # Users are read for ONE field, fullName, so a member list can show "alice.cooper · Alice
  # Cooper" instead of the bare id. Nothing else on the object is read — not identities, not
  # group membership, which comes from the Group objects granted above.
  #
  # A name exists only for people who have LOGGED IN: OpenShift creates the User object on
  # first authentication and the identity provider fills fullName from its attributes.name
  # mapping. Members who have never logged in have no User object and render exactly as
  # before. Measured on the reference cluster: 7 of 10 group members named, 3 not.
  #
  # Safe to leave false, and safe to upgrade the image without re-applying RBAC: the list call
  # 403s, the collector reports "not permitted", and the poller keeps the names it already had
  # rather than blanking them. You lose new names, never correctness.
  users: true

# ---------------------------------------------------------------------------
# Login capture  (reads the oauth-server's logs)
# ---------------------------------------------------------------------------
# Grants the DASHBOARD read access to the oauth-server's pod logs, which is where the "who logged in"
# lines appear. Read-only, on the dashboard's own ServiceAccount — the write that ENABLES those lines
# lives on a separate identity, see authLogLevel below.
#
# NEEDS authLogLevel.enabled=true TO SEE ANYTHING. At the default verbosity the lines do not exist —
# measured: zero occurrences of "succeeded for login" until the level is Debug. So this grant on its
# own is inert, which is deliberate: the read and the cluster-wide write are separate decisions.
#
# A Role in ONE namespace, not a ClusterRole, and that matters: `pods/log` cluster-wide would let the
# dashboard read EVERY pod's logs on the cluster — tokens, connection strings, customer data. Scoped
# here it can read the OAuth server's logs and nothing else.
#
# The cost, stated rather than hidden: this creates a Role and RoleBinding in a namespace the chart
# does not own. An ArgoCD Application will show them outside its destination namespace, and a policy
# forbidding writes to `openshift-*` namespaces will reject them.
loginCapture:
  enabled: false

  # Where the oauth-server runs. Only change this if your cluster is unusual; it is the fixed
  # namespace OpenShift installs the OAuth server into.
  namespace: openshift-authentication

  # Provider NAMES that are local HTPasswd accounts rather than directory identities.
  #
  # The log line carries the provider's name and nothing about its type, so without this list a
  # success on `developer` looks exactly like a directory login. These are break-glass accounts —
  # `kubeadmin` and whatever your HTPasswd IdP is called — and the point of naming them is that they
  # are excluded from "accounts in no synced group": there is nowhere to migrate them to, so leaving
  # them in that list is permanent noise on the one finding worth reading.
  #
  # Match the `name:` of the identity provider in `oauth.config.openshift.io/cluster`, not the
  # username. `kubeadmin` is a special case OpenShift does not serve through a named provider, so it
  # does not need to be listed here.
  htpasswdProviders:
    - developer

  # How long a login attempt is kept. 400 days rather than 365 so a year-over-year access review can
  # still see the previous cycle; 0 disables pruning entirely and lets the table grow without bound.
  #
  # Pruned a bounded chunk per poll on the writer thread, so a long backlog shortens over several
  # cycles instead of holding the write lock through one enormous DELETE.
  retentionDays: 400

# ---------------------------------------------------------------------------
# Cluster access — the login-gate group
# ---------------------------------------------------------------------------
# WHAT THIS ANSWERS. Holding RBAC access and being able to LOG IN are two different things, and a
# cluster that gates authentication on group membership can grant somebody a role they can never use.
# Measured on the reference cluster: 10 people held access through synced groups, 7 were in the gate
# group, so 3 held access they physically could not exercise. Nothing else in this dashboard sees that,
# because every other view starts from RBAC.
#
# It also settles the one thing the oauth log cannot. A refused login logs `no entries matching
# (<filter>)` whether the account is outside the gate group or does not exist — the filter carries the
# group, so the two are byte-identical. With the gate group's membership known, a refusal for somebody
# who IS in a synced group is definitively "a real person, not gated".
#
# ── PREREQUISITE, AND IT IS NOT THIS CHART'S JOB ──────────────────────────────────────────────────
# The gate group has to be synced into OpenShift as a Group object, by the group-sync-operator, with
# its OWN GroupSync CR. This chart does NOT create that CR and should not: GroupSync CRs are the
# platform team's, and a dashboard that starts writing them is the same overreach as managing
# proxy/cluster's trustedCA. A worked example is in docs/examples/clusteraccess-groupsync.yaml.
#
# Its own CR rather than a widened filter on the existing one, because the sync-provider label is
# <cr-name>_<provider-name>: a separate CR gets its own label, so the group is distinguishable from
# the RBAC groups everywhere the dashboard groups by owner, and `prune: true` stays scoped to it.
#
# WATCH THE MEMBERSHIP ATTRIBUTE. A gate group is often objectClass groupOfUniqueNames with
# `uniqueMember`, while RBAC groups are groupOfNames with `member`. Copying the RBAC CR's rfc2307
# block verbatim syncs the group with ZERO members and looks like a working sync.
clusterAccess:
  # The FULL DN of the gate group. A DN, not a name: it is what a synced Group carries in its
  # `openshift.io/ldap.uid` annotation, so the match is exact, and matching on `cn` would break the
  # moment two branches of a directory both had a `cluster-access` group.
  #
  #   group: "cn=app-ssb-autobahnusers,ou=Groups,dc=ephico2real,dc=com"
  #
  # EMPTY DISCOVERS IT from the OAuth CR's LDAP identity provider, whose search filter names the
  # group. Both spellings are read — `memberOf` (OpenLDAP, Active Directory) and `isMemberOf`
  # (389-ds, Oracle/Sun DSEE) — because neither is standardised and a parser that knows one would
  # report "no gate configured" on half the directories in the world.
  #
  # Set it explicitly when the gate is not in that filter, or when this chart may not read the OAuth
  # CR. Discovery is the convenience; this value is the contract.
  group: ""

  # Grant `get` on oauths.config.openshift.io/cluster, which is what makes discovery possible.
  #
  # Narrowed with resourceNames to the single object `cluster` — honoured by Kubernetes for `get`,
  # unlike `list`. Declining it is a supported choice: without the grant the read 403s, the discovery
  # returns nothing, and the feature reports that it needs `clusterAccess.group` set rather than
  # failing. Pointless to grant when `group` is set, and the chart does not force the pairing because
  # an operator may want discovery available as a fallback.
  discoverFromOAuth: true

# ---------------------------------------------------------------------------
# oauth-server log verbosity  (prerequisite for login capture)
# ---------------------------------------------------------------------------
# The oauth-openshift server only names the person logging in when the AUTHENTICATION OPERATOR
# CR — `authentications.operator.openshift.io/cluster` — has `spec.logLevel: Debug`.
#
# NOT the OAuth CR. `oauth.config.openshift.io/cluster` is the object that holds the identity
# providers, and this feature never touches it; there is also a THIRD, one word apart:
# `authentications.config.openshift.io/cluster`, which holds `type`/`serviceAccountIssuer`.
# And within the operator CR, `logLevel` (the operand's verbosity) is not `operatorLogLevel`
# (the operator's own) — patching the latter would change nothing this needs. At `Normal` the line
# is not emitted at all — measured: zero occurrences of "succeeded for login" until this is on. So
# this section is the prerequisite for capturing login activity, and nothing more.
#
# TWO SWITCHES, ON PURPOSE:
#
#   manage: false            nothing renders, no RBAC, this chart never touches the cluster's setting
#   manage: true  enabled: t a hook Job sets Debug
#   manage: true  enabled: f the same Job sets Normal  <- this is what makes "turn it off" work
#
# Helm does not run a Job you merely stopped rendering, so a one-way enable Job would strand the
# cluster in Debug the moment somebody flipped the flag back and saw nothing happen.
#
# `manage: true` is the operator DECLARING THAT THIS CHART OWNS the cluster's log level. That is why
# it defaults to false: opting in is what transfers ownership, and the uninstall revert below then
# has the standing to put it back.
authLogLevel:
  manage: false
  enabled: false

  # ⚠️  CHANGING THIS ROLLS THE OAUTH SERVER, WHICH IS A LOGIN OUTAGE ON A SINGLE-REPLICA CLUSTER.
  # The authentication operator replaces deploy/oauth-openshift when logLevel changes; until the new
  # pod is Ready, `authentication` reports "OAuthServerDeploymentAvailable: no oauth-openshift pods
  # available on any node" and logins fail. Measured on a 1-replica CRC cluster: the replacement pod
  # sat Pending (node at 91% CPU requests) and a second application watching the same cluster logged
  # `HTTP 503 on /apis/user.openshift.io/v1/groups` while it happened.
  #
  # Check the blast radius first, and use a maintenance window if the answer is 1:
  #   oc get deploy oauth-openshift -n openshift-authentication -o jsonpath='{.spec.replicas}{"\n"}'
  #
  # This applies to turning it OFF as much as ON — both directions are a logLevel change.

  # Puts the level back to Normal on `helm uninstall`, via a pre-delete Job.
  #
  # LEAVE THIS ON. Without it, removing the dashboard leaves the OAuth server naming every person
  # who authenticates — along with their LDAP DN and the bind filter — with nothing left watching
  # the logs and nobody aware it is happening. The one thing that would have told you is the thing
  # you just uninstalled.
  revertOnUninstall: true

  # WHAT DEBUG ACTUALLY EXPOSES, so this is a decision and not a shrug: the lines carry the username
  # of everyone who authenticates, their resolved LDAP DN, and the bind filter used. Anyone who can
  # read pod logs in openshift-authentication can read them. Turn it off when the capture is not
  # needed; that is what the toggle is for.

  # `oc` is all the Jobs need, and this is the IN-CLUSTER imagestream every OpenShift cluster ships
  # — not registry.redhat.io.
  #
  # MEASURED: `registry.redhat.io/openshift4/ose-cli:latest` was the first choice and it failed here
  # with ErrImagePull ("copying config: context canceled") after 40s. It needs registry.redhat.io
  # credentials, it is a large image, and `:latest` is unpinned — three ways for a prerequisite Job
  # to fail on somebody else's cluster. The internal imagestream is already mirrored by the release
  # payload, so there is nothing to authenticate and usually nothing to pull.
  #
  # OpenShift-specific, deliberately: this whole section patches an OpenShift operator CR, so it has
  # no meaning on plain Kubernetes. Override it if your cluster mirrors elsewhere.
  image:
    repository: image-registry.openshift-image-registry.svc:5000/openshift/cli
    tag: latest
    pullPolicy: IfNotPresent

  # How long to wait for the operator to roll the oauth pods after the patch.
  #
  # The Job does NOT use `oc rollout status` for this, and that is measured rather than cautious: on
  # the reference cluster it returned "successfully rolled out" about THIRTY SECONDS BEFORE the
  # rollout began, because the old ReplicaSet was still current and complete at that moment. The Job
  # polls the Deployment's observedGeneration and available/updated replicas instead.
  #
  # A timeout here is NOT a failure — the patch has landed, which is the Job's actual work, and the
  # rollout is the operator's to finish. Failing would fail `helm upgrade` over somebody else's slow
  # reconcile.
  waitSeconds: 180

  # Wall clock on the whole attempt, so a Job that cannot reach the API server cannot hold up an
  # upgrade indefinitely. Must stay above waitSeconds.
  activeDeadlineSeconds: 300

  # Deliberately short. An uninstall must not hang: a cluster left in Debug is fixable by hand, a
  # wedged `helm uninstall` is not.
  revertDeadlineSeconds: 120

  backoffLimit: 2

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080

# Ingress, not Route. On OpenShift the ingress-to-route controller converts this into a
# Route automatically (ingressClassName: openshift-default), so one manifest serves both
# OpenShift and plain Kubernetes.
#
# WARNING: with oauthProxy.enabled=false there is NO authentication and the dashboard
# exposes group membership. Do not expose it on a shared cluster that way.
ingress:
  enabled: true
  className: openshift-default
  # LEAVE EMPTY. It is auto-detected as <fullname>.<cluster apps domain>, reading the domain
  # from the cluster's own ingresses.config/cluster object, so a default install needs no
  # flag and no knowledge of the cluster:
  #
  #   group-sync-dashboard.apps-crc.testing
  #
  # Not <fullname>-<namespace>, which is OpenShift's Route auto-generation convention. That
  # exists so two namespaces cannot claim one hostname, and it is the right default for
  # arbitrary app Routes — but here the release and the namespace are both
  # `group-sync-dashboard`, so it produced a URL that said the same word twice. A host a
  # human can type, and read out in a review meeting, is worth more.
  #
  # The trade, because it is real: two releases in DIFFERENT namespaces derive the SAME host
  # and the second Route is rejected with HostAlreadyClaimed. That fails loudly at install
  # time, and the fix is to set this explicitly on the second one.
  #
  # It cannot simply be omitted: a Route auto-generates its host, but an Ingress does not,
  # and OpenShift's ingress-to-route controller silently creates NO Route for a hostless
  # Ingress. That made a default install unreachable with nothing reporting an error — the
  # Ingress existed, the pod was healthy, and no Route was ever created.
  host: ""
  annotations: {}
  tls: []
  # Carried as route.openshift.io annotations, since Ingress has no field for either.
  # Overridden to reencrypt automatically whenever the proxy is enabled.
  termination: edge
  insecureEdgeTerminationPolicy: Redirect

# ---------------------------------------------------------------------------
# OpenShift OAuth proxy
# ---------------------------------------------------------------------------
# Puts cluster login in front of the dashboard. ON by default, because this exposes group
# membership and the Ingress is reachable by anyone who can resolve the cluster's apps
# domain — an unauthenticated default would be the wrong way round. Turn it off only for a
# local single-user cluster, or where something in front already authenticates the route.
#
# ACCESS MODEL for the UI: authentication, not authorization. Anyone who can log into the
# cluster can view. That is the documented default of the OpenShift provider ("defaults to
# allowing any user that can log into the OpenShift cluster").
#
# BE PRECISE ABOUT WHAT THAT EXPOSES. This comment used to claim the dashboard "shows nothing
# a user could not already read with `oc get groups`", and that is true of the Groups tab and
# nothing else. The dashboard reports the cluster's whole RBAC BINDING surface — every
# ClusterRoleBinding and RoleBinding, the role each grants, and which subjects hold it —
# which reading Groups does not give you. The same mistake had been made in the /api review
# and was a measured privilege escalation; see apiTokenAccess below.
#
# So treat UI access as equivalent to cluster-wide RBAC read. If that is not who should be
# looking, set `sar` — e.g. to require `list clusterrolebindings`, matching what the API
# review demands.
oauthProxy:
  enabled: true

  # The RHEL9 oauth-proxy from Red Hat's registry, explicitly versioned.
  #
  # This was previously the cluster's own imagestream
  # (image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4), chosen
  # because registry.redhat.io had no tag newer than v4.14.0 at the time and the internal
  # one needed no credentials. `ose-oauth-proxy-rhel9:v4.15` has since been published and
  # is the better default: an explicit, auditable version on a RHEL9 base, rather than a
  # `v4.4` tag whose digest silently tracked whatever the cluster's release payload held.
  # A pinned name a human can look up beats a stable-looking tag that means something
  # different on every cluster.
  #
  # PULL CREDENTIALS. registry.redhat.io needs authentication, where the internal registry
  # did not. On a normal OpenShift cluster this is already covered: the global pull secret
  # in openshift-config carries registry.redhat.io, and the MCO distributes it to every
  # node, so no per-namespace imagePullSecret is required. Verified on the reference
  # cluster before this became the default. Check yours with:
  #   oc get secret/pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' \
  #     | base64 -d | python3 -c 'import json,sys; print(*sorted(json.load(sys.stdin)["auths"]))'
  #
  # If registry.redhat.io is absent there, or the cluster is disconnected, override:
  #   --set oauthProxy.image=<your-mirror>/openshift4/ose-oauth-proxy-rhel9:v4.15
  #   --set oauthProxy.image=image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
  # The second is the old internal-registry path, still valid and still credential-free.
  #
  # What your cluster's own release recommends, for comparison:
  #   oc adm release info --image-for=oauth-proxy
  image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.15
  imagePullPolicy: IfNotPresent
  port: 8443

  # Cookie signing key. Leave empty and the chart generates one, then REUSES it across
  # upgrades by reading back the existing Secret. Generating inline in the container args
  # instead — as some examples do — silently regenerates on every `helm upgrade` and logs
  # every user out.
  cookieSecret: ""

  # Session lifetime: ONE absolute number, measured from login, deliberately NOT sliding.
  #
  # There is no `refresh` key and no -cookie-refresh flag, and that is a MEASUREMENT rather
  # than a preference. With provider=openshift the proxy's refresh-time revalidation sends
  # the token as a QUERY PARAMETER to /apis/user.openshift.io/v1/users/~, which the API
  # server ignores — it answered 403 naming the caller system:anonymous — so every refresh
  # interval would CLEAR the session instead of extending it: a forced-logout timer wearing
  # a keep-alive's name. The cluster-logging operator ships Kibana's oauth-proxy the same
  # way on this same provider, -cookie-expire with no -cookie-refresh. Setting `refresh`
  # here fails the render rather than quietly logging everyone out at the interval.
  #
  # Because it cannot slide, this cap applies to an ACTIVE reader too: at 4h everyone
  # re-authenticates, mid-task or not. Measured on the reference cluster, re-entry asks for
  # credentials — the OAuth server keeps no reusable session for this client — so the cap is
  # a real forced re-login rather than a redirect flicker. Raise it if that bites during a
  # long incident; the lever is this number, not the design.
  #
  # Go duration: "4h", "90m", "1h30m". A bare number has no unit and is refused at render.
  cookie:
    expire: 4h

  # The proxy's own URL prefix. Everything it serves lives under it — /sign_in, /sign_out,
  # /callback, /auth — and the app composes its sign-out link from this rather than
  # hardcoding "/oauth", so the two cannot drift. Changing it also changes the callback
  # path, which must keep matching the ServiceAccount's redirect-uri annotation.
  proxyPrefix: /oauth

  # Where the proxy sends the browser after clearing its cookie. The default is this
  # dashboard's own unauthenticated /signed-out page, RELATIVE on purpose: the browser
  # resolves it against whichever host served the redirect, so rendering needs no cluster
  # lookup and a changed route cannot strand it.
  #
  # It must land OUTSIDE the proxy, or sign-out is a no-op that returns the reader signed
  # in — which is why /signed-out is in skipAuthRegex below, and why a render guard refuses
  # to let it be dropped from there while this stays empty.
  logoutUrl: ""

  # Paths served without authentication. The health endpoints MUST be here or kubelet
  # probes receive a 302 to the login page and the pod is killed as unhealthy. /metrics is
  # included so a ServiceMonitor can scrape it; the exporter emits counts and states only,
  # never a group or user name, precisely because it is reachable unauthenticated.
  #
  # /signed-out is the logout landing page and must be here: behind the proxy it would start
  # a fresh OAuth flow and return the reader signed in, the opposite of what they clicked. It
  # links app.css and favicon.svg, so those are admitted too — the page carries no <style>
  # block by contract, so without the stylesheet it renders unstyled. The vendored FONTS stay
  # authenticated, so it deliberately falls back to system fonts rather than widening the
  # unauthenticated surface further.
  skipAuthRegex: '^/(healthz|readyz|metrics|signed-out|static/(app\.css|favicon\.svg))$'

  # Empty means authentication only. To also require a permission, put a SubjectAccessReview
  # here, e.g. to admit only those who could read the underlying data anyway:
  #   sar: '{"resource":"groups","resourceAPIGroup":"user.openshift.io","verb":"list"}'
  sar: ""

  # ---------------------------------------------------------------------------
  # Direct API access with a bearer token
  # ---------------------------------------------------------------------------
  # Lets `curl -H "Authorization: Bearer <token>" https://<host>/api/...` work, which is what
  # an external aggregator needs — see docs/api-access.md.
  #
  # WHY IT IS OFF WITHOUT THIS. The proxy authenticates BROWSER sessions with a cookie. A
  # request carrying a bearer token and no cookie is simply unauthenticated as far as it is
  # concerned, so /api returns 403 with the login page as the body — confusing, because the
  # token is perfectly valid.
  #
  # -openshift-delegate-urls is the flag that changes it. Per upstream it applies ONLY to
  # requests carrying `Authorization: Bearer` or a client certificate, so browser sessions
  # keep the cookie flow untouched and only the machine path is affected. It also needs
  # system:auth-delegator on the PROXY's ServiceAccount, which the chart binds — the proxy is
  # the party that calls TokenReview and SubjectAccessReview. Callers do NOT need that role.
  #
  # ---------------------------------------------------------------------------
  # THE REVIEW MUST MATCH WHAT /api EXPOSES. Read this before changing it.
  # ---------------------------------------------------------------------------
  # This was `list groups` and that was WRONG — a privilege escalation, proven on the
  # reference cluster. An account granted only `list groups`:
  #
  #     oc list clusterrolebindings        -> no
  #     oc list rolebindings -A            -> no
  #     GET /api/.../bindings/findings     -> 229 bindings, including
  #                                           app-ocp-rbac-alpha-cluster-admin-crb
  #
  # /api is not a group-membership API. It reports the cluster's entire RBAC binding surface:
  # every ClusterRoleBinding and RoleBinding, which role each grants, and which subjects hold
  # it. Gating that on `list groups` let an identity learn through the dashboard what it could
  # not learn with `oc`.
  #
  # So the review demands cluster-wide RBAC read, which is the honest floor for this data.
  # If you narrow it, narrow what /api returns first.
  #
  # SCOPED TO /api DELIBERATELY. The prefix map does not cover "/", so the UI keeps its
  # browser-only door and a token cannot be used to drive the HTML.
  #
  # ---------------------------------------------------------------------------
  # GRANTING A REPORTING ACCOUNT — deliberately NOT a chart value
  # ---------------------------------------------------------------------------
  # An earlier version had an `apiTokenAccess.readers` list that created the grant from here.
  # It was removed, and the reason matters: with the correct review the required permission is
  # cluster-wide RBAC read, so a chart value that hands it out makes anyone who can edit a
  # values file able to grant themselves that read. A Helm value is the wrong control for a
  # cluster-level privilege.
  #
  # Grant it through your normal RBAC process instead. The stock role already exists:
  #
  #   oc adm policy add-cluster-role-to-group cluster-reader <ldap-group-for-reporting>
  #   oc adm policy add-cluster-role-to-user  cluster-reader system:serviceaccount:<ns>:<sa>
  #
  # Prefer the GROUP form. It is the argument the Namespace audit tab makes about the cluster,
  # applied here: a grant naming a person survives their departure, one naming a group is
  # revoked when the directory removes them from it.
  apiTokenAccess:
    enabled: false
    delegateUrls: '{"/api":{"resource":"clusterrolebindings","group":"rbac.authorization.k8s.io","verb":"list"}}'

  # The interstitial page that offers exactly one login choice.
  #
  # true skips it and redirects straight to the cluster's OAuth server. That is one fewer
  # click, but when anything goes wrong mid-flow the first thing a user sees is the proxy's
  # own error page — headed "403 Permission Denied", which reads as "you are not allowed
  # in" rather than "your session expired, sign in again". Observed on this deployment:
  # a rollout landed between the redirect and the callback, the CSRF cookie no longer
  # matched, and the 403 page was indistinguishable from a permissions failure.
  #
  # false shows an explicit Log In button instead. One extra click, and the unauthenticated
  # state is a page that says sign in.
  skipProviderButton: false
  requestLogging: false

  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}

  # There is deliberately NO `redirectMode` setting. The ServiceAccount always advertises a
  # literal redirectURI, because the alternative — redirectREFERENCE — points at a Route by
  # NAME, and OpenShift's ingress-to-route controller generates that name with a random
  # suffix (observed: probe-ingress-7669p), so it cannot be known at template time. This
  # chart ships an Ingress, so the reference form is not available to it at all. See the
  # gsd.externalHost helper, which is why ingress.host must be set or derivable.
  #
  # A `redirectMode: redirectreference` key used to sit here. It was read by nothing, and
  # its default named the one mode the chart CANNOT use — so it documented the opposite of
  # the behaviour, in a place an operator would reasonably believe.

# ---------------------------------------------------------------------------
# Per-user visibility
# ---------------------------------------------------------------------------
# WHO SEES WHAT, once the proxy has admitted a reader. ON by default, because it fixes an
# exposure rather than adding a feature: the dashboard reads the cluster with its own
# ServiceAccount, so with restrictions off EVERY authenticated reader sees the full RBAC
# binding surface, every group's membership and every person's login failures — data a
# plain user cannot read with `oc` (measured: eight `oc auth can-i list` checks, all no).
#
# With restrictions on, a reader sees only what belongs to them — their profile, their
# groups, their grants, their own login attempts — unless a SubjectAccessReview, asked by
# the app as its own ServiceAccount and naming the reader AND their groups, allows the
# check in `adminSar` below. An INDETERMINATE answer (SAR error, timeout) always yields
# the narrow view, never the wide one. Requires oauthProxy.enabled — with the proxy off
# there is no trusted identity to scope to, and the chart refuses to render rather than
# ship a control that cannot work.
#
# A REVOKED administrator keeps the wide view for at most the tier cache TTL (60s) plus
# one in-flight page; a newly granted one waits the same. The SAR itself evaluates live
# RBAC — only the cached verdict and the group list age.
visibility:
  # true -> the env var GSD_ENABLE_VIEW_RESTRICTIONS on the Deployment. The spelling is
  # load-bearing: the app reads exactly that name, defaults to restricted, and never sees a
  # misspelling — so a typo cannot silently disable the control.
  #
  # false restores today's everyone-sees-everything view. Make that a deliberate, recorded
  # choice: it re-opens the exposure above for every authenticated account.
  enabled: true

  # How long a DECIDED tier is cached, per viewer, in whole seconds. Serves both thresholds
  # below; each keeps its own cache, so this is the lifetime of an entry, not a shared budget.
  #
  # This is the one number here whose wrong value is a security consequence rather than a
  # broken render, so both directions are stated:
  #
  #   LARGER   a reader removed from an admin group keeps the wide view for up to this long.
  #            That is the fail-open direction, and it is why the default is a minute rather
  #            than an hour. Verified live by granting cluster-reader and revoking it: the
  #            wide view arrived, and was gone again, each within one interval.
  #   SMALLER  a SubjectAccessReview plus a group read per reader per request. Measured at
  #            97ms for the 65-group reference cluster. 0 disables caching entirely.
  #
  # An ERROR is never cached — only a decided answer is — so this does not extend an API-server
  # outage, and an indeterminate tier is always the narrow view.
  #
  # A fractional or negative value FAILS THE RENDER. The app would cast it with int() and fall
  # back to 60 with only a log line, leaving this file describing a cache that is not running.
  tierTtlSeconds: 60

  # THE ADMINISTRATOR THRESHOLD — the SubjectAccessReview a reader must pass to see
  # everything. Expressed as the check itself rather than a list of role names, because a
  # name list would miss cluster-reader and every custom role that grants the same read.
  #
  # Measured on the reference cluster, per role bound CLUSTER-WIDE:
  #
  #   check                                        admits
  #   list groups.user.openshift.io (default)      cluster-admin, cluster-reader
  #   list rolebindings.rbac.authorization.k8s.io  those two PLUS cluster-wide `admin`
  #   anything your own ClusterRole grants         whoever holds that role
  #
  # `edit` and `view` pass NO cluster-scoped list at all — bound cluster-wide they are
  # indistinguishable from a plain user here — and `cluster-edit`/`cluster-view` do not
  # exist as roles. If people holding edit/view must see everything, bind them a role that
  # grants the check above, or set enabled: false.
  adminSar:
    # "" means the core API group. No version suffix.
    apiGroup: user.openshift.io
    # Lowercase plural; resource/subresource (e.g. pods/log) is accepted.
    resource: groups
    verb: list
    # Empty means a cluster-scoped check — the normal case. Set a namespace only for a
    # threshold that is deliberately namespaced, e.g. get pods/log in
    # openshift-authentication, which cluster-wide admin/edit/view also pass.
    namespace: ""

  # THE USAGE TAB'S SECOND, STRICTER THRESHOLD — a SubjectAccessReview asked INDEPENDENTLY of
  # adminSar above, for the Usage tab alone. Everything else the wide tier serves can be
  # reproduced with `oc` by anyone holding the roles that pass adminSar (groups, bindings,
  # even the oauth-server logs behind Logins — cluster-reader holds get on pods/log). The
  # Usage tab cannot: it is who-opened-this-dashboard data, living only in the dashboard's own
  # SQLite. So it must not fall to the wide tier that cluster-reader — the deliberate AUDITOR
  # persona — also passes.
  #
  # Measured on the reference cluster, per role bound cluster-wide:
  #
  #   check                                              cluster-admin  cluster-reader  separates?
  #   list groups.user.openshift.io (adminSar default)   yes            yes             no
  #   list/read anything                                 yes            yes             no
  #   update clusterrolebindings (this default)          yes            NO              YES
  #   get secrets                                        yes            NO              YES
  #
  # No READ check can separate them, because cluster-reader is by construction "may read
  # everything". Only a write verb (or get secrets) does. `update clusterrolebindings` is
  # chosen over `get secrets` because it means "this person administers who has access", the
  # question actually being asked, and because secret-read is granted to non-admins in plenty
  # of organisations. THE DASHBOARD STILL NEVER WRITES: a SubjectAccessReview only ASKS whether
  # a subject could perform a verb; the app holds no write grant and this does not add one.
  #
  # If you want the Usage tab wide for everyone (the pre-existing behaviour), that is the blunt
  # override config.userActivity.visibility: all — it wins over this check. Same nil-safe and
  # exact-lowercase render guards as adminSar: a miscased field fails the render rather than
  # silently demoting every administrator.
  usageAdminSar:
    apiGroup: rbac.authorization.k8s.io
    resource: clusterrolebindings
    verb: update
    namespace: ""

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
# Both default OFF: they need the Prometheus Operator CRDs, and applying them where those
# CRDs are absent fails the install outright. On CRC monitoring is disabled at the CVO
# level, so they would be inert even if applied.
monitoring:
  serviceMonitor:
    enabled: false
    # 30s: every series is recomputed from SQLite on scrape and each scrape takes the
    # store's lock. Faster buys no resolution — the data only changes once per poll.
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

  prometheusRule:
    enabled: false
    labels: {}
    # Thresholds live here rather than inside the exporter, so they can be seen and tuned.
    # The metric is a unix timestamp, so the rule expresses staleness against real time.
    overdueSeconds: 7200      # GroupSync has not synced for this long
    # The dashboard itself has stopped polling. MUST stay above ~2x config.pollIntervalSeconds:
    # the normal gap between polls is one interval, so a threshold below it makes this alert
    # fire continuously, forever, on a perfectly healthy deployment. That is not theoretical
    # — it is what 600 would have done the moment the interval went to 900.
    notPollingSeconds: 600
    # MiB. 25% of the default 1Gi PVC — high enough that normal churn never fires it, low
    # enough to leave room to act before the volume fills. Raise it with persistence.size.
    walMiB: 256
    # Seconds without a successful oauth-log read before login capture counts as stalled.
    # Capture rides the poll thread, so this MUST stay well above config.pollIntervalSeconds
    # for the same reason notPollingSeconds must — below it, a healthy deployment alerts
    # forever. 1800 covers a 900s interval with one missed cycle of slack.
    captureStalledSeconds: 1800
    # Seconds since the newest backup file before the copy counts as stale. Two intervals
    # (config.backupIntervalHours, default 6h): one missed backup is a blip, two is a
    # broken mechanism — and this is the only protection for the data that cannot be
    # re-fetched from the cluster.
    backupStaleSeconds: 43200
    for:
      overdue: 10m
      dangling: 15m
      notPolling: 5m
      unreachable: 15m
      # Sustained, not a blip: one failed SubjectAccessReview round-trip self-heals on the
      # next request, and every failure already serves the (safe) self view. Fifteen
      # minutes of failures is every reader silently narrowed — that pages.
      visibilityFailing: 15m
      captureStalled: 15m
      # The staleness threshold above is already two backup intervals, so the for: only
      # needs to outlast a scrape gap.
      backupStale: 30m
      # Long, because a checkpoint legitimately lags behind a burst of reads. Only sustained
      # growth is the starvation case.
      walGrowing: 30m
      # WAL mode is decided once at startup and never changes, so this only needs long
      # enough to outlast a rollout.
      walDisabled: 10m
      # A config CR's reconcile is retried by its operator; a couple of minutes of failing
      # is a blip, sustained failure is stopped RBAC reconciliation.
      configError: 10m
      # Long: this is a migration backlog, not an incident. It should be visible and
      # tracked, never paging anyone at 3am.
      directUserGrants: 1h
