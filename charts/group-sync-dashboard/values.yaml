# Defaults reproduce exactly what is running today, so `helm install` with no overrides
# yields the deployment that was verified on the cluster. Everything below is here because
# it is plausibly environment-specific; anything genuinely invariant stays in the templates.

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  # repository and tag are written by local-development/build-and-push-external.sh, which
  # tags <version>-<git-sha>. Editing them by hand works, but the script keeps them
  # consistent with an image that actually exists in the registry.
  repository: quay.io/ephico2real/group-sync-dashboard
  tag: ""            # empty -> falls back to Chart.appVersion
  pullPolicy: Always

  # Only needed for a PRIVATE registry. Leave empty for a public repository: an empty
  # secret reference makes a pod fail to schedule rather than falling back to anonymous
  # pull, so it must be absent rather than blank.
  pullSecrets: []
  # pullSecrets:
  #   - name: quay-pull-secret

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Workload
# ---------------------------------------------------------------------------
# Keep at 1. The poller runs in-process and owns a SQLite file on a ReadWriteOnce volume,
# so a second replica means two pollers writing the same database. There is no leader
# election; raising this does not scale the dashboard, it corrupts it.
replicaCount: 1

# Recreate, not RollingUpdate, for the same reason: overlapping pods contend for the volume.
strategy: Recreate

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# ---------------------------------------------------------------------------
# Probes
# ---------------------------------------------------------------------------
# Neither probe is gated on a reachable cluster: an unreachable cluster is a thing this
# dashboard exists to DISPLAY, so failing a probe for one would take it down exactly when
# it has something to report.
#
# The 1s default timeout is deliberately not used. On a host that suspends and resumes,
# every in-flight probe fails with "context deadline exceeded" and liveness kills a healthy
# process — observed here, and it cascaded into a ~4h outage. Liveness is the more forgiving
# of the two because a failed readiness only removes the pod from the Service, while a
# failed liveness destroys in-flight state and forces an image re-pull.
probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
config:
  # PLAN §6 — 60x finer than the fastest schedule seen in practice.
  pollIntervalSeconds: 60

  # Slack before a CR is called late. Without it the state flaps every cycle: a sync lands
  # 3-14s after its cron minute and is observed up to a poll interval later, so a healthy
  # CR briefly exceeds one interval on EVERY pass.
  scheduleGraceSeconds: 120

  # Bindings are listed across every namespace, far more expensive than the two group
  # calls, and they change on administrative action rather than on a schedule. At 100x the
  # reference cluster a refresh is ~154 paged requests, so this is deliberately slower.
  bindingIntervalSeconds: 300

  requestTimeoutSeconds: 15

# DEBUG | INFO | WARNING | ERROR | CRITICAL.
# DEBUG adds per-poll timing, HTTP request lines, page counts and the countdown to the next
# binding refresh. Safe to leave on briefly; chatty at one line or more per poll per cluster.
logLevel: INFO

# Clusters to observe. The default observes the cluster the pod runs on, using its own
# projected ServiceAccount token — which kubelet rotates and the app re-reads every poll, so
# there is no long-lived credential to mint or expire.
#
# Adding entries here enables multi-cluster, but note the authorization caveat in
# docs/PLAN_oauth_proxy.md: OAuth authenticates against the HOSTING cluster only, so one
# instance holding several clusters' data can show a user membership from a cluster they
# have no rights on.
clusters:
  - name: crc-local
    apiUrl: https://kubernetes.default.svc
    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    caBundleFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    enabled: true

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
# The accumulated sync timeline and membership history are the ONLY things that cannot be
# re-fetched from the API (PLAN §2). An emptyDir would silently reset them on every restart,
# so persistence defaults to on.
persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  storageClass: ""     # "" -> cluster default
  existingClaim: ""    # set to reuse a claim instead of creating one

# ---------------------------------------------------------------------------
# RBAC
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # Creates a ClusterRole + binding granting get/list on groupsyncs, groups, rolebindings
  # and clusterrolebindings. No watch, no write verbs anywhere.
  create: true

  # RoleBindings/ClusterRoleBindings power the "Access granted" view and dangling-binding
  # detection. Disable to drop that grant; the dashboard degrades to group data only.
  bindings: true

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080

# Ingress, not Route. On OpenShift the ingress-to-route controller converts this into a
# Route automatically (ingressClassName: openshift-default), so one manifest serves both
# OpenShift and plain Kubernetes.
#
# WARNING: with oauthProxy.enabled=false there is NO authentication and the dashboard
# exposes group membership. Do not expose it on a shared cluster that way.
ingress:
  enabled: true
  className: openshift-default
  # REQUIRED when oauthProxy.enabled — the OAuth callback URL cannot be derived, because
  # ingress-to-route names the generated Route unpredictably. The render fails rather than
  # emitting a callback that silently never matches.
  host: ""
  annotations: {}
  tls: []
  # Carried as route.openshift.io annotations, since Ingress has no field for either.
  # Overridden to reencrypt automatically whenever the proxy is enabled.
  termination: edge
  insecureEdgeTerminationPolicy: Redirect

# ---------------------------------------------------------------------------
# OpenShift OAuth proxy
# ---------------------------------------------------------------------------
# Puts cluster login in front of the dashboard. Off by default so the chart installs
# anywhere; turn it on for any cluster where the Route is reachable by people other than
# you, because this exposes group membership.
#
# ACCESS MODEL: authentication, not authorization. Anyone who can log into the cluster can
# view. That is the documented default of the OpenShift provider ("defaults to allowing any
# user that can log into the OpenShift cluster"), and it is deliberate here — the dashboard
# shows nothing a user could not already read with `oc get groups`, so gating it behind an
# access request would add friction without adding protection. Set `sar` to restrict.
oauthProxy:
  enabled: false

  # The version-matched image that ships WITH the cluster, already present as an
  # imagestream and served from the internal registry — so starting a pod needs no external
  # registry, no pull secret, and no mirroring step.
  #
  # The `v4.4` tag name is misleading and worth not being fooled by: its digest is exactly
  # what `oc adm release info --image-for=oauth-proxy` returns for this cluster, i.e. it IS
  # the current 4.18 oauth-proxy. There is no v4.18 or v4.17 tag in registry.redhat.io —
  # both 404 — and that registry's `latest` is v4.14.0, a genuinely OLDER build than this.
  # oauth-proxy is a stable component and is not re-tagged per OpenShift release.
  #
  # Confirm the right image for any cluster with:
  #   oc adm release info --image-for=oauth-proxy
  #
  # Override for a disconnected cluster that mirrors elsewhere:
  #   --set oauthProxy.image=<your-mirror>/openshift4/ose-oauth-proxy:<tag>
  image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
  imagePullPolicy: IfNotPresent
  port: 8443

  # Cookie signing key. Leave empty and the chart generates one, then REUSES it across
  # upgrades by reading back the existing Secret. Generating inline in the container args
  # instead — as some examples do — silently regenerates on every `helm upgrade` and logs
  # every user out.
  cookieSecret: ""

  # Paths served without authentication. The health endpoints MUST be here or kubelet
  # probes receive a 302 to the login page and the pod is killed as unhealthy. /metrics is
  # included so a ServiceMonitor can scrape it; the exporter emits counts and states only,
  # never a group or user name, precisely because it is reachable unauthenticated.
  skipAuthRegex: "^/(healthz|readyz|metrics)$"

  # Empty means authentication only. To also require a permission, put a SubjectAccessReview
  # here, e.g. to admit only those who could read the underlying data anyway:
  #   sar: '{"resource":"groups","resourceAPIGroup":"user.openshift.io","verb":"list"}'
  sar: ""

  # Skips the interstitial page that offers exactly one login choice.
  skipProviderButton: true
  requestLogging: false

  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}

  # How the ServiceAccount advertises its callback URL.
  #   redirectreference — points at the Route by NAME and lets OpenShift resolve the host.
  #                       Correct when the Route host is generated rather than fixed.
  #   redirecturi       — a literal URL, which requires route.host to be set.
  redirectMode: redirectreference

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
# Both default OFF: they need the Prometheus Operator CRDs, and applying them where those
# CRDs are absent fails the install outright. On CRC monitoring is disabled at the CVO
# level, so they would be inert even if applied.
monitoring:
  serviceMonitor:
    enabled: false
    # 30s: every series is recomputed from SQLite on scrape and each scrape takes the
    # store's lock. Faster buys no resolution — the data only changes once per poll.
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

  prometheusRule:
    enabled: false
    labels: {}
    # Thresholds live here rather than inside the exporter, so they can be seen and tuned.
    # The metric is a unix timestamp, so the rule expresses staleness against real time.
    overdueSeconds: 7200      # GroupSync has not synced for this long
    notPollingSeconds: 600    # the dashboard itself has stopped polling
    for:
      overdue: 10m
      dangling: 15m
      notPolling: 5m
      unreachable: 15m
