# Defaults reproduce exactly what is running today, so `helm install` with no overrides
# yields the deployment that was verified on the cluster. Everything below is here because
# it is plausibly environment-specific; anything genuinely invariant stays in the templates.

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  # repository and tag are written by local-development/build-and-push-external.sh, which
  # tags <version>-<git-sha>. Editing them by hand works, but the script keeps them
  # consistent with an image that actually exists in the registry.
  repository: quay.io/ephico2real/group-sync-dashboard
  tag: "0.6.0-edcbf749ae"
  pullPolicy: Always

  # Only needed for a PRIVATE registry. Leave empty for a public repository: an empty
  # secret reference makes a pod fail to schedule rather than falling back to anonymous
  # pull, so it must be absent rather than blank.
  pullSecrets: []
  # pullSecrets:
  #   - name: quay-pull-secret

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Workload
# ---------------------------------------------------------------------------
# RECOMMENDED: 1.
#
# This polls every 60s and serves a handful of operators; it is not in anyone's request
# path. A node drain costs one missed poll, which the next one heals. What a second replica
# actually buys is HTTP uptime, and it pays for it in DIVERGENT HISTORY — each pod only has
# the timeline since its own database existed, so the Service answers "when did this user
# leave?" differently depending on which pod you reach. That history is the irreplaceable
# part; current state self-heals within one poll.
#
# If you do raise it, the chart switches GSD_DB_PATH to /data/$(POD_NAME)/gsd.db so each pod
# gets its OWN file. That is deliberate and not optional: SQLite WAL coordinates writers
# through an mmap'd -shm file that assumes all processes are on one host, so sharing a
# single file across a ReadWriteMany volume corrupts rather than errors. A shared VOLUME
# with unshared FILES is safe; a shared FILE is not.
#
# Requirements for >1: ReadWriteMany persistence, and leaderElection DISABLED — with
# per-pod databases a pod that lost the lease would stop polling while still serving reads
# from its own now-stale copy, which is worse than no election at all.
#
# Note a ReadWriteOnce PVC restricts to one NODE, not one pod, so several pods CAN share it
# if they land on the same node — but relying on that means pinning them there, and losing
# that node then loses every replica.
replicaCount: 1

# A PDB on one replica governs DRAINS, not availability — there is no second pod.
#   maxUnavailable: 1  the drain proceeds, the pod moves, one poll is missed (default)
#   minAvailable: 1    the drain BLOCKS indefinitely, because one replica can never satisfy
#                      it. Cluster admins hit this during maintenance and cannot see whose
#                      workload is stalling them. Only choose it if a human must be involved
#                      before this pod moves.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  minAvailable: ""     # set this INSTEAD of maxUnavailable to block drains

leaderElection:
  # Only the lease holder polls; every replica still serves the API and /metrics.
  #
  # BEST-EFFORT, not a write fence. Leadership is checked once before each poll cycle and
  # never again during it, so a pod that stalls after the check can lose the lease and
  # still finish its writes. Two pods can also both consider themselves leader briefly,
  # since expiry is judged against each pod's own clock. Treat this as reducing the
  # ordinary overlap cases, not as a guarantee that one process writes — the guarantee
  # comes from the deployment shape: one replica, Recreate, one database file.
  #
  # Worth leaving on even at one replica: `Recreate` is not instantaneous, `kubectl scale`
  # is one keystroke, and a partitioned node can leave an old pod running while a new one
  # starts. Each of those puts two pollers on one database.
  #
  # MUST be false above one replica, and the chart refuses to render otherwise. Each pod then
  # owns its own database file, so a pod that loses the lease would stop polling while still
  # serving reads from a copy that never updates again.
  enabled: true
  leaseName: group-sync-dashboard

# Empty derives it: Recreate at one replica, where overlapping pods would contend for the
# same database file, and RollingUpdate above one, where each pod owns its own file and
# Recreate would take the whole deployment down on every upgrade. Set it explicitly to
# override.
strategy: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# ---------------------------------------------------------------------------
# Probes
# ---------------------------------------------------------------------------
# Neither probe is gated on a reachable cluster: an unreachable cluster is a thing this
# dashboard exists to DISPLAY, so failing a probe for one would take it down exactly when
# it has something to report.
#
# The 1s default timeout is deliberately not used. On a host that suspends and resumes,
# every in-flight probe fails with "context deadline exceeded" and liveness kills a healthy
# process — observed here, and it cascaded into a ~4h outage. Liveness is the more forgiving
# of the two because a failed readiness only removes the pod from the Service, while a
# failed liveness destroys in-flight state and forces an image re-pull.
probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
config:
  # 60s. Measured on the reference cluster, one poll is TWO list calls — groupsyncs and
  # groups — because 62 groups fit in a single 500-item page. That is 2880 calls a day per
  # cluster, which is nothing, and it buys the thing this dashboard exists for.
  #
  # The precision argument, since it is the only one that matters here. A sync event
  # carries the operator's own lastSyncSuccessTime, so a slow poll delays when a sync is
  # NOTICED without distorting the recorded timeline. A MEMBERSHIP event has no upstream
  # timestamp — observed_at is ours — so the poll interval IS the error bar on "when did
  # this person lose access?". At 60s that is +/-1 minute; at 900s it was +/-15. Neither
  # loses the change; the slower one just cannot say when it happened. That history is the
  # irreplaceable part, so it gets the resolution.
  #
  # THREE VALUES ARE TIED TO THIS and move with it. Changing pollIntervalSeconds alone
  # breaks all three, and two fail loudly:
  #   * scheduleGraceSeconds below            (or every healthy CR flaps to `late`)
  #   * monitoring.prometheusRule.notPollingSeconds (or that alert fires forever)
  #   * bindingIntervalSeconds below          (or bindings refresh faster than groups)
  pollIntervalSeconds: 60

  # Slack before a CR is called late. Without it the state flaps every cycle: a sync lands
  # 3-14s after its cron minute and is observed up to a POLL INTERVAL later, so a healthy
  # CR briefly exceeds one interval on EVERY pass.
  #
  # Must stay above pollIntervalSeconds — the observation lag it absorbs IS the poll
  # interval. 120 = 60 for that lag plus a minute for scheduler latency.
  scheduleGraceSeconds: 120

  # Bindings are listed across every namespace, far more expensive than the two group
  # calls — ~154 paged requests at 100x the reference cluster — and they change on
  # administrative action rather than on a schedule, so minute-level freshness buys
  # nothing. Deliberately slower than the group poll, which means it moves when the group
  # poll moves, or the expensive call becomes the frequent one.
  bindingIntervalSeconds: 300

  requestTimeoutSeconds: 15

  # SQLite locking. The defaults are tested; change them only for a diagnosed problem.
  sqlite:
    # How long a write waits for a lock another CONNECTION holds before giving up. SQLite's
    # own default is 0 — it raises "database is locked" instantly, with no retry — and that
    # default is the usual cause of the error. The collision this covers is the `Recreate`
    # rollover, where the outgoing pod still holds the lock as the incoming one opens the
    # file. Threads inside one pod are already serialised and never reach this.
    busyTimeoutMs: 5000
    # Deliberately shorter than the writer's: /readyz performs a read and the probe gives up
    # at 5s, so a reader inheriting 5000 would turn contention into a restarted pod.
    readerBusyTimeoutMs: 2000
    # NORMAL is the documented companion to WAL — a power loss can lose the last commits but
    # cannot corrupt the file, and what is lost is one poll of history that the next poll
    # largely re-derives. FULL fsyncs every commit of a 50k-row refresh instead.
    synchronous: NORMAL
    # Truncate the write-ahead log once it passes this size. Checkpointing yields to open
    # readers, so a steady read load can starve it and the WAL grows until the VOLUME fills
    # while the database file itself stays small. Watch gsd_sqlite_wal_bytes.
    walCheckpointMb: 8

  # Periodic backup of the accumulated sync and membership history.
  #
  # THIS IS THE ONLY EXISTENTIAL RISK IN THE SYSTEM. Everything else the dashboard stores
  # is a cache that the next poll re-fetches; the history exists only because this process
  # observed it, and nothing upstream can replay it. Until this existed, a corrupted or
  # deleted PVC lost it outright.
  #
  # VACUUM INTO, not a file copy: it takes a read transaction for the duration, so the
  # output is consistent even while the poller writes. Copying gsd.db with a live WAL
  # produces a torn file that opens without complaint and is missing the newest commits —
  # a backup that restores, which is the worst kind.
  #
  # HALF AN ANSWER BY DESIGN. These land on the SAME volume they protect against, so they
  # cover corruption, a bad migration and accidental deletion — not loss of the volume.
  # Ship them off it with a CronJob mounting the same PVC read-only; the dashboard
  # deliberately does not grow credentials for object storage.
  backup:
    enabled: true
    dir: /data/backup
    intervalHours: 6
    keep: 4     # 4 x 6h = the last day, at roughly the size of the database each

  # Audit stamping of unmanaged grants — THE DASHBOARD'S ONLY WRITE TO ANY CLUSTER.
  # Design and invariants: docs/unmanaged-audit-design.md. When enabled, bindings the
  # dashboard classifies `unmanaged` (hand-made grant on an operator-synced group, outside
  # the policy system) are stamped ON THE OBJECT:
  #   label       rbac.ocp.io/unmanaged=true            <- selectable:
  #                 oc get rolebindings,clusterrolebindings -A -l rbac.ocp.io/unmanaged=true
  #   annotation  rbac.ocp.io/unmanaged-detected-at     <- first detection, never rewritten
  #   annotation  rbac.ocp.io/unmanaged-detected-by
  # The label is REMOVED when the binding stops being unmanaged (adopted by the policy
  # system, or acknowledged with rbac.ocp.io/unmanaged-exception); the annotations stay as
  # the audit trail.
  #
  # THE COST, PLAINLY: Kubernetes has no annotations-only patch scope, so `annotate` mode
  # grants the ServiceAccount `patch` on rolebindings/clusterrolebindings — a verb that
  # could modify what a binding grants. The application only ever touches its own three
  # metadata keys, but the GRANT is broader than the use, and a compromised pod could
  # abuse it. Hence: default off; the RBAC grant is rendered ONLY in annotate mode; and
  # `log` mode computes and logs the full plan with zero write access — run that first
  # and read the plan before flipping to annotate.
  unmanagedAudit:
    mode: "off"        # off | log | annotate  (anything else is treated as off)
    # At most this many stamps per 300s refresh; healing is never capped. Bounds a
    # misclassification bug to one screenful of objects per cycle instead of the cluster.
    maxPerCycle: 20

  # Who used the dashboard. Requires oauthProxy.enabled — with the proxy off there is no
  # authentication, X-Forwarded-User would be whatever the caller typed, and recording it
  # would manufacture an audit trail rather than keep one. Nothing is recorded in that mode
  # no matter what `enabled` says here.
  #
  # AGGREGATED, one row per user per UTC day: first seen, last seen, request count. It is
  # deliberately not a page-view log. That bounds the table at users x days instead of
  # growing without limit, and it answers "who uses this and when" without accumulating a
  # record of which colleague read whose group membership. Read it at
  # /api/dashboard/activity, or watch gsd_dashboard_active_users.
  #
  # NOTE this cannot see logins. The proxy owns the session; the app only ever observes
  # requests that are already authenticated, so there is no login or logout event to
  # record and "session" here means the first-to-last-seen window on a given day.
  #
  # WHO CAN READ IT — `visibility` below. Default `self`: each user sees only their own
  # row. This response is identifiable personnel data (who was present, on which days,
  # between which times, how often), and the argument that carries the rest of this
  # dashboard — "you could read the groups with oc anyway" — is true of group membership
  # and false of who looked at it. It previously returned everyone to everyone.
  #
  # ABOVE ONE REPLICA it is per-pod, like the rest of the history: each pod counts only the
  # requests it served, into its own database. gsd_dashboard_active_users is then a per-pod
  # figure and summing it double-counts anyone who hit more than one pod.
  userActivity:
    enabled: true
    # self | all.
    #   self  each authenticated user sees only their own activity (default)
    #   all   everyone sees everyone — the pre-existing behaviour, now an explicit choice
    # Anything else is treated as `self`: an unrecognised value must never be the one that
    # widens access to a personnel dataset.
    #
    # There is deliberately no "admins only" tier. Doing that properly means a
    # SubjectAccessReview from the app against the Kubernetes API on every read, which
    # makes a personal-data query depend on API-server availability. If you need it,
    # oauthProxy.sar already restricts the WHOLE dashboard to a group you choose.
    visibility: self
    # Requests are buffered in memory and written once per interval. A write per request
    # would put every API call behind the SQLite writer lock, contending with the poll's
    # bulk write — the latency the WAL work exists to prevent. The cost is that an
    # ungraceful kill loses up to this many seconds of counts; a graceful one flushes.
    flushSeconds: 60
    # Aggregation already bounds the table, so this is a backstop for a long-lived
    # deployment rather than the growth control a request log would need. 0 disables it.
    retentionDays: 400

# DEBUG | INFO | WARNING | ERROR | CRITICAL.
# DEBUG adds per-poll timing, HTTP request lines, page counts and the countdown to the next
# binding refresh. Safe to leave on briefly; chatty at one line or more per poll per cluster.
logLevel: INFO

# Clusters to observe. The default observes the cluster the pod runs on, using its own
# projected ServiceAccount token — which kubelet rotates and the app re-reads every poll, so
# there is no long-lived credential to mint or expire.
#
# Adding entries here enables multi-cluster, but note the authorization caveat in
# docs/PLAN_oauth_proxy.md: OAuth authenticates against the HOSTING cluster only, so one
# instance holding several clusters' data can show a user membership from a cluster they
# have no rights on.
clusters:
  - name: crc-local
    apiUrl: https://kubernetes.default.svc
    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    caBundleFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    enabled: true

# ---------------------------------------------------------------------------
# ArgoCD / GitOps
# ---------------------------------------------------------------------------
# Adds Argo-specific annotations. Off by default because they are inert noise when you are
# not running GitOps, and misleading metadata is worse than none.
#
# Two distinct problems, both of which cost you data or sleep if unhandled:
#
# 1. PRUNING THE PVC. Argo deletes what leaves the source, and cascades on Application
#    delete. That volume holds the accumulated sync timeline and membership history, which
#    the Kubernetes API cannot reproduce — so a routine prune destroys the only
#    irreplaceable state in the system. `helm.sh/resource-policy: keep` does NOT help here:
#    Argo does not run Helm's uninstall path, it reconciles manifests.
#
# 2. THE INJECTED CA ConfigMap. The chart ships it EMPTY and OpenShift writes
#    `data.ca-bundle.crt` into it. Argo sees live data the manifest lacks, reports
#    OutOfSync permanently, and with self-heal on will WIPE the CA bundle the pod depends
#    on — turning every external cluster unreachable on a sync.
argocd:
  enabled: false

  # Prune=false     — not removed when it leaves the source
  # Delete=false    — not removed when the Application itself is deleted (cascade)
  # PruneLast=true  — if ever pruned deliberately, it goes after the workload, so the pod is
  #                   not left running with its volume pulled out from under it
  preservePVC: true

  # NOTE: `compare-options: IgnoreExtraneous` is deliberately NOT used here. Per the ArgoCD
  # docs it is for resources NOT declared in git — ones "generated by a tool" — and applying
  # it to a resource the Application itself creates defeats the purpose of tracking
  # deployment state. Binding drift on the PVC is handled with ignoreDifferences on the
  # Application instead; see the chart README.

  # ServerSideApply lets the operator keep ownership of the fields it writes. It reduces the
  # fight but does not end it: Argo still diffs the data it does not know about, so the
  # Application ALSO needs an ignoreDifferences entry. See the chart README — the chart
  # cannot set that, because it lives on the Application, not on the resource.
  serverSideApplyInjectedCA: true

# ---------------------------------------------------------------------------
# Trusted CA bundle (for EXTERNAL clusters)
# ---------------------------------------------------------------------------
# Creates an empty ConfigMap labelled `config.openshift.io/inject-trusted-cabundle: "true"`,
# which OpenShift fills with the system trust store merged with the corporate CA from
# proxy/cluster.spec.trustedCA, and mounts it.
#
# Needed because an external cluster's API server is usually signed by a corporate CA that
# is not in Python's default trust store. Without it, verification fails and the cluster
# renders as unreachable — a TLS problem that looks like an outage.
#
# Used only as a FALLBACK: a cluster entry naming its own caBundleFile keeps it, because
# that is a specific statement about what it trusts.
#
# Harmless when observing only the local cluster (the SA's own ca.crt is named explicitly),
# so it defaults on. Set false on non-OpenShift, where nothing injects it.
trustedCA:
  # METHOD 1 — injected. An empty ConfigMap labelled
  # `config.openshift.io/inject-trusted-cabundle: "true"`, which OpenShift fills with the
  # system trust store merged with proxy/cluster.spec.trustedCA. Nothing to maintain, but
  # it only carries CAs the CLUSTER already knows about.
  injected:
    enabled: true

  # METHOD 2 — a ConfigMap you supply. For a CA the cluster has not been told about: a
  # partner's internal CA, a lab signer, or an external cluster whose CA is not in your
  # corporate bundle. Create it yourself, out of band:
  #
  #   oc create configmap enterprise-ca --from-file=ca-bundle.crt=/path/to/ca.pem \
  #     -n <namespace>
  #
  # Deliberately NOT templated into the chart: certificates in values.yaml end up in git,
  # in `helm get values`, and in every CI log that echoes them.
  existingConfigMap:
    enabled: false
    name: enterprise-ca
    key: ca-bundle.crt

  # BOTH may be enabled at once. They are concatenated into one bundle at startup, in the
  # order injected-then-manual, because a bundle is just a list of PEM blocks and there is
  # no reason to make the operator choose. Enabling neither falls back to Python's default
  # trust store.
  mountPath: /etc/pki/ca-trust/extracted/pem

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
# The accumulated sync timeline and membership history are the ONLY things that cannot be
# re-fetched from the API (PLAN §2). An emptyDir would silently reset them on every restart,
# so persistence defaults to on.
persistence:
  enabled: true
  size: 1Gi
  # ReadWriteMany, so the volume never has to be recreated to scale and so it works on the
  # shared storage most clusters actually provide.
  #
  # This trades away an ENFORCED guarantee for an advisory one, and that is worth knowing.
  # ReadWriteOncePod makes two pods on one database structurally impossible — the scheduler
  # refuses the second. RWX does not: nothing stops two pods mounting this volume. At one
  # replica they would share a single /data/gsd.db, which is the case SQLite must not be in.
  # Three things keep that from happening, none of them enforced by storage:
  #   * strategy Recreate at one replica, so the outgoing pod is gone before the incoming one
  #     starts (this is why the derived strategy matters more under RWX than it did before),
  #   * leader election, so only the lease holder polls, and
  #   * config.sqlite.busyTimeoutMs, so a rollover overlap waits for the lock instead of
  #     failing on it.
  # Above one replica the shared-file problem disappears anyway: each pod gets its own
  # /data/$POD_NAME/gsd.db.
  #
  # WATCH THE FILESYSTEM UNDERNEATH. RWX in practice usually means NFS, and SQLite refuses
  # WAL there — it coordinates through an mmap'd -shm file that assumes one host. The switch
  # fails SILENTLY and readers then block on every write. The chart reads the mode back and
  # alerts on it (GroupSyncDashboardWalDisabled, gsd_sqlite_wal_enabled); do not ignore it.
  # Block storage or a CSI RWX filesystem with real POSIX locking is fine. NFS/EFS/SMB is not.
  #
  # Set ReadWriteOncePod to get the enforced single-pod guarantee back at one replica.
  # Empty derives it: ReadWriteMany above one replica, ReadWriteOncePod at one.
  accessMode: ReadWriteMany
  storageClass: ""     # "" -> cluster default
  existingClaim: ""    # set to reuse a claim instead of creating one

# ---------------------------------------------------------------------------
# RBAC
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # Creates a ClusterRole + binding granting get/list on groupsyncs, groups, rolebindings
  # and clusterrolebindings. No watch, no write verbs anywhere.
  create: true

  # RoleBindings/ClusterRoleBindings power the "Access granted" view and dangling-binding
  # detection. Disable to drop that grant; the dashboard degrades to group data only.
  bindings: true

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080

# Ingress, not Route. On OpenShift the ingress-to-route controller converts this into a
# Route automatically (ingressClassName: openshift-default), so one manifest serves both
# OpenShift and plain Kubernetes.
#
# WARNING: with oauthProxy.enabled=false there is NO authentication and the dashboard
# exposes group membership. Do not expose it on a shared cluster that way.
ingress:
  enabled: true
  className: openshift-default
  # Leave empty and it is derived as <fullname>-<namespace>.<cluster apps domain>, read from
  # the cluster's ingresses.config/cluster object.
  #
  # It cannot simply be omitted: a Route auto-generates its host, but an Ingress does not,
  # and OpenShift's ingress-to-route controller silently creates NO Route for a hostless
  # Ingress. That made a default install unreachable with nothing reporting an error — the
  # Ingress existed, the pod was healthy, and no Route was ever created.
  host: ""
  annotations: {}
  tls: []
  # Carried as route.openshift.io annotations, since Ingress has no field for either.
  # Overridden to reencrypt automatically whenever the proxy is enabled.
  termination: edge
  insecureEdgeTerminationPolicy: Redirect

# ---------------------------------------------------------------------------
# OpenShift OAuth proxy
# ---------------------------------------------------------------------------
# Puts cluster login in front of the dashboard. Off by default so the chart installs
# anywhere; turn it on for any cluster where the Route is reachable by people other than
# you, because this exposes group membership.
#
# ACCESS MODEL: authentication, not authorization. Anyone who can log into the cluster can
# view. That is the documented default of the OpenShift provider ("defaults to allowing any
# user that can log into the OpenShift cluster"), and it is deliberate here — the dashboard
# shows nothing a user could not already read with `oc get groups`, so gating it behind an
# access request would add friction without adding protection. Set `sar` to restrict.
oauthProxy:
  enabled: false

  # The version-matched image that ships WITH the cluster, already present as an
  # imagestream and served from the internal registry — so starting a pod needs no external
  # registry, no pull secret, and no mirroring step.
  #
  # The `v4.4` tag name is misleading and worth not being fooled by: its digest is exactly
  # what `oc adm release info --image-for=oauth-proxy` returns for this cluster, i.e. it IS
  # the current 4.18 oauth-proxy. There is no v4.18 or v4.17 tag in registry.redhat.io —
  # both 404 — and that registry's `latest` is v4.14.0, a genuinely OLDER build than this.
  # oauth-proxy is a stable component and is not re-tagged per OpenShift release.
  #
  # Confirm the right image for any cluster with:
  #   oc adm release info --image-for=oauth-proxy
  #
  # Override for a disconnected cluster that mirrors elsewhere:
  #   --set oauthProxy.image=<your-mirror>/openshift4/ose-oauth-proxy:<tag>
  image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
  imagePullPolicy: IfNotPresent
  port: 8443

  # Cookie signing key. Leave empty and the chart generates one, then REUSES it across
  # upgrades by reading back the existing Secret. Generating inline in the container args
  # instead — as some examples do — silently regenerates on every `helm upgrade` and logs
  # every user out.
  cookieSecret: ""

  # Paths served without authentication. The health endpoints MUST be here or kubelet
  # probes receive a 302 to the login page and the pod is killed as unhealthy. /metrics is
  # included so a ServiceMonitor can scrape it; the exporter emits counts and states only,
  # never a group or user name, precisely because it is reachable unauthenticated.
  skipAuthRegex: "^/(healthz|readyz|metrics)$"

  # Empty means authentication only. To also require a permission, put a SubjectAccessReview
  # here, e.g. to admit only those who could read the underlying data anyway:
  #   sar: '{"resource":"groups","resourceAPIGroup":"user.openshift.io","verb":"list"}'
  sar: ""

  # The interstitial page that offers exactly one login choice.
  #
  # true skips it and redirects straight to the cluster's OAuth server. That is one fewer
  # click, but when anything goes wrong mid-flow the first thing a user sees is the proxy's
  # own error page — headed "403 Permission Denied", which reads as "you are not allowed
  # in" rather than "your session expired, sign in again". Observed on this deployment:
  # a rollout landed between the redirect and the callback, the CSRF cookie no longer
  # matched, and the 403 page was indistinguishable from a permissions failure.
  #
  # false shows an explicit Log In button instead. One extra click, and the unauthenticated
  # state is a page that says sign in.
  skipProviderButton: false
  requestLogging: false

  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}

  # How the ServiceAccount advertises its callback URL.
  #   redirectreference — points at the Route by NAME and lets OpenShift resolve the host.
  #                       Correct when the Route host is generated rather than fixed.
  #   redirecturi       — a literal URL, which requires route.host to be set.
  redirectMode: redirectreference

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
# Both default OFF: they need the Prometheus Operator CRDs, and applying them where those
# CRDs are absent fails the install outright. On CRC monitoring is disabled at the CVO
# level, so they would be inert even if applied.
monitoring:
  serviceMonitor:
    enabled: false
    # 30s: every series is recomputed from SQLite on scrape and each scrape takes the
    # store's lock. Faster buys no resolution — the data only changes once per poll.
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

  prometheusRule:
    enabled: false
    labels: {}
    # Thresholds live here rather than inside the exporter, so they can be seen and tuned.
    # The metric is a unix timestamp, so the rule expresses staleness against real time.
    overdueSeconds: 7200      # GroupSync has not synced for this long
    # The dashboard itself has stopped polling. MUST stay above ~2x config.pollIntervalSeconds:
    # the normal gap between polls is one interval, so a threshold below it makes this alert
    # fire continuously, forever, on a perfectly healthy deployment. That is not theoretical
    # — it is what 600 would have done the moment the interval went to 900.
    notPollingSeconds: 600
    # MiB. 25% of the default 1Gi PVC — high enough that normal churn never fires it, low
    # enough to leave room to act before the volume fills. Raise it with persistence.size.
    walMiB: 256
    for:
      overdue: 10m
      dangling: 15m
      notPolling: 5m
      unreachable: 15m
      # Long, because a checkpoint legitimately lags behind a burst of reads. Only sustained
      # growth is the starvation case.
      walGrowing: 30m
      # WAL mode is decided once at startup and never changes, so this only needs long
      # enough to outlast a rollout.
      walDisabled: 10m
      # A config CR's reconcile is retried by its operator; a couple of minutes of failing
      # is a blip, sustained failure is stopped RBAC reconciliation.
      configError: 10m
