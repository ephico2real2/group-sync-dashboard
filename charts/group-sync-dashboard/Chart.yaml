apiVersion: v2
name: group-sync-dashboard
description: Read-only observability for the redhat-cop group-sync-operator
type: application

# version  — the CHART version, bumped when templates or defaults change. It is also what
#            gates publishing: chart-releaser skips a version it has already released, so a
#            chart change without a bump here publishes NOTHING and still reports success.
#            .github/workflows/helm.yaml warns when that is about to happen.
#
#            BUMPED BY HAND, IN THE PR THAT CHANGES THE CHART. It was briefly automated —
#            publish.yml's pin commit bumped the patch on every image build — and that automation
#            is gone with the pin commit it existed to publish. `Chart changes bump the chart
#            version` in ci.yml is the enforcement now: a PR touching charts/ that does not move
#            this line fails. Nothing writes to this file except a human in a reviewed change.
#
#            So every component means what it says again: MAJOR and MINOR for behaviour, PATCH for
#            a fix or a defaults change. A patch bump is no longer noise from a build.
#
# appVersion — the application version, and it must equal local-development/pyproject.toml's
#              `version`. That file is the single source of truth: build-and-push-external.sh
#              reads it to build the image tag <version>-<git-sha>, which is then written into
#              values.yaml's image.tag. appVersion sits OUTSIDE that chain, which is exactly
#              how it rotted — it read 0.5.2 while the app had been 0.6.0 for weeks and the
#              deployed image said so, so a consumer reading appVersion learned a version that
#              had not shipped in a long time. tests/test_chart_versions.py now holds the two
#              together, and holds appVersion against the pinned image tag's prefix.
# 0.3.0 rather than 0.2.1, because the templates changed BEHAVIOUR and not just wording: the new
# `gsd.logLevel` helper refuses a render that 0.2.0 accepted. `logLevel: Trace` (OpenShift's
# vocabulary, an easy thing to reach for) used to template happily and crash-loop the pod at
# startup; it now fails at `helm template`. That is the improvement, and it is exactly the kind of
# change a consumer should be told about by the version rather than discover in a pipeline.
#
# WHY THIS BUMP IS NOT OPTIONAL. chart-releaser skips a version it has already released, so the
# three template changes that merged in #27 published NOTHING and the run still went green —
# measured: the release run for d62a92d concluded `success` while the Helm repo kept serving 0.2.0
# from 2026-08-10T16:52. Anyone installing from the published repo was getting a chart without the
# guard, so `logLevel: debug` still crash-looped their pod even though main was fixed.
# 0.4.0, and a MINOR bump because this one changes behaviour on upgrade for a release that never
# set `visibility.adminSar` explicitly. The wide-tier threshold's default moves from
# `list groups.user.openshift.io` to `list clusterrolebindings` — cluster-wide RBAC read.
#
# For stock roles nothing changes: measured per persona with their real group memberships, both
# thresholds admit cluster-admin and cluster-reader and refuse everyone else. What changes is the
# cluster this default was wrong for — one whose custom or aggregated role grants directory read
# WITHOUT RBAC read. There, a reader entitled only to read the directory was being served the whole
# RBAC binding surface, including which groups hold cluster-admin. On upgrade that reader correctly
# loses the wide tier, and their Overview / Access granted / RBAC policy tabs become named refusals.
#
# So: a silent tightening for the clusters that need it, a no-op for the rest, and the old values
# remain settable explicitly. values.yaml under visibility.adminSar carries the measurement.
# 0.5.0, and a MINOR bump because this changes what an upgrade DEPLOYS for anyone who never set
# image.tag. The chart shipped a pinned <appVersion>-<sha>; it now ships an empty tag and resolves
# appVersion through gsd.image. So the first upgrade onto this chart moves a release from a fixed
# image reference to the appVersion alias — the same application version, but no longer byte-pinned,
# and with pullPolicy Always that is re-resolved on every container creation. A consumer must learn
# that from the version rather than discover it on a node drain.
#
# Pin deliberately if you need byte-identical rollbacks:
#   --set image.tag=0.7.0-db8a90510f
# values.yaml under `image` carries the full reasoning, and
# docs/DESIGN_decouple_chart_and_app_release.md carries the review that settled it.
# 0.6.0, MINOR because it adds a value rather than changing one. `image.digest` gives consumers an
# immutable pin — a tag is a name the registry owner can repoint, a digest is the content itself —
# and it wins over `image.tag`. Nothing changes for a release that does not set it: the default is
# empty and the tag/appVersion path is byte-identical to 0.5.0's.
version: 0.6.0
# 0.7.0. It must equal local-development/pyproject.toml's `version` (tests/test_chart_versions.py
# holds them together, and holds appVersion against the pinned image tag's prefix), so moving it
# means moving the app version AND re-pinning the image — all three land in one commit or CI is red,
# which is the whole point of the coupling.
#
# The deferred decision recorded here since #27 is taken: the self-tier projection removes
# `ldap_filter` and `error_message` from /groupsyncs for narrowed readers, so a self-tier consumer
# parsing either one breaks on upgrade. That is a contract change, hence MINOR and not a patch.
# Administrators are unaffected, byte-for-byte.
appVersion: "0.7.0"

keywords: [openshift, ldap, rbac, groupsync, observability]
home: https://github.com/ephico2real2/group-sync-dashboard
sources:
  - https://github.com/ephico2real2/group-sync-dashboard
maintainers:
