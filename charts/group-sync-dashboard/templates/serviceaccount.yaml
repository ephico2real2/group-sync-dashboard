{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gsd.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- if .Values.oauthProxy.enabled }}
    {{- /*
    Makes the ServiceAccount itself an OAuth client — no OAuthClient object to register or
    keep in sync.

    redirectURI, not redirectREFERENCE: the reference form points at a Route by NAME, and
    with an Ingress the Route is generated with a random suffix (observed on this cluster:
    probe-ingress-7669p), so the name cannot be known at template time. gsd.externalHost
    fails the render when the host is unset rather than emitting a callback URL that
    silently never matches.
    */}}
    serviceaccounts.openshift.io/oauth-redirecturi.primary: 'https://{{ include "gsd.externalHost" . }}/oauth/callback'
    {{- end }}
{{- end }}
