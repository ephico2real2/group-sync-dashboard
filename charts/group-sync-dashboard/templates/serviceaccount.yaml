{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gsd.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- if .Values.oauthProxy.enabled }}
    {{- /*
    This annotation is what makes the ServiceAccount itself an OAuth client — no OAuthClient
    object to register or keep in sync.

    redirectreference points at the Route by NAME and lets OpenShift resolve the host, which
    is the only form that works when the Route host is generated. A literal redirecturi
    needs route.host set, so it is refused below rather than silently producing a callback
    URL that never matches.
    */}}
    {{- if eq .Values.oauthProxy.redirectMode "redirectreference" }}
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ include "gsd.fullname" . }}"}}'
    {{- else }}
    {{- if not .Values.route.host }}
    {{- fail "oauthProxy.redirectMode=redirecturi requires route.host to be set; use redirectreference for a generated host" }}
    {{- end }}
    serviceaccounts.openshift.io/oauth-redirecturi.primary: 'https://{{ .Values.route.host }}/oauth/callback'
    {{- end }}
    {{- end }}
{{- end }}
