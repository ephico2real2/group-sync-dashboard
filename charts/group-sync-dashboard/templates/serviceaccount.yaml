{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gsd.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.argocd.enabled }}
    {{- /*
    OpenShift injects `.secrets`, `.imagePullSecrets` and an
    openshift.io/internal-registry-pull-secret-ref annotation into every ServiceAccount, none
    of which exist in git. Under a client-side apply Argo compares its rendered manifest to
    the live object, sees three fields it did not write, and reports the Application
    permanently OutOfSync — so a real drift, when it happens, arrives in a list that is
    already red and gets ignored.

    Server-side apply addresses the cause rather than suppressing the symptom. SSA merges by
    field ownership, so fields this chart never claims are left alone instead of pruned.
    MEASURED on this cluster: `managedFields` shows
    openshift.io/image-registry-pull-secrets_service-account-controller owning `secrets` and
    `imagePullSecrets` via Apply while Helm owns only metadata, and
    `oc apply --server-side --dry-run=server` on the rendered ServiceAccount returns both
    fields intact.

    INFERRED, not observed: that Argo reaches the same result by computing its predicted-live
    state through an SSA dry-run. That is its documented behaviour, but it could not be
    checked here — this cluster has the Argo CRDs and no controller. The Application should
    therefore ALSO carry ignoreDifferences for these fields (see the chart README); that half
    holds whatever Argo's diff strategy turns out to be.
    */}}
    argocd.argoproj.io/sync-options: ServerSideApply=true
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- if .Values.oauthProxy.enabled }}
    {{- /*
    Makes the ServiceAccount itself an OAuth client — no OAuthClient object to register or
    keep in sync.

    redirectURI, not redirectREFERENCE: the reference form points at a Route by NAME, and
    with an Ingress the Route is generated with a random suffix (observed on this cluster:
    probe-ingress-7669p), so the name cannot be known at template time. gsd.externalHost
    fails the render when the host is unset rather than emitting a callback URL that
    silently never matches.
    */}}
    serviceaccounts.openshift.io/oauth-redirecturi.primary: 'https://{{ include "gsd.externalHost" . }}/oauth/callback'
    {{- end }}
{{- end }}
