# The dashboard's ServiceAccount. Two annotations, both conditional, both with a reason that
# is longer than the line they produce — so the reasons live here and the manifest below
# stays readable.
#
# ---------------------------------------------------------------------------------------
# serviceaccounts.openshift.io/oauth-redirectreference.primary  (oauthProxy.enabled, route.enabled)
# serviceaccounts.openshift.io/oauth-redirecturi.primary        (oauthProxy.enabled, otherwise)
# ---------------------------------------------------------------------------------------
# Either one makes the ServiceAccount itself an OAuth client, so there is no OAuthClient
# object to register or keep in sync. Which one depends on what exposes the dashboard:
#
# Route (default) -> redirectREFERENCE, naming the chart's own Route. The chart names that
#   Route (like the Service: <fullname>), so the reference is exact, and OpenShift resolves it
#   at login time against the host the Route's status reports — "all Ingresses for that route
#   will now be considered valid", per the platform docs. No host is needed at template time,
#   which is why the chart renders under ArgoCD with no cluster (see route.yaml), and it holds
#   whether the host was router-named or set deliberately in route.host. This is also the
#   annotation openshift/oauth-proxy's own contrib/sidecar.yaml ships.
#
#   WHY /oauth/callback MATCHES A REFERENCE THAT RESOLVES TO https://<host>. The OAuth
#   server's rule, from the Red Hat documentation of OAuth clients (redirectURIs): "The
#   redirect_uri parameter specified in requests to <namespace_route>/oauth/authorize and
#   <namespace_route>/oauth/token must be equal to or prefixed by one of these URIs." A
#   service-account client is such a client, and the reference form's own docs say "all
#   Ingresses for that route will now be considered valid". In code (openshift/osin
#   urivalidate.go) an exact path match or a strict sub-path of the base is accepted, same
#   scheme and host required. Red Hat's own Jenkins template relies on exactly this: its SA
#   references a hostless Route and the login plugin calls back on /securityRealm/finishLogin.
#   Measured here too — the proxy's authorize request was accepted, and the same request with
#   a foreign host was refused 400 invalid_request.
#
# Ingress, or nothing -> redirectURI, a literal https://<host>/oauth/callback. The reference
#   form points at a Route by NAME, and with an Ingress the Route is generated with a random
#   suffix — observed on this cluster as probe-ingress-7669p — so the name cannot be known at
#   template time. gsd.externalHost fails the render when the host is unset rather than
#   emitting a callback URL that silently never matches, which would present as a broken login
#   with nothing wrong in any object.
#
# ---------------------------------------------------------------------------------------
# argocd.argoproj.io/sync-options: ServerSideApply=true   (when argocd.enabled)
# ---------------------------------------------------------------------------------------
# OpenShift injects `.secrets`, `.imagePullSecrets` and an
# openshift.io/internal-registry-pull-secret-ref annotation into every ServiceAccount, none
# of which exist in git. Under a client-side apply Argo compares its rendered manifest to the
# live object, sees three fields it did not write, and reports the Application permanently
# OutOfSync — so real drift, when it happens, arrives in a list that is already red.
#
# Server-side apply addresses the cause rather than suppressing the symptom: SSA merges by
# field ownership, so fields this chart never claims are left alone instead of pruned.
#
# MEASURED on this cluster — `managedFields` on the live ServiceAccount:
#     openshift.io/image-registry-pull-secrets_service-account-controller
#         operation=Apply    owns: secrets, imagePullSecrets, metadata
#     helm
#         operation=Update   owns: metadata
#   and `oc apply --server-side --dry-run=server` on the rendered ServiceAccount returns both
#   fields intact, with and without --force-conflicts.
#
# INFERRED, not observed: that Argo reaches the same result by computing its predicted-live
# state through an SSA dry-run. That is its documented behaviour, but it could not be checked
# here — this cluster has the Argo CRDs installed and no controller running. So the
# Application must ALSO carry ignoreDifferences for these fields (see the chart README);
# that half holds whatever Argo's diff strategy turns out to be.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gsd.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.argocd.enabled }}
    argocd.argoproj.io/sync-options: ServerSideApply=true
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- if .Values.oauthProxy.enabled }}
    {{- if eq (include "gsd.exposure" .) "Route" }}
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ include "gsd.fullname" . }}"}}'
    {{- else }}
    serviceaccounts.openshift.io/oauth-redirecturi.primary: 'https://{{ include "gsd.externalHost" . }}/oauth/callback'
    {{- end }}
    {{- end }}
{{- end }}
