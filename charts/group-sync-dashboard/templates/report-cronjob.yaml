{{- if eq (include "gsd.reportingEnabled" .) "true" }}
{{- range $s := .Values.reporting.schedules }}
---
# One CronJob per reporting.schedules[] entry: the report image's trigger module POSTs a run with
# the service token and waits, so the Job's status IS the run's status. The schedule is
# cluster-agnostic (#149 R1): the service resolves every enabled cluster from its snapshot and the
# Job waits for all of them; `cluster:` pins one. Formats default by origin in the service (R3:
# html+json for a schedule); `formats:` overrides. `enabled: false` keeps the CronJob and suspends
# it (R4) — definition, history and audit stay, nothing fires.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "gsd.reportName" $ }}-{{ $s.name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "gsd.reportScheduleLabels" $ | nindent 4 }}
spec:
  schedule: {{ $s.schedule | quote }}
  # The literal word false, not Go-template truthiness: a quoted "false" or --set-string is a
  # non-empty, truthy string, and `not` would leave a paused schedule firing (the window's own
  # scar, P4 C6/F3; review of PR #220).
  {{- if and (hasKey $s "enabled") (eq (toString $s.enabled) "false") }}
  suspend: true
  {{- end }}
  {{- $window := ($.Values.reporting | default dict).window | default dict }}
  {{- if eq (include "gsd.reportWindowEnabled" $) "true" }}
  # Fire the cron in the reporting window's zone so its schedule times land INSIDE the window; without
  # this Kubernetes interprets the cron in the controller's timezone and every run is 409-skipped
  # (design §5). GA on Kubernetes 1.27 / OpenShift ~4.14; silently pruned on older, where the cron
  # falls back to the controller's timezone.
  timeZone: {{ $window.timezone | default $.Values.timezone | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # Never retried by Kubernetes: a retry pod would POST the whole fan-out again after a 202 and
      # render every cluster twice. A failed run is failed; the next fire is the retry. The trigger
      # repeats, in-process, only a POST that never reached the service (review of PR #220).
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            # NOT gsd.selectorLabels and NOT gsd.reportSelectorLabels: neither Service may pick
            # this pod up. The NetworkPolicy admits it by instance + component.
            app.kubernetes.io/name: {{ include "gsd.name" $ }}-report-schedule
            app.kubernetes.io/instance: {{ $.Release.Name }}
            app.kubernetes.io/component: report-schedule
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "gsd.reportName" $ }}
          automountServiceAccountToken: false
          {{- with $.Values.image.pullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: trigger
              image: {{ include "gsd.reportImage" $ }}
              imagePullPolicy: {{ $.Values.reporting.image.pullPolicy }}
              command:
                - python3.14
                - -m
                - gsd.reporting.trigger
                - --url
                - {{ include "gsd.reportUrl" $ }}
                - --report
                - {{ $s.report | quote }}
                {{- with $s.cluster }}
                - --cluster
                - {{ . | quote }}
                {{- end }}
                - --schedule
                - {{ $s.name | quote }}
                - --wait
                # sized from the Job's deadline, with a minute for the pod to start and report: the wait is
                # N × render on one worker for a fan-out, and a timeout is a failed Job with no duplicate
                - --timeout
                - "840"
                {{- with ($s.params | default dict) }}
                - --params-json
                - {{ toJson . | quote }}
                {{- end }}
                {{- range $f := ($s.formats | default list) }}
                {{- if ne (toString $f) "json" }}
                # json is always written; the trigger's --format takes html and pdf only
                - --format
                - {{ $f | quote }}
                {{- end }}
                {{- end }}
                {{- if $.Values.reporting.tls.enabled }}
                - --ca-file
                - /etc/gsd/service-ca/service-ca.crt
                {{- end }}
              env:
                - name: GSD_REPORT_TOKEN_FILE
                  value: /etc/gsd/report/token
              securityContext: {{- toYaml $.Values.securityContext | nindent 16 }}
              volumeMounts:
                - name: report-token
                  mountPath: /etc/gsd/report
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                {{- if $.Values.reporting.tls.enabled }}
                - name: service-ca
                  mountPath: /etc/gsd/service-ca
                  readOnly: true
                {{- end }}
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
          volumes:
            - name: report-token
              secret:
                secretName: {{ include "gsd.reportName" $ }}-shared-token
                defaultMode: 288
            - name: tmp
              emptyDir: {}
            {{- if $.Values.reporting.tls.enabled }}
            - name: service-ca
              configMap:
                name: openshift-service-ca.crt
            {{- end }}
{{- end }}
{{- end }}
