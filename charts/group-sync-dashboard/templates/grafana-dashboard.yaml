{{- /*
Grafana dashboard, delivered the way Grafana sidecars expect it: a ConfigMap carrying the
`grafana_dashboard: "1"` label (kube-prometheus-stack, the community OpenShift Grafana
deployments, and grafana-operator v5's sidecar mode all watch for it). grafana-operator v5
can also point a GrafanaDashboard CR at this ConfigMap by name (spec.configMapRef): that CR is
rendered below on request (monitoring.grafanaDashboard.cr.enabled, #161) and stays off by
default, because a ConfigMap is a core resource that cannot fail an install or an Argo dry-run
while the CR needs its CRD before the release renders.

THE JSON IS A PLAIN FILE, loaded with .Files.Get, and that placement is load-bearing. Helm
runs the template engine over templates/ only; a file read with .Files.Get is returned
verbatim, so the Grafana templating the JSON carries — $cluster, ${DS_PROMETHEUS},
$__rate_interval, and {{cluster}} legend formats — is never mistaken for a Helm action. The
same JSON inlined in this file would fail the render on its first `{{`.

Embedded as a literal block scalar. YAML clip chomping keeps exactly one final newline in the
parsed value, so the ConfigMap value is byte-identical to the file with either `{{ end }}` or
`{{- end }}` at the close (measured in review, PR #74); the untrimmed form is kept because the
generated YAML reads better. tests/test_chart_grafana_dashboard.py holds the identity against a
real `helm template`.

DEFAULT FOLLOWS THE SERVICEMONITOR (values.yaml, monitoring.grafanaDashboard.enabled: "").
A board over metrics nobody scrapes is a wall of "No data", and "one switch turns
monitoring on" is the contract the README documents.
*/ -}}
{{- if eq (include "gsd.grafanaDashboardEnabled" .) "true" }}
{{- /* Nil-safe: `--set monitoring.grafanaDashboard=null` (or a values file that omits the map) must
       follow the ServiceMonitor, not die on `.labels` of nil (found in review, PR #74). */ -}}
{{- $dashboard := .Values.monitoring.grafanaDashboard | default dict }}
{{- $labels := $dashboard.labels | default dict }}
{{- $annotations := $dashboard.annotations | default dict }}
{{- $json := .Files.Get "dashboards/group-sync-dashboard.json" }}
{{- if not $json }}
{{- fail "dashboards/group-sync-dashboard.json is missing from the chart package; monitoring.grafanaDashboard cannot render" }}
{{- end }}
{{- /* Extra labels are for a sidecar that watches a DIFFERENT key. A colliding grafana_dashboard would
       overwrite the convention value below (last key wins) and the sidecar would silently ignore the
       ConfigMap — a board that exists, looks right, and never appears (found in review, PR #74). */ -}}
{{- if hasKey $labels "grafana_dashboard" }}
{{- fail "monitoring.grafanaDashboard.labels must not set grafana_dashboard: the chart writes grafana_dashboard: \"1\" for the sidecar convention; add a different key for a sidecar that watches a non-default label" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gsd.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gsd.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with $labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- if or $dashboard.folder $annotations }}
  annotations:
    {{- with $dashboard.folder }}
    # Read only when the sidecar is configured with folderAnnotation=grafana_folder (and, in
    # kube-prometheus-stack, provider.foldersFromFilesStructure); a Grafana without that ignores it.
    grafana_folder: {{ . | quote }}
    {{- end }}
    {{- with $annotations }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- end }}
data:
  group-sync-dashboard.json: |
{{ $json | indent 4 }}
{{- /*
The GrafanaDashboard CR (#161), only when monitoring.grafanaDashboard.cr.enabled: grafana-operator v5
reads the ConfigMap above through configMapRef and applies the board to the instance the selector
names, with the DS_PROMETHEUS input bound to the datasource's UID (the operator substitutes the
value verbatim into the panels' uid fields; a name resolves in the browser only). A separate document rather than
a mode of the ConfigMap: the ConfigMap is a core resource that cannot fail an install; the CR needs
its CRD first (the openshift-grafana chart ships it under crds/).
*/ -}}
{{- $cr := ($dashboard.cr | default dict) }}
{{- /* Only where the cluster serves the CRD: .Capabilities.APIVersions is the live API on install and
       upgrade (and the --api-versions list under helm template / Argo CD's render), so a default
       install on a cluster with no grafana-operator renders no CR and cannot fail on an unknown kind;
       the next upgrade after the operator lands renders it. */ -}}
{{- if and $cr.enabled (.Capabilities.APIVersions.Has "grafana.integreatly.org/v1beta1") }}
{{- /* The operator refuses a datasources[] entry whose datasourceName is empty ("invalid datasource
       input rule ... input or datasource empty", content/resolver.go) and the board never appears; an
       empty selector with allowCrossNamespaceImport matches EVERY Grafana on the cluster. Both refuse
       the render instead. */ -}}
{{- if not $cr.datasource }}
{{- fail "monitoring.grafanaDashboard.cr.datasource must name the datasource's uid (the openshift-grafana chart's is openshift-thanos): grafana-operator rejects a GrafanaDashboard whose DS_PROMETHEUS binding is empty" }}
{{- end }}
{{- if not ($cr.instanceSelector | default dict) }}
{{- fail "monitoring.grafanaDashboard.cr.instanceSelector must name the Grafana instance's labels (the openshift-grafana chart's is app.kubernetes.io/instance: <its release>): an empty selector would apply the board to every Grafana the operator can see" }}
{{- end }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "gsd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gsd.labels" . | nindent 4 }}
spec:
  allowCrossNamespaceImport: {{ $cr.allowCrossNamespaceImport | default false }}
  resyncPeriod: {{ $cr.resyncPeriod | default "10m" | quote }}
  instanceSelector:
    matchLabels:
      {{- toYaml ($cr.instanceSelector | default dict) | nindent 6 }}
  configMapRef:
    name: {{ include "gsd.fullname" . }}-grafana-dashboard
    key: group-sync-dashboard.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: {{ $cr.datasource | quote }}
{{- end }}
{{- end }}
