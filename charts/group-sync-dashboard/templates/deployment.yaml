{{- if and (gt (int .Values.replicaCount) 1) .Values.leaderElection.enabled }}
{{- fail "replicaCount > 1 requires leaderElection.enabled=false. Above one replica each pod keeps its OWN database (/data/$POD_NAME/gsd.db), so every pod must poll for itself. With election on, the pods that lose the lease stop polling but KEEP SERVING reads from their own database, which then goes stale and never recovers — worse than no election at all. Set leaderElection.enabled=false, or return to replicaCount: 1." }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) .Values.persistence.enabled (ne (include "gsd.accessMode" .) "ReadWriteMany") }}
{{- fail "replicaCount > 1 requires a ReadWriteMany volume. Leave persistence.accessMode empty to derive it, or set it explicitly. ReadWriteOnce binds to one NODE and ReadWriteOncePod to one POD, so under either the extra replicas stay Pending forever with no error on the Deployment itself." }}
{{- end }}
{{- /*
ONE guard for RollingUpdate, not two. A second guard keyed on accessMode=ReadWriteOncePod
was strictly worse than useless: every unsafe combination it caught is caught here too (at
one replica this fires for EVERY access mode; above one replica the guard above already
demands ReadWriteMany), while the only cases it uniquely caught were SAFE — persistence
disabled, where each pod gets its own emptyDir and an overlapping rollout cannot collide.
It refused those renders with a message about a volume that did not exist.
*/}}
{{- if and (eq (int .Values.replicaCount) 1) .Values.persistence.enabled (eq (toString .Values.strategy) "RollingUpdate") }}
{{- fail "strategy=RollingUpdate is unsafe at replicaCount 1 with persistence enabled, whatever the access mode. RollingUpdate starts the incoming pod BEFORE terminating the outgoing one, and at one replica both use /data/gsd.db — two processes on one SQLite file, which corrupts rather than errors because WAL coordinates through an mmap'd -shm file that assumes a single host. The guard above catches only ReadWriteOncePod, where the scheduler refuses the second pod anyway; the DEFAULT ReadWriteMany happily mounts twice and was therefore the dangerous case, not the protected one. Use Recreate, or leave strategy empty to derive it. Above one replica RollingUpdate is correct and stays allowed, because each pod owns /data/$POD_NAME/gsd.db." }}
{{- end }}
{{- if and (eq (include "gsd.idleTimeoutEnabled" .) "true") (not .Values.oauthProxy.enabled) }}
{{- fail "session.idleTimeout.enabled=true requires oauthProxy.enabled=true. The idle timeout ends a proxy session by sending the browser to the proxy's sign_out; with no proxy there is no session to end and the countdown would be theatre." }}
{{- end }}
{{- if and (eq (include "gsd.idleTimeoutEnabled" .) "true") .Values.oauthProxy.enabled }}
{{- $idle := mul (include "gsd.idleTimeoutMinutes" . | int) 60 }}
{{- $cap := include "gsd.durationSeconds" (include "gsd.cookieExpire" .) }}
{{- if and (ne $cap "-1") (ge $idle (int $cap)) }}
{{- fail (printf "session.idleTimeout.minutes (%d minutes) is not shorter than oauthProxy.cookie.expire (%s = %s seconds), so the idle timeout could never fire: the absolute cap ends every session first. Lower the minutes or raise the cap." (include "gsd.idleTimeoutMinutes" . | int) (include "gsd.cookieExpire" .) $cap) }}
{{- end }}
{{- end }}
{{- if and (eq (include "gsd.visibilityEnabled" .) "true") (not .Values.oauthProxy.enabled) }}
{{- fail "visibility.enabled=true requires oauthProxy.enabled=true. The per-user tiers scope data to X-Forwarded-User, which is trustworthy only when the oauth-proxy sets it; with the proxy off the header is whatever the caller typed, so the control cannot work. Turn the proxy on, or set visibility.enabled=false to accept — deliberately and on the record — that every reader of an unauthenticated route sees everything." }}
{{- end }}
{{- if .Values.oauthProxy.enabled }}
{{- $cookie := (.Values.oauthProxy | default dict).cookie | default dict }}
{{- /*
Refuse at render time what the proxy would refuse at startup. Its refusal is a crash-looping
sidecar with the reason buried in `oc logs` while `helm upgrade` reports success, which is the
worst of both worlds: the release says deployed and nobody can log in.

`dig` is avoided on purpose throughout — it panics on an intermediate that EXISTS AND IS NIL,
which is exactly what a values file produces when somebody comments out the keys under
`cookie:`. Measured: "interface conversion: interface {} is nil, not map[string]interface {}".
*/}}
{{- $expire := include "gsd.cookieExpire" . }}
{{- if eq (toString $expire) "0" }}
{{- fail "oauthProxy.cookie.expire is 0: a zero cap is not a cap — the proxy would expire every session at once. Use a Go duration such as 4h; the default is 4h." }}
{{- end }}
{{- if eq (include "gsd.durationSeconds" $expire) "-1" }}
{{- /*
toString before %q, because a values file may carry an unquoted number and Helm types it as an
integer — %q on an int64 renders it as a Unicode RUNE, so `expire: 14400` produced a message
about the character 㡀 and told the operator nothing about what they typed.
*/}}
{{- fail (printf "oauthProxy.cookie.expire %q is not a Go duration the proxy can parse. Use forms like 4h, 90m or 1h30m. A bare number has no unit and is refused, and so is a spelled-out one. The proxy would reject this at startup and crash-loop, with helm reporting a successful upgrade." (toString $expire)) }}
{{- end }}
{{- if $cookie.refresh }}
{{- fail "oauthProxy.cookie.refresh has been removed and must not be set. Measured on provider=openshift: the proxy's refresh-time revalidation sends the token as a QUERY PARAMETER to /apis/user.openshift.io/v1/users/~, the API server ignores it and answers 403 naming the caller system:anonymous, so -cookie-refresh force-clears every session at the interval instead of sliding it. Kibana, the shipped precedent for this sidecar on this provider, sets -cookie-expire and no -cookie-refresh. Remove the key: the absolute cap is oauthProxy.cookie.expire." }}
{{- end }}
{{- if and (not .Values.oauthProxy.logoutUrl) (not (contains "signed-out" .Values.oauthProxy.skipAuthRegex)) }}
{{- fail (printf "oauthProxy.skipAuthRegex (%s) no longer covers /signed-out while oauthProxy.logoutUrl is empty, so the logout landing page sits BEHIND the proxy it is supposed to land outside of: the redirect from sign_out starts a fresh OAuth flow and the reader who clicked Sign out arrives back signed in. Either keep signed-out in the regex, or point oauthProxy.logoutUrl somewhere outside the proxy." .Values.oauthProxy.skipAuthRegex) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gsd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- /*
    Recreate exists for the single-replica case, where the outgoing and incoming pods would
    otherwise contend for the same database file. Above one replica each pod owns its own
    file, so that reason is gone — and keeping Recreate there would take EVERY replica down
    at once on each upgrade, removing the availability that was the only point of scaling.
    */}}
    type: {{ .Values.strategy | default (ternary "RollingUpdate" "Recreate" (gt (int .Values.replicaCount) 1)) }}
  selector:
    matchLabels: {{- include "gsd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- /* A podLabels key that is also a selector label would win by YAML last-key-wins and
               change the pod's identity: the API server then rejects the Deployment (template
               labels outside its selector), and the PDB and Service would match no pod. Refuse it
               by name rather than reorder the includes, which would discard the operator's label
               silently (review of chart 0.14.0, second pass). */}}
        {{- range $k, $_ := .Values.podLabels }}
        {{- if hasKey (include "gsd.selectorLabels" $ | fromYaml) $k }}
        {{- fail (printf "podLabels must not set %q: it is one of the selector labels the Service, the PodDisruptionBudget and the Deployment select the pod by" $k) }}
        {{- end }}
        {{- end }}
        {{- include "gsd.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Restart the pod when the config changes. Without this a `helm upgrade` that only
        # alters intervals or the cluster list updates the ConfigMap and changes nothing,
        # because the running process read it at startup.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "gsd.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "gsd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.oauthProxy.enabled }}
          # Bind loopback only. Otherwise 8080 stays reachable pod-network-wide and anything
          # inside the cluster can skip the proxy entirely by addressing the pod directly,
          # which would make the authentication decorative.
          command:
            - python3.14
            - -m
            - uvicorn
            - gsd.api:create_app
            - --factory
            - --host
            - 127.0.0.1
            - --port
            - "8080"
            - --workers
            - "1"
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GSD_CONFIG
              value: /etc/gsd/clusters.yaml
            # MUST STAY ABOVE GSD_DB_PATH. Kubernetes expands `$(VAR)` only against
            # variables defined EARLIER in this list — "an environment variable is not
            # considered defined if it is specified further down the list" — and an
            # unresolved reference is left as the literal string without blocking startup.
            # With POD_NAME below, the per-pod path above one replica resolved to the
            # literal /data/$(POD_NAME)/gsd.db: the SAME directory in every replica, on the
            # ReadWriteMany volume, which is exactly the shared SQLite file the per-pod path
            # exists to prevent. It fails silently, because the container starts fine.
            #
            # Also makes the Lease name the actual pod holding it, which is the first thing
            # you want when asking "which replica is writing?".
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GSD_DB_PATH
              {{- if gt (int .Values.replicaCount) 1 }}
              # PER-POD database file. Multiple replicas must NOT share one SQLite file:
              # WAL coordinates writers through an mmap'd -shm file that assumes all
              # processes are on ONE host, so sharing it across a ReadWriteMany volume
              # corrupts rather than errors. A shared VOLUME with unshared FILES is safe.
              #
              # The cost is that accumulated history is per-pod: each replica only has the
              # timeline since its own database existed, so the Service will show different
              # history depending on which pod answers. Current state self-heals within one
              # poll; history does not.
              value: /data/$(POD_NAME)/gsd.db
              {{- else }}
              value: /data/gsd.db
              {{- end }}
            # Through the helper, not the raw value: an unrecognised level does not degrade to a
            # default, it raises inside the uvicorn factory and the container never starts. The
            # helper refuses the render instead, and normalises case so `debug` is not an outage.
            - name: GSD_LOG_LEVEL
              value: {{ include "gsd.logLevel" . | quote }}
            # The view-restrictions switch rides the Deployment rather than the ConfigMap:
            # one wire from one values key, visible in `oc describe deploy` where an
            # auditor looks for a security control. The NAME is load-bearing — the app
            # reads exactly GSD_ENABLE_VIEW_RESTRICTIONS and defaults to restricted, so a
            # misspelling anywhere is simply never read and cannot turn the control off.
            - name: GSD_ENABLE_VIEW_RESTRICTIONS
              value: {{ include "gsd.visibilityEnabled" . | quote }}
            {{- with .Values.timezone }}
            # Log timestamps only — see values.yaml. Stored and served times stay UTC
            # because every call in the app is datetime.now(UTC), so this cannot shift data.
            - name: TZ
              value: {{ . | quote }}
            {{- end }}
            {{- $ca := list }}
            {{- if .Values.trustedCA.injected.enabled }}
            {{- $ca = append $ca (printf "%s/injected/ca-bundle.crt" .Values.trustedCA.mountPath) }}
            {{- end }}
            {{- if .Values.trustedCA.existingConfigMap.enabled }}
            {{- $ca = append $ca (printf "%s/enterprise/%s" .Values.trustedCA.mountPath .Values.trustedCA.existingConfigMap.key) }}
            {{- end }}
            {{- if $ca }}
            # Colon-separated, like SSL_CERT_FILE. Used for any cluster that does not name
            # its own caBundleFile — the normal case for an external, corporate-signed one.
            - name: GSD_TRUSTED_CA_FILE
              value: {{ join ":" $ca | quote }}
            {{- end }}
            # For curl IN THE POD, which reads none of the above: it trusts the image's own
            # system bundle (/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem, measured) and
            # would refuse a corporate-signed URL that the application itself verifies fine.
            #
            # curl is told through ITS OWN configuration file, not through environment
            # variables. CURL_HOME names the directory curl reads .curlrc from; the ConfigMap
            # mounted there (configmap-curlrc.yaml) carries `capath` for the hashed directory
            # and, when the injected bundle is on, `cacert` for it. Measured on curl 7.76 and
            # 8.22: when CURL_CA_BUNDLE is set, curl IGNORES SSL_CERT_DIR — `-v` names only the
            # CAfile — so the earlier pair of variables could never make curl trust a hashed
            # CA while the injected bundle was on, which is the default. A .curlrc names both
            # and curl uses both (`-v` shows CAfile and CApath). Nothing but the curl tool
            # reads it: the application's own TLS is untouched, and so is Python's.
            - name: CURL_HOME
              value: /etc/curl
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gsd
              readOnly: true
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem is on, so anything writing to /tmp needs a volume.
            - name: tmp
              mountPath: /tmp
            # curl's configuration (see CURL_HOME above): a ConfigMap of one key, mounted as a
            # directory so curl finds $CURL_HOME/.curlrc.
            - name: curlrc
              mountPath: /etc/curl
              readOnly: true
            {{- if .Values.trustedCA.injected.enabled }}
            - name: trusted-ca-injected
              mountPath: {{ .Values.trustedCA.mountPath }}/injected
              readOnly: true
            {{- end }}
            {{- if .Values.trustedCA.existingConfigMap.enabled }}
            - name: trusted-ca-enterprise
              mountPath: {{ .Values.trustedCA.mountPath }}/enterprise
              readOnly: true
            {{- end }}
            {{- with .Values.trustedCA.existingConfigMap.subjectHash }}
            {{- if not $.Values.trustedCA.existingConfigMap.enabled }}
            {{- fail "trustedCA.existingConfigMap.subjectHash is set but trustedCA.existingConfigMap.enabled is false — there is no ConfigMap to mount" }}
            {{- end }}
            {{- if not (regexMatch "^[0-9a-f]{8}(\\.[0-9]+)?$" .) }}
            {{- fail (printf "trustedCA.existingConfigMap.subjectHash %q is not an OpenSSL subject hash (eight lowercase hex digits from `openssl x509 -noout -subject_hash -in ca.crt`, optionally followed by .N)" .) }}
            {{- end }}
            # The same CA a second time, as an entry in OpenSSL's hashed directory (Hummingbird's
            # "Approach 2" for Python images): curl reads it through SSL_CERT_DIR above, urllib
            # and the application's fallback context read it as OpenSSL's default capath. A
            # subPath mount of ONE file, never the directory — mounting the directory would hide
            # the base's ~290 hashed links to the public CAs. It does shadow the one entry of the
            # same name if the base already has it, which is why the value may carry OpenSSL's
            # collision suffix (`c275f070.1`): `.0` is assumed when none is given. subPath mounts
            # do not follow later ConfigMap edits; a changed CA needs a rollout, which a hand-made
            # ConfigMap needs anyway. The hash cannot be computed at render time, hence the value.
            - name: trusted-ca-enterprise
              mountPath: /etc/pki/tls/certs/{{ . }}{{ if not (contains "." .) }}.0{{ end }}
              subPath: {{ $.Values.trustedCA.existingConfigMap.key }}
              readOnly: true
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              {{- if .Values.oauthProxy.enabled }}
              # Through the proxy, over HTTPS: the app no longer listens on the pod IP.
              # oauthProxy.skipAuthRegex must cover this path or kubelet gets a 302 to the
              # login page and kills a healthy pod.
              # NUMERIC, not the port name. A named port resolves only within the
              # container that declares it, and this probe runs on the dashboard container
              # while the name belongs to the sidecar. kubelet then parses the name as an
              # integer and every probe errors with `strconv.Atoi: parsing "oauth-proxy"`.
              # Both `helm template` and `oc apply --dry-run=server` accept it, so only a
              # real deploy catches this.
              port: {{ .Values.oauthProxy.port }}
              scheme: HTTPS
              {{- else }}
              port: http
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              {{- if .Values.oauthProxy.enabled }}
              # NUMERIC, not the port name. A named port resolves only within the
              # container that declares it, and this probe runs on the dashboard container
              # while the name belongs to the sidecar. kubelet then parses the name as an
              # integer and every probe errors with `strconv.Atoi: parsing "oauth-proxy"`.
              # Both `helm template` and `oc apply --dry-run=server` accept it, so only a
              # real deploy catches this.
              port: {{ .Values.oauthProxy.port }}
              scheme: HTTPS
              {{- else }}
              port: http
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.oauthProxy.enabled }}
        - name: oauth-proxy
          image: {{ .Values.oauthProxy.image }}
          imagePullPolicy: {{ .Values.oauthProxy.imagePullPolicy }}
          args:
            - -provider=openshift
            - -https-address=:{{ .Values.oauthProxy.port }}
            - -http-address=
            - -email-domain=*
            - -upstream=http://127.0.0.1:8080
            - -tls-cert=/etc/tls/private/tls.crt
            - -tls-key=/etc/tls/private/tls.key
            - -cookie-secret-file=/etc/proxy/secrets/session_secret
            # The absolute session cap, from oauthProxy.cookie.expire. The SAME helper feeds
            # the ConfigMap the app reads, so the number the page can report is the number
            # the proxy enforces, by construction. Deliberately NO -cookie-refresh: measured
            # on this provider it force-clears the session at every interval rather than
            # sliding it (values.yaml carries the measurement), and the shipped Kibana proxy
            # omits it on this same provider too.
            - -cookie-expire={{ include "gsd.cookieExpire" . }}
            # NO -pass-access-token, and the reason is worth keeping. It was added so
            # sign-out could revoke the user's token the way the OpenShift console does, and
            # that was MEASURED FAILING on the lab: the console's logout works because the
            # console's tokens carry scope ["user:full"], while this chart's client is a
            # ServiceAccount and its tokens carry ["user:info","user:check-access"] — neither
            # of which permits deleting anything, so the DELETE returned 403 however the RBAC
            # was set. (`oc auth can-i delete oauthaccesstokens` answers yes and is misleading
            # here: a SubjectAccessReview never sees the token's SCOPE, which is a separate and
            # narrower gate applied at request time.) Widening -scope to user:full would make
            # revocation work by handing this app a credential that can act as the user
            # anywhere on the cluster — a strictly worse trade than not revoking, since the
            # session already ends without it: measured on the lab, the proxy's own sign_out
            # clears the cookie and re-entry demands credentials.
            #
            # The prefix everything the proxy serves lives under. Passed explicitly so the
            # app can compose its sign-out link from the same value instead of hardcoding
            # "/oauth" and drifting from it.
            - -proxy-prefix={{ .Values.oauthProxy.proxyPrefix }}
            # Where the browser lands after the proxy clears its cookie. Relative by default,
            # so it resolves against whichever host served the redirect.
            - -logout-url={{ .Values.oauthProxy.logoutUrl | default "/signed-out" }}
            - -openshift-service-account={{ include "gsd.serviceAccountName" . }}
            # The ServiceAccount CA signs the INTERNAL API endpoint (https://172.31.0.1), which
            # is all the proxy needs for OAuth discovery. It does NOT sign the PUBLIC OAuth
            # route, and the proxy talks to both.
            - -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            #
            # The OAuth ROUTE, which the SA CA above does not cover. On a cluster whose *.apps
            # wildcard is signed by an internal CA, login returned 500 with a healthy pod:
            #
            #   oauthproxy.go:661 error redeeming code: Post ".../oauth/token":
            #       x509: certificate signed by unknown authority
            #
            # Discovery succeeded and the code exchange failed, which locates it exactly:
            # discovery goes to the in-cluster API address, then RETURNS the public issuer, so
            # the exchange hits the ingress-served route and a CA the SA bundle lacks.
            #
            # -openshift-ca "may be given multiple times" (its own --help). Passing any value
            # replaces the default, so the SA path above must stay explicit. Same bundles the
            # dashboard trusts; they previously reached only GSD_TRUSTED_CA_FILE.
            #
            {{- if .Values.trustedCA.injected.enabled }}
            - -openshift-ca={{ .Values.trustedCA.mountPath }}/injected/ca-bundle.crt
            {{- end }}
            {{- if .Values.trustedCA.existingConfigMap.enabled }}
            - -openshift-ca={{ .Values.trustedCA.mountPath }}/enterprise/{{ .Values.trustedCA.existingConfigMap.key }}
            {{- end }}
            - -skip-auth-regex={{ .Values.oauthProxy.skipAuthRegex }}
            {{- if .Values.oauthProxy.sar }}
            - -openshift-sar={{ .Values.oauthProxy.sar }}
            {{- end }}
            {{- if .Values.oauthProxy.apiTokenAccess.enabled }}
            - -openshift-delegate-urls={{ .Values.oauthProxy.apiTokenAccess.delegateUrls }}
            {{- end }}
            {{- if .Values.oauthProxy.skipProviderButton }}
            - -skip-provider-button
            {{- end }}
            - -request-logging={{ .Values.oauthProxy.requestLogging }}
          ports:
            - name: oauth-proxy
              containerPort: {{ .Values.oauthProxy.port }}
              protocol: TCP
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: oauth-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-cookie
              mountPath: /etc/proxy/secrets
              readOnly: true
            #
            # The same volumes the dashboard mounts. They already existed at pod level; only
            # this container lacked them. Must stay paired with the -openshift-ca paths above:
            # the proxy does NOT fail on a CA path it cannot read — verified by pointing it at
            # a nonexistent file, which left the pod Running 2/2 and logged nothing — so a
            # mount removed here goes unnoticed until a login fails on a real cluster.
            #
            {{- if .Values.trustedCA.injected.enabled }}
            - name: trusted-ca-injected
              mountPath: {{ .Values.trustedCA.mountPath }}/injected
              readOnly: true
            {{- end }}
            {{- if .Values.trustedCA.existingConfigMap.enabled }}
            - name: trusted-ca-enterprise
              mountPath: {{ .Values.trustedCA.mountPath }}/enterprise
              readOnly: true
            {{- end }}
          resources: {{- toYaml .Values.oauthProxy.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gsd.fullname" . }}-config
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "gsd.fullname" .)) }}
        {{- else }}
          # WARNING: the accumulated timeline and membership history reset on every restart.
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: curlrc
          configMap:
            name: {{ include "gsd.fullname" . }}-curlrc
        {{- if .Values.trustedCA.injected.enabled }}
        - name: trusted-ca-injected
          configMap:
            name: {{ include "gsd.fullname" . }}-trusted-ca
            # optional: the operator populates this shortly after creation, and a pod that
            # refused to start until then would fail the first rollout of every install.
            optional: true
        {{- end }}
        {{- if .Values.trustedCA.existingConfigMap.enabled }}
        - name: trusted-ca-enterprise
          configMap:
            # NOT optional: you named this explicitly, so its absence is a mistake worth
            # failing on rather than silently starting without the CA you asked for.
            name: {{ .Values.trustedCA.existingConfigMap.name }}
        {{- end }}
        {{- if .Values.oauthProxy.enabled }}
        - name: oauth-tls
          secret:
            secretName: {{ include "gsd.fullname" . }}-tls
            defaultMode: 420
        - name: oauth-cookie
          secret:
            secretName: {{ include "gsd.fullname" . }}-oauth-cookie
            defaultMode: 420
        {{- end }}
