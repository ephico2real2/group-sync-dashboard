apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gsd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy }}
  selector:
    matchLabels: {{- include "gsd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gsd.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Restart the pod when the config changes. Without this a `helm upgrade` that only
        # alters intervals or the cluster list updates the ConfigMap and changes nothing,
        # because the running process read it at startup.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "gsd.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "gsd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.oauthProxy.enabled }}
          # Bind loopback only. Otherwise 8080 stays reachable pod-network-wide and anything
          # inside the cluster can skip the proxy entirely by addressing the pod directly,
          # which would make the authentication decorative.
          command:
            - python3.11
            - -m
            - uvicorn
            - gsd.api:create_app
            - --factory
            - --host
            - 127.0.0.1
            - --port
            - "8080"
            - --workers
            - "1"
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GSD_CONFIG
              value: /etc/gsd/clusters.yaml
            - name: GSD_DB_PATH
              value: /data/gsd.db
            - name: GSD_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gsd
              readOnly: true
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem is on, so anything writing to /tmp needs a volume.
            - name: tmp
              mountPath: /tmp
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              {{- if .Values.oauthProxy.enabled }}
              # Through the proxy, over HTTPS: the app no longer listens on the pod IP.
              # oauthProxy.skipAuthRegex must cover this path or kubelet gets a 302 to the
              # login page and kills a healthy pod.
              port: oauth-proxy
              scheme: HTTPS
              {{- else }}
              port: http
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              {{- if .Values.oauthProxy.enabled }}
              port: oauth-proxy
              scheme: HTTPS
              {{- else }}
              port: http
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.oauthProxy.enabled }}
        - name: oauth-proxy
          image: {{ .Values.oauthProxy.image }}
          imagePullPolicy: {{ .Values.oauthProxy.imagePullPolicy }}
          args:
            - -provider=openshift
            - -https-address=:{{ .Values.oauthProxy.port }}
            - -http-address=
            - -email-domain=*
            - -upstream=http://127.0.0.1:8080
            - -tls-cert=/etc/tls/private/tls.crt
            - -tls-key=/etc/tls/private/tls.key
            - -cookie-secret-file=/etc/proxy/secrets/session_secret
            - -openshift-service-account={{ include "gsd.serviceAccountName" . }}
            - -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - -skip-auth-regex={{ .Values.oauthProxy.skipAuthRegex }}
            {{- if .Values.oauthProxy.sar }}
            - -openshift-sar={{ .Values.oauthProxy.sar }}
            {{- end }}
            {{- if .Values.oauthProxy.skipProviderButton }}
            - -skip-provider-button
            {{- end }}
            - -request-logging={{ .Values.oauthProxy.requestLogging }}
          ports:
            - name: oauth-proxy
              containerPort: {{ .Values.oauthProxy.port }}
              protocol: TCP
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: oauth-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-cookie
              mountPath: /etc/proxy/secrets
              readOnly: true
          resources: {{- toYaml .Values.oauthProxy.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gsd.fullname" . }}-config
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "gsd.fullname" .)) }}
        {{- else }}
          # WARNING: the accumulated timeline and membership history reset on every restart.
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.oauthProxy.enabled }}
        - name: oauth-tls
          secret:
            secretName: {{ include "gsd.fullname" . }}-tls
            defaultMode: 420
        - name: oauth-cookie
          secret:
            secretName: {{ include "gsd.fullname" . }}-oauth-cookie
            defaultMode: 420
        {{- end }}
