{{- if and (gt (int .Values.replicaCount) 1) .Values.leaderElection.enabled }}
{{- fail "replicaCount > 1 requires leaderElection.enabled=false. Above one replica each pod keeps its OWN database (/data/$POD_NAME/gsd.db), so every pod must poll for itself. With election on, the pods that lose the lease stop polling but KEEP SERVING reads from their own database, which then goes stale and never recovers — worse than no election at all. Set leaderElection.enabled=false, or return to replicaCount: 1." }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) .Values.persistence.enabled (ne (include "gsd.accessMode" .) "ReadWriteMany") }}
{{- fail "replicaCount > 1 requires a ReadWriteMany volume. Leave persistence.accessMode empty to derive it, or set it explicitly. ReadWriteOnce binds to one NODE and ReadWriteOncePod to one POD, so under either the extra replicas stay Pending forever with no error on the Deployment itself." }}
{{- end }}
{{- /*
ONE guard for RollingUpdate, not two. A second guard keyed on accessMode=ReadWriteOncePod
was strictly worse than useless: every unsafe combination it caught is caught here too (at
one replica this fires for EVERY access mode; above one replica the guard above already
demands ReadWriteMany), while the only cases it uniquely caught were SAFE — persistence
disabled, where each pod gets its own emptyDir and an overlapping rollout cannot collide.
It refused those renders with a message about a volume that did not exist.
*/}}
{{- if and (eq (int .Values.replicaCount) 1) .Values.persistence.enabled (eq (toString .Values.strategy) "RollingUpdate") }}
{{- fail "strategy=RollingUpdate is unsafe at replicaCount 1 with persistence enabled, whatever the access mode. RollingUpdate starts the incoming pod BEFORE terminating the outgoing one, and at one replica both use /data/gsd.db — two processes on one SQLite file, which corrupts rather than errors because WAL coordinates through an mmap'd -shm file that assumes a single host. The guard above catches only ReadWriteOncePod, where the scheduler refuses the second pod anyway; the DEFAULT ReadWriteMany happily mounts twice and was therefore the dangerous case, not the protected one. Use Recreate, or leave strategy empty to derive it. Above one replica RollingUpdate is correct and stays allowed, because each pod owns /data/$POD_NAME/gsd.db." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gsd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- /*
    Recreate exists for the single-replica case, where the outgoing and incoming pods would
    otherwise contend for the same database file. Above one replica each pod owns its own
    file, so that reason is gone — and keeping Recreate there would take EVERY replica down
    at once on each upgrade, removing the availability that was the only point of scaling.
    */}}
    type: {{ .Values.strategy | default (ternary "RollingUpdate" "Recreate" (gt (int .Values.replicaCount) 1)) }}
  selector:
    matchLabels: {{- include "gsd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gsd.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Restart the pod when the config changes. Without this a `helm upgrade` that only
        # alters intervals or the cluster list updates the ConfigMap and changes nothing,
        # because the running process read it at startup.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "gsd.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "gsd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.oauthProxy.enabled }}
          # Bind loopback only. Otherwise 8080 stays reachable pod-network-wide and anything
          # inside the cluster can skip the proxy entirely by addressing the pod directly,
          # which would make the authentication decorative.
          command:
            - python3.14
            - -m
            - uvicorn
            - gsd.api:create_app
            - --factory
            - --host
            - 127.0.0.1
            - --port
            - "8080"
            - --workers
            - "1"
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GSD_CONFIG
              value: /etc/gsd/clusters.yaml
            # MUST STAY ABOVE GSD_DB_PATH. Kubernetes expands `$(VAR)` only against
            # variables defined EARLIER in this list — "an environment variable is not
            # considered defined if it is specified further down the list" — and an
            # unresolved reference is left as the literal string without blocking startup.
            # With POD_NAME below, the per-pod path above one replica resolved to the
            # literal /data/$(POD_NAME)/gsd.db: the SAME directory in every replica, on the
            # ReadWriteMany volume, which is exactly the shared SQLite file the per-pod path
            # exists to prevent. It fails silently, because the container starts fine.
            #
            # Also makes the Lease name the actual pod holding it, which is the first thing
            # you want when asking "which replica is writing?".
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GSD_DB_PATH
              {{- if gt (int .Values.replicaCount) 1 }}
              # PER-POD database file. Multiple replicas must NOT share one SQLite file:
              # WAL coordinates writers through an mmap'd -shm file that assumes all
              # processes are on ONE host, so sharing it across a ReadWriteMany volume
              # corrupts rather than errors. A shared VOLUME with unshared FILES is safe.
              #
              # The cost is that accumulated history is per-pod: each replica only has the
              # timeline since its own database existed, so the Service will show different
              # history depending on which pod answers. Current state self-heals within one
              # poll; history does not.
              value: /data/$(POD_NAME)/gsd.db
              {{- else }}
              value: /data/gsd.db
              {{- end }}
            - name: GSD_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- $ca := list }}
            {{- if .Values.trustedCA.injected.enabled }}
            {{- $ca = append $ca (printf "%s/injected/ca-bundle.crt" .Values.trustedCA.mountPath) }}
            {{- end }}
            {{- if .Values.trustedCA.existingConfigMap.enabled }}
            {{- $ca = append $ca (printf "%s/enterprise/%s" .Values.trustedCA.mountPath .Values.trustedCA.existingConfigMap.key) }}
            {{- end }}
            {{- if $ca }}
            # Colon-separated, like SSL_CERT_FILE. Used for any cluster that does not name
            # its own caBundleFile — the normal case for an external, corporate-signed one.
            - name: GSD_TRUSTED_CA_FILE
              value: {{ join ":" $ca | quote }}
            {{- end }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gsd
              readOnly: true
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem is on, so anything writing to /tmp needs a volume.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.trustedCA.injected.enabled }}
            - name: trusted-ca-injected
              mountPath: {{ .Values.trustedCA.mountPath }}/injected
              readOnly: true
            {{- end }}
            {{- if .Values.trustedCA.existingConfigMap.enabled }}
            - name: trusted-ca-enterprise
              mountPath: {{ .Values.trustedCA.mountPath }}/enterprise
              readOnly: true
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              {{- if .Values.oauthProxy.enabled }}
              # Through the proxy, over HTTPS: the app no longer listens on the pod IP.
              # oauthProxy.skipAuthRegex must cover this path or kubelet gets a 302 to the
              # login page and kills a healthy pod.
              # NUMERIC, not the port name. A named port resolves only within the
              # container that declares it, and this probe runs on the dashboard container
              # while the name belongs to the sidecar. kubelet then parses the name as an
              # integer and every probe errors with `strconv.Atoi: parsing "oauth-proxy"`.
              # Both `helm template` and `oc apply --dry-run=server` accept it, so only a
              # real deploy catches this.
              port: {{ .Values.oauthProxy.port }}
              scheme: HTTPS
              {{- else }}
              port: http
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              {{- if .Values.oauthProxy.enabled }}
              # NUMERIC, not the port name. A named port resolves only within the
              # container that declares it, and this probe runs on the dashboard container
              # while the name belongs to the sidecar. kubelet then parses the name as an
              # integer and every probe errors with `strconv.Atoi: parsing "oauth-proxy"`.
              # Both `helm template` and `oc apply --dry-run=server` accept it, so only a
              # real deploy catches this.
              port: {{ .Values.oauthProxy.port }}
              scheme: HTTPS
              {{- else }}
              port: http
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.oauthProxy.enabled }}
        - name: oauth-proxy
          image: {{ .Values.oauthProxy.image }}
          imagePullPolicy: {{ .Values.oauthProxy.imagePullPolicy }}
          args:
            - -provider=openshift
            - -https-address=:{{ .Values.oauthProxy.port }}
            - -http-address=
            - -email-domain=*
            - -upstream=http://127.0.0.1:8080
            - -tls-cert=/etc/tls/private/tls.crt
            - -tls-key=/etc/tls/private/tls.key
            - -cookie-secret-file=/etc/proxy/secrets/session_secret
            - -openshift-service-account={{ include "gsd.serviceAccountName" . }}
            - -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - -skip-auth-regex={{ .Values.oauthProxy.skipAuthRegex }}
            {{- if .Values.oauthProxy.sar }}
            - -openshift-sar={{ .Values.oauthProxy.sar }}
            {{- end }}
            {{- if .Values.oauthProxy.skipProviderButton }}
            - -skip-provider-button
            {{- end }}
            - -request-logging={{ .Values.oauthProxy.requestLogging }}
          ports:
            - name: oauth-proxy
              containerPort: {{ .Values.oauthProxy.port }}
              protocol: TCP
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: oauth-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-cookie
              mountPath: /etc/proxy/secrets
              readOnly: true
          resources: {{- toYaml .Values.oauthProxy.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gsd.fullname" . }}-config
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "gsd.fullname" .)) }}
        {{- else }}
          # WARNING: the accumulated timeline and membership history reset on every restart.
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.trustedCA.injected.enabled }}
        - name: trusted-ca-injected
          configMap:
            name: {{ include "gsd.fullname" . }}-trusted-ca
            # optional: the operator populates this shortly after creation, and a pod that
            # refused to start until then would fail the first rollout of every install.
            optional: true
        {{- end }}
        {{- if .Values.trustedCA.existingConfigMap.enabled }}
        - name: trusted-ca-enterprise
          configMap:
            # NOT optional: you named this explicitly, so its absence is a mistake worth
            # failing on rather than silently starting without the CA you asked for.
            name: {{ .Values.trustedCA.existingConfigMap.name }}
        {{- end }}
        {{- if .Values.oauthProxy.enabled }}
        - name: oauth-tls
          secret:
            secretName: {{ include "gsd.fullname" . }}-tls
            defaultMode: 420
        - name: oauth-cookie
          secret:
            secretName: {{ include "gsd.fullname" . }}-oauth-cookie
            defaultMode: 420
        {{- end }}
