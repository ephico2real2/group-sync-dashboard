{{- if .Values.route.enabled }}
# NOTE: no authentication. The dashboard aggregates group membership, which is sensitive.
# Do not expose this on a shared cluster until that is resolved — see docs/PLAN_oauth_proxy.md.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "gsd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "gsd.fullname" . }}
  port:
    targetPort: http
  {{- if .Values.oauthProxy.enabled }}
  # reencrypt, not edge: the proxy terminates TLS itself with the service-ca certificate,
  # so the router must re-encrypt to it. Leaving this as edge would send plaintext to a
  # port that only speaks TLS.
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
  {{- else }}
  tls: {{- toYaml .Values.route.tls | nindent 4 }}
  {{- end }}
{{- end }}
