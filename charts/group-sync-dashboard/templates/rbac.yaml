{{- if .Values.rbac.create }}
# Read-only on everything it reports on: no watch, and no verb that can change a Group, a
# GroupSync CR or a binding. The ONE exception is the dashboard's own leader-election Lease
# below, which is its coordination and not an object it observes. Cluster-scoped because
# Groups are cluster-scoped and GroupSync CRs may live in any namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gsd.fullname" . }}-reader
  labels: {{- include "gsd.labels" . | nindent 4 }}
rules:
  - apiGroups: ["redhatcop.redhat.io"]
    resources: ["groupsyncs"]
    verbs: ["get", "list"]
  # The namespace-configuration-operator's CRs — the other half of the access pipeline:
  # group-sync creates the groups, these template the RoleBindings that grant them access.
  # The dashboard AUTO-DETECTS the CRDs: on a cluster without the operator the list 404s,
  # which is recorded as "absent" and renders as nothing. WITHOUT this grant the same call
  # 403s instead, which is treated as a refresh failure and logs a warning every cycle —
  # so keep the grant even on clusters that may never install the operator; an authorised
  # 404 is quiet and a forbidden 403 is not.
  - apiGroups: ["redhatcop.redhat.io"]
    resources: ["namespaceconfigs", "groupconfigs"]
    verbs: ["get", "list"]
  - apiGroups: ["user.openshift.io"]
    resources: ["groups"]
    verbs: ["get", "list"]
  {{- if .Values.rbac.users }}
  # Display names, and nothing else off the User object. A User exists only once that person has
  # logged in, and its fullName is filled by the identity provider's `attributes.name` mapping —
  # so this grant buys a name for the subset who have authenticated, and nothing for the rest.
  # Measured on the reference cluster: 10 distinct group members, 7 named, 3 with no User object.
  #
  # OPTIONAL BY CONSTRUCTION, and the code proves it rather than assuming it: without this rule the
  # list call 403s, `ClusterClient.fetch_users` returns None, and the poller keeps whatever names it
  # already had instead of writing an empty set. So an install that upgrades the image without
  # re-applying RBAC loses new names, not correctness and not the tab. Set this false to decline the
  # grant deliberately; the dashboard then shows bare user ids exactly as it did before the feature.
  #
  # A User carries identities and group membership too, and neither is read — the dashboard derives
  # membership from Group objects, which it already lists above.
  - apiGroups: ["user.openshift.io"]
    resources: ["users"]
    verbs: ["get", "list"]
  {{- end }}
  {{- if .Values.leaderElection.enabled }}
  # Leader election. Namespaced, so this belongs in a Role rather than the ClusterRole —
  # but keeping one object is simpler and the grant is confined to one named Lease anyway.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  {{- end }}
  # NO WRITE VERB ON ANYTHING THE DASHBOARD REPORTS ON, at any value, and it stays that
  # way. The `create`/`update` on leases directly above is the sole write in this role and it
  # is scoped to one object the dashboard owns — say "reports on", not "anywhere", because an
  # absolute claim sitting three lines below its own counter-example teaches a reader to stop
  # trusting the comments.
  #
  # A conditional `patch` on rolebindings/clusterrolebindings used to render here when
  # config.unmanagedAudit.mode was "annotate", so the dashboard could label its own findings
  # for `oc get ... -l`. It was removed because it could never work: Kubernetes
  # privilege-escalation prevention refuses a patch on an RBAC object unless the writer
  # already holds every permission that object grants, even for a metadata-only patch.
  # Measured on a live cluster — 4 findings planned, 0 landed, 175 extra rule sets demanded
  # to label a binding granting nothing but `view`. The grant bought nothing and cost a verb
  # that can change what a binding grants.
  #
  # Findings are published to the log, the RBAC policy tab and
  # /api/clusters/{id}/bindings/findings instead. Suppressing one is a cluster-admin task on
  # the object: `oc annotate ... rbac.ocp.io/unmanaged-exception="<why>"`, which the dashboard
  # reads. See values.yaml and docs/unmanaged-audit-design.md.
  {{- if .Values.rbac.bindings }}
  # Powers the "Access granted" view and dangling-binding detection.
  #
  # roles/clusterroles are deliberately NOT requested, since role rules are never evaluated.
  # Note that is a statement of intent, not an isolation boundary: OpenShift binds
  # `basic-user` to system:authenticated, which already grants get/list on clusterroles to
  # every authenticated identity including this one. Verified with `oc auth can-i`.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "clusterrolebindings"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gsd.fullname" . }}-reader
  labels: {{- include "gsd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gsd.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "gsd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if and .Values.oauthProxy.enabled .Values.oauthProxy.apiTokenAccess.enabled }}
---
# Delegated authorization for the oauth-proxy, so `Authorization: Bearer <token>` works
# against /api and the API can be curl'd without a browser.
#
# WHY A SEPARATE BINDING TO A STOCK ROLE rather than rules in the chart's own ClusterRole:
# system:auth-delegator is the role the Kubernetes project defines for exactly this, it grants
# exactly two verbs, and using it means an auditor recognises the grant instead of reading
# ours. Bundling it into the reader role would also make it impossible to have API-token
# access off while the dashboard works, which is the default.
#
# WHAT IT GRANTS, PLAINLY: create on tokenreviews and subjectaccessreviews. The proxy needs
# both to answer "is this bearer token valid, and may that identity do the thing
# -openshift-delegate-urls names". They are cluster-scoped and they are real privilege — a
# compromised proxy container could validate any token presented to it and ask the API server
# about any subject's permissions. It cannot mint tokens and it gains no read access to
# workloads. That trade is why this is default-off and why the dashboard works without it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gsd.fullname" . }}-auth-delegator
  labels: {{- include "gsd.labels" . | nindent 4 }}
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "gsd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
