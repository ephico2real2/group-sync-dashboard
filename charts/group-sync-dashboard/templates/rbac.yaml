{{- if .Values.rbac.create }}
# Read-only throughout: no watch, no write verbs. Cluster-scoped because Groups are
# cluster-scoped and GroupSync CRs may live in any namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gsd.fullname" . }}-reader
  labels: {{- include "gsd.labels" . | nindent 4 }}
rules:
  - apiGroups: ["redhatcop.redhat.io"]
    resources: ["groupsyncs"]
    verbs: ["get", "list"]
  - apiGroups: ["user.openshift.io"]
    resources: ["groups"]
    verbs: ["get", "list"]
  {{- if .Values.leaderElection.enabled }}
  # Leader election. Namespaced, so this belongs in a Role rather than the ClusterRole —
  # but keeping one object is simpler and the grant is confined to one named Lease anyway.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  {{- end }}
  {{- if .Values.rbac.bindings }}
  # Powers the "Access granted" view and dangling-binding detection.
  #
  # roles/clusterroles are deliberately NOT requested, since role rules are never evaluated.
  # Note that is a statement of intent, not an isolation boundary: OpenShift binds
  # `basic-user` to system:authenticated, which already grants get/list on clusterroles to
  # every authenticated identity including this one. Verified with `oc auth can-i`.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "clusterrolebindings"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gsd.fullname" . }}-reader
  labels: {{- include "gsd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gsd.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "gsd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
