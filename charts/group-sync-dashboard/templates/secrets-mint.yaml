{{- /*
The generated-once Secrets, MINTED ON THE CLUSTER, never in the manifest (#212):

  <fullname>-oauth-session      session_secret   the oauth-proxy's cookie key   (oauthProxy.enabled, no cookieSecret value)
  <reportName>-shared-token     token            signs tickets in the dashboard, verifies them in the report
                                                  pod, authenticates the usage pull and the schedule Jobs (reporting on)

Until 0.37.0 both were rendered through Helm's `lookup` of the existing Secret. `lookup` is empty
under `helm template` — Argo CD's repo-server and Kustomize's helmCharts — so every render minted
fresh values and every sync rotated them: sessions signed out, the dashboard->report call refused
until both pods restarted (the openshift-grafana chart measured it, #209; the fix is the same shape).

A hook Job creates each Secret ONLY IF IT DOES NOT EXIST: pre-install/pre-upgrade so the Deployments
can mount them, AND post-install/post-upgrade so a Secret missing after the apply (deleted by hand)
is back before anything waits on the pods. Its ServiceAccount, Role and RoleBinding are hooks too,
at a lower weight: a pre-hook runs before the manifest, so an ordinary SA would not exist yet
(measured on the Grafana chart: "serviceaccount not found" to the deadline).

THE TRANSITION IS CARRIED OVER, NOT ROTATED. The names changed with the mechanism
(-oauth-cookie -> -oauth-session, -token -> -shared-token) so that the old Helm-owned Secrets can be
dropped from the manifest without a gap: the pre-upgrade mint finds the new name absent and the OLD
name present, and copies the value across; Helm then deletes the old object; the Deployment already
mounts the new one with the same value. Sessions and tickets survive the upgrade. A Deployment
mounting a Secret Helm deletes mid-upgrade would otherwise leave the pods unable to start and
`--wait` deadlocked.

Bring your own: a Secret you create under the minted name is kept as it is (the mint only creates);
oauthProxy.cookieSecret renders a plain, deterministic Secret and the cookie mint is skipped.
*/ -}}
{{- $mintCookie := and .Values.oauthProxy.enabled (not .Values.oauthProxy.cookieSecret) }}
{{- $mintToken := eq (include "gsd.reportingEnabled" .) "true" }}
{{- if and .Values.secretsMint.enabled (or $mintCookie $mintToken) }}
{{- $name := include "gsd.fullname" . }}
{{- $report := include "gsd.reportName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-secrets-mint
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
  annotations:
    # One Argo wave BEFORE the Job (-1): PreSync hooks run lowest wave first, so an identity left at the
    # default wave 0 would be applied AFTER the Job that needs it (review of #215, Grok M2).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=true
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
# `create` cannot be name-scoped; `get` is scoped to the four names (the two minted, the two carried
# over). Nothing else runs as this identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-secrets-mint
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
  annotations:
    # One Argo wave BEFORE the Job (-1): PreSync hooks run lowest wave first, so an identity left at the
    # default wave 0 would be applied AFTER the Job that needs it (review of #215, Grok M2).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=true
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ printf "%s-oauth-session" $name | quote }}
      - {{ printf "%s-oauth-cookie" $name | quote }}
      - {{ printf "%s-shared-token" $report | quote }}
      - {{ printf "%s-token" $report | quote }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-secrets-mint
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
  annotations:
    # One Argo wave BEFORE the Job (-1): PreSync hooks run lowest wave first, so an identity left at the
    # default wave 0 would be applied AFTER the Job that needs it (review of #215, Grok M2).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=true
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-secrets-mint
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-secrets-mint
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-secrets-mint
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync,Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=true
    helm.sh/hook: pre-install,pre-upgrade,post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        # NOT gsd.selectorLabels: those are the Service's and the PodDisruptionBudget's selector, and a
        # hook pod carrying them is routed to while it runs and fails the budget outright (measured on
        # the authLogLevel hook; test_chart_pdb holds the selector to the Deployment's pods alone).
        app.kubernetes.io/name: {{ include "gsd.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: secrets-mint
    spec:
      serviceAccountName: {{ $name }}-secrets-mint
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir:
            medium: Memory
      containers:
        - name: mint
          image: {{ .Values.secretsMint.image.repository }}:{{ .Values.secretsMint.image.tag }}
          imagePullPolicy: {{ .Values.secretsMint.image.pullPolicy }}
          resources:
            {{- toYaml .Values.secretsMint.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /tmp
          env:
            - name: KUBECACHEDIR
              value: /tmp/.kube/cache
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: MINT_COOKIE
              value: {{ $mintCookie | quote }}
            - name: MINT_TOKEN
              value: {{ $mintToken | quote }}
            - name: COOKIE_SECRET
              value: {{ $name }}-oauth-session
            - name: COOKIE_LEGACY
              value: {{ $name }}-oauth-cookie
            - name: TOKEN_SECRET
              value: {{ $report }}-shared-token
            - name: TOKEN_LEGACY
              value: {{ $report }}-token
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              log() { echo "$(date -u +%H:%M:%SZ) $*"; }
              # cut, not head, as the last stage: every stage reads its input to the end, so nothing
              # upstream is killed by SIGPIPE — under `set -o pipefail` that 141 would fail the mint
              # (review of #215, Grok N1). The first head reads /dev/urandom and exits on its own.
              random() { head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | cut -c1-"$1"; }
              # existing NAME KEY FILE: the value an existing Secret holds for KEY, decoded byte for byte
              # into FILE (a command substitution would strip a trailing newline — Grok N2). Returns 0
              # present, 1 absent, 2 on any other read error, so a transient Forbidden or timeout on the
              # legacy name is a retried failure and not a fresh mint (Grok N6). A return code, not
              # `exit` inside a `$(...)`: that only leaves the subshell (the harness caught it).
              existing() {
                local name="$1" key="$2" file="$3" out
                if out="$(oc get secret "$name" -n "$NAMESPACE" -o jsonpath="{.data.$key}" 2>&1)"; then
                  [ -n "$out" ] || return 1
                  printf '%s' "$out" | base64 -d > "$file" || { echo "FAIL: $name/$key is not base64" >&2; return 2; }
                  return 0
                elif printf '%s' "$out" | grep -q 'NotFound\|not found'; then
                  return 1
                else
                  echo "FAIL: could not read secret $name: $out" >&2
                  return 2
                fi
              }
              # mint NAME LEGACY KEY LENGTH: keep NAME if it exists; else carry LEGACY's value over if that
              # exists (the 0.37.0 transition, and a rollback's way back); else a fresh random value. A
              # create that loses a race (two syncs at once) answers AlreadyExists: the Secret exists, kept.
              mint() {
                local name="$1" legacy="$2" key="$3" length="$4" source rc
                local file="/tmp/$key"   # a second `local`: the first line's words expand before it assigns
                if oc get secret "$name" -n "$NAMESPACE" >/dev/null 2>&1; then
                  log "$name exists; kept"
                  return 0
                fi
                rc=0; existing "$legacy" "$key" "$file" || rc=$?
                case "$rc" in
                  0) source="carried over from $legacy" ;;
                  1) random "$length" | tr -d '\n' > "$file"; source="minted" ;;
                  *) exit 1 ;;
                esac
                if out="$(oc create secret generic "$name" -n "$NAMESPACE" --from-file="$key=$file" 2>&1)"; then
                  log "$name created ($source)"
                elif printf '%s' "$out" | grep -q 'AlreadyExists\|already exists'; then
                  log "$name appeared meanwhile; kept"
                else
                  echo "FAIL: could not create $name: $out" >&2
                  exit 1
                fi
                rm -f "$file"
              }
              [ "$MINT_COOKIE" = "true" ] && mint "$COOKIE_SECRET" "$COOKIE_LEGACY" session_secret 32
              [ "$MINT_TOKEN" = "true" ] && mint "$TOKEN_SECRET" "$TOKEN_LEGACY" token 48
              log "done"
{{- end }}
