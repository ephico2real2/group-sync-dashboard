{{- if and .Values.oauthProxy.enabled .Values.oauthProxy.cookieSecret }}
{{- /*
The oauth-proxy session key, rendered ONLY when oauthProxy.cookieSecret supplies the value — a
deterministic Secret that no renderer rotates. Empty (the default), the key is minted on the cluster
by the secrets-mint hook (templates/secrets-mint.yaml) under the same name, and never rendered.

Chart 0.37.0 retired the `lookup` that used to reuse the existing key here: `lookup` is empty under
`helm template`, which is what Argo CD's repo-server and Kustomize's helmCharts run, so every render
minted a fresh key and every sync signed every session out (the Grafana chart measured the same,
#209/#212). The Secret's name moved with it, <fullname>-oauth-cookie -> <fullname>-oauth-session:
the mint carries an existing -oauth-cookie value over on the first upgrade, so sessions survive.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gsd.fullname" . }}-oauth-session
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
type: Opaque
data:
  session_secret: {{ .Values.oauthProxy.cookieSecret | b64enc | quote }}
{{- end }}
