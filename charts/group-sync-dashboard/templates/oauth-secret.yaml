{{- if .Values.oauthProxy.enabled }}
{{- $name := printf "%s-oauth-cookie" (include "gsd.fullname" .) }}
{{- /*
Generate once, then REUSE. `lookup` reads the Secret that already exists in the cluster, so
an upgrade keeps the same key. Generating inline in the container args — as several
published examples do — produces a fresh value on every `helm upgrade` and silently signs
every existing session out.

`lookup` returns empty on `helm template` and dry-run, which is correct: those must not
depend on cluster state, and the rendered value is not applied.
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
# The proxy derives an AES key from this secret and refuses to start unless it yields 16,
# 24 or 32 key bytes — a crash-looping sidecar, with the reason in its logs while the
# upgrade reports success. The requirement holds on EVERY proxied render here, not only
# with refresh on: the sidecar always runs -pass-access-token (the sign-out revocation
# needs the user's token), and the proxy demands the AES-sized secret whenever that flag
# OR a refresh is set. So the same check runs at render time, through
# gsd.cookieSecretBytes, which mirrors the proxy's own arithmetic (base64 decoded when the
# value decodes, counted raw otherwise). The generated randAlpha path always passes. The
# looked-up branch below runs only against a real cluster — the lookup is empty under
# `helm template` and client dry-runs, so it cannot fire on a disconnected render.
{{- if .Values.oauthProxy.cookieSecret }}
{{- $bytes := include "gsd.cookieSecretBytes" .Values.oauthProxy.cookieSecret }}
{{- if not (has (int $bytes) (list 16 24 32)) }}
{{- fail (printf "oauthProxy.cookieSecret yields %s key bytes, and it must be 16, 24, or 32 so the proxy can build an AES cipher — the sidecar always needs one, because -pass-access-token is set for the sign-out revocation (and cookie.refresh would need it too); it refuses to start otherwise, as a crash-looping sidecar. Supply a raw secret of one of those lengths (e.g. `openssl rand -hex 16` for 32 bytes), or its base64 encoding; a value that parses as base64 is measured after decoding, exactly as the proxy measures it. Alternatively leave cookieSecret empty and the chart generates a valid one." $bytes) }}
{{- end }}
{{- end }}
{{- if and (not .Values.oauthProxy.cookieSecret) $existing }}
{{- $bytes := include "gsd.cookieSecretBytes" (index $existing.data "session_secret" | b64dec) }}
{{- if not (has (int $bytes) (list 16 24 32)) }}
{{- fail (printf "the existing Secret %s holds a session_secret of %s key bytes, and the proxy needs 16, 24, or 32 to build an AES cipher (always: -pass-access-token is set for the sign-out revocation) — it would crash-loop on this upgrade. The chart reuses that Secret on purpose so upgrades do not sign everyone out. It was not generated by this chart (the generated form is always valid); either set a valid oauthProxy.cookieSecret, or delete the Secret and upgrade again to regenerate it — both sign every current session out once." $name $bytes) }}
{{- end }}
{{- end }}
{{- $secret := "" }}
{{- if .Values.oauthProxy.cookieSecret }}
{{- $secret = .Values.oauthProxy.cookieSecret | b64enc }}
{{- else if $existing }}
{{- $secret = index $existing.data "session_secret" }}
{{- else }}
{{- $secret = randAlpha 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
type: Opaque
data:
  session_secret: {{ $secret | quote }}
{{- end }}
