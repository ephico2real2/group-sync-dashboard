{{- if .Values.monitoring.serviceMonitor.enabled }}
# Requires the Prometheus Operator CRDs. Disabled by default because applying this where
# they are absent fails the whole install.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gsd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gsd.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- if .Values.argocd.enabled }}
  annotations:
    # ServiceMonitor is a CRD from the Prometheus Operator. Argo dry-runs every resource
    # before applying, and a dry-run against a CRD that is not installed FAILS THE WHOLE
    # SYNC — not just this resource. That turns "monitoring is not installed yet" into
    # "nothing deploys", which is a disproportionate failure for an optional extra.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  {{- end }}
spec:
  selector:
    matchLabels: {{- include "gsd.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      {{- if .Values.oauthProxy.enabled }}
      # HTTPS, because the Service port named `http` targets the PROXY container port when
      # the proxy is on, and that port speaks TLS only. Prometheus scrapes the pod IP at
      # that port, so the default `http` scheme fails the handshake on EVERY scrape —
      # silently, while the Service and the ServiceMonitor both look correct.
      #
      # No credential is needed: /metrics is in oauthProxy.skipAuthRegex, so the proxy
      # passes it through unauthenticated. That is also why the exporter emits counts and
      # states only, never a group or user name.
      scheme: https
      tlsConfig:
        # VERIFIED — and this block used to say it could not be. The old comment reasoned that
        # service-ca issues the certificate for the SERVICE DNS name while Prometheus dials the
        # POD IP, so the name can never match (true), and concluded that verification therefore
        # had to be off "regardless of how trust is configured" (false). `serverName` sets the
        # name that is VERIFIED independently of the address dialled, which is what it is for.
        #
        # Measured on the reference cluster — connecting to the pod IP while verifying against
        # the service name, which is exactly what these two fields ask Prometheus to do:
        #   curl --cacert .../service-ca.crt \
        #        --resolve 'group-sync-dashboard.<ns>.svc:8443:10.217.0.157' \
        #        https://group-sync-dashboard.<ns>.svc:8443/metrics
        #     -> HTTP 200, ssl_verify_result=0
        # The same call with no --cacert is REFUSED, so that success is real verification and
        # not a handshake that would have passed anyway.
        #
        # The certificate carries the service DNS names and nothing else, which is why
        # `serverName` must name the Service rather than the pod:
        #   DNS:<name>.<ns>.svc, DNS:<name>.<ns>.svc.cluster.local
        #
        # OPENSHIFT-ONLY, deliberately. `openshift-service-ca.crt` is injected into every
        # namespace by the service-ca operator, and the Prometheus Operator resolves a
        # configMap reference against the ServiceMonitor's OWN namespace, so it resolves here
        # with nothing copied in. Vanilla Kubernetes has neither that ConfigMap nor the serving
        # certificate — but it also has no Route, no oauth-proxy sidecar and no
        # user.openshift.io, so this chart is already OpenShift-shaped.
        ca:
          configMap:
            name: openshift-service-ca.crt
            key: service-ca.crt
        serverName: {{ include "gsd.fullname" . }}.{{ .Release.Namespace }}.svc
      {{- end }}
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "gsd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gsd.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- if .Values.argocd.enabled }}
  annotations:
    # Same reasoning as the ServiceMonitor above.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  {{- end }}
spec:
  groups:
    - name: {{ include "gsd.fullname" . }}
      rules:
        # The metric is a unix timestamp, not a precomputed age, so the threshold is
        # visible and tunable here rather than baked into the exporter.
        - alert: GroupSyncOverdue
          expr: (time() - gsd_groupsync_last_sync_timestamp_seconds) > {{ .Values.monitoring.prometheusRule.overdueSeconds }}
          for: {{ .Values.monitoring.prometheusRule.for.overdue }}
          labels: {severity: warning}
          annotations:
            summary: "GroupSync {{ `{{ $labels.groupsync }}` }} has not synced recently"
            description: >-
              Last successful sync was {{ `{{ $value | humanizeDuration }}` }} ago on
              cluster {{ `{{ $labels.cluster }}` }}.

        # The group was operator-managed and has disappeared, so the binding grants nobody
        # while `oc get rolebinding` shows a healthy object.
        - alert: DanglingRoleBinding
          expr: gsd_bindings_total{finding="dangling"} > 0
          for: {{ .Values.monitoring.prometheusRule.for.dangling }}
          labels: {severity: critical}
          annotations:
            summary: "{{ `{{ $value }}` }} RoleBinding(s) grant access to a group that no longer exists"

        # Catches a dead poll loop, which the health endpoints structurally cannot:
        # /healthz is unconditional and /readyz only reads the store, so both stay green
        # while the dashboard serves frozen data.
        - alert: GroupSyncDashboardNotPolling
          expr: (time() - gsd_cluster_last_poll_timestamp_seconds) > {{ .Values.monitoring.prometheusRule.notPollingSeconds }}
          for: {{ .Values.monitoring.prometheusRule.for.notPolling }}
          labels: {severity: critical}
          annotations:
            summary: "Dashboard has not polled {{ `{{ $labels.cluster }}` }} recently"
            description: >-
              The data shown is stale. The pod may be running and reporting healthy while
              its poll loop has stopped.

        - alert: GroupSyncClusterUnreachable
          expr: gsd_cluster_up == 0
          for: {{ .Values.monitoring.prometheusRule.for.unreachable }}
          labels: {severity: warning}
          annotations:
            summary: "Dashboard cannot poll cluster {{ `{{ $labels.cluster }}` }}"

        - alert: GroupSyncDashboardDirectUserGrants
          expr: gsd_alerts_total{kind="direct_user_binding"} > 0
          for: {{ .Values.monitoring.prometheusRule.for.directUserGrants }}
          labels: {severity: warning}
          annotations:
            summary: "Namespaces still grant access to people, not LDAP groups"
            description: >-
              One or more RoleBindings name a User subject directly. Those grants survive
              offboarding — removing someone from an LDAP group revokes their access
              everywhere at once, while a binding that names them keeps granting until
              somebody remembers it exists — and no group-based access review can see
              them. The dashboard's Namespace audit tab lists them per namespace with the
              migration path. Platform identities and kubeadmin are excluded.

        - alert: GroupSyncDashboardConfigReconcileError
          expr: gsd_alerts_total{kind="config_reconcile_error"} > 0
          for: {{ .Values.monitoring.prometheusRule.for.configError }}
          labels: {severity: critical}
          annotations:
            summary: "A NamespaceConfig/GroupConfig is failing to reconcile"
            description: >-
              The namespace-configuration-operator CR named in the dashboard's alerts view
              is currently failing. These CRs template the RoleBindings that give synced
              groups their access, so while this persists RBAC has silently stopped
              reconciling: new namespaces receive no bindings and drift stops being
              corrected. Nothing else on the cluster reports this.

        # Both of the following are SILENT failures: the pod stays Ready, every other metric
        # looks normal, and the first visible symptom is a full volume or a latency cliff.
        - alert: GroupSyncDashboardWalGrowing
          expr: gsd_sqlite_wal_bytes > {{ .Values.monitoring.prometheusRule.walMiB }} * 1024 * 1024
          for: {{ .Values.monitoring.prometheusRule.for.walGrowing }}
          labels: {severity: warning}
          annotations:
            summary: "SQLite write-ahead log is not being checkpointed"
            description: >-
              Checkpoints yield to open readers, so a sustained read load can starve them.
              The WAL then grows until the PVC fills while the database file stays small.
              Check gsd_sqlite_checkpoint_busy_total: if it rises every cycle, the
              checkpoint is being starved rather than merely lagging.

        - alert: GroupSyncDashboardWalDisabled
          expr: gsd_sqlite_wal_enabled == 0
          for: {{ .Values.monitoring.prometheusRule.for.walDisabled }}
          labels: {severity: warning}
          annotations:
            summary: "SQLite is not in WAL mode; reads block on every write"
            description: >-
              WAL was requested but the filesystem refused it, which is expected on NFS, EFS
              and SMB. Without it a reader blocks for the whole duration of the poll's bulk
              write, so API latency tracks the write rather than being independent of it.
              Move the database to block storage.
{{- end }}
