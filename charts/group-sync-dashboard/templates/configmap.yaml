apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gsd.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
data:
  clusters.yaml: |
    pollIntervalSeconds: {{ .Values.config.pollIntervalSeconds }}
    scheduleGraceSeconds: {{ .Values.config.scheduleGraceSeconds }}
    bindingIntervalSeconds: {{ .Values.config.bindingIntervalSeconds }}
    requestTimeoutSeconds: {{ .Values.config.requestTimeoutSeconds }}
    clusters:
      {{- toYaml .Values.clusters | nindent 6 }}
