apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gsd.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gsd.labels" . | nindent 4 }}
data:
  clusters.yaml: |
    pollIntervalSeconds: {{ .Values.config.pollIntervalSeconds }}
    scheduleGraceSeconds: {{ .Values.config.scheduleGraceSeconds }}
    bindingIntervalSeconds: {{ .Values.config.bindingIntervalSeconds }}
    sqliteBusyTimeoutMs: {{ .Values.config.sqlite.busyTimeoutMs }}
    sqliteReaderBusyTimeoutMs: {{ .Values.config.sqlite.readerBusyTimeoutMs }}
    sqliteSynchronous: {{ .Values.config.sqlite.synchronous | quote }}
    sqliteWalCheckpointMb: {{ .Values.config.sqlite.walCheckpointMb }}
    {{- if .Values.config.backup.enabled }}
    backupDir: {{ .Values.config.backup.dir | quote }}
    backupIntervalHours: {{ .Values.config.backup.intervalHours }}
    backupKeep: {{ .Values.config.backup.keep }}
    {{- end }}
    requestTimeoutSeconds: {{ .Values.config.requestTimeoutSeconds }}
    # The app cannot see its own sidecar, and must not infer authentication from the
    # presence of X-Forwarded-User — that header is precisely what an unauthenticated
    # caller would set. So the chart states it, and the app records identity only when
    # this is true.
    oauthProxyEnabled: {{ .Values.oauthProxy.enabled }}
    {{- if .Values.oauthProxy.enabled }}
    # The proxy's route prefix and session cap, restated for /api/whoami. The cap comes
    # from the SAME helper that builds the sidecar's -cookie-expire flag, and both render
    # in one helm invocation, so the number the app can report is the number the proxy
    # enforces — by construction rather than by convention. The session cookie is HttpOnly,
    # so the page can NEVER observe its own lifetime; it can only be told, from the one
    # place that also set it.
    #
    # No refresh key: refresh is retired (values.yaml carries the measurement) and the app
    # reads its absence as disabled. Both keys are absent when the proxy is off — there is
    # no session to restate then, and an unguarded value would reach the app's parser with
    # no render guard standing in front of it.
    oauthProxyPrefix: {{ .Values.oauthProxy.proxyPrefix | quote }}
    sessionCookieExpire: {{ include "gsd.cookieExpire" . | quote }}
    # The idle timeout's OWN keys (values.yaml `session.idleTimeout`), never derived from the
    # cookie cap, and inside this block because with no proxy there is no session to time out.
    sessionIdleTimeoutEnabled: {{ include "gsd.idleTimeoutEnabled" . }}
    sessionIdleTimeoutMinutes: {{ include "gsd.idleTimeoutMinutes" . }}
    sessionIdleTimeoutWarningSeconds: {{ include "gsd.idleTimeoutWarningSeconds" . }}
    {{- end }}
    unmanagedAuditMode: {{ .Values.config.unmanagedAudit.mode | quote }}
    unmanagedAuditMaxPerCycle: {{ .Values.config.unmanagedAudit.maxPerCycle }}
    {{- include "gsd.groupCountCliff" . }}
    # The group-count cliff alert (values.yaml config.alerts.groupCountCliff). The silence
    # list is joined like loginCaptureHtpasswdProviders: the app splits on commas.
    groupCountCliffEnabled: {{ .Values.config.alerts.groupCountCliff.enabled }}
    groupCountCliffMinMembers: {{ .Values.config.alerts.groupCountCliff.minMembers }}
    groupCountCliffDropRatio: {{ .Values.config.alerts.groupCountCliff.dropRatio }}
    groupCountCliffWindowHours: {{ .Values.config.alerts.groupCountCliff.windowHours }}
    groupCountCliffSilence: {{ .Values.config.alerts.groupCountCliff.silence | join "," | quote }}
    userActivityEnabled: {{ .Values.config.userActivity.enabled }}
    userActivityVisibility: {{ .Values.config.userActivity.visibility | quote }}
    userActivityFlushSeconds: {{ .Values.config.userActivity.flushSeconds }}
    userActivityRetentionDays: {{ .Values.config.userActivity.retentionDays }}
    # The UI modules (values.yaml `ui`). Read at boot from /api/version; a module off here
    # renders no control at all rather than a disabled one.
    uiExportEnabled: {{ .Values.ui.export.enabled }}
    # The Users tab's provider allow-list (values.yaml config.users.providers, empty = all) and the
    # Identity read switch, which is the same value as the grant (rbac.identities). The list is
    # rendered as a YAML flow sequence, not comma-joined: a provider name may legally contain a
    # comma or a space (review of C2), and the app accepts the list form as it is.
    usersProviders: {{ .Values.config.users.providers | toJson }}
    identitiesReadEnabled: {{ .Values.rbac.identities }}
    # Retention on the irreplaceable history; 0 keeps forever. See values.yaml config.retention.
    membershipEventsRetentionDays: {{ .Values.config.retention.membershipEventsDays }}
    syncEventsRetentionDays: {{ .Values.config.retention.syncEventsDays }}
    # Per-user visibility: the SubjectAccessReview that separates the wide tier from the
    # self tier. The ON/OFF switch itself travels as GSD_ENABLE_VIEW_RESTRICTIONS on the
    # Deployment — one wire, visible where an auditor reads the pod spec — so it is
    # deliberately not repeated here, where a second copy could disagree with the first.
    # Quoted unconditionally: the apiGroup may legitimately be the empty string (the core
    # API group), which unquoted YAML would read as null.
    visibilityAdminSarApiGroup: {{ include "gsd.visibilitySarApiGroup" . | quote }}
    visibilityAdminSarResource: {{ include "gsd.visibilitySarResource" . | quote }}
    visibilityAdminSarVerb: {{ include "gsd.visibilitySarVerb" . | quote }}
    visibilityAdminSarNamespace: {{ include "gsd.visibilitySarNamespace" . | quote }}
    # The Usage tab's SEPARATE, STRICTER threshold. Usage data lives only in the dashboard's
    # own database and cannot be reproduced with oc, so it gets a higher bar than the audit
    # views: cluster-reader (the auditor) passes adminSar above but must NOT pass this one.
    # Quoted for the same core-group-empty-string reason as adminSar.
    visibilityUsageAdminSarApiGroup: {{ include "gsd.usageVisibilitySarApiGroup" . | quote }}
    visibilityUsageAdminSarResource: {{ include "gsd.usageVisibilitySarResource" . | quote }}
    visibilityUsageAdminSarVerb: {{ include "gsd.usageVisibilitySarVerb" . | quote }}
    visibilityUsageAdminSarNamespace: {{ include "gsd.usageVisibilitySarNamespace" . | quote }}
    # Unquoted: the app casts this with int(), and a quoted value would still parse but the
    # other numeric keys here are unquoted and one convention is worth keeping.
    visibilityTierTtlSeconds: {{ include "gsd.visibilityTierTtl" . }}
    # THE GRANT AND THE MODULE ARE TWO DIFFERENT THINGS, and until now only the grant was wired.
    # `loginCapture.enabled` rendered the Role that lets the pod read oauth-server logs, and nothing
    # told the application to read them: the setting the code looks for is this ConfigMap key, so
    # capture stayed off with the flag on and the permission in place. Caught on the cluster, where
    # /api/.../logins answered `enabled: false` on a release built from `enabled: true`.
    loginCaptureEnabled: {{ .Values.loginCapture.enabled }}
    loginCaptureNamespace: {{ .Values.loginCapture.namespace | quote }}
    # Which provider NAMES are local HTPasswd accounts. The log carries the provider name and
    # nothing about its type, so a success on `developer` is indistinguishable from a directory
    # login without this list — and these are break-glass accounts, not people to offboard.
    loginCaptureHtpasswdProviders: {{ .Values.loginCapture.htpasswdProviders | join "," | quote }}
    loginRetentionDays: {{ .Values.loginCapture.retentionDays }}
    # The login-gate group's DN. Empty means "discover it from the OAuth CR" — see values.yaml.
    # Quoted unconditionally: a DN contains commas and colons, both of which YAML reads as structure.
    clusterAccessGroup: {{ .Values.clusterAccess.group | quote }}
    leaderElection: {{ .Values.leaderElection.enabled }}
    leaderLeaseName: {{ .Values.leaderElection.leaseName | quote }}
    clusters:
      {{- toYaml .Values.clusters | nindent 6 }}
