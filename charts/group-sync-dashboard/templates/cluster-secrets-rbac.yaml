{{- if .Values.clusterConfig.secrets.enabled }}
# Lets the DASHBOARD discover clusters declared as labelled Secrets in ITS OWN namespace
# (docs/specs/SPEC_S1_cluster_secrets.md, #230). A Role, not a ClusterRole: `secrets` cluster-wide
# would hand the dashboard every credential on the cluster. Read-only unless the Cluster
# Configurations tab's writes are on (clusterConfig.secrets.writes.enabled, SPEC_S2): then create,
# update and delete join, for the tab's Add / Rotate / Delete. Kubernetes RBAC cannot scope a verb by
# label, so the app applies the label itself: it LISTs with the selector, never reads a Secret that
# lacks it, and checks the label before every update or delete — but the grant itself covers every
# Secret in the namespace, which is why the namespace is the boundary that matters here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gsd.fullname" . }}-cluster-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gsd.rbacLabels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-secrets
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    {{- if .Values.clusterConfig.secrets.writes.enabled }}
    verbs: ["get", "list", "watch", "create", "update", "delete"]
    {{- else }}
    verbs: ["get", "list", "watch"]
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gsd.fullname" . }}-cluster-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gsd.rbacLabels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gsd.fullname" . }}-cluster-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "gsd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
