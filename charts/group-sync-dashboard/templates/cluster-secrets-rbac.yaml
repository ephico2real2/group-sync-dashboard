{{- if .Values.clusterConfig.secrets.enabled }}
# Lets the DASHBOARD discover clusters declared as labelled Secrets in ITS OWN namespace
# (docs/specs/SPEC_S1_cluster_secrets.md, #230). A Role, not a ClusterRole, and read-only: `secrets`
# cluster-wide would hand the dashboard every credential on the cluster, and the writes the Cluster
# Configurations tab needs (create, update, delete) are S2's, behind their own switch. Kubernetes RBAC
# cannot scope a verb by label, so the app applies the label at read time: it LISTs with the selector
# and never reads a Secret that lacks it — but the grant itself covers every Secret in the namespace,
# which is why the namespace is the boundary that matters here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gsd.fullname" . }}-cluster-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gsd.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gsd.fullname" . }}-cluster-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gsd.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gsd.fullname" . }}-cluster-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "gsd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
