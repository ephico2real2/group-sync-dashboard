# Grants named accounts permission to call /api with a bearer token.
#
# For the aggregator case: a reporting service, or a person with an LDAP account, curls
# https://group-sync-dashboard.apps.<cluster>.<domain>/api from outside the cluster. That
# needs oauthProxy.apiTokenAccess.enabled (which adds -openshift-delegate-urls and binds
# system:auth-delegator to the PROXY's ServiceAccount) plus a grant on the CALLER, which is
# what this file is.
#
# ---------------------------------------------------------------------------------------
# WHAT THE CALLER ACTUALLY NEEDS, AND WHAT IT DOES NOT
# ---------------------------------------------------------------------------------------
# The caller needs exactly the permission named in `apiTokenAccess.delegateUrls` — by default
# `list groups` cluster-wide. That is the honest gate: the API returns group membership, so
# anyone reading it here could already read it with `oc get groups`.
#
# The caller does NOT need system:auth-delegator. That role is for whoever CALLS TokenReview
# and SubjectAccessReview, which is the proxy, not the client. MEASURED on the reference
# cluster with apiTokenAccess on and neither identity holding auth-delegator:
#
#   system:serviceaccount:default:default   cannot list groups   ->  403
#   kubeadmin                               can list groups      ->  200
#
# So `grantAuthDelegator` below exists but defaults to false. Turning it on gives every listed
# account the ability to validate arbitrary bearer tokens and to ask the API server about any
# subject's permissions — a real privilege expansion that buys nothing for reading this API.
# It is here because a caller might need it for an unrelated reason, not because this does.
#
# ---------------------------------------------------------------------------------------
# HOW TO NAME AN ACCOUNT
# ---------------------------------------------------------------------------------------
# Write it exactly as the cluster does, and the kind is inferred:
#
#   system:serviceaccount:<namespace>:<name>   -> ServiceAccount
#   system:...  (anything else)                -> User   (e.g. system:admin)
#   <ldap-user>                                -> User   (e.g. jdoe, svc-rbac-reporter)
#   group:<name>                               -> Group  (an LDAP group the operator syncs,
#                                                         so access follows membership and is
#                                                         revoked by the directory)
#
# Preferring `group:` is worth saying out loud: it is the same argument the Namespace audit tab
# makes. A binding that names a person survives their departure; one that names a group is
# revoked by removing them from it.
{{- if and .Values.oauthProxy.enabled .Values.oauthProxy.apiTokenAccess.enabled .Values.oauthProxy.apiTokenAccess.readers }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gsd.fullname" . }}-api-reader
  labels: {{- include "gsd.labels" . | nindent 4 }}
rules:
  # Mirrors apiTokenAccess.delegateUrls. If you change the review there, change this, or the
  # accounts below will be admitted by RBAC and refused by the proxy — or worse, the reverse.
  - apiGroups: ["user.openshift.io"]
    resources: ["groups"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gsd.fullname" . }}-api-reader
  labels: {{- include "gsd.labels" . | nindent 4 }}
  {{- if .Values.argocd.enabled }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gsd.fullname" . }}-api-reader
subjects:
  {{- range $account := .Values.oauthProxy.apiTokenAccess.readers }}
  {{- $parts := splitList ":" $account }}
  {{- if and (eq (len $parts) 4) (eq (index $parts 0) "system") (eq (index $parts 1) "serviceaccount") }}
  - kind: ServiceAccount
    name: {{ index $parts 3 }}
    namespace: {{ index $parts 2 }}
  {{- else if and (eq (len $parts) 2) (eq (index $parts 0) "group") }}
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ index $parts 1 }}
  {{- else if gt (len $parts) 1 }}
  {{- /* A colon that is not one of the two forms above: refuse rather than silently create a
         User called "system:serviceaccount:foo" that will never match anything. A binding to a
         subject that cannot exist looks correct in `oc get` and grants nobody, which is the
         same class of defect as the dangling bindings this dashboard reports. */ -}}
  {{- fail (printf "oauthProxy.apiTokenAccess.readers: %q contains ':' but is not system:serviceaccount:<namespace>:<name> or group:<name>. Write a plain username with no colon, or use one of those two forms." $account) }}
  {{- else }}
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: {{ $account }}
  {{- end }}
  {{- end }}
{{- if .Values.oauthProxy.apiTokenAccess.grantAuthDelegator }}
---
# Opt-in, and almost certainly unnecessary — see the header of this file for the measurement.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gsd.fullname" . }}-api-reader-auth-delegator
  labels: {{- include "gsd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  {{- range $account := .Values.oauthProxy.apiTokenAccess.readers }}
  {{- $parts := splitList ":" $account }}
  {{- if and (eq (len $parts) 4) (eq (index $parts 0) "system") (eq (index $parts 1) "serviceaccount") }}
  - kind: ServiceAccount
    name: {{ index $parts 3 }}
    namespace: {{ index $parts 2 }}
  {{- else if and (eq (len $parts) 2) (eq (index $parts 0) "group") }}
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ index $parts 1 }}
  {{- else }}
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: {{ $account }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
