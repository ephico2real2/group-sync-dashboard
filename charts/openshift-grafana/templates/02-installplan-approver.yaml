{{- /*
Approves the InstallPlan for this chart's Subscription, so installPlanApproval: Manual installs
unattended while later upgrades still wait for a human. Renders only for Manual with the operator
installed here; with Automatic, OLM approves its own plans.

PORTED from a sibling operator chart's installplan-approver Job (reviewed twice, measured on
CRC 2026-09-18/19); the script is that one, on this chart's names: the Subscription object is
<release>-openshift-grafana-operator and the package is operator.package, where the original had one
name for both. Reads status.installPlanRef, falling back to scanning RequiresApproval and InstallReady
for a plan naming the package. Refuses any plan that does not, then waits for phase=Complete —
approving is not installing.

RBAC is release-managed at the OperatorGroup's wave (-2), one wave before the Job; only the Job is a
hook, at THE SUBSCRIPTION'S OWN WAVE (-1): Argo advances past a wave only when it is healthy, and a
Subscription with a pending unapproved plan and no installedCSV yet is Progressing — a Job one wave
later would wait on the wave that waits on it (a sibling chart measured that deadlock on a first sync).
Helm: post-install at weight -1, after the reclaim (-2) and before the gate (0).
*/ -}}
{{- if and .Values.operator.install .Values.installPlanApprover.enabled (eq .Values.operator.installPlanApproval "Manual") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openshift-grafana.fullname" . }}-installplan-approver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
# A Role, not a ClusterRole: every call is `-n "$NAMESPACE"`. Approving an InstallPlan installs an
# operator; a ClusterRole here would grant that in every namespace on the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshift-grafana.fullname" . }}-installplan-approver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # patch, not update: approval sets one field.
  - apiGroups: ["operators.coreos.com"]
    resources: ["installplans"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions"]
    verbs: ["get", "list", "watch"]
  # csv_phase() reads these; without the grant the two diagnostic paths that depend on a CSV phase are
  # dead and the log blames OLM for staging nothing (measured on a sibling chart).
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshift-grafana.fullname" . }}-installplan-approver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openshift-grafana.fullname" . }}-installplan-approver
subjects:
  - kind: ServiceAccount
    name: {{ include "openshift-grafana.fullname" . }}-installplan-approver
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openshift-grafana.fullname" . }}-installplan-approver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=true
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.installPlanApprover.backoffLimit }}
  activeDeadlineSeconds: {{ add .Values.installPlanApprover.waitSeconds 120 }}
  ttlSecondsAfterFinished: {{ .Values.installPlanApprover.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "openshift-grafana.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openshift-grafana.fullname" . }}-installplan-approver
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: approve-install-plan
          image: "{{ .Values.wait.image.repository }}:{{ .Values.wait.image.tag }}"
          resources:
            {{- toYaml .Values.wait.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail

              NAMESPACE="{{ .Release.Namespace }}"
              # The Subscription OBJECT and the PACKAGE are different names in this chart
              # (<release>-openshift-grafana-operator subscribes to grafana-operator); the original script
              # uses one name for both. SUBSCRIPTION names the object, PACKAGE anchors every CSV match.
              SUBSCRIPTION="{{ include "openshift-grafana.fullname" . }}-operator"
              PACKAGE={{ .Values.operator.package | quote }}
              # max 1: see the operator-wait Job. Below 5, integer division gives 0 and `seq 1 0` is empty.
              ATTEMPTS={{ max 1 (div .Values.installPlanApprover.waitSeconds 5) }}
              INTERVAL=5
              # Whether the csv-reclaim hook is in this release: decides if ResolutionFailed is waited on
              # (the reclaim will clear an orphan) or reported at once (nothing will). Templated as a
              # literal so the script reads the chart's decision, not a value that could be misspelled.
              RECLAIM_ENABLED={{ .Values.csvReclaim.enabled | quote }}

              # ONE budget for both loops. ATTEMPTS is computed once and used twice, so each wait used to
              # get the full waitSeconds while activeDeadlineSeconds allows waitSeconds + 120 — the kubelet
              # killed the pod part-way with no message of its own. Same fix as the operator-wait Job.
              DEADLINE=$(( $(date +%s) + {{ .Values.installPlanApprover.waitSeconds }} ))
              out_of_time() { [ "$(date +%s)" -ge "$DEADLINE" ]; }

              log()  { echo "[installplan-approver] $*"; }
              fail() { echo "[installplan-approver] FAILED: $*" >&2; exit 1; }

              plan_ref() {
                oc get subscriptions.operators.coreos.com "$SUBSCRIPTION" -n "$NAMESPACE" --ignore-not-found=true \
                   -o jsonpath='{.status.installPlanRef.name}' 2>/dev/null
              }
              plan_field() {
                oc get installplans.operators.coreos.com "$1" -n "$NAMESPACE" --ignore-not-found=true \
                   -o jsonpath="{$2}" 2>/dev/null
              }

              # Fast path: one API call when the plan is already approved.
              PLAN="$(plan_ref)"
              if [ -n "$PLAN" ] && [ "$(plan_field "$PLAN" .spec.approved)" = "true" ]; then
                log "InstallPlan ${PLAN} is already approved (phase=$(plan_field "$PLAN" .status.phase))"
                exit 0
              fi

              # stderr is NOT discarded. It used to be, which made a Forbidden indistinguishable from "OLM
              # has staged nothing" — and the read WAS Forbidden, because the RBAC above omitted
              # clusterserviceversions until 0.10.0. A permission problem must look like one.
              csv_phase() {
                oc get clusterserviceversions.operators.coreos.com -n "$NAMESPACE" --ignore-not-found=true \
                   -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.phase}{"\n"}{end}' \
                  | grep "^${PACKAGE}\.v" | head -1
              }

              # ---- Wait for a plan, OR for the operator to be installed without one ---------
              # OLM stages an InstallPlan only when there is work to do. Reinstalling over a CSV
              # that a previous `helm uninstall` left behind produces no plan at all, and the
              # Subscription's installPlanRef stays empty — so waiting only for a plan runs to
              # DeadlineExceeded on a cluster where the operator is already fine. Either outcome
              # ends this Job: a plan to approve, or a Succeeded CSV meaning nothing needs approving.
              # ResolutionFailed means OLM will never stage a plan, so waiting is pointless. The
              # usual cause is an orphaned CSV: `helm uninstall` removes the Subscription and OLM
              # leaves the CSV, then a new Subscription cannot resolve against an unreferenced CSV of
              # the same package. Detected rather than waited out, because the alternative is
              # DeadlineExceeded minutes later with nothing pointing at the cause.
              resolution_failure() {
                oc get subscriptions.operators.coreos.com "$SUBSCRIPTION" -n "$NAMESPACE" --ignore-not-found=true \
                   -o jsonpath='{range .status.conditions[?(@.type=="ResolutionFailed")]}{.status}{"|"}{.message}{end}' \
                  2>/dev/null
              }

              # OLM's verdict, reported once with its remedy, then exit 1. Called from inside the loop when
              # the reclaim is disabled (nothing will clear it) and after the loop when the budget ran out
              # while it was being waited on. One function, so both exits leave the same diagnosis.
              report_resolution_failure() {
                echo "[installplan-approver] FAILED: OLM cannot resolve subscription ${SUBSCRIPTION}, so no InstallPlan will ever be staged." >&2
                echo "  ${1#*|}" >&2
                case "$1" in
                  *"is not referenced by a subscription"*)
                    echo "" >&2
                    echo "  An orphaned ClusterServiceVersion is blocking it. helm uninstall removes the" >&2
                    echo "  Subscription and OLM leaves the CSV behind, which a new Subscription cannot" >&2
                    echo "  resolve against. Remove it and reinstall:" >&2
                    # Anchored on "/<package>.v" like every other match in this chart: `-o name` prints
                    # <type>/<name>, so "/" pins the start of the name. Unanchored, this printed an
                    # `oc delete` for other-<package>.v1 and <package>.1.2.3 — names the reclaim would never
                    # treat as this package — as the remedy a human is told to run.
                    oc get clusterserviceversions.operators.coreos.com -n "$NAMESPACE" --ignore-not-found=true -o name 2>/dev/null \
                      | grep "/${PACKAGE}\.v" | sed "s|^|    oc delete -n ${NAMESPACE} |" >&2 ;;
                esac
                exit 1
              }
              installed_csv() {
                oc get subscriptions.operators.coreos.com "$SUBSCRIPTION" -n "$NAMESPACE" --ignore-not-found=true \
                   -o jsonpath='{.status.installedCSV}' 2>/dev/null
              }

              log "waiting for an InstallPlan for ${SUBSCRIPTION}, or for its CSV to be Succeeded"
              RES=""
              for i in $(seq 1 "$ATTEMPTS"); do
                PLAN="$(plan_ref)"
                [ -n "$PLAN" ] && { log "subscription references InstallPlan ${PLAN}"; break; }
                CSV="$(csv_phase)"
                if [ "${CSV#*|}" = "Succeeded" ]; then
                  # A SUCCEEDED CSV IS "NOTHING TO APPROVE" ONLY IF OLM REPORTS IT AS THIS SUBSCRIPTION'S
                  # installedCSV. An orphan is exactly a Succeeded CSV no Subscription references, and with
                  # the reclaim enabled that CSV is about to be deleted, after which OLM stages a plan that
                  # needs approving. Exiting 0 here on the orphan (measured with the fake-oc harness: exit 0
                  # in 0.1 s, no patch ever issued) leaves that plan unapproved — under Argo CD both hooks
                  # share wave 0, so this Job reads the settled orphan before the reclaim has acted. Without
                  # the reclaim the old behaviour stands: the orphan's operator is running and nothing will
                  # change that, so there is nothing to wait for.
                  if [ "${RECLAIM_ENABLED}" != "true" ] || [ "$(installed_csv)" = "${CSV%|*}" ]; then
                    log "${CSV%|*} is Succeeded and no InstallPlan is pending — nothing to approve"
                    exit 0
                  fi
                  log "attempt ${i}/${ATTEMPTS}: ${CSV%|*} is Succeeded but no Subscription reports it as installedCSV — an orphan the csv-reclaim Job will clear; waiting for the plan that follows"
                fi
                RES="$(resolution_failure)"
                if [ "${RES%%|*}" = "True" ] && [ "${RECLAIM_ENABLED}" = "true" ] && ! out_of_time; then
                  # THE RECLAIM JOB IS CLEARING THIS. Under plain Helm the csv-reclaim hook (weight -2) has
                  # already run by the time this Job starts, but under ArgoCD both sit at sync-wave 0 — the
                  # Subscription's wave, which the approver cannot leave — and Argo runs a wave's hooks
                  # concurrently, so this Job can read ResolutionFailed while the reclaim is still confirming
                  # the orphan. Measured 2026-09-18 on CRC: the approver failed at once, the reclaim deleted
                  # the CSV seconds later, and the install only recovered on Argo's retried sync. So while the
                  # reclaim is enabled, ResolutionFailed is a state that is about to change: keep waiting
                  # inside the budget and let OLM re-resolve. Only at the deadline is it reported as final.
                  log "attempt ${i}/${ATTEMPTS}: ResolutionFailed — the csv-reclaim Job clears an orphaned CSV in this state; waiting for OLM to re-resolve"
                  sleep "$INTERVAL"
                  continue
                fi
                [ "${RES%%|*}" = "True" ] && report_resolution_failure "$RES"
                log "attempt ${i}/${ATTEMPTS}: no installPlanRef, csv=${CSV:-<none>}"
                out_of_time && break
                sleep "$INTERVAL"
              done
              # THE LOOP HAS TWO CLOCKS. ATTEMPTS*INTERVAL equals the budget, so the attempt count runs out
              # BEFORE the deadline whenever the API answers faster than the per-iteration overhead needs to
              # drift past 5 s in total — measured with an instant fake oc: 4/4 attempts consumed, deadline not
              # reached, and the ResolutionFailed diagnosis replaced by the generic "no plan names it" below.
              # If the last thing OLM said was ResolutionFailed, that is the finding, with its remedy.
              [ -z "$PLAN" ] && [ "${RES%%|*}" = "True" ] && report_resolution_failure "$RES"
              # installPlanRef can lag or clear while a plan sits in RequiresApproval. The
              # ownership check below still applies, so this widens discovery only.
              if [ -z "$PLAN" ]; then
                log "no installPlanRef; scanning for a staged plan that names ${SUBSCRIPTION}"
                for phase in RequiresApproval InstallReady; do
                  for cand in $(oc get installplans.operators.coreos.com -n "$NAMESPACE" --ignore-not-found=true \
                       -o jsonpath="{range .items[?(@.status.phase=='${phase}')]}{.metadata.name}{' '}{end}" \
                      2>/dev/null); do
                    names="$(plan_field "$cand" '.spec.clusterServiceVersionNames[*]')"
                    # Anchored on "${PACKAGE}.v" — a CSV name is <package>.v<version>, so the bare
                    # substring also matched a DIFFERENT package that merely starts the same way, e.g.
                    # grafana-operator-community.v1.2.3 satisfying *grafana-operator*.
                    case "$names" in
                      *"${PACKAGE}.v"*) PLAN="$cand"
                        log "found ${PLAN} in phase ${phase} for ${names}"; break ;;
                    esac
                  done
                  [ -n "$PLAN" ] && break
                done
              fi

              [ -n "$PLAN" ] || fail "subscription ${SUBSCRIPTION} never referenced an InstallPlan, and
                no staged plan names it. Inspect:
                  oc describe subscriptions.operators.coreos.com ${SUBSCRIPTION} -n ${NAMESPACE}
                  oc get installplans.operators.coreos.com -n ${NAMESPACE} -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,APPROVED:.spec.approved,CSV:.spec.clusterServiceVersionNames[*]
                A missing catalog source or an unresolvable channel presents exactly like this."

              # OLM can bundle co-installed operators into one plan, so the CSV list is logged.
              CSVS="$(plan_field "$PLAN" '.spec.clusterServiceVersionNames[*]')"
              log "InstallPlan ${PLAN} installs: ${CSVS:-<unknown>}"
              # Same anchor as the discovery loop above, and it matters more here: this is the guard that
              # refuses to approve a plan this chart did not cause, and approving a plan installs an operator.
              case "$CSVS" in
                *"${PACKAGE}.v"*) : ;;
                *) fail "InstallPlan ${PLAN} does not mention ${PACKAGE} (it installs: ${CSVS}).
                Refusing to approve a plan this chart did not cause. Inspect:
                  oc get installplans.operators.coreos.com -n ${NAMESPACE} -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,APPROVED:.spec.approved,CSV:.spec.clusterServiceVersionNames[*]" ;;
              esac

              if [ "$(plan_field "$PLAN" .spec.approved)" != "true" ]; then
                log "approving ${PLAN}"
                oc patch installplans.operators.coreos.com "$PLAN" -n "$NAMESPACE" --type merge \
                   -p '{"spec":{"approved":true}}' \
                  || fail "could not patch InstallPlan ${PLAN}. Inspect: oc describe installplans.operators.coreos.com ${PLAN} -n ${NAMESPACE}"
              fi

              # Without this the Job succeeds on the patch and the failure lands on the next Job.
              log "waiting for ${PLAN} to reach Complete"
              PHASE=""
              for i in $(seq 1 "$ATTEMPTS"); do
                PHASE="$(plan_field "$PLAN" .status.phase)"
                [ "$PHASE" = "Complete" ] && { log "${PLAN} is Complete"; break; }
                log "attempt ${i}/${ATTEMPTS}: phase=${PHASE:-<none>}"
                out_of_time && break
                sleep "$INTERVAL"
              done
              [ "$PHASE" = "Complete" ] || fail "${PLAN} is phase '${PHASE:-<none>}'.
                Inspect: oc describe installplans.operators.coreos.com ${PLAN} -n ${NAMESPACE}"

              # Every plan in the namespace, including ones this Job did not touch.
              log "InstallPlans in ${NAMESPACE}:"
              oc get installplans.operators.coreos.com -n "$NAMESPACE" --ignore-not-found=true \
                 -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,APPROVED:.spec.approved,CSV:.spec.clusterServiceVersionNames[*] \
                2>&1 | sed 's/^/  /'

              log "done — the operator's InstallPlan is approved and complete"
{{- end }}
