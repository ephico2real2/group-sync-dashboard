{{- /*
The two secrets the login needs, MINTED ON THE CLUSTER, never in the manifest.

The first draft rendered them with `lookup` reusing what existed. `lookup` is empty under
`helm template`, which is what Argo CD's repo-server and Kustomize's helmCharts run (no cluster):
every render minted new values, the Application drifted permanently, and every sync rotated
Grafana's admin password and signed every session out — the same class of failure a `lookup` of
the apps domain had under Argo on 2026-09-03 (the operator: design for Argo CD, Flux and
Kustomize, not only Helm).

So a hook Job creates each Secret ONLY IF IT DOES NOT EXIST, before anything that mounts it:
pre-install/pre-upgrade under Helm and Flux, PreSync under Argo CD, a plain Job under Kustomize.
The values live nowhere but the cluster; there is nothing to diff, nothing to rotate, nothing to
`ignoreDifferences`. A consumer who brings credentials from a secret manager sets
grafana.admin.existingSecret / grafana.auth.oauthProxy.cookieSecret and the corresponding mint
is skipped (a cookieSecret VALUE renders a plain Secret — deterministic, so it does not drift).

- `<name>-admin`: Grafana's own admin (user auth.adminUser under the OpenShift login, `admin`
  otherwise; a random 32-character password). The operator provisions through it.
- `<name>-oauth-cookie`: the oauth-proxy's session key (auth.mode openshift only).
*/ -}}
{{- $name := include "openshift-grafana.fullname" . }}
{{- $openshift := eq .Values.grafana.auth.mode "openshift" }}
{{- $mintAdmin := not .Values.grafana.admin.existingSecret }}
{{- $mintCookie := and $openshift (not .Values.grafana.auth.oauthProxy.cookieSecret) }}
{{- if and $openshift .Values.grafana.auth.oauthProxy.cookieSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-oauth-cookie
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
type: Opaque
data:
  session_secret: {{ .Values.grafana.auth.oauthProxy.cookieSecret | b64enc | quote }}
{{- end }}
{{- if or $mintAdmin $mintCookie }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
  annotations:
    # Hooks too, ahead of the Job: a pre-install/pre-upgrade hook runs BEFORE the manifest is applied,
    # so an ordinary ServiceAccount would not exist when the Job's pod is created (measured: the first
    # run sat on "serviceaccount not found" to its deadline). Kept after the run (no hook-succeeded).
    # One Argo wave BEFORE the Job (-1), made explicit: without it Argo takes helm.sh/hook-weight (-10)
    # as the wave, measured on this chart's Application at b96b5450 (review of #215, Grok M2 / OB3 M2).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=true
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
# `create` cannot be name-scoped in RBAC, so this Role can create any Secret in the namespace;
# `get` is scoped to the two names. The identity exists for the one hook and nothing else runs as it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
  annotations:
    # Hooks too, ahead of the Job: a pre-install/pre-upgrade hook runs BEFORE the manifest is applied,
    # so an ordinary ServiceAccount would not exist when the Job's pod is created (measured: the first
    # run sat on "serviceaccount not found" to its deadline). Kept after the run (no hook-succeeded).
    # One Argo wave BEFORE the Job (-1), made explicit: without it Argo takes helm.sh/hook-weight (-10)
    # as the wave, measured on this chart's Application at b96b5450 (review of #215, Grok M2 / OB3 M2).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=true
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ $name }}-admin", "{{ $name }}-oauth-cookie"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
  annotations:
    # Hooks too, ahead of the Job: a pre-install/pre-upgrade hook runs BEFORE the manifest is applied,
    # so an ordinary ServiceAccount would not exist when the Job's pod is created (measured: the first
    # run sat on "serviceaccount not found" to its deadline). Kept after the run (no hook-succeeded).
    # One Argo wave BEFORE the Job (-1), made explicit: without it Argo takes helm.sh/hook-weight (-10)
    # as the wave, measured on this chart's Application at b96b5450 (review of #215, Grok M2 / OB3 M2).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=true
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-secrets
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
  annotations:
    # Before the Grafana CR and the proxy that mount these (PreSync runs before every wave) AND after
    # the apply: an upgrade from a chart that rendered these Secrets itself deletes them as it drops
    # them from the manifest — measured on CRC 2026-09-19: the pre-upgrade run kept both, the upgrade
    # removed both, the pod could not mount the cookie — and a Secret deleted by hand is the same case.
    # The post run re-mints whatever is absent before the gate waits on the pods; the Sync-phase Argo
    # equivalent runs in wave -1, ahead of the Grafana CR at 0.
    argocd.argoproj.io/hook: PreSync,Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Replace=true
    helm.sh/hook: pre-install,pre-upgrade,post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: {{ .Values.wait.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "openshift-grafana.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}-secrets
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mint
          image: "{{ .Values.wait.image.repository }}:{{ .Values.wait.image.tag }}"
          resources:
            {{- toYaml .Values.wait.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: NAME
              value: {{ $name | quote }}
            - name: MINT_ADMIN
              value: {{ $mintAdmin | quote }}
            - name: MINT_COOKIE
              value: {{ $mintCookie | quote }}
            - name: ADMIN_USER
              value: {{ ($openshift | ternary .Values.grafana.auth.adminUser "admin") | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              log() { echo "$(date -u +%H:%M:%SZ) $*"; }
              # cut, not head, as the last stage: nothing upstream is killed by SIGPIPE, which pipefail
              # would turn into a failed mint (review of #215, Grok N1).
              random() { head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | cut -c1-32; }
              # Create only if absent. A create that loses a race to another minter (two syncs at
              # once) answers AlreadyExists, which is the same outcome: the Secret exists, keep it.
              mint() {
                local secret="$1"; shift
                if oc get secret "$secret" -n "$NAMESPACE" >/dev/null 2>&1; then
                  log "$secret exists; kept"
                  return 0
                fi
                if out="$(oc create secret generic "$secret" -n "$NAMESPACE" "$@" 2>&1)"; then
                  log "$secret created"
                elif printf '%s' "$out" | grep -q 'AlreadyExists\|already exists'; then
                  log "$secret appeared meanwhile; kept"
                else
                  echo "FAIL: could not create $secret: $out" >&2
                  exit 1
                fi
              }
              if [ "$MINT_ADMIN" = "true" ]; then
                mint "$NAME-admin" --from-literal=GF_SECURITY_ADMIN_USER="$ADMIN_USER" --from-literal=GF_SECURITY_ADMIN_PASSWORD="$(random)"
              fi
              if [ "$MINT_COOKIE" = "true" ]; then
                mint "$NAME-oauth-cookie" --from-literal=session_secret="$(random)"
              fi
              log "done"
{{- end }}
