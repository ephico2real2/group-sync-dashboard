{{- /*
The two secrets the login needs, generated ONCE and reused: `lookup` reads what already exists so an
upgrade keeps the same values — a value generated inline in a container arg would be minted on every
`helm upgrade` and sign every session out (the dashboard chart learned that). `lookup` is empty
under `helm template` and dry-run, which is correct: those must not depend on cluster state.

- `<name>-admin`: Grafana's own admin (user auth.adminUser, a random password). The operator
  provisions through it; with auth.mode openshift the login form is off and the OpenShift identity
  that matches the user is Grafana's server admin. Skipped when grafana.admin.existingSecret is set.
- `<name>-oauth-cookie`: the oauth-proxy's session key (auth.mode openshift only).
*/ -}}
{{- if not .Values.grafana.admin.existingSecret }}
{{- $adminName := printf "%s-admin" (include "openshift-grafana.fullname" .) }}
{{- $existingAdmin := lookup "v1" "Secret" .Release.Namespace $adminName }}
{{- $password := "" }}
{{- if $existingAdmin }}{{ $password = index $existingAdmin.data "GF_SECURITY_ADMIN_PASSWORD" }}{{ else }}{{ $password = randAlphaNum 32 | b64enc }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
type: Opaque
data:
  GF_SECURITY_ADMIN_USER: {{ (eq .Values.grafana.auth.mode "openshift" | ternary .Values.grafana.auth.adminUser "admin") | b64enc | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ $password | quote }}
{{- end }}
{{- if eq .Values.grafana.auth.mode "openshift" }}
---
{{- $cookieName := printf "%s-oauth-cookie" (include "openshift-grafana.fullname" .) }}
{{- $existingCookie := lookup "v1" "Secret" .Release.Namespace $cookieName }}
{{- $cookie := "" }}
{{- if .Values.grafana.auth.oauthProxy.cookieSecret }}{{ $cookie = .Values.grafana.auth.oauthProxy.cookieSecret | b64enc }}
{{- else if $existingCookie }}{{ $cookie = index $existingCookie.data "session_secret" }}
{{- else }}{{ $cookie = randAlpha 32 | b64enc }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cookieName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
type: Opaque
data:
  session_secret: {{ $cookie | quote }}
{{- end }}
