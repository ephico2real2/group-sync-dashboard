{{- /*
The identity Grafana presents to thanos-querier. A long-lived token Secret bound to the account
(kubernetes.io/service-account-token): the datasource reads `token` from it through valuesFrom, so
the token never appears in a rendered manifest and never in Git.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openshift-grafana.fullname" . }}-thanos
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openshift-grafana.fullname" . }}-thanos-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "openshift-grafana.fullname" . }}-thanos
type: kubernetes.io/service-account-token
