{{- /*
grafana-operator v5 from the catalog, serving this namespace (OwnNamespace: the CSV supports
OwnNamespace, SingleNamespace, MultiNamespace and AllNamespaces — measured on v5.24.0). With
operator.install=false a platform team's AllNamespaces operator reconciles the CRs instead.
*/ -}}
{{- if .Values.operator.install }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ include "openshift-grafana.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-grafana.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  channel: {{ .Values.operator.channel | quote }}
  installPlanApproval: {{ .Values.operator.installPlanApproval }}
  name: grafana-operator
  source: {{ .Values.operator.source }}
  sourceNamespace: {{ .Values.operator.sourceNamespace }}
  {{- with .Values.operator.startingCSV }}
  startingCSV: {{ . | quote }}
  {{- end }}
{{- end }}
