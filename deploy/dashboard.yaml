# In-cluster deployment of the GroupSync dashboard, observing the cluster it runs on.
#
# PLAN §13 Q3 notes the tradeoff: running on an observed cluster means that cluster cannot
# report its own outage. That is acceptable for a single-cluster first slice and is the
# reason the multi-cluster form should eventually run standalone.
#
#   oc apply -f deploy/dashboard.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: group-sync-dashboard
  namespace: group-sync-dashboard
---
# PLAN §4: read-only, no watch, no write verbs anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: group-sync-reader
rules:
  - apiGroups: ["redhatcop.redhat.io"]
    resources: ["groupsyncs"]
    verbs: ["get", "list"]
  - apiGroups: ["user.openshift.io"]
    resources: ["groups"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: group-sync-dashboard-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: group-sync-reader
subjects:
  - kind: ServiceAccount
    name: group-sync-dashboard
    namespace: group-sync-dashboard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: group-sync-dashboard-config
  namespace: group-sync-dashboard
data:
  clusters.yaml: |
    pollIntervalSeconds: 60
    scheduleGraceSeconds: 120
    clusters:
      # Observing the cluster we run on: the pod's own projected ServiceAccount token and
      # the cluster CA are already mounted, so no Secret of our own is needed. Reading the
      # token from a file (rather than an env var) is also what makes rotation work —
      # kubelet rewrites this file in place and config.resolve_token re-reads it per poll.
      - name: crc-local
        apiUrl: https://kubernetes.default.svc
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
        caBundleFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        enabled: true
---
# The accumulated timeline is the one thing that cannot be re-fetched from the API
# (PLAN §2), so it gets a volume rather than an emptyDir — an emptyDir would silently
# reset the history on every pod restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: group-sync-dashboard-data
  namespace: group-sync-dashboard
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: group-sync-dashboard
  namespace: group-sync-dashboard
  labels: {app: group-sync-dashboard}
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the poller owns a SQLite file on a ReadWriteOnce volume,
  # so two overlapping pods would contend for it during a rollout.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: group-sync-dashboard}
  template:
    metadata:
      labels: {app: group-sync-dashboard}
    spec:
      serviceAccountName: group-sync-dashboard
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dashboard
          image: image-registry.openshift-image-registry.svc:5000/group-sync-dashboard/group-sync-dashboard:0.1.0
          imagePullPolicy: Always
          ports:
            - {containerPort: 8080, name: http}
          env:
            - {name: GSD_CONFIG, value: /etc/gsd/clusters.yaml}
            - {name: GSD_DB_PATH, value: /data/gsd.db}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/gsd, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          # Liveness is /healthz, readiness is /readyz — and neither is gated on a
          # reachable cluster. An unreachable cluster is a thing this dashboard exists to
          # display, so failing a probe for one would take it down exactly when it has
          # something to report (PLAN §5).
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: group-sync-dashboard-config}
        - name: data
          persistentVolumeClaim: {claimName: group-sync-dashboard-data}
        # readOnlyRootFilesystem is on, so anything that writes to /tmp needs a volume.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: group-sync-dashboard
  namespace: group-sync-dashboard
spec:
  selector: {app: group-sync-dashboard}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# NOTE: no authentication in front of this route. The dashboard aggregates group
# membership, which is sensitive — PLAN §13 Q4 leaves "OIDC in front, or internal-only?"
# open. Do not expose this route on a shared cluster until that is answered.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: group-sync-dashboard
  namespace: group-sync-dashboard
spec:
  to: {kind: Service, name: group-sync-dashboard}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
