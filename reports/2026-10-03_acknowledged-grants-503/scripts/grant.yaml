# The walk's temporary grant, for the screenshots only (after reports/2026-10-03_platform-users-255/scripts/grant.yaml):
# `developer` passes the wide tier (`list clusterrolebindings`) while scripts/shots.py captures the Namespace audit
# tab. Created after every read, so it is in no number. Removed by run.sh's explicit delete and by its exit trap,
# both through the label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gsd-walk-503-crb-update
  labels:
    walk.gsd.lab/run: acknowledged-503-2026-10-03
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["list", "update"]   # list: the wide tier (visibilityAdminSarVerb); update: the cluster-admin tier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gsd-walk-503-crb-update-developer
  labels:
    walk.gsd.lab/run: acknowledged-503-2026-10-03
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gsd-walk-503-crb-update
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: developer
