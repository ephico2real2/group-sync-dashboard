# #310 Part A's two temporary grants, 2026-09-30: the two of SPEC_S4c §3.12's three that a self-login-only walk needs
# (the third, `developer` on the token-reader Role, served the lookup, and this walk looks nothing up). Both are
# reports/2026-09-27_epic-c-walk-432/prepared/walk-rbac.yaml's grants 1 and 3, relabelled for this run, so each
# removal is one label selector and provable.
#
# Created with `oc create` (scripts/run.sh) before the walk's values are deployed. Removed at the end by
# scripts/sweep.sh, in this order:
#   - 2 (`developer`'s) at any time: without it the walk cluster's polls answer 403, and nothing else reads it;
#   - 1 (the ServiceAccount's) only once the chart's own group-sync-dashboard-fleet-account Role in openshift-config
#     names ldap-oauth-bind-secret again (after `release-crc.sh --argocd main`), so the dashboard ServiceAccount's
#     permissions never drop (the operator's rule of 2026-09-25).

# 1. KEEP the dashboard ServiceAccount's `get` on the fleet password Secret while the walk's values point the chart's
#    fleet-account grant at the walk-only Secret instead. The same subject, resourceName and verb as the chart's own
#    group-sync-dashboard-fleet-account Role in openshift-config. Nothing in the walk's configuration reads this
#    Secret: the grant only keeps what the ServiceAccount already has (evidence/offline-rbac-diff.txt: without it the
#    walk values REMOVE exactly this atom).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gsd-walk-keep-fleet-password-get
  namespace: openshift-config
  labels:
    walk.gsd.lab/run: selflogin-310-2026-09-30
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ldap-oauth-bind-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gsd-walk-keep-fleet-password-get
  namespace: openshift-config
  labels:
    walk.gsd.lab/run: selflogin-310-2026-09-30
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gsd-walk-keep-fleet-password-get
subjects:
  - kind: ServiceAccount
    name: group-sync-dashboard
    namespace: group-sync-dashboard
---
# 2. A self-login cluster polls as `developer`'s own session, so `developer` reads what the estate's remote poller
#    identity reads — the ClusterRole the poller ServiceAccount is bound to, no wider.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gsd-walk-developer-poller
  labels:
    walk.gsd.lab/run: selflogin-310-2026-09-30
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: group-sync-dashboard-cluster-poller
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: developer
