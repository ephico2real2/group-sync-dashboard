# WALK-ONLY VALUES — Epic C's lab walk (#383), 2026-09-27: SPEC_S4c §3.12 steps 4-5 (`userSelfLogin` as the htpasswd
# `developer`). Deployed with `local-development/release-crc.sh --values <this file>` (Helm mode) and replaced at the
# end by `release-crc.sh --argocd main`. Not a release file: nothing here is meant to outlive the walk.
#
# Everything below is environments/crc.yaml at 22a485c, verbatim, except two blocks, each marked WALK:
#   1. `clusters` is the Argo CD Application's own override (gitops/argocd-application-dashboard.yaml, valuesObject:
#      `dashboard` alone), plus ONE walk entry. shared-rnd keeps polling through its retrieved Secret, as it does under
#      Argo; the mock is left out, as Argo leaves it out.
#   2. `clusterConfig.fleetAccount`: the chart-level username is `developer`, the password Secret is a walk-only Secret
#      holding developer's password, and the daily ping is OFF.
#
# WHY THE PING IS OFF (the walk's hard rule): the fleet password Secret is process-wide —
# gsd/fleetlookup.py#fleet_password reads the one configured Secret for EVERY account — and the ping pings every
# account a retrieved cluster's Secret records. gsd-cluster-shared-rnd records the fleet account, so with the ping on,
# this Secret's password would be sent AS THE FLEET ACCOUNT's within one discovery cadence. Measured on the
# deployed code in reports/2026-09-27_epic-c-walk/hermetic/test_walk_password_scope.py: with the ping on, 2
# wrong-password authorizes reach the fleet account (3 after a restart); with this file's arrangement, 0 —
# every authorize is developer's.

oauthProxy:
  apiTokenAccess:
    enabled: true

config:
  unmanagedAudit:
    mode: "log"

logLevel: DEBUG

loginCapture:
  enabled: true
  source: audit-log

rbac:
  namespaces: true

kyverno:
  metricsUrl: "http://kyverno-svc-metrics.kyverno.svc:8000/metrics,http://kyverno-reports-controller-metrics.kyverno.svc:8000/metrics,http://kyverno-background-controller-metrics.kyverno.svc:8000/metrics"

reporting:
  namespaceMetadata:
    labels:
      - company.net/mnemonic
      - company.net/app-environment
  namespaceGroupLabel: company.net/oud-group
  namespaceSelector:
    labels:
      - company.net/mnemonic
      - company.net/app-environment
  window:
    enabled: true
    timezone: "America/New_York"
    start: "22:00"
    end: "06:00"
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
  schedules:
    - name: nightly-namespace-access
      schedule: "0 22 * * *"
      report: namespace-access
      params:
        selectors:
          company.net/mnemonic: [demo, beta]
    - name: quarterly-compliance
      schedule: "0 6 1 1,4,7,10 *"
      report: compliance-snapshot
      retention: {keepPerSchedule: 12, days: 2555}
    - name: biweekly-groups
      schedule: "0 6 1,16 * *"
      report: groups
      enabled: false

# WALK 1 of 2: the Argo Application's clusters override, plus the walk's one self-login entry.
clusters:
  - name: dashboard
    dashboardController: true
    apiUrl: https://kubernetes.default.svc
    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    caBundleFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    enabled: true
  # SPEC_S4c §3.12 step 4: polled on developer's own session against this CRC's API (the injected trusted bundle
  # verifies api.crc.testing and the OAuth route, as it does for shared-rnd).
  - name: walk-self-login
    apiUrl: https://api.crc.testing:6443
    userSelfLogin: true
    ldapConnectionBootstrap: developer
    enabled: true

# WALK 2 of 2: developer, a walk-only password Secret, and no ping (above).
clusterConfig:
  secrets:
    writes:
      enabled: true
  fleetAccount:
    username: developer
    passwordSecret:
      namespace: group-sync-dashboard
      name: gsd-walk-developer-password
      key: password
    ping:
      enabled: false

platformNamespaces:
  additionalSuffixes: ["-operator", "-manager", "-provisioner"]
  additionalNames: ["kyverno", "group-sync-dashboard"]
