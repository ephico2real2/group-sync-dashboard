# The walk's temporary grant (after reports/2026-10-02_gui-cleanup-542/scripts/grant.yaml): `developer` passes the
# wide and cluster-admin tiers for the length of the walk, so the dashboard's own reads of
# /api/clusters/dashboard/user-bindings are unrestricted and the Namespace audit tab can be captured. Created by
# run.sh, removed by run.sh's explicit delete and by its exit trap, both through the label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gsd-walk-255-crb-update
  labels:
    walk.gsd.lab/run: platform-users-255-2026-10-03
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["list", "update"]   # list: the wide tier (visibilityAdminSarVerb); update: the cluster-admin tier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gsd-walk-255-crb-update-developer
  labels:
    walk.gsd.lab/run: platform-users-255-2026-10-03
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gsd-walk-255-crb-update
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: developer
