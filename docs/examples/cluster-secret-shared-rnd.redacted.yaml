# The hand-made cluster Secret that `shared-rnd` used BEFORE #284, kept as a worked example of the
# shape a Secret-declared cluster takes. Exported from the reference lab on 2026-09-22 and
# REDACTED: the real object carried a 1377-character ServiceAccount bearer token with cluster-wide
# read, which does not belong in a repository. Everything else is verbatim.
#
# This is what `saTokenLookup` REPLACES. With the stanza declared in values, the dashboard logs in
# as clusterConfig.fleetAccount, reads the target's poller ServiceAccount token and writes this
# object itself — nobody hand-makes one (SPEC_S4b, #284).
apiVersion: v1
kind: Secret
metadata:
  name: gsd-cluster-shared-rnd
  namespace: group-sync-dashboard
  labels:
    environment: rnd
    groupsync-dashboard.io/secret-type: cluster
type: Opaque
stringData:
  name: shared-rnd
  server: https://api.crc.testing:6443
  enabled: "true"
  visibility: inherit
  identity: same-as-host
  config: |
{
      "bearerToken": "<redacted \u2014 a live ServiceAccount token was here>",
      "tlsClientConfig": {
            "insecure": false,
            "caData": "<9612 chars of base64 PEM \u2014 the target's CA>"
      }
}
