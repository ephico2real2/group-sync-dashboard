* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
body {
  --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  margin: 0;
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: var(--text-base);
  line-height: 1.5;
  background:
    radial-gradient(1200px 520px at 50% -12%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
    linear-gradient(180deg, var(--page-2), var(--page) 420px);
  background-attachment: fixed;
  background-color: var(--page);
  min-height: 100dvh;
}
body[data-page="clusters"] { --accent: var(--tab-clusters); }
.wrap { max-width: 1180px; margin: 0 auto; padding: var(--space-10) var(--space-10) 64px; min-width: 0; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: var(--space-10); top: var(--space-10); z-index: 40; background: var(--surface-1); padding: var(--space-3) var(--space-5); }
header.top {
  display: flex; align-items: baseline; gap: var(--space-6); flex-wrap: wrap;
  padding-bottom: var(--space-7); border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
  margin-bottom: var(--space-6);
}
header.top h1 { font-size: var(--text-xl); margin: 0; letter-spacing: -0.01em; }
header.top .sub { color: var(--text-muted); font-size: var(--text-sm); }
header.top .spacer { flex: 1; }
.shell-prefs { display: inline-flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.shell-prefs .pref { display: inline-flex; align-items: center; gap: var(--space-3); }
.shell-prefs label { color: var(--text-secondary); font-size: var(--text-sm); }
@media (max-width: 520px) {
  .shell-prefs .pref { flex-direction: column; align-items: flex-start; gap: 0; }
}
select, button, a.btn, input, textarea {
  font: inherit; font-size: var(--text-md); color: var(--text-primary);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 5px 9px; cursor: pointer;
  max-width: 100%;
}
input, textarea { cursor: text; width: 100%; }
textarea { font-family: var(--font-mono); resize: vertical; min-height: 4.5em; overflow-wrap: anywhere; }
button:hover, select:hover, a.btn:hover { border-color: var(--baseline); }
a.btn { text-decoration: none; display: inline-block; }
.tabs { display: inline-flex; gap: var(--space-2); flex-wrap: wrap; max-width: 100%; }
.tab {
  position: relative;
  background: none; border: 0; border-radius: var(--radius-md) var(--radius-md) 0 0;
  padding: 7px var(--space-6) 9px; font-size: var(--text-md); font-weight: 500;
  color: var(--text-secondary); cursor: default;
  transition: color 160ms ease, background-color 160ms ease;
}
.tab:hover { color: var(--text-primary); background: var(--zebra); }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tab[aria-current="page"]::after {
  content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px;
  background: var(--accent); border-radius: 3px 3px 0 0;
}
@media (forced-colors: active) {
  .tab[aria-current="page"]::after { background: Highlight; forced-color-adjust: none; }
}
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--space-8); margin-bottom: var(--space-7);
  box-shadow: var(--elev-1); min-width: 0; max-width: 100%;
}
main > .card:first-child { border-top: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.card > h2, .card > h3 { font-family: var(--font-ui); letter-spacing: -0.01em; margin: 0 0 var(--space-4); }
.card > h2 { font-size: var(--text-lg); }
.card > h3 { font-size: var(--text-md); color: var(--text-secondary); }
.card > h2::before, .card > h3::before {
  content: ""; display: inline-block; vertical-align: middle;
  width: 3px; height: 0.95em; margin-right: var(--space-4); border-radius: var(--radius-xs);
  background: var(--rk, var(--accent));
}
.badge {
  display: inline-flex; align-items: center; gap: var(--space-3);
  font-size: var(--text-sm); font-weight: 500; color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 2px 9px 2px 7px;
  white-space: nowrap;
}
.badge .glyph { width: 9px; height: 9px; flex: none; display: inline-block; }
.badge.ok .glyph { background: var(--status-good); border-radius: var(--radius-round); }
.badge.warning .glyph { background: var(--status-warning); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.badge.critical .glyph { background: var(--status-critical); border-radius: 1px; }
.badge.unknown .glyph { border: 1.5px solid var(--status-unknown); border-radius: var(--radius-round); background: none; }
.muted { color: var(--text-muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.empty-note { color: var(--text-muted); font-size: var(--text-md); padding: var(--space-5) 0; }
.filterbar-note { font-size: var(--text-sm); color: var(--text-muted); overflow-wrap: anywhere; }
.linkish {
  background: none; border: 0; padding: 0; cursor: pointer;
  font: inherit; font-size: var(--text-sm); color: var(--drill-text); text-decoration: underline;
}
.linkish:hover { color: var(--text-primary); }
.err { color: var(--status-critical); overflow-wrap: anywhere; }
.rp-chip {
  display: inline-block; font-family: var(--font-mono); font-size: var(--text-micro); font-weight: 500;
  letter-spacing: .02em; padding: var(--space-1) var(--space-4); border-radius: 5px;
  border: 1px solid currentColor; white-space: normal; overflow-wrap: anywhere; max-width: 100%;

.rp-chip.src-values { color: var(--k-rbac); }
.rp-chip.src-secret { color: var(--k-identity); }
.rp-chip.src-in-cluster { color: var(--k-access); }
.rp-count { font-weight: 400; margin-left: var(--space-3); vertical-align: middle; color: var(--text-muted); border-color: var(--border); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-3); min-width: 0; }
.ns-controls { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-5); }
.ns-controls label { font-size: var(--text-sm); color: var(--text-secondary); }
.row-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
.grow { flex: 1; min-width: 0; }
.kv { display: grid; grid-template-columns: minmax(88px, 34%) 1fr; gap: var(--space-3) var(--space-5);
  padding: var(--space-3) 0; border-bottom: 1px solid var(--gridline); font-size: var(--text-sm); min-width: 0; }
.kv .k { color: var(--text-muted); font-size: var(--text-xs); letter-spacing: .04em; text-transform: uppercase; overflow-wrap: anywhere; min-width: 0; }
.kv .v { overflow-wrap: anywhere; min-width: 0; }
.btn-acc { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.shape-ex {
  margin-top: var(--space-7); padding: var(--space-5) var(--space-6);
  border: 1px dashed var(--border); border-radius: var(--radius-md);
  background: var(--zebra); opacity: 0.86;
}
.shape-ex > .card { margin-bottom: 0; box-shadow: none; }
.field { display: flex; flex-direction: column; gap: var(--space-2); margin: 0 0 var(--space-6); min-width: 0; }
.field > span.lbl, .field > label { font-size: var(--text-sm); color: var(--text-secondary); }
.hint { font-size: var(--text-sm); color: var(--text-muted); overflow-wrap: anywhere; }
.choices { display: flex; flex-direction: column; gap: var(--space-3); }
.choice { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-3); min-width: 0; }
.choice input { width: auto; flex: none; }
.warn-box {
  margin-top: var(--space-3); padding: var(--space-5) var(--space-6);
  border-left: 3px solid var(--status-warning);
  background: color-mix(in srgb, var(--status-warning) 8%, transparent);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  font-size: var(--text-md); color: var(--text-secondary); overflow-wrap: anywhere;
}
.warn-box strong { color: var(--text-primary); }
.add-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-7); min-width: 0; }
@media (min-width: 900px) {
  .add-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
.yaml-pane { min-width: 0; }
.yaml {
  font-family: var(--font-mono); font-size: var(--text-sm); white-space: pre-wrap;
  overflow-wrap: anywhere; word-break: break-word; margin: 0; max-width: 100%;
  background: var(--zebra); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-6);
}
.acts { display: flex; flex-wrap: wrap; gap: var(--space-4); margin-top: var(--space-4); }
.foot { margin-top: var(--space-5); font-size: var(--text-sm); color: var(--text-secondary); overflow-wrap: anywhere; }
.consq { font-size: var(--text-sm); color: var(--text-secondary); margin-top: var(--space-3); overflow-wrap: anywhere; }
h2 .chips { display: inline-flex; vertical-align: middle; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
:where(button, a, select, input, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

        const name = b.getAttribute("data-rotate-go");
        const field = document.getElementById("rotate-" + name);
        const msg = document.querySelector('[data-rotate-msg="' + name + '"]');
        if (field) field.value = "";
        if (msg) msg.textContent = "token overwritten in place — the old token is gone from the cluster on the write. The value is never shown.";
      });
    });
    document.querySelectorAll("[data-delete]").forEach(function (b) {
      b.addEventListener("click", function () {
        const name = b.getAttribute("data-delete");
        const msg = document.querySelector('[data-delete-msg="' + name + '"]');
        if (b.getAttribute("data-armed") !== "1") {
          b.setAttribute("data-armed", "1");
          b.textContent = "Confirm delete";
          if (msg) msg.textContent = "Removes the Secret. Cluster history stays, disabled.";
          return;
        }
        const idx = CONFIG.clusters.findIndex(function (c) { return c.name === name; });
        if (idx >= 0) {
          CONFIG.clusters.splice(idx, 1);
          paint();
          return;
        }
        if (msg) msg.textContent = "Shape example — would delete Secret " + name + "; history stays, disabled.";
      });
    });
  }
  function bindForm() {
    ["add-name", "add-server", "add-token", "add-ca-pem", "add-visibility", "add-identity"].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.addEventListener("input", refreshYaml);
      if (el) el.addEventListener("change", refreshYaml);
    });
    document.querySelectorAll('input[name="add-ca-mode"]').forEach(function (el) {
      el.addEventListener("change", refreshCa);
    });
    const addLab = document.getElementById("add-label-add");
    if (addLab) addLab.addEventListener("click", function () {
      const k = (document.getElementById("add-label-key").value || "").trim();
      const v = (document.getElementById("add-label-val").value || "").trim();
      if (!k) return;
      formLabels[k] = v;
      document.getElementById("add-label-key").value = "";
      document.getElementById("add-label-val").value = "";
      refreshLabelChips();
      refreshYaml();
    });
    const test = document.getElementById("add-test");
    if (test) test.addEventListener("click", function () {
      const box = document.getElementById("test-result");
      if (box) box.hidden = false;
    });
    const create = document.getElementById("add-create");
    if (create) create.addEventListener("click", function () {
      const name = (document.getElementById("add-name").value || "").trim();
      const server = (document.getElementById("add-server").value || "").trim();
      const token = document.getElementById("add-token").value || "";
      const msg = document.getElementById("add-form-msg");
      if (!name || !server || !token) {
        if (msg) msg.textContent = "name, server and a bearer token are required.";
        return;
      }
      if (CONFIG.clusters.some(function (c) { return c.name === name; })) {
        if (msg) msg.textContent = "a cluster with that name is already listed — a Secret would win over values.";
        return;
      }
      const caMode = (document.querySelector('input[name="add-ca-mode"]:checked') || {}).value;
      const labs = {};
      Object.keys(formLabels).forEach(function (k) { labs[k] = formLabels[k]; });
      labs["groupsync-dashboard.io/secret-type"] = "cluster";
      CONFIG.clusters.push({
        name: name,
        server: server,
        source: "secret:gsd-cluster-" + name,
        labels: labs,
        credential: { kind: "bearerToken", set: true },
        tls: { insecure: caMode === "insecure", ca: caMode === "bundle" ? "trusted-bundle" : (caMode === "insecure" ? "caData" : "caData") },
        visibility: document.getElementById("add-visibility").value,
        identity: document.getElementById("add-identity").value,
        enabled: true,
        connection: { status: "never", last_poll: null, error: null }
      });
      Object.keys(formLabels).forEach(function (k) { delete formLabels[k]; });
      paint();
      const row = document.getElementById("cluster-" + name);
      if (row && row.scrollIntoView) row.scrollIntoView({ block: "start" });
    });
    const copy = document.getElementById("yaml-copy");
    if (copy) copy.addEventListener("click", function () {
      const text = yamlFromForm();
      const done = document.getElementById("yaml-copy-msg");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          if (done) done.textContent = "Copied";
        }).catch(function () {
          if (done) done.textContent = "Copy failed";
        });
      } else if (done) done.textContent = "Copy failed";
    });
    const form = document.getElementById("add-form");
    if (form) form.addEventListener("submit", function (e) { e.preventDefault(); });
    refreshLabelChips();
    refreshCa();
  }
  function paint() {
    document.getElementById("main").innerHTML = headHtml() + clustersHtml() + findingsHtml() + addHtml();
    bindRotateDelete();
    bindForm();
  }
  document.getElementById("tabs").innerHTML = TABS.map(function (pair) {
    const id = pair[0], label = pair[1];
    return '<button type="button" class="tab" id="tab-' + id + '" data-nav="' + id + '"' +
      (id === "clusters" ? ' aria-current="page"' : "") + ">" + label + "</button>";
  }).join("");
  [["pref-mode", "data-theme", "gsd-mode", "mode"], ["pref-palette", "data-palette", "gsd-palette", "theme"]].forEach(function (row) {
    const sel = document.getElementById(row[0]); if (!sel) return;
    const fromUrl = new URLSearchParams(location.search).get(row[3]) || "";
    let saved = ""; try { saved = localStorage.getItem(row[2]) || ""; } catch (e) {}
    const start = fromUrl || saved;
    if (start) { document.documentElement.setAttribute(row[1], start); sel.value = start; }
    sel.addEventListener("change", function () {
      const v = sel.value;
      v ? document.documentElement.setAttribute(row[1], v) : document.documentElement.removeAttribute(row[1]);
      try { v ? localStorage.setItem(row[2], v) : localStorage.removeItem(row[2]); } catch (e) {}
      const u = new URL(location.href);
      v ? u.searchParams.set(row[3], v) : u.searchParams.delete(row[3]);
      history.replaceState(null, "", u);
    });
  });
  paint();
  void LIVE;
})();
</script>
</body>
</html>
