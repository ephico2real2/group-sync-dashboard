<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namespace audit — OCP Access Tracking Dashboard</title>
<!-- Appearance and colour palette applied BEFORE the first paint, as the shipped shell does
     (index.html 6–22): the URL wins, then what the reader last chose, then the OS. -->
<script>
(function () {
  var html = document.documentElement, query = new URLSearchParams(location.search);
  function pick(param, key, allowed) {
    var v = query.get(param) || "";
    if (allowed.indexOf(v) < 0) {
      try { v = localStorage.getItem(key) || ""; } catch (e) { v = ""; }
    }
    return allowed.indexOf(v) >= 0 ? v : "";
  }
  var mode = pick("mode", "gsd-mode", ["light", "dark"]);
  var palette = pick("theme", "gsd-palette", ["deuter", "protan", "trit", "contrast"]);
  if (mode) html.setAttribute("data-theme", mode);
  if (palette) html.setAttribute("data-palette", palette);
})();
</script>
<style>
/* Tokens are the shipped ones, copied from local-development/gsd/static/app.css so this mock and the
   app cannot drift. ONE token is deliberately different and it is a PROPOSAL, marked below. */
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --page: #f9f9f7;
  /* PROPOSED CHANGE — the wash's top stop only. Shipped: #eef0f4. Here: #e3e6ef.
     --page is NOT touched: every text token in app.css is solved against it and the ratio is
     written beside each one, so darkening the base would lower the whole set at once. The top
     stop carries no body text in this layout — the one 12px --text-muted line that used to sit
     in it (the version line, measured at 4.57:1 on the live page) is --text-secondary here.
     Measured on the painted pixels of this page, not on the token: see the provenance footer. */
  --page-2: #e3e6ef;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #6a6863;
  --gridline: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --series-1: #2874d0;
  --drill-text: #1a65bb;
  --series-1-wash: color-mix(in srgb, var(--series-1) 10%, transparent);
  --status-good: #097d09;
  --status-warning: #c48704;
  --status-warning-edge: #b45309;
  --status-critical: #c43838;
  --status-unknown: #74726d;
  --zebra: rgba(11, 11, 11, 0.025);
  --tab-home: #3d5a80;
  --tab-overview: #2873cd;
  --tab-groups: #108172;
  --tab-bindings: #6d4bc7;
  --tab-policy: #9333ea;
  --tab-nsaudit: #b3306e;
  --tab-users: #0e7490;
  --tab-logins: #597b0a;
  --tab-usage: #c2410c;
  --tab-reports: #5b6470;
  --tab-kpi: #4a55a3;
  --tab-kyverno: #0b6e7a;
  --tab-clusters: #6b3a12;
  --tab-library: #7a2468;
  --accent: var(--tab-nsaudit);
  --font-ui: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --text-micro: 10px; --text-xs: 11px; --text-sm: 12px; --text-md: 13px;
  --text-base: 14px; --text-lg: 15px; --text-xl: 18px;
  --space-1: 2px; --space-2: 4px; --space-3: 6px; --space-4: 8px; --space-5: 10px;
  --space-6: 12px; --space-7: 14px; --space-8: 16px; --space-9: 18px; --space-10: 20px;
  --space-11: 24px;
  --radius-xs: 2px; --radius-sm: 4px; --radius-md: 6px; --radius-lg: 10px;
  --radius-pill: 999px; --radius-round: 50%;
  --elev-1: 0 1px 2px rgba(11,11,11,0.05), 0 1px 8px rgba(11,11,11,0.04);
  --warn: #ae5009;
  /* Risk tiers get a token each so the tier's colour, its word and its shape are set in one
     place. riskTier() ranks on PRIVILEGE and SCOPE, never on count — the reason is on the page. */
  --risk-critical: var(--status-critical);
  --risk-high: var(--status-warning);
  --risk-medium: var(--series-1);
  --risk-low: var(--status-unknown);
}
@media screen and (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    /* The dark wash runs the other way — its top stop is LIGHTER than the base — so deepening it
       would flatten the gradient rather than darken the page, and every ratio here improves as it
       goes down. Shipped value kept; the light stop is the one the eye reads as pale. */
    --page-2: #14161c;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #918f89;
    --gridline: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5;
    --drill-text: #4b97ed;
    --series-1-wash: color-mix(in srgb, var(--series-1) 14%, transparent);
    --status-critical: #db6f6f;
    --status-good: #14a614;
    --status-warning: #c48704;
    --status-warning-edge: #e08a2e;
    --status-unknown: #898781;
    --zebra: rgba(255, 255, 255, 0.035);
    --warn: #c48704;
    --tab-home: #8fb3dd;
    --tab-overview: #2d7ad7;
    --tab-groups: #12907f;
    --tab-bindings: #8468d0;
    --tab-policy: #a855f7;
    --tab-nsaudit: #e0559a;
    --tab-users: #22a5c9;
    --tab-logins: #678e0b;
    --tab-usage: #d9490d;
    --tab-reports: #98a2b3;
    --tab-kpi: #9aa3e6;
    --tab-kyverno: #5cc4cf;
    --tab-clusters: #e0a060;
    --tab-library: #d489c0;
    --elev-1: 0 1px 2px rgba(0,0,0,0.5), 0 1px 10px rgba(0,0,0,0.35);
  }
}
@media screen {
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --page: #0d0d0d;
  --page-2: #14161c;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #918f89;
  --gridline: #2c2c2a;
  --baseline: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --series-1: #3987e5;
  --drill-text: #4b97ed;
  --series-1-wash: color-mix(in srgb, var(--series-1) 14%, transparent);
  --status-critical: #db6f6f;
  --status-good: #14a614;
  --status-warning: #c48704;
  --status-warning-edge: #e08a2e;
  --status-unknown: #898781;
  --zebra: rgba(255, 255, 255, 0.035);
  --warn: #c48704;
  --tab-home: #8fb3dd;
  --tab-overview: #2d7ad7;
  --tab-groups: #12907f;
  --tab-bindings: #8468d0;
  --tab-policy: #a855f7;
  --tab-nsaudit: #e0559a;
  --tab-users: #22a5c9;
  --tab-logins: #678e0b;
  --tab-usage: #d9490d;
  --tab-reports: #98a2b3;
  --tab-kpi: #9aa3e6;
  --tab-kyverno: #5cc4cf;
  --tab-clusters: #e0a060;
  --tab-library: #d489c0;
  --elev-1: 0 1px 2px rgba(0,0,0,0.5), 0 1px 10px rgba(0,0,0,0.35);
}
}
/* Okabe–Ito for colour vision, as app.css ships them. A palette repaints the STATUS hues only:
   the tab identities are the page's own colour and are already separated on lightness. */
:root[data-palette="deuter"], :root[data-palette="protan"] {
  --status-good: #0071af; --status-warning: #c18600; --status-warning-edge: #a25c00; --status-critical: #b24e00; --warn: #906300;
}
:root[data-palette="trit"] {
  --status-good: #007b5a; --status-warning: #cb76a5; --status-warning-edge: #a8527f; --status-critical: #b24e00; --warn: #94597a;
}
:root[data-palette="contrast"] {
  --status-good: #076607; --status-warning: #9c6b03; --status-warning-edge: #7a4a00; --status-critical: #a42727; --text-muted: #575551; --warn: #7a4a00;
}
/* ── THE HEADING LADDER — shell state, not page state (proposed, issue #253) ────────────────
   These are ELEMENT selectors on purpose. The ladder belongs in app.css's one global
   `h1, h2, h3` rule; it is not a Namespace-audit choice and must not be ported into a page
   scope. Shipped today (app.css:528, 540–542, 986–987):

     h1, h2, h3 { font-weight: 600; margin: 0; }      — no tracking anywhere
     h1 18px · h2 15px · h3 13px (--text-secondary)
     .card > h2 { letter-spacing: -0.01em }            — tracking ONLY as a direct child of .card
     .card > h3 { letter-spacing: -0.005em }

   So a heading outside a card — the page's own h1 in the shell — gets no tracking at all, which
   is the whole difference a reader sees between the live page and the agreed mocks. The treatment
   below is not new to the product: `.home .answer h1` (app.css:1286) already carries w700/-0.02em.
   This extends that one hero to the ladder. Sizes are unchanged from the shipped scale. */
h1, h2, h3 { font-weight: 700; margin: 0; }
h1 { font-size: var(--text-xl); letter-spacing: -0.02em; }
h2 { font-size: var(--text-lg); letter-spacing: -0.015em; }
h3 { font-size: var(--text-md); color: var(--text-secondary); letter-spacing: -0.01em; }
h4 { font-size: var(--text-md); font-weight: 700; letter-spacing: -0.01em; margin: 0; }

* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
body {
  --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  margin: 0;
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: var(--text-base);
  line-height: 1.5;
  background:
    radial-gradient(1200px 520px at 50% -12%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
    linear-gradient(180deg, var(--page-2), var(--page) 420px);
  background-attachment: fixed;
  background-color: var(--page);
  min-height: 100dvh;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: var(--space-10) var(--space-10) 64px; min-width: 0; }
@media (max-width: 520px) { .wrap { padding: var(--space-6) var(--space-8) 48px; } }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: var(--space-10); top: var(--space-10); z-index: 40; background: var(--surface-1); padding: var(--space-3) var(--space-5); }

/* ── the shell, carried verbatim ───────────────────────────────────────────────────────────── */
header.top {
  display: flex; align-items: baseline; gap: var(--space-6); flex-wrap: wrap;
  padding-bottom: var(--space-7); border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
  margin-bottom: var(--space-6);
}
header.top h1 { margin: 0; }
header.top .sub { color: var(--text-secondary); font-size: var(--text-sm); }
header.top .spacer { flex: 1; }
header.top .build { color: var(--text-secondary); font-size: var(--text-sm); font-family: var(--font-mono); }
.shell-prefs { display: inline-flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.shell-prefs .pref { display: inline-flex; align-items: center; gap: var(--space-3); }
.shell-prefs label { color: var(--text-secondary); font-size: var(--text-sm); }
@media (max-width: 520px) { .shell-prefs .pref { flex-direction: column; align-items: flex-start; gap: 0; } }
select, button, a.btn, input {
  font: inherit; font-size: var(--text-md); color: var(--text-primary);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 5px 9px; cursor: pointer; max-width: 100%;
}
input { cursor: text; width: 100%; }
button:hover, select:hover, a.btn:hover { border-color: var(--baseline); }
a.btn { text-decoration: none; display: inline-block; }
.tabs { display: flex; gap: var(--space-2); flex-wrap: wrap; max-width: 100%; overflow-x: auto; }
.tab {
  position: relative; background: none; border: 0; border-radius: var(--radius-md) var(--radius-md) 0 0;
  padding: 7px var(--space-6) 9px; font-size: var(--text-md); font-weight: 500;
  color: var(--text-secondary); cursor: default; white-space: nowrap;
}
.tab:hover { color: var(--text-primary); background: var(--zebra); }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tab[aria-current="page"]::after {
  content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px;
  background: var(--accent); border-radius: 3px 3px 0 0;
}
@media (forced-colors: active) { .tab[aria-current="page"]::after { background: Highlight; forced-color-adjust: none; } }
.filters {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4) var(--space-7);
  padding: var(--space-6) 0; border-bottom: 1px solid var(--border); margin-bottom: var(--space-7);
}
.filters label { font-size: var(--text-sm); color: var(--text-secondary); }
.filters .grp { display: inline-flex; align-items: center; gap: var(--space-3); min-width: 0; }
.filters .grp.find { flex: 1 1 240px; }
.filters .grp.find input { min-width: 0; }
.scope-pill {
  font-size: var(--text-sm); border: 1px solid var(--border); border-radius: var(--radius-pill);
  padding: 2px var(--space-5); background: var(--surface-1); color: var(--text-primary);
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ── cards and type ────────────────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: var(--space-8); margin-bottom: var(--space-7); box-shadow: var(--elev-1);
  min-width: 0; max-width: 100%;
}
main > .card:first-child { border-top: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.card > h2, .card > h3 { font-family: var(--font-ui); margin: 0 0 var(--space-4); }
.card > h2::before, .card > h3::before {
  content: ""; display: inline-block; vertical-align: middle; width: 3px; height: 0.95em;
  margin-right: var(--space-4); border-radius: var(--radius-xs); background: var(--rk, var(--accent));
}
.card h2 .count, .card h3 .count { font-weight: 400; color: var(--text-muted); font-size: var(--text-sm); font-family: var(--font-mono); }
.muted { color: var(--text-muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.err { color: var(--status-critical); overflow-wrap: anywhere; }
.note {
  font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.6;
  overflow-wrap: anywhere; margin: 0 0 var(--space-5);
}
.note:last-child { margin-bottom: 0; }
.note strong { color: var(--text-primary); }
.note code, code { font-family: var(--font-mono); font-size: var(--text-sm); background: var(--zebra); padding: 1px 5px; border-radius: var(--radius-sm); overflow-wrap: anywhere; }
.empty-note { color: var(--text-muted); font-size: var(--text-md); padding: var(--space-5) 0; }
.linkish {
  background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
  font-size: var(--text-sm); color: var(--drill-text); text-decoration: underline; text-underline-offset: 2px;
}
.linkish:hover { color: var(--text-primary); }
.drill {
  font-family: var(--font-mono); font-size: var(--text-md); border: 0; background: none;
  color: var(--drill-text); cursor: pointer; padding: 0; text-decoration: underline;
  text-underline-offset: 2px; overflow-wrap: anywhere; text-align: left;
}
.drill:hover { color: var(--text-primary); }
.back { margin-bottom: var(--space-6); }
:where(button, a, select, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }

/* ── badges: a shape AND a word, never colour alone ────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: var(--space-3);
  font-size: var(--text-sm); font-weight: 500; color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-pill);
  padding: 2px 9px 2px 7px; white-space: nowrap;
}
.badge .glyph { width: 9px; height: 9px; flex: none; display: inline-block; }
.badge.ok .glyph { background: var(--status-good); border-radius: var(--radius-round); }
.badge.warning .glyph { background: var(--status-warning); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.badge.critical .glyph { background: var(--status-critical); border-radius: 1px; }
.badge.unknown .glyph { border: 1.5px solid var(--status-unknown); border-radius: var(--radius-round); background: none; }
/* The four risk tiers: square / triangle / diamond / hollow circle, each beside its word. */
.badge.risk-critical .glyph { background: var(--risk-critical); border-radius: 1px; }
.badge.risk-high .glyph { background: var(--risk-high); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.badge.risk-medium .glyph { background: var(--risk-medium); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.badge.risk-low .glyph { border: 1.5px solid var(--risk-low); border-radius: var(--radius-round); background: none; }
.badge.lg { font-size: var(--text-base); font-weight: 600; padding: var(--space-3) var(--space-6) var(--space-3) var(--space-5); }
.badge.lg .glyph { width: 11px; height: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-3); min-width: 0; }
.chip {
  display: inline-block; font-family: var(--font-mono); font-size: var(--text-micro);
  padding: var(--space-1) var(--space-4); border-radius: 5px; border: 1px solid var(--border);
  color: var(--text-secondary); white-space: normal; overflow-wrap: anywhere; max-width: 100%;
}
.chip.person { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.chip.priv { font-size: var(--text-sm); color: var(--text-primary); }

/* ── the verdict ───────────────────────────────────────────────────────────────────────────── */
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-6); margin-bottom: var(--space-6); }
.verdict .lede { font-size: var(--text-base); color: var(--text-secondary); min-width: 0; }
.verdict .lede strong { color: var(--text-primary); }
/* The gridlines are drawn by each tile's own shadow and clipped at the container's edge, NOT by a
   1px gap over a coloured background: at 375px five tiles land in a 2-column grid and the empty
   sixth slot painted that background as a sixth, empty, grey tile (measured in the render check). */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.kpi { background: var(--surface-1); padding: var(--space-6) var(--space-7); min-width: 0;
  box-shadow: 1px 0 0 var(--border), 0 1px 0 var(--border); }
.kpi .label { font-size: var(--text-micro); letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
.kpi .value { font-family: var(--font-mono); font-size: 21px; font-weight: 600; margin-top: var(--space-2); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .value.sm { font-size: var(--text-base); }
.kpi.flag-critical { box-shadow: inset 3px 0 0 var(--status-critical), 1px 0 0 var(--border), 0 1px 0 var(--border); }
.kpi.flag-warning { box-shadow: inset 3px 0 0 var(--status-warning), 1px 0 0 var(--border), 0 1px 0 var(--border); }
/* The tier partition as one cell per namespace — a unit chart, not a proportional bar. At this size
   a bar would be five slivers whose lengths a reader has to trust; the cells ARE the namespaces, and
   each one carries its tier's shape. Above UNIT_MAX the counts render alone with a note. */
.unit { display: flex; flex-wrap: wrap; gap: var(--space-3); margin: var(--space-6) 0 var(--space-4); }
/* The shape is an INNER element. A clip-path clips everything the element paints, its outline
   included, so a ring on the shape itself renders nothing — measured: the cluster-scope marker was
   invisible until the shape moved inside an unclipped box. */
.unit .cell { width: 24px; height: 24px; border-radius: var(--radius-sm); display: inline-flex;
  align-items: center; justify-content: center; }
.unit .cell .shape { width: 18px; height: 18px; display: block; }
.unit .cell.risk-critical .shape { background: var(--risk-critical); border-radius: 1px; }
.unit .cell.risk-high .shape { background: var(--risk-high); clip-path: polygon(50% 4%, 98% 96%, 2% 96%); }
.unit .cell.risk-medium .shape { background: var(--risk-medium); clip-path: polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%); }
.unit .cell.risk-low .shape { background: none; border: 2px solid var(--risk-low); border-radius: var(--radius-round); }
/* The cluster scope is in the rollup as one more entry, so it is one more cell — ringed, because it
   is a scope rather than a namespace, and the legend says which one it is. */
.unit .cell.scope { outline: 2px dashed var(--text-secondary); outline-offset: 1px; }
.unit .scope-note { font-size: var(--text-sm); color: var(--text-secondary); align-self: center; margin-left: var(--space-3); }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-7); font-size: var(--text-sm); color: var(--text-secondary); }
.legend .n { font-family: var(--font-mono); font-weight: 600; color: var(--text-primary); }

/* ── tables ────────────────────────────────────────────────────────────────────────────────── */
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table { width: 100%; border-collapse: collapse; min-width: 0; }
th {
  font-size: var(--text-micro); letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted);
  font-weight: 600; text-align: left; padding: var(--space-4) var(--space-6) var(--space-4) 0;
  border-bottom: 1px solid var(--gridline); white-space: nowrap; vertical-align: bottom;
}
th.num, td.num { text-align: right; }
td { padding: var(--space-5) var(--space-6) var(--space-5) 0; font-size: var(--text-md); vertical-align: top; border-bottom: 1px solid var(--gridline); overflow-wrap: anywhere; }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
th button.sorter {
  background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer;
  text-transform: inherit; letter-spacing: inherit; font-weight: inherit;
}
th button.sorter:hover { color: var(--text-primary); }
th button.sorter .arrow { font-family: var(--font-mono); margin-left: var(--space-2); }
.risk-row td:first-child { border-left: 4px solid var(--rk, transparent); padding-left: var(--space-5); }
.risk-row.risk-critical { --rk: var(--risk-critical); }
.risk-row.risk-high { --rk: var(--risk-high); }
.risk-row.risk-medium { --rk: var(--risk-medium); }
.risk-row.risk-low { --rk: var(--risk-low); }
.risk-row.risk-critical td { background: color-mix(in srgb, var(--status-critical) 7%, transparent); }
.risk-row.risk-high td { background: color-mix(in srgb, var(--status-warning) 7%, transparent); }
.ns-name { font-size: var(--text-base); font-weight: 600; }
.who { min-width: 0; }
.who .chips { gap: var(--space-2) var(--space-3); }
.trunc {
  font-size: var(--text-sm); color: var(--text-secondary); margin-top: var(--space-5);
  padding: var(--space-5) var(--space-6); border-left: 3px solid var(--status-warning-edge);
  background: color-mix(in srgb, var(--status-warning) 8%, transparent);
  border-radius: 0 var(--radius-md) var(--radius-md) 0; overflow-wrap: anywhere;
}
.trunc strong { color: var(--text-primary); }
/* Below 620px a five-column table either scrolls sideways or gets clipped. Each row becomes its own
   block and every cell carries its column name — measured at 375 and 393, no horizontal scroll. */
@media (max-width: 620px) {
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack thead { display: none; }
  table.stack tr { border: 1px solid var(--gridline); border-radius: var(--radius-md); margin-bottom: var(--space-5); padding: var(--space-3) var(--space-5); }
  table.stack td { border-bottom: 0; padding: var(--space-2) 0; text-align: left; }
  table.stack td::before {
    content: attr(data-l) ""; display: block; font-size: var(--text-micro); letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-muted); font-weight: 600;
  }
  table.stack td:empty { display: none; }
  table.stack td.num { font-family: var(--font-mono); }
  table.stack.compact td { display: inline-block; width: auto; margin-right: var(--space-6); }
  table.stack.compact td::before { display: inline; margin-right: var(--space-2); }
  table.stack.compact td[data-l="Namespace"] { display: block; width: 100%; }
  table.stack.compact tr { padding: var(--space-4) var(--space-5); }
  .risk-row.risk-critical td, .risk-row.risk-high td { background: none; }
  table.stack tr.risk-row { border-left: 4px solid var(--rk, var(--border)); }
  table.stack tr.risk-row td:first-child { border-left: 0; padding-left: 0; }
}

/* ── disclosures, runbook, the grid of reasons ─────────────────────────────────────────────── */
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-5); margin-bottom: var(--space-4); }
.section-head h2, .section-head h3 { margin-bottom: 0; }
.disclose { font-size: var(--text-sm); }
.disclose .arrow { font-family: var(--font-mono); margin-right: var(--space-3); }
.reasons { display: grid; gap: var(--space-7); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.reason { font-size: var(--text-md); color: var(--text-secondary); line-height: 1.6; min-width: 0; }
.reason h4 { color: var(--text-primary); margin: 0 0 var(--space-3); }
.runbook { margin: 0; padding-left: var(--space-11); font-size: var(--text-md); line-height: 1.7; color: var(--text-secondary); }
.runbook li { margin-bottom: var(--space-3); }
.runbook strong { color: var(--text-primary); }
.cmd {
  font-family: var(--font-mono); font-size: var(--text-sm); white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--zebra); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-5) var(--space-6); margin: var(--space-4) 0 0;
}
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); margin-bottom: var(--space-5); }
.controls label { font-size: var(--text-sm); color: var(--text-secondary); }
.kv { display: grid; grid-template-columns: minmax(96px, 30%) 1fr; gap: var(--space-3) var(--space-5); padding: var(--space-3) 0; border-bottom: 1px solid var(--gridline); font-size: var(--text-sm); min-width: 0; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--text-muted); font-size: var(--text-xs); letter-spacing: .04em; text-transform: uppercase; }
.kv .v { overflow-wrap: anywhere; min-width: 0; }

/* ── the withheld card, the scope banner, the shape examples ───────────────────────────────── */
.scope-refusal, .scope-banner {
  font-size: var(--text-md); color: var(--text-secondary); line-height: 1.6;
  border-left: 3px solid var(--accent); background: var(--accent-soft);
  padding: var(--space-6) var(--space-7); border-radius: 0 var(--radius-md) var(--radius-md) 0;
  overflow-wrap: anywhere;
}
.scope-refusal strong, .scope-banner strong { color: var(--text-primary); }
.shape-ex { margin-top: var(--space-7); padding: var(--space-5) var(--space-6); border: 1px dashed var(--border); border-radius: var(--radius-md); background: var(--zebra); }
.shape-ex > .lbl { display: block; font-size: var(--text-xs); letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: var(--space-4); }
.shape-ex .card { margin-bottom: 0; box-shadow: none; }
/* Spacing utilities, so a one-off margin is a class rather than an inline style. */
.mt-5 { margin-top: var(--space-5); }
.mt-6 { margin-top: var(--space-6); }
.mt-7 { margin-top: var(--space-7); }
.sm { font-size: var(--text-sm); }

.prov { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.7; border-top: 1px solid var(--border); padding-top: var(--space-7); margin-top: var(--space-10); overflow-wrap: anywhere; }
.prov h2 { font-size: var(--text-md); margin: 0 0 var(--space-4); color: var(--text-primary); }
.prov code { font-size: var(--text-xs); }
.prov table { margin-top: var(--space-4); }
.prov td, .prov th { font-size: var(--text-xs); }
</style>

space":null,"excluded_platform":null,"namespace":null,"total":3,"limit":200,"offset":0,"truncated":false,"bindings":[{"binding_kind":"ClusterRoleBinding","binding_namespace":"","binding_name":"jdoe-edit","role_kind":"ClusterRole","role_name":"edit","user_name":"jdoe","is_platform":0},{"binding_kind":"RoleBinding","binding_namespace":"legacy-payments","binding_name":"jdoe-admin","role_kind":"ClusterRole","role_name":"admin","user_name":"jdoe","is_platform":0},{"binding_kind":"RoleBinding","binding_namespace":"legacy-reporting","binding_name":"jdoe-edit","role_kind":"ClusterRole","role_name":"edit","user_name":"jdoe","is_platform":0}]},"alice.cooper":{"cluster":"dashboard-rnd","scope":"self","viewer":"alice.cooper","note":"direct user grants; migrate these to LDAP-managed groups","by_namespace":null,"excluded_platform":null,"namespace":null,"total":0,"limit":200,"offset":0,"truncated":false,"bindings":[]},"jeffNamespaces":{"count":2,"names":["jeff-qa","jeff-rnd"],"cluster_wide_path":false},"noneNamespaces":{"count":0,"cluster_wide_path":false},"detailRefusal":"this namespace is outside your view; namespace detail beyond your own grants needs the wide tier","noIdentity":"this data is scoped to the authenticated viewer, and there is no authenticated identity to scope it to"}}</script>
<script>
(function () {
"use strict";
/* ─────────────────────────────────────────────────────────────────────────────────────────────
   Namespace audit — proposed redesign, #153's second reference page.

   Every row, count, name and timestamp below was read from the lab on 2026-09-21 and is embedded
   verbatim in #lab-json. Nothing is invented: where a shape exists in the code but not in the lab
   (a truncated grant list, a roster past the preview bound, a cluster with zero findings) it is
   drawn in a box marked SHAPE and labelled as one.

   The page keeps every sentence the shipped page carries — see docs/design/nsaudit-feature-capture.md
   for the inventory and docs/design/tab-feature-contract.md for what a redesign may not remove.
   ───────────────────────────────────────────────────────────────────────────────────────────── */
const LAB = JSON.parse(document.getElementById("lab-json").textContent);
const TABS = [
  ["home", "Home"], ["overview", "Overview"], ["kpi", "KPIs"], ["groups", "Groups"],
  ["users", "Users"], ["bindings", "Access granted"], ["policy", "RBAC policy"],
  ["kyverno", "Kyverno"], ["nsaudit", "Namespace audit"], ["logins", "Logins"],
  ["usage", "Usage"], ["reports", "Reports"], ["library", "Library"], ["clusters", "Cluster Configurations"]
];
const CLUSTERS = ["dashboard-rnd", "mock-privateca", "mock-selfsigned", "mock-trusted", "shared-rnd"];
const PRIVILEGE_NAME = { 4: "cluster-admin", 3: "admin", 2: "edit", 1: "view" };
const PRIVILEGE_RANK = { "cluster-admin": 4, admin: 3, edit: 2, view: 1 };
/* The exposed-user list for one namespace, bounded. A namespace with forty direct grants would
   otherwise put forty names in one cell and the column would decide the width of the whole table —
   on the view that is supposed to be the scannable one. Small on purpose: the question this table
   answers is "which namespaces are exposed and how badly"; the names are corroboration, and the
   full roster is one section down in Every grant. */
const WHO_PREVIEW = 4;
/* One cell per namespace up to here; past it the partition renders as counts with a note, because
   a hundred cells is a texture rather than a count. */
const UNIT_MAX = 40;

const view = {
  cluster: "dashboard-rnd", tier: "admin", ns: null,
  nsSort: "risk", nsDir: "desc", grantSort: "risk", grantDir: "desc",
  grantsOpen: false, pick: "all", search: "", whoOpen: new Set(), shapeWhoOpen: false,
  wideOpen: false, countsOpen: false, platformOpen: false
};

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const plural = (n, one, many) => (n === 1 ? one : (many || one + "s"));
const badge = (shape, word) =>
  `<span class="badge ${shape}"><span class="glyph" aria-hidden="true"></span>${esc(word)}</span>`;
const lab = () => LAB.clusters[view.cluster] || null;

/* Risk tier for one namespace's worst grant. Ranked on PRIVILEGE and SCOPE, never on count: one
   forgotten cluster-admin outranks twenty view grants, and a page sorted by volume puts the twenty
   first and buries the one. Ported unchanged from index.html riskTier(). */
function riskTier(row) {
  const p = row.worst_privilege || 1;
  const clusterWide = !!row.cluster_scoped;
  if (clusterWide && p >= 3) return { key: "critical", label: "Critical", rank: 4 };
  if (p >= 4) return { key: "critical", label: "Critical", rank: 4 };
  if (p >= 3 || clusterWide) return { key: "high", label: "High", rank: 3 };
  if (p >= 2) return { key: "medium", label: "Medium", rank: 2 };
  return { key: "low", label: "Low", rank: 1 };
}

/* Sort a COPY, never the array the renderer was handed: sorting in place would reorder the payload
   itself, so the risk ranking would be lost after the first click. Numbers compare numerically —
   "10" < "9" as strings is the classic way a count column sorts wrongly and nobody notices. */
function sortBy(rows, keyFn, dir) {
  const sign = dir === "asc" ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = keyFn(a), y = keyFn(b);
    if (x === y) return 0;
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sign;
  });
}

/* A <button> inside the <th>, not a click handler on the <th>: a bare th is not focusable and not
   announced as actionable. The arrow is text so it survives forced-colors, and aria-sort tells a
   screen reader which column orders the table and in which direction. */
function sortableTh(label, key, group, cls) {
  const active = group === "ns" ? view.nsSort === key : view.grantSort === key;
  const dir = group === "ns" ? view.nsDir : view.grantDir;
  const next = active && dir === "desc" ? "asc" : "desc";
  const aria = active ? (dir === "asc" ? "ascending" : "descending") : "none";
  const arrow = active ? (dir === "asc" ? "▲" : "▼") : "";
  return `<th${cls ? ` class="${cls}"` : ""} aria-sort="${aria}">
    <button type="button" class="sorter" data-sort="${key}" data-group="${group}" data-dir="${next}">
      ${esc(label)}<span class="arrow" aria-hidden="true">${arrow}</span>
      <span class="sr-only">${active ? `sorted ${dir === "asc" ? "ascending" : "descending"}; ` : ""}sort ${next === "asc" ? "ascending" : "descending"}</span>
    </button></th>`;
}

const matches = (hay, q) => {
  const words = String(q || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  const s = hay.filter(Boolean).join(" ").toLowerCase();
  return words.every((w) => s.indexOf(w) >= 0);
};

/* ── the shell ─────────────────────────────────────────────────────────────────────────────── */
function renderShell() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, name]) =>
    `<button type="button" class="tab"${k === "nsaudit" ? ' aria-current="page"' : ""}>${esc(name)}</button>`).join("");
  document.getElementById("head-cluster").textContent = view.cluster;
  document.getElementById("build-info").textContent =
    `v${LAB.measured.app.version} · ${LAB.measured.app.sha} · updated ${LAB.measured.app.updated}`;
  const pill = document.getElementById("scope-pill");
  /* Three states, as the shipped shell has them. "Full view — restrictions are off for this
     deployment" is the third and deliberately does not claim the reader holds a permission. */
  pill.textContent = view.tier === "admin"
    ? "Full view — you are seeing everything"
    : "Narrowed view — you are seeing your own access";
}

function renderFilters() {
  const d = lab();
  const ub = d && d.audit;
  const rows = ub && ub.by_namespace ? ub.by_namespace : [];
  const served = view.tier === "admin" ? (ub ? (ub.bindings || []).length : 0) : selfRows().length;
  const exportable = view.tier !== "withheld" && !view.ns;
  document.getElementById("filters").innerHTML = `
    <span class="grp"><label for="f-cluster">Cluster</label>
      <select id="f-cluster">${CLUSTERS.map((c) =>
        `<option value="${esc(c)}"${c === view.cluster ? " selected" : ""}>${esc(c)}${
          LAB.clusters[c] ? "" : " — not captured"}</option>`).join("")}</select></span>
    <span class="grp find"><label for="f-ns-search">Find namespace</label>
      <input id="f-ns-search" type="search" inputmode="search" autocomplete="off" spellcheck="false"
             placeholder="filter by name or label" value="${esc(view.search)}"
             aria-describedby="f-ns-search-help"
             title='Filters the worklist AND the namespace list by name or by a label value as you type. Several words are ANDed — "demo prod" finds demo-prod and demo-production. Escape clears.'>
      <span id="f-ns-search-help" class="sr-only">Filters both the exposure worklist and the namespace list by name or by the value of a captured label as you type. Several words are combined with AND, so every word must appear. Press Escape to clear.</span></span>
    ${exportable ? `<span class="grp">Export
      <button type="button" id="export-csv" title="Downloads exactly the rows this page holds, after the filter and sort — never more than the server served you.">CSV</button>
      <button type="button" id="export-json" title="Downloads exactly the rows this page holds, after the filter and sort — never more than the server served you.">JSON</button>
      <span class="muted mono" id="export-rows">${served} ${plural(served, "row")}</span></span>`
      : `<span class="grp muted">Export — this view holds no table to export${view.ns ? " (a namespace page is a drill-down)" : ""}</span>`}
    <span class="grp"><label for="f-tier">View as</label>
      <select id="f-tier">
        <option value="admin"${view.tier === "admin" ? " selected" : ""}>administrator (scope: all)</option>
        <option value="self-jdoe"${view.tier === "self-jdoe" ? " selected" : ""}>jdoe — own grants (scope: self)</option>
        <option value="self-alice"${view.tier === "self-alice" ? " selected" : ""}>alice.cooper — no direct grant</option>
        <option value="withheld"${view.tier === "withheld" ? " selected" : ""}>a reader the payload is withheld from</option>
      </select></span>
    <span class="grp muted">${rows.length ? "" : ""}</span>`;
}

/* ── the audit, administrator tier ─────────────────────────────────────────────────────────── */
function nsRows() {
  const ub = lab().audit;
  return (ub.by_namespace || []).filter((r) => !r.cluster_scoped).map((r) => ({ ...r, risk: riskTier(r) }));
}
function wideRow() {
  const ub = lab().audit;
  return (ub.by_namespace || []).find((r) => r.cluster_scoped) || null;
}

function verdictCard() {
  const ub = lab().audit;
  const rows = (ub.by_namespace || []).map((r) => ({ ...r, risk: riskTier(r) }));
  if (!rows.length) return zeroCard();
  /* Cluster-wide, never bindings.length: the detail list below is paged and may be filtered to one
     namespace, and a headline taken from it reports the page rather than the cluster — it would
     shrink when the reader narrows the filter, which reads as the problem getting smaller because
     they looked at it closely. */
  const totalAllNamespaces = rows.reduce((n, r) => n + (r.bindings || 0), 0);
  const nsOnly = rows.filter((r) => !r.cluster_scoped).length;
  /* Distinct PEOPLE, unioned from the rollup. Counting `bindings` is right only while nothing is
     paged; summing `distinct_users` double-counts anyone with grants in more than one namespace —
     on this cluster jdoe holds grants in three, so the sum says 11 where the truth is 8. */
  const people = new Set(rows.flatMap((r) => r.users || [])).size;
  const tiers = ["critical", "high", "medium", "low"];
  const byTier = {}; tiers.forEach((t) => { byTier[t] = rows.filter((r) => r.risk.key === t); });
  const worst = sortBy(rows, (r) => r.risk.rank, "desc")[0].risk;
  const unit = rows.length <= UNIT_MAX
    ? `<div class="unit" role="img" aria-label="${tiers.map((t) => `${byTier[t].length} ${t}`).join(", ")}">${
        tiers.flatMap((t) => byTier[t].map((r) =>
          `<span class="cell risk-${t}${r.cluster_scoped ? " scope" : ""}" title="${
            r.cluster_scoped ? "the cluster scope" : esc(r.namespace)} — ${t}"><span class="shape" aria-hidden="true"></span></span>`)).join("")
        + (wideRow() ? `<span class="scope-note">the ringed one is the cluster scope, not a namespace</span>` : "")}</div>`
    : `<p class="note">${rows.length} namespaces is past the ${UNIT_MAX} this partition draws one cell each for; the counts below are the whole set.</p>`;
  return `<section class="card">
    <h2>Namespace audit</h2>
    <div class="verdict">
      ${badge("risk-" + worst.key + " lg", worst.label + " exposure")}
      <span class="lede">highest risk on this cluster — <strong>${totalAllNamespaces}</strong>
        ${plural(totalAllNamespaces, "role is", "roles are")} granted to a named person rather than to a
        group, across <strong>${nsOnly}</strong> ${plural(nsOnly, "namespace")}${
        wideRow() ? " and the cluster scope" : ""}, reaching <strong>${people}</strong>
        ${plural(people, "person", "people")}.</span>
    </div>
    ${unit}
    <div class="legend">${tiers.map((t) => `<span>${badge("risk-" + t, t[0].toUpperCase() + t.slice(1))}
      <span class="n">${byTier[t].length}</span> ${plural(byTier[t].length, "namespace")}</span>`).join("")}</div>
    <div class="kpis mt-7">
      <div class="kpi${byTier.critical.length ? " flag-critical" : ""}"><div class="label">Namespaces at risk</div>
        <div class="value">${rows.length}</div></div>
      <div class="kpi"><div class="label">People exposed</div><div class="value">${people}</div></div>
      <div class="kpi"><div class="label">Grants to migrate</div><div class="value">${totalAllNamespaces}</div></div>
      <div class="kpi${byTier.critical.length ? " flag-critical" : ""}"><div class="label">Critical</div>
        <div class="value${byTier.critical.length ? " err" : " muted"}">${byTier.critical.length}</div></div>
      <div class="kpi${byTier.high.length ? " flag-warning" : ""}"><div class="label">High</div>
        <div class="value${byTier.high.length ? "" : " muted"}">${byTier.high.length}</div></div>
    </div>
    <div class="section-head mt-6">
      <span class="muted sm">Where these five numbers come from</span>
      <button type="button" class="linkish disclose" data-toggle="countsOpen"
              aria-expanded="${view.countsOpen}" aria-controls="counts-note">
        <span class="arrow" aria-hidden="true">${view.countsOpen ? "▾" : "▸"}</span> ${view.countsOpen ? "Hide" : "Show"} how they are counted</button>
    </div>
    <div id="counts-note"${view.countsOpen ? "" : " hidden"}>
      <p class="note"><strong>Namespaces at risk</strong>, <strong>Critical</strong> and <strong>High</strong>
        count namespaces; <strong>Grants to migrate</strong> counts bindings; <strong>People exposed</strong>
        counts distinct people. All five are computed from the per-namespace rollup, which the server
        never pages and never filters — not from the grant list below, which is both.</p>
      <p class="note"><strong>${rows.length}</strong> and not ${nsOnly}: the rollup carries the cluster
        scope as one more entry, so the tile counts ${nsOnly} ${plural(nsOnly, "namespace")}
        <em>plus</em> the cluster scope, which has its own card above the table. Both numbers are the
        shipped ones; the shipped table simply ranks the cluster scope as a row among the namespaces.</p>
      <p class="note"><strong>People exposed</strong> is the <em>union</em> of the rollup's name lists, not the
        sum of its <code>distinct_users</code>: jdoe holds grants in three namespaces here, so the sum
        says 11 where the truth is 8.</p>
      <p class="note">The platform identities are not in any of them: <strong>${ub.excluded_platform}</strong>
        ${plural(ub.excluded_platform, "identity", "identities")} — system components and
        <code>kubeadmin</code> — are break-glass and cluster-internal, with nowhere to migrate to.</p>
    </div>
  </section>`;
}

function zeroCard() {
  return `<section class="card">
    <h2>Namespace audit</h2>
    <div class="verdict">${badge("ok lg", "Clean")}
      <span class="lede"><strong>0</strong> namespaces grant access to a person.</span></div>
    <p class="note">Every role on this cluster is granted to a group. That is what makes offboarding a
      single action: removing someone from an LDAP group revokes their access everywhere at once.</p>
  </section>`;
}

/* The cluster scope is not a namespace. The shipped table ranks it as a row called CLUSTER-WIDE
   between the namespaces; here it is its own card, above them, because it is the only finding whose
   blast radius is every row of the list below — and because a reader scanning a namespace column
   should not have to notice that one of the entries is not one. */
function clusterWideCard() {
  const d = lab(), ub = d.audit, w = wideRow();
  const grants = (ub.bindings || []).filter((b) => !b.binding_namespace);
  const nsCount = d.namespaces.count;
  if (!w) {
    return `<section class="card"><h3>Cluster-wide direct grants <span class="count">· 0</span></h3>
      <p class="note">No binding names a person at the cluster scope. Every finding below is confined to
        one namespace, which is the smaller problem.</p></section>`;
  }
  return `<section class="card">
    <h3>Cluster-wide direct grants <span class="count">· ${w.bindings} reaching all ${nsCount} namespaces</span></h3>
    <p class="note">These name a person at the <strong>cluster</strong> scope, so they grant every namespace
      on this cluster — including the ${nsCount - 1} below that have no finding of their own. The shipped
      page ranks this as a row called <code>CLUSTER-WIDE</code> inside the namespace table; it is a scope,
      not a namespace, and its consequence is the whole list.</p>
    <div class="scroll-x"><table class="stack">
      <thead><tr><th>Person</th><th>Grants</th><th>Binding</th><th>Risk</th></tr></thead>
      <tbody>${grants.map((b) => {
        const t = riskTier({ worst_privilege: PRIVILEGE_RANK[b.role_name] || 1, cluster_scoped: 1 });
        return `<tr class="risk-row risk-${t.key}">
          <td data-l="Person"><span class="mono">${esc(b.user_name)}</span></td>
          <td data-l="Grants"><span class="chip priv">${esc(b.role_name)}</span> <span class="muted">${esc(b.role_kind)}</span></td>
          <td data-l="Binding"><span class="mono muted">${esc(b.binding_kind)} ${esc(b.binding_name)}</span></td>
          <td data-l="Risk">${badge("risk-" + t.key, t.label)}</td></tr>`;
      }).join("")}</tbody></table></div>
    <p class="note mt-6">Ranked <strong>High</strong> rather than Critical because
      the worst privilege here is <code>${esc(PRIVILEGE_NAME[w.worst_privilege])}</code>: a cluster-wide
      <code>admin</code> or <code>cluster-admin</code> is the Critical case.</p>
  </section>`;
}

function worklistCard() {
  const rows = nsRows().filter((r) => matches([r.namespace, ...(r.users || [])], view.search));
  const all = nsRows();
  const NS_SORT = {
    risk: (r) => r.risk.rank * 10 + (r.cluster_scoped ? 1 : 0),

    grants: (r) => r.bindings || 0
  };

  const dflt = view.nsSort === "risk" && view.nsDir === "desc";
  return `<section class="card">
    <div class="section-head">
      <h2>Exposure by namespace <span class="count">· ${rows.length === all.length

      ${dflt ? "" : `<button type="button" class="linkish" id="ns-reset">Restore risk order</button>`}
    </div>
    <p class="note">Ranked by the <strong>worst privilege granted</strong>, not by count — one forgotten
      <code>cluster-admin</code> matters more than twenty <code>view</code> grants. A page sorted by volume

    ${sorted.length ? `<div class="scroll-x"><table class="stack">
      <thead><tr>
        ${sortableTh("Risk", "risk", "ns")}
        ${sortableTh("Namespace", "namespace", "ns")}
        ${sortableTh("Highest privilege", "priv", "ns")}

      </tr></thead>
      <tbody>${sorted.map((r) => `<tr class="risk-row risk-${r.risk.key}">
        <td data-l="Risk">${badge("risk-" + r.risk.key, r.risk.label)}</td>
        <td data-l="Namespace"><button type="button" class="drill ns-name" data-ns="${esc(r.namespace)}">${esc(r.namespace)}</button></td>
        <td data-l="Highest privilege"><span class="chip priv">${esc(PRIVILEGE_NAME[r.worst_privilege] || "view")}</span></td>

      namespace, where the group paths and the history are. On the shipped page this column is plain text, so

    <p class="note">Cluster-wide grants are in their own card above, not in this table.
      ${lab().audit.excluded_platform} platform ${plural(lab().audit.excluded_platform, "identity", "identities")}
      excluded — system components and <code>kubeadmin</code> are break-glass and cluster-internal, with
      nowhere to migrate to.</p>
  </section>`;
}

function whoCell(row, forceOpen) {
  const users = row.users || [];
  if (!users.length) return '<span class="muted">—</span>';
  const open = forceOpen === undefined ? view.whoOpen.has(row.namespace) : forceOpen;
  const shown = open ? users : users.slice(0, WHO_PREVIEW);
  const hidden = users.length - shown.length;
  const names = `<span class="chips">${shown.map((u) => `<span class="chip person">${esc(u)}</span>`).join("")}</span>`;
  if (!hidden && !open) return names;
  return names + `<button type="button" class="linkish" data-who="${esc(row.namespace)}">${
    open ? "show fewer" : `+${hidden} more`}</button>`;
}

function reasonsCard() {
  return `<section class="card">
    <h3>Why this is a risk</h3>
    <div class="reasons">
      <div class="reason"><h4>Offboarding does not revoke it</h4>
        Removing someone from an LDAP group revokes their access everywhere at once. A binding that names
        the <strong>person</strong> keeps granting after they leave the team, change role, or leave the
        company — until somebody remembers it exists.</div>
      <div class="reason"><h4>Invisible to access review</h4>
        Every group-based review — including the rest of this dashboard — answers “who is in the group?”.
        These grants are attached to no group, so a clean review can coexist with standing access nobody
        approved.</div>
      <div class="reason"><h4>No approval trail</h4>
        Group membership is granted in the enterprise directory, with a request and an approver. A hand-made
        binding records only who ran <code>oc</code>, and only for as long as the audit log is retained.</div>
    </div>
  </section>`;
}

function runbookCard() {
  const rows = sortBy(nsRows(), (r) => r.risk.rank, "desc");
  const top = rows[0];
  const ub = lab().audit;
  const firstBinding = top
    ? (ub.bindings || []).find((b) => b.binding_namespace === top.namespace)
    : null;
  return `<section class="card">
    <h3>How to close it</h3>
    <p class="note">Work top-down: the table above is already in the order to do it in.</p>
    <ol class="runbook">
      <li><strong>Identify the role.</strong> Match the grant to the LDAP group the operator already syncs
        for that privilege — the naming convention encodes it (<code>&lt;app&gt;-ns-admin</code>,
        <code>-ns-developer</code>, <code>-ns-audit</code>).</li>
      <li><strong>Add the person to that group</strong> in the enterprise directory, through the normal
        request-and-approve path. Access now has an owner and an audit trail.</li>
      <li><strong>Wait one sync</strong> and confirm on the Groups tab that they appear as a member. Do not
        skip this — deleting first leaves them locked out.</li>
      <li><strong>Delete the direct binding.</strong>${firstBinding
        ? `<div class="cmd">oc delete rolebinding ${esc(firstBinding.binding_name)} -n ${esc(firstBinding.binding_namespace)}</div>`
        : `<code>oc delete rolebinding &lt;name&gt; -n &lt;namespace&gt;</code>`}</li>
      <li><strong>Confirm it is gone</strong> here on the next refresh.</li>
    </ol>
    ${firstBinding ? `<p class="note mt-5">The command is filled in from the
      worst row of the table above (<code>${esc(firstBinding.binding_name)}</code> in
      <code>${esc(firstBinding.binding_namespace)}</code>), so it can be copied rather than assembled.</p>` : ""}
    <p class="note"><strong>Operational goal:</strong> zero rows on this page. At zero, one directory change
      offboards a person from the entire cluster, and an access review that reads clean <em>is</em> clean.</p>
  </section>`;
}

const GRANT_SORT = {
  person: (b) => b.user_name,
  /* Sort the ROLE by privilege, not alphabetically: "admin" < "edit" < "view" as text puts the
     dangerous grants in the middle, which is the opposite of useful. */
  risk: (b) => (PRIVILEGE_RANK[b.role_name] || 0) * 10 + (b.binding_namespace ? 0 : 1),
  scope: (b) => b.binding_namespace || "",
  binding: (b) => b.binding_name
};

        : `<p class="empty-note">No direct grants${view.pick === "all" ? "" : ` in ${esc(view.pick)}`}.</p>`}
      ${view.pick === "all" ? "" : `<p class="note mt-5">Filtered to
        <code>${esc(view.pick)}</code>. On the shipped page this is a <em>server-side</em> filter — choosing a
        namespace refetches, and <code>total</code> then describes that namespace rather than the cluster.
        The five numbers at the top of the page do not move, and that is deliberate.</p>`}
      ${ub.truncated ? "" : `<div class="shape-ex"><span class="lbl">Shape — not this cluster</span>
        <div class="trunc">Showing the <strong>200</strong> highest-privilege of <strong>2,280</strong> grants.

          see them.</div>
        <p class="note mt-5">The server returns at most 200, worst-first, and
          reports <code>total</code> before the limit, so a truncated page is the top of the list rather than a

/* ── the namespace list: the audit's other half, and a different question ──────────────────── */

  const keys = n.label_keys || [];
  const all = n.namespaces || [];
  const shown = all.filter((x) => matches([x.name, ...keys.map((k) => (x.labels || {})[k])], view.search));

    <h2>Namespaces <span class="count">· ${shown.length === all.length ? all.length : `${shown.length} of ${all.length} shown`}</span></h2>

      captured label, and it filters <strong>both</strong> this list and the worklist above; on the shipped page
      it reaches this card only.</p>
    ${src.state === "forbidden" ? `<div class="trunc">The namespace read was refused, so this list cannot attest
      absence — a namespace missing here may exist. Grant namespaces [get,list] (chart:
      <code>rbac.namespaces</code>).</div>` : ""}
    <p class="note">${n.cluster_wide_groups} ${plural(n.cluster_wide_groups, "group")} bound cluster-wide and
      ${n.cluster_wide_grants} cluster-wide direct ${plural(n.cluster_wide_grants, "grant")} reach every namespace
      below; the columns count what is bound <em>in</em> each one. A namespace with zero in both is a result an
      access review wants to confirm.</p>
    ${shown.length ? `<div class="scroll-x"><table class="stack compact">
      <thead><tr><th>Namespace</th>${keys.map((k) => `<th>${esc(k.split("/").pop())}</th>`).join("")}
        <th class="num">Via groups</th><th class="num">Direct grants</th></tr></thead>
      <tbody>${shown.map((x) => `<tr>
        <td data-l="Namespace"><button type="button" class="drill" data-ns="${esc(x.name)}">${esc(x.name)}</button></td>
        ${keys.map((k) => `<td data-l="${esc(k.split("/").pop())}" class="mono muted">${esc((x.labels || {})[k] || "—")}</td>`).join("")}

        <td data-l="Direct grants" class="num${x.direct_grants ? " err" : " muted"}">${x.direct_grants}</td></tr>`).join("")}</tbody>
    </table></div>`
      : `<p class="empty-note">Nothing matches <strong>${esc(view.search.trim())}</strong>. All ${all.length} are
          still there — the filter is hiding them. Press Escape in the box to clear.</p>`}
  </section>`;
}

/* ── what the other tiers get ──────────────────────────────────────────────────────────────── */
function selfRows() {
  if (view.tier === "self-jdoe") return LAB.self["jdoe"].bindings || [];

}

    <h2>Namespace audit</h2>
    <div class="scope-banner"><strong>Your own grants.</strong> This is the narrowed view: bindings that name
      <strong>${esc(ub.viewer)}</strong> and nothing about anybody else. None of the wide view's aggregates —

}

    <h2>Namespaces <span class="count">· your own paths</span></h2>

}

function withheldView() {
  return refusalCard("Namespace audit",
    "The per-namespace worklist of direct user grants names people and their access.")
    + `<section class="card">
      <h3>When this card is what a reader gets</h3>
      <p class="note">The page never decides this: both narrowed shapes are the server's call, read off the wire.
        A scoped payload renders the viewer's own grants; a designed 403 renders this card. On the five clusters
        configured today every one is <code>visibility: inherit</code> with <code>identity: same-as-host</code>,
        so a signed-in reader is always scoped rather than refused — this card needs a cluster whose policy is
        <code>self-only</code> with <code>identity: none</code>, where there is no name to key the rows on.</p>
      <p class="note">Measured: the endpoint answers
        <code>${esc(LAB.self.noIdentity)}</code> when there is no viewer to scope to.</p>
    </section>`;
}

      <button type="button" class="back" id="back">← all namespaces</button>

      <p class="note">This mock embeds the measured payload for
        ${Object.keys(d.detail).map((n) => `<code>${esc(n)}</code>`).join(", ")} only. Rather than draw a plausible
        page for <code>${esc(view.ns)}</code>, here is the request that would fill it:</p>
      <div class="cmd">curl -s -H 'X-Forwarded-User: kubeadmin' \\
  localhost:8080/api/clusters/${esc(view.cluster)}/namespaces/${esc(view.ns)}</div>
      <p class="note mt-6">Every namespace in the list is a link on the shipped page

         naming convention, so no mnemonic-based report will ever pick it up.`)

  return `<section class="card">
    <button type="button" class="back" id="back">← all namespaces</button>
    <h2>${esc(det.name)}${det.present ? "" : ` ${badge("unknown", "no longer on the cluster")}`}</h2>

      ${keys.map((k) => `<div class="kpi"><div class="label">${esc(k.split("/").pop())}</div>

      <div class="kpi"><div class="label">Reached cluster-wide</div><div class="value">${wideBindings}</div></div>
    </div>
    <p class="note mt-6">${labelledNote}
      ${people.length ? "" : " No RoleBinding names a person here directly, which is the state an access review wants to confirm."}
      ${det.present ? "" : " The store no longer holds this namespace; what follows is what still names it."}</p>
    <p class="note"><strong>Via groups ${viaReal.length}</strong> and <strong>People who reach it ${det.people}</strong>
      are not the same denominator, and on the shipped page that reads as a contradiction: the people arrive through
      the <strong>${wideBindings}</strong> cluster-wide bindings in the card below, which grant every namespace and
      are therefore not <em>in</em> this one. The fourth tile above is that number, so the row adds up where a reader
      looks.</p>
  </section>

  <section class="card">
    <h3>Who reaches it, and through which group <span class="count">· ${viaReal.length}${
      viaPlatform.length ? ` · ${viaPlatform.length} platform` : ""}</span></h3>
    <p class="note">The answer the triangle exists for: a namespace, back to the groups that grant it, back to the

    ${via.length ? `<div class="scroll-x"><table class="stack">
      <thead><tr><th>Group</th><th>Role</th><th>Binding</th><th class="num">Members</th></tr></thead>
      <tbody>${via.map((g) => `<tr>
        <td data-l="Group"><button type="button" class="drill" data-group="${esc(g.group_name)}">${esc(g.group_name)}</button>${

      : `<p class="empty-note">No group-based binding names this namespace. Access here is ${people.length

    <p class="note mt-6">Virtual <code>system:</code> groups authorise access but hold
      no person, so they are badged and counted separately: <code>system:image-pullers</code> is in every OpenShift

  </section>

  <section class="card">
    <div class="section-head">
      <h3>Also reached cluster-wide <span class="count">· ${wideBindings} ${plural(wideBindings, "binding")}</span></h3>
      <button type="button" class="disclose linkish" data-toggle="wideOpen" aria-expanded="${view.wideOpen}"
              aria-controls="wide-list"><span class="arrow" aria-hidden="true">${view.wideOpen ? "▾" : "▸"}</span> ${
        view.wideOpen ? "Hide" : "Show"} the ${wideReal.length + wideGrantsReal.length} that name someone</button>
    </div>
    <p class="note">${wideBindings} ${plural(wideBindings, "binding")} grant every namespace on this cluster, so they
      reach this one without naming it: <strong>${wideReal.length}</strong> to real groups,
      <strong>${wideGrantsReal.length}</strong> naming a person directly, and <strong>${widePlatform.length}</strong>
      platform bindings to ${platformNames.length} virtual groups that every namespace carries. The shipped page
      renders all of that as one sentence with ${wideReal.length + wideGrantsReal.length} links in it; it is the
      largest block of text on the page, and it is the answer to “who else can get in here”.</p>
    <div id="wide-list"${view.wideOpen ? "" : " hidden"}>
      <div class="scroll-x"><table class="stack">
        <thead><tr><th>Subject</th><th>Kind</th><th>Role</th><th class="num">Members</th></tr></thead>
        <tbody>${wideReal.map((g) => `<tr>
          <td data-l="Subject"><button type="button" class="drill" data-group="${esc(g.group_name)}">${esc(g.group_name)}</button></td>
          <td data-l="Kind">${badge("ok", "group")}</td>
          <td data-l="Role"><span class="chip priv">${esc(g.role_name)}</span>${
            g.managed_source ? "" : " " + badge("warning", "hand-made")}</td>
          <td data-l="Members" class="num">${g.member_count}</td></tr>`).join("")
        + wideGrantsReal.map((x) => `<tr class="risk-row risk-high">
          <td data-l="Subject"><button type="button" class="drill" data-user="${esc(x.user_name)}">${esc(x.user_name)}</button></td>
          <td data-l="Kind">${badge("warning", "named directly")}</td>
          <td data-l="Role"><span class="chip priv">${esc(x.role_name)}</span></td>
          <td data-l="Members" class="num">—</td></tr>`).join("")}</tbody></table></div>
      <div class="section-head mt-7">
        <span class="muted sm">${widePlatform.length} platform bindings to
          ${platformNames.length} virtual groups</span>
        <button type="button" class="disclose linkish" data-toggle="platformOpen" aria-expanded="${view.platformOpen}"
                aria-controls="platform-list"><span class="arrow" aria-hidden="true">${view.platformOpen ? "▾" : "▸"}</span> ${
          view.platformOpen ? "Hide" : "Show"} them</button>
      </div>
      <div id="platform-list"${view.platformOpen ? "" : " hidden"}>
        <div class="chips">${platformNames.map(([name, n]) =>
          `<span class="chip">${esc(name)} × ${n}</span>`).join("")}</div>
        <p class="note mt-5">Folded most-bound first — <code>system:authenticated</code>
          is every logged-in user and carries most of a cluster's platform bindings.</p>
      </div>
    </div>
  </section>

  ${direct.length ? `<section class="card">
    <h3>Direct grants <span class="count">· ${people.length}${directPlatform.length ? ` · ${directPlatform.length} platform` : ""}</span></h3>
    <p class="note">A person named by a binding rather than reached through a group — the rows a directory change
      cannot offboard. The operational goal for this card is zero.</p>
    <div class="scroll-x"><table class="stack">
      <thead><tr><th>Person</th><th>Role</th><th>Binding</th></tr></thead>
      <tbody>${direct.map((x) => `<tr${x.is_platform ? "" : ' class="risk-row risk-high"'}>
        <td data-l="Person"><button type="button" class="drill" data-user="${esc(x.user_name)}">${esc(x.user_name)}</button>${
          x.is_platform ? " " + badge("unknown", "platform") : ""}</td>
        <td data-l="Role">${badge(/admin|edit/.test(x.role_name) ? "critical" : "warning", x.role_name)}</td>
        <td data-l="Binding"><span class="mono muted">${esc(x.binding_kind)} ${esc(x.binding_name)}</span></td></tr>`).join("")}</tbody>
    </table></div>
  </section>` : ""}

  ${(det.siblings || []).length ? `<section class="card">
    <h3>Same ${esc((det.sibling_key || "").split("/").pop())} <span class="count">· ${esc(labels[det.sibling_key] || "")}</span></h3>
    <p class="note">Sibling namespaces sharing <code>${esc(det.sibling_key)}=${esc(labels[det.sibling_key])}</code>.
      Typing the value in the box finds all ${det.siblings.length + 1} at once.</p>
    <div class="chips">${det.siblings.map((n) =>
      `<button type="button" class="drill" data-ns="${esc(n)}">${esc(n)}</button>`).join("")}</div>
  </section>` : ""}

  <section class="card">
    <h3>History <span class="count">· ${(det.changes || []).length}</span></h3>
    ${det.retention && det.retention.window_days > 0
      ? `<p class="note">History retained since <strong>${esc(det.retention.retained_since)}</strong>; rows older than
          ${det.retention.window_days} days are removed by retention, so a timeline that begins there was cut there —
          it does not mean nothing happened before.</p>`
      : `<p class="note">Retention is off on this deployment (<code>window_days: 0</code>), so the shipped page prints
          no retention line here. With a window set it says that a timeline beginning at the cut was cut there, and
          does not mean nothing happened before.</p>`}
    ${(det.changes || []).length ? `<div class="scroll-x"><table class="stack">
      <thead><tr><th>Change</th><th>Subject</th><th>Role</th><th>Binding</th><th>Observed</th></tr></thead>
      <tbody>${det.changes.map((c) => `<tr>
        <td data-l="Change">${c.baseline ? badge("unknown", "first observed")
          : c.change === "added" ? badge("critical", "+ granted") : badge("ok", "− revoked")}</td>
        <td data-l="Subject"><span class="muted">${esc(c.subject_kind)}</span>
          <button type="button" class="drill" data-${c.subject_kind === "Group" ? "group" : "user"}="${esc(c.subject_name)}">${esc(c.subject_name)}</button></td>
        <td data-l="Role"><span class="chip priv">${esc(c.role_name)}</span></td>
        <td data-l="Binding"><span class="mono muted">${esc(c.binding_kind)} ${esc(c.binding_name)}</span></td>
        <td data-l="Observed"><span class="mono">${esc(c.observed_at)}</span></td></tr>`).join("")}</tbody>
    </table></div>` : `<p class="empty-note">No binding change recorded here since this dashboard started watching.</p>`}
    <p class="note mt-6">Every row on this cluster is <strong>first observed</strong>:
      the store was seeded ${esc((det.retention || {}).retained_since || "when polling began")} and nothing has been
      granted or revoked since. A first observation is not a grant — it is the day the dashboard started watching.</p>
  </section>`;
}

/* ── the shapes this page can take, drawn where a reader can find them ─────────────────────── */
function shapesCard() {
  const preview = { namespace: "SHAPE", users: ["asmith", "bwilliams", "jdoe", "dana.lee", "jane.smith", "tmp-contractor-9931", "lateef.o", "john.doe", "sarah.jones"], distinct_users: 9, bindings: 12, worst_privilege: 3 };
  return `<section class="card">
    <h3>States this page has, that this cluster does not show</h3>
    <p class="note">Each box is a shape from the code with no lab data behind it. They are drawn rather than
      described because a caveat a reader never sees is a caveat that was deleted — and because three of them are
      the states that matter most when something is wrong.</p>

    <div class="shape-ex"><span class="lbl">Shape — a roster past the preview bound (${WHO_PREVIEW})</span>
      <div class="scroll-x"><table class="stack"><thead><tr><th>Namespace</th><th class="num">People</th><th>Who is exposed</th></tr></thead>
        <tbody><tr class="risk-row risk-high">
          <td data-l="Namespace"><span class="ns-name mono">a-busy-namespace</span></td>
          <td data-l="People" class="num">${preview.distinct_users}</td>
          <td data-l="Who is exposed" class="who">${whoCellShape(preview)}</td></tr></tbody></table></div>
      <p class="note mt-5">The bound is <strong>${WHO_PREVIEW}</strong> on purpose: a
        namespace with forty direct grants would otherwise put forty names in one cell and that column would decide
        the width of the whole table — on the view that is supposed to be the scannable one. The names are
        corroboration; the full roster is in <em>Every grant</em>. The widest roster on this cluster is 3, so the
        control never appears on the live page.</p></div>

    <div class="shape-ex"><span class="lbl">Shape — the goal state</span>
      ${zeroCard()}
      <p class="note mt-5">Zero rows is the operational goal, and it is a different
        page rather than an empty table: at zero the sentence explains what has been achieved.</p></div>

    <div class="shape-ex"><span class="lbl">Shape — a namespace outside a narrowed reader's view</span>
      ${refusalCard("legacy-payments", `Only namespaces your own memberships or grants reach are visible at your
        tier. This one is outside your view — or does not exist; the two are deliberately indistinguishable.`, false)}
      <p class="note mt-5">Measured: <code>GET …/namespaces/legacy-payments</code> as
        <code>jeff</code> answers <strong>403</strong> — <code>${esc(LAB.self.detailRefusal)}</code>.</p></div>

    <div class="shape-ex"><span class="lbl">Shape — loading</span>
      <section class="card"><p class="empty-note">Loading…</p></section>
      <p class="note mt-5">Loading is a real state: the page fails closed rather than
        rendering an empty truth. An audit that flashes “0 namespaces at risk” while its data is in flight has told
        the reader the opposite of what it knows.</p></div>
  </section>`;
}
function whoCellShape(row) {
  const users = row.users || [];
  const open = view.shapeWhoOpen;
  const shown = open ? users : users.slice(0, WHO_PREVIEW);
  const hidden = users.length - shown.length;
  return `<span class="chips">${shown.map((u) => `<span class="chip person">${esc(u)}</span>`).join("")}</span>`
    + `<button type="button" class="linkish" id="shape-who">${open ? "show fewer" : `+${hidden} more`}</button>`;
}

/* ── provenance ────────────────────────────────────────────────────────────────────────────── */
function renderProv() {
  const d = lab();
  document.getElementById("prov").innerHTML = `
    <h2>Where every number on this page came from</h2>
    <p>Read from the lab on <strong>${esc(LAB.measured.at)}</strong> against the deployed dashboard
      <code>v${LAB.measured.app.version} · ${LAB.measured.app.sha}</code>, and embedded verbatim in this file
      (<code>#lab-json</code>). The request shape was
      <code>${esc(LAB.measured.how)}</code>.</p>
    <table><tbody>
      <tr><td><code>/api/clusters/${esc(view.cluster)}/user-bindings</code></td>
        <td>the verdict, the worklist, Every grant — <code>total ${d.audit.total}</code>,
          <code>excluded_platform ${d.audit.excluded_platform}</code></td></tr>
      <tr><td><code>/api/clusters/${esc(view.cluster)}/namespaces</code></td>
        <td>the namespace list — ${d.namespaces.count} rows, label keys
          <code>${(d.namespaces.label_keys || []).map(esc).join("</code>, <code>")}</code></td></tr>
      <tr><td><code>/api/clusters/${esc(view.cluster)}/namespaces/&lt;name&gt;</code></td>
        <td>each namespace page — ${Object.keys(d.detail).length} captured; the cluster-wide arrays are identical
          across all of them (checked), so they are stored once</td></tr>
      <tr><td><code>X-Forwarded-User: jdoe</code> / <code>alice.cooper</code> / <code>jeff</code></td>
        <td>the narrowed views, taken through the pod's loopback because the self tier is cookie-only</td></tr>
      <tr><td><code>/metrics</code></td>
        <td>carries <strong>no</strong> count from this page. The only public trace of the finding is
          <code>gsd_alerts_total{kind="direct_user_binding",severity="warning"} 1</code> per cluster — one alert,
          never the names or the number</td></tr>
    </tbody></table>
    <p><strong>Proposed token change.</strong> <code>--page-2</code>, the top stop of the body wash, is
      <code>#e3e6ef</code> here against the shipped <code>#eef0f4</code>; <code>--page</code> is untouched at
      <code>#f9f9f7</code>. The version line in the header is <code>--text-secondary</code> rather than the
      shipped <code>--text-muted</code>, because at 12px on the darkest band of the wash it measured 4.57:1 on the
      live page — 0.07 above the bar, which is not headroom to spend. Contrast was measured from the painted
      pixels, not from the tokens: <code>reports/2026-09-21_nsaudit-mock/render-check.py</code>.</p>`;
}

/* ── render and wire ───────────────────────────────────────────────────────────────────────── */
function render() {
  renderShell();
  renderFilters();
  const main = document.getElementById("main");
  if (view.tier === "withheld") main.innerHTML = withheldView();
  else if (view.ns) main.innerHTML = detailView();
  else if (view.tier !== "admin") main.innerHTML = selfView();
  else main.innerHTML = verdictCard() + clusterWideCard() + worklistCard() + reasonsCard()
    + runbookCard() + everyGrantCard() + inventoryCard() + shapesCard();
  renderProv();
  wire();
}

function wire() {
  const $ = (id) => document.getElementById(id);
  const mode = $("pref-mode"), palette = $("pref-palette");
  mode.value = document.documentElement.getAttribute("data-theme") || "";
  palette.value = document.documentElement.getAttribute("data-palette") || "";
  mode.onchange = () => {
    const v = mode.value;
    if (v) document.documentElement.setAttribute("data-theme", v);
    else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem("gsd-mode", v); } catch (e) { /* private mode */ }
  };
  palette.onchange = () => {
    const v = palette.value;
    if (v) document.documentElement.setAttribute("data-palette", v);
    else document.documentElement.removeAttribute("data-palette");
    try { localStorage.setItem("gsd-palette", v); } catch (e) { /* private mode */ }
  };
  const cluster = $("f-cluster");
  if (cluster) cluster.onchange = () => {
    if (!LAB.clusters[cluster.value]) { cluster.value = view.cluster; return; }
    view.cluster = cluster.value; view.ns = null; view.pick = "all"; view.whoOpen = new Set(); render();
  };
  const tier = $("f-tier");
  if (tier) tier.onchange = () => { view.tier = tier.value; view.ns = null; render(); };
  const search = $("f-ns-search");
  if (search) {
    /* `input`, not `change`: it filters as the reader types, and every list it filters is already
       in the browser, so filtering is a repaint and costs no round trip. The caret is restored
       after the repaint — a fresh input opens with its caret at 0, so a reader typing into a box
       that repaints types into the FRONT of their own text. */
    search.oninput = (e) => {
      const pos = e.target.selectionStart;
      view.search = e.target.value;
      render();
      const el = $("f-ns-search");
      if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) { /* type=search */ } }
    };
    search.onkeydown = (e) => {
      if (e.key === "Escape" && view.search) { e.preventDefault(); view.search = ""; render(); const el = $("f-ns-search"); if (el) el.focus(); }
    };
  }
  document.querySelectorAll("button.sorter").forEach((el) => {
    el.onclick = () => {
      if (el.dataset.group === "grant") { view.grantSort = el.dataset.sort; view.grantDir = el.dataset.dir; }
      else { view.nsSort = el.dataset.sort; view.nsDir = el.dataset.dir; }
      render();
    };
  });
  const reset = $("ns-reset");
  if (reset) reset.onclick = () => { view.nsSort = "risk"; view.nsDir = "desc"; render(); };
  document.querySelectorAll("[data-toggle]").forEach((el) => {
    el.onclick = () => { view[el.dataset.toggle] = !view[el.dataset.toggle]; render(); };
  });
  document.querySelectorAll("[data-who]").forEach((el) => {
    el.onclick = () => {
      const ns = el.dataset.who;
      view.whoOpen.has(ns) ? view.whoOpen.delete(ns) : view.whoOpen.add(ns);
      render();
    };
  });
  const shapeWho = $("shape-who");
  if (shapeWho) shapeWho.onclick = () => { view.shapeWhoOpen = !view.shapeWhoOpen; render(); };
  const pick = $("ns-pick");
  /* `onchange`, not `oninput`: a <select> fires input per keyboard arrow while the list is open,
     and on the shipped page each one would be a refetch for a namespace the reader is passing over. */
  if (pick) pick.onchange = () => {
    view.pick = pick.value;
    /* Choosing a namespace to inspect and then having to expand the list is a pointless second click;
       the selection IS the request to see it. */
    if (view.pick !== "all") view.grantsOpen = true;
    render();
  };
  const clear = $("ns-pick-clear");
  if (clear) clear.onclick = () => { view.pick = "all"; render(); };
  document.querySelectorAll("[data-ns]").forEach((el) => {
    el.onclick = () => { view.ns = el.dataset.ns; window.scrollTo(0, 0); render(); };
  });
  const back = $("back");
  if (back) back.onclick = () => { view.ns = null; window.scrollTo(0, 0); render(); };
  const refresh = $("refresh");
  if (refresh) refresh.onclick = () => render();
}

render();
window.MOCK = { view, LAB, render };
})();
</script>
