[project]
name = "group-sync-dashboard"
# THE SOURCE OF TRUTH for the application version. build-and-push-external.sh reads this line to
# build the image tag <version>-<git-sha>, so everything downstream — values.yaml's pin,
# Chart.yaml's appVersion, gsd/__init__.py's __version__ — is held to it by
# tests/test_chart_versions.py rather than maintained by hand in four places.
#
# 0.7.0 and a MINOR bump because /api/clusters/{c}/groupsyncs changed its response for narrowed
# readers: `ldap_filter` and `error_message` are no longer served at the self tier, and the
# reconcile_error alert's `detail` is replaced there. A self-tier consumer parsing either field
# gets a KeyError after this upgrade, which is a contract change and not a patch — administrators
# are unaffected, byte-for-byte.
version = "0.10.0"
description = "Read-only multi-cluster dashboard for the redhat-cop group-sync-operator"
requires-python = ">=3.11"
# FLOORS ARE A SECURITY CONTROL, not just a compatibility statement. These were set once
# at "whatever was current" and then drifted: `httpx>=0.27` still admitted releases with
# known advisories, and nothing stopped a rebuild on a machine with a stale cache — or an
# air-gapped mirror — from resolving to one. A build that silently satisfies an old floor
# is exactly the supply-chain case nobody notices.
#
# Each floor below is a version verified clean on 2026-08-02 against TWO independent
# databases: Trivy (Aqua) and OSV.dev (Google), both reporting zero findings across the
# full resolved tree. Upper bounds are deliberately absent — pinning exact versions in a
# library-style project trades one stale-dependency problem for another; the floor plus
# `pip install --upgrade` at build time keeps us current, and CI re-scans weekly.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.28.1",
    "croniter>=6.2.4",
    "PyYAML>=6.0.3",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gsd*"]

[tool.setuptools.package-data]
# static/** not static/*: the single-level glob silently excluded static/vendor/, so the
# wheel would have shipped without the API-docs bundles and /api would have fallen back to
# the CDN in the built image — the exact failure vendoring them exists to prevent.
gsd = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
