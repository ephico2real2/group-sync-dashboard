# The mock OpenShift API server on CRC — the second cluster the dashboard polls.
#
# This is the Deployment and Service that `docs/handoff/macbook-migration-plan.md` §4.9 had to be
# re-authored from memory on every rebuild, because nothing in git created them. Now it is here.
# The two other pieces of the wiring stay where they are: the serving certificate comes from
# `certmanager-tls.yaml` beside this file (apply that first; the pod mounts the Secret it issues),
# and the dashboard's trust in it is the `mock-cluster-creds` Secret plus the `mock-creds` volume,
# which the plan's §4.9 steps 4 and 5 create because they are per-install and invisible to Helm.
#
#   podman build -f containerfile/Containerfile -t mock-openshift .        # then push as
#   <registry>/group-sync-dashboard/mock-openshift:test
#   oc apply -n group-sync-dashboard -f certmanager-tls.yaml
#   oc apply -n group-sync-dashboard -f mock-openshift.yaml
#
# Runs under restricted-v2: an arbitrary UID in the root group. The image binds 6443 (> 1024) and
# with MOCK_CA_IN set it never writes to disk, so nothing here needs a writable path or a fixed UID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-openshift
  labels:
    app.kubernetes.io/name: mock-openshift
    app.kubernetes.io/part-of: group-sync-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-openshift
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-openshift
        app.kubernetes.io/part-of: group-sync-dashboard
    spec:
      containers:
        - name: mock
          image: image-registry.openshift-image-registry.svc:5000/group-sync-dashboard/mock-openshift:test
          imagePullPolicy: Always
          env:
            # Load the cert-manager-issued CA + leaf instead of minting a throwaway CA at boot,
            # so the CA the dashboard trusts stays stable across restarts and leaf renewals.
            - name: MOCK_CA_IN
              value: /certs
            # CRC ON APPLE SILICON: the cryptography wheel's statically linked OpenSSL trusts the guest
            # kernel's HWCAP, which under Virtualization.framework advertises sve2/svei8mm that the
            # hardware does not implement, and the accelerated path it picks dies with SIGILL (exit 132)
            # on import. Measured on this node: cryptography >= 48.0.0 exit 132, <= 46.0.3 fine, and
            # 50.0.1 with this variable imports and generates a 2048-bit RSA key. 0 disables OpenSSL's
            # ARM assembly and uses the generic C paths — harmless on amd64 and on real arm64 hosts.
            - name: OPENSSL_armcap
              value: "0"
          ports:
            - name: https
              containerPort: 6443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: mock-tls   # ca.crt, tls.crt, tls.key — the three files MOCK_CA_IN reads
---
apiVersion: v1
kind: Service
metadata:
  name: mock-openshift
  labels:
    app.kubernetes.io/name: mock-openshift
    app.kubernetes.io/part-of: group-sync-dashboard
spec:
  selector:
    app.kubernetes.io/name: mock-openshift
  ports:
    - name: https
      port: 6443
      targetPort: https
