apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mock-openshift
  name: mock-openshift
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mock-openshift
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mock-openshift
    spec:
      containers:
      - env:
        - name: MOCK_CA_IN
          value: /certs
        - name: MOCK_FIXTURE
          value: /fixtures/reference.yaml
        - name: MOCK_PORT
          value: '6443'
        image: image-registry.openshift-image-registry.svc:5000/group-sync-dashboard/mock-openshift:test
        imagePullPolicy: Always
        name: mock
        ports:
        - containerPort: 6443
          name: https
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 3
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: 6443
          timeoutSeconds: 1
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /certs
          name: certs
          readOnly: true
        - mountPath: /fixtures
          name: fixtures
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: certs
        secret:
          defaultMode: 420
          secretName: mock-tls
      - configMap:
          defaultMode: 420
          name: mock-fixture
        name: fixtures

