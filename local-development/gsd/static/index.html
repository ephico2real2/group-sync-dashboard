      Work top-down: the table above is already in the order to do it in.
    </div>
    <ol class="runbook">
      <li><strong>Identify the role.</strong> Match the grant to the LDAP group the
        operator already syncs for that privilege — the naming convention encodes it
        (<code>&lt;app&gt;-ns-admin</code>, <code>-ns-developer</code>,
        <code>-ns-audit</code>).</li>
      <li><strong>Add the person to that group</strong> in the enterprise directory, through
        the normal request-and-approve path. Access now has an owner and an audit trail.</li>
      <li><strong>Wait one sync</strong> and confirm on the Groups tab that they appear as a
        member. Do not skip this — deleting first leaves them locked out.</li>
      <li><strong>Delete the direct binding.</strong>
        <code>oc delete rolebinding &lt;name&gt; -n &lt;namespace&gt;</code></li>
      <li><strong>Confirm it is gone</strong> here on the next refresh.</li>
    </ol>
    <div class="filterbar-note mt-5">
      <strong>Operational goal:</strong> zero rows on this page. At zero, one directory
      change offboards a person from the entire cluster, and an access review that reads
      clean <em>is</em> clean.
    </div>
  </section>

  <section class="card">
    <div class="section-head">
      <h3 class="flush">Every grant</h3>
      <button type="button" class="disclose" data-ns-grants
              aria-expanded="${view.nsGrantsOpen}" aria-controls="every-grant">
        <span class="disclose-arrow" aria-hidden="true">${view.nsGrantsOpen ? "▾" : "▸"}</span>
        ${view.nsGrantsOpen ? "Hide" : "Show"} ${total} grant${total === 1 ? "" : "s"}
      </button>
    </div>
    <div class="filterbar-note mb-5">
      The per-namespace table above is the view to work from. This is the flat detail
      list — collapsed by default on purpose, because on a cluster with thousands of
      direct grants rendering every row costs time nobody gets value from.
    </div>
    <div class="ns-controls">
      <label for="ns-pick">Namespace</label>
      <select id="ns-pick" data-ns-pick>
        <option value="all"${view.nsNamespace === "all" ? " selected" : ""}>
          All namespaces (${rows.length})</option>
        ${rows.map((r) => `<option value="${esc(r.namespace)}"${
          view.nsNamespace === r.namespace ? " selected" : ""}>${
          r.namespace === "(cluster-scoped)" ? "cluster-wide" : esc(r.namespace)
        } — ${r.bindings} grant${r.bindings === 1 ? "" : "s"}</option>`).join("")}
      </select>
      ${view.nsNamespace !== "all"
        ? `<button type="button" class="linkish" data-ns-pick-clear>Clear filter</button>` : ""}
    </div>
    <div id="every-grant"${view.nsGrantsOpen ? "" : " hidden"}>
      ${!bindings.length
        ? `<div class="empty-note">No direct grants${
             view.nsNamespace === "all" ? "" : ` in ${esc(view.nsNamespace)}`}.</div>`
        : `<div class="scroll-x"><table class="audit-table">
        <thead><tr>
          ${sortableTh("Person", "person", view.nsGrantSort, view.nsGrantDir, "grant")}
          ${sortableTh("Grants", "risk", view.nsGrantSort, view.nsGrantDir, "grant")}
          ${sortableTh("Scope", "scope", view.nsGrantSort, view.nsGrantDir, "grant")}
          ${sortableTh("Binding", "binding", view.nsGrantSort, view.nsGrantDir, "grant")}
        </tr></thead>
        <tbody>${sortedGrants.map((b) => {
          const crit = ["cluster-admin", "admin"].includes(b.role_name) || !b.binding_namespace;
          return `<tr class="${crit ? "risk-row risk-high" : ""}">
            <td><strong>${esc(b.user_name)}</strong></td>
            <td><code class="priv">${esc(b.role_name)}</code>
              <span class="muted">${esc(b.role_kind)}</span></td>
            <td>${b.binding_namespace ? esc(b.binding_namespace)
                  : `<strong class="err">cluster-wide</strong>`}</td>
            <td class="muted">${esc(b.binding_name)}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>`}
      ${ub.truncated ? `<div class="filterbar-note truncation-note">
        Showing the <strong>${bindings.length}</strong> highest-privilege of
        <strong>${total}</strong> grants${view.nsNamespace === "all" ? ""
          : ` in ${esc(view.nsNamespace)}`}. The rest are not hidden findings — they are
        ranked below these. Narrow with the namespace selector to see them.
      </div>` : ""}
    </div>
  </section>`;
}

/* The policy operator's CR health. Rendered only when the CRDs exist on the cluster —
   absent is a different truth from "installed with zero CRs", and a section that says
   "all healthy" about a concept the cluster lacks would be a lie of layout. */
/* The Policy tab's strip is the same card the Overview shows for one cluster (#172): one
   renderer, so the contract's sentence and the consequence line cannot drift between the two. */
function configHealth(oc) {
  return configsCard([{ cluster: view.cluster, oc }], { plain: true });
}

function render() {
  // Captured by id before the repaint, restored after it: main.innerHTML replaces every node, so a
  // keyboard user's focus — on Generate while a report renders, on a table's control — would fall to
  // <body> on every poll. The filter bar restores its own (renderFilters); this is the same rule for
  // the page (the C3 report tab's Generate button is where a repaint happens WHILE the reader waits).
  const active = document.activeElement;
  const focusedId = active && active.id;
  // The caret too, as renderFilters() keeps the filter bar's: the repaint re-creates a text input, and a
  // fresh one opens with its caret at 0, so a reader typing into a lookup as the lookups arrived typed into
  // the FRONT of their own text (measured: "abc" then "XYZ" read "XYZabc"; "al" then "i" read "ial" with an
  // empty menu — review of #224, OB3).
  const caret = focusedId && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
  renderFilters();
  // THE SAME IME RULE, FOR THE INDEX'S OWN BOX (#264, Cursor C3). renderFilters returns early while a
  // conversion is unfinished because replacing the node commits half-kana and opens a second session
  // on the new one; `#f-index-search` lives in `#main`, which this function replaces wholesale, so it
  // needs the same guard. compositionend paints the catch-up.
  if (searchComposingIn === "f-index-search"
      && document.activeElement && document.activeElement.id === "f-index-search") return;
  const main = $("main");
  if (view.page === "home") {
    main.innerHTML = homePage();
    wireDrilldown();
    wireNsPage();
    wireHome();
  } else if (view.page === "lookup") {
    main.innerHTML = lookupPage();
    wireDrilldown();
    wireNsPage();
    wireLookup();
  } else if (view.page === "nsaudit" && view.ns) {
    main.innerHTML = nsDetail();
    wireDrilldown();
    wireNsPage();
  } else if (view.page === "nsaudit") {
    main.innerHTML = nsAuditPage();
    wireNsAudit();
    wireNsPage();
    wireLookup();
  } else if (view.page === "policy") {
    main.innerHTML = policyPage();
    wireDrilldown();
  } else if (view.page === "kyverno") {
    main.innerHTML = kyvernoPage();
    wireKyverno();
  } else if (view.page === "clusters") {
    // Reached by URL without the level: the refusal card, not the page — and not a fetch either.
    // The tab is absent for this reader, so arriving here is a pasted link or a stale bookmark.
    // But NEVER on silence (the KPI rule): a null whoami — a poll whose whoami request failed keeps
    // null for it — is indeterminate, and a refusal is a claim about the person. Measured (round 2,
    // OB2 C3): render() with whoami null painted the refusal card for an administrator on the tab.
    // (A cold URL never reaches here before whoami: render() runs after the whole boot fetch —
    // measured too, which is why an earlier "flash" hypothesis was retracted.)
    if (!readerTierKnown()) {
      main.innerHTML = `<section class="card"><h2>Cluster Configurations</h2><div class="empty-note">Loading…</div></section>`;
    } else {
      main.innerHTML = ccMayView() ? clusterConfigPage() : refusalCard("Cluster Configurations", CLUSTERS_REFUSAL);
      if (ccMayView()) wireClusterConfig();
    }
  } else if (view.page === "kpi") {
    // The same tier rule as the Overview, in the same words: the page is about the clusters and
    // the dashboard's own pods, and answers nothing a reader can ask about themselves. Keyed on the
    // HOST's headline, as Reports is and as the fetch is: the page is fleet-wide, so a narrowed
    // remote left selected must not refuse a host administrator (review of #157, Grok).
    if (!readerTierKnown()) {
      main.innerHTML = `<section class="card"><div class="empty-note">Loading…</div></section>`;
    } else if (narrowedOnHost()) {
      main.innerHTML = refusalCard("KPIs", KPI_REFUSAL);
    } else {
      main.innerHTML = kpiPage();
      wireKpi();
    }
  } else if (view.page === "logins") {
    main.innerHTML = loginsPage();
    // wireDrilldown, not a handler of its own: a username here goes to the SAME user page the
    // group tables drill into, through the same navigate() call, so Back behaves identically
    // whichever table the reader arrived from.
    wireDrilldown();
  } else if (view.page === "reports") {
    main.innerHTML = reportsPage();
    wireReports();
    // #173: the form is landed in view once per ARRIVAL at a report position — a click, a pasted
    // link (whose form only exists once the catalogue has arrived, a render later), Forward — and
    // never on the poll's repaint of the same position. Measured on the deployed page: the click
    // landed at 100 px, the same link on a fresh load left the form at 849 on an 800 px viewport.
    const landed = view.report && $("report-form") ? view.report : null;
    if (landed !== view.reportLanded) { view.reportLanded = landed; if (landed) landReportForm(); }
    if (view.reportFocusRow && view.reportFocusRow !== view.report) {
      // Back landed on the catalogue (no form): the row of the form just left takes the focus. Back to
      // another report's form keeps its own #report-back through the by-id restore.
      const row = view.report ? null : $(`report-pick-${view.reportFocusRow}`); view.reportFocusRow = null;
      if (row) row.focus();
    }
  } else if (view.page === "reporting") {
    main.innerHTML = reportingPage();
    wireReporting();
  } else if (view.page === "library") {
    main.innerHTML = libraryPage();
    wireLibrary();
  } else if (view.page === "usage") {
    main.innerHTML = usagePage();
  } else if (view.page === "bindings") {
    main.innerHTML = bindingsPage();
    wireDrilldown();
  } else if ((view.page === "groups" || view.page === "users") && view.user) {
    // One user page, reached from either tab: the Users tab is the other list that drills to it,
    // and staying under the tab the reader came from is what makes Back read "← all users".
    main.innerHTML = userDetail();
    wireDrilldown();
  } else if (view.page === "users") {
    main.innerHTML = usersPage();
    wireDrilldown();
    wireLookup();
  } else if (view.page === "groups" && view.group) {
    main.innerHTML = groupDetail();
    wireDrilldown();
    wireLookup();
  } else if (view.page === "groups") {
    main.innerHTML = groupsPage();
    wireDrilldown();
    wireLookup();
  } else if (view.groupsync) {
    main.innerHTML = groupsyncDetail();
    const back = $("back");
    if (back) back.onclick = () => { goBack(); };
    wireTooltip();
  } else if (!readerTierKnown()) {
    // The Overview layout itself claims a tier. Until whoami answers, neither the wide
    // cluster surface nor a named refusal is truthful, so preserve the page's established
    // unresolved-payload state instead of flashing either claim.
    main.innerHTML = `<section class="card"><div class="empty-note">Loading…</div></section>`;
  } else if (narrowedReader()) {
    // Overview is the cluster's OWN health — sync CRs, the operator that templates access,
    // cluster-wide counts. None of it answers anything a reader can ask about themselves, so
    // it is the administrator tier. A named refusal rather than a hidden tab: a tab that
    // vanishes reads as a broken build, and the reader cannot tell which of the two it is.
    main.innerHTML = refusalCard("Overview",
      `This page reports the cluster's own health — its GroupSync CRs, the policy operator
       that templates every synced group's access, and cluster-wide totals.`);
  } else {
    main.innerHTML = overviewPage();
    wireOverview();
  }
  // Same reason the cluster selector is hidden on Usage: the scope note would claim a
  // cluster scope this page does not have.
  // Part of the bold title, not a muted aside: on a screen shared in a review the cluster is
  // half of what the title means, and " - prod-east" set in grey read as decoration.
  //
  // Still suppressed on Usage for the same reason the cluster selector is: that page is
  // per-pod dashboard activity, not per-cluster, so naming a cluster would claim a scope the
  // page does not have.
  $("scope-note").textContent =
    view.cluster && view.page !== "usage" && view.page !== "kpi" ? ` - ${view.cluster}` : "";
  // UTC, like every other time on the page, and labelled so.
  //
  // This was `toTimeString()` — the browser's LOCAL zone — while fmtTime() renders UTC with
  // a trailing Z and the Usage tab buckets by UTC day. An operator in CDT therefore read a
  // header five hours adrift from the timestamps directly beneath it, with nothing on screen
  // to say the two were measured differently. One clock per page, or the page is lying to
  // somebody.
  $("last-refresh").textContent = "updated " + fmtTime(new Date().toISOString()).slice(11);
  if (data.version) {
    const v = data.version;
    // Shown in the header so "is my change deployed?" is answerable by looking, rather
    // than by inspecting the image. `dirty` is called out because such a build matches
    // no commit at all.
    $("build-info").textContent = `v${v.version} · ${v.commit}${v.dirty ? " (dirty)" : ""}`;
    $("build-info").title = `branch ${v.branch}`;
  }
  // After the page, so a refusal card and the pill can never disagree about the tier
  // within one paint.
  renderScopePill();
  main.classList.remove("stale");
  if (focusedId && document.activeElement !== document.getElementById(focusedId)) {
    const el = document.getElementById(focusedId);
    if (el && main.contains(el)) {
      el.focus({ preventScroll: true });
      if (caret && typeof el.selectionStart === "number") {
        try { el.setSelectionRange(Math.min(caret[0], el.value.length), Math.min(caret[1], el.value.length)); } catch (e) { /* an input type without a caret */ }
      }
    }
  }
}

/* Namespace-audit controls: sort, namespace selector, and the detail-list disclosure.
   Re-bound after every render because render() replaces main's innerHTML wholesale, which
   discards the previous elements and their handlers along with them. */
function wireNsAudit() {
  // #257: the platform toggle. A pure re-render of data already held — the hidden rows are in the
  // payload, so showing them is a filter change and never a refetch. Focus is restored to the
  // control afterwards: it is the one thing the reader just pressed, and `render()` rebuilds the
  // card under them, which would otherwise drop focus to the document.
  // Two ids, one behaviour: the control beside the count, and the one inside the empty state a
  // fully-hidden cluster renders instead of that count (#257, Codex C8).
  ["ns-show-platform", "ns-show-platform-empty"].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.onclick = () => {
      view.nsShowPlatform = !view.nsShowPlatform;
      view.nsIndexPage = 1;   // the set changed size; page 4 of the old set may not exist
      // "SHOW THEM" MEANS SHOW (review of #264, Cursor C4). With the fold still "decide by size", the
      // platform rows can carry a 20-row open list past INDEX_FOLD, and the reader who asked to see
      // more would watch the rows vanish behind a fold. Asking for rows opens the list; a fold the
      // reader chose themselves (an explicit false) stands, and hiding rows never folds a list.
      if (view.nsShowPlatform && view.nsIndexOpen === null) view.nsIndexOpen = true;
      render();
      const again = document.getElementById("ns-show-platform") || document.getElementById(id);
      if (again) again.focus();
    };
  });

  // #261: the fold, the section's own search and the pager.
  const fold = document.getElementById("ns-index-fold");
  if (fold) fold.onclick = () => {
    // The button is only rendered where it can act, so its aria-expanded IS the section's state.
    view.nsIndexOpen = fold.getAttribute("aria-expanded") !== "true";
    render();
    const again = document.getElementById("ns-index-fold");
    if (again) again.focus();
  };

  const indexBox = document.getElementById("f-index-search");
  if (indexBox) {
    indexBox.oninput = (e) => {
      view.nsIndexSearch = indexBox.value;
      view.nsIndexPage = 1;   // EVERY filter change resets the page (#261): narrowing to six matches
                              // while the reader sits on page 3 would otherwise show them nothing.
      // MID-COMPOSITION BELONGS TO THE IME (#264, Cursor C3). Repainting here replaces the node the
      // IME is composing into — the same rule renderFilters keeps for the bar's boxes. The state is
      // kept, and compositionend paints.
      if (e.isComposing) return;
      // AND THE CARET STAYS WHERE IT WAS, not at the end. This handler used to force it to the end
      // after the repaint, which made editing mid-string impossible: every keystroke jumped the
      // cursor, so a typo in the middle of a query could not be corrected. render() already puts
      // focus AND the caret back by id — the same restore the 60 s poll relies on — so nothing here
      // may move it (review of #264, Cursor C3).
      render();
    };
    indexBox.addEventListener("compositionstart", () => { searchComposingIn = "f-index-search"; });
    indexBox.addEventListener("compositionend", (e) => {
      searchComposingIn = null;
      view.nsIndexSearch = e.target.value;
      view.nsIndexPage = 1;
      render();
    });
    indexBox.addEventListener("blur", () => {
      if (searchComposingIn === "f-index-search") searchComposingIn = null;
    });
    indexBox.onkeydown = (e) => {
      if (e.key !== "Escape" || e.isComposing || !indexBox.value) return;
      e.stopPropagation();   // the shell clears its own box on Escape; this one is not the shell's
      // The query's pin on the fold goes with the query; the reader's own choice — opened, folded or
      // never decided — is not this key's to change.
      view.nsIndexSearch = ""; view.nsIndexPage = 1;
      render();
    };
  }

  // `data-index-page`, not `data-page`: the mock's render check caught `[data-page]` also matching
  // `<body data-page="nsaudit">`, so every click anywhere ran the pager and emptied the list.
  document.querySelectorAll("#ns-index-pager [data-index-page]").forEach((el) => {
    el.onclick = () => {
      const to = Number(el.dataset.indexPage);
      if (!Number.isFinite(to)) return;
      view.nsIndexPage = to;
      render();
      // render() keeps focus on the button pressed, by id. Previous and Next at an end come back
      // disabled, which is not focusable, so focus would fall to <body> and a keyboard reader would
      // hear nothing about where they landed: the current page's number is where they are.
      const nav = document.getElementById("ns-index-pager");
      if (nav && !nav.contains(document.activeElement)) {
        const cur = nav.querySelector('[aria-current="page"]');
        if (cur) cur.focus();
      }
    };
  });
  document.querySelectorAll("[data-sort-key]").forEach((el) => {
    el.onclick = () => {
      const grant = el.dataset.sortGroup === "grant";
      if (grant) { view.nsGrantSort = el.dataset.sortKey; view.nsGrantDir = el.dataset.sortDir; }
      else { view.nsSort = el.dataset.sortKey; view.nsDir = el.dataset.sortDir; }
      render();  // Pure re-sort of data already held — no refetch, so it is instant.
    };
  });
  const reset = document.querySelector("[data-ns-reset]");
  if (reset) reset.onclick = () => { view.nsSort = "risk"; view.nsDir = "desc"; render(); };

  const pick = document.querySelector("[data-ns-pick]");
  // `onchange`, not `oninput`: a <select> fires input per keyboard arrow while the list is
  // open, and each one would be a refetch for a namespace the reader is only passing over.
  if (pick) pick.onchange = () => {
    view.nsNamespace = pick.value;
    // Choosing a namespace to inspect and then having to expand the list is a pointless
    // second click; the selection IS the request to see it.
    if (view.nsNamespace !== "all") view.nsGrantsOpen = true;
    refresh();  // Server-side filter, so this one does need a round trip.
  };
  const clear = document.querySelector("[data-ns-pick-clear]");
  if (clear) clear.onclick = () => { view.nsNamespace = "all"; refresh(); };

  document.querySelectorAll("[data-who]").forEach((el) => {
    el.onclick = () => {
      const ns = el.dataset.who;
      // Pure re-render of data already held — no refetch, so it is instant.
      view.nsWhoOpen.has(ns) ? view.nsWhoOpen.delete(ns) : view.nsWhoOpen.add(ns);
      render();
    };
  });

  const disclose = document.querySelector("[data-ns-grants]");
  if (disclose) disclose.onclick = () => { view.nsGrantsOpen = !view.nsGrantsOpen; render(); };
}

function wireDrilldown() {
  // `page: "groups"` on every one of these, and it is a FIX rather than tidying. A group or user
  // detail renders only under that page — render() dispatches on view.page first — so a drill
  // from Access granted, RBAC policy or Logins used to set view.group in the URL and then repaint
  // the page the reader was already on. Proved before changing it: clicking a group name on
  // Access granted gave `#page=bindings&group=was-managed` with the binding tiers still on
  // screen. The affordance looked like a link, was focusable, announced as a button, and went
  // nowhere. Naming the destination page here is what makes one drill handler correct from every
  // table that emits one, instead of each page needing its own.
  document.querySelectorAll("[data-group]").forEach((el) => {
    el.onclick = (e) => {
      // As the user drill below: a `data-group` button inside a `tr[data-group]` (the user page's
      // memberships and history) fired both handlers — two navigations, two fetches (review of #167, pass 3).
      e.stopPropagation();
      navigate({ page: "groups", group: el.dataset.group, user: null, ns: null });
      refresh();
    };
  });
  document.querySelectorAll('[data-sort-group="bind"]').forEach((el) => {
    el.onclick = () => { view.bindingSort = el.dataset.sortKey; view.bindingDir = el.dataset.sortDir; render(); };
  });
  document.querySelectorAll("[data-ufilter]").forEach((el) => {
    el.onclick = () => { view.userFilter = el.dataset.ufilter; render(); };
  });
  const neverToggle = $("toggle-never-names");
  if (neverToggle) neverToggle.onclick = () => { view.showNeverNames = !view.showNeverNames; render(); };
  document.querySelectorAll("[data-user]").forEach((el) => {
    const go = (e) => {
      e.stopPropagation();
      navigate({ page: view.page === "users" ? "users" : "groups", user: el.dataset.user, group: null, ns: null });
      refresh();
    };
    el.onclick = go;
  });
  // Keyboard parity: a drillable name is reachable by Tab and fires on Enter/Space, so the
  // affordance is not mouse-only. ONE path — the click's — for every drill: the handler used to
  // cancel the key and then navigate only for a person's name, so Enter on a group's name (or a
  // namespace's) went nowhere while the click worked (review of #167, pass 2: Grok, Codex).
  document.querySelectorAll(".drill").forEach((el) => {
    el.onkeydown = (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      el.click();
    };
  });
  const back = $("back-groups");
  if (back) back.onclick = () => { goBack(); };
}

/* Hover enhances; it never gates a value — the same numbers are in the table below. */
function wireTooltip() {
  const tip = $("tip");
  if (!tip) return;
  document.querySelectorAll("circle.hit").forEach((h) => {
    const show = (e) => {
      const wrap = h.closest(".chart-wrap").getBoundingClientRect();
      const r = h.getBoundingClientRect();
      tip.innerHTML = `<div><span class="t-label">synced</span> ${esc(fmtTime(h.dataset.t))}</div>
        <div><span class="t-label">groups</span> ${esc(h.dataset.v)}</div>`;
      tip.style.left = Math.max(0, r.left - wrap.left - 40) + "px";
      tip.style.top = (r.top - wrap.top - 52) + "px";
      tip.classList.add("on");
    };
    const hide = () => tip.classList.remove("on");
    h.addEventListener("mouseenter", show);
    h.addEventListener("mouseleave", hide);
    h.addEventListener("focus", show);
    h.addEventListener("blur", hide);
    h.setAttribute("tabindex", "0");
  });
}

/* ---------- data ---------- */

/* Bumped by every refresh(). A drill-down that is still in flight when the reader navigates away
   is SUPERSEDED, and its response must not paint: it writes data.group/data.user and calls
   render(), which re-derives from the current `view` — so a slow group fetch, a browser Back, and
   a second drill-down left the first group's data on the second group's page. Browser Back made
   this easy to hit, because Back is instant while a fetch is not. */
let navSeq = 0;

// The last painted payload, so an automatic refresh that changed nothing can skip the DOM.
// Deliberately NOT reset by navigation: the point is to compare what the SERVER returned.
let lastFingerprint = null;

// Wall clock of the last refresh() START — any refresh, not only the timer's. Every one of
// them refetches the payloads, so any of them bounds how stale the page can possibly be;
// the visibility catch-up below reads this to decide whether a refetch is owed at all.
let lastRefreshStartedAt = Date.now();

/* The narrowed reader's own access path for the Access granted tab. A 404 is a viewer the
   store has never seen — in no group, no history, no User object — which is an empty state,
   not a fault; every other error is still one. The stand-in declares scope so the banner
   renders from the wire's vocabulary, as scopeBanner requires. */
function myAccessFetch(get, base, viewer, { allowStaleViewer = false } = {}) {
  // `get` is refresh()'s own fetcher (it stamps the interaction), handed in rather than reached
  // for: it is a local of refresh, and a module-level reference to it was a ReferenceError
  // that the error card swallowed — caught by the self-tier UI tests, not by the parser.
  //
  // allowStaleViewer: the SPECULATIVE call refresh() makes for the previous cycle's viewer,
  // before the new whoami arrives. If the session changed hands meanwhile (Alice's tab is now
  // Bob's), that call asks for Alice's path as Bob and the API answers 403 — which is not a
  // fault, only a stale guess: it resolves to null and the follow-up fetches the reader's own
  // path once whoami names them (C1 review, Codex; routed to SPEC_D2).
  return get(`${base}/users/${encodeURIComponent(viewer)}`).catch((e) => {
    if (allowStaleViewer && e.status === 403) return null;
    if (e.status !== 404) throw e;
    return { scope: "self", viewer, user: viewer, bindings: [], unseen: true };
  });
}

async function refresh(opts = {}) {
  // Expired means the page has blanked itself and is leaving: nothing may fetch (a request
  // would re-stamp a sliding proxy's cookie) and nothing may paint (review of C4).
  if (idle.state === "expired") return;
  const seq = ++navSeq;
  const superseded = () => seq !== navSeq;
  lastRefreshStartedAt = Date.now();
  // The dim is feedback for the READER's own request. The timer's refresh dims nothing:
  // with the unchanged-payload skip below, an idle cluster's poll would otherwise pulse
  // the page to 0.55 opacity for the length of a fetch, every interval, changing nothing.
  if (!opts.auto) $("main").classList.add("stale");
  // Count ONE interaction per user-initiated refresh, not one per HTTP request. `get`
  // stamps the first call and then stops, so a click is a click no matter how many
  // endpoints the page happens to need. The timer passes {auto: true} and stamps
  // nothing — it is the browser talking to itself, not a person using the dashboard.
  let mark = !opts.auto;
  const get = (path) => { const m = mark; mark = false; return api(path, m); };
  try {
    if (!data.version) {
      try {
        data.version = await get("/api/version");
        setDisplayZone(data.version.timezone);
      } catch (e) { /* older build */ }
    }
    // Boot only: the default cluster is not known until the list arrives, so the very first
    // cycle pays one extra round trip to learn it. Every later cycle knows view.cluster and
    // dispatches everything below in one burst.
    let bootClusters = null;
    let groupsState = null;   // the `state` the groups rows are requested under this cycle (groupsMeta.state)
    // #172: on the Overview an absent cluster IS a position — the fleet view — so no default is
    // stamped there; every other tab still takes the first cluster exactly as before.
    if (!view.cluster && !(view.page === "overview" && !view.groupsync)) {
      bootClusters = await get("/api/clusters");
      if (bootClusters.length) {
        view.cluster = bootClusters[0].id;
        // The ONLY position mutation outside navigate(), and it has to be: the default is not known
        // until the cluster list arrives, which is after boot stamped the entry. So the entry is
        // amended in place rather than a new one pushed — otherwise the first entry has no cluster
        // and Back from the reader's first switch restores a drill-down against the wrong one.
        // `applyPosition` is a no-op here (nothing changes), and `replace` preserves `from`.
        navigate({}, { replace: true });
      }
    }
    // EVERYTHING THIS VIEW NEEDS, DISPATCHED TOGETHER. These were awaited one at a time,
    // which billed the reader one full round trip per endpoint before anything could paint:
    // re-measured 2026-08-10 (benchmark doc §7), the four always-fetched endpoints cost
    // 220 ms serial vs 105 ms parallel with 40 ms of per-request latency — the proxy path —
    // and the tab-switch pause the user reported is exactly that serial sum. On loopback
    // parallel is a wash (67 ms vs 59 ms serial), which is why the earlier loopback-only
    // measurement rejected this; loopback does not generalise to the route.
    //
    // An object of promises drained by ONE Promise.all: creating a promise is dispatching
    // it, so they run concurrently, and the single await means one rejection cannot leave
    // a sibling unhandled. Per-promise handling stays exactly what each endpoint needs —
    // whoami degrades to null, usage absorbs its designed 403, guard403 keeps refusals.
    const want = {
      // Refetched every cycle, unlike /api/version: the tier can change under a running
      // tab (a grant made or revoked), and the pill must follow the wire rather than the
      // page's memory of it. Cheap — no store read behind it.
      whoami: get("/api/whoami").catch(() => null),
      clusters: bootClusters ? Promise.resolve(bootClusters) : get("/api/clusters"),
      // The alerts endpoint is an object now — the rows plus the `scope`/`viewer` the API
      // decided, so the page can say a narrowed feed is narrowed instead of guessing.
      alerts: get("/api/alerts"),
    };
    if (view.cluster) {
      const base = `/api/clusters/${encodeURIComponent(view.cluster)}`;
      // #172: on the Overview's scoped view a 404 for the CLUSTER is the removed-cluster case the
      // page phrases itself ("No cluster by that id is configured … a detour, not a dead end");
      // left to the catch below it became the generic error card — with no tab bar, since render()
      // never ran (measured, OB1 review). Only there, and only the cluster-level payloads: a CR
      // detail's 404 stays the "may have been deleted" card.
      const clusterGone = (p) => (view.page === "overview" && !view.groupsync)
        ? p.catch((e) => { if (e.status === 404) return null; throw e; }) : p;
      want.groupsyncs = clusterGone(get(`${base}/groupsyncs`));
      // guard403 on the administrator-tier payloads: a narrowed reader's 403 is the
      // DESIGNED answer. Unguarded it fell to the catch below and replaced the whole tab
      // with "Dashboard API error: 403 Forbidden" — the defect the Usage tab first fixed.
      // Access granted at the narrowed tier is the reader's OWN path (myAccess), not the
      // cluster's findings — which would only come back as the designed 403 and count as a
      // refusal on /metrics once a minute for as long as they sit on the tab. RBAC policy has
      // no narrowed form and keeps its refusal.
      if (view.page === "policy" || (view.page === "bindings" && !narrowedReader())) {
        want.findings = guard403(get(`${base}/bindings/findings?limit=${FINDINGS_PAGE}`));
      }
      if (view.page === "bindings" && narrowedReader() && data.whoami && data.whoami.user) {
        want.myAccess = myAccessFetch(get, base, data.whoami.user, { allowStaleViewer: true });
      }
      // Which state the groups rows are fetched under, kept beside them (groupsMeta.state): the tab
      // handler paints from `data` before it fetches, and the lookup's whole list painted under the
      // Groups tab's `empty` select for the length of a fetch (review of #174, OB1 — measured: 4 rows
      // under "empty", then 2).
      // Home (#158): one payload, the reader's own — refused (403) when the proxy passed no
      // identity, which the page says in its own words rather than as an API error.
      if (view.page === "home") {
        want.home = guard403(get(`${base}/home`));
      }
      if (view.page === "lookup") {
        groupsState = "all";
        want.groups = get(`${base}/groups?state=all`);
        want.users = guard403(get(`${base}/users?limit=${USERS_FETCH}`));
        want.namespaces = guard403(get(`${base}/namespaces`));
      }
      if (view.page === "groups" || view.page === "users") {
        // The SAME order render() dispatches in, so what is fetched is what is painted. A pasted
        // hash can carry page=users AND a group name — no tab produces that pair, but
        // positionFromHash accepts it — and with the group tested first the Users tab fetched a
        // group it never paints and stayed on "Loading…" for good (Cursor review finding).
        if (view.user) {
          want.user = guard403(get(`${base}/users/${encodeURIComponent(view.user)}`));
        } else if (view.page === "users") {
          // Fetched only on its own tab, like logins, so the other pages do not pay for it.
          want.users = guard403(get(`${base}/users?limit=${USERS_FETCH}`));
        } else if (view.group) {
          want.group = guard403(get(`${base}/groups/${encodeURIComponent(view.group)}`));
        } else {
          groupsState = view.groupFilter;
          want.groups = get(`${base}/groups?state=${view.groupFilter}`);
        }
      }
      if (view.groupsync) {
        want.events = get(`${base}/groupsyncs/${encodeURIComponent(view.groupsync)}/events`);
      }
      // Cluster-scoped, unlike Usage: these are logins to the CLUSTER, read from its own
      // oauth-server. Fetched only on its own tab so the other pages do not pay for it.
      if (view.page === "logins") {
        const q = new URLSearchParams({ limit: String(LOGIN_PAGE) });
        if (view.loginOutcome !== "all") q.set("outcome", view.loginOutcome);
        want.logins = get(`${base}/logins?${q}`);
        // A SECOND endpoint on the same tab, deliberately not folded into the first: it answers a
        // different question from different data — synced group membership, no logs involved — so it
        // renders even when capture is off, and a failure of one must not blank the other.
        want.access = get(`${base}/cluster-access`);
      }
      // The policy operator's health belongs on the landing page: these CRs template the
      // RoleBindings that give every synced group its access, and a failing one is exactly
      // the silent stoppage this dashboard exists to surface. configHealth() renders ""
      // for a payload with no `present`, so a refused one simply omits the panel and the
      // refusal card above carries the explanation.
      if ((view.page === "overview" && !view.groupsync) || view.page === "policy") {
        want.operatorConfigs = clusterGone(guard403(get(`${base}/operator-configs`)));
      }
      // The Kyverno page (#170): the module's one payload for the selected cluster, with the page's two
      // filters on the wire (the controlled-kind switch, one policy) — the server does the narrowing.
      if (view.page === "kyverno" && !narrowedReader()) {
        const q = new URLSearchParams({ controlled: view.kyvernoControlled ? "true" : "false" });
        if (view.kyvernoPolicy) { q.set("policy", view.kyvernoPolicy); if (view.kyvernoKind) q.set("kind", view.kyvernoKind); }
        want.kyverno = clusterGone(guard403(get(`${base}/kyverno?${q}`)));
      }
      if (view.page === "nsaudit") {
        // The namespace filter is applied SERVER-side, not by filtering a full response in
        // the browser: the point is to stop shipping thousands of rows, and a client-side
        // filter still pays for every one of them over the wire and in memory.
        const q = new URLSearchParams({ limit: String(NS_GRANT_PAGE) });
        if (view.nsNamespace !== "all") q.set("namespace", view.nsNamespace);
        want.userBindings = guard403(get(`${base}/user-bindings?${q}`));
        // #167: every namespace the poller sees, and the one being read.
        // The list for the card, the detail for the page — never both: the page does not render the
        // card, and fetching the list there was one request a minute for nothing (OB1, review of #167).
        if (view.ns) want.ns = guard403(get(`${base}/namespaces/${encodeURIComponent(view.ns)}`));
        else want.namespaces = guard403(get(`${base}/namespaces`));
      }
    }
    // Not cluster-scoped: this is who used the DASHBOARD, which has no cluster dimension.
    // Fetched only on its own tab, so the other pages do not pay for it.
    // The KPI page (#157): one payload, the KPI module's (#156) — every number on the page comes
    // from it. Administrator tier: a narrowed reader gets the designed 403, rendered as the refusal
    // card, so the fetch is skipped for a reader already known to be narrowed.
    if (view.page === "kpi" && !narrowedOnHost()) {
      want.kpi = guard403(get("/api/kpi"));
    }
    // The Cluster Configurations page (#230 S2): one payload, and only for a reader the
    // `clusterconfig:view` level admits — a reader without it makes NO request, so the surface
    // leaves no trace for them at all (#230; the tab is absent for them too).
    // NOT gated on the wide tier (narrowedOnHost) any more: this surface has a tier OF ITS OWN
    // (#230), and the route asks `clusterconfig:view` alone. A site may grant `get secrets` to
    // someone the wide tier narrows; deferring to it here would have shown them an empty page the
    // API would have answered.
    if (view.page === "clusters" && ccMayView()) {
      want.clusterconfigs = guard403(get("/api/clusterconfigs"));
    }
    if (view.page === "reports" && reportingEnabled() && !narrowedOnHost()) {
      // Through the proxy to the REPORT SERVICE, with the ticket the dashboard minted. A 403 here
      // is the same designed refusal as everywhere else and renders as the same card.
      want.reportCatalog = guard403(reportGet("/api/reports"));
      // limit=1: the catalogue shows the count (`total`) only; the runs live on the status page (#149 R5)
      want.reportRuns = guard403(reportGet("/api/runs?limit=1"));
    }
    if (view.page === "reporting" && reportingEnabled() && !narrowedOnHost()) {
      // #149 R5/R6: the status page — the service's own account of itself, and the history page the
      // reader is on, filtered server-side (every filter runs across the whole history).
      want.reportStatus = guard403(reportGet("/api/status"));
      want.reportHistory = (async (asked) => { const r = await guard403(reportGet(asked)); return r && !r.forbidden ? { ...r, asked } : r; })(historyQuery());
    }
    if (view.page === "library" && reportingEnabled() && !narrowedOnHost()) {
      // #229: the library is the catalogue crossed with the schedules, over every run the service holds
      // (limit is the API's maximum; a history past it is said on the page, not silently cut)
      want.reportCatalog = guard403(reportGet("/api/reports"));
      want.reportStatus = guard403(reportGet("/api/status"));
      want.library = guard403(reportGet(LIBRARY_RUNS));
      // guarded like the three above: a 403 here (a reader demoted between polls, a ticket the service refuses)
      // otherwise threw past them into the catch below and replaced the page with "Dashboard API error … may have
      // been deleted" — where the listing's own 403 paints the refusal card (review of #233, OB3 — measured)
      want.libraryRun = guard403(libraryPositionRun());
    }
    if (view.page === "usage") {
      // 403 is the DESIGNED answer when the OAuth proxy is off: there is no authenticated
      // identity to scope personnel data to. Letting it fall to the catch below replaced
      // the whole tab with "Dashboard API error: 403 Forbidden" — and the panel written to
      // explain exactly this could never render. Only 403 is absorbed; a 500 is still a
      // fault and must still be shown as one.
      want.usage = get("/api/dashboard/activity").catch((e) => {
        if (e.status !== 403) throw e;
        return { enabled: false, activity: [] };
      });
    }
    const keys = Object.keys(want);
    const values = await Promise.all(Object.values(want));
    // A superseded refresh must not WRITE, not merely not paint. Responses are DISCARDED:
    // the reader has navigated on, render() derives from the CURRENT view, and a stale write
    // would surface on the next render that does not refetch — a sort click, or the poll.
    // One guard now covers every payload, where the serial version could only guard the
    // writes that happened after its own await.
    if (superseded()) return;
    if (idle.state === "expired") return;
    const got = {};
    keys.forEach((k, i) => { got[k] = values[i]; });
    data.whoami = got.whoami;
    data.clusters = got.clusters;
    data.alerts = got.alerts.alerts;
    data.alertsScope = got.alerts.scope;
    if (view.cluster) {
      data.groupsyncs = got.groupsyncs;
      data.events = view.groupsync ? got.events : null;
    }
    if ("findings" in got) data.findings = got.findings;
    if ("kpi" in got) data.kpi = got.kpi;
    if ("clusterconfigs" in got) data.clusterconfigs = got.clusterconfigs;
    if (view.page === "clusters" && got.whoami) {   // decided again from the whoami that just arrived — the KPI rule below
      // From THIS surface's own tier, not the wide one (#230): the whoami that just landed carries
      // the levels, and a reader without `view` is refused here whatever the wide tier says.
      if (!ccMayView()) {
        data.clusterconfigs = { forbidden: true };
      } else if (got.whoami.authenticated && !("clusterconfigs" in got)) {
        const body = await guard403(get("/api/clusterconfigs"));
        if (superseded()) return;
        data.clusterconfigs = body;
      }
    }
    // The KPI page decides again from the whoami that just arrived, as Reports does: the fetch was
    // chosen from the previous cycle's identity, so a reader promoted mid-session would otherwise
    // sit on "Loading…" for a poll interval, and a demoted one would keep the payload in memory.
    if (view.page === "kpi" && got.whoami) {
      if (narrowedOnHost()) {
        data.kpi = null;
      } else if (got.whoami.authenticated && !("kpi" in got)) {
        const body = await guard403(get("/api/kpi"));
        if (superseded()) return;
        data.kpi = body;
      }
    }
    if ("myAccess" in got) data.myAccess = got.myAccess;
    // THE ACCESS GRANTED TAB DECIDES AGAIN FROM THE WHOAMI THAT JUST ARRIVED. The requests
    // above were chosen from the previous cycle's identity — unknown on the first cycle, and
    // stale for one cycle whenever a reader's tier changes mid-session (an admin grant made or
    // revoked while the tab is open). Painting the old tier's payload under the new identity
    // is exactly wrong in both directions, so: if the reader is narrowed now and their own path
    // is missing, fetch it; if they are wide now and the findings are missing, fetch those. One
    // guarded follow-up, then paint. (Codex review of #48 found the first-cycle-only form of
    // this and the two transition races it missed.)
    if (view.page === "bindings" && view.cluster) {
      const base = `/api/clusters/${encodeURIComponent(view.cluster)}`;
      const w = got.whoami;
      if (narrowedFor(w)) {
        // Whatever is held must be THIS reader's: the speculative call above was made for the
        // previous cycle's viewer, so after a session change it holds the old viewer's path (or
        // the null its 403 resolved to). Fetch the reader's own path whenever the held one is
        // missing or names somebody else (C1 review, Codex; routed to SPEC_D2).
        if (w.user && (!data.myAccess || data.myAccess.viewer !== w.user)) {
          const own = await myAccessFetch(get, base, w.user);
          if (superseded()) return;
          data.myAccess = own;
        }
        data.findings = null;   // the wide payload, if any, is not this reader's to paint
      } else if (w && w.authenticated) {
        if (!("findings" in got)) {
          const wide = await guard403(get(`${base}/bindings/findings?limit=${FINDINGS_PAGE}`));
          if (superseded()) return;
          data.findings = wide;
        }
        data.myAccess = null;
      }
    }
    if ("user" in got) data.user = got.user;
    if ("users" in got) data.users = got.users;
    if ("group" in got) data.group = got.group;
    if ("groups" in got) {
      // Rows and their declared scope travel together; the banner renders from
      // `groupsMeta` and never from a client-side guess.
      data.groups = got.groups.groups;
      data.groupsMeta = { scope: got.groups.scope, viewer: got.groups.viewer, state: groupsState };
    }
    if ("logins" in got) { data.logins = got.logins; data.access = got.access; }
    if ("usage" in got) data.usage = got.usage;
    if ("reportCatalog" in got) data.reportCatalog = got.reportCatalog;
    if ("reportRuns" in got) data.reportRuns = got.reportRuns;
    if ("reportStatus" in got) data.reportStatus = got.reportStatus;
    if ("reportHistory" in got && got.reportHistory && historyQuery() === (got.reportHistory.asked || historyQuery())) data.reportHistory = got.reportHistory;
    if ("library" in got) data.library = got.library;
    if ("libraryRun" in got) data.libraryRun = got.libraryRun;
    // The report requests above were chosen on the PREVIOUS cycle's host tier, before this
    // cycle's whoami arrived — the same race the Access granted tab reconciles below. A reader
    // promoted mid-session otherwise saw "Loading…" for a whole cycle; a demoted one must not
    // keep the catalogue, nor lend a ticket minted under the old identity (review of D2, second
    // pass, Codex; measured: zero report calls on the promoting refresh).
    if (view.page === "reporting" && reportingEnabled() && got.whoami) {
      if (narrowedOnHost()) {
        data.reportStatus = null; data.reportHistory = null; data.reportTicket = null;
      } else if (got.whoami.authenticated && !("reportStatus" in got)) {
        // The same catch-up as the Reports page below: the requests above were chosen on the previous
        // cycle's tier, so a reader promoted mid-session saw "Loading…" for a whole cycle (review of
        // #221, OB3 — measured: zero status calls on the promoting refresh).
        data.reportTicket = null;
        const [status, history] = await Promise.all([guard403(reportGet("/api/status")), guard403(reportGet(historyQuery()))]);
        if (superseded()) return;
        data.reportStatus = status; data.reportHistory = history;
      }
    }
    if (view.page === "library" && reportingEnabled() && got.whoami) {
      // #229: the same catch-up as the two pages above — the requests were chosen on the previous cycle's tier
      if (narrowedOnHost()) {
        data.reportCatalog = null; data.reportStatus = null; data.library = null; data.reportTicket = null;
      } else if (got.whoami.authenticated && !("library" in got)) {
        data.reportTicket = null;
        const [catalog, status, library] = await Promise.all([
          guard403(reportGet("/api/reports")), guard403(reportGet("/api/status")), guard403(reportGet(LIBRARY_RUNS)),
        ]);
        if (superseded()) return;
        data.reportCatalog = catalog; data.reportStatus = status; data.library = library;
      }
    }
    if (view.page === "reports" && reportingEnabled() && got.whoami) {
      if (narrowedOnHost()) {
        data.reportCatalog = null; data.reportRuns = null; data.reportTicket = null;
      } else if (got.whoami.authenticated && !("reportCatalog" in got)) {
        data.reportTicket = null;
        const [catalog, runs] = await Promise.all([
          guard403(reportGet("/api/reports")), guard403(reportGet("/api/runs?limit=1")),
        ]);
        if (superseded()) return;
        data.reportCatalog = catalog; data.reportRuns = runs;
      }
    }
    if ("operatorConfigs" in got) data.operatorConfigs = got.operatorConfigs;
    if ("kyverno" in got) data.kyverno = got.kyverno;
    if (view.page === "kyverno" && narrowedFor(got.whoami)) data.kyverno = { forbidden: true };   // the designed refusal, decided from the whoami that just arrived
    // #172: the fleet view's GroupSync and policy tables are the per-cluster payloads, fetched in
    // parallel AFTER the cluster list is known — one extra stage, and only up to the medium tier
    // (eight clusters): forty clusters must not cost eighty requests a minute for two tables that
    // the tiles already summarise and the scoped view carries in full.
    if (view.page === "overview" && !view.cluster && !view.groupsync) {
      const served = data.clusters || [];
      // Not for a narrowed reader: render() paints them the refusal card, so two payloads per
      // cluster would be N designed 403s a minute on /metrics for nothing shown (the Access
      // granted rule above). Per cluster, the policy payload is asked for only where whoami
      // says this reader is wide THERE — a host administrator narrowed on a remote gets that
      // cluster's designed 403 otherwise, every poll.
      const w = got.whoami;
      if (served.length <= FLEET_TABLES_MAX && !narrowedFor(w)) {
        const wideOn = (id) => !w || !w.authenticated || scopeFor(w, id) === "all";
        const fleet = await Promise.all(served.map(async (c) => {
          const base = `/api/clusters/${encodeURIComponent(c.id)}`;
          const [groupsyncs, operatorConfigs] = await Promise.all([
            get(`${base}/groupsyncs`).catch(() => null),
            wideOn(c.id) ? guard403(get(`${base}/operator-configs`)).catch(() => null) : Promise.resolve(null),
          ]);
          return { id: c.id, groupsyncs, operatorConfigs };
        }));
        if (superseded()) return;   // a superseded refresh must not WRITE — the rule above, kept here
        data.fleet = fleet;
      } else {
        data.fleet = null;
      }
    }
    if ("userBindings" in got) data.userBindings = got.userBindings;
    if ("namespaces" in got) data.namespaces = got.namespaces;
    if ("home" in got) data.home = got.home;   // #158
    if ("ns" in got) data.ns = got.ns;
    // An AUTOMATIC refresh that changed nothing must not touch the DOM. render() replaces #main
    // wholesale, so an unconditional repaint every interval throws away the reader's scroll
    // position, any open tooltip, and their text selection — on a cluster that is idle, which is
    // most of the time. A user-initiated refresh always paints: they asked, so they get feedback
    // even when the answer is identical.
    //
    // The fingerprint is over the fetched payloads only, never over `view`: a repaint the reader
    // caused by navigating is not an "unchanged" case, and mixing the two here would suppress it.
    // alertsScope rides along even though nothing renders it yet: it arrives on the same
    // wire as fields that DO, and a fingerprint that omits a payload field is a repaint
    // silently suppressed the day someone renders it.
    const fingerprint = JSON.stringify([
      data.clusters, data.alerts, data.alertsScope, data.groupsyncs, data.groups,
      data.groupsMeta, data.group, data.user, data.users, data.events, data.logins, data.access,
      data.usage, data.findings, data.operatorConfigs, data.userBindings, data.whoami, data.myAccess, data.home,
      data.reportCatalog, data.reportRuns, data.fleet,   // #172: the fleet tables render from it
      // #149 R5: the status page's two payloads — a finished run must repaint it. Without `as_of`, the
      // service's clock stamp that nothing renders: with it, no two polls ever matched and the page
      // repainted every minute, dropping the reader's selection (review of #221, OB3 — measured).
      data.reportStatus && { ...data.reportStatus, as_of: null }, data.reportHistory,
      data.library,   // #229: a run that finished, or aged out, must repaint the library (the #157/#167/#228 omission)
      data.libraryRun,
      data.kpi,   // #157 (review, Codex): left out, a poll whose only change was a KPI never repainted the page
      data.kyverno,   // #170 (review, Codex): the same omission would have left a Kyverno-only change unpainted
      data.clusterconfigs,   // #230 S2: a discovery that lands a new cluster must repaint the tab
      // #167: the namespace list and page ride the same wire (review, Codex — left out, a poll whose
      // only change was a label or a grant skipped the repaint the comment above forbids skipping).
      data.namespaces, data.ns,
    ]);
    if (opts.auto && fingerprint === lastFingerprint) {
      // Still say so. Leaving the clock frozen would read as "the dashboard has stopped",
      // which is the opposite of the truth and the exact confusion `sync_stopped` exists for.
      $("main").classList.remove("stale");
      $("last-refresh").textContent =
        "updated " + fmtTime(new Date().toISOString()).slice(11);
      return;
    }
    lastFingerprint = fingerprint;
    render();
  } catch (err) {
    // A dead session is not a fault to report as one — it gets its own honest panel.
    // A superseded or post-expiry refresh reports nothing: a late auth redirect must not replace
    // the inactivity card with the cap's "session has ended" panel (review of C4).
    if (superseded() || idle.state === "expired") return;
    if (err && err.sessionEnded) { showSessionEnded(); return; }
    // An error must never strand the reader: keep a working Back so a dead link is a
    // detour, not a dead end. This was reported from the field — a 404 on a deleted group
    // replaced the whole page, back button included.
    $("main").classList.remove("stale");
    $("main").innerHTML = `<section class="card">
      <button class="back" id="back-groups">${backLabel()}</button>
      <div class="err mt-5">Dashboard API error: ${esc(err.message)}</div>
      <div class="filterbar-note mt-3">
        The object may have been deleted since this page was rendered.</div>
    </section>`;
    const eb = $("back-groups");
    if (eb) eb.onclick = () => { goBack(); };
  }
}

$("refresh").onclick = refresh;

/* Boot from the URL, so a pasted or bookmarked link opens where it points instead of always at
   Overview. replaceState rather than push: the reader has not navigated yet, and pushing here
   would leave a spare entry that swallows their first Back press.
   Unconditional, even with no hash — it stamps state on the entry the browser created for the
   bare page load, so `history.state` is never null and the popstate handler has a position to
   restore when Back returns to the start. `cluster` is left alone when the hash omits it:
   refresh() picks the first cluster, and forcing null here would fight that. */
applyPosition(positionFromHash());
// `from` is CARRIED, not reset. Chromium preserves history.state across a reload, and clobbering
// it here destroyed the back target of the entry the reader was on — after which the in-page
// button rose to the parent while the browser's Back went one entry further, the two disagreeing
// in exactly the way one shared stack is supposed to prevent. F5 is what a reader presses when a
// page looks stale, so this is an ordinary path, not an exotic one.
history.replaceState(
  { pos: currentPosition(), from: (history.state && history.state.from) || null },
  // The query rides along on a hashless link: `location.pathname` alone dropped ?mode/?theme from
  // /?mode=dark, and every entry pushed from there inherited the loss (Grok, review 2 of #179).
  "", location.hash || (location.pathname + location.search));

/* The session cap this page quotes when it ends. From /api/whoami rather than hardcoded, so
   it cannot contradict the proxy's own -cookie-expire. */
/* ── Idle timeout: a MODEL the page runs, enforced by the proxy ────────────────────────────
   docs/DESIGN_session_and_signout.md, "Idle timeout". The page cannot observe its session, so
   this counts ACTIVITY — pointer, keyboard, the tab becoming visible — from configured inputs
   that /api/whoami restates. At zero it removes the data from the screen and sends the browser
   to the proxy's sign_out; the PROXY ends the session by clearing its cookie. Nothing here is
   persisted: localStorage outlives a session, so an origin recorded there is routinely older
   than the login it would be counting from (the trap the design records). Tabs of one browser
   share activity over a BroadcastChannel, which is ephemeral, so an idle tab cannot sign out a
   colleague working in another. */
const idle = {
  enabled: false, seconds: 0, warningSeconds: 0, logoutUrl: null,
  lastActivityAt: Date.now(), state: "active", tick: null, channel: null,
  lastBroadcastAt: 0, restoreFocus: null, announced: null,
};
const IDLE_TICK_MS = 1000;
const IDLE_BROADCAST_MIN_MS = 5000;

function idleSuspended() {
  return idle.enabled && idle.state !== "active";
}

/* Activity from THIS tab's listeners or from another tab. While the warning is on screen, local
   activity outside the dialog is ignored — #wrap is inert, so it cannot reach anything anyway, and
   a mouse nudge must not dismiss a dialog the reader has not read. Another tab's activity does
   dismiss it: the person is demonstrably present. */
function idleNoteActivity(fromOtherTab) {
  if (!idle.enabled || idle.state === "expired") return;
  if (idle.state === "warning") {
    if (fromOtherTab) idleStay(false);
    return;
  }
  idle.lastActivityAt = Date.now();
  if (!fromOtherTab) idleBroadcast();
}

function idleBroadcast() {
  if (!idle.channel || Date.now() - idle.lastBroadcastAt < IDLE_BROADCAST_MIN_MS) return;
  idle.lastBroadcastAt = Date.now();
  try { idle.channel.postMessage({ activity: true }); } catch (e) { /* channel closed */ }
}

function startIdleWatch(config, logoutUrl) {
  idle.enabled = true;
  idle.seconds = config.seconds;
  idle.warningSeconds = config.warning_seconds;
  idle.logoutUrl = logoutUrl;
  idle.lastActivityAt = Date.now();
  $("idle-signout").href = logoutUrl;
  const onActivity = () => idleNoteActivity(false);
  for (const ev of ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"]) {
    document.addEventListener(ev, onActivity, { passive: true });
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) idleNoteActivity(false); });
  if (typeof BroadcastChannel === "function") {
    idle.channel = new BroadcastChannel("gsd-idle-activity");
    // The receiver stamps its OWN clock: a sender's timestamp is another tab's clock, and the
    // fact that matters is "someone was active just now", not when they say it was.
    idle.channel.onmessage = () => idleNoteActivity(true);
  }
  wireIdleDialog();
  idle.tick = setInterval(idleTick, IDLE_TICK_MS);
}

function idleTick() {
  if (idle.state === "expired") return;
  const idleFor = (Date.now() - idle.lastActivityAt) / 1000;
  if (idleFor >= idle.seconds) { idleExpire(); return; }
  if (idleFor < idle.seconds - idle.warningSeconds) return;
  if (idle.state !== "warning") idleWarn();
  const left = Math.max(0, Math.ceil(idle.seconds - idleFor));
  $("idle-countdown").textContent = String(left);
  // Announce twice, not every second: a live region that ticks is unusable with a screen reader.
  if ((left === 30 || left === 10) && idle.announced !== left) {
    idle.announced = left;
    $("idle-live").textContent = `${left} seconds until sign-out. Press Escape or Enter to stay signed in.`;
  }
}

/* Everything that is not the dialog: #wrap AND the skip link, which sits outside #wrap. APG modal
   dialogs want the ENTIRE background inert, and a virtual cursor could otherwise leave the dialog
   through the skip link (review of C4). */
function setIdleChrome(open) {
  $("wrap").inert = open;
  const skip = document.querySelector("a.skip");
  if (skip) skip.inert = open;
}

function idleWarn() {
  idle.state = "warning";
  idle.announced = null;
  idle.restoreFocus = document.activeElement;
  $("idle-modal").hidden = false;
  // inert: the background is neither focusable nor read by assistive technology while the
  // dialog is up — the focus trap, done by the platform rather than by a keydown shim.
  setIdleChrome(true);
  $("idle-stay").focus();
}

/* "Stay signed in": the countdown ends, the clock restarts, and — when the reader chose it — one
   interaction-marked refresh re-proves the session the way whoami's docstring prescribes, instead
   of polling whoami. Another tab's activity resets the clock without the extra request. */
function idleStay(reproveSession) {
  // Expired is final: "Sign out now" or the timer has already blanked the page, and Escape
  // arriving a moment later must not revive a session the reader chose to end (review of C4).
  if (!idle.enabled || idle.state === "expired") return;
  idle.state = "active";
  idle.lastActivityAt = Date.now();
  $("idle-modal").hidden = true;
  setIdleChrome(false);
  $("idle-live").textContent = "";
  const back = idle.restoreFocus;
  idle.restoreFocus = null;
  if (back && typeof back.focus === "function" && document.contains(back)) {
    try { back.focus({ preventScroll: true }); } catch (e) { /* not focusable any more */ }
  }
  if (reproveSession) { idleBroadcast(); refresh(); }
}

/* Zero. The page removes what is on screen FIRST, so a slow or blocked navigation leaves no
   access data behind, then leaves for the proxy's sign_out. It never calls showSessionEnded():
   that panel is reserved for a request that PROVED the session gone. */
function idleExpire() {
  idle.state = "expired";
  clearInterval(idle.tick);
  // Supersede any refresh() still in flight: it must not paint rows — or the cap's "session has
  // ended" panel — over the card below (review of C4). refresh() also checks the state itself.
  navSeq++;
  $("idle-modal").hidden = true;
  setIdleChrome(false);
  $("logout").hidden = true;
  $("filters").innerHTML = "";
  $("main").innerHTML = `<section class="card">
    <h2>Signed out after inactivity</h2>
    <div class="empty-note">Nothing was touched for ${Math.round(idle.seconds / 60)} minutes, so this
      dashboard is signing you out. Nothing you read before this point was affected.</div>
    <p><a class="btn" href="/">Sign in again</a></p>
  </section>`;
  if (idle.logoutUrl) location.assign(idle.logoutUrl);
}

/* Escape stays (a dialog's Escape closes it); Enter activates the focused control, which is
   "Stay signed in" on open; Tab cycles between the two controls as a backstop to inert. */
function wireIdleDialog() {
  $("idle-stay").onclick = () => idleStay(true);
  // "Sign out now" is the timer's zero, chosen early: the same blanking, then the navigation
  // idleExpire performs (preventDefault so the anchor's href does not race location.assign).
  $("idle-signout").onclick = (e) => { e.preventDefault(); idleExpire(); };
  $("idle-modal").onkeydown = (e) => {
    if (e.key === "Escape") { e.preventDefault(); idleStay(true); return; }
    if (e.key !== "Tab") return;
    const items = [$("idle-stay"), $("idle-signout")];
    const i = items.indexOf(document.activeElement);
    e.preventDefault();
    items[(i + (e.shiftKey ? -1 : 1) + items.length) % items.length].focus();
  };
}

let sessionCapNote = "";

/* ── The session's controls, bootstrapped once ───────────────────────────────────────────
   whoami is read here at load to set up the sign-out link, the cap note and the idle model. It is
   also fetched by every ordinary data refresh — the viewer's tier (`visibility`) can change while
   the page is open — but never on a session-only timer, and the automatic refresh is suspended
   while the idle model is warning or expired, so an unattended tab does not re-stamp its own
   cookie (review of C4 corrected the older "never polled" wording here and in the design).

   `logout_url` is the proxy's own sign_out under its configured prefix. The proxy clears its
   session cookie there; the application does not revoke the OpenShift access token (measured in
   docs/DESIGN_session_and_signout.md — revocation is deliberately not implemented). */
async function initSession() {
  try {
    const who = await api("/api/whoami");
    if (who && who.session && who.session.cookie_expire_seconds) {
      const hours = who.session.cookie_expire_seconds / 3600;
      sessionCapNote = hours >= 1
        ? `${+hours.toFixed(1)}-hour`
        : `${Math.round(hours * 60)}-minute`;
    }
    if (who && who.logout_url) {
      const link = $("logout");
      link.href = who.logout_url;
      link.hidden = false;
      link.title = who.user ? `Sign out ${who.user}` : "Sign out";
      // The idle model starts only with a session to end AND the module on, from this bootstrap
      // response: its inputs are deployment configuration, and a later refresh's whoami must not
      // restart a model that is already counting.
      const it = who.session && who.session.idle_timeout;
      if (it && it.enabled === true) startIdleWatch(it, who.logout_url);
    }
  } catch (e) {
    // No session control is a strictly better failure than a broken one, and with the proxy
    // disabled this is the expected answer rather than a fault.
  }
}

/* Shown when a request proves the session is gone. It says what ended AND what did not,
   because the reader may be mid-audit: a bare "error" invites them to distrust the data they
   were just reading rather than the session that expired underneath it. */
function showSessionEnded() {
  $("logout").hidden = true;
  $("filters").innerHTML = "";
  $("main").classList.remove("stale");
  $("main").innerHTML = `<section class="card">
    <h2>Your session has ended</h2>
    <div class="empty-note">${sessionCapNote
      ? `The dashboard session reached its ${sessionCapNote} limit, or it`
      : "The dashboard session expired, or it"} was signed out in another tab. Nothing you read
      before this point was affected — it was accurate when it loaded.</div>
    <p><a class="btn" href="/">Sign in again</a></p>
  </section>`;
}

initSession();
refresh();
// {auto: true}: background polling must not register as somebody using the page.
// The automatic refresh. Two guards and a slower clock, all for the same reason: the browser
// was asking more often than the answer can change, and repainting regardless.
//
// 60s, not 30s — config.pollIntervalSeconds is 60, bindingIntervalSeconds is 300, and the login
// capture flushes every 60s. At 30s every other poll provably could not have new data, and each
// one still replaced #main. Matching the fastest backend cadence is the most this can usefully be.
//
// document.hidden: a background tab has no reader to inform, so the work is pure waste — a full
// fetch of four to six endpoints plus a DOM replacement, forever, per open tab. Chrome throttles
// background timers but does not stop them.
//
// The unchanged-payload check in refresh() handles the rest: an idle cluster now costs the
// requests but never the repaint.
const POLL_INTERVAL_MS = 60000;
/* The one gate every automatic refresh passes: a hidden tab has no reader, and a tab whose idle
   countdown is on screen (or has expired) must not keep a session alive with its own requests —
   lesson 3 of docs/DESIGN_session_and_signout.md. Resumes with "Stay signed in". */
function autoRefresh() {
  if (document.hidden) return;
  if (idleSuspended()) return;
  refresh({ auto: true });
}
setInterval(autoRefresh, POLL_INTERVAL_MS);
// Catch up on becoming visible again, so a tab left in the background is not stale on return —
// which is the failure mode the hidden-tab guard would otherwise introduce.
//
// Only when a refresh is actually OWED. Readers switch windows constantly, and an
// unconditional catch-up billed a full fetch round for every cmd-tab away-and-back —
// plus a second round moments later whenever the regular tick was already imminent
// (hidden through second 59, visible at 59.5, tick at 60). The interval above keeps
// ticking while hidden and only skips the work, so worst-case staleness on return
// stays under two intervals: either the catch-up fires here, or a tick is due within
// one interval anyway.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (Date.now() - lastRefreshStartedAt < POLL_INTERVAL_MS) return;
  autoRefresh();
});
</script>
</body>
</html>
