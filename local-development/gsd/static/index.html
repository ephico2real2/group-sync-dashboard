      // not leave it below the fold (review of #218, OB3 — measured: the form stayed at 1960 px on a
      // 740 px viewport). Cleared so render()'s arrival rule lands it once more.
      view.reportLanded = null;
      render();                                           // lands the form (the arrival rule in render())
      if (changed && next === "namespace-access") schedulePreview(next);   // recompute a retained selection (V2-F1)
    };
    el.onclick = choose;
    el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(); } };
  });
  document.querySelectorAll("[data-param]").forEach((el) => {
    const spec = view.report || (data.reportCatalog && data.reportCatalog.reports.find((r) => r.enabled) || {}).name;
    el.onchange = () => {
      const f = view.reportForm[spec] || (view.reportForm[spec] = {});
      if (el.dataset.param === "selectors" && el.dataset.selectorLabel) {
        // One multi-select per dimension; assemble the {label: [values]} map. A null-prototype object
        // so a label like `__proto__` becomes an OWN key rather than invoking the legacy setter (C4-B).
        // An emptied dimension is removed (omitted = unconstrained); an empty map drops `selectors`.
        let map = f.selectors;
        if (!map || Object.getPrototypeOf(map) !== null) {
          const safe = Object.create(null);
          for (const [k, v] of Object.entries(map || {})) safe[k] = v;
          map = f.selectors = safe;
        }
        const vals = Array.from(el.selectedOptions).map((o) => o.value);
        if (vals.length) map[el.dataset.selectorLabel] = vals; else delete map[el.dataset.selectorLabel];
        if (!Object.keys(map).length) delete f.selectors;
        schedulePreview(spec);
      } else {
        f[el.dataset.param] = readParamEl(el);
        if (spec === "namespace-access") schedulePreview(spec);   // re-evaluate: an explicit name XORs the count away
      }
      scheduleTotals(spec);
    };
  });
  const link = $("report-status-link");
  if (link) link.onclick = () => { navigate({ page: "reporting" }); render(); refresh(); };
  // #149 R7: the ParamSpec shell's controls. Each writes the form state and repaints; the lookup's
  // typed text lives in view.reportLookupText so the repaint keeps it and the caret returns by id.
  const openSpec = view.report && data.reportCatalog && (data.reportCatalog.reports || []).find((r) => r.name === view.report);
  if (openSpec && $("report-form") && openSpec.params.some((p) => p.source)) ensureDiscovered();   // only a form with a lookup pays for one
  if (openSpec && $("report-form") && _totalsKey !== `${view.cluster}|${openSpec.name}`) scheduleTotals(openSpec.name);   // #143: once per form+cluster as it opens
  const formOf = () => view.reportForm[view.report] || (view.reportForm[view.report] = {});
  const listOf = (name) => { const f = formOf(); const v = f[name]; return Array.isArray(v) ? v : (typeof v === "string" && v ? v.split(",").map((x) => x.trim()).filter(Boolean) : []); };
  const after = (name) => { if (view.report === "namespace-access") schedulePreview(view.report); scheduleTotals(view.report); render(); };
  document.querySelectorAll("[data-switch]").forEach((el) => {
    el.onclick = () => { const f = formOf(); f[el.dataset.switch] = el.getAttribute("aria-checked") !== "true"; after(el.dataset.switch); };
  });
  document.querySelectorAll("[data-seg]").forEach((el) => {
    el.onclick = () => { formOf()[el.dataset.seg] = el.dataset.value; after(el.dataset.seg); };
  });
  document.querySelectorAll("[data-lookup-input]").forEach((el) => {
    const name = el.dataset.lookupInput;
    view.reportLookupText = view.reportLookupText || {};
    el.oninput = () => {
      // narrow the menu in place — no repaint under a typing reader; rebuilt from the discovered set,
      // not from the nodes on screen (review of #222, OB3)
      view.reportLookupText[el.id] = el.value;
      const body = document.querySelector(`#${CSS.escape(el.id)}-menu [data-menu-body]`); if (!body) return;
      const found = data.reportDiscovered && (view.cluster in data.reportDiscovered) && data.reportDiscovered[view.cluster][el.dataset.lookupSource];
      body.innerHTML = lookupMenuBody(name, lookupValues(el.dataset.lookupSource, found), listOf(name), el.value.trim());
      wireLookupOptions(body);
    };
    el.onkeydown = (e) => {
      if (e.key === "Enter") {
        e.preventDefault(); const v = el.value.trim(); if (!v) return;
        const list = listOf(name); if (!list.includes(v)) list.push(v);
        formOf()[name] = list; view.reportLookupText[el.id] = ""; after(name);
      } else if (e.key === "Backspace" && !el.value) {
        const list = listOf(name); if (list.length) { list.pop(); formOf()[name] = list; after(name); }
      }
    };
  });
  // An option, a × and Clear have no id, so render()'s by-id restore would leave a keyboard reader on
  // <body>; each puts focus back on the lookup's input (review of #222, Grok and OB3).
  const refocusLookup = (name) => { const again = document.querySelector(`[data-lookup-input="${CSS.escape(name)}"]`); if (again) again.focus({ preventScroll: true }); };
  const wireLookupOptions = (root) => root.querySelectorAll("[data-lookup-opt]").forEach((el) => {
    const pick = () => {
      const name = el.dataset.lookupOpt, v = el.dataset.value, list = listOf(name);
      formOf()[name] = list.includes(v) ? list.filter((x) => x !== v) : list.concat([v]);
      const input = document.querySelector(`[data-lookup-input="${CSS.escape(name)}"]`); if (input) view.reportLookupText[input.id] = "";
      after(name); refocusLookup(name);
    };
    el.onclick = pick;
    el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
  });
  wireLookupOptions(document);
  document.querySelectorAll("[data-lookup-remove]").forEach((el) => {
    el.onclick = () => { const name = el.dataset.lookupRemove; formOf()[name] = listOf(name).filter((x) => x !== el.dataset.value); after(name); refocusLookup(name); };
  });
  const adv = $("report-advanced");
  if (adv) {
    // Recorded on the summary's click, not only on `toggle`: the toggle event is queued as a task, so a
    // repaint racing it read the old state (review of #222, OB3 — the reader's close was undone).
    const rec = (open) => { view.reportAdvancedOpen = view.reportAdvancedOpen || {}; view.reportAdvancedOpen[view.report] = open; };
    adv.querySelector("summary").onclick = () => rec(!adv.open);
    adv.ontoggle = () => rec(adv.open);
  }
  const clearSubject = $("report-subject-clear");
  if (clearSubject) clearSubject.onclick = () => { const f = formOf(); delete f.users; delete f.groups; scheduleTotals(view.report); render(); refocusLookup("users"); };
  // #267: the cluster chips (ids, so render()'s by-id restore keeps a keyboard reader on the one they pressed)
  document.querySelectorAll("[data-cluster-pick]").forEach((el) => {
    el.onclick = () => { if (el.getAttribute("aria-disabled") === "true") return; toggleReportCluster(el.dataset.clusterPick); };
  });
  const allClusters = $("report-clusters-all");
  if (allClusters) allClusters.onclick = () => { view.reportClusters = (data.clusters || []).map((c) => c.id); render(); };
  const oneCluster = $("report-clusters-one");
  if (oneCluster) oneCluster.onclick = () => { view.reportClusters = null; render(); };
  const noteX = $("report-cluster-note-x");
  // Dismissed for THIS form only: the note renders per form (`cleared[spec.name]`), so another form's cleared
  // lookup is still owed to its reader when they open it. The form card only renders for `view.report`.
  if (noteX) noteX.onclick = () => {
    const note = view.reportClusterNote;
    if (note) { delete note.cleared[view.report]; if (!Object.keys(note.cleared).length) view.reportClusterNote = null; }
    render();
  };
  const back = $("report-back");
  // The catalogue that Back repaints has no #report-back, so render()'s by-id restore would drop the
  // keyboard reader's focus on <body>; the row this form belongs to is where it goes (review of #173).
  if (back) back.onclick = () => { view.reportFocusRow = view.report; goBack(); };
  const gen = $("report-generate");
  // Whether the click came from the keyboard-focused button matters at the END: the button is
  // disabled while the run is submitted (a disabled element cannot hold focus, so render()'s
  // by-id restore has nothing to restore), and the reader who pressed Enter on it should find
  // focus back on it when it re-enables.
  if (gen) gen.onclick = () => generateReport(document.activeElement === gen);
  // #143: the names popup. The button is re-created by every render, so it is (re)wired here like
  // every other report control. The <dialog> is static (next to #idle-modal) so a repaint never
  // removes it while open; re-assigning its backdrop handler each render is harmless.
  const nsBtn = $("report-preview-view");
  if (nsBtn) nsBtn.onclick = openNsPreview;
  const nsClear = $("report-preview-clear");
  if (nsClear) nsClear.onclick = clearNamespaceAccessSelectors;
  const nsDlg = $("ns-preview");
  if (nsDlg) {
    nsDlg.onclick = (e) => { if (e.target === nsDlg) closeNsPreview(); };   // backdrop click
    // #144 adversarial review C4-A: the platform returns focus to the node that was focused when
    // showModal() ran — but the 60 s poll's render() replaces #main wholesale, so after a long
    // read that node is detached and close() drops focus to <body>. Re-aim by ID at whatever
    // button the CURRENT paint carries — the same by-id rule render() uses for its own restore.
    // When the native restore already worked, this focuses the same node again: harmless.
    nsDlg.onclose = () => {
      const b = $("report-preview-view");
      if (b && !b.hidden) b.focus();
    };
  }
  document.querySelectorAll("[data-artifact]").forEach((el) => {
    el.onclick = () => downloadArtifact(el.dataset.artifact, el.dataset.format);
  });
}

async function generateReport(refocus = false) {
  const cat = data.reportCatalog;
  const spec = cat.reports.find((r) => r.name === view.report) || cat.reports.find((r) => r.enabled);
  const targets = reportTargets();
  if (!spec || !targets.length) return;
  const params = Object.assign({}, view.reportForm[spec.name] || {});
  const formats = [];
  if ($("report-want-html") && $("report-want-html").checked) formats.push("html");
  if ($("report-want-pdf") && $("report-want-pdf").checked) formats.push("pdf");
  view.reportSubmitting = true; view.reportRun = null; view.reportBatch = null; render();
  const pending = (r) => r.status === "queued" || r.status === "running";
  const tick = () => new Promise((r) => setTimeout(r, 1500));
  try {
    if (targets.length === 1) {
      const res = await reportFetch("/api/runs", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ report: spec.name, cluster: targets[0], params, formats }),
      });
      view.reportRun = await res.json();
      render();
      // Poll the run, not the page: a render is seconds, and the 60 s repaint is the wrong clock.
      while (view.reportRun && pending(view.reportRun)) {
        await tick();
        view.reportRun = await reportGet(`/api/runs/${encodeURIComponent(view.reportRun.id)}`);
        render();
      }
    } else {
      // #267: several clusters, one action — the service queues one run per cluster as one slot and answers
      // with all of them; each is polled to its own end, so one cluster's failure leaves the others' documents.
      // The loop holds its own batch and stops when the form no longer shows it (another report opened).
      const batch = { requested: targets, runs: [], error: null };
      view.reportBatch = batch;
      const res = await reportFetch("/api/runs", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ report: spec.name, clusters: targets, params, formats }),
      });
      batch.runs = (await res.json()).runs || [];
      render();
      while (view.reportBatch === batch && batch.runs.some(pending)) {
        await tick();
        for (let i = 0; i < batch.runs.length; i++) {
          if (pending(batch.runs[i])) batch.runs[i] = await reportGet(`/api/runs/${encodeURIComponent(batch.runs[i].id)}`);
        }
        render();
      }
    }
    data.reportRuns = await guard403(reportGet("/api/runs?limit=1"));
  } catch (e) {
    const error = e.status === 422 ? `the parameters were refused: ${e.detail || e.message}` : e.message;
    if (view.reportBatch) view.reportBatch.error = error;
    else view.reportRun = { id: "—", status: "failed", error };
  } finally {
    view.reportSubmitting = false; render();
    if (refocus) { const g = $("report-generate"); if (g) g.focus({ preventScroll: true }); }
  }
}

async function downloadArtifact(runId, format) {
  const res = await reportFetch(`/api/runs/${encodeURIComponent(runId)}/artifact?format=${encodeURIComponent(format)}`);
  const disposition = res.headers.get("Content-Disposition") || "";
  const m = /filename="([^"]+)"/.exec(disposition);
  const blob = await res.blob();
  downloadBlob(blob, m ? m[1] : `report.${format}`, blob.type);
}

function refusalBadge(reason) {
  const r = REFUSAL[reason];
  if (!r) return "";
  return ` <span class="badge ${r.cls}" title="${esc(r.why)}"><span class="glyph" aria-hidden="true"></span>${esc(r.text)}</span>`;
}

function outcomeBadge(outcome) {
  const cls = OUTCOME_BADGE[outcome] || "unknown";
  return `<span class="badge ${cls}"><span class="glyph" aria-hidden="true"></span>${
    esc(OUTCOME_LABEL[outcome] || outcome)}</span>`;
}

/* A username is drillable only when the user page has something to show.
   /api/clusters/{c}/users/{name} 404s for a name with no current groups AND no membership
   history — which is precisely the most interesting row here, an account nobody has ever
   governed. Making every name a link would send the reader from the most valuable finding on
   the page straight into an error card, so the affordance is offered only where it leads
   somewhere. `has_history` is what makes it lead somewhere: the removal is in the timeline. */
function loginUser(row) {
  const name = row.user_name;
  const full = row.full_name ? ` <span class="muted">· ${esc(row.full_name)}</span>` : "";
  if (!row.known_user && !row.has_history) {
    return `<span class="mono">${esc(name)}</span>${full}`;
  }
  return `<button type="button" class="drill mono" data-user="${esc(name)}">${esc(name)}</button>${full}`;
}

/* Login attempts read from the oauth-server's log: who tried, when, and what happened.

   THE WHOLE PAGE IS ABOUT A WINDOW, and both of its edges are on screen at all times. Login
   lines naming a person exist only while the authentication operator is at Debug, and a pod's
   log dies with the pod, so nothing before capture began was ever written down anywhere and no
   amount of asking will produce it. An empty table therefore means NOTHING WAS OBSERVED — it
   is not a statement that nobody signed in, and a page that let it read as one would be worse
   than no page. That is why the window banner is unconditional rather than an empty-state note.

   Accounts in no synced group come FIRST, above the chronology. They are the finding this
   feature exists to produce, and the chronology is where a finding goes to hide: 200 rows
   ordered by time bury the one name that matters among the 199 that are fine. */
function loginsPage() {
  const d = data.logins;
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  // The access panel comes from a DIFFERENT endpoint and needs no logs — it is derived from synced
  // group membership, so it is just as true on a cluster that has never enabled Debug logging. It is
  // therefore rendered in every branch below, including the capture-disabled one.
  return captureSection(d, accessCard(data.access));
}

function captureSection(d, access) {
  // Scope as the RESPONSE declares it. At "self" the record on screen is the viewer's own
  // slice: the whole-record summary and the ungoverned-accounts finding are not in the
  // payload at all, and nothing here may compute a stand-in — "accounts in no synced
  // group: 0" recomputed over one person would be the count-versus-page defect made
  // permanent (requirements Q5).
  const self = d.scope === "self";
  // Off is a DIFFERENT state from on-and-quiet, and conflating them sends the reader hunting
  // for logins that were never going to be recorded. Both halves are named because either one
  // alone records nothing: the module has to be running, and the operand has to be verbose.
  if (!d.enabled) {
    return `<section class="card">
      <h2>Login attempts</h2>
      <div class="empty-note">
        Not being captured. <code>loginCapture.enabled</code> — the module that reads the log —
        is off on this release; the chart default since 0.14.0 is on. Login lines also only exist
        while the authentication <em>operator</em> is at <code>spec.logLevel: Debug</code>, which
        makes the oauth-server write a username at all; the chart leaves that off by default
        because the oauth-server audit log is replacing it as the source. At the default verbosity
        capture runs and finds nothing.
      </div>
      <div class="filterbar-note">Turning capture back on is <code>loginCapture.enabled=true</code>;
        the Debug source is <code>authLogLevel.manage</code> and <code>.enabled</code>, a
        cluster-wide write that rolls the OAuth server. See
        <code>docs/LOGIN_CAPTURE_QUICKCHECK.md</code> for the five commands that prove the path
        end to end.</div>
    </section>` + access;
  }

  const s = d.summary || {};
  const rows = d.attempts || [];
  const ungoverned = d.ungoverned || [];

  // Overdue is measured against the cadence the SERVER reports, not a number invented here:
  // capture rides the poll thread, so `last_read_at` should advance every poll interval. Five
  // intervals is late beyond argument, with a 5-minute floor so a fast poll does not raise this
  // on one slow cycle. The threshold is stated on screen rather than implied by a red badge.
  const interval = d.read_interval_seconds || 60;
  const staleAfter = Math.max(300, interval * 5);
  const readAge = d.last_read_at
    ? Math.floor((Date.now() - new Date(d.last_read_at).getTime()) / 1000) : null;
  const stalled = readAge !== null && readAge > staleAfter;

  // Compared as INSTANTS, not as strings, and with a second of tolerance. The two fields do not
  // share a format: `capture_started_at` is stamped by now_iso() to whole seconds, while
  // `retained_since` is an attempt's `at` and carries microseconds. Lexicographically "…:00.5Z"
  // sorts BEFORE "…:00Z" ('.' < 'Z'), so a string compare would announce that the record
  // predates capture whenever the first attempt landed in the same second the watch began.
  const startedMs = d.capture_started_at ? new Date(d.capture_started_at).getTime() : NaN;
  const retainedMs = d.retained_since ? new Date(d.retained_since).getTime() : NaN;
  const predatesStart = retainedMs < startedMs - 1000;

  // Each edge is stated only when it HAS a value. Before the first successful read all three are
  // null, and "Watching since —. Oldest attempt still retained —. Last read —." is three em-dashes
  // of noise in front of the one sentence that state actually needs. The caveat below them is
  // unconditional, because it is true in every state and is the whole point of the banner.
  const edges = [
    d.capture_started_at
      && `Watching since <strong>${esc(fmtTime(d.capture_started_at))}</strong> (${
           esc(ago(d.capture_started_at))})`,
    d.retained_since
      && `oldest attempt still retained <strong>${esc(fmtTime(d.retained_since))}</strong>`,
    d.last_read_at
      && `last read <strong>${esc(fmtTime(d.last_read_at))}</strong> (${
           esc(ago(d.last_read_at))})`,
  ].filter(Boolean);
  const window_ = `<div class="filterbar-note mt-4">
    ${edges.length ? edges.join("; ") + "." : ""}
    Nothing before capture began was ever recorded — the oauth-server's log dies with its pod and
    cannot be read backwards — so an empty list here means nothing was <em>observed</em>, never
    that nobody signed in.
    ${predatesStart
      ? `The oldest attempt predates the first read because that read looked back an hour, which
         is expected rather than a fault.` : ""}
  </div>`;

  const stalledNote = stalled
    ? `<div class="truncation-note">
        <strong>Capture has stopped.</strong> The last successful read was
        ${esc(ago(d.last_read_at))}, and reads are expected every ${interval}s — anything past
        ${Math.round(staleAfter / 60)} minutes is overdue. Attempts made since then are being
        lost, and they cannot be recovered later. Check the dashboard pod's log for a refused
        <code>pods/log</code> read, and that an oauth-server pod is Running.
      </div>` : "";

  // Nothing recorded yet is the state most likely to be MISREAD, so it gets the whole card and
  // says which of the three reasons applies rather than leaving the reader to guess. At the
  // narrowed tier "no rows" means no rows FOR YOU — the two operational diagnoses below answer
  // a question the scoped reader did not ask, so the scoped state says whose record is empty
  // instead, and the capture-health note still carries the operational truth.
  if (!d.total) {
    return `<section class="card">
      <h2>Login attempts</h2>
      ${scopeBanner("logins", d)}
      ${self
        ? `<div class="empty-note">No sign-in attempts recorded for
            <strong>${esc(d.viewer || "you")}</strong> since capture began. This view is
            scoped to you; it says nothing about whether anyone else signed in.</div>`
        : d.last_read_at ? `<div class="empty-note">
          Reads are working — the log was last read ${esc(ago(d.last_read_at))} — and
          <strong>no login lines matched</strong>. Either nobody has signed in since watching
          began, or the authentication operator is not at Debug, in which case the oauth-server
          never writes a username. One command decides which:
          <code>oc get authentications.operator.openshift.io cluster -o jsonpath='{.spec.logLevel}'</code>
          must print <code>Debug</code>.
        </div>`
        : `<div class="empty-note">
          <strong>No successful read yet.</strong> Capture is enabled but has not managed to
          read a log, so this is a cluster-access problem rather than a quiet one. The
          dashboard's ServiceAccount needs <code>pods</code> list and the
          <code>pods/log</code> subresource in the oauth-server's namespace
          (<code>openshift-authentication</code> unless configured otherwise), and at least one
          oauth-server pod has to be Running. Note that
          <code>oc auth can-i get pods/log</code> answers <code>no</code> even on a correct
          grant — it reads <code>pods/log</code> as a resource <em>name</em>. Use
          <code>--subresource=log</code>.
        </div>`}
      ${stalledNote}
      ${window_}
    </section>` + access;
  }

  const failures = s.failures || 0;
  const ungovernedCount = s.ungoverned_users || 0;
  // The hero is the finding, not the volume — at the wide tier. At the narrowed tier the
  // finding is withheld along with the rest of the whole-record numbers, so the hero is
  // the one number that IS the viewer's: their own attempt count. No zeros stand in for
  // the suppressed summary — a zero with the old label would be a lie with an axis.
  const headline = self
    ? `<div class="hero">
      <span class="value mono">${(d.total || 0).toLocaleString()}</span>
      <span class="label">sign-in attempt${d.total === 1 ? "" : "s"} recorded for you</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Most recent</div>
        <div class="value mono muted sm">${
          esc(rows[0] ? ago(rows[0].at) : "—")}</div></div>
    </div>`
    : `<div class="hero">
      <span class="value mono">${ungovernedCount}</span>
      <span class="label">${ungovernedCount
        ? `${ungovernedCount === 1 ? "account" : "accounts"} in no synced group`
        : "every account seen is in a synced group"}</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Attempts</div>
        <div class="value mono">${(d.total || 0).toLocaleString()}</div></div>
      <div class="kpi"><div class="label">Distinct users</div>
        <div class="value mono">${s.distinct_users || 0}</div></div>
      <div class="kpi"><div class="label">Signed in</div>
        <div class="value mono">${(s.successes || 0).toLocaleString()}</div></div>
      <div class="kpi ${failures ? "flag-warning" : ""}"><div class="label">Failed</div>
        <div class="value mono ${failures ? "" : "muted"}">${failures.toLocaleString()}</div></div>
      <div class="kpi"><div class="label">Most recent</div>
        <div class="value mono muted sm">${esc(ago(s.last_at))}</div></div>
    </div>`;
  return `<section class="card">
    <h2>Login attempts</h2>
    ${scopeBanner("logins", d)}
    ${headline}
    ${stalledNote}
    ${window_}
  </section>
  ${access}
  ${self ? "" : ungovernedCard(d, ungoverned)}
  <section class="card">
    <div class="section-head"><h3>${self ? "Your attempts" : "Every attempt"}</h3><span class="flush"></span>
      ${view.loginOutcome !== "all"
        ? `<span class="chip">filtered to ${esc(OUTCOME_LABEL[view.loginOutcome]
            || view.loginOutcome)}</span>` : ""}
    </div>
    ${rows.length === 0
      ? `<div class="empty-note">No attempt matches this filter. The counts above cover the
           whole record, not this view.</div>`
      : `<div class="scroll-x"><table>
          <thead><tr><th>When</th><th>User</th><th>Outcome</th><th>Provider</th>
            <th>Detail</th><th>${d.source === "audit-log" ? "Node" : "Replica"}</th></tr></thead>
          <tbody>${rows.map((r) => `<tr>
            <td class="mono nowrap">${esc(fmtTime(r.at))}</td>
            <td>${loginUser(r)}${r.in_access_group === false && !r.break_glass
              ? ` <span class="chip" title="Not a member of the login-gate group, so this account cannot authenticate at all. With that known, a `+"`"+`no match`+"`"+` here is a real person outside the group rather than a username that does not exist.">not in access group</span>`
              : ""}${r.break_glass
              ? ` <span class="chip" title="${r.outcome === "success"
                  ? "A break-glass sign-in: a local HTPasswd account, not a directory identity, so there is no synced group to govern it and nobody to offboard."
                  : "An attempt against the local HTPasswd provider. The name may not exist — HTPasswd reports no reason — so this says which provider was tried and nothing about the account."}">${
                  r.outcome === "success" ? "break-glass" : "local provider"}</span>`
              : (r.known_user ? "" : ` <span class="chip">${r.has_history
                  ? "removed from every group" : "no synced group"}</span>`)}</td>
            <td>${outcomeBadge(r.outcome)}${refusalBadge(r.refusal_reason)}</td>
            <td>${r.provider ? `<span class="chip mono" title="Identity provider the attempt went through.">${esc(r.provider)}</span>` : `<span class="muted">—</span>`}</td>
            <td class="muted">${esc(r.detail || "")}${r.ldap_result_code != null
              ? ` <span class="mono">(LDAP ${r.ldap_result_code})</span>` : ""}</td>
            <td class="mono muted nowrap">${
              esc((r.pod_name || "").replace(/^oauth-openshift-/, ""))}</td>
          </tr>`).join("")}</tbody>
        </table></div>`}
    ${d.truncated ? `<div class="truncation-note">
      Showing the <strong>${rows.length}</strong> most recent of <strong>${d.total}</strong>
      retained attempts. Every number above covers all of them.
    </div>` : ""}
    <div class="filterbar-note mt-4">
      <strong>No match</strong> covers two cases this log cannot separate: a real person who is
      not in the login-gate group, and a username that does not exist. The identity provider's
      search filter carries the gate group, so both produce the same
      <code>no entries matching</code> line — telling them apart from the log alone would need a
      directory read this dashboard does not make. Where a <strong>second badge</strong> appears
      beside it, that ambiguity HAS been resolved, from synced group membership rather than from any
      new read: hover it for the reasoning. Where no second badge appears, no login gate is known and
      the honest answer is still that we cannot tell.
      <strong>Detail</strong> is the directory's own diagnostic, passed through rather than
      interpreted. On Active Directory it carries a <code>data &lt;hex&gt;</code> sub-code, which
      is what distinguishes an expired password from a locked account — the LDAP result code
      alone does not: <code>49</code> is returned for all of them. OpenLDAP leaves the field
      empty and signals expiry with code <code>53</code> instead.
      <strong>Replica</strong> is which oauth-server pod saw it, with the common prefix trimmed;
      the two replicas serve different attempts, so a name here is the pod whose log to read.
    </div>
  </section>`;
}

/* Who can actually LOG IN, against who holds access.

   THE ONE VIEW IN THIS DASHBOARD THAT DOES NOT START FROM RBAC, which is exactly why it sees something
   none of the others can: a role granted to somebody who cannot authenticate is access that can never
   be used. Measured on the reference cluster — 10 people held access through synced groups, 7 were in
   the login-gate group, so 3 held access they could not exercise, one of them through 26 groups.

   IT NEEDS NO LOGS. Membership comes from synced Group objects, so this panel is as true on a cluster
   that has never enabled Debug logging as on one that has — which is why loginsPage renders it in every
   branch, including the capture-disabled one.

   `synced: false` IS NOT ZERO FINDINGS. The gate group has to be pulled into OpenShift by the
   group-sync-operator before there is any membership to compare against, and a panel that rendered
   "0 people affected" when the answer is "we have no data" would be the worst thing on this page. */
function accessCard(d) {
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;

  // The narrowed shape, declared by the response itself: the viewer's own gate status,
  // rendered without the DN, the lists or the summary the payload no longer carries.
  if (d.scope === "self") return accessSelfCard(d);

  // No gate at all. A finding in itself rather than an absence, and stated as one: with no membership
  // clause in any identity provider's filter, everyone in its search base can sign in.
  if (!d.gated) {
    return `<section class="card">
      <h2>Cluster access</h2>
      <div class="empty-note"><strong>No login gate is configured.</strong> No identity provider's
        search filter carries a <code>memberOf</code> or <code>isMemberOf</code> clause, so any
        account in its search base can sign in — there is no group whose membership to check against.
      </div>
      <div class="filterbar-note">That is a finding, not a gap in this page. If the gate lives
        somewhere this cannot see — or the dashboard may not read the OAuth CR — name it explicitly
        with <code>clusterAccess.group</code>, set to the group's full DN.</div>
    </section>`;
  }

  // The DN is known and the Group is not synced: no membership to compare against. Say what is
  // missing and what to do, and do NOT render a zero.
  if (!d.synced) {
    return `<section class="card">
      <h2>Cluster access</h2>
      <div class="empty-note">
        The login gate is <code>${esc(d.dn)}</code>${d.source === "oauth"
          ? ", discovered from the identity provider's filter" : ", from configuration"},
        and <strong>no synced group matches it</strong> — so there is no membership to compare
        against. This is missing data, not a clean result.
      </div>
      <div class="filterbar-note">${esc(d.note)}</div>
    </section>`;
  }

  const s = d.summary || {};
  const rows = d.access_without_login || [];
  const gatedOnly = d.login_without_access || [];
  const stranded = s.access_without_login || 0;
  return `<section class="card">
    <div class="section-head"><h2>Cluster access</h2><span class="flush"></span>
      <span class="chip" title="${d.source === "oauth"
        ? "Discovered from the identity provider's search filter. Set clusterAccess.group to state it explicitly instead."
        : "From clusterAccess.group."}">${d.source === "oauth" ? "discovered" : "configured"}</span>
    </div>
    <div class="hero">
      <span class="value mono">${stranded}</span>
      <span class="label">${stranded
        ? `${stranded === 1 ? "person holds" : "people hold"} access they cannot use`
        : "everyone with access can log in"}</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Gate group</div>
        <div class="value mono sm">${esc(d.group_name)}</div></div>
      <div class="kpi"><div class="label">Allowed to log in</div>
        <div class="value mono">${s.gated_members || 0}</div></div>
      <div class="kpi"><div class="label">Hold access</div>
        <div class="value mono">${s.with_access || 0}</div></div>
      <div class="kpi ${stranded ? "flag-critical" : ""}"><div class="label">Cannot log in</div>
        <div class="value mono ${stranded ? "" : "muted"}">${stranded}</div></div>
      <div class="kpi"><div class="label">Gated, no access</div>
        <div class="value mono ${s.login_without_access ? "" : "muted"}">${
          s.login_without_access || 0}</div></div>
    </div>
    <div class="filterbar-note mt-4">
      Membership of <code>${esc(d.dn)}</code> is required to authenticate, so anybody outside it
      cannot use access they hold. Both spellings of the membership attribute are read when the DN is
      discovered — <code>memberOf</code> on OpenLDAP and Active Directory,
      <code>isMemberOf</code> on 389-ds and Oracle DSEE — because neither is standardised.
    </div>
  </section>
  ${stranded ? `<section class="card">
    <h3>Access that cannot be used</h3>
    <div class="scroll-x"><table>
      <thead><tr><th>User</th><th class="num">Groups</th><th>Through</th>
        <th>Member since</th><th>Tried to log in</th></tr></thead>
      <tbody>${rows.map((r) => `<tr>
        <td><button type="button" class="drill mono" data-user="${esc(r.user_name)}">${
          esc(r.user_name)}</button>${r.full_name
            ? ` <span class="muted">· ${esc(r.full_name)}</span>` : ""}</td>
        <td class="num">${r.group_count}</td>
        <td class="muted">${(r.groups || []).slice(0, 2).map((g) =>
          `<code>${esc(g)}</code>`).join(" ")}${(r.groups || []).length > 2
            ? ` <span class="muted">+${r.groups.length - 2} more</span>` : ""}</td>
        <td class="mono nowrap">${esc(fmtTime(r.first_seen_at))}</td>
        <td>${r.has_tried
          ? `<span class="badge warning"><span class="glyph" aria-hidden="true"></span>yes, and was refused</span>`
          : `<span class="muted">not since capture began</span>`}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    ${d.truncated ? `<div class="truncation-note">
      Showing <strong>${rows.length}</strong> of <strong>${stranded}</strong>. The counts above cover
      all of them.</div>` : ""}
    <div class="filterbar-note mt-4">
      Every one of these holds access through a synced group and is not in the gate group, so the
      access is unusable until either the person is added to the gate group or the grant is removed —
      <strong>which of those is right is the access review's decision, not this page's</strong>.
      <strong>Tried to log in</strong> reads the login record, so it only sees attempts since capture
      began; <em>not since capture began</em> is not evidence that nobody tried.
      A name here that is <em>also</em> in the login record with <code>no match</code> is the case the
      oauth log cannot resolve on its own: a real person, outside the gate group, rather than a
      username that does not exist.
    </div>
  </section>` : ""}
  ${gatedOnly.length ? `<section class="card">
    <h3>Allowed to log in, holds no access</h3>
    <div class="scroll-x"><table>
      <thead><tr><th>User</th><th>In the gate group since</th><th>Tried to log in</th></tr></thead>
      <tbody>${gatedOnly.map((r) => `<tr>
        <td class="mono">${esc(r.user_name)}${r.full_name
          ? ` <span class="muted">· ${esc(r.full_name)}</span>` : ""}</td>
        <td class="mono nowrap">${esc(fmtTime(r.first_seen_at))}</td>
        <td>${r.has_tried ? `<span class="badge ok"><span class="glyph" aria-hidden="true"></span>yes</span>`
          : `<span class="muted">not since capture began</span>`}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="filterbar-note mt-4">
      Not automatically a problem — a new joiner looks exactly like this, and so does somebody who
      only needs what <code>system:authenticated</code> already grants. It is worth reading because it
      is also where a SERVICE identity inside the gate group shows up: on the reference directory the
      group's own LDAP bind account carries a <code>uid</code>, so it syncs like a person and can
      authenticate with its bind password.
    </div>
  </section>` : ""}`;
}

/* Accounts that reached the login page and belong to no synced group.

   The one table on this page that is a FINDING rather than a record, which is why it sits above
   the chronology and not inside it. Two columns turn it from a curiosity into something
   actionable: `last_outcome` separates "still getting in" from "trying and failing", and
   `has_history` separates an account whose access was REMOVED and is still being used from a
   name this cluster has never governed at all. Those are different problems with different
   owners — the first is an offboarding that did not finish, the second is usually a person
   pointed at the wrong cluster, or someone who should not be there. */
function ungovernedCard(d, rows) {
  const total = (d.summary || {}).ungoverned_users || 0;
  if (!total) {
    return `<section class="card">
      <h3>Accounts in no synced group</h3>
      <div class="empty-note">None. Every account seen signing in — successfully or not — is a
        member of at least one synced group. Attempts on a local HTPasswd provider are excluded by
        configuration (<code>loginCapture.htpasswdProviders</code>), because a break-glass account has
        no synced group to belong to and nowhere to migrate to.</div>
    </section>`;
  }
  return `<section class="card">
    <h3>Accounts in no synced group</h3>
    <div class="scroll-x"><table>
      <thead><tr><th>User</th><th class="num">Attempts</th><th>First seen</th><th>Last seen</th>
        <th>Last outcome</th><th>Ever governed</th></tr></thead>
      <tbody>${rows.map((r) => `<tr>
        <td>${loginUser({ user_name: r.user_name, has_history: r.has_history, known_user: false })}</td>
        <td class="num">${r.attempts}</td>
        <td class="mono nowrap">${esc(fmtTime(r.first_at))}</td>
        <td class="mono nowrap">${esc(fmtTime(r.last_at))}</td>
        <td>${outcomeBadge(r.last_outcome)}</td>
        <td>${r.has_history
          ? `<span class="err">was, and no longer is</span>`
          : `<span class="muted">never</span>`}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    ${rows.length < total ? `<div class="truncation-note">
      Showing <strong>${rows.length}</strong> of <strong>${total}</strong>. The rest are in the
      chronology below, marked the same way.
    </div>` : ""}
    <div class="filterbar-note mt-4">
      Membership is checked against what this dashboard has SYNCED, so an account here is in no
      group the operator manages — it may still hold access granted by a binding made by hand,
      which the <strong>Access granted</strong> tab is where to look. <strong>Ever governed</strong>
      reads the membership timeline: <em>was, and no longer is</em> means the removal is recorded
      and the account is still being used, which is an offboarding that did not finish.
      Attempts on a local HTPasswd provider are excluded, so an account that only ever signs in that
      way — <code>kubeadmin</code>, <code>developer</code> — never appears here. The exclusion is per
      ATTEMPT, not per name: if somebody types a break-glass name at the <em>directory</em> provider
      it does appear, on the strength of that attempt, which is worth seeing rather than hiding.
    </div>
  </section>`;
}

/* Group drill-down: who is in it, since when, and what has changed. */
function groupDetail() {
  const d = data.group;
  // A DESIGNED refusal: at the narrowed tier a group outside your membership answers a
  // 403 that is byte-identical for a real group and a nonexistent one — no existence
  // oracle — so this card must not claim to know which it was.
  if (d && d.forbidden) {
    return refusalCard(view.group || "This group",
      `Only groups you belong to are visible at your tier. This one is outside your view —
       or does not exist; the two are deliberately indistinguishable.`, true);
  }
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;

  const members = d.members || [];
  // The whole list before the filter narrows it, so the header can report what was hidden — the
  // same denominator rule as the Groups and Users tabs. Both fields, so a member is findable by
  // the display name a reader knows as well as the id the cluster knows.
  const shown = members.filter((m) => matchesSearch([m.user_name, m.full_name], view.memberSearch));
  const memberSearching = (view.memberSearch || "").trim().length > 0;
  const memberQuery = (view.memberSearch || "").trim();
  const memberBody = shown.length
    ? `<div class="scroll-x"><table>
        <thead><tr><th>User</th><th>In this group since</th><th>First ever granted</th>
          <th>Last confirmed</th></tr></thead>
        <tbody>${shown.map((m) => {
          // Distinguished on purpose: if a user left and rejoined, "since" is the current
          // unbroken stretch while "first ever" is the original grant. Showing only the
          // former would tell an auditor access is newer than it is.
          const rejoined = m.original_first_seen_at
            && m.original_first_seen_at !== m.first_seen_at;
          return `<tr class="rowlink" data-user="${esc(m.user_name)}">
          <td><button type="button" class="drill">${esc(m.user_name)}</button>${m.full_name
            ? ` <span class="muted">· ${esc(m.full_name)}</span>` : ""}</td>
          <td class="mono">${esc(fmtTime(m.first_seen_at))} <span class="muted">(${esc(ago(m.first_seen_at))})</span></td>
          <td class="mono ${rejoined ? "" : "muted"}">${esc(fmtTime(m.original_first_seen_at))}${
            rejoined ? ` <span class="badge warning ml-2"><span class="glyph" aria-hidden="true"></span>rejoined</span>` : ""}</td>
          <td class="mono muted">${esc(ago(m.last_seen_at))}</td>
        </tr>`;}).join("")}</tbody>
      </table></div>`
    : (memberSearching && members.length > 0
        // Only blame the filter when it IS the filter: an empty group stays "no members" whatever
        // is typed, or the reader clears the box expecting rows and gets the same empty table.
        ? `<div class="empty-note">No member's id or name contains
            <strong>${esc(memberQuery)}</strong>. ${members.length === 1
            ? `1 member is in this group, so it is the search hiding them`
            : `${members.length} members are in this group, so it is the search hiding them`}
            rather than the group being empty.</div>`
        : `<div class="empty-note">This group has no members. If it is operator-managed, the
            LDAP-side members either do not resolve or were filtered out — no object is created
            for a member that cannot be resolved, so nothing else on the cluster shows this.</div>`);

  const changes = d.changes || [];
  const changeBody = changes.length
    ? `<div class="scroll-x"><table>
        <thead><tr><th>Change</th><th>User</th><th>Observed</th><th>Sync that carried it</th></tr></thead>
        <tbody>${changes.map((c) => `<tr>
          <td class="change-${esc(c.change)}">${c.change === "added" ? "+ joined" : "− left"}</td>
          <td><button type="button" class="drill"
                data-user="${esc(c.user_name)}">${esc(c.user_name)}</button></td>
          <td class="mono">${esc(fmtTime(c.observed_at))}</td>
          <td class="mono muted">${esc(c.group_synced_at ? fmtTime(c.group_synced_at) : "—")}</td>
        </tr>`).join("")}</tbody>
      </table></div>`
    : (d.retention && d.retention.window_days > 0
        ? `<div class="empty-note">No membership changes in the retained window. Rows older than
            ${Number(d.retention.window_days)} days were removed by retention — a cut, not "nothing
            happened".</div>`
        : `<div class="empty-note">No membership changes seen yet. This timeline is accumulated
        by polling, so it starts when this dashboard does — it is not a history of the group.</div>`);

  return `<section class="card">
    <button class="back" id="back-groups">${backLabel()}</button>
    <h2 class="mt-5">${esc(d.name)}
      ${d.deleted ? sevBadge("warning", "deleted") : ""}</h2>
    ${d.deleted ? `<div class="filterbar-note mt-3">
      This group no longer exists on the cluster. It is still reachable from the membership
      history below, which is why this page is not an error — the record of who was in it,
      and when it went, is the answer to the click.</div>` : ""}
    <div class="kpis">
      <div class="kpi"><div class="label">Members</div><div class="value">${d.member_count}</div></div>
      <div class="kpi"><div class="label">Owner</div>
        <div class="value sm">${d.owner
          ? ownerCell(d.sync_provider) : `<span class="err">unattributed</span>`}</div></div>
      <div class="kpi"><div class="label">Schedule</div>
        <div class="value sm"><code>${esc(d.owner ? d.owner.schedule : "—")}</code></div></div>
      <div class="kpi"><div class="label">Last refreshed</div>
        <div class="value sm">${esc(ago(d.group_synced_at))}</div></div>
    </div>
    ${d.ldap_uid ? `<div class="mt-6"><h3>Source DN</h3>
      <code>${esc(d.ldap_uid)}</code></div>` : ""}
  </section>
  <section class="card">
    <h2>Members <span class="muted fw-normal">· ${memberSearching
      ? `${shown.length} of ${members.length} shown` : members.length}</span></h2>
    <div class="filterbar-note mt-2 mb-4">
      <strong>Select a user to see every group they belong to.</strong>
      "Member since" is when this dashboard first observed the user in the group — not when
      LDAP added them. It cannot predate this dashboard.
    </div>
    ${memberSearching ? `<div class="filterbar-note mt-0 mb-2">Searching the members of this group only — <button type="button" class="linkish" data-widen="${esc(memberQuery)}">search everything instead</button></div>` : ""}
    ${memberSearching ? `<div class="filterbar-note mt-0 mb-4">Filtered by
      <strong>${esc(memberQuery)}</strong> — every word must appear in the id or the name.${members.length > 0
      ? ` Clear the box, or press Escape in it, to see all ${members.length}.` : ""}</div>` : ""}
    ${memberBody}
  </section>
  ${bindingsCard(d.bindings, "This group")}
  <section class="card">
    <h2>Membership changes</h2>
    ${retentionNote(d.retention)}
    ${changeBody}
  </section>`;
}

/* Direct bindings only. The heading and the note both say so, because a reader who thinks
   this is an effective-permission calculation could conclude access is absent when it is
   not — a false negative here gets an incident closed wrongly. */
function bindingsCard(bindings, who, lead) {
  const rows = bindings || [];
  const ns = rows.filter((b) => b.binding_kind === "RoleBinding");
  const cluster = rows.filter((b) => b.binding_kind === "ClusterRoleBinding");
  const namespaces = [...new Set(ns.map((b) => b.binding_namespace))];

  const table = (list, scoped) => `<div class="scroll-x"><table>
      <thead><tr>${scoped ? "<th>Namespace</th>" : ""}<th>Role</th><th>Binding</th>
        ${list[0] && list[0].via_group ? "<th>Via group</th>" : ""}</tr></thead>
      <tbody>${list.map((b) => `<tr>
        ${scoped ? `<td>${esc(b.binding_namespace)}</td>` : ""}
        <td><code>${esc(b.role_name)}</code> <span class="muted">${esc(b.role_kind)}</span></td>
        <td class="muted">${esc(b.binding_name)}</td>
        ${b.via_group ? `<td><button type="button" class="drill" data-group="${esc(b.via_group)}">${esc(b.via_group)}</button></td>` : ""}
      </tr>`).join("")}</tbody></table></div>`;

  return `<section class="card">
    <h2>Access granted <span class="muted fw-normal">· direct role bindings</span></h2>
    <div class="filterbar-note mt-2 mb-5">
      ${lead ? lead : `${esc(who)} is named by these bindings.`} Role rules are <strong>not</strong> evaluated,
      so this is what has been granted, not a computed list of permitted actions.
    </div>
    ${rows.length === 0
      ? `<div class="empty-note">No RoleBindings or ClusterRoleBindings name this group.
          It grants no access on this cluster — which, for a synced group, usually means
          the binding was never created.</div>`
      : `<div class="kpis mt-0">
          <div class="kpi"><div class="label">Namespaces</div><div class="value">${namespaces.length}</div></div>
          <div class="kpi"><div class="label">Cluster-wide roles</div>
            <div class="value ${cluster.length ? "" : "muted"}">${cluster.length}</div></div>
        </div>
        ${cluster.length ? `<h3 class="mt-7">Cluster-wide</h3>${table(cluster, false)}` : ""}
        ${ns.length ? `<h3 class="mt-7">Namespaced</h3>${table(ns, true)}` : ""}`}
  </section>`;
}

/* Reverse lookup — the "why does this person have access?" view. */
function userDetail() {
  const d = data.user;
  if (d && d.forbidden) {
    return refusalCard(view.user || "This user",
      `Only your own profile is visible at your tier.`, true);
  }
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  const groups = d.groups || [];
  return `<section class="card">
    <button class="back" id="back-groups">${backLabel()}</button>
    <h2 class="mt-5">${esc(d.user)}${d.full_name
      ? ` <span class="muted">· ${esc(d.full_name)}</span>` : ""}</h2>
    <div class="kpis">
      <div class="kpi"><div class="label">Groups</div><div class="value">${groups.length}</div></div>
      <div class="kpi"><div class="label">Logged in</div><div class="value">${d.logged_in ? "yes" : "no"}</div></div>
      ${d.first_login_at ? `<div class="kpi"><div class="label">First login</div><div class="value mono sm">${esc(fmtTime(d.first_login_at))}</div></div>` : ""}
      ${d.login_capture === "off" ? "" : `<div class="kpi"><div class="label">Last captured login</div><div class="value mono sm">${d.last_login_at ? esc(fmtTime(d.last_login_at)) : "none"}</div></div>`}
    </div>
    <div class="filterbar-note mt-4">
      ${d.logged_in
        ? `Has logged in to this cluster${(d.providers || []).length ? ` through <span class="mono">${d.providers.map(esc).join(", ")}</span>` : ""}.`
        : `Has <strong>never logged in</strong> to this cluster — OpenShift has no User object for this id.
           Membership below comes from group sync, which does not depend on a login.`}
      Every group this user belongs to on this cluster is listed below; the cluster itself can only
      answer this by scanning every Group object.
    </div>
  </section>
  <section class="card">
    <h2>Group memberships</h2>
    ${groups.length === 0
      ? ((d.changes || []).length
          ? `<div class="empty-note">This user is currently in no groups on this cluster. They
              were in at least one before — see the history below. That is the answer to
              "did they lose everything, or just this one?", not an error.</div>`
          // A User who logged in and was never in a synced group: the row exists because of the
          // login, and there is no history to point at. Administrators and service identities
          // land here; so does anyone granted access outside group sync.
          : `<div class="empty-note">This user has never been in a synced group on this cluster.
              Whatever access they hold was granted outside group sync — see the bindings below.</div>`)
      : `<div class="scroll-x"><table>
          <thead><tr><th>Group</th><th>Owner</th><th>Member since</th></tr></thead>
          <tbody>${groups.map((g) => `<tr class="rowlink" data-group="${esc(g.group_name)}">
            <td><button type="button" class="drill" data-group="${esc(g.group_name)}">${esc(g.group_name)}</button></td>
            <td>${ownerCell(g.sync_provider)}</td>
            <td class="mono">${esc(fmtTime(g.first_seen_at))}</td>
          </tr>`).join("")}</tbody>
        </table></div>`}
  </section>
  ${bindingsCard(d.bindings, esc(d.user))}
  <section class="card">
    <h2>History</h2>
    ${retentionNote(d.retention)}
    ${(d.changes || []).length === 0
      ? (d.retention && d.retention.window_days > 0
          ? `<div class="empty-note">No membership changes for this user in the retained window. Rows
              older than ${Number(d.retention.window_days)} days were removed by retention — a cut, not
              proof that nothing was ever observed.</div>`
          : `<div class="empty-note">No membership changes observed for this user yet.</div>`)
      : `<div class="scroll-x"><table>
          <thead><tr><th>Change</th><th>Group</th><th>Observed</th></tr></thead>
          <tbody>${d.changes.map((c) => `<tr class="rowlink" data-group="${esc(c.group_name)}">
            <td class="change-${esc(c.change)}">${c.change === "added" ? "+ joined" : "− left"}</td>
            <td><button type="button" class="drill" data-group="${esc(c.group_name)}">${esc(c.group_name)}</button></td>
            <td class="mono">${esc(fmtTime(c.observed_at))}</td>
          </tr>`).join("")}</tbody>
        </table></div>`}
  </section>`;
}


/* Every group-subject binding on the cluster, classified, filtered by the row above.
   Opens on "granted + needs review": the faults first, because nothing else on the cluster
   reports them, then the Granted section — what has actually been granted, which is what the
   page is named for. The built-in majority stays one filter away; it is noise to a reviewer.
   Two earlier shapes were both misrepresentations: a "Bindings" label over ONLY the
   non-resolving rows (228 bindings shown as 154), and then a default of the faults alone,
   which the operator read as the page missing its data (2026-09-03). */
/* The narrowed reader's Access granted: the bindings that reach THEM through their groups —
   the one thing require_admin_tier's gate never withheld (a reader's own path, bounded by
   membership) — rendered where the refusal card used to be. The payload is their own
   /users/{me}; a viewer the store has never seen (no group, no history, no User) is a 404
   there, and that is the empty state here, never an error card. */
/* ── Home (#158) ────────────────────────────────────────────────────────────────────────────
   The page every reader lands on: "what can I reach, and how?", for the person asking and nobody
   else. Self-scoped by definition, so it renders the same shape for a narrowed reader and an
   administrator — the tier problem the Overview's refusal card left open is dissolved rather than
   special-cased. The visuals are docs/design/landing-access-mock.html: the answer first, then five
   cards (what changed, cluster-wide, namespaces, direct grants, your groups), every row a drill into
   the page that already exists. Every number comes from `answer`, derived once on the server
   (gsd/home.py); the page composes sentences from it and never recomputes a figure under a label. */
const RW_ROLES = new Set(["cluster-admin", "admin", "edit"]);
const HOME_FOLD_AFTER = 2;   // granting groups shown before "N more groups grant access"

function homeRow(inner, attrs = "", cls = "") {
  // A whole row is the control (the mock's row-with-chevron): a native button when it drills, so
  // Enter and Space activate it and the drill handlers (`[data-group]`, `[data-ns]`) find it by
  // the same attributes every other page uses; a div when there is nowhere to go.
  return attrs
    ? `<button type="button" class="hrow ${cls}" ${attrs}>${inner}</button>`
    : `<div class="hrow static ${cls}">${inner}</div>`;
}
const homeMain = (name, meta) => `<span class="main"><span class="name">${name}</span>${meta ? `<span class="meta">${meta}</span>` : ""}</span>`;
const rolePill = (role) => `<span class="role${RW_ROLES.has(role) ? " rw" : ""}">${esc(role)}</span>`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const andList = (names) => names.map((n) => `<b>${esc(n)}</b>`).join(", ").replace(/, ([^,]*)$/, " and $1");

function homePage() {
  const d = data.home;
  if (!d) return `<div class="home"><section class="card"><div class="empty-note">Loading…</div></section></div>`;
  if (d.forbidden) {
    return `<div class="home"><section class="card"><h2>Home</h2>
      <div class="scope-refusal"><strong>Nobody to show.</strong> Home is your own access — the groups you are
      in, what they grant you, where — and there is no authenticated identity to scope it to: the proxy
      passed no username, or this cluster does not treat your identity as one of its own. The cluster is
      not empty and nothing is broken; sign in through the proxy and it fills in.</div></section></div>`;
  }
  const a = d.answer, cluster = d.cluster, top = a.top_role;
  const nsCount = a.namespaces.length;
  // The answer, first. One sentence that is true of this reader on this cluster.
  let h1;
  if (top) h1 = `You have cluster-wide ${esc(top)} on ${esc(cluster)}`;
  else if (a.cluster_wide.length) h1 = `You hold ${plural(a.cluster_wide.length, "cluster-wide role", "cluster-wide roles")} on ${esc(cluster)}`;
  else if (nsCount) h1 = `You reach ${plural(nsCount, "namespace", "namespaces")} on ${esc(cluster)}`;
  else if (a.groups_total) h1 = `Your groups grant nothing on ${esc(cluster)}`;
  else h1 = `Nothing on ${esc(cluster)} names you`;
  const sub = [];
  if (top && nsCount) {
    // "all 1 of your namespace grant" is not a sentence: at one, the count IS the word.
    sub.push(a.namespaces_covered === nsCount
      ? (nsCount === 1 ? `It already covers the one namespace you reach.`
                       : `It already covers all <b>${nsCount}</b> namespaces you reach.`)
      : `It covers <b>${a.namespaces_covered}</b> of the <b>${nsCount}</b> namespaces you reach.`);
  }
  sub.push(a.groups_total
    ? `<b>${a.groups_granting}</b> of your <b>${a.groups_total}</b> ${a.groups_total === 1 ? "group grants" : "groups grant"} access; <b>${a.direct_count}</b> direct ${a.direct_count === 1 ? "grant" : "grants"}.`
    : `You are in no synced group here; <b>${a.direct_count}</b> direct ${a.direct_count === 1 ? "grant" : "grants"}.`);
  const tags = [
    top ? `<span class="tag rwx">cluster-wide ${esc(top)}</span>` : `<span class="tag">no cluster-wide role</span>`,
    `<span class="tag">${plural(nsCount, "namespace", "namespaces")}</span>`,
    `<span class="tag">${a.groups_granting} / ${a.groups_total} ${a.groups_total === 1 ? "group grants" : "groups grant"}</span>`,
    a.direct_count ? `<span class="tag warn">${plural(a.direct_count, "direct grant", "direct grants")}</span>` : "",
  ].join("");
  const stalePills = d.elsewhere.filter((c) => c.status !== "ok" || !c.last_poll || Date.now() - Date.parse(c.last_poll) > 86_400_000)
    .map((c) => `<span class="poll-age">${esc(c.cluster)} ${c.status === "ok" ? "last polled" : `${esc(c.status)}, last polled`} ${esc(ago(c.last_poll))}</span>`).join("");
  const xcluster = d.elsewhere.length
    ? `<div class="xcluster">These numbers are for <b>${esc(cluster)}</b>. You're also on ${andList(d.elsewhere.map((c) => c.cluster))} —
        <b>${d.memberships_total}</b> group ${d.memberships_total === 1 ? "membership" : "memberships"} in total.${stalePills}</div>`
    : "";
  const who = `<div class="who">Signed in as <b>${esc(d.viewer)}</b>${d.providers.length ? ` · ${esc(d.providers.join(", "))}` : ""}${d.full_name ? ` · ${esc(d.full_name)}` : ""}</div>`;
  const answer = `<section class="card answer">${who}<h1>${h1}</h1><div class="sub">${sub.join(" ")}</div><div class="tags">${tags}</div>${xcluster}</section>`;

  // What changed: the reader's own membership history, folded server-side.
  const ch = d.changes;
  const changeRows = ch.items.map((i) => {
    const elsewhere = i.cluster !== cluster ? ` — on <b>${esc(i.cluster)}</b>, not this cluster` : "";
    const when = `<span class="when">${esc(ago(i.observed_at))}</span>`;
    if (i.kind === "flap") {
      const story = i.latest === "added" ? "added, removed and re-added" : "removed, added and removed again";
      return homeRow(homeMain(esc(i.group_name), `${story} — <b>${i.changes} changes in ${i.span_minutes} minutes</b>${elsewhere}`)
        + `<span class="flap">flapping</span>${when}`, `data-group="${esc(i.group_name)}" data-cluster="${esc(i.cluster)}"`);
    }
    if (i.kind === "batch") {
      const shown = i.groups.slice(0, 6).map(esc).join(", ");
      return homeRow(homeMain(`${i.count} groups ${esc(i.change)} at once`, `${shown}${i.groups.length > 6 ? ` and ${i.groups.length - 6} more` : ""} — one sync${elsewhere}`)
        + when, `data-nav-groups="${esc(i.cluster)}"`);
    }
    return homeRow(homeMain(esc(i.group_name), `${esc(i.change)}${elsewhere}`) + when,
      `data-group="${esc(i.group_name)}" data-cluster="${esc(i.cluster)}"`);
  });
  // `window_days: 0` is "kept forever" (history_retention), so the oldest row held is where the dashboard
  // STARTED watching, not a cut — saying "pruned" of it would invent a deletion (review of #158, Codex).
  const r = d.retention || {};
  // A cluster whose history hit the per-cluster cap makes every count here a lower bound; saying the
  // number plainly would overclaim (review of #158, Codex).
  const capped = (ch.capped_clusters || []);
  const capNote = capped.length
    ? ` Only the most recent changes were read for ${andList(capped)}, so the counts here are at least this many.`
    : "";
  const changeFoot = !r.retained_since
    ? "Every change since this dashboard started watching your groups."
    : r.window_days
      ? `History starts <span class="mono">${esc(String(r.retained_since).slice(0, 10))}</span> — older changes have been pruned by retention.`
      : `History starts <span class="mono">${esc(String(r.retained_since).slice(0, 10))}</span>, where this dashboard began watching; nothing is pruned.`;
  // The window is the server's (gsd/home.py) and arrives with the payload: a second copy here drifts
  // the moment one of them moves, and the card would name a window the rows were not selected by.
  const windowDays = ch.window_days;
  const changed = `<section class="card c-changes"><h2>What changed <span class="count">last ${windowDays} days</span></h2>
    ${changeRows.length ? `<div class="hlist">${changeRows.join("")}${ch.more ? `<div class="hrow static"><span class="main"><span class="meta">${plural(ch.more, "more change", "more changes")} in the window.</span></span></div>` : ""}</div>`
      : `<div class="empty-note">No change to your group memberships in the last ${windowDays} days.</div>`}
    <div class="foot">${changeFoot}${capNote}</div></section>`;

  // Cluster-wide: the roles held everywhere, and which of them a stronger one already includes.
  const wideRows = a.cluster_wide.map((w) => {
    const via = w.via_groups.length ? `via ${andList(w.via_groups)}` : "";
    const meta = [w.direct ? "granted to you directly" : "", via].filter(Boolean).join("; ");
    const right = w.covered_by ? `<span class="none">covered by ${esc(w.covered_by)}</span>` : rolePill(w.role_name);
    return homeRow(homeMain(esc(w.role_name), meta) + right, w.via_groups.length ? `data-group="${esc(w.via_groups[0])}"` : "");
  });
  // Only speak of groups that exist: a cluster-wide role held by a DIRECT grant has no groups behind
  // it, and the sentence read "0 groups grant edit cluster-wide … removing them would not change what
  // you can do" (review of #158, Grok).
  const wideFoot = a.cluster_wide.filter((w) => w.covered_by).map((w) => {
    // "includes by default": the stock ClusterRoles aggregate this way, but a cluster may change what
    // `edit` carries, so this is a lead for a review to confirm — never a proof about live rules
    // (review of #158, Codex, citing the Kubernetes RBAC reference).
    const includes = `<span class="mono">${esc(w.covered_by)}</span> includes it by default`;
    if (w.via_groups.length) {
      return `${plural(w.via_groups.length, "group grants", "groups grant")} <span class="mono">${esc(w.role_name)}</span> cluster-wide, and ${includes} — worth confirming before anyone relies on ${w.via_groups.length === 1 ? "it" : "them"}.`;
    }
    return w.direct
      ? `A direct cluster-wide <span class="mono">${esc(w.role_name)}</span> grant sits under one ${includes} — worth confirming before anyone relies on it.`
      : "";
  }).filter(Boolean).join(" ");
  const wide = `<section class="card c-wide"><h2>Cluster-wide <span class="count">${plural(a.cluster_wide.length, "role", "roles")} · ${plural(a.cluster_wide_bindings, "binding", "bindings")}</span></h2>
    ${wideRows.length ? `<div class="hlist">${wideRows.join("")}</div>` : `<div class="empty-note">No cluster-wide role — everything you reach on ${esc(cluster)} is namespaced.</div>`}
    ${wideFoot ? `<div class="foot">${wideFoot}</div>` : ""}</section>`;

  // Namespaces: every one a binding reaches through your groups or names you in.
  const nsRows = a.namespaces.map((n) => {
    const viaGroups = [...new Set(n.grants.filter((g) => g.via_group).map((g) => g.via_group))];
    // Keyed by kind AND name: a Role and a ClusterRole called `admin` are two objects, and calling them
    // "the same grant" is the collision the ranking already fixed (review of #158, Codex).
    const roleKeys = [...new Set(n.grants.map((g) => `${g.role_kind}/${g.role_name}`))];
    const roles = [...new Set(n.grants.map((g) => g.role_name))];
    const direct = n.grants.some((g) => !g.via_group);
    let meta = viaGroups.length ? `via ${andList(viaGroups)}` : "";
    if (viaGroups.length > 1 && roleKeys.length === 1) meta += ` — ${viaGroups.length === 2 ? "two" : viaGroups.length} paths to the same grant`;
    if (direct) meta = [meta, "granted to you directly"].filter(Boolean).join("; ");
    const right = n.covered && top ? `<span class="none">covered by ${esc(top)}</span>` : roles.map(rolePill).join("");
    const name = `${esc(n.name)}${n.platform ? '<span class="plat">platform namespace</span>' : ""}`;
    return homeRow(homeMain(name, meta) + right, `data-ns="${esc(n.name)}"`);
  });
  const nsCovered = a.namespaces_covered;
  const nsCount2 = nsCount && top ? (nsCovered === nsCount ? " · all already covered" : nsCovered ? ` · ${nsCovered} already covered` : "") : "";
  const namespaces = `<section class="card c-ns"><h2>Namespaces you can reach <span class="count">${nsCount}${nsCount2}</span></h2>
    ${nsRows.length ? `<div class="hlist">${nsRows.join("")}</div>` : `<div class="empty-note">No namespaced grant reaches you on ${esc(cluster)}.</div>`}</section>`;

  // Direct grants: the governance exception, shown to the person who holds it. Omitted at zero —
  // the answer already says "0 direct grants", and an empty card would only repeat it.
  const consoleNs = "openshift-console-user-settings";
  const directRows = d.direct.map((g) => homeRow(
    homeMain(esc(g.binding_namespace || "cluster-wide"), "granted to you directly, not through a group") + rolePill(g.role_name),
    g.binding_namespace ? `data-ns="${esc(g.binding_namespace)}"` : ""));
  const directFoot = d.direct.length && d.direct.every((g) => g.binding_namespace === consoleNs)
    ? "Created by the OpenShift console to store your own console preferences — expected, not a governance exception."
    : "A grant naming you rather than a group survives your removal from every group — the exception an access review looks for.";
  const direct = d.direct.length
    ? `<section class="card c-direct"><h2>${d.direct.length === 1 ? "Direct grant" : "Direct grants"} <span class="count">${d.direct.length}</span></h2>
        <div class="hlist">${directRows.join("")}</div><div class="foot">${directFoot}</div></section>`
    : "";

  // Your groups: the one that gives the top role first, then what each grants; the long tail folded.
  const show = view.homeShow;
  const granting = a.groups.filter((g) => g.grants), idle = a.groups.filter((g) => !g.grants);
  const groupMeta = (g) => {
    if (g.gives_top) {
      const peers = granting.filter((x) => x.gives_top).length;
      return peers === 1 ? `the one that gives you ${esc(top)}` : `one of the ${peers} that give you ${esc(top)}`;
    }
    const parts = [];
    if (g.cluster_wide_roles.length) parts.push(`cluster-wide ${g.cluster_wide_roles.map(esc).join(", ")}`);
    if (g.namespaces.length) parts.push(plural(g.namespaces.length, "namespace grant", "namespace grants"));
    return parts.join(" · ");
  };
  const groupRight = (g) => g.gives_top ? `<span class="scope">cluster ${esc(top)}</span>` : `<span class="scope">${plural(g.grants, "grant", "grants")}</span>`;
  const groupRow = (g) => homeRow(homeMain(esc(g.group_name), groupMeta(g)) + groupRight(g), `data-group="${esc(g.group_name)}"`);
  const lead = granting.slice(0, HOME_FOLD_AFTER), rest = granting.slice(HOME_FOLD_AFTER);
  const groupRows = lead.map(groupRow);
  if (rest.length) {
    if (show.granting) groupRows.push(...rest.map(groupRow));
    else groupRows.push(homeRow(homeMain(`${rest.length} more ${rest.length === 1 ? "group grants" : "groups grant"} access`,
      rest.slice(0, 4).map((g) => esc(g.group_name)).join(" · ") + (rest.length > 4 ? " · …" : ""))
      + `<span class="none">show all</span>`, `data-home-show="granting"`));
  }
  if (idle.length) {
    if (show.idle) groupRows.push(...idle.map((g) => homeRow(homeMain(esc(g.group_name), "grants nothing here") + `<span class="none">no grant</span>`, `data-group="${esc(g.group_name)}"`)));
    else groupRows.push(homeRow(homeMain(`${plural(idle.length, "group grants", "groups grant")} nothing here`,
      idle.slice(0, 6).map((g) => esc(g.group_name)).join(", ") + (idle.length > 6 ? " and others" : ""))
      + `<span class="none">show all</span>`, `data-home-show="idle"`));
  }
  const groups = `<section class="card c-groups"><h2>Your groups <span class="count">${a.groups_total} · ${a.groups_granting} grant access</span></h2>
    ${groupRows.length ? `<div class="hlist">${groupRows.join("")}</div>` : `<div class="empty-note">You are in no synced group on ${esc(cluster)}.</div>`}
    <div class="foot">A group that grants nothing is normal — it may exist for another cluster, or be waiting on a binding.</div></section>`;

  return `<div class="home">${answer}${changed}${wide}${namespaces}${direct}${groups}</div>`;
}

function wireHome() {
  // The folds are view state, never a position: expanding "show all" is not a place to come back to.
  document.querySelectorAll("[data-home-show]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); view.homeShow[el.dataset.homeShow] = true; render(); };
  });
  // A change on another cluster drills into that cluster's group page: the cluster is part of the
  // position, so Back returns here with this cluster restored (applyPosition owns the switch).
  document.querySelectorAll(".home [data-group][data-cluster]").forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      navigate({ page: "groups", group: el.dataset.group, cluster: el.dataset.cluster, user: null, ns: null });
      render(); refresh();
    };
  });
  document.querySelectorAll("[data-nav-groups]").forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      navigate({ page: "groups", cluster: el.dataset.navGroups, group: null, user: null, ns: null });
      render(); refresh();
    };
  });
}

function myAccessPage(d) {
  const rows = d.bindings || [];
  const banner = scopeBanner("access", d);
  if (rows.length === 0) {
    return `<section class="card">
      <h2>Access granted</h2>
      ${banner}
      <div class="empty-note">No group grants you access on this cluster. Access here arrives through
        synced groups, and <strong>${esc(d.viewer || d.user || "you")}</strong> is in none that a
        RoleBinding or ClusterRoleBinding names. This view is scoped to you — it says nothing about
        what the cluster grants to others.</div>
    </section>`;
  }
  return `<section class="card"><h2>Access granted</h2>${banner}</section>`
    + bindingsCard(rows, "You",
        "These bindings reach you through the group in the Via group column. Select the group to see who else is in it.");
}

const BIND_SORT = {
  group: (r) => r.group_name || "",
  // Nulls (no Group object) rank below zero, so they gather at the far end whichever way.
  reaches: (r) => r.member_count == null ? -1 : r.member_count,
  grants: (r) => `${r.role_name || ""} ${r.role_kind || ""}`,
  scope: (r) => r.binding_namespace || "",
  binding: (r) => r.binding_name || "",
};

function bindingMatches(r, q) {
  return matchesSearch([r.group_name, r.role_name, r.binding_namespace, r.binding_name], q);
}

/* Which binding rows the Access granted tab paints: every tier filtered by the Find box, and the
   tiers the "Show" filter admits, in the order the page lays them out. Shared with the export. */
const BINDING_TIERS = ["ok", "dangling", "unresolved", "built_in", "unmanaged"];
function bindingsVisible(raw) {
  const q = view.bindingSearch || "";
  const f = Object.fromEntries(BINDING_TIERS.map((t) =>
    [t, (raw[t] || []).filter((r) => bindingMatches(r, q))]));
  // Which tiers the selected filter paints — the search note's denominator, so it never
  // counts a match the reader cannot see (Built-in is hidden on the default view).
  const visible = ({ review: ["dangling", "unresolved", "unmanaged", "ok"], ok: ["ok"],
                     built_in: ["built_in"], unmanaged: ["unmanaged"] })[view.bindingFilter]
                  || ["dangling", "unresolved", "unmanaged", "ok", "built_in"];
  return { f, visible };
}

/* One sort for the binding table and its export. Rows with no Group object have nothing to say
   in Reaches; whichever way the column is sorted they go last, so a descending sort still starts
   with the biggest real group. */
function sortedBindings(rows) {
  const key = view.bindingSort, dir = view.bindingDir;
  let sorted = sortBy(rows, BIND_SORT[key] || BIND_SORT.group, dir);
  if (key === "reaches") sorted = sorted.filter((r) => r.member_count != null).concat(sorted.filter((r) => r.member_count == null));
  return sorted;
}

function bindingsPage() {
  // The tier is unknown until whoami answers — and unknown again if a later whoami fails.
  // Neither the cached wide payload nor the cached own path is truthful then, so this fails
  // closed like the Overview: the same Loading state, never a claim (Codex second pass).
  if (!readerTierKnown()) {
    return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  }
  // A narrowed reader sees their own path. `myAccess` arrives from refresh(), on the first
  // cycle only after the findings fetch has come back forbidden and whoami has named them.
  if (narrowedReader()) {
    if (data.myAccess) return myAccessPage(data.myAccess);
    // A narrowed identity that carries no username cannot be asked for its own path. Say so
    // rather than spin: the reader can tell "the proxy sent no user" from "still fetching".
    if (!(data.whoami && data.whoami.user)) {
      return refusalCard("Access granted",
        `Your session is narrowed to your own access, but the proxy passed no username to scope
         it to, so there is nothing to show. Sign out and back in; if it persists, the proxy is
         not setting X-Forwarded-User.`, true);
    }
    return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  }
  const raw = data.findings;
  // The search narrows every section at once. `f` is what every branch below renders from;
  // `raw` keeps the whole-cluster counts for the header, which the search must not move.
  const q = view.bindingSearch || "";
  const searching = q.trim().length > 0;
  // The filtered tiers and which of them this filter paints, shared with the export.
  const { f, visible } = raw && !raw.forbidden ? bindingsVisible(raw) : { f: null, visible: [] };
  const d = raw;
  // A DESIGNED 403 (the binding surface is the administrator tier), phrased — never the
  // generic error card, and never a blank that reads as a healthy cluster.
  if (d && d.forbidden) {
    return refusalCard("Access granted",
      `Every group-subject binding on this cluster — who has been granted what — is the
       cluster's RBAC surface.`);
  }
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  const c = d.counts || {};
  const review = (c.dangling || 0) + (c.unresolved || 0);

  const header = `<section class="card">
    <div class="kpis mt-0">
      <div class="kpi"><div class="label">Group bindings on this cluster</div>
        <div class="value">${d.total || 0}</div></div>
      <div class="kpi"><div class="label">Grant a real group</div>
        <div class="value muted">${c.ok || 0}</div></div>
      <div class="kpi${review ? (c.dangling ? " flag-critical" : " flag-warning") : ""}"><div class="label">Need review</div>
        <div class="value ${review ? "" : "muted"}">${review}</div></div>
      <div class="kpi"><div class="label">Built-in</div>
        <div class="value muted">${c.built_in || 0}</div></div>
    </div>
    <div class="filterbar-note mt-5">
      Direct RoleBindings and ClusterRoleBindings whose subject is a Group. Role rules are
      <strong>not</strong> evaluated, so this is what has been granted, not a computed list
      of permitted actions.
    </div>
    ${d.truncated
      // Stated BEFORE the search note, so the denominator is qualified before it is used — the
      // Users and Logins tabs' rule. The page holds FINDINGS_PAGE rows ordered by group name; the
      // header's counts are the cluster's, the lists and the Find box are the page's. Without this
      // a reader searching for a group past the cut would conclude it holds no grant (Cursor, #48).
      ? `<div class="truncation-note" id="binding-truncation-note">Showing the first
          <strong>${Object.values(raw).filter(Array.isArray).reduce((n, rows) => n + rows.length, 0)}</strong> of
          <strong>${d.total || 0}</strong> group bindings, by group name; the cluster has more. The
          Find box and the sort work only over these, so a binding past the cut cannot be found here.</div>` : ""}
