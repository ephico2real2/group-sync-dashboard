    ${searching ? `<div class="filterbar-note mt-3" id="binding-search-note">Filtered by
      <strong>${esc(q.trim())}</strong> — every word must appear in the group, role, namespace or binding
      name. ${visible.reduce((n, t) => n + f[t].length, 0)} of
      ${visible.reduce((n, t) => n + (raw[t] || []).length, 0)} ${d.truncated ? "loaded " : ""}bindings in the
      sections shown match.${d.truncated ? " A binding past the cut is not searched." : ""}
      Clear the box, or press Escape in it, to see ${d.truncated ? "the loaded rows" : "all of them"}.</div>` : ""}
  </section>`;

  // The policy-operator strip is part of the page, not of a filter: these CRs template
  // the bindings this page shows, so their health belongs beside them whichever tier is
  // selected. It was originally rendered only on the default filter, where nobody found it.
  if (view.bindingFilter === "unmanaged") {
    return header + bindingSection("Unmanaged",
      `The group is operator-synced, other bindings on this cluster carry the policy
       operator's <code>config-source</code> label, and this one carries none — somebody
       granted access by hand, outside the policy system. A deliberate one can be
       acknowledged with the <code>rbac.ocp.io/unmanaged-exception</code> annotation on the
       binding itself, which records the justification next to the object and clears it
       from this list.`,
      f.unmanaged, sevBadge("warning", "unmanaged"));
  }
  if (view.bindingFilter === "ok") {
    return header + bindingSection("Granted",
      "The group named by each of these exists, so the access reaches its members.",
      f.ok);
  }
  if (view.bindingFilter === "built_in") {
    return header + bindingSection("Built-in",
      `Kubernetes virtual groups such as <code>system:authenticated</code> and
       <code>system:serviceaccounts:*</code>. They authorise real access and no Group object
       exists for them by design, so their absence is expected and not a fault.`,
      f.built_in);
  }
  if (view.bindingFilter === "all") {
    return header
      + bindingSection("Dangling", "The group was operator-managed and has disappeared — this "
          + "binding now grants nobody.", f.dangling, sevBadge("critical", "dangling"))
      + bindingSection("Unresolved", "Names a group that has never existed here.",
          f.unresolved, sevBadge("warning", "unresolved"))
      + bindingSection("Unmanaged", "Hand-made grant on an operator-synced group, outside the "
          + "policy system.", f.unmanaged, sevBadge("warning", "unmanaged"))
      + bindingSection("Granted", "The group exists; access reaches its members.", f.ok)
      + bindingSection("Built-in", "Virtual groups; no Group object is expected.", f.built_in);
  }

  // default: what was granted, with what needs review on top. The page is called Access
  // granted, and it used to open on the faults alone — the 34 bindings that actually grant
  // access on the reference cluster sat behind the filter, and the operator read the page as
  // missing its data (enhancement, 2026-09-03). The faults keep the top of the page because
  // nothing else on the cluster reports them; the Granted section follows; the built-in
  // majority (151 there) stays one filter away, because it is noise to a reviewer. The header
  // goes here too — without it this view would show a subset with no statement of the whole.
  return header + `<section class="card">
    <div class="hero">
      <div class="value">${review}</div>
      <div class="label">binding${review === 1 ? "" : "s"} that grant nobody</div>
    </div>
    <div class="filterbar-note">
      Each names a Group that does not exist, so the access it grants reaches no one.
      Nothing on the cluster reports this — <code>oc get rolebinding</code> shows a
      perfectly healthy object. The ${c.ok || 0} bindings that grant a real group follow
      below; the ${c.built_in || 0} built-in ones are behind the filter above.
    </div>
  </section>
  ${bindingSection("Dangling", "The group was operator-managed and has disappeared.",
      f.dangling, sevBadge("critical", "dangling"))}
  ${bindingSection("Unresolved",
      `These do not raise alerts: a group that has never been seen cannot be told apart
       from one that simply has not synced yet. They still grant nobody — typically a
       misspelled group name, or an onboarding that stopped halfway.`,
      f.unresolved, sevBadge("warning", "unresolved"))}
  ${bindingSection("Unmanaged",
      `Hand-made grants on operator-synced groups, outside the policy system. Acknowledge
       a deliberate one with the <code>rbac.ocp.io/unmanaged-exception</code> annotation on
       the binding; the justification then lives next to the object and clears it here.`,
      f.unmanaged, sevBadge("warning", "unmanaged"))}
  ${bindingSection("Granted",
      "The group named by each of these exists, so the access reaches its members. This is what has actually been granted on this cluster through groups; Reaches says how many people that is today, and how many of them have ever logged in.",
      f.ok)}`;
}

/* Binding table + section card, at module scope so both the Access-granted and the
   RBAC-policy pages render bindings identically. These were local to bindingsPage(), and
   calling them from the new page failed at runtime with "section is not defined" — caught
   by a screenshot, not by the suite, because no test opened that tab. tests/test_ui.py
   now does. */
/* Who a binding reaches today. `member_count` is the Group object's own count and
   `logged_in_count` is how many of those members have a User with an identity — the 0.9.0
   definition of a login. Both are null when no Group object exists (dangling, unresolved,
   built-in) and on an older server that does not send them; either way the cell says nothing
   rather than "0", because 0 is a finding: the group exists and grants nobody today. */
function reachCell(r) {
  if (r.member_count == null) return `<span class="muted">—</span>`;
  if (r.member_count === 0) {
    return `<strong class="err" title="The group exists but has no members, so this binding grants nobody today.">0 members</strong>`;
  }
  const members = `${r.member_count} member${r.member_count === 1 ? "" : "s"}`;
  return r.logged_in_count == null ? members
    : `${members} <span class="muted">· ${r.logged_in_count} logged in</span>`;
}

/* The group name, as a drill only where a group page can answer. A built-in virtual group
   (system:authenticated, system:serviceaccounts:*) never has a Group object, and an unresolved
   binding names a group that has never existed here — both drilled to a 404 card that blamed a
   deletion which never happened (operator, 2026-09-04). Dangling and granted groups keep the
   drill: the object exists, or existed and left history the page can show. */
function groupNameCell(r) {
  // A POSITIVE rule: drill only for the tiers where a group page can answer. Written as a
  // negative rule it drilled for a row that carried no tier at all (an older server), which is
  // exactly the dead end it was meant to remove (Codex second pass, 2026-09-04).
  if (r.finding === "ok" || r.finding === "unmanaged" || r.finding === "dangling") {
    return `<button type="button" class="drill" data-group="${esc(r.group_name)}">${esc(r.group_name)}</button>`;
  }
  const why = r.finding === "built_in"
    ? "A Kubernetes virtual group: it has no Group object, so there is no page to open."
    : r.finding === "unresolved"
      ? "No Group object with this name exists on the cluster, so there is no page to open."
      : "This server did not say whether a Group object exists, so there is no page to open safely.";
  return `<span class="mono" title="${why}">${esc(r.group_name)}</span>`;
}

function bindingTable(rows) {
  const key = view.bindingSort, dir = view.bindingDir;
  const sorted = sortedBindings(rows);
  const th = (label, k, extra) => sortableTh(label, k, key, dir, "bind", extra);
  return `<div class="scroll-x"><table>
      <thead><tr>${th("Group named by the binding", "group")}
        ${th("Reaches", "reaches")}
        ${th("Grants", "grants")}${th("Scope", "scope")}
        ${th("Binding", "binding")}</tr></thead>
      <tbody>${sorted.map((r) => `<tr>
        <td>${groupNameCell(r)}</td>
        <td>${reachCell(r)}</td>
        <td><code>${esc(r.role_name)}</code> <span class="muted">${esc(r.role_kind)}</span></td>
        <td>${r.binding_namespace
              ? esc(r.binding_namespace)
              : `<span class="muted">cluster-wide</span>`}</td>
        <td class="muted">${esc(r.binding_name)}</td>
      </tr>`).join("")}</tbody></table></div>`;
}

function bindingSection(title, note, rows, badge) {
  return `<section class="card">
    <h2>${badge || ""} ${esc(title)} <span class="muted fw-normal">· ${rows.length}</span></h2>
    ${note ? `<div class="filterbar-note mt-2 mb-4">${note}</div>` : ""}
    ${rows.length ? bindingTable(rows) : `<div class="empty-note">None.</div>`}
  </section>`;
}

/* RBAC policy: who governs the grants, rather than what the grants are.
   Split out of the Access-granted tab because it answers a different question — that page
   asks "who has access?", this one asks "is the system that decides access working, and is
   anything bypassing it?". Two concerns that happen to share a data source. */
function policyPage() {
  const oc = data.operatorConfigs;
  // The findings 403 is DESIGNED; the CR health beside it is governance data and still
  // renders. A named refusal, never a blank — an empty policy tab reads as "nothing
  // bypasses the policy system", which at the narrowed tier is not knowledge anyone has.
  if (data.findings && data.findings.forbidden) {
    return refusalCard("RBAC policy",
      `The grants that bypass the policy system name other people's access.`)
      + configHealth(oc);
  }
  const f = data.findings || {};
  const unmanaged = f.unmanaged || [];
  const stamped = unmanaged.filter((r) => r.audit_stamped).length;

  if (oc && !oc.present) {
    return `<section class="card">
      <h2>RBAC policy</h2>
      <div class="empty-note">
        The namespace-configuration-operator is not installed on <code>${esc(view.cluster)}</code>.
        This page reports the health of its NamespaceConfig and GroupConfig CRs and finds
        grants that bypass them; without the operator there is no policy system to report on.
      </div>
    </section>`;
  }

  return `<section class="card">
    <h2>RBAC policy</h2>
    <div class="hero">
      <span class="value mono">${unmanaged.length}</span>
      <span class="label">grant${unmanaged.length === 1 ? "" : "s"} outside the policy system</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Policy CRs</div>
        <div class="value mono">${(oc && oc.configs || []).length}</div></div>
      <div class="kpi ${unmanaged.length ? "flag-warning" : ""}">
        <div class="label">Unmanaged</div>
        <div class="value mono ${unmanaged.length ? "" : "muted"}">${unmanaged.length}</div></div>
      <div class="kpi"><div class="label">Audit-stamped</div>
        <div class="value mono ${stamped ? "" : "muted"}">${stamped}</div></div>
    </div>
    <div class="filterbar-note mt-5">
      A grant is <strong>unmanaged</strong> when it names an operator-synced group but
      carries none of the policy operator's provenance — somebody granted access by hand.
      Acknowledge a deliberate one with the
      <code>rbac.ocp.io/unmanaged-exception</code> annotation on the binding; the
      justification then lives next to the object and clears it here.
      ${stamped ? `<br>Audit stamping is enabled, so the current set is also selectable
        straight from the cluster:
        <br><code>oc get rolebindings,clusterrolebindings -A -l rbac.ocp.io/unmanaged=true</code>`
      : ""}
    </div>
  </section>
  ${configHealth(oc)}
  ${bindingSection("Grants outside the policy system",
      `Each names a group the operator syncs, and nothing templates the grant itself.`,
      unmanaged, sevBadge("warning", "unmanaged"))}`;
}

/* Roles granted directly to a person, rolled up per namespace: the migration worklist.
   A direct user binding is the violation this whole dashboard is shaped around — it
   survives offboarding, because revoking an LDAP group membership does nothing to a
   binding that names the person. Presented per namespace because that is the unit the
   migration is done in, and because "which namespaces still do this?" is the question an
   owner actually asks. */
/* #167 — namespaces are entities, not a filter: every one the poller sees, findable by name OR
   by a label value with the same AND contract as the other boxes, and each one a page. */
const labelShort = (key) => String(key).split("/").pop();

/* THE FOLD'S THRESHOLD AND THE PAGE SIZE ARE THE SAME NUMBER, and that is deliberate (#261): a row is
   about 34 px at 1280, so 25 rows is roughly one screen. A reader learns one number instead of two, and
   the fold's promise ("about a screenful") is the page's promise too. Below the threshold a fold costs a
   click and buys nothing, which is why the default is decided by the estate rather than fixed. */
const INDEX_FOLD = 25;
const INDEX_PAGE = 25;

function namespacesCard() {
  const d = data.namespaces;
  if (!d) return `<section class="card"><h2>Namespaces</h2><div class="empty-note">Loading…</div></section>`;
  if (d.forbidden) return "";   // the audit's own refusal card above already explains the tier
  const self = d.scope === "self";
  const keys = d.label_keys || [];
  const all = d.namespaces || [];
  const q = (view.nsSearch || "").trim();
  // #257: the SAME rule the Home page uses (gsd/home.py is_platform_namespace), decided server-side
  // and carried on the row, so the page and the app cannot drift into two definitions of "platform".
  // Filtered here, never dropped from the payload: export, the search and the drill all still reach a
  // hidden namespace, and the line below says how many are hidden rather than leaving a reader to
  // wonder why their count moved.
  const platformCount = d.platform_count != null ? d.platform_count : all.filter((n) => n.platform).length;
  const hidingPlatform = platformCount > 0 && !view.nsShowPlatform;
  const inScope = hidingPlatform ? all.filter((n) => !n.platform) : all;
  // TWO BOXES, AND THEY COMBINE (#261). The bar's `Find namespace` is the shell's and keeps the scope
  // it ships with; this section gets one of its own, beside the list it searches, because the bar is
  // ~1,900 px away from the rows once the page is scrolled. A namespace shows when it matches BOTH,
  // and neither box clears the other.
  const ownQ = (view.nsIndexSearch || "").trim();
  const fieldsOf = (n) => [n.name, ...keys.map((k) => (n.labels || {})[k])];
  const matches = (n) => matchesSearch(fieldsOf(n), q) && matchesSearch(fieldsOf(n), ownQ);
  const shown = inScope.filter(matches);
  // THE DEFAULT IS DECIDED BY WHAT THE SECTION HOLDS, never by what a search narrowed it to: keying it
  // on the filtered count let the bar's inherited box open the section by a side door, which is the one
  // thing this page does not get to do to a control it does not own (the mock's own render check found
  // that). Typing in THIS box reveals the section — filtering something the reader cannot see makes the
  // box look broken, and "nothing matches" is itself the answer to their query.
  // A FOLD ONLY HOLDS WHILE THE SECTION IS BIG ENOUGH TO NEED ONE (review of #264, Cursor C4). An
  // explicit `false` used to follow the reader: fold a 106-namespace estate, switch to a cluster with
  // four, and they got a folded four-row list with no empty branch to explain it — the same if
  // hiding platform namespaces took the set below the threshold. A section at or under INDEX_FOLD is
  // simply open; above it, the reader's choice stands and `null` means "decide by size" — folded.
  // Typing in THIS box pins the section open for as long as the query lasts, without touching the
  // reader's choice: Escape returns the section to whatever they had chosen.
  const foldable = inScope.length > INDEX_FOLD && !ownQ;
  const indexOpen = !foldable || (view.nsIndexOpen === null ? false : view.nsIndexOpen);
  const pages = Math.max(1, Math.ceil(shown.length / INDEX_PAGE));
  const wanted = Number.isFinite(view.nsIndexPage) ? Math.trunc(view.nsIndexPage) : 1;
  const page = Math.min(Math.max(1, wanted), pages);
  // WRITTEN BACK, so the state is the page on screen (review of #264, Cursor C5). Every control
  // resets the page itself; this catches the one path none of them owns — a poll that shrank the set
  // under a reader on page 5 — where a clamped display over a stale 5 would jump them the moment the
  // set grew again.
  if (view.nsIndexPage !== page) view.nsIndexPage = page;
  const from = (page - 1) * INDEX_PAGE, to = Math.min(from + INDEX_PAGE, shown.length);
  const paged = shown.slice(from, to);
  const source = d.source || {};
  const note = source.state === "forbidden"
    ? `<div class="filterbar-note truncation-note mb-4">The namespace read was refused (${esc(ago(source.observed_at))}), so this list cannot
        attest absence — a namespace missing here may exist. Grant namespaces [get,list] (chart: <code>rbac.namespaces</code>).</div>`
    : "";
  // The envelope counts what the columns count — distinct groups, grants naming a person. At the
  // self tier the counts are the viewer's own cluster-wide paths and the line explains why every
  // namespace is listed; with none of their own there is nothing to explain (OB1 F2). `cluster_wide_path`
  // is the reach itself, a platform identity's binding included: the one case where reach and the
  // counts differ gets its own sentence rather than "0 and 0 reach every namespace" (Codex, pass 2).
  const counted = !!(d.cluster_wide_groups || d.cluster_wide_grants);
  const reached = d.cluster_wide_path == null ? counted : !!d.cluster_wide_path;
  const cw = d.cluster_wide_groups == null || (self && !reached) ? ""
    : self && reached && !counted
      ? `<div class="filterbar-note mb-4">A cluster-wide grant to a platform identity of yours reaches every namespace below;
          platform identities stay out of the direct-grant count. The columns count what is bound <em>in</em> each one.</div>`
      : `<div class="filterbar-note mb-4">${d.cluster_wide_groups} group${d.cluster_wide_groups === 1 ? "" : "s"} bound cluster-wide and
        ${d.cluster_wide_grants} cluster-wide direct grant${d.cluster_wide_grants === 1 ? "" : "s"}${self ? " of yours" : ""} reach every namespace below; the columns count
        what is bound <em>in</em> each one. A namespace with zero in both is a result an access review wants to confirm.</div>`;
  // THE COUNT IS PART OF THE FILTER, not a footnote. A hidden row a reader cannot see and is not told
  // about is a row that was deleted as far as they know; and the one case where hiding costs them
  // something — a hidden namespace that HAS a finding — gets its own clause rather than making them
  // toggle to find out (#257).
  const withFindings = d.platform_with_findings || 0;
  // A configured pattern matching nothing on THIS cluster: a typo, or a convention that was
  // decommissioned. Said where the classification is said, because that is where a reader can act
  // on it, and named rather than counted — "2 patterns match nothing" sends someone to read the
  // values file, the names send them to the line (#255).
  const stale = d.platform_patterns_unmatched || {};
  const staleAxes = Object.keys(stale).filter((k) => (stale[k] || []).length);
  const stalePatterns = !staleAxes.length ? "" : `<div class="mt-2">⚠ ${staleAxes
    .map((axis) => `<code>${esc(axis)}</code>: ${stale[axis].map((v) => `<code>${esc(v)}</code>`).join(", ")}`)
    .join("; ")} ${staleAxes.length === 1 && stale[staleAxes[0]].length === 1 ? "matches" : "match"}
    no namespace on this cluster — a typo, or a convention that has gone.</div>`;
  const platformLine = !platformCount ? "" : `<div class="filterbar-note mb-4">${hidingPlatform
    ? `${platformCount} platform namespace${platformCount === 1 ? "" : "s"} hidden${withFindings
        ? ` — <strong>${withFindings}</strong> of them ${withFindings === 1 ? "has" : "have"} a direct grant`
        : ""}. <button type="button" class="linkish" id="ns-show-platform">Show them</button>`
    : `Platform namespaces shown. <button type="button" class="linkish" id="ns-show-platform">Hide the ${platformCount}</button>`}
    <span class="muted"> · <code>openshift-*</code>, <code>kube-*</code>, and five named ones — the rule the Home page uses.</span>${stalePatterns}</div>`;
  // THE PAGER. Every button is a real button with its own id-scoped attribute: the mock's render check
  // caught `[data-page]` also matching `<body data-page="nsaudit">`, so every click on the page ran the
  // pager's handler and emptied the list. `aria-current="page"` carries the position to a screen reader,
  // and the ends are disabled rather than absent so the control does not move under a reader. Every
  // button has an id because render() restores focus BY ID: without one, the 60 s repaint dropped a
  // keyboard reader from the pager to <body> (review of #264, Cursor C5).
  const pager = !indexOpen || pages < 2 ? "" : `<nav class="pager" id="ns-index-pager" aria-label="Namespace pages">
    <button type="button" class="linkish" id="ns-index-prev" data-index-page="${page - 1}"${page === 1 ? " disabled" : ""}>‹ Previous</button>
    ${Array.from({ length: pages }, (_, i) => i + 1).map((i) => i === page
      ? `<button type="button" class="linkish" id="ns-index-page-${i}" data-index-page="${i}" aria-current="page"><strong>${i}</strong></button>`
      : `<button type="button" class="linkish" id="ns-index-page-${i}" data-index-page="${i}">${i}</button>`).join(" ")}
    <button type="button" class="linkish" id="ns-index-next" data-index-page="${page + 1}"${page === pages ? " disabled" : ""}>Next ›</button>
  </nav>`;
  // ONE LINE, EVERY NUMBER BESIDE THE NUMBER IT CAME OUT OF. "39" alone says nothing; "39 of 106" says
  // what the filter did. The chain only names the steps that actually happened, so a small cluster with
  // no platform namespaces and no search reads as one clause rather than four zeroes.
  const chain = [`<strong>${all.length}</strong> on this cluster`];
  if (hidingPlatform && platformCount) chain.push(`<strong>${platformCount}</strong> platform hidden`);
  if (q || ownQ) chain.push(`<strong>${shown.length}</strong> of <strong>${inScope.length}</strong> match the search`);
  else if (hidingPlatform && platformCount) chain.push(`<strong>${inScope.length}</strong> listed`);
  if (indexOpen && shown.length) chain.push(pages > 1
    ? `showing <strong>${from + 1}–${to}</strong> on page <strong>${page}</strong> of <strong>${pages}</strong>`
    : `showing all <strong>${shown.length}</strong>`);
  const countsLine = `<div class="filterbar-note mb-2">${chain.join(" · ")}.</div>`;
  // The fold's label says what you would SEE if you opened it, out of what exists on the cluster — of
  // the three counts it could carry, that is the one a reader is deciding on.
  const foldLabel = shown.length === all.length
    ? `${all.length} namespace${all.length === 1 ? "" : "s"}`
    : `${shown.length} of ${all.length} namespaces`;
  // THE TOGGLE RENDERS ONLY WHERE IT CAN ACT (review of #264, Cursor C4). A section at or under
  // INDEX_FOLD cannot fold and one pinned open by its own query cannot either, so on both a button
  // reading "Hide 9 namespaces" would change nothing when pressed — the furniture the pager rule
  // already refuses ("no pager until there is a second page"). The numbers it carried are on the
  // counts line, which every reader gets.
  const toggle = !foldable ? "" : `<button type="button" class="linkish" id="ns-index-fold" aria-expanded="${indexOpen ? "true" : "false"}"
            aria-controls="ns-index-body">${indexOpen ? "▾ Hide" : "▸ Show"} ${foldLabel}</button>`;
  const controls = `<div class="row-wrap mb-3">
    <span class="filterbar-note"><label for="f-index-search">Search this list</label>
      <input id="f-index-search" type="search" inputmode="search" autocomplete="off" spellcheck="false"
             placeholder="name or label, any words" value="${esc(view.nsIndexSearch || "")}"
             aria-describedby="f-index-search-help">
      <span id="f-index-search-help" class="sr-only">Searches the namespaces in this section by name or by
        the value of any captured label as you type. Several words are combined with AND, so every word
        must appear. Press Escape to clear. This is separate from the Find namespace box in the filter
        bar; both apply.</span></span>
    ${toggle}
  </div>`;
  // WHICH BOX EMPTIED THE LIST. Two boxes AND together, so "press Escape in the box" no longer says
  // which one; and with both set, clearing the wrong one changes nothing. Each query is tried ALONE
  // against the same set: a box that matches nothing by itself is the one hiding the rows, and is
  // named; when each matches something alone and nothing together, the reader is told that instead.
  // Only computed when the list is empty, so it costs nothing on a normal paint.
  const searchEmpty = () => {
    const hiders = [
      q && !inScope.some((n) => matchesSearch(fieldsOf(n), q))
        ? `<strong>${esc(q)}</strong> in the bar's Find namespace box` : "",
      ownQ && !inScope.some((n) => matchesSearch(fieldsOf(n), ownQ))
        ? `<strong>${esc(ownQ)}</strong> in this list's Search box` : "",
    ].filter(Boolean);
    const still = `All ${inScope.length} are still there${hidingPlatform
      ? `, and ${platformCount} platform namespace${platformCount === 1 ? " is" : "s are"} hidden besides`
      : ""} — the filter is hiding them.`;
    // Reachable only with a query set: with both boxes empty every row matches and the list is not empty.
    return hiders.length
      ? `Nothing matches ${hiders.join(", nor ")}. ${still} Press Escape in ${hiders.length === 1 ? "that box" : "each box"} to clear it.`
      : `Nothing matches both <strong>${esc(q)}</strong> (the bar's Find namespace box) and <strong>${esc(ownQ)}</strong>
         (this list's Search box), though each matches something on its own. ${still} Press Escape in either box to widen.`;
  };
  const body = shown.length
    ? `<div class="scroll-x"><table>
        <thead><tr><th>Namespace</th>${keys.map((k) => `<th>${esc(labelShort(k))}</th>`).join("")}
          <th class="num">Via groups</th><th class="num">Direct grants</th></tr></thead>
        <tbody>${paged.map((n) => `<tr class="rowlink" data-ns="${esc(n.name)}">
          <td><button type="button" class="drill">${esc(n.name)}</button></td>
          ${keys.map((k) => `<td class="mono muted">${esc((n.labels || {})[k] || "—")}</td>`).join("")}
          <td class="num ${n.via_groups ? "" : "muted"}">${n.via_groups}</td>
          <td class="num ${n.direct_grants ? "err" : "muted"}">${n.direct_grants}</td>
        </tr>`).join("")}</tbody></table></div>`
    // THE EMPTY STATE IS DECIDED BY THE STAGE THAT EMPTIED THE LIST, never by which inputs happen to
    // be set. The rows pass through one pipeline — `all` → `inScope` (the platform filter) → `shown`
    // (the searches) — and the counts line is computed from those same three numbers, so the sentence
    // here and the counts above it cannot disagree. This ladder used to test INPUTS (`hidingPlatform`,
    // then `q`) and fall through to "No namespaces recorded" for anything it did not know about, and
    // it told that lie three times: for the platform filter (review of #257, Codex C8: "1 platform
    // namespace hidden" beside "No namespaces recorded"), for the self tier (#258, Cursor C8), and for
    // the section's own box (#264, Cursor C2: "0 of 39 match the search" beside "No namespaces
    // recorded"). Keyed on the stage, a filter added later cannot reach the cluster's sentence: that
    // one is reachable only when the cluster's own list is empty, and every stage in between owns its
    // own sentence.
    //
    // THE SELF TIER DOES NOT SPEAK FOR THE CLUSTER (#258, trigger A; #167, Grok F3). The payload is
    // self-scoped, so "every namespace on this cluster" and "nothing is missing from the cluster" are
    // claims it cannot support; prefixing them with "That is your view:" does not cancel them.
    : `<div class="empty-note">${!all.length
        ? (self
            ? "None of your memberships or grants reaches a namespace on this cluster. That is your view, not the cluster: a namespace missing here may exist."
            : "No namespaces recorded for this cluster yet.")
        : !inScope.length
        ? (self
            ? `Every namespace your memberships and grants reach is a platform one — all
               ${platformCount} of them are hidden. That is your view: a namespace missing here may exist.
               <button type="button" class="linkish" id="ns-show-platform-empty">Show them</button>`
            : `Every namespace on this cluster is a platform one — all ${platformCount} of them are hidden.
               Nothing is missing from the cluster.
               <button type="button" class="linkish" id="ns-show-platform-empty">Show them</button>`)
        : searchEmpty()}</div>`;
  return `<section class="card">
    <h2>Namespaces <span class="muted fw-normal">· ${shown.length === inScope.length ? inScope.length : `${shown.length} of ${inScope.length} shown`}</span></h2>
    ${platformLine}
    <div class="filterbar-note mb-4">${self
      ? "The namespaces your own memberships and grants reach — grants affecting you, nothing about other people."
      : "Every namespace the poller sees, not only those with a grant."} Click a row — a namespace is an entity here,
      the third drill-down beside groups and users. The box in the bar finds by name or by any captured label.</div>
    ${alsoLine("namespaces", view.nsSearch)}
    ${note}${cw}${controls}${countsLine}
    ${shown.length
      // ONLY THE ROWS FOLD. An empty state inside the fold is a sentence the reader cannot read: with
      // nothing matching and the section shut they would see a control and no reason for it, and
      // "nothing matches — all 39 are still there" is itself the answer to their query. The heading,
      // the notes, the counts line and every empty branch stay outside, which is also why this folds
      // the ROWS and not the card — three caveats live in the notes above.
      ? `<div id="ns-index-body"${indexOpen ? "" : " hidden"}>${body}${pager}</div>`
      : body}
  </section>`;
}

function nsDetail() {
  const d = data.ns;
  if (d && d.forbidden) {
    return refusalCard(view.ns || "This namespace",
      `Only namespaces your own memberships or grants reach are visible at your tier. This one is outside your view —
       or does not exist; the two are deliberately indistinguishable.`, true);
  }
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  const keys = d.label_keys || [];
  const labels = d.labels || {};
  const via = d.via_groups || [], wide = d.cluster_wide_groups || [], direct = d.direct_grants || [];
  const people = direct.filter((x) => !x.is_platform);
  // Virtual `system:` groups authorise access but hold no person: badged in the table, folded on the
  // cluster-wide line (the deployed demo-prod page listed 54 bindings, 41 of them these — the CRC walk).
  // Counted nowhere: `system:image-pullers` is in every OpenShift namespace, so a Via groups count that
  // held them read 1 on every row and "zero in both" could never happen. A platform row's default
  // binding is the platform's — the findings tier it built_in, never unmanaged — so it wears no
  // hand-made badge (review of #167, pass 3, OB1).
  const viaReal = via.filter((g) => !g.is_platform);
  const wideReal = wide.filter((g) => !g.is_platform), widePlatform = wide.filter((g) => g.is_platform);
  // Folded most-bound first — system:authenticated, every logged-in user, carries most of a cluster's
  // platform bindings — and with the count of groups behind the "…", which the deployed fold hid.
  const platformNames = [...widePlatform.reduce((m, g) => m.set(g.group_name, (m.get(g.group_name) || 0) + 1), new Map())]
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([name]) => name);
  // Cluster-wide grants naming a person, platform identities left out: kubeadmin reaches every
  // namespace by definition and would be one more line on every page (review of #167, Grok F4).
  const wideGrants = (d.cluster_wide_grants || []).filter((x) => !x.is_platform);
  const wideBindings = wide.length + wideGrants.length;
  const self = d.scope === "self";
  const kpi = (label, value, cls) => `<div class="kpi"><div class="label">${label}</div><div class="value ${cls || ""}">${value}</div></div>`;
  const labelledNote = keys.length
    ? (keys.some((k) => labels[k])
        ? `Labelled ${keys.filter((k) => labels[k]).map((k) => `<code>${esc(k)}=${esc(labels[k])}</code>`).join(" and ")}.`
        : `Carries none of the captured labels (${keys.map((k) => `<code>${esc(k)}</code>`).join(", ")}) — outside the naming convention,
           so no mnemonic-based report will ever pick it up.`)
    : "";
  return `<section class="card">
    <button class="back" id="back">${backLabel()}</button>
    <h2>${esc(d.name)}${d.present ? "" : ` <span class="badge unknown"><span class="glyph" aria-hidden="true"></span>no longer on the cluster</span>`}</h2>
    <div class="kpis">
      ${keys.map((k) => kpi(esc(labelShort(k)), esc(labels[k] || "— none —"), labels[k] ? "sm mono" : "sm muted")).join("")}
      ${self ? "" : kpi("People who reach it", d.people == null ? "—" : d.people)}
      ${kpi(self ? "Via your groups" : "Via groups", viaReal.length, viaReal.length ? "" : "muted")}
      ${kpi(self ? "Your direct grants" : "Direct grants", people.length, people.length ? "err" : "muted")}
    </div>
    <div class="filterbar-note mt-4">${labelledNote}${people.length ? "" : self
      // At the self tier `direct_grants` are the viewer's OWN, so an empty list says nothing about anyone
      // else: prod-ns carries jdoe's direct grant, and alice's page called that "the state an access review
      // wants to confirm" — a false statement about the cluster, made to the reader least able to check it
      // (OB3, integration review). The label follows the number it sits beside.
      ? " No binding names you here directly; other people's direct grants are the administrator tier."
      : " No RoleBinding names a person here directly, which is the state an access review wants to confirm."}${
      d.present ? "" : " The store no longer holds this namespace; what follows is what still names it."}</div>
  </section>
  <section class="card">
    <h2>Who reaches it, and through which group <span class="muted fw-normal">· ${viaReal.length}${via.length > viaReal.length ? ` · ${via.length - viaReal.length} platform` : ""}</span></h2>
    <div class="filterbar-note mb-4">${self ? "Your own memberships that reach this namespace."
      : "The answer the triangle exists for: a namespace, back to the groups that grant it, back to the people in those groups."}</div>
    ${via.length ? `<div class="scroll-x"><table>
      <thead><tr><th>Group</th><th>Role</th><th>Binding</th><th class="num">Members</th></tr></thead>
      <tbody>${via.map((g) => `<tr class="rowlink" data-group="${esc(g.group_name)}">
        <td><button type="button" class="drill">${esc(g.group_name)}</button>${g.is_platform ? ' <span class="badge unknown"><span class="glyph" aria-hidden="true"></span>platform</span>' : ""}</td>
        <td><code>${esc(g.role_name)}</code></td>
        <td class="muted">${esc(g.binding_kind)} <code>${esc(g.binding_name)}</code>${g.managed_source || g.is_platform ? "" : ' <span class="badge warning"><span class="glyph" aria-hidden="true"></span>hand-made</span>'}</td>
        <td class="num">${g.member_count}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty-note">${self
          // The same rule for the groups: `via_groups` are the viewer's own paths here. klt-pass-both IS
          // bound to app-ocp-rbac-klta-ns-audit, and alice's page said nobody is granted access at all.
          ? "None of your own memberships reaches this namespace through a group binding. Whether anyone else's does is the administrator tier."
          : `No group-based binding names this namespace. Access here is ${people.length
              ? "entirely by the direct grants below — which is what makes it a finding." : "not granted to anyone through the policy system."}`}</div>`}
    ${wideBindings ? `<div class="filterbar-note mt-4">Also reached cluster-wide, by ${wideBindings === 1 ? "one binding" : `${wideBindings} bindings`} that
        grant${wideBindings === 1 ? "s" : ""} every namespace${wideReal.length + wideGrants.length ? `: ${[
          ...wideReal.map((g) => `<button type="button" class="drill" data-group="${esc(g.group_name)}">${esc(g.group_name)}</button> (<code>${esc(g.role_name)}</code>)`),
          ...wideGrants.map((x) => `<button type="button" class="drill" data-user="${esc(x.user_name)}">${esc(x.user_name)}</button> (<code>${esc(x.role_name)}</code>, named directly)`),
        ].join(", ")}` : ""}${widePlatform.length ? `${wideReal.length + wideGrants.length ? "; and" : ":"} ${widePlatform.length} platform binding${widePlatform.length === 1 ? "" : "s"} to ${platformNames.length} virtual group${platformNames.length === 1 ? "" : "s"} (${
          esc(platformNames.slice(0, 3).join(", "))}${platformNames.length > 3 ? `, … ${platformNames.length - 3} more` : ""}) that every namespace carries` : ""}.</div>` : ""}
  </section>
  ${direct.length ? `<section class="card">
    <h2>Direct grants <span class="muted fw-normal">· ${people.length}${direct.length > people.length ? ` · ${direct.length - people.length} platform` : ""}</span></h2>
    <div class="filterbar-note mb-4">A person named by a binding rather than reached through a group — the rows a directory change cannot
      offboard. The operational goal for this card is zero.</div>
    <div class="scroll-x"><table>
      <thead><tr><th>Person</th><th>Role</th><th>Binding</th></tr></thead>
      <tbody>${direct.map((x) => `<tr class="rowlink" data-user="${esc(x.user_name)}">
        <td><button type="button" class="drill">${esc(x.user_name)}</button>${x.is_platform ? ' <span class="badge unknown"><span class="glyph" aria-hidden="true"></span>platform</span>' : ""}</td>
        <td><span class="badge ${/admin|edit/.test(x.role_name) ? "critical" : "warning"}"><span class="glyph" aria-hidden="true"></span>${esc(x.role_name)}</span></td>
        <td class="muted">${esc(x.binding_kind)} <code>${esc(x.binding_name)}</code></td></tr>`).join("")}</tbody></table></div>
  </section>` : ""}
  ${(d.siblings || []).length ? `<section class="card">
    <h2>Same ${esc(labelShort(d.sibling_key))} <span class="muted fw-normal">· ${esc(labels[d.sibling_key])}</span></h2>
    <div class="filterbar-note mb-4">Sibling namespaces sharing <code>${esc(d.sibling_key)}=${esc(labels[d.sibling_key])}</code>. Typing the value in the
      box finds all ${d.siblings.length + 1} at once.</div>
    <div>${d.siblings.map((n) => `<button type="button" class="drill mt-2" data-ns="${esc(n)}">${esc(n)}</button>`).join(" ")}</div>
  </section>` : ""}
  <section class="card">

/* #174 — one lookup over the three kinds. At rest: three doors with their counts and one line of

   search is an extra door beside the lists and the tabs, never a replacement for them. */
const LOOKUP_PER_KIND = 12;
/* The matched substrings, marked — the how and the why are inside the function, once. */
function hl(text, query) {
  // The matched substrings, marked. Matching runs on the RAW text and each fragment is escaped as it is
  // emitted: marking on the escaped string let a term land inside an entity (the `a` of `&amp;` —
  // "Smith & Wesson" painted as "Smith &amp; Wesson") or inside the <mark> the previous term had just
  // inserted ("alice a", the transient of typing a second word, painted "ark>aliceark>"), and could never
  // mark a `<` or `&` the reader typed (review of #174, OB1). Every occurrence of every term, overlapping
  // ones included ("ab bc" on "abc" marks all of "abc"; "aa" on "aaa" too), collected as ranges and merged,
  // so marks never nest (review of #174, pass 2, Codex).
  const value = text == null ? "" : String(text);
  const terms = [...new Set((query || "").toLowerCase().split(/\s+/).filter(Boolean))];
  if (!terms.length) return esc(value);
  const ranges = [];
  for (const term of terms) {
    const pattern = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    for (const m of value.matchAll(new RegExp(`(?=(${pattern}))`, "ig"))) ranges.push([m.index, m.index + m[1].length]);
  }
  ranges.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
  const merged = [];
  for (const [s, e] of ranges) {
    const last = merged[merged.length - 1];
    if (!last || s >= last[1]) merged.push([s, e]);
    else last[1] = Math.max(last[1], e);
  }
  let out = "", at = 0;
  for (const [s, e] of merged) {
    out += esc(value.slice(at, s)) + `<mark>${esc(value.slice(s, e))}</mark>`;
    at = e;
  }
  return out + esc(value.slice(at));
}
function lookupMatches(q) {
  const groups = (data.groups || []).filter((g) => matchesSearch([g.name, g.sync_provider], q));
  const users = ((data.users && data.users.users) || []).filter((u) => matchesSearch([u.user_name, u.full_name], q));
  const keys = (data.namespaces && data.namespaces.label_keys) || [];
  const namespaces = ((data.namespaces && data.namespaces.namespaces) || [])
    .filter((n) => matchesSearch([n.name, ...keys.map((k) => (n.labels || {})[k])], q));
  return { groups, users, namespaces, keys };
}

   (test_other_tabs_never_request_the_user_list) — so a kind not yet loaded is not counted, and the
   line is the plain door. The lookup page fetches all three on its own tab. */

  // whole list. A count over the `empty` slice said "1 group" where the cluster had two (review of
  // #174, OB1), so groups count only when the slice held is the whole list.
  const groupsWhole = data.groups && data.groupsMeta && data.groupsMeta.state === "all";
  const kinds = [["groups", m.groups.length, groupsWhole], ["users", m.users.length, data.users], ["namespaces", m.namespaces.length, data.namespaces]]
    .filter(([k]) => k !== kind);

  const door = `<button type="button" class="linkish" data-widen="${esc(q)}">${bits.length ? "see all matches" : `search everything for ${esc(q.trim())}`}</button>`;
  return `<div class="filterbar-note mt-2">${bits.length ? `also matching <strong>${esc(q.trim())}</strong>: ${bits.join(" · ")} — ` : ""}${door}</div>`;
}
function lookupDoors() {
  const g = data.groups, u = data.users, n = data.namespaces;
  const door = (page, count, kind, line) => `<section class="card door" data-page="${page}">
    <div class="kpi big"><div class="value">${count == null ? "…" : count}</div><div class="label">${kind}</div></div>
    <div class="filterbar-note mt-2">${line}</div>
    <div class="mt-3"><button type="button" class="drill" data-page="${page}">Browse all ${kind.toLowerCase()}</button></div>
  </section>`;
  const gLine = g ? `${g.filter((x) => x.binding_count).length} grant something · ${g.filter((x) => !x.sync_provider).length} unattributed` : "loading…";
  // logged_in_total, the Users tab's own headline: a manual account (`oc create user`, nobody has
  // used it) is a row, not a login — counting rows said "7 have logged in" over the tab's 6 (review
  // of #174, OB1). The fallback is the tab's, for a server that sends only the rows.
  const loggedIn = u && !u.forbidden
    ? (typeof u.logged_in_total === "number" ? u.logged_in_total : (u.users || []).filter((x) => x.logged_in !== false).length) : null;

  const uLine = u && !u.forbidden ? `${loggedIn} have logged in · ${((u.never_logged_in_members || {}).count) || 0} synced members never have${u.truncated ? " · list cut at the page limit" : ""}` : (u && u.forbidden ? "needs an authenticated identity" : "loading…");

  const nLine = nList ? `${nList.filter((x) => Object.keys(x.labels || {}).length).length} labelled · ${nList.filter((x) => x.direct_grants).length} carry a direct grant` : (n && n.forbidden ? "needs an authenticated identity" : "loading…");
  return `<div class="grid">
    ${door("groups", g ? g.length : null, "Groups", gLine)}
    ${door("users", u && !u.forbidden ? (typeof u.total === "number" ? u.total : (u.users || []).length) : null, "Users", uLine)}
    ${door("nsaudit", nList ? nList.length : null, "Namespaces", nLine)}

}
/* The lookup's own scope statement: every list page says when its rows are the reader's own, and the

function lookupScopeLine() {

  const sect = (label, count, of, page, table) => count ? `<h3 class="mt-4">${label} <span class="muted fw-normal">· ${count} of ${of}</span></h3>${table}` : "";

  const gT = `<div class="scroll-x"><table class="lookup-groups"><thead><tr><th>Group</th><th>Owner</th><th class="num">Members</th><th class="num">Grants</th></tr></thead>
    <tbody>${m.groups.slice(0, LOOKUP_PER_KIND).map((g) => `<tr class="rowlink" data-group="${esc(g.name)}">

    <tbody>${m.users.slice(0, LOOKUP_PER_KIND).map((u) => `<tr class="rowlink" data-user="${esc(u.user_name)}">

function wireLookup() {

  // a document-wide selector once wired the body — every click then navigated back to the page it
  // was on, after the door's own handler had left it. A door's inner button and the door itself
  // name the same page; the innermost element handles the click and the rest is ignored.
  document.querySelectorAll("#main [data-page]").forEach((el) => {
    el.onclick = (e) => {
      if (e.target.closest("[data-page]") !== el) return;
      if (e.target.closest("[data-group],[data-user],[data-ns]")) return;
      navigate({ page: el.dataset.page, group: null, user: null, ns: null, groupsync: null });
      // "open the full list to see them": the list's own box gets the query, so "them" is what it
      // shows. After navigate(), which never touches these filters. A door carries no data-filter.
      const carried = el.dataset.filter;
      if (carried) {
        if (el.dataset.page === "groups") view.groupSearch = carried;
        else if (el.dataset.page === "users") view.userSearch = carried;
        else if (el.dataset.page === "nsaudit") { view.nsSearch = carried; view.nsIndexPage = 1; }

      const carried = el.dataset.widen;
      navigate({ page: "lookup", group: null, user: null, ns: null, groupsync: null });
      view.lookupSearch = carried;
      refresh();
    };
  });

  if (!d) return `<section class="card"><h2>Cluster Configurations</h2><div class="empty-note">Loading…</div></section>`;
  if (d.forbidden) return refusalCard("Cluster Configurations", CLUSTERS_REFUSAL);
  const clusters = d.clusters || [];
  const n = { "in-cluster": 0, values: 0, secret: 0 };
  clusters.forEach((c) => { n[ccSourceKind(c)] += 1; });
  const s = d.secrets || {};
  const head = `<section class="card" id="cc-head">
    <h2>Cluster Configurations <span class="rp-chip rp-count">${clusters.length} cluster${clusters.length === 1 ? "" : "s"}</span></h2>
    <div class="filterbar-note">Every cluster the dashboard reads, and where its configuration came from — a card per cluster, the live set. The cluster-configuration tier: <span class="mono">clusterconfig:view</span> reads it, <span class="mono">clusterconfig:manage</span> changes it.</div>
    <div class="cc-kv"><span class="k">namespace</span><span class="v mono">${esc(s.namespace || "—")}</span></div>

      : `${n.secret} Secret${n.secret === 1 ? "" : "s"} carry the discovery label · last read <span class="mono">${s.last_discovery ? fmtStamp(s.last_discovery) : "never"}</span>${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}`}</span></div>
    <div class="ns-controls"><a class="btn cc-btn-acc" id="cc-add-jump" href="#cc-add">Add cluster</a></div></section>`;
  const findings = (d.findings || []).map(ccFinding).join("")
    || `<div class="empty-note">No malformed Secrets. A Secret that fails to parse is a finding with the code named, never a crashed pod.</div>`;

    + `<section class="card" id="cc-findings"><h2>Findings</h2>${findings}</section>`

async function apiSend(path, method, body) {
  const res = await fetch(path, { method, headers: { Accept: "application/json", "Content-Type": "application/json", "X-GSD-Interaction": "1" },
                                 body: body === undefined ? undefined : JSON.stringify(body) });
  if (res.redirected || !(res.headers.get("Content-Type") || "").includes("json")) {
    const err = new Error("the dashboard session has ended"); err.sessionEnded = true; throw err;
  }
  const payload = await res.json();
  if (!res.ok) {
    const err = new Error(payload && payload.detail ? String(payload.detail) : `${res.status} ${res.statusText}`);
    err.status = res.status; throw err;
  }
  return payload;
}
function ccReadForm() {
  const f = view.clusterForm;
  const read = (id, key) => { const el = $(id); if (el) f[key] = el.value; };
  read("cc-name", "name"); read("cc-server", "server"); read("cc-token", "token"); read("cc-ca-pem", "caPem");
  read("cc-visibility", "visibility"); read("cc-identity", "identity"); read("cc-label-key", "labelKey"); read("cc-label-val", "labelVal");
  const mode = document.querySelector('input[name="cc-ca-mode"]:checked');
  if (mode) f.caMode = mode.value;
}
function ccBody() {
  const f = view.clusterForm;
  const tls = { mode: f.caMode };
  if (f.caMode === "caData") tls.caData = btoa(unescape(encodeURIComponent(f.caPem || "")));
  return { name: f.name.trim(), server: f.server.trim(), credential: { kind: "bearerToken", token: f.token },
           tls, visibility: f.visibility, identity: f.identity, labels: { ...f.labels } };
}
function wireClusterConfig() {
  const d = data.clusterconfigs;
  if (!d || d.forbidden) return;
  // The form's inputs write into view.clusterForm on every keystroke and the YAML pane follows in place —
  // no render(): the page repaints on the poll from that state, so nothing typed is lost.
  ["cc-name", "cc-server", "cc-token", "cc-ca-pem", "cc-visibility", "cc-identity", "cc-label-key", "cc-label-val"].forEach((id) => {
    const el = $(id); if (!el) return;

    el.oninput = sync; el.onchange = sync;

  document.querySelectorAll('input[name="cc-ca-mode"]').forEach((el) => {
    el.onchange = () => { ccReadForm(); render(); };
  });

  if (addLabel) addLabel.onclick = () => {
    ccReadForm();
    const k = (view.clusterForm.labelKey || "").trim(), v = (view.clusterForm.labelVal || "").trim();
    if (!k) return;

    render();
  };
  document.querySelectorAll("[data-cc-drop-label]").forEach((el) => {
    el.onclick = () => { delete view.clusterForm.labels[el.dataset.ccDropLabel]; render(); };
  });
  const copy = $("cc-yaml-copy");
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(ccYaml(d)); view.clusterMsg.copy = "Copied"; }
    catch (e) { view.clusterMsg.copy = "Copy failed"; }

  const test = $("cc-test");
  if (test) test.onclick = async () => {
    ccReadForm();
    view.clusterForm.test = { pending: true }; view.clusterMsg.form = ""; render();
    try { view.clusterForm.test = await apiSend("/api/clusterconfigs/test", "POST", ccBody()); }
    catch (e) { view.clusterForm.test = null; view.clusterMsg.form = e.message; }
    render();
  };
  const create = $("cc-create");
  if (create) create.onclick = async () => {
    ccReadForm();
    const f = view.clusterForm;
    if (!f.name.trim() || !f.server.trim() || !f.token) { view.clusterMsg.form = "name, server and a bearer token are required."; render(); return; }
    // ONE request in flight: a second click while the first POST is out would answer `secret-exists`
    // and overwrite the "created" sentence with a failure for a Secret that was just written (round 2, Grok C16).
    if (view.clusterCreating) return;
    view.clusterCreating = true;
    view.clusterMsg.form = "Creating…"; render();
    try {
      const r = await apiSend("/api/clusterconfigs", "POST", ccBody());

      view.clusterForm = ccEmptyForm();

  document.querySelectorAll("[data-cc-rotate]").forEach((el) => {

  });

    el.onclick = async () => {
      const id = el.dataset.ccRotateGo;
      const field = $(`cc-rotate-token-${id}`);
      const token = field ? field.value : "";
      if (!token) { view.clusterMsg[`rotate:${id}`] = "a bearer token is required."; render(); return; }
      try {
        await apiSend(`/api/clusterconfigs/${encodeURIComponent(id)}/credential`, "PUT", { token });
        view.clusterMsg[`rotate:${id}`] = "token overwritten in place — the old token is gone from the cluster on the write. The value is never shown.";
      } catch (e) { view.clusterMsg[`rotate:${id}`] = e.message; }
      if (field) field.value = "";

    el.onclick = async () => {
      const id = el.dataset.ccDelete;
      if (view.clusterDeleteArmed !== id) { view.clusterDeleteArmed = id; render(); return; }
      view.clusterDeleteArmed = null;

        view.clusterMsg[`delete:${id}`] = `Secret ${r.secret} deleted — the cluster retires ${r.retired}, its history kept.`;
      } catch (e) { view.clusterMsg[`delete:${id}`] = e.message; }
      render(); refresh();
    };
  });
}

function nsAuditPage() {
  const ub = data.userBindings;
  if (!ub) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  // Both narrowed shapes are the SERVER's call, read off the wire: a scoped payload
  // renders the viewer's own grants, a designed 403 a named refusal. The page never
  // decides which applies.
  if (ub.forbidden) return refusalCard("Namespace audit",
    `The per-namespace worklist of direct user grants names people and their access.`);
  if (ub.scope === "self") return selfGrantsView(ub) + namespacesCard();
  return directUserGrants(ub) + namespacesCard();
}

/* Risk tier for one namespace's worst grant. Ranked on PRIVILEGE and SCOPE, never on
   count: one forgotten cluster-admin outranks twenty view grants, and a page sorted by
   volume puts the twenty first and buries the one. */
function riskTier(row) {
  const p = row.worst_privilege || 1;
  const clusterWide = !!row.cluster_scoped;
  if (clusterWide && p >= 3) return { key: "critical", label: "Critical", rank: 4 };
  if (p >= 4) return { key: "critical", label: "Critical", rank: 4 };
  if (p >= 3 || clusterWide) return { key: "high", label: "High", rank: 3 };
  if (p >= 2) return { key: "medium", label: "Medium", rank: 2 };
  return { key: "low", label: "Low", rank: 1 };
}

/* The exposed-user list for one namespace, bounded.
   A namespace with forty direct grants would otherwise put forty names in one cell and the
   column would decide the width of the whole table — on the view that is supposed to be the
   scannable one. Show the first few, then an honest count and a way to see the rest.

   WHO_PREVIEW is small on purpose. The question this table answers is "which namespaces are
   exposed and how badly"; the names are corroboration, and the full roster lives one section
   down in Every grant. */
const WHO_PREVIEW = 4;

function whoCell(row) {
  const users = row.users || [];
  if (!users.length) return '<span class="muted">—</span>';
  const open = view.nsWhoOpen.has(row.namespace);
  const shown = open ? users : users.slice(0, WHO_PREVIEW);
  const hidden = users.length - shown.length;
  const names = shown.map((u) => `<span class="who-name">${esc(u)}</span>`).join("");
  if (!hidden && !open) return names;
  return names + `<button type="button" class="linkish who-more" data-who="${esc(row.namespace)}">`
    + (open ? "show fewer" : `+${hidden} more`) + "</button>";
}

const PRIVILEGE_NAME = { 4: "cluster-admin", 3: "admin", 2: "edit", 1: "view" };
const PRIVILEGE_RANK = { "cluster-admin": 4, admin: 3, edit: 2, view: 1 };

/* The flat grant list's sort, at module scope so the table and its export share it. */
const GRANT_SORT = {
  person: (b) => b.user_name,
  // Sort the ROLE by privilege, not alphabetically: "admin" < "edit" < "view" as text
  // puts the dangerous grants in the middle, which is the opposite of useful.
  risk: (b) => (PRIVILEGE_RANK[b.role_name] || 0) * 10 + (b.binding_namespace ? 0 : 1),
  scope: (b) => b.binding_namespace || "",
  binding: (b) => b.binding_name,
};
function grantsSorted(ub) {
  return sortBy(ub.bindings || [], GRANT_SORT[view.nsGrantSort] || GRANT_SORT.risk, view.nsGrantDir);
}

/* How many grants the detail list asks for. Not a display cap — the server applies it, so
   the rows never cross the wire. 200 is well past what anyone reads in one sitting and
   still small enough to render instantly; the server orders worst-first before limiting,
   so a truncated page is the top of the list rather than a slice of the middle. */
const NS_GRANT_PAGE = 200;

/* Same idea for the binding tiers. Unbounded until now: measured at 2,280 rows / 545,800
   bytes on a cluster ten times the reference size, re-fetched every 30 seconds by the
   auto-refresh. The response's `counts` are computed server-side over the whole cluster, so
   the tier totals the page displays stay correct while only the rows are a page. */
const FINDINGS_PAGE = 500;

/* Sort a copy, never the array the renderer was handed — sorting in place would reorder
   `data.userBindings` itself, so the store's risk ranking would be lost after the first
   click and could never be restored without a refetch. */
function sortBy(rows, keyFn, dir) {
  const sign = dir === "asc" ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = keyFn(a), y = keyFn(b);
    if (x === y) return 0;
    // Numbers compare numerically, strings alphabetically. Comparing "10" < "9" as strings
    // is the classic way a count column sorts wrongly and nobody notices.
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sign;
  });
}

/* A sortable column header.
   A <button> inside the <th>, not a click handler on the <th> itself: a bare th is not
   focusable and not announced as actionable, so header sorting becomes mouse-only. The
   arrow is text rather than a glyph so it survives forced-colors, and aria-sort tells a
   screen reader which column is ordering the table and in which direction. */
/* ── Export: what was served, and nothing more (docs/DESIGN_export.md) ────────────────────
   The file is built HERE, from `data` — the rows the server served THIS reader at THEIR tier —
   after the page's own filter and sort, read through the same selection functions the tables
   paint from. It makes no request: a server-side export would have to re-implement six
   handlers' scoping and six pages' filters, and could export a set the reader never saw.
   Columns are an explicit projection per tab: the cells the table paints plus the classification
   inputs the page renders as labels rather than cells (managed_source and exception behind the
   finding label, is_platform behind the platform toggle); no other payload field is written. */
const EXPORT_COLUMNS = {
  users: ["user_name", "full_name", "logged_in", "first_login_at", "first_login_source", "providers", "group_count",
          "last_login_at", "first_seen_at"],
  groups: ["name", "member_count", "sync_provider", "group_synced_at", "ldap_uid"],
  bindings: ["finding", "group_name", "member_count", "logged_in_count", "role_kind", "role_name",
             "binding_kind", "binding_namespace", "binding_name", "managed_source", "exception"],
  myaccess: ["via_group", "role_kind", "role_name", "binding_kind", "binding_namespace", "binding_name"],
  nsaudit: ["user_name", "role_kind", "role_name", "binding_kind", "binding_namespace", "binding_name",
            "is_platform"],
  logins: ["at", "user_name", "full_name", "outcome", "provider", "ldap_result_code", "detail",
           "pod_name", "known_user", "has_history", "in_access_group", "refusal_reason", "break_glass"],
};

function exportEnabled() {
  const v = data.version;
  return !!(v && v.features && v.features.export === true);
}

/* The table the current page holds, or null when the page has no exportable table (a drill-down,
   a refusal, a Loading state). `served` is how many rows the server sent; `total` the whole set
   it described (R3), or null when the endpoint does not page. rows < total is what "partial"
   means, and the note, the filename and the JSON all say it. */
function exportDescriptor() {
  if (!view.cluster) return null;
  const num = (x) => (typeof x === "number" ? x : null);
  if (view.page === "users" && !view.user) {
    const d = data.users;
    if (!d || d.forbidden) return null;
    return { tab: "users", columns: EXPORT_COLUMNS.users, rows: usersMatched(d).matched,
             served: (d.users || []).length, total: num(d.total), scope: d.scope || null,
             viewer: d.viewer || null,
             filter: { search: view.userSearch || "", chip: view.userFilter || "all" },
             sort: { key: "user_name", dir: "asc" } };
  }
  if (view.page === "groups" && !view.group && !view.user) {
    if (!data.groups) return null;
    const meta = data.groupsMeta || {};
    const { all, rows } = groupsMatched();
    return { tab: "groups", columns: EXPORT_COLUMNS.groups, rows, served: all.length, total: null,
             scope: meta.scope || null, viewer: meta.viewer || null,
             filter: { search: view.groupSearch || "", state: view.groupFilter },
             sort: { key: "name", dir: "asc" } };
  }
  if (view.page === "bindings") {
    // The same fail-closed as bindingsPage: an unknown tier (whoami failed this cycle) paints
    // Loading and must not offer the previous cycle's findings as a download either — the
    // follow-up that nulls data.findings only runs when a NEW whoami is narrowed (review, C1).
    if (!readerTierKnown()) return null;
    if (narrowedReader()) {
      const m = data.myAccess;
      if (!m) return null;
      // The rows come in the server's order (binding kind, namespace, name) and the page does
      // not re-sort them, so the envelope says that rather than claiming a name sort.
      return { tab: "access-granted", columns: EXPORT_COLUMNS.myaccess, rows: m.bindings || [],
               served: (m.bindings || []).length, total: null, scope: "self", viewer: m.viewer || null,
               filter: {}, sort: { key: "binding_kind,binding_namespace,binding_name", dir: "asc" } };
    }
    const raw = data.findings;
    if (!raw || raw.forbidden) return null;
    const { f, visible } = bindingsVisible(raw);
    return { tab: "access-granted", columns: EXPORT_COLUMNS.bindings,
             rows: visible.flatMap((t) => sortedBindings(f[t])),
             served: BINDING_TIERS.reduce((n, t) => n + (raw[t] || []).length, 0),
             total: num(raw.total), scope: raw.scope || "all", viewer: raw.viewer || null,
             filter: { search: view.bindingSearch || "", show: view.bindingFilter },
             // Section then column, as the page lays it out: naming only the column sort would
             // claim a global order the concatenated rows do not have (review, C1 pass 2).
             sort: { key: "finding," + view.bindingSort, dir: view.bindingDir } };
  }
  // The namespace page holds no table this descriptor owns: offering the audit's direct-grants export
  // there exported rows the reader was not looking at (review of #167, Grok F5).
  if (view.page === "nsaudit" && view.ns) return null;
  if (view.page === "nsaudit") {
    const ub = data.userBindings;
    if (!ub || ub.forbidden) return null;
    // A narrowed reader's rows are painted as the store serves them (cluster-admin first,
    // cluster-scoped first, then namespace and user); only the wide view re-sorts client-side,
    // so the envelope names the order that actually applied (review, C1).
    const self = ub.scope === "self";
    return { tab: "namespace-audit", columns: EXPORT_COLUMNS.nsaudit,
             rows: self ? (ub.bindings || []) : grantsSorted(ub),
             served: (ub.bindings || []).length, total: num(ub.total), scope: ub.scope || null,
             viewer: ub.viewer || null, filter: { namespace: view.nsNamespace },
             sort: self ? { key: "cluster_admin_first,cluster_scope_first,binding_namespace,user_name", dir: "asc" }
                        : { key: view.nsGrantSort, dir: view.nsGrantDir } };
  }
  if (view.page === "logins") {
    const d = data.logins;
    if (!d || !d.enabled) return null;
    const rows = d.attempts || [];
    return { tab: "logins", columns: EXPORT_COLUMNS.logins, rows, served: rows.length,
             total: num(d.total), scope: d.scope || null, viewer: d.viewer || null,
             filter: { outcome: view.loginOutcome }, sort: { key: "at", dir: "desc" } };
  }
  return null;
}

function exportIsPartial(desc) {
  return desc.total !== null && desc.served < desc.total;
}

/* RFC 4180: a field is quoted when it holds a quote, a comma or a line break, quotes are
   doubled, records end in CRLF. Arrays (providers) join with "; " — a semicolon can never be
   the delimiter of this file, so it is unambiguous. A string that a spreadsheet would EVALUATE
   (leading = + - @ tab CR) is prefixed with an apostrophe so it stays text: directory-supplied
   names are hostile input for HTML on this page (esc) and they are the same input here. Numbers
   and booleans are never touched. */
const CSV_BOM = "\ufeff";
function csvField(value) {
  if (value === null || value === undefined) return "";
  if (Array.isArray(value)) value = value.join("; ");
  if (typeof value === "boolean") return value ? "true" : "false";
  if (typeof value === "number") return String(value);
  let s = String(value);
  // Tested after any leading whitespace: an importer that trims before it decides would treat
  // " =cmd" like "=cmd". The initiators are OWASP's — = + - @, tab, CR, LF — plus their
  // full-width forms (U+FF1D, U+FF0B, U+FF0D, U+FF20), which some locales' spreadsheets
  // evaluate too (review, C1). The cell keeps its original text; this only decides the prefix.
  if (/^[\t\r\n ]*[=+\-@\t\r\n\uFF1D\uFF0B\uFF0D\uFF20]/u.test(s)) s = "'" + s;
  if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
/* The BOM is deliberate for CSV and absent from JSON (RFC 8259 §8.1): a spreadsheet opened from
   a double-click reads BOM-less UTF-8 as the local code page and mangles a non-ASCII display
   name, while every programmatic reader accepts utf-8-sig. */
function toCsv(columns, rows) {
  const lines = [columns.map(csvField).join(",")];
  for (const r of rows) lines.push(columns.map((c) => csvField(r[c])).join(","));
  return CSV_BOM + lines.join("\r\n") + "\r\n";
}

/* gsd_<cluster>_<tab>[_self][_partial]_<UTC stamp>.<ext>. The cluster id is URL-safe already
   (config.py refuses a slash) and is reduced to a filename-safe alphabet here anyway. It is also
   bounded: config.py accepts a long cluster id, filesystems cap a name at 255 bytes, so a part
   longer than 120 characters is cut and given an FNV-1a suffix of the original, which keeps two
   ids that share a prefix distinct (review of C1, second pass). */
function safeFilenamePart(value, maxLength = 120) {
  const raw = String(value || "");
  const safe = raw.replace(/[^A-Za-z0-9._-]+/g, "_");
  if (safe.length <= maxLength) return safe;
  let hash = 0x811c9dc5;
  for (let i = 0; i < raw.length; i += 1) {
    hash ^= raw.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193) >>> 0;
  }
  const suffix = hash.toString(16).padStart(8, "0");
  return `${safe.slice(0, maxLength - suffix.length - 1)}_${suffix}`;
}
function exportFilename(desc, ext) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
  return `gsd_${safeFilenamePart(view.cluster)}_${safeFilenamePart(desc.tab, 48)}${desc.scope === "self" ? "_self" : ""}`
    + `${exportIsPartial(desc) ? "_partial" : ""}_${stamp}.${ext}`;
}

/* A Blob and an <a download>: no server round trip, no new window. Revoking the object URL on
   the click's own turn cancels the download in Firefox, and a timer can fire while a save dialog
   is still open, so the URL lives until the next export replaces it. */
function downloadBlob(text, filename, type) {
  // The previous export's URL is released here, not on a timer: a browser set to ask where to
  // save can keep its dialog open past any timer, and revoking then loses the file. One object
  // URL per page lifetime is the cost; unload releases the last one (review, C1).
  if (downloadBlob.previous) URL.revokeObjectURL(downloadBlob.previous);
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  downloadBlob.previous = url;
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function runExport(format) {
  const desc = exportDescriptor();
  if (!desc) return;
  const partial = exportIsPartial(desc);
  // A projection into NEW objects: exactly the declared columns, absent keys as null.
  const rows = desc.rows.map((r) => Object.fromEntries(
    desc.columns.map((c) => [c, r[c] === undefined ? null : r[c]])));
  if (format === "csv") {
    downloadBlob(toCsv(desc.columns, rows), exportFilename(desc, "csv"), "text/csv;charset=utf-8");
    return;
  }
  const v = data.version || {};
  const doc = {
    exported_at: new Date().toISOString(),
    dashboard: { version: v.version || null, commit: v.commit || null },
    cluster: view.cluster,
    tab: desc.tab,
    scope: desc.scope,
    viewer: desc.viewer,
    filter: desc.filter,
    sort: desc.sort,
    count: rows.length,
    served: desc.served,
    total: desc.total,
    truncated: partial,
    note: partial
      ? `partial: the page held ${desc.served} of ${desc.total} rows the server described; `
        + `rows past the page were never loaded and are not here`
      : "every row the server served for this view, after the page's own filter and sort",
    columns: desc.columns,
    rows,
  };
  downloadBlob(JSON.stringify(doc, null, 2), exportFilename(desc, "json"), "application/json");
}

/* The filter-bar control. Rendered by renderFilters when the module is on and the page holds an
   exportable table; the note states the row count and wears the truncation edge when the page
   is partial, so "partial" is read before the download rather than discovered after it. */
function exportControlHtml() {
  if (!exportEnabled()) return "";
  const desc = exportDescriptor();
  if (!desc) return "";
  const partial = exportIsPartial(desc);
  const n = desc.rows.length;
  const help = "Downloads exactly the rows this page holds, after the filter and sort — never more than the server served you.";
  return `<span class="export" role="group" aria-label="Export this table">
      <span class="export-label" id="export-label">Export</span>
      <button type="button" id="export-csv" title="${esc(help)}" aria-describedby="export-note">CSV</button>
      <button type="button" id="export-json" title="${esc(help)}" aria-describedby="export-note">JSON</button>
      <span id="export-note" class="export-note${partial ? " partial" : ""}">${partial
        ? `${n} row${n === 1 ? "" : "s"} · partial: ${desc.served} of ${desc.total} loaded`
        : `${n} row${n === 1 ? "" : "s"}`}</span>
    </span>`;
}

function sortableTh(label, key, activeKey, dir, group, extraClass) {
  const active = key === activeKey;
  const next = active && dir === "desc" ? "asc" : "desc";
  const aria = active ? (dir === "asc" ? "ascending" : "descending") : "none";
  const arrow = active ? (dir === "asc" ? " ▲" : " ▼") : "";
  return `<th class="${extraClass || ""}" aria-sort="${aria}">
    <button type="button" class="th-sort${active ? " is-active" : ""}"
            data-sort-group="${group}" data-sort-key="${key}" data-sort-dir="${next}"
            title="Sort by ${esc(label)}">${esc(label)}${arrow}</button>
  </th>`;
}

/* Roles granted directly to a person, ranked by risk. */
function directUserGrants(ub) {
  if (!ub) return "";
  const rows = (ub.by_namespace || []).map((r) => ({ ...r, risk: riskTier(r) }));
  const bindings = ub.bindings || [];
  // `total` is the server's count BEFORE its limit. Falling back to the returned length
  // would make a truncated page claim to be complete, which is the one failure this whole
  // change exists to avoid.
  const total = ub.total != null ? ub.total : bindings.length;
  // Cluster-wide grant count, summed from the rollup because that is the one part of the
  // response neither paged NOR filtered. `ub.total` is the total for the CURRENT filter,
  // which is right for the detail list's own labelling and wrong for a headline KPI.
  const totalAllNamespaces = rows.reduce((n, r) => n + (r.bindings || 0), 0);
  const critical = rows.filter((r) => r.risk.key === "critical");
  const high = rows.filter((r) => r.risk.key === "high");
  // Distinct PEOPLE, unioned from the rollup rather than counted from `bindings`.
  //
  // Two wrong ways to get this number, both of which were briefly in this file. Counting
  // `bindings` is correct only while nothing is paged — once the detail list is truncated
  // or filtered to one namespace it silently reports the page, not the cluster. Summing
  // `distinct_users` across namespaces double-counts anyone with grants in more than one:
  // on the reference cluster jdoe holds grants in three, so the sum says 6 where the truth
  // is 4. The rollup's `users` list is never paged, so the union of it is both complete and
  // distinct.
  const people = new Set(rows.flatMap((r) => r.users || [])).size;

  const NS_SORT = {
    risk: (r) => r.risk.rank * 10 + (r.cluster_scoped ? 1 : 0),
    namespace: (r) => r.namespace,
    priv: (r) => r.worst_privilege || 0,
    people: (r) => r.distinct_users || 0,
    grants: (r) => r.bindings || 0,
  };
  const sorted = sortBy(rows, NS_SORT[view.nsSort] || NS_SORT.risk, view.nsDir);
  const sortedGrants = grantsSorted(ub);

  if (!rows.length) {
    return `<section class="card">
      <h2>Namespace audit</h2>
      <div class="hero"><span class="value mono">0</span>
        <span class="label">namespaces grant access to a person</span></div>
      <div class="filterbar-note">
        Every role on this cluster is granted to a group. That is what makes offboarding
        a single action: removing someone from an LDAP group revokes their access
        everywhere at once.
        ${ub.excluded_platform ? `<br><span class="muted">${ub.excluded_platform} platform
          identit${ub.excluded_platform === 1 ? "y" : "ies"} excluded — system components
          and <code>kubeadmin</code> are break-glass, with nowhere to migrate to.</span>` : ""}
      </div>
    </section>`;
  }

  const worst = rows[0].risk;
  return `<section class="card">
    <h2>Namespace audit</h2>
    <div class="risk-headline">
      <span class="risk-pill risk-${worst.key}">${esc(worst.label)} exposure</span>
      <span class="muted">highest risk on this cluster</span>
    </div>
    <div class="kpis mt-7">
      <div class="kpi big ${critical.length ? "flag-critical" : ""}">
        <div class="label">Namespaces at risk</div>
        <div class="value mono">${rows.length}</div></div>
      <div class="kpi big"><div class="label">People exposed</div>
        <div class="value mono">${people}</div></div>
      <div class="kpi big"><div class="label">Grants to migrate</div>
        <!-- Cluster-wide, never bindings.length. The list below is paged and may be
             filtered to one namespace; a headline count taken from it reports the page
             rather than the cluster, and shrinks when the reader narrows the filter, which
             reads as the problem getting smaller because they looked at it closely. -->
        <div class="value mono">${totalAllNamespaces}</div></div>
      <div class="kpi big ${critical.length ? "flag-critical" : ""}">
        <div class="label">Critical</div>
        <div class="value mono ${critical.length ? "err" : "muted"}">${critical.length}</div></div>
      <div class="kpi big ${high.length ? "flag-warning" : ""}">
        <div class="label">High</div>
        <div class="value mono ${high.length ? "" : "muted"}">${high.length}</div></div>
    </div>
  </section>

  <section class="card">
    <h3>Why this is a risk</h3>
    <div class="risk-grid">
      <div class="risk-item">
        <div class="risk-item-h">Offboarding does not revoke it</div>
        Removing someone from an LDAP group revokes their access everywhere at once. A
        binding that names the <strong>person</strong> keeps granting after they leave the
        team, change role, or leave the company — until somebody remembers it exists.
      </div>
      <div class="risk-item">
        <div class="risk-item-h">Invisible to access review</div>
        Every group-based review — including the rest of this dashboard — answers
        “who is in the group?”. These grants are attached to no group, so a clean review
        can coexist with standing access nobody approved.
      </div>
      <div class="risk-item">
        <div class="risk-item-h">No approval trail</div>
        Group membership is granted in the enterprise directory, with a request and an
        approver. A hand-made binding records only who ran <code>oc</code>, and only for as
        long as the audit log is retained.
      </div>
    </div>
  </section>

  <section class="card">
    <h3>Exposure by namespace</h3>
    <div class="filterbar-note mb-4">
      Ranked by the <strong>worst privilege granted</strong>, not by count — one forgotten
      <code>cluster-admin</code> matters more than twenty <code>view</code> grants.
      ${view.nsSort !== "risk" || view.nsDir !== "desc"
        ? `<button type="button" class="linkish" data-ns-reset>Restore risk order</button>`
        : ""}
    </div>
    <div class="scroll-x"><table class="audit-table">
      <thead><tr>
        ${sortableTh("Risk", "risk", view.nsSort, view.nsDir, "ns")}
        ${sortableTh("Namespace", "namespace", view.nsSort, view.nsDir, "ns")}
        ${sortableTh("Highest privilege", "priv", view.nsSort, view.nsDir, "ns")}
        ${sortableTh("People", "people", view.nsSort, view.nsDir, "ns", "num")}
        ${sortableTh("Grants", "grants", view.nsSort, view.nsDir, "ns", "num")}
        <th>Who is exposed</th>
      </tr></thead>
      <tbody>${sorted.map((r) => `<tr class="risk-row risk-${r.risk.key}">
        <td><span class="risk-pill risk-${r.risk.key}">${esc(r.risk.label)}</span></td>
        <td class="ns-cell">${r.namespace === "(cluster-scoped)"
            ? `<strong class="err">CLUSTER-WIDE</strong>` : `<strong>${esc(r.namespace)}</strong>`}</td>
        <td><code class="priv">${esc(PRIVILEGE_NAME[r.worst_privilege] || "view")}</code></td>
        <td class="num strong">${r.distinct_users}</td>
        <td class="num">${r.bindings}</td>
        <td class="muted who">${whoCell(r)}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    ${ub.excluded_platform ? `<div class="filterbar-note mt-4">
      ${ub.excluded_platform} platform identit${ub.excluded_platform === 1 ? "y" : "ies"}
      excluded — system components and <code>kubeadmin</code> are break-glass and
      cluster-internal, with nowhere to migrate to.</div>` : ""}
  </section>

  <section class="card">
    <h3>How to close it</h3>
    <div class="filterbar-note mb-5">
