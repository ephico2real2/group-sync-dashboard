        <div class="what">${x.silenced ? `<span class="silence-tag">silenced by ${esc(x.silenced_by)}</span> ` : ""}${esc(x.detail)}</div>
      </div>`).join("")
      + alertPager(rows.length, page, pages);
  return `<section class="card">
    <div class="hero">
      <div class="value">${active.length}</div>
      <div class="label">${active.length === 1 ? "alert" : "alerts"} across ${clusterCount} cluster${clusterCount === 1 ? "" : "s"}${
        crit ? ` · ${crit} critical` : ""}${quiet ? ` · ${quiet} silenced` : ""}</div>
    </div>
    ${body}
  </section>`;
}

/* Page numbers, with the neighbours of the current page and the two ends — a fleet's alert list
   grows with the fleet, and an eighty-row card buries the one critical row it exists to surface. */
function alertPager(total, page, pages) {
  if (pages <= 1) return "";
  const win = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - page) <= 2) win.push(i);
    else if (win[win.length - 1] !== "…") win.push("…");
  }
  return `<div class="pager" role="navigation" aria-label="Alert pages">
    <button data-alert-page="${Math.max(1, page - 1)}"${page === 1 ? " disabled" : ""}>‹ Prev</button>
    ${win.map((i) => i === "…" ? `<span class="ellipsis">…</span>`
      : `<button data-alert-page="${i}" aria-pressed="${i === page}">${i}</button>`).join("")}
    <button data-alert-page="${Math.min(pages, page + 1)}"${page === pages ? " disabled" : ""}>Next ›</button>
    <span class="grow"></span>
    <span>showing ${(page - 1) * ALERT_PAGE + 1}–${Math.min(page * ALERT_PAGE, total)} of ${total}</span>
  </div>`;
}

/* A cluster's tile: a card whose whole face opens the cluster, with a real button in the heading
   for the keyboard and the screen reader. The seven figures of the old card are all here at full
   density; the tiers hide, never drop — the scoped view carries every one of them. */
/* A cluster's reachability badge — the one span for a tile, a dense row and the opened cluster, so
   the three cannot disagree. Hand-built, not badge(): `critical` is a severity, not a CR state, and
   badge() maps any word outside STATES to "unknown" (a hollow ring for an auth_failed cluster). */
function reachBadge(c) {
  const degraded = c.status && c.status !== "ok";
  const never = c.status === null;
  const state = never ? "unknown" : (degraded ? "critical" : "ok");
  const stateText = never ? "no data yet" : (degraded ? c.status : "reachable");
  return `<span class="badge ${state}"><span class="glyph" aria-hidden="true"></span>${esc(stateText)}</span>`;
}
/* `detail` renders the same block for the OPENED cluster: a plain <div> with a plain heading — no
   control that opens where the reader already is, and no string surgery on the tile's markup. */
function clusterTile(c, density, detail = false) {
  const degraded = c.status && c.status !== "ok";
  const never = c.status === null;
  const review = (c.dangling_bindings || 0) + (c.unresolved_bindings || 0);
  const rail = degraded ? "bad" : (c.unattributed_groups || review ? "warnrail" : "");
  const tag = detail ? "div" : "section";
  const name = detail ? esc(c.id) : `<button class="linkish tile-open" data-cluster="${esc(c.id)}">${esc(c.id)}</button>`;
  return `<${tag} class="${detail ? "tile-detail" : "card tile"} ${rail}"${detail ? "" : ` data-cluster="${esc(c.id)}"`}>
    <div class="row-wrap cn"><h2>${name}</h2>
      ${reachBadge(c)}
      <span class="grow"></span><span class="poll">${esc(ago(c.last_poll))}</span></div>
    <span class="api"><code>${esc(c.api_url)}</code></span>
    ${degraded ? `<div class="err mt-4 text-sm">${esc(c.error || "")}</div>` : ""}
    ${degraded || never ? `<div class="consq k-consq">${esc(never ? MEANS.cl_never : MEANS.cl_bad)}</div>` : ""}
    ${tileFigures(c, density)}
  </${tag}>`;
}
function tileFigures(c, density) {
  const review = (c.dangling_bindings || 0) + (c.unresolved_bindings || 0);
  // `extra`: the three figures the tiers past full hide (the mock's tiers, kept on the operator's
  // ruling — the scoped view carries every figure).
  const k = (lab, val, cls, extra) =>
    `<span class="${extra ? "k-extra" : ""}"><span class="lab">${lab}</span><span class="v ${cls || ""}">${val}</span></span>`;
  return `<div class="tk">
    ${k("Groups", c.group_count)}
    ${k("Bindings to review", review || "0", review ? "c" : "q")}
    ${k("Unattributed", c.unattributed_groups || "0", c.unattributed_groups ? "w" : "q")}
    ${density === "full" || density === "medium" ? k("Oldest last sync", esc(ago(c.oldest_last_sync)), "sm") : ""}
    ${k("GroupSync CRs", c.groupsync_operator_present === false
      ? `<span class="err text-md">operator not installed</span>` : c.groupsync_count, "", true)}
    ${k("Empty", c.empty_groups || "0", c.empty_groups ? "w" : "q", true)}
    ${c.operator_configs ? k("Policy configs", `${c.operator_configs.total}${c.operator_configs.failing
      ? ` <span class="err text-md">(${c.operator_configs.failing} failing)</span>` : ""}`, "", true) : ""}
  </div>`;
}
function denseRow(c) {
  const review = (c.dangling_bindings || 0) + (c.unresolved_bindings || 0);
  return `<tr class="rowlink" data-cluster="${esc(c.id)}">
    <td>${reachBadge(c)}</td>
    <td class="mono"><button class="linkish tile-open" data-cluster="${esc(c.id)}">${esc(c.id)}</button></td>
    <td class="num">${c.group_count}</td>
    <td class="num ${review ? "err" : "muted"}">${review}</td>
    <td class="num ${c.unattributed_groups ? "warn" : "muted"}">${c.unattributed_groups || 0}</td>
    <td class="mono">${esc(ago(c.oldest_last_sync))}</td>
    <td class="mono">${esc(ago(c.last_poll))}</td></tr>`;
}
function clustersCard(cs, density) {
  // Worst-first once the eye cannot take them all in at once; below that, stable order — a tile
  // that moves between refreshes is harder to find than one that is simply further down.
  const rank = (c) => (c.status !== "ok" ? 0 : 1) * 10 - (((c.dangling_bindings || 0) + (c.unresolved_bindings || 0)) ? 1 : 0);
  const rows = density === "full" ? cs : cs.slice().sort((a, b) => rank(a) - rank(b));
  const bad = cs.filter((c) => c.status !== "ok").length;
  if (density === "dense") {
    return `<section class="card">
      <div class="row-wrap"><h2>Clusters</h2><span class="muted text-sm">· ${cs.length}${bad ? ` · ${bad} not reachable` : " · all reachable"}</span></div>
      <div class="scroll-x"><table>
        <thead><tr><th>Status</th><th>Cluster</th><th class="num">Groups</th><th class="num">Bindings to review</th>
          <th class="num">Unattributed</th><th>Oldest last sync</th><th>Polled</th></tr></thead>
        <tbody>${rows.map(denseRow).join("")}</tbody></table></div>
    </section>`;
  }
  return `<div class="tiles">${rows.map((c) => clusterTile(c, density)).join("")}</div>`;
}

/* The GroupSync table the contract keeps — NAME · STATE · SCHEDULE · GROUPS · LAST SYNC · NEXT
   EXPECTED — with a cluster column across the fleet and the consequence under any state but ok.
   `state`, `next_expected` and `error_is_current` are computed per request, never stored. */
function groupsyncTable(rows, scope, unfetched = []) {
  // null (not fetched for this cluster yet) and [] (fetched, none exist) are different
  // answers: claiming "None observed" while the fetch is still out is false.
  if (!rows) return `<section class="card"><h2>GroupSync CRs</h2>
    <div class="empty-note">Loading…</div></section>`;
  const fleet = !scope;
  const bad = rows.filter((r) => r.state !== "ok").length;
  // The heading keeps its exact words (the contract, and the tests read it); the count sits beside it.
  const head = `<div class="row-wrap"><h2>GroupSync CRs</h2><span class="muted text-sm">· ${rows.length}${fleet ? "" : ` on ${esc(scope)}`}${
    rows.length ? (bad ? ` · ${bad} not syncing` : " · all syncing") : ""}</span></div>`;
  // Across the fleet a cluster whose /groupsyncs request FAILED is named, not folded into the
  // count: "all syncing" over rows that silently lack a cluster is the false absence this
  // card's Loading guard exists to prevent, one level up.
  const missing = unfetched.length ? `<div class="filterbar-note mt-4">${esc(unfetched.join(", "))}: CRs not fetched — the
    request failed, so ${unfetched.length === 1 ? "its" : "their"} CRs are not in this count.</div>` : "";
  if (!rows.length) return `<section class="card">${head}
    <div class="empty-note">None observed ${fleet ? "on any cluster" : "on this cluster"} yet.</div>${missing}</section>`;
  const rank = (r) => (r.error_is_current ? 0 : r.state === "overdue" ? 1 : r.state === "late" ? 2 : r.state === "unknown" ? 3 : 4);
  const sorted = rows.slice().sort((a, b) => rank(a) - rank(b));
  return `<section class="card">
    ${head}
    <div class="filterbar-note mb-3">These CRs own the groups, so their state is the estate's state. <strong>ok</strong>
      means syncing on schedule — the groups it owns are current as of the last sync. Four states, and the glyph shape
      carries each one independently of colour.</div>
    <div class="scroll-x"><table>
      <thead><tr>
        ${fleet ? "<th>Cluster</th>" : ""}<th>Name</th><th>State</th><th>Schedule</th>
        <th class="num">Groups</th><th>Last sync</th><th>Next expected</th>
      </tr></thead>
      <tbody>${sorted.map((r) => {
        const attn = r.state !== "ok" || r.error_is_current;
        return `<tr class="rowlink${attn ? " attn" : ""}" data-cr="${esc(r.name)}" data-cluster="${esc(r.cluster || scope || "")}">
          ${fleet ? `<td class="mono">${esc(r.cluster)}</td>` : ""}
          <td>${esc(r.name)}<div class="muted text-xs">${esc(r.namespace)}</div></td>
          <td class="state-cell">${badge(r.state)}${r.error_is_current ? " " + sevBadge("critical", "reconcile error") : ""}${
            r.state !== "ok" ? `<div class="consq">${esc(syncMeans(r))}</div>` : ""}</td>
          <td><code>${esc(r.schedule || "—")}</code>${r.schedule_valid ? "" : ` <span class="err">invalid</span>`}</td>
          <td class="num">${r.group_count}</td>
          <td class="mono${attn ? " err" : ""}">${esc(ago(r.last_sync_at))}</td>
          <td class="mono">${esc(r.next_expected ? fmtTime(r.next_expected) : "—")}</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>${missing}
  </section>`;
}

/* The policy-operator card the contract keeps — KIND · NAME · STATE · LAST SUCCESS and its
   sentence — as one table across the fleet or one cluster. "Failing" is an ordering, not a flag:
   the operator never clears ReconcileError, so only error_at > success_at decides. Administrator
   tier: a narrowed reader's payload is null (guard403) and the card is simply absent. */
function configsCard(entries, { plain = false } = {}) {
  const present = entries.filter((e) => e.oc && e.oc.present);
  if (!present.length) return "";
  const fleet = entries.length > 1;
  // "Absent" is a cluster's own report and needs a successful poll behind it: the store's `present`
  // is two-valued (bool(...)), so a cluster that was never polled, or whose last poll failed, comes
  // back present:false too — and "prod-east reports these CRDs absent" would be false of an
  // auth_failed cluster that reported nothing. The caller passes what it knows of the poll.
  const absent = entries.filter((e) => e.oc && e.oc.present === false && e.polled !== false).map((e) => e.cluster);
  const rows = [];
  present.forEach((e) => (e.oc.configs || []).forEach((c) => rows.push({ ...c, cluster: e.cluster })));
  const isBad = (c) => c.error_at && (!c.success_at || c.error_at > c.success_at);
  const failing = rows.filter(isBad);
  // `plain` is the RBAC policy tab: the pre-#172 card plus the consequence line — its order, heading
  // and rows otherwise unchanged (Codex, review of #172: the shared card had moved a failing row first
  // and added the count, the attention wash and the state cell there too). The Overview's two forms
  // keep them; their count sits beside the heading, as the GroupSync card's does, not inside it.
  if (!plain) rows.sort((a, b) => (isBad(b) ? 1 : 0) - (isBad(a) ? 1 : 0));
  const suffix = plain ? "" : `<span class="muted text-sm">${fleet ? "" : `· ${esc(present[0].cluster)} `}${
    rows.length ? `· ${rows.length}${failing.length ? ` · ${failing.length} failing` : " · all reconciling"}` : ""}</span>`;
  // The plain card's heading is the old markup exactly — a direct child of the card (Grok, pass 2).
  const head = suffix ? `<div class="row-wrap"><h3>Policy operator (NamespaceConfig / GroupConfig)</h3>${suffix}</div>`
    : `<h3>Policy operator (NamespaceConfig / GroupConfig)</h3>`;
  return `<section class="card">
    ${head}
    <div class="filterbar-note mb-3">
      These CRs template the RoleBindings above. A currently-failing one means RBAC has
      quietly stopped reconciling — new namespaces receive nothing and drift stops being
      corrected, with no error anywhere else.
    </div>
    ${rows.length === 0
      ? `<div class="empty-note">Operator installed; no NamespaceConfig or GroupConfig CRs yet.</div>`
      : `<div class="scroll-x"><table>
          <thead><tr>${fleet ? "<th>Cluster</th>" : ""}<th>Kind</th><th>Name</th><th>State</th><th>Last success</th></tr></thead>
          <tbody>${rows.map((c) => {
            const bad = isBad(c);
            return `<tr${bad && !plain ? ' class="attn"' : ""}>
              ${fleet ? `<td class="mono">${esc(c.cluster)}</td>` : ""}
              <td>${esc(c.kind)}</td>
              <td><code>${esc(c.name)}</code></td>
              <td${plain ? "" : ' class="state-cell"'}>${bad ? sevBadge("critical", "reconcile error") : badge("ok")}${
                bad ? `<div class="consq">${esc(MEANS.cfg_failing)}</div>` : ""}</td>
              <td class="mono">${esc(ago(c.success_at))}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>
        ${failing.length ? `<div class="err mt-4 text-sm">${esc(failing[0].error_message || "")}</div>` : ""}`}
    ${absent.length ? `<div class="filterbar-note mt-4">${esc(absent.join(", "))} report${absent.length === 1 ? "s" : ""} these CRDs absent —
      nothing templates ${absent.length === 1 ? "that cluster's" : "their"} RoleBindings, which is a different truth from installed with zero CRs.</div>` : ""}
  </section>`;
}

/* One cluster, opened from its tile or the selector: its figures in full, its alerts only, its
   GroupSync CRs and its policy configs — every card of the fleet view, scoped. The tile renders
   as a plain block here: the reader is already on the cluster. */
function clusterDetail(c) {
  const mine = data.alerts.filter((a) => a.cluster === c.id);
  return `<section class="card">
    <button class="back" id="back">${backLabel()}</button>
    ${clusterTile(c, "full", true)}
  </section>
  ${alertsCard(mine, 1)}
  ${groupsyncTable(data.groupsyncs, c.id)}
  ${configsCard([{ cluster: c.id, oc: data.operatorConfigs }])}`;
}

/* ── The KPI page (#157), built to docs/design/overview-kpi-mock.html ─────────────────────────
   Every number comes from /api/kpi (#156), /api/clusters (the rows' status) and /api/version
   (the leader): the page adds no query of its own — it SUMS the per-cluster figures the payload
   carries and formats them. Nothing here is derived from a capped page, and no tile invents a
   threshold — the amber marks come from the payload (`thresholds`, chart values kpi.thresholds.*)
   and each meter's rule line names the one it applied. */

const KPI_MI = 1024 * 1024;

function kpiBytes(n) {
  if (n == null) return "—";
  // One decimal below ten units, none above, and never a trailing ".0": a 512Mi limit reads
  // "512Mi" (measured on CRC: "512.0Mi" was the first render), a 3.8Mi database "3.8Mi".
  const unit = (v, suffix) => `${(v >= 10 ? v.toFixed(0) : v.toFixed(1)).replace(/\.0$/, "")}${suffix}`;
  if (n >= 1024 * KPI_MI) return unit(n / (1024 * KPI_MI), "Gi");
  if (n >= KPI_MI) return unit(n / KPI_MI, "Mi");
  return `${Math.round(n / 1024)}Ki`;
}

function kpiPct(n, digits = 1) {
  return n == null ? "—" : `${n.toFixed(digits)}%`;
}

function kpiNum(n) {
  return n == null ? "—" : Number(n).toLocaleString("en-US");
}

/* The Throttled track's full scale, as a multiple of its threshold: the mock draws the 1 % mark at
   20 % of the track (docs/design/overview-kpi-mock.html, `--th:20%`, 1.10 % as a 22 % fill). On a
   0–100 % track the 1 % mark sat 3 px from the left edge and the mock's 1.10 % (watch) and 0.05 %
   (healthy) filled within half a pixel of each other (OB3 measured it at 1280 px, review of #157) —
   position read nothing. */
const KPI_THROTTLE_SCALE = 5;

/* One meter: label, the track with the amber mark at the threshold, the fill, the value. `over` is the
   component's decision — kpiComponent compares each meter ONCE and passes the result here — so the
   fill's colour, the pill and the rule line come from a single comparison. `scale` is the track's full
   width as a percentage: 100 for memory, CPU and disk; the threshold × KPI_THROTTLE_SCALE for
   throttling. The mark and the fill are both drawn against it. `pct` null renders an unmeasured track. */
function kpiMeter(label, pct, thresholdPct, over, valueHtml, scale = 100) {
  const mark = thresholdPct == null ? 101 : +((thresholdPct / scale) * 100).toFixed(4);
  const width = pct == null ? 0 : +Math.max(0, Math.min(100, (pct / scale) * 100)).toFixed(4);
  return `<div class="meter-row">
    <span class="meter-lab">${esc(label)}</span>
    <span class="track" data-th="${mark}" data-scale="${scale}" role="img"
          aria-label="${esc(label)}: ${pct == null ? "unavailable" : kpiPct(pct)} of the limit${thresholdPct == null ? "" : `, amber above ${thresholdPct}%`}${scale === 100 ? "" : ` on a track to ${scale}%`}">
      <span class="fill${over ? " warn" : ""}${pct == null ? " none" : ""}" data-width="${width}"></span>
    </span>
    <span class="meter-val">${valueHtml}</span>
  </div>`;
}

/* A component's card in the system strip. `ownLine` renders the mock's second sub-line — the
   component's own bytes beside the filesystem it lives on. The state the badge shows is also
   stamped as data-state on the card, so a test can read it without parsing the badge. */
function kpiComponent(name, sys, th, ownLine) {
  if (!sys) {
    return `<div class="comp" data-comp="${esc(name)}" data-state="unknown"><div class="comp-top"><span class="comp-name">${esc(name)}</span>
      <span class="badge unknown"><span class="glyph" aria-hidden="true"></span>unavailable</span></div>
      <div class="empty-note">No self-report yet${name === "report" ? " — arrives with the next usage pull, or the report service predates it" : ""}.</div></div>`;
  }
  const mem = sys.memory || {}, cpu = sys.cpu || {}, disk = sys.disk || {};
  const memPct = mem.limit_bytes ? (mem.used_bytes / mem.limit_bytes) * 100 : null;
  const cpuPct = cpu.limit_cores && cpu.cores_used != null ? (cpu.cores_used / cpu.limit_cores) * 100 : null;
  const thrPct = cpu.throttled_fraction == null ? null : cpu.throttled_fraction * 100;
  const diskPct = disk.total_bytes ? (disk.used_bytes / disk.total_bytes) * 100 : null;
  // THE ONE DECISION PER METER: an unmeasured value or an absent threshold is never over. The
  // fill, the pill and the rule line below all read these four booleans and nothing else.
  const over = (pct, limit) => pct != null && limit != null && pct > limit;
  const memOver = over(memPct, th.memory_percent), cpuOver = over(cpuPct, th.cpu_percent);
  const thrOver = over(thrPct, th.throttled_percent), diskOver = over(diskPct, th.disk_percent);
  const overs = [];
  if (memOver) overs.push(`memory ${kpiPct(memPct)} > ${th.memory_percent}%`);
  if (cpuOver) overs.push(`CPU ${kpiPct(cpuPct)} > ${th.cpu_percent}%`);
  if (thrOver) overs.push(`throttled ${kpiPct(thrPct, 2)} > ${th.throttled_percent}%`);
  if (diskOver) overs.push(`disk ${kpiPct(diskPct, 0)} > ${th.disk_percent}%`);
  const state = overs.length ? "warning" : "ok";
  const cores = cpu.cores_used == null ? "—" : cpu.cores_used < 0.01 ? "&lt;0.01" : cpu.cores_used.toFixed(2);
  const limitCores = cpu.limit_cores == null ? "no limit" : `${cpu.limit_cores} cores`;
  const noCgroup = !sys.memory && !sys.cpu;
  const thrSub = noCgroup ? "no cgroup v2 sample on this host — memory, CPU and throttling are unmeasured, not zero"
    : cpu.periods == null ? "no CPU quota on this cgroup — nothing to throttle"
    : `${kpiNum(cpu.throttled_periods)} throttled / ${kpiNum(cpu.periods)} periods · ${(cpu.throttled_seconds || 0).toFixed(2)}s total`
      + (thrOver ? ` — over the ${th.throttled_percent}% mark, which is why this reads <em>watch</em>` : "");
  const diskLabel = name === "report" ? "Artefacts" : "Data volume";
  const own = name === "report" ? sys.artifacts : sys.data;
  const ownBytes = own ? (name === "report" ? own.bytes : own.db_bytes + own.wal_bytes + (own.backups ? own.backups.bytes : 0)) : null;
  const diskVal = `<b>${ownBytes == null ? "—" : kpiBytes(ownBytes)}</b>${name === "report" && own ? ` · ${kpiNum(own.files)} files` : ""}`
    + (diskPct == null ? "" : ` · node disk ${kpiPct(diskPct, 0)} full`);
  return `<div class="comp" data-comp="${esc(name)}" data-state="${state}">
    <div class="comp-top"><span class="comp-name">${esc(name)}</span>
      <span class="badge ${state}"><span class="glyph" aria-hidden="true"></span>${state === "ok" ? "healthy" : "watch"}</span></div>
    <div class="meters">
      ${kpiMeter("Memory", memPct, th.memory_percent, memOver, !sys.memory ? "unavailable"
        : `<b>${kpiPct(memPct)}</b> of ${mem.limit_bytes ? kpiBytes(mem.limit_bytes) : "no limit"}`)}
      ${kpiMeter("CPU", cpuPct, th.cpu_percent, cpuOver, !sys.cpu ? "unavailable" : `<b>${cores}</b> / ${limitCores}`)}
      ${kpiMeter("Throttled", thrPct, th.throttled_percent, thrOver, !sys.cpu || cpu.periods == null ? "unavailable"
        : `<b>${thrPct == null ? "—" : kpiPct(thrPct, 2)}</b> of periods`,
        th.throttled_percent == null ? 100 : th.throttled_percent * KPI_THROTTLE_SCALE)}
      ${kpiMeter(diskLabel, diskPct, th.disk_percent, diskOver, diskVal)}
    </div>
    <div class="sub">${thrSub}</div>
    ${ownLine(own, disk)}
    <div class="rule">${overs.length ? `<strong>Watch:</strong> ${esc(overs.join(" · "))}. ` : ""}The mark on each track is the amber
      threshold — &gt;${th.memory_percent}% memory, &gt;${th.cpu_percent}% CPU, &gt;${th.throttled_percent}% throttled periods,
      &gt;${th.disk_percent}% disk. Position against the mark reads without colour.${name === "report"
        ? " Throttling is the saturation signal, not CPU% — a service at 30% being throttled is mis-sized."
        : " A hostpath volume's own size means nothing; the node disk it lives on is the number."}</div>
  </div>`;
}

/* A 30-day sparkline from per-day buckets: one point per UTC day in the window, zero where the day
   has no row, so a quiet week is a flat line rather than a missing one. The window ENDS on the
   payload's as-of day, not on the browser's clock: the buckets are the server's whole UTC days
   (page_payload starts them at the first day's midnight), and a browser on the other side of
   midnight UTC would otherwise plot an empty last day and drop the first (OB3, review of #157). */
function kpiSpark(days, rows, key, label, stroke, asOf) {
  const byDay = new Map((rows || []).map((r) => [r.day, Number(r[key]) || 0]));
  const end = new Date(asOf);
  const last = isNaN(end.getTime()) ? new Date() : end;
  const points = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(last.getTime() - i * 86400000).toISOString().slice(0, 10);
    points.push(byDay.get(d) || 0);
  }
  const max = Math.max(1, ...points);
  const step = 120 / Math.max(1, points.length - 1);
  const poly = points.map((v, i) => `${(i * step).toFixed(1)},${(28 - (v / max) * 24).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="100%" height="30" viewBox="0 0 120 30" preserveAspectRatio="none" role="img"
      aria-label="${esc(label)}: ${points.slice(-7).join(", ")} over the last seven days">
      <polyline fill="none" stroke="${stroke}" stroke-width="1.8" points="${poly}"/></svg>`;
}

/* The tiles remember their last value so a change PULSES and a repaint does not: the flash class is
   added only when the rendered figure differs from the previous render's. */
const kpiLast = new Map();
function kpiTile(id, label, value, note, flag) {
  const changed = kpiLast.has(id) && kpiLast.get(id) !== String(value);
  kpiLast.set(id, String(value));
  return `<div class="kpi${flag ? ` flag-${flag}` : ""}${changed ? " flash" : ""}" data-kpi="${id}">
    <div class="label">${esc(label)}</div><div class="value">${value}</div><div class="note">${note}</div></div>`;
}

const KPI_REFUSAL = `This page reports the dashboard's own pods, the fleet's access posture and its trends —
         governance data about the clusters, not about the reader.`;

function kpiPage() {
  const k = data.kpi;
  if (!k) return `<section class="card"><h2>KPIs</h2><div class="empty-note">Loading…</div></section>`;
  // A designed 403 absorbed by guard403 (a first cycle whose whoami had not yet declared the tier, or
  // a request the proxy let through with no identity): the same card, not a TypeError on a payload
  // that carries no blocks — the Reports tab's `cat.forbidden` rule (OB3, review of #157).
  if (k.forbidden) return refusalCard("KPIs", KPI_REFUSAL);
  const th = k.thresholds || {};
  const clusters = Object.keys(k.posture || {});
  const cs = (data.clusters || []).filter((c) => clusters.includes(c.id));
  const sum = (f) => clusters.reduce((n, c) => n + (f(k.posture[c]) || 0), 0);
  const groups = sum((p) => p.groups.total), empty = sum((p) => p.groups.empty), unattr = sum((p) => p.groups.unattributed);
  const dangling = sum((p) => p.bindings.dangling), unresolved = sum((p) => p.bindings.unresolved);
  // Every tier but built-in — the Access granted tab's headline less its built-in tile. `unmanaged`
  // (a hand-made grant on a synced group) is a binding on the cluster whichever section lists it
  // (OB3, review of #157: the tile read 3 of the seed's 4).
  const bindings = sum((p) => p.bindings.ok + p.bindings.dangling + p.bindings.unresolved + (p.bindings.unmanaged || 0));
  const builtin = sum((p) => p.bindings.built_in);
  const up = cs.filter((c) => c.status === "ok").length;
  const leader = data.version ? data.version.leader : null;
  const review = dangling + unresolved;
  const churn = (c, key) => (k.kpis[key].samples || []).filter((s) => s.cluster === c).reduce((n, s) => n + s.value, 0);
  const added = clusters.reduce((n, c) => n + churn(c, "membership_added_30d"), 0);
  const removed = clusters.reduce((n, c) => n + churn(c, "membership_removed_30d"), 0);
  const attempts = clusters.reduce((n, c) => n + churn(c, "login_attempts_30d"), 0);
  const successes = clusters.reduce((n, c) => n + churn(c, "login_successes_30d"), 0);
  const providers = clusters.reduce((n, c) => n + churn(c, "login_providers_30d"), 0);
  const runs = clusters.reduce((n, c) => n + churn(c, "report_runs_30d"), 0);
  const crTotal = sum((p) => p.groupsyncs.total), crOk = sum((p) => p.groupsyncs.states.ok);
  const crOverdue = sum((p) => p.groupsyncs.states.overdue), crLate = sum((p) => p.groupsyncs.states.late);
  // Per-day buckets summed ACROSS clusters — a day both clusters have rows for is one point, the
  // sum, so the sparkline's last point agrees with the tile (review of #157, Grok: the first cut
  // concatenated the rows and the Map kept the last cluster's).
  const mergeDays = (key, fields) => {
    const byDay = new Map();
    clusters.forEach((c) => (((k.trends[c] || {}).activity || {})[key] || []).forEach((r) => {
      const row = byDay.get(r.day) || { day: r.day };
      fields.forEach((f) => { row[f] = (row[f] || 0) + (Number(r[f]) || 0); });
      byDay.set(r.day, row);
    }));
    return [...byDay.values()];
  };
  const retained = clusters.map((c) => ((k.trends[c] || {}).history_retained_since || {}).membership_event).filter(Boolean).sort()[0];
  const reportSince = clusters.map((c) => (k.trends[c] || {}).report_timeline_since).filter(Boolean).sort()[0];
  const ownLineDashboard = (own, disk) => own
    ? `<div class="sub">gsd.db ${kpiBytes(own.db_bytes)} + WAL ${kpiBytes(own.wal_bytes)}${own.backups ? ` + ${own.backups.count} backups ${kpiBytes(own.backups.bytes)}` : ""}${disk.total_bytes ? `, on a ${kpiBytes(disk.total_bytes)} volume that shares the node's disk (${kpiBytes(disk.used_bytes)} of ${kpiBytes(disk.total_bytes)} used)` : ""}</div>` : "";
  const ownLineReport = (own, disk) => disk.total_bytes
    ? `<div class="sub">${kpiBytes(disk.used_bytes)} of ${kpiBytes(disk.total_bytes)} used on the artefact volume's disk</div>` : "";
  const links = k.links || {};
  const grafana = links.grafana
    ? `${links.grafana}${links.grafana_dashboard_uid ? `/d/${encodeURIComponent(links.grafana_dashboard_uid)}` : ""}?from=now-30d&to=now${clusters.length === 1 ? `&var-cluster=${encodeURIComponent(clusters[0])}` : ""}`
    : null;
  // Built server-side (api.py#kpi_links): the console's namespace-workloads dashboard scoped to the
  // pod's own namespace, the console discovered from openshift-config-managed/console-public when
  // the chart names none.
  const observe = links.observe || null;
  const window = k.trends[clusters[0]] ? k.trends[clusters[0]].window_days : 30;
  const oldest = cs.map((c) => c.oldest_last_sync).filter(Boolean).sort()[0];
  return `
  <section class="card kpi-page">
    <h2>System status <span class="asof"><span class="beat" aria-hidden="true"></span>updated <span data-kpi-ago="${esc(k.as_of)}">${esc(ago(k.as_of))}</span> · refresh ${POLL_INTERVAL_MS / 1000}s</span></h2>
    <div class="sys">
      ${kpiComponent("dashboard", k.system.dashboard, th, ownLineDashboard)}
      ${kpiComponent("report", k.system.report, th, ownLineReport)}
    </div>
  </section>
  <section class="card kpi-page">
    <h2>Access posture <span class="asof">as of last poll · ${clusters.length} cluster${clusters.length === 1 ? "" : "s"} · ${esc(clusters.join(" + "))}</span></h2>
    <div class="kband">
      ${kpiTile("groups", "Groups", kpiNum(groups), clusters.map((c) => `${kpiNum(k.posture[c].groups.total)} ${esc(c)}`).join(" · "))}
      ${kpiTile("empty", "Empty", kpiNum(empty), "no members", empty ? "warning" : "")}
      ${kpiTile("unattributed", "Unattributed", kpiNum(unattr), "no sync provider")}
      ${kpiTile("review", "To review", kpiNum(review), `${kpiNum(unresolved)} unresolved · ${kpiNum(dangling)} dangling`, review ? "warning" : "")}
      ${kpiTile("bindings", "Bindings", kpiNum(bindings), `+${kpiNum(builtin)} built-in`)}
      ${kpiTile("up", "Clusters up", `${up}<span class="of">/${cs.length}</span>`, leader === true ? "leader held" : leader === false ? "standing by — not the leader" : "single replica", up < cs.length ? "critical" : "")}
    </div>
  </section>
  <section class="card kpi-page">
    <h2>Trends <span class="asof">in-app from append-only history · ${window}d${grafana ? " · deeper series in Grafana" : ""}</span></h2>
    <div class="trends">
      <div class="trend">
        <div class="label">Membership churn</div>
        <div class="value">${kpiNum(added + removed)}<span class="delta ${added - removed > 0 ? "up" : added - removed < 0 ? "down" : "flat"}">${added - removed >= 0 ? "+" : ""}${kpiNum(added - removed)} ${added - removed > 0 ? "▲" : added - removed < 0 ? "▼" : "="}</span></div>
        ${kpiSpark(window, mergeDays("membership", ["added", "removed"]).map((r) => ({ day: r.day, n: r.added + r.removed })), "n", "membership changes per day", "var(--status-good)", k.as_of)}
        <div class="retain">${kpiNum(added)} joiners · ${kpiNum(removed)} leavers · ${window}d${retained ? ` · history retained since ${esc(retained.slice(0, 10))}` : ""}</div>
      </div>
      <div class="trend">
        <div class="label">Login outcomes</div>
        <div class="value">${attempts ? kpiPct((successes / attempts) * 100) : "—"}<span class="delta flat">${kpiNum(successes)} ok</span></div>
        ${kpiSpark(window, mergeDays("logins", ["attempts", "successes"]), "attempts", "login attempts per day", "var(--series-1)", k.as_of)}
        <div class="retain">${kpiNum(attempts)} attempts · ${kpiNum(providers)} provider${providers === 1 ? "" : "s"}</div>
      </div>
      <div class="trend">
        <div class="label">Sync cadence</div>
        <div class="value">${kpiNum(crOk)}<span class="of">/${kpiNum(crTotal)}</span>${crOverdue ? `<span class="delta down">${kpiNum(crOverdue)} overdue ▼</span>` : crLate ? `<span class="delta flat">${kpiNum(crLate)} late</span>` : `<span class="delta up">all ok</span>`}</div>
        ${kpiSpark(window, mergeDays("syncs", ["syncs"]), "syncs", "syncs observed per day", "var(--status-good)", k.as_of)}
        <div class="retain">${clusters.map((c) => `${esc(c)} ${kpiNum(k.posture[c].groupsyncs.states.ok || 0)} ok`).join(" · ")}${oldest ? ` · oldest sync ${esc(ago(oldest))}` : ""}</div>
      </div>
      <div class="trend">
        <div class="label">Report volume</div>
        <div class="value">${kpiNum(runs)}<span class="delta ${runs ? "up" : "flat"}">${runs ? `+${kpiNum(runs)} ▲` : "none"}</span></div>
        ${kpiSpark(window, mergeDays("reports", ["runs"]), "runs", "report runs per day", "var(--series-1)", k.as_of)}
        <div class="retain">${reportSince ? `timeline starts ${esc(reportSince.slice(0, 10))}` : "no report run recorded yet"}</div>
      </div>
    </div>
  </section>
  <section class="card kpi-page">
    <h2>Clusters</h2>
    <div class="scroll-x"><table>
      <thead><tr><th>Cluster</th><th>State</th><th class="num">Groups</th><th class="num">Empty</th><th class="num">Unattrib.</th><th class="num">To review</th><th>GroupSync</th></tr></thead>
      <tbody>${cs.map((c) => {
        const p = k.posture[c.id]; const st = p.groupsyncs.states;
        const crNote = !p.groupsyncs.total ? "no CRs" : st.overdue ? `${st.overdue} overdue` : st.late ? `${st.late} late` : "all ok";
        return `<tr class="rowlink" data-cluster="${esc(c.id)}" tabindex="0">
          <td class="mono cname">${esc(c.id)}</td>
          <td>${c.status === "ok" ? `<span class="badge ok"><span class="glyph" aria-hidden="true"></span>up</span>` : sevBadge("critical", c.status || "never polled")}</td>
          <td class="num">${kpiNum(p.groups.total)}</td><td class="num">${kpiNum(p.groups.empty)}</td>
          <td class="num">${kpiNum(p.groups.unattributed)}</td><td class="num${p.bindings.dangling + p.bindings.unresolved ? " warn" : ""}">${kpiNum(p.bindings.dangling + p.bindings.unresolved)}</td>
          <td><span class="chip${st.overdue ? " crit" : ""}">${p.groupsyncs.total} CR${p.groupsyncs.total === 1 ? "" : "s"} · ${crNote}</span></td></tr>`; }).join("")}
      </tbody></table></div>
  </section>
  <section class="card kpi-page">
    <div class="kdoor">
      <p><strong>Deeper series live in your metrics stack.</strong> OpenShift removed its bundled Grafana in 4.11, so Grafana is
        operator-owned${grafana ? " — this link opens the board on the Grafana in this namespace" : " — no Grafana was discovered in this namespace yet (the openshift-grafana chart installs one; <span class=\"mono\">grafana.url</span> names one elsewhere)"}. The console's
        Observe dashboards always ship${observe ? " — the link opens this namespace's workloads board" : " — the console's URL could not be discovered; set <span class=\"mono\">console.url</span> to link them"}.</p>
      <div class="btns">
        ${grafana ? `<a class="btn" href="${esc(grafana)}" target="_blank" rel="noopener">Open in Grafana <span class="ext">↗</span></a>` : ""}
        ${observe ? `<a class="btn ghost" href="${esc(observe)}" target="_blank" rel="noopener">Observe → Dashboards <span class="ext">↗ console</span></a>` : ""}
      </div>
    </div>
  </section>`;
}

/* The heartbeat: "updated Ns ago" counts on the real as-of, once a second, and only while the span
   exists — one timer for the page, never one per render. */
let kpiAgoTimer = null;
function wireKpi() {
  const main = $("main");
  // The meters' geometry is data: the mark's position and the fill's width are set here, on the
  // elements, rather than as inline style literals in the markup (tests/test_type_scale.py's rule).
  main.querySelectorAll(".track[data-th]").forEach((el) => el.style.setProperty("--th", `${el.dataset.th}%`));
  main.querySelectorAll(".fill[data-width]").forEach((el) => { el.style.width = `${el.dataset.width}%`; });
  main.querySelectorAll("tr.rowlink[data-cluster]").forEach((tr) => {
    const open = () => { navigate({ page: "overview", cluster: tr.dataset.cluster }); render(); refresh(); };
    tr.onclick = open;
    tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
  });
  if (kpiAgoTimer == null) {
    kpiAgoTimer = setInterval(() => {
      const span = document.querySelector("[data-kpi-ago]");
      if (!span) { clearInterval(kpiAgoTimer); kpiAgoTimer = null; return; }
      span.textContent = ago(span.dataset.kpiAgo);
    }, 1000);
  }
}

function overviewPage() {
  const cs = data.clusters;
  const density = densityFor(cs.length);
  document.documentElement.dataset.density = density;
  if (view.cluster) {
    const c = cs.find((x) => x.id === view.cluster);
    if (!c) return `<section class="card"><button class="back" id="back">${backLabel()}</button>
      <h2>${esc(view.cluster)}</h2><div class="empty-note">No cluster by that id is configured. A removed
      cluster's link is a detour, not a dead end.</div></section>`;
    return clusterDetail(c);
  }
  // Alerts lead once the fleet is big enough that the tiles stop being readable: past eight
  // clusters the question is "what is broken", not "how is each one doing".
  const alertsFirst = cs.length > FLEET_TABLES_MAX;
  // Three answers, not two: past the medium tier the tables are per cluster by design; below it a
  // missing payload is a fetch still out (the tab handler paints before it fetches), and the
  // per-cluster note would then be a design decision claimed about a fleet of two.
  const polledOk = (id) => { const c = cs.find((x) => x.id === id); return c ? c.status === "ok" : false; };
  const tables = cs.length > FLEET_TABLES_MAX
    ? `<section class="card"><h2>GroupSync CRs</h2>
      <div class="empty-note">With ${cs.length} clusters the CR and policy tables are shown per cluster — open a tile.</div></section>`
    : data.fleet
      ? groupsyncTable(data.fleet.flatMap((f) => (f.groupsyncs || []).map((r) => ({ ...r, cluster: f.id }))), null,
                       data.fleet.filter((f) => !f.groupsyncs).map((f) => f.id))
        + configsCard(data.fleet.map((f) => ({ cluster: f.id, oc: f.operatorConfigs, polled: polledOk(f.id) })))
      : `<section class="card"><h2>GroupSync CRs</h2><div class="empty-note">Loading…</div></section>`;
  const tiles = clustersCard(cs, density);
  const alerts = alertsCard(data.alerts, cs.length);
  return (alertsFirst ? alerts + tiles : tiles + alerts) + tables;
}

function wireOverview() {
  const main = $("main");
  // A tile's whole face opens the cluster; the heading's button does the same for the keyboard.
  main.querySelectorAll(".tile[data-cluster], tr.rowlink[data-cluster]:not([data-cr])").forEach((el) => {
    el.onclick = (e) => {
      if (e.target.closest("a")) return;
      // PAINT FIRST, then fetch — the tab handler's rule (benchmark §6a: 2–4 ms against a 271–337 ms
      // round trip), which a tile skipped, leaving the dimmed fleet on screen for the length of the
      // fetch (Grok, review of #172). Safe because a cluster change FROM THE FLEET now drops the
      // previous cluster's payloads at the chokepoint (applyPosition), so the first paint is the
      // tile, its alerts and "Loading…" — never another cluster's rows under this one's name.
      navigate({ cluster: el.dataset.cluster }); render(); refresh();
    };
  });
  main.querySelectorAll("[data-cr]").forEach((tr) => {
    tr.onclick = () => {
      const changes = { groupsync: tr.dataset.cr };
      if (tr.dataset.cluster && tr.dataset.cluster !== view.cluster) changes.cluster = tr.dataset.cluster;
      navigate(changes); refresh();
    };
  });
  main.querySelectorAll("[data-alert-page]").forEach((b) => {
    b.onclick = () => { view.alertPage = Number(b.dataset.alertPage); render(); };   // view state: no fetch, no entry
  });
  const back = $("back");
  if (back) back.onclick = goBack;
}

/* Sync timeline: ONE series (group count at each observed sync) so no legend box —
   the heading names it. Step line, because the count holds between syncs rather than
   drifting continuously. Always shipped with the table twin below it, so no value is
   reachable only via hover. */
/* Retention makes a timeline's first row a CUT, not a beginning. Said only when a window is in
   force: window_days 0 keeps everything, and the `note` beside it already covers "since this
   dashboard started". `retained_since` is the oldest row still held on this cluster. */
function retentionNote(r) {
  if (!r || !(r.window_days > 0)) return "";
  const since = r.retained_since
    ? `History retained since <strong>${esc(fmtTime(r.retained_since))}</strong>; `
    : "";
  return `<div class="muted text-xs mb-3">${since}rows older than
    ${Number(r.window_days)} days are removed by retention, so a timeline that begins there was
    cut there — it does not mean nothing happened before.</div>`;
}

function timelineChart(events) {
  const pts = events.slice().reverse().filter((e) => e.synced_at);
  if (pts.length < 2) return "";

  const W = 720, H = 190, PAD = { t: 14, r: 16, b: 28, l: 40 };
  const xs = pts.map((p) => new Date(p.synced_at).getTime());
  const ys = pts.map((p) => p.group_count ?? 0);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const yMax = Math.max(...ys, 1);
  // Include zero so a count cliff reads as a cliff, not as a rescaled plateau.
  const yTop = Math.ceil(yMax * 1.15);
  const px = (t) => PAD.l + (x1 === x0 ? (W - PAD.l - PAD.r) / 2 : ((t - x0) / (x1 - x0)) * (W - PAD.l - PAD.r));
  const py = (v) => H - PAD.b - (v / yTop) * (H - PAD.t - PAD.b);

  let d = "";
  pts.forEach((p, i) => {
    const X = px(xs[i]), Y = py(ys[i]);
    d += i === 0 ? `M${X},${Y}` : `L${X},${py(ys[i - 1])} L${X},${Y}`;
  });
  const area = `${d} L${px(xs[xs.length - 1])},${py(0)} L${px(xs[0])},${py(0)} Z`;

  const ticks = [0, Math.round(yTop / 2), yTop];
  const gridlines = ticks.map((t) =>
    `<line class="grid-line" x1="${PAD.l}" y1="${py(t)}" x2="${W - PAD.r}" y2="${py(t)}"/>
     <text x="${PAD.l - 7}" y="${py(t) + 3}" text-anchor="end">${t}</text>`).join("");

  const dots = pts.map((p, i) => {
    const X = px(xs[i]), Y = py(ys[i]);
    return `<circle class="dot" cx="${X}" cy="${Y}" r="4"/>
      <circle class="hit" cx="${X}" cy="${Y}" r="13"
        data-t="${esc(p.synced_at)}" data-v="${ys[i]}" data-o="${esc(p.observed_at || "")}"/>`;
  }).join("");

  const xLabels = [pts[0], pts[pts.length - 1]].map((p, i) => {
    const X = px(new Date(p.synced_at).getTime());
    return `<text x="${X}" y="${H - 9}" text-anchor="${i === 0 ? "start" : "end"}">${esc(
      fmtTime(p.synced_at).slice(5, 16))}</text>`;
  }).join("");

  return `<div class="chart-wrap">
    <h3 class="mb-3">Groups owned, at each observed sync</h3>
    <!-- No height attribute: a fixed height alongside a viewBox letterboxes the plot,
         pinning it to 1:1 and floating it in the middle of a wider card. width:100% +
         height:auto lets the viewBox scale to the container and keeps the x-axis band. -->
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
         class="chart-img"
         aria-label="Group count at each observed sync">
      ${gridlines}
      <path class="series-area" d="${area}"/>
      <path class="series-line" d="${d}"/>
      ${dots}
      <line class="axis-line" x1="${PAD.l}" y1="${H - PAD.b}" x2="${W - PAD.r}" y2="${H - PAD.b}"/>
      ${xLabels}
    </svg>
    <div class="tooltip" id="tip"></div>
  </div>`;
}

function groupsyncDetail() {
  // Loading before "not found": Back across a cluster switch restores a drill-down whose
  // cluster's CRs are not here yet, and "CR not found" would be a verdict on data we lack.
  if (!data.groupsyncs) {
    return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  }
  const cr = data.groupsyncs.find((g) => g.name === view.groupsync);
  if (!cr) return `<section class="card"><div class="empty-note">CR not found.</div></section>`;
  const ev = data.events || { events: [], note: "" };

  const eventsTable = ev.events.length
    ? `<div class="scroll-x"><table>
        <thead><tr><th>Synced at (operator)</th><th>Observed at (dashboard)</th>
          <th class="num">Lag</th><th class="num">Groups</th><th>Schedule then</th></tr></thead>
        <tbody>${ev.events.map((e) => {
          const lag = e.observed_at && e.synced_at
            ? Math.round((new Date(e.observed_at) - new Date(e.synced_at)) / 1000) : null;
          return `<tr>
            <td class="mono">${esc(fmtTime(e.synced_at))}</td>
            <td class="mono">${esc(fmtTime(e.observed_at))}</td>
            <td class="num">${lag === null ? "—" : lag + "s"}</td>
            <td class="num">${e.group_count ?? "—"}</td>
            <td><code>${esc(e.schedule || "—")}</code></td>
          </tr>`;
        }).join("")}</tbody></table></div>`
    : `<div class="empty-note">No syncs observed yet. The timeline is accumulated by polling,
        so it starts when this dashboard does — an empty list here does not mean the
        operator has never synced.</div>`;

  return `<section class="card">
    <button class="back" id="back">${backLabel()}</button>
    <div class="row-wrap mt-5">
      <h2>${esc(cr.name)}</h2>${badge(cr.state)}
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Schedule</div><div class="value sm"><code>${esc(cr.schedule || "—")}</code></div></div>
      <div class="kpi"><div class="label">Groups owned</div><div class="value">${cr.group_count}</div></div>
      <div class="kpi"><div class="label">Last sync</div><div class="value sm">${esc(ago(cr.last_sync_at))}</div></div>
      <div class="kpi"><div class="label">Next expected</div><div class="value sm">${esc(cr.next_expected ? fmtTime(cr.next_expected).slice(5, 16) : "—")}</div></div>
    </div>
    ${cr.ldap_filter ? `<div class="mt-6"><h3>LDAP group filter</h3>
      <code>${esc(cr.ldap_filter)}</code></div>` : ""}
    ${cr.error_at ? `<div class="mt-6">
      <h3>Last reconcile error ${cr.error_is_current
        ? `<span class="err">— current</span>`
        : `<span class="muted">— stale, superseded by a later success</span>`}</h3>
      <div class="muted mono text-sm">${esc(fmtTime(cr.error_at))} (generation ${esc(cr.error_generation ?? "?")})</div>
      <div class="text-sm mt-2">${esc(cr.error_message || "")}</div>
    </div>` : ""}
  </section>
  <section class="card">
    ${timelineChart(ev.events)}
    <h3 class="mt-7">Observed syncs</h3>
    <div class="muted text-xs mb-3">${esc(ev.note || "")}</div>
    ${retentionNote(ev.retention)}
    ${eventsTable}
  </section>`;
}

/* Does this name match a free-text query? Every whitespace-separated term must appear.

   AND, NOT a substring of the whole query, and that is the difference that makes it useful. Group names
   are long and structured — app-ocp-rbac-alpha-ns-admin — so the two halves a reader remembers are
   rarely adjacent: "alpha admin" finds it, and the same string as one substring finds nothing.

   Order-independent for the same reason, so "admin alpha" is the same query. A single term degenerates
   to an ordinary case-insensitive substring match, which is what a one-word search should do.

   No regex and no globbing: a reader typing `app-ocp-rbac-*` means those characters, and treating the
   input as a pattern would make `*` and `(` either magic or an error. Matching runs against the DATA;
   the row is still rendered through esc(), so nothing here changes what reaches innerHTML. */
function matchesSearch(fields, query) {
  const terms = (query || "").toLowerCase().split(/\s+/).filter(Boolean);
  if (terms.length === 0) return true;
  // Joined with a space so a term can never straddle two fields — "ecoop" must not match a user
  // whose id is alice and whose name is Cooper. Null fields (full_name is nullable) drop out here,
  // so a person with no display name is matched on the id alone.
  const haystack = fields.filter(Boolean).join(" ").toLowerCase();
  return terms.every((t) => haystack.includes(t));
}

/* The Groups tab's row selection, shared with the export for the same reason as usersMatched. */
function groupsMatched() {
  const all = data.groups || [];
  return { all, rows: all.filter((g) => matchesSearch([g.name], view.groupSearch)) };
}

function groupsPage() {
  // null = not fetched for this cluster yet (first visit, or a cluster switch dropped it).
  // Same Loading state as every other tab; [] is a real answer and falls through.
  if (!data.groups) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  // Held under another state (the lookup's `all` while the select says `empty`): the same Loading state
  // as a first visit, until this state's rows land — never the other slice under this select's copy.
  if (data.groupsMeta && data.groupsMeta.state && data.groupsMeta.state !== view.groupFilter) {
    return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  }
  // The whole list before the search narrows it, so the header can report what was hidden. A filtered
  // view that cannot state its own denominator has the same defect as a truncated page that cannot:
  // the reader cannot tell "there is one" from "there is one THAT MATCHES".
  const all = data.groups;
  // `scope`/`viewer` as the response declared them (kept beside the rows in refresh()).
  // The banner and the scoped empty state render from these fields and never from a
  // guess — the search-box scar, applied to a security label.
  const meta = data.groupsMeta || {};
  const self = meta.scope === "self";
  const rows = groupsMatched().rows;
  const searching = (view.groupSearch || "").trim().length > 0;
  const note = {
    empty: "Zero members, so the group grants nobody. On an operator-synced group that usually means an LDAP-side problem — a member DN that does not resolve. Includes hand-made groups, which also appear under unattributed.",
    unattributed: "No sync-provider label, so not managed by any GroupSync CR.",
    all: "",
  }[view.groupFilter];
  // The KPIs are the cluster's, from the server's whole-set counts (`/api/clusters`: the Overview card's
  // and /metrics' numbers) — never counted from the rows on screen, which a state filter or the self
  // tier narrows (#153; the contract's whole-set rule). Empty and unattributed carry the warning rail
  // when they hold any group: each is a problem state the state filter can open.
  // A never-polled cluster (`status` null — the same three-valued contract as `reachable`) has no counts,
  // only an empty table's zeros; nothing is shown rather than a healthy-looking 0 / 0 / 0 (review of #225,
  // Codex and Grok).
  const cl = (data.clusters || []).find((c) => c.id === view.cluster);
  const counted = cl && cl.status !== null && ["group_count", "empty_groups", "unattributed_groups"].every((k) => typeof cl[k] === "number");
  const kpis = counted && !self ? `<div class="kpis mb-5" id="groups-kpis">
      <div class="kpi"><div class="label">Groups on this cluster</div><div class="value">${cl.group_count}</div></div>
      <div class="kpi${cl.empty_groups ? " flag-warning" : ""}"><div class="label">Empty</div><div class="value${cl.empty_groups ? "" : " muted"}">${cl.empty_groups}</div></div>
      <div class="kpi${cl.unattributed_groups ? " flag-warning" : ""}"><div class="label">Unattributed</div><div class="value${cl.unattributed_groups ? "" : " muted"}">${cl.unattributed_groups}</div></div>
    </div>` : "";
  return `<section class="card">
    <h2>Groups <span class="muted fw-normal">· ${searching
      ? `${rows.length} of ${all.length} shown`
      : `${rows.length} shown`}</span></h2>
    ${scopeBanner("groups", meta)}
    ${kpis}
    ${note ? `<div class="filterbar-note mt-2">${esc(note)}</div>` : ""}
    ${alsoLine("groups", view.groupSearch)}
    ${searching ? `<div class="filterbar-note mt-2">Filtered by
      <strong>${esc(view.groupSearch.trim())}</strong> — every word must appear in the name.${all.length > 0
      // Same zero-denominator honesty as the empty state below: with nothing behind the search,
      // "clear the box to see all 0" invites the reader to clear it and get the same empty table.
      ? ` Clear the box, or press Escape in it, to see all ${all.length}.` : ""}</div>` : ""}
    ${rows.length === 0
      ? (searching && all.length > 0
          // Only blame the search when it IS the search: with a zero denominator the state filter
          // (or the cluster) has nothing to show, and "the search is hiding them" would be false —
          // the reader would clear their query expecting rows and get none.
          ? `<div class="empty-note">No group name contains
              <strong>${esc(view.groupSearch.trim())}</strong>. ${all.length === 1
              ? `1 group matches the state filter, so it is the search hiding it`
              : `${all.length} groups match the state filter, so it is the search hiding them`}
              rather than the data being empty.</div>`
          : (self && !searching && view.groupFilter === "all"
              // Scoped-and-empty is NOT an empty cluster, and the two must never share a
              // sentence (requirements Q6). Naming the viewer is deliberate twice over: it
              // is also the on-screen diagnostic when the IdP's username does not match
              // the names the sync operator writes into members.
              ? `<div class="empty-note">You are not a member of any synced group on this
                  cluster (signed in as <strong>${esc(meta.viewer || "")}</strong>). This
                  view is scoped to you — it is not a statement that the cluster has no
                  groups.</div>`
              : `<div class="empty-note">No groups match this filter.</div>`))
      : `<div class="scroll-x"><table>
          <thead><tr><th>Name</th><th class="num">Members</th><th class="num">Grants</th><th>Owner</th>
            <th>Last refreshed</th><th>Source DN</th></tr></thead>
          <tbody>${rows.map((g) => `<tr class="rowlink" data-group="${esc(g.name)}">
            <td><button type="button" class="drill">${esc(g.name)}</button></td>
            <td class="num">${g.member_count}</td>
            <td class="num ${g.binding_count ? "" : "muted"}">${g.binding_count ?? "—"}</td>
            <td>${ownerCell(g.sync_provider)}</td>
            <td class="mono">${esc(ago(g.group_synced_at))}</td>
            <td class="muted"><code>${esc(g.ldap_uid || "—")}</code></td>
          </tr>`).join("")}</tbody>
        </table></div>
        <div class="filterbar-note mt-4">Select a group to see its members. The <strong>Owner</strong> dot's colour is
          assigned by the provider label's position in the cluster's full sorted provider list (crSlot), so a group keeps
          its colour when you filter.</div>`}
  </section>`;
}

/* The Users tab asks for the server's MAXIMUM, not its default. The default (1,000) is below the
   1,240 users with a membership on the reference cluster, so a default fetch would clip a list the
   Find box then searches — a person past the cut would be unfindable while the box said "no match".
   10,000 is the API's ceiling; past it the page states `truncated` rather than implying completeness. */
const USERS_FETCH = 10000;
/* Rows painted at once. Every keystroke rebuilds #main, and the benchmark doc (§7) measured that
   rebuild at 1.3 ms for 65 rows — so ~20 ms at 1,000, and a visible stall per keystroke at 10,000.
   Only the PAINT is capped: matching runs over every fetched row, so a person is always findable by
   typing more of their name, and the cap is stated on the page whenever it bites. */
const USERS_RENDER = 1000;

/* What the first-login column IS, said once above the table at the wide tier (the narrowed
   reader sees the chip on their own row). Names the grant like the users-source banner does. */
function identitiesNote(d) {
  const s = d.identities_source;
  // The `ok` sentence describes the SOURCE of each row's time and never asserts that every row has
  // the Identity one: a User whose Identity read is missing, or who appeared while a refresh failed,
  // carries the User time and an "approx." chip on the same page (review of C2, Codex).
  if (s === "ok") return `<div class="filterbar-note" id="users-identities-note">First-login times are the
    <strong>Identity object's creation time</strong> where an Identity names the User (read${d.identities_source_observed_at
      ? ` <span class="mono">${esc(fmtTime(d.identities_source_observed_at))}</span>` : ""}) and the User's
    creation time (approx.) otherwise. For a provider with <code>mappingMethod: lookup</code> the Identity is
    created by an administrator before the first login, and the time shown is that create.</div>`;
  if (s === "forbidden") return `<div class="truncation-note" id="users-identities-note">The dashboard is
    <strong>not permitted to list identities.user.openshift.io</strong>, so first-login times are the User's
    creation time (approximate). Grant <code>rbac.identities</code> in the chart to read the Identity objects'
    creation times.</div>`;
  if (s === "pending") return `<div class="filterbar-note" id="users-identities-note">Waiting for the first
    poll to read identities; first-login times are the User's creation time (approximate) until then.</div>`;
  if (s === "off") return `<div class="filterbar-note" id="users-identities-note">First-login times are
    <strong>approximate</strong> (the User's creation time). The Identity objects' creation times need the
    Identity read (<code>rbac.identities</code>).</div>`;
  return "";
}

/* The Users tab's row selection — chips, then the free-text box — written once so the table and
   the export (docs/DESIGN_export.md) read the same rows. Only the PAINT is capped (USERS_RENDER);
   this returns every match, which is what an export must carry. */
function usersMatched(d) {
  const all = d.users || [];
  const provs = (u) => Array.isArray(u.providers) ? u.providers : [];
  const chip = view.userFilter || "all";
  const byChip = (u) => chip === "all" ? true
    : chip === "grouped" ? (u.group_count || 0) > 0
    : chip === "nogroup" ? (u.group_count || 0) === 0
    : chip.startsWith("provider:") ? provs(u).includes(chip.slice(9))
    : true;
  // Both fields, so a reader who knows only the display name still finds the id — which is what
  // they need next, because the id is what `oc` and the group members answer to.
  const matched = all.filter((u) => byChip(u) && matchesSearch([u.user_name, u.full_name], view.userSearch));
  return { all, matched, provs, chip };
}

function usersPage() {
  const d = data.users;
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  // The endpoint refuses a reader with no verified identity (proxy on, no header): there is no
  // "own row" to scope to. Named, like every other refusal, never rendered as an empty cluster.
  if (d.forbidden) {
    return refusalCard("Users", `Every row here is a person who has logged in to this cluster, so
      the list needs an authenticated identity to scope to.`, false);
  }
  // The row selection is SHARED with the export (usersMatched): the table and the file it
  // downloads read one function, so they cannot disagree about which rows match. Only the PAINT
  // below is capped at USERS_RENDER; the export carries every match, and its note says so.
  const { all, matched, provs, chip } = usersMatched(d);
  const self = d.scope === "self";
  const never = { count: (d.never_logged_in_members || {}).count || 0,
                  names: Array.isArray((d.never_logged_in_members || {}).names) ? d.never_logged_in_members.names : [] };
  const captureOn = d.login_capture !== "off";
  // Chips: a whole-row predicate; the search box narrows further. Provider chips come from the
  // rows themselves, so a cluster with one identity provider shows one.
  const providers = [...new Set(all.flatMap(provs))].sort();
  const rows = matched.slice(0, USERS_RENDER);
  const searching = (view.userSearch || "").trim().length > 0;
  const q = (view.userSearch || "").trim();
  const chipping = chip !== "all";
  const narrowed = searching || chipping;
  // The headline counts LOGINS: Users with an identity. A manual account (`oc create user`,
  // nobody has ever logged in as it) is a row, labelled as such, and is not a login — counting
  // it as one contradicted its own row (Codex, #47). Old servers send only `total`.
  const loggedIn = all.filter((u) => u.logged_in !== false);
  const manual = all.length - loggedIn.length;
  const total = typeof d.logged_in_total === "number" ? d.logged_in_total
    : typeof d.total === "number" ? d.total - manual : loggedIn.length;
  const grouped = all.filter((u) => (u.group_count || 0) > 0).length;
  const loggedInNoGroup = loggedIn.filter((u) => (u.group_count || 0) === 0).length;
  const chipBtn = (key, label, title) => `<button type="button" class="chip-btn" data-ufilter="${esc(key)}"
      aria-pressed="${chip === key}"${title ? ` title="${esc(title)}"` : ""}>${esc(label)}</button>`;
  // `identity` marks an Identity creation time; `approx.` the User's, which precedes the first login
  // for an account an administrator created ahead of time. Neither word is colour, and neither says
  // "exact": a lookup-mapped provider's Identity is created by an administrator before the first
  // login, so the Identity time is the first login for claim/add mapping and the mapping's creation
  // for lookup (review of C2, Codex).
  const sourceChip = (u) => u.first_login_source === "identity"
    ? ` <span class="chip" title="The Identity object's creation time: OpenShift creates it at the first login through this provider (mappingMethod claim or add); for a lookup-mapped provider an administrator creates it beforehand, and this is that create.">identity</span>`
    : u.first_login_source === "user"
      ? ` <span class="chip" title="Approximate: the User object's creation time — the first login for a provider-created User, earlier than it for an account created by hand and linked later.">approx.</span>`
      : "";
  const status = (u) => u.logged_in === false
    ? `<span class="muted">manual account · never logged in</span>`
    : u.first_login_at
      ? `logged in since <span class="mono">${esc(fmtTime(u.first_login_at))}</span> <span class="muted">(${esc(ago(u.first_login_at))})</span>${sourceChip(u)}`
      : `<span class="muted">logged in</span>`;
  const lastLogin = (u) => !captureOn
    ? `<span class="muted" title="Login capture is off, so the dashboard has not recorded any login.">capture off</span>`
    : u.last_login_at
      ? `<span class="mono">${esc(fmtTime(u.last_login_at))}</span> <span class="muted">(${esc(ago(u.last_login_at))})</span>`
      : `<span class="muted" title="Nothing since capture began. Earlier logins were never recorded.">none captured</span>`;
  return `<section class="card">
    <h2>Users <span class="muted fw-normal">· ${rows.length < all.length
      // What is PAINTED, so the number is true whether the search, a chip or the paint cap narrowed
      // it; the notes below say which. Counting matches here read "1500 shown" over 1,000 rows.
      ? `${rows.length} of ${all.length} shown`
      : `${all.length} shown`}</span></h2>
    ${scopeBanner("users", d)}
    ${d.source === "forbidden"
      // The rows below, if any, are last cycle's. Named by grant, because the alternative is an
      // empty table that reads as "nobody has logged in".
      ? `<div class="truncation-note" id="users-source-note">The dashboard is <strong>not permitted to list
          users.user.openshift.io</strong> on this cluster, so this tab has no source${all.length
            ? " and the rows below are from the last poll that could read them" : ""}. Grant
          <code>rbac.users</code> in the chart to enable it.</div>` : ""}
    ${d.source === "pending" && all.length === 0
      ? `<div class="filterbar-note" id="users-source-note">Waiting for the first poll to read the
          cluster's users.</div>` : ""}
    ${d.source === "ok" && d.source_observed_at
      // The age of THIS tab's source. A poll that fails before reaching the users read leaves the
      // rows and this timestamp as they were, so the reader can see it is not moving.
      ? `<div class="filterbar-note" id="users-source-age">Users read from the cluster
          <span class="mono">${esc(fmtTime(d.source_observed_at))}</span> <span class="muted">(${esc(ago(d.source_observed_at))})</span>.</div>` : ""}
    ${(d.providers_filter || []).length
      ? `<div class="filterbar-note" id="users-provider-filter">Showing providers:
          <strong>${d.providers_filter.map(esc).join(", ")}</strong>. People who logged in only through
          another provider are not listed here; their group pages are unchanged.</div>` : ""}
    ${self ? "" : identitiesNote(d)}
    ${self ? "" : `<div class="kpis">
      <div class="kpi"><div class="label">Have logged in</div><div class="value">${total}</div></div>
      <div class="kpi"><div class="label">In a synced group</div><div class="value">${grouped}</div></div>
      <div class="kpi${loggedInNoGroup ? " flag-warning" : ""}"><div class="label">Logged in, no synced group</div><div class="value">${loggedInNoGroup}</div></div>
      <div class="kpi${never.count ? " flag-warning" : ""}"><div class="label">Synced, never logged in</div><div class="value">${never.count}</div></div>
    </div>
    ${manual > 0
      ? `<div class="filterbar-note" id="manual-accounts-note">${manual} manual ${manual === 1 ? "account" : "accounts"}
          (a User object with no identity — created by hand, never logged in as) ${manual === 1 ? "is" : "are"}
          listed below and not counted above.</div>` : ""}`}
    ${never.count > 0
      // Not rows: they have not logged in, so they are not users of the cluster yet. One line, and
      // the names one click away — their group pages, which come from the Group objects, are
      // where they live.
      ? `<div class="filterbar-note" id="never-logged-in">
          <strong>${never.count}</strong> synced ${never.count === 1 ? "member has" : "members have"} never logged in
          to this cluster${self ? "" : `. <button type="button" class="linkish" id="toggle-never-names"
            aria-expanded="${view.showNeverNames}">${view.showNeverNames ? "hide names" : "show names"}</button>`}
          ${view.showNeverNames ? `<div class="mt-2">${never.names.map((n) =>
            `<button type="button" class="drill mono" data-user="${esc(n)}">${esc(n)}</button>`).join(" ")}</div>` : ""}
        </div>` : ""}
    ${self || all.length === 0 ? "" : `<div class="filterbar mt-4">
      ${chipBtn("all", `all (${all.length})`)}
      ${chipBtn("grouped", `in a synced group (${grouped})`)}
      ${chipBtn("nogroup", `no synced group (${all.length - grouped})`,
        "Logged in, but holds no access through any synced group. Administrators and service identities land here; so does anyone whose access is granted outside group sync.")}
      ${providers.map((pv) => chipBtn(`provider:${pv}`,
        `${pv} (${all.filter((u) => provs(u).includes(pv)).length})`,
        "Identity provider the person has logged in through.")).join("")}
    </div>`}
    ${d.truncated
      // Stated BEFORE the search note, so the denominator is qualified before it is used.
      ? `<div class="truncation-note">Showing the first <strong>${all.length}</strong> of
          <strong>${total}</strong> users by id. The Find box and the chips search only these, so a
          person past the cut cannot be found here.</div>` : ""}
    ${alsoLine("users", view.userSearch)}
    ${searching ? `<div class="filterbar-note mt-2">Filtered by
      <strong>${esc(q)}</strong> — every word must appear in the id or the name.${all.length > 0
      ? ` Clear the box, or press Escape in it, to see all ${all.length}.` : ""}</div>` : ""}
    ${matched.length > rows.length
      ? `<div class="truncation-note">${rows.length} of ${matched.length} ${narrowed ? "matches" : "users"}
          painted. Keep typing to narrow the list.</div>` : ""}
    ${rows.length === 0
      ? (narrowed && all.length > 0
          // Only blame the filter when it IS the filter — the zero-denominator rule from the
          // Groups tab. Under truncation, hedge: the person may be past the cut.
          ? `<div class="empty-note">${searching
                ? `No user id or name contains <strong>${esc(q)}</strong>${chipping ? " under the selected chip" : ""}.`
                : `No user matches the selected chip.`}
              ${all.length === 1
                ? `1 user is loaded, so it is the ${searching ? "search" : "chip"} hiding them`
                : `${all.length} users are loaded, so it is the ${searching ? "search" : "chip"} hiding them`}
              rather than the data being empty.${d.truncated
                ? ` Only the first ${all.length} were loaded — the person may be past the cut.` : ""}</div>`
          : (self && !narrowed
              // Scoped-and-empty is NOT an empty cluster (requirements Q6). Naming the viewer is
              // also the diagnostic when the IdP's username does not match the User object's name.
              ? `<div class="empty-note">No User object on this cluster is named
                  <strong>${esc(d.viewer || "")}</strong>, which is the identity you are signed in as.
                  This view is scoped to you — it is not a statement that nobody has logged in.</div>`
              : d.source === "forbidden" || d.source === "pending"
                ? ""
                : `<div class="empty-note">No one has logged in to this cluster yet — there is no
                    User object. Synced group members appear above once they have.</div>`))
      : `<div class="scroll-x"><table>
          <thead><tr><th>User</th><th>Status</th><th>Provider</th><th class="num">Groups</th><th>Last login</th><th>First seen in a group</th></tr></thead>
          <tbody>${rows.map((u) => `<tr class="rowlink" data-user="${esc(u.user_name)}">
            <td><button type="button" class="drill">${esc(u.user_name)}</button>${u.full_name
              ? ` <span class="muted">· ${esc(u.full_name)}</span>` : ""}</td>
            <td>${status(u)}</td>
            <td>${provs(u).length ? provs(u).map((pv) => `<span class="chip mono" title="Identity provider the person has logged in through.">${esc(pv)}</span>`).join(" ") : `<span class="muted">—</span>`}</td>
            <td class="num${(u.group_count || 0) === 0 ? " warn" : ""}">${u.group_count || 0}</td>
            <td>${lastLogin(u)}</td>
            <td class="mono">${u.first_seen_at
              ? `${esc(fmtTime(u.first_seen_at))} <span class="muted">(${esc(ago(u.first_seen_at))})</span>`
              : `<span class="muted">—</span>`}</td>
          </tr>`).join("")}</tbody>
        </table></div>
        <div class="filterbar-note mt-4">Select a user to see every group they
          belong to and every binding that reaches them.</div>`}
  </section>`;
}

/* Who used the dashboard. Aggregated per user per UTC day, never a page-view log — see
   the dashboard_user_activity comment in store.py for why that boundary is deliberate. */
function usagePage() {
  const d = data.usage;
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;

  // Disabled is a DIFFERENT state from "nobody has visited yet", and conflating them sends
  // the reader looking for users who were never going to be recorded. Say which it is.
  if (!d.enabled) {
    // The config keys are shown to an ADMINISTRATOR only. This is a diagnostic rather than a
    // lever — the feature is off for everyone, so naming the settings is not advertising an
    // escalation the way refusalCard's old grant advice was — but an ordinary reader still
    // cannot act on a chart value, and telling them the state is the whole of what they need.
    return `<section class="card">
      <h2>Dashboard usage</h2>
      <div class="empty-note">
        Not being recorded on this cluster.${narrowedReader() ? "" : ` This needs
        <strong>both</strong> <code>oauthProxy.enabled=true</code> — identity comes from the
        proxy, and with it off there is no authentication and the username header would be
        whatever the caller typed — and <code>config.userActivity.enabled=true</code>.`}
      </div>
    </section>`;
  }

  const rows = d.activity || [];
  // The headline numbers come from the server's summary, which is computed over the whole
  // set. `rows` is ONE PAGE of it: counting them reports the page, and at 1,092 stored rows
  // that said 167 days and 5,000 interactions where the truth was 364 and 10,920. The
  // fallbacks only fire against a build that predates the summary.
  const s = d.summary || {};
  const days = s.days != null ? s.days : new Set(rows.map((r) => r.day)).size;
  const users = s.distinct_users != null
    ? s.distinct_users : new Set(rows.map((r) => r.user_name)).size;
  const requests = s.interactions != null
    ? s.interactions : rows.reduce((n, r) => n + r.request_count, 0);
  const today = new Date().toISOString().slice(0, 10);
  // Safe to take from `rows`: the API orders day DESC, so today is on the first page unless
  // more people used the dashboard in one day than the limit.
  const activeToday = rows.filter((r) => r.day === today).length;

  const selfOnly = d.scope !== "all";
  return `<section class="card">
    <h2>Dashboard usage</h2>
    ${selfOnly
      // No config key named here, for the reason refusalCard records: the reader seeing this
      // is the one being scoped down, and naming the setting that would widen it hands them a
      // lever they cannot pull. The operator-facing form is in the chart values, where an
      // operator looks. Saying WHY the scoping exists is still worth it — that is not a lever.
      ? `<div class="filterbar-note mb-4">Showing
          <strong>${esc(d.viewer || "your")}</strong> activity only. This is identifiable
          personnel data, so each person sees their own.</div>`
      // Two DIFFERENT causes now reach the wide view — the deployment recording usage for
      // everyone, or this reader passing the Usage tab's own administrator check — and the
      // page cannot tell which from `scope` alone. So it states the fact and asserts neither
      // cause, rather than naming one and being wrong half the time.
      : `<div class="filterbar-note mb-4">Showing
          <strong>all users</strong>, not only your own activity.</div>`}
    <div class="hero">
      <span class="value mono">${activeToday}</span>
      <span class="label">${selfOnly
        ? (activeToday ? "active today" : "no activity today")
        : `${activeToday === 1 ? "person" : "people"} used the dashboard today`}</span>
    </div>
    <div class="kpis">
      ${selfOnly ? "" : `<div class="kpi"><div class="label">Distinct users</div>
        <div class="value mono">${users}</div></div>`}
      <div class="kpi"><div class="label">Days recorded</div>
        <div class="value mono">${days}</div></div>
      <div class="kpi"><div class="label">Interactions</div>
        <div class="value mono">${requests.toLocaleString()}</div></div>
      <div class="kpi"><div class="label">Retention</div>
        <div class="value mono muted">${d.retention_days} days</div></div>
    </div>
  </section>
  <section class="card">
    <h3>By user and day</h3>
    ${rows.length === 0
      ? `<div class="empty-note">Nothing recorded yet. Rows appear after the first flush,
           which runs on the configured interval rather than per request.</div>`
      : `<div class="scroll-x"><table>
          <thead><tr><th>User</th><th>Day (UTC)</th><th>First seen</th><th>Last seen</th>
            <th class="num">Interactions</th></tr></thead>
          <tbody>${rows.map((r) => `<tr>
            <td>${esc(r.user_name)}${r.email
              ? ` <span class="muted">· ${esc(r.email)}</span>` : ""}</td>
            <td class="mono">${esc(r.day)}</td>
            <td class="mono">${esc(fmtClock(r.first_seen_at))}</td>
            <td class="mono">${esc(fmtClock(r.last_seen_at))}</td>
            <td class="num">${r.request_count}</td>
          </tr>`).join("")}</tbody>
        </table></div>`}
    ${d.truncated ? `<div class="filterbar-note truncation-note mt-4">
      Showing the <strong>${rows.length}</strong> most recent of <strong>${d.total}</strong>
      rows. The counts above cover all of them.
    </div>` : ""}
    <div class="filterbar-note mt-4">
      <strong>Times</strong> render in the server's timezone; the <strong>Day</strong> column is a
      <strong>UTC</strong> date. That split is deliberate rather than an oversight: the day
      is a stored bucket, computed server-side when the activity was recorded, so
      re-labelling it local would misstate rows already written, and re-bucketing would make
      the same column mean one thing before a deploy and another after. Near midnight a
      session can therefore sit on the following UTC day.
    </div>
    <div class="filterbar-note mt-2">
      <strong>An interaction</strong> is one deliberate action — opening the dashboard,
      switching tab, drilling in, changing a filter — not one HTTP request: the page
      refreshes itself every 60s and counting those measured how long a tab was left open
      rather than whether anyone used it. Reading time is invisible, so a long look at one
      page counts once.
    </div>
    <div class="filterbar-note mt-2">
      <strong>These are not logins either:</strong> the proxy owns this dashboard's session, so
      nothing here records a sign-in to it. Logins to the <strong>cluster</strong> are a separate
      record with a separate source — the oauth-server's own log — and they are on the
      <strong>Logins</strong> tab.
    </div>
  </section>`;
}

/* ── Logins ───────────────────────────────────────────────────────────────────────────────
   Names are the PARSER's vocabulary, restated for a reader. Each string says what happened to
   the person, not what the directory returned: "LDAP Result Code 49" is what the log carries
   and it is not an explanation of anything. `rejected` deliberately covers two cases that the
   log cannot separate — the identity provider's search filter carries the login-gate group, so
   a real person outside that group and a username that does not exist produce byte-identical
   lines. Splitting them here would be an invention. */
const OUTCOME_LABEL = {
  success: "signed in",
  bad_password: "wrong password",
  rejected: "no match",
  password_expired: "password expired",
  must_change_password: "must change password",
  account_locked: "account locked",
  account_disabled: "account disabled",
  account_expired: "account expired",
  logon_not_permitted: "logon not permitted",
  failed: "failed — no reason given",
};

/* Badge severity answers ONE question: who has to act? `critical` is the set an administrator
