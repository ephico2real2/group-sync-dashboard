<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Appearance and colour palette, applied BEFORE the first paint (#152): the URL wins, so a
     shared link opens exactly as the sender saw it, then the reader's stored choice. Blocking and
     tiny on purpose — without it every load would flash the default theme first. Values are
     checked against the allowed set, so a bad query string cannot stamp junk on <html>. -->
<script>
(function () {
  var html = document.documentElement, query = new URLSearchParams(location.search);
  function pick(param, key, allowed) {
    var v = query.get(param) || "";
    if (allowed.indexOf(v) < 0) {   // absent OR junk: the reader's stored choice, if any (Grok, #179)
      try { v = localStorage.getItem(key) || ""; } catch (e) { v = ""; }
    }
    return allowed.indexOf(v) >= 0 ? v : "";
  }
  var mode = pick("mode", "gsd-mode", ["light", "dark"]);
  var palette = pick("theme", "gsd-palette", ["deuter", "protan", "trit", "contrast"]);
  if (mode) html.setAttribute("data-theme", mode);
  if (palette) html.setAttribute("data-palette", palette);
})();
</script>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <title>__GSD_TITLE__</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="home">
<a class="skip" href="#main">Skip to main content</a>
<div class="wrap" id="wrap">
  <header class="top">
    <!-- The title token below is substituted by the / handler from gsd.TITLE, the one place the
         dashboard is named. Not a literal here: this file is one of five that used to carry it. -->
    <h1>__GSD_TITLE__<span id="scope-note"></span></h1>
    <!-- The visibility tier, as /api/whoami reports it. Populated by renderScopePill()
         and hidden until the wire declares a tier: the page labels what the server
         decided and never decides for itself. -->
    <span class="scope-pill" id="scope-pill" hidden></span>
    <span class="spacer"></span>
    <span class="sub" id="build-info"></span>
    <span class="sub" id="last-refresh"></span>
    <!-- Appearance and Colours (#152): global shell state on <html>, so every view inherits
         it by existing. Here in the static header and never in renderFilters(). -->
    <span class="shell-prefs">
      <span class="pref"><label for="pref-mode">Appearance</label>
      <select id="pref-mode">
        <option value="">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select></span>
      <span class="pref"><label for="pref-palette">Colours</label>
      <select id="pref-palette">
        <option value="">Default</option>
        <option value="deuter">Deuteranopia-safe</option>
        <option value="protan">Protanopia-safe</option>
        <option value="trit">Tritanopia-safe</option>
        <option value="contrast">High contrast</option>
      </select></span>
    </span>
    <button id="refresh">Refresh</button>
    <!-- Hidden until /api/whoami confirms there is a session to end. A LINK, not a button:
         it is an ordinary navigation, so middle-click and "open in new tab" behave, and it
         needs no script once rendered. The href comes from whoami rather than being
         hardcoded, so a changed --proxy-prefix cannot leave it pointing at nothing. -->
    <a id="logout" class="btn" hidden>Sign out</a>
  </header>
  <script>
  // The two preference controls: the attribute on <html> is the truth, the select mirrors it.
  // A change writes the attribute, the reader's storage and the URL — replaceState keeps the
  // router's own history.state (its `from` for the back label), so a theme change is never a
  // navigation and never breaks Back.
  (function () {
    var html = document.documentElement;
    function wire(id, attr, param, key) {
      var sel = document.getElementById(id);
      sel.value = html.getAttribute(attr) || "";
      sel.addEventListener("change", function () {
        var v = sel.value;
        if (v) html.setAttribute(attr, v); else html.removeAttribute(attr);
        try { if (v) localStorage.setItem(key, v); else localStorage.removeItem(key); } catch (e) {}
        var u = new URL(location.href);
        if (v) u.searchParams.set(param, v); else u.searchParams.delete(param);
        history.replaceState(history.state, "", u);
      });
    }
    wire("pref-mode", "data-theme", "mode", "gsd-mode");
    wire("pref-palette", "data-palette", "theme", "gsd-palette");
    // Back/Forward restore an entry whose URL predates the change (replaceState rewrote only the
    // current entry), so the address bar dropped ?mode/?theme after one Back and every entry pushed
    // from there inherited the loss (OB1, review of #179). The attributes on <html> are the truth;
    // re-stamp them on the entry the browser just restored. The state object is kept, so the
    // router's own popstate handler reads the same position.
    window.addEventListener("popstate", function () {
      var u = new URL(location.href), changed = false;
      [["mode", "data-theme"], ["theme", "data-palette"]].forEach(function (pair) {
        var v = html.getAttribute(pair[1]) || "";
        if ((u.searchParams.get(pair[0]) || "") !== v) {
          if (v) u.searchParams.set(pair[0], v); else u.searchParams.delete(pair[0]);
          changed = true;
        }
      });
      if (changed) history.replaceState(history.state, "", u);
    });
  })();
  </script>

  <div class="filters" id="filters"></div>
  <main id="main"></main>
</div>

<!-- The idle-timeout countdown (docs/DESIGN_session_and_signout.md, "Idle timeout"). Static
     markup outside #main and #filters, so no repaint ever replaces it; hidden until the idle
     model says otherwise, and inert-ing #wrap while open is the focus trap. -->
<div id="idle-modal" class="idle-backdrop" hidden>
  <div class="idle-dialog" role="dialog" aria-modal="true" aria-labelledby="idle-title"
       aria-describedby="idle-desc">
    <h2 id="idle-title">Still there?</h2>
    <p id="idle-desc">Nothing has been touched for a while. So that the access data on this screen
      is not left unattended, this session signs out in
      <strong><span id="idle-countdown">–</span> seconds</strong> unless you continue.
      Press Escape or Enter to stay signed in.</p>
    <p class="sr-only" id="idle-live" aria-live="polite"></p>
    <div class="idle-actions">
      <button type="button" id="idle-stay">Stay signed in</button>
      <a id="idle-signout" class="btn" href="#">Sign out now</a>
    </div>
  </div>
</div>

<!-- #143: the namespace-access preview's "which namespaces" list. Static markup next to the idle
     modal for the same reason the idle modal is static: render() repaints #main on every poll, and
     removing an open modal <dialog> from the document closes it mid-read. A NATIVE <dialog> shown
     with showModal(): the top layer means the report form below cannot reflow (the "no resize"
     requirement), and focus trap, Escape and focus-return-to-opener come from the platform —
     no inert shim here, unlike the idle modal. Filled at open time from view.reportPreviewNames. -->
<dialog id="ns-preview" class="ns-preview" aria-labelledby="ns-preview-title">
  <h2 id="ns-preview-title">Matched namespaces</h2>
  <p class="muted" id="ns-preview-count"></p>
  <ul id="ns-preview-list"></ul>
  <p class="muted" id="ns-preview-more" hidden></p>
  <form method="dialog" class="idle-actions">
    <button id="ns-preview-close">Close</button>
  </form>
</dialog>

<script>
"use strict";

const STATES = {
  ok:      { label: "ok" },
  late:    { label: "late" },
  overdue: { label: "overdue" },
  unknown: { label: "unknown" },
};

const view = { page: "home", homeShow: {}, cluster: null, groupsync: null, groupFilter: "all", bindingFilter: "review",
                report: null, reportLanded: null, reportFocusRow: null, reportForm: {},
                kyvernoControlled: false, kyvernoPolicy: null, kyvernoKind: null,   // #170: the Kyverno page's filters (filters, not positions)
                /* #230 S2: the Cluster Configurations form's state, so a poll's repaint never destroys what the
                   reader typed; the open rotate panel; the armed delete; the messages under the form and the cards. */
                clusterForm: { name: "", server: "", token: "", caMode: "caData", caPem: "", visibility: "self-only", identity: "none",
                               labels: {}, labelKey: "", labelVal: "", test: null },
                clusterRotate: null, clusterDeleteArmed: null, clusterMsg: {}, clusterCreating: false,
                run: null,   // #229: the Library page's open run — a position (`#page=library&run=<id>`), like `report` on Reports
                libraryOpen: {},   // #229: which "all N →" lists are expanded — view state, not a position
                /* #149 R5: the status page's history filters and page. Filters, not positions (the
                   groupFilter reasoning): a shared link opens the page, not a filtered slice of it. */
                historyFilter: { report: "", origin: "", status: "", cluster: "" }, historyPage: 0, reportRun: null, reportSubmitting: false, reportPreview: "",
                /* #267: the form's cluster control. `reportClusters` is the set to run on — null means the nav's
                   cluster alone; an array always holds it (the primary: its lookups, its totals). View state, not
                   a position: the URL carries the nav's cluster, the extra targets are the form's, like a draft.
                   `reportBatch` is a several-cluster submission's runs; `reportClusterNote` what a cluster change cleared. */
                reportClusters: null, reportBatch: null, reportClusterNote: null,
                reportPreviewNames: [], reportPreviewCount: null,   // #143: the names behind the count
                /* Free-text group search. A FILTER, so it lives here rather than in POSITION_KEYS —
                   same reasoning as groupFilter: it narrows what a page shows, it is not a place, and
                   a history entry per keystroke would bury every position Back exists to reach. */
                groupSearch: "",
                /* Free-text user search on the Users tab. The same kind of thing as groupSearch, kept
                   for the same reasons; it persists across tab switches like groupSearch does. */
                userSearch: "",
                /* Access granted: free-text filter over group, role, namespace and binding name, and
                   the column sort. Filters, not positions, like the boxes above. */
                bindingSearch: "", bindingSort: "group", bindingDir: "asc",
                /* Users-tab chip filter: "all" | "grouped" | "nogroup" | "provider:<name>". A filter,
                   not a position, for the same reasons as userSearch. showNeverNames expands the
                   never-logged-in members line. */
                userFilter: "all", showNeverNames: false,
                /* Free-text filter over ONE group's members, on the group detail page. Per group:
                   applyPosition() clears it whenever the group changes, so a reader who narrowed one
                   group's members does not arrive at the next group already filtered — but a poll
                   repaint, which never touches position, keeps it. */
                memberSearch: "",
                group: null, user: null,
                /* Namespace-audit controls. They live HERE and not in the DOM because the
                   page repaints on every poll: state held in the markup would silently
                   reset a chosen sort or filter under the reader every 60 seconds, which
                   reads as the page fighting them. */
                nsNamespace: "all", nsSort: "risk", nsDir: "desc",
                nsGrantSort: "risk", nsGrantDir: "desc",
                nsSearch: "",   // #167: the namespace list's pattern box; a preference, never a position
                /* #257: platform namespaces (openshift-*, kube-*, and the five named ones) are
                   HIDDEN by default — 67 of 106 on the reference cluster, so two thirds of the
                   index was platform noise under a five-row worklist. A preference like the box
                   above: the poll repaint must not restore them under a reader who hid them. */
                nsShowPlatform: false,
                /* #261, from the agreed mock. The index is the largest thing on this page — 106 rows
                   under a five-row worklist, 3,619 px of a 5,153 px document — so it folds, it has a
                   search of its own beside it, and it pages. All three are preferences like the box
                   above: a 60s repaint must not reopen a section the reader folded or move their page.
                   `nsIndexOpen: null` means "decide by the size of the estate" (see INDEX_FOLD). */
                nsIndexSearch: "", nsIndexOpen: null, nsIndexPage: 1,
                lookupSearch: "",   // #174: the one box over all three kinds; carried across "see all matches"
                /* Namespaces whose full exposed-user list is expanded. In `view` like every
                   other control on this page, so a 60s poll repaint does not collapse a list
                   the reader just opened. */
                nsWhoOpen: new Set(),
                /* Closed on arrival. The per-namespace rollup is the view that answers the
                   question; the flat list is a detail nobody reads end to end, and on a
                   cluster with thousands of grants rendering it unasked is time spent to
                   produce a page the reader scrolls past. Opening it is one click, and
                   choosing a namespace opens it automatically. */
                /* Logins outcome filter. A FILTER, so it lives here rather than in
                   POSITION_KEYS: the same reasoning as groupFilter and the namespace picker —
                   it narrows what a page shows, it is not a place, and an entry per change
                   would bury the positions Back exists to reach. */
                loginOutcome: "all",
                nsGrantsOpen: false };
/* Id of the search box with a live IME composition, or null. Module-level rather than on the element,
   because the element this bar renders is replaced wholesale — state on the node would vanish with it,
   which is the exact failure this slot exists to prevent. An ID rather than a boolean: at most one box
   exists at a time, and the guard in renderFilters() compares it against the focused element, so a
   slot left behind by a box that has since been unrendered (Back pressed mid-composition) can never
   freeze the bar. */
let searchComposingIn = null;

/* ── Navigation: the browser's history IS the trail ──────────────────────────────────────
   This used to be a private `trail` array with its own push/pop, which meant the in-page Back
   button worked and the browser's Back button left the dashboard entirely — losing the reader's
   whole position, because none of it was in the URL.
   ONE STACK, not two. The in-page button now calls history.back(), so both buttons walk the
   same list and cannot disagree. A second private stack alongside the browser's would diverge
   the moment someone mixed the two (browser-back twice, then in-page-back), and the label would
   then describe a position the click does not go to.
   POSITION ONLY, not every control. page/cluster/groupsync/group/user are a location — worth a
   URL, worth sharing, worth a history entry. The filters and the namespace-audit sort/expand
   state are not: they live in `view` precisely because the page repaints on a timer (60s), one of them
   is a Set, and pushing an entry per sort click would bury the positions a reader wants Back to
   reach under a pile of them. */
const POSITION_KEYS = ["page", "cluster", "groupsync", "group", "user", "ns", "report", "run"];

function currentPosition() {
  const pos = {};
  for (const k of POSITION_KEYS) if (view[k]) pos[k] = view[k];
  return pos;
}

/* A HASH, deliberately, not a path. Only `/` serves this page — there is no catch-all route —
   so `/groups/x` would 404 on a refresh or a pasted link. A hash needs no server change and
   survives both. */
function hashFor(pos) {
  const p = new URLSearchParams();
  for (const k of POSITION_KEYS) if (pos[k]) p.set(k, pos[k]);
  const s = p.toString();
  return s ? `#${s}` : "";
}

function positionFromHash() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  const pos = {};
  for (const k of POSITION_KEYS) {
    const v = p.get(k);
    if (v) pos[k] = v;
  }
  return pos;
}

function applyPosition(pos) {
  // Assigned rather than merged: an absent key means "not at that position", so leaving the
  // old value would strand a drill-down open after Back returned to the list behind it.
  view.page = pos.page || "home";   // #158: Home is where every reader lands
  view.groupsync = pos.groupsync || null;
  // The member filter belongs to the group it was typed against. Compared before the assignment,
  // so leaving the page, drilling to another group, and Back into a different one all clear it.
  if ((pos.group || null) !== view.group) view.memberSearch = "";
  view.group = pos.group || null;
  view.user = pos.user || null;
      view.ns = pos.ns || null;   // #167: the namespace page, the third drill-down peer
  // #173: a selected report is a position (`#page=reports&report=<key>`): a link opens its form, Back
  // closes it. It belongs to the Reports page the way a group belongs to the Groups page: any other
  // page's position carries none — so leaving the tab closes the form, the next page's URL and its
  // `from` are clean, and no other page's back control can name a report (review of #218: `&report=`
  // rode on every later position, the Reports tab reopened the form, and a group's own back control
  // read "← Groups and membership changes"). A different report drops the previous run's status — it
  // belongs to the form it ran from — and closes the names dialog, which describes a selection no
  // longer on screen: the #144 C6-D rule, whose guard below fires on a page change only.
  const nextReport = view.page === "reports" ? (pos.report || null) : null;
  if (nextReport !== view.report) { view.reportRun = null; view.reportBatch = null; closeNsPreview(); }
  view.report = nextReport;
  // #229: an open run belongs to the Library page the same way — no other page's position carries one
  view.run = view.page === "library" ? (pos.run || null) : null;
      view.alertPage = 1;   // #172: the alerts card's page is view state, never a position
  // `cluster` is part of the position, not context around it. Without it, Back after a cluster
  // switch restores a group name against whichever cluster is now selected — and group names
  // repeat across clusters, so it silently shows a DIFFERENT object under the name you
  // expected, or 404s. Only overwritten when the entry carries one, so an entry predating
  // cluster selection does not blank it.
  // The cluster this position implies: its own, or — on the fleet, where an absent cluster IS the position
  // (#172) — none. Computed before the drop because the drop's question is "is this a different cluster
  // from the one whose payloads I am holding?", and toward the fleet the answer used to go unasked.
  const nextCluster = (view.page === "overview" && !view.groupsync && !pos.cluster) ? null : (pos.cluster || view.cluster);
  if (nextCluster !== view.cluster || pos.cluster) {
    // A cluster switch orphans every cluster-scoped payload in `data`. The tab handler
    // paints BEFORE it fetches, so leaving them in place would put cluster A's rows on
    // screen under cluster B's title for the length of a fetch. Dropped, the same paint
    // shows each page's own Loading state, which is true. This is the chokepoint: the
    // selector, popstate and hashchange all arrive here, so no path can skip it.
    // Cross-cluster payloads (clusters, alerts, whoami, version, usage) survive — they
    // answer for every cluster or for none.
    // From NO cluster as well (#172): the fleet view leaves view.cluster null, so a tile opened
    // after a scoped visit is a cluster change too — guarded on `view.cluster &&`, crc-local's
    // groups painted under " - prod-east" on the next tab click (measured, OB1 review).
    // TO the fleet as well as between clusters: the drop sat under `if (pos.cluster)`, which the fleet
    // never satisfies, so leaving a scoped page for the Overview tab and returning to that page painted
    // the PREVIOUS cluster's rows under the boot cluster's position for the length of the fetch —
    // prod-east's two groups under `#page=groups&cluster=crc-local` (OB3, integration review, C2).
    if (nextCluster !== view.cluster) {
      data.groupsyncs = null; data.groups = null; data.groupsMeta = null;
      data.group = null; data.user = null; data.events = null; data.users = null;
      data.logins = null; data.access = null; data.findings = null;
      data.operatorConfigs = null; data.userBindings = null; data.myAccess = null;
      data.namespaces = null; data.ns = null;
      data.kyverno = null; view.kyvernoPolicy = null; view.kyvernoKind = null;   // #170: a policy name is this cluster's
      data.home = null;   // #158: the answer is the selected cluster's
      // The Users-tab chips name providers and populations of THIS cluster; carried across, a
      // `provider:corp-ldap` chip on a cluster with no such provider would hide every row — the
      // empty state would blame the chip, but the reader never chose it here. Reset, like
      // memberSearch on a group change; the free-text search is a person, and persists.
      view.userFilter = "all"; view.showNeverNames = false;
      // The selector choices are THIS cluster's captured label values (B3, review #117 C4; P2 selectors):
      // carried across, a cluster-A value would be posted against cluster B — a failed run, or a hidden
      // XOR 422 if the reader then typed explicit names. Drop them; the explicit names are the reader's text.
      // #267 widens the rule to every lookup-sourced field of every form (the lookups are keyed per cluster:
      // a role picked on A may not exist on B) and RECORDS what went, so the form says it rather than
      // carrying a stale value silently. The form's multi-select follows the nav again.
      dropClusterBoundFields(view.cluster, nextCluster);
      view.reportClusters = null;
      clearReportPreview();   // and invalidate any in-flight #107 GET for the cluster we just left
      // Same reasoning for the Access granted search: it names this cluster's groups and
      // namespaces. The sort is a preference, not a cluster fact, and stays.
      view.bindingSearch = "";
      view.nsSearch = "";
      // The index's own controls are about THIS cluster's list (#264, Cursor C4): a search, a
      // page and a fold chosen on one estate mean nothing on the next.
      view.nsIndexSearch = ""; view.nsIndexOpen = null; view.nsIndexPage = 1;
    }
    if (pos.cluster) view.cluster = pos.cluster;
  }
  // #172: on the Overview an absent cluster is the fleet view, so it is NOT left alone there —
  // Back from a tile must land on the fleet, and the Overview tab opens it. Every other page
  // keeps the rule above (a bare #page=groups keeps the cluster the reader had).
  view.cluster = nextCluster;
  // #144 adversarial review C6-D: history Back is not inert while a modal is up, and only the
  // cluster branch above clears the preview. A same-cluster Back from Reports to another tab
  // repainted #main under a still-open names dialog — "N namespaces match this selection"
  // floating over a page that carries no selection. Every position change arrives here (the
  // chokepoint above), so close it here; a closed dialog makes this a no-op.
  if (view.page !== "reports") closeNsPreview();
}

/* Every position change goes through here, so the URL, the history entry and `view` can never
   disagree — the previous design let a caller mutate `view` and forget the trail push, and the
   two tab/cluster handlers did exactly that, which is why browser-Back had nothing to retrace.
   `from` is stored WITH the entry because push time is the only moment we reliably know where
   the reader came from: the History API exposes no entry but the current one. Storing it also
   keeps the label right after a Forward, which a stack-based label never was. */
function navigate(changes, { replace = false } = {}) {
  const from = currentPosition();
  applyPosition({ ...from, ...changes });
  const pos = currentPosition();
  // An unchanged position REPLACES rather than pushes. Re-selecting the tab you are already on,
  // or the cluster already chosen, otherwise stacked an identical entry: Back then appeared to do
  // nothing, and with two such entries the button oscillated instead of leaving.
  const unchanged = hashFor(pos) === hashFor(from);
  const keepFrom = replace || unchanged;
  const state = { pos, from: keepFrom ? (history.state && history.state.from) || null : from };
  const url = hashFor(pos) || location.pathname + location.search;
  if (keepFrom) history.replaceState(state, "", url);
  else history.pushState(state, "", url);
}

function backTarget() {
  return (history.state && history.state.from) || null;
}

function goBack() {
  // A pasted link straight to a drill-down has no `from`: there is nowhere in THIS app to go
  // back to, and history.back() would leave the dashboard. Rise to the natural parent instead,
  // which is a position the reader can then Back out of normally.
  if (backTarget()) { history.back(); return; }
      // #172: from a cluster opened by link, the parent is the fleet view. The rise REPLACES the pasted
      // entry: there was nothing behind it in this app, and a pushed entry would make the parent's own
      // back control point at the drill-down the reader just rose from.
      const toFleet = view.page === "overview" && view.cluster && !view.groupsync;
      // #149: the Reporting status page's parent is the Reports page it is linked from.
      const toReports = view.page === "reporting";
      navigate({ group: null, user: null, groupsync: null, ns: null, report: null,
                 ...(toFleet ? { cluster: null } : {}), ...(toReports ? { page: "reports" } : {}) }, { replace: true });
  refresh();
}

/* What each section is CALLED, for the back button. A map rather than a chain of ternaries
   because the label has to name the page the button actually opens: with drill-downs now
   reachable from Access granted, RBAC policy and Logins, "← overview" was about to start
   appearing on a button that returns to one of those three. The tab bar's own wording, lower-cased
   — a reader matches the label to a tab, so a second vocabulary for the same six places would be
   its own small lie. */
const PAGE_LABEL = {
  home: "home", overview: "overview", groups: "all groups", users: "all users", bindings: "access granted",
  policy: "RBAC policy", nsaudit: "namespace audit", logins: "logins", usage: "usage",
  reports: "reports", reporting: "reporting status", lookup: "search", kpi: "KPIs",
};

function backLabel() {
  const prev = backTarget();
  // #172: a cluster opened from its tile goes back to the fleet, whichever entry stands behind it.
  if (view.page === "overview" && view.cluster && !view.groupsync && (!prev || !prev.cluster)) return "← all clusters";
  if (!prev) {
    // Nothing to return to — a pasted link. goBack() rises to the PARENT of where we are, so the
    // label has to describe that rather than a fixed string: on a GroupSync detail reached by
    // link, "all groups" named a page the button does not open.
    if (view.page === "reporting") return "← reports";   // #149: the status page's parent
    if (view.report) return "← all reports";   // #173: the parent of a report is the catalogue
    return `← ${PAGE_LABEL[view.page] || "overview"}`;
  }
  // #173: on the Reports page, the previous position was another report's form, or the catalogue.
  if (view.page === "reports" && prev.report) return `← ${esc(reportTitle(prev.report))}`;
  if (view.page === "reports" && view.report && prev.page === "reports") return "← all reports";
  // esc() on every one of these. They now arrive from the URL as well as from the cluster, and
  // this string is written into innerHTML by four callers — so a crafted hash plus one ordinary
  // click ran script in the reader's session. Reproduced with
  // `#groupsync=<img src=x onerror=...>`; the sink is old, the URL as a source is what this
  // branch added.
  if (view.ns && prev.page === "nsaudit" && !prev.ns) return "← all namespaces";
  if (prev.ns) return `← ${esc(prev.ns)}`;
  if (prev.user) return `← ${esc(prev.user)}`;
  if (prev.group) return `← ${esc(prev.group)}`;
  if (prev.groupsync) return `← ${esc(prev.groupsync)}`;
  return `← ${PAGE_LABEL[prev.page] || "overview"}`;
}

/* Restores the position the reader navigated to. `event.state` is absent when the hash was
   edited by hand or the entry predates this feature, so the hash is the fallback — it holds
   the same position, just without the `from` that labels the in-page button. */
window.addEventListener("popstate", (event) => {
  // Browser Back is not inert: while the countdown is up or the page has expired it must not
  // fetch (review of C4) — but it MUST still apply the position the browser moved to, or the
  // view stays on one page while the address bar names another (review of C4, second pass).
  const suspended = typeof idleSuspended === "function" && idleSuspended();
  if (event.state && event.state.pos) {           // ordinary Back/Forward
    applyPosition(event.state.pos);
    if (!suspended) refresh();
    return;
  }
  // No state: either an entry predating this feature, or an IN-PAGE ANCHOR. Setting location.hash
  // is a same-document navigation and fires popstate as well as hashchange — so "Skip to main
  // content" (#main) arrived here first and applyPosition({}) reset the reader to Overview. The
  // guard has to be in BOTH handlers; putting it only in hashchange left the regression intact,
  // which is how the test caught it.
  const pos = positionFromHash();
  if (location.hash && Object.keys(pos).length === 0) return;
  applyPosition(pos);
  if (!suspended) refresh();
});

/* A hash typed or pasted into the URL bar of a tab already showing this page is a SAME-DOCUMENT
   navigation: the browser creates a history entry and fires this, but does not reload, so the
   boot code below never re-runs and that new entry carries no state. Without this the page would
   sit on the old position while the URL claimed a new one.
   The guard is for ordering, not paranoia: back/forward across two hash entries fires popstate
   FIRST — with state — and hashchange after it, so bailing out when the entry already has a
   position avoids doing the work twice and re-rendering on top of a correct render. */
window.addEventListener("hashchange", () => {
  if (history.state && history.state.pos) return;
  const pos = positionFromHash();
  // An IN-PAGE ANCHOR is not a position. "Skip to main content" navigates to `#main`, which
  // parses to zero keys — and applying that reset page to overview and nulled the drill-down,
  // so the keyboard affordance threw the reader back to Overview. A hash with no recognised key
  // is somebody else's anchor; leave it alone.
  if (location.hash && Object.keys(pos).length === 0) return;
  applyPosition(pos);
  // `from: null` is the truth here, and it is what makes goBack() rise to the parent instead of
  // calling history.back() into whatever preceded the dashboard.
  history.replaceState({ pos: currentPosition(), from: null }, "", location.hash);
  // A hash edit is not inert either: while the countdown is up it must not fetch (review of C4).
  if (!(typeof idleSuspended === "function" && idleSuspended())) refresh();
});
// null for the cluster-scoped payloads means "this cluster has not answered yet", and the
// page functions render a Loading state for it. It is NOT the same as [] — with the tab
// handler painting before it fetches, an empty array here made the first click on Groups
// flash "No groups match this filter" for the length of the fetch, a false claim about a
// cluster nobody had asked yet.
let data = { clusters: [], alerts: [], groupsyncs: null, groups: null, events: null,
             kyverno: null,   // #170: the module's payload for the selected cluster
             clusterconfigs: null,   // #230 S2: every cluster with its source, for the Cluster Configurations tab
             reportCatalog: null, reportRuns: null, reportTicket: null,
             library: null,   // #229: every run the service holds, for the Library tab
             libraryRun: null,   // #229: the positioned run by id — a history past the listing's page still opens (Codex)
             group: null, user: null, logins: null, access: null,
             /* The /users envelope whole — rows, scope, viewer, truncated, limit — because the
                Users tab states the truncation and renders the banner from the wire's fields. */
             users: null,
             /* Identity + tier as the server reports them (whoami), and the scope the
                groups response declared. Rendering reads these; nothing writes them but
                the wire. */
             whoami: null, groupsMeta: null,
             /* The narrowed reader's own access path on the Access granted tab (their /users/{me}
                payload). Its own slot, not `user`: the user detail page owns `user` and a drill
                from this tab to their own profile must not race two writers into one slot. */
             myAccess: null,
             /* Home (#158): the reader's own access on the selected cluster — the page's whole payload,
                derived server-side (gsd/home.py) so a number and its label change together. */
             home: null };

const $ = (id) => document.getElementById(id);

/* `mark` stamps this request as a human action for the usage counter. Exactly one request
   per user-initiated refresh carries it — see refresh(). Without that the counter measures
   the auto-refresh (60s), which fires whether or not anyone is looking: four to six API
   calls a minute is hundreds of requests an hour from a tab left open on an empty desk. */
async function api(path, mark) {
  const headers = { Accept: "application/json" };
  if (mark) headers["X-GSD-Interaction"] = "1";
  const res = await fetch(path, { headers });
  /* A DEAD SESSION DOES NOT LOOK LIKE AN ERROR. When the proxy cookie expires the proxy answers
     302 to the login page, and fetch FOLLOWS that by default — so this arrives as a perfectly
     good 200 whose body is HTML. res.json() then fails with a syntax error about an unexpected
     "<", which reads as a bug in the dashboard rather than the end of a session. Recognised
     here, once, so every caller inherits it. */
  if (res.redirected || !(res.headers.get("Content-Type") || "").includes("json")) {
    const err = new Error("the dashboard session has ended");
    err.sessionEnded = true;
    throw err;
  }
  if (!res.ok) {
    // The status rides on the error so a caller can tell a DESIGNED refusal from a fault.
    const err = new Error(`${res.status} ${res.statusText} on ${path}`);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

/* The zone every absolute time on this page is rendered in.
   The SERVER's zone, not the browser's. Two reasons. The logs are stamped in the container's
   zone, so matching it means a log line and a dashboard row can be compared by reading them
   rather than by doing arithmetic. And every viewer sees the same numbers, so "the sync
   failed at 17:31" means one instant in a conversation between two people in two countries.
   Falls back to UTC when the server reports no zone — an explicit UTC beats a guess. */
let displayZone = null;   // IANA name, or null for UTC
let displayAbbrev = "Z";  // what we print after the time

function setDisplayZone(tz) {
  if (!tz || !tz.name) { displayZone = null; displayAbbrev = "Z"; return; }
  try {
    // Prove the browser knows this zone before adopting it. An unknown IANA name makes
    // Intl throw, and a page that throws on its first timestamp is worse than one showing
    // UTC — this is exactly the tab-renderer blindness that hid two bugs before.
    new Intl.DateTimeFormat("en-CA", { timeZone: tz.name }).format(new Date());
    displayZone = tz.name;
    displayAbbrev = tz.abbrev || tz.name;
  } catch (e) {
    displayZone = null;
    displayAbbrev = "Z";
  }
}

/* Absolute time, in the display zone, always carrying its zone label.
   The label is not optional: the same wall-clock string means different instants in
   different zones, and this page is read next to `oc` output and log lines that may be in
   another. Unlabelled local time is the bug this replaced, not the fix. */
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  if (!displayZone) {
    return d.toISOString().replace("T", " ").replace(/\.\d+Z$/, "Z");
  }
  // en-CA gives YYYY-MM-DD, which sorts and scans like the ISO form it replaces.
  //
  // timeZoneName comes from the FORMATTER, not from the server, and that is a correctness
  // point rather than a style one. The abbreviation depends on the instant: 2026-01-15 in
  // America/New_York is EST and 2026-07-15 is EDT. The server can only report the zone as
  // it stands right now, so stamping that on every row would mislabel every timestamp on
  // the other side of a DST boundary. The browser ships the full IANA database, so asking
  // it per-timestamp is both correct and free.
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: displayZone, hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    timeZoneName: "short",
  }).formatToParts(d).reduce((a, p) => (a[p.type] = p.value, a), {});
  return `${parts.year}-${parts.month}-${parts.day} ` +
         `${parts.hour}:${parts.minute}:${parts.second} ` +
         `${parts.timeZoneName || displayAbbrev}`;
}

/* Just the clock, in the display zone. For tables where the date is already a column.
   Shares displayZone with fmtTime rather than slicing the ISO string, which is what the
   Usage panel used to do — `.slice(11, 19)` reads the raw UTC hour, so that one table stayed
   on UTC while every other time on the page moved to the container's zone. */
function fmtClock(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  if (!displayZone) return iso.slice(11, 19) + "Z";
  // timeZoneName per instant, like fmtTime — the abbreviation depends on the date being
  // formatted, so January is EST where July is EDT and the server's current zone cannot
  // speak for both.
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: displayZone, hour12: false,
    hour: "2-digit", minute: "2-digit", second: "2-digit", timeZoneName: "short",
  }).formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  return `${parts.hour}:${parts.minute}:${parts.second} ` +
         `${parts.timeZoneName || displayAbbrev}`;
}

function ago(iso) {
  if (!iso) return "never";
  const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (!isFinite(secs)) return "—";
  // A future instant reads "in 40m". The first cut recursed on a mirrored ISO string, which is STILL
  // in the future, so any value ahead of the browser's clock — a store stamped by a host whose clock
  // runs ahead, a fixture's stamp — blew the stack and took the whole page with it (#170, measured:
  // "Maximum call stack size exceeded" for a 40-minute lead).
  const n = Math.abs(secs);
  const word = n < 60 ? `${n}s` : n < 3600 ? `${Math.floor(n / 60)}m` : n < 86400 ? `${Math.floor(n / 3600)}h` : `${Math.floor(n / 86400)}d`;
  return secs < 0 ? `in ${word}` : `${word} ago`;
}

function badge(state) {
  const s = STATES[state] ? state : "unknown";
  return `<span class="badge ${s}"><span class="glyph" aria-hidden="true"></span>${STATES[s].label}</span>`;
}

/* Severity and CR-state are different vocabularies and must not borrow each other's
   words: an auth_failed cluster is `critical`, it is not "overdue". The label is the
   channel a colourblind reader actually reads, so a wrong label is a real defect. */
function sevBadge(severity, label) {
  const s = severity === "critical" ? "critical" : "warning";
  return `<span class="badge ${s}"><span class="glyph" aria-hidden="true"></span>${esc(label || s)}</span>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* Colour follows the entity, not its rank. The slot is derived from the CR's position in
   the full sorted CR list, so filtering the group table down to one owner never repaints
   the survivors — a reader who learned "ldap-groupsync is blue" keeps that. */
function crSlot(provider) {
  if (!provider) return null;
  // flatMap, because a CR with several providers owns several label values and each needs
  // its own slot — colouring by CR would give two visibly different provider groupings the
  // same dot and hide exactly the distinction the colour exists to draw.
  const owners = (data.groupsyncs || []).flatMap((g) => g.provider_keys || []).filter(Boolean).sort();
  const i = owners.indexOf(provider);
  if (i < 0) return null;
  // Never generate a 9th hue: past the 8 slots, identity folds into the text alone.
  return i < 8 ? i + 1 : null;
}

function ownerCell(provider) {
  if (!provider) return `<span class="err">unattributed</span>`;
  const slot = crSlot(provider);
  const dot = slot
    ? `<span class="cr-dot" style="background:var(--series-${slot})" aria-hidden="true"></span>`
    : "";
  // Strip the "_<provider>" suffix for display; the full value stays in the group detail.
  const label = provider.replace(/_[^_]+$/, "");
  return `<span class="owner">${dot}<code>${esc(label)}</code></span>`;
}

/* ---------- rendering ---------- */

/* ── Visibility: the tier as the WIRE declares it ─────────────────────────────────────────
   The server decides who sees everything and who sees only their own slice, and every
   scoped response says which it did (`scope` + `viewer` — the /api/dashboard/activity
   contract, generalised). Everything below RENDERS those declarations and decides
   nothing: this page once shipped a search box that claimed credit for hiding rows it was
   not hiding, and a banner that guessed at the tier would be that defect with security
   consequences. No declaration on the wire, no label on the page. */

/* Absorb a DESIGNED 403 into a marker the renderer can phrase — the Usage tab's pattern
   for its proxy-off refusal, generalised. Only 403: a 500 is a fault and must still look
   like one. */
async function guard403(promise) {
  try { return await promise; }
  catch (e) {
    if (e.status !== 403) throw e;
    return { forbidden: true };
  }
}

/* Header pill: the one place the ADMINISTRATOR is told they are seeing everything. A
   narrowed reader gets per-tab banners as well; the wide reader gets only this, because
   "nothing looks different" and "you are seeing everything" are different statements and
   only the second is checkable from the screen. Driven by whoami's `visibility`, which
   the server computes — hidden entirely when the wire declares nothing (an older build,
   or no authenticated identity worth reporting). */
function renderScopePill() {
  const pill = $("scope-pill");
  if (!pill) return;
  const w = data.whoami;
  const vis = w && w.authenticated && w.visibility;
  if (!vis) { pill.hidden = true; pill.textContent = ""; return; }
  // The SELECTED cluster's decision when whoami carries one, the headline otherwise: the
  // pill sits above a cluster-scoped page and must describe that cluster's view.
  const forCluster = vis.clusters && view.cluster && vis.clusters[view.cluster];
  // `!== "all"`, the same fail-closed rule as narrowedFor: a missing or junk scope painted
  // "Full view" above a layout that was narrowed (review of D2, Codex).
  const self = (forCluster ? forCluster.scope : vis.scope) !== "all";
  pill.hidden = false;
  pill.classList.toggle("self", self);
  pill.classList.toggle("full", !self);
  // textContent, not innerHTML: the username is caller-adjacent data and this element
  // needs no markup, so the cheapest sink is also the safe one.
  pill.textContent = self
    ? `Your view — ${w.user}`
    : (vis.enabled === false
        ? "Full view — restrictions are off for this deployment"
        : "Full view — you are seeing everything");
  // The narrowed tooltip says WHAT is scoped and stops there. It used to add "the grant that
  // widens a view is documented in the chart README", removed for the reason refusalCard
  // records: this text is read by the person being scoped down, who cannot reach the chart and
  // should not be handed the name of the permission that would lift the restriction.
  pill.title = self
    ? "Every list here is scoped to you on the server: your groups, your grants, your "
      + "sign-in attempts. Some views are for administrators only."
    : (vis.enabled === false
        ? "Per-reader scoping is switched off here, so every authenticated reader sees "
          + "everything — a deliberate choice for this cluster, not a grant your account holds."
        : "Your account holds the cluster permission this deployment treats as the "
          + "administrator tier, so nothing here is scoped down.");
}

/* Per-tab wording for a narrowed view: one sentence naming WHAT is scoped and to WHOM. A
   page that silently shows two rows where an administrator sees two hundred invites the
   reader to conclude the cluster is nearly empty (requirements Q6), so the banner sits at
   the top of the lead card, above the data it qualifies — the Usage tab's shipped
   position. Rendered ONLY when the response itself declares scope=self. */
const SCOPE_BANNER = {
  groups: (v) => `Showing only the groups <strong>${esc(v)}</strong> belongs to. The
    cluster-wide list is the administrator tier.`,
  users: (v) => `Showing only your own row, <strong>${esc(v)}</strong>. The cluster-wide user
    list is the administrator tier.`,
  access: (v) => `Showing the access that reaches <strong>${esc(v)}</strong> through your groups.
    The cluster-wide list — every group's grants — is the administrator tier.`,
  logins: (v) => `Showing only sign-in attempts recorded for <strong>${esc(v)}</strong>.
    Attempts are recorded under the name <em>as typed</em>, so an attempt typed with
    different capitalisation is a different name and is not shown here.`,
  grants: (v) => `Showing only roles granted directly to <strong>${esc(v)}</strong>. The
    per-namespace audit of everyone's grants is the administrator tier.`,
};

function scopeBanner(kind, d) {
  if (!d || d.scope !== "self") return "";
  const words = SCOPE_BANNER[kind];
  if (!words) return "";
  return `<div class="filterbar-note scope-banner">${words(d.viewer || "you")}</div>`;
}

function readerTierKnown() {
  return data.whoami !== null;
}

/* Is this reader on the narrowed tier? Read from whoami's server-computed `visibility`,
   the same source renderScopePill uses — the page still never DECIDES a tier, it only
   reports the one the wire declared. Missing whoami is indeterminate until the request
   resolves. A resolved unauthenticated response has no verified identity and therefore no
   tier; calling that narrowed would hide the Overview on a deployment that never restricted
   anything. Once authenticated, only an explicit scope=all may widen the layout — silence or
   junk from an authenticated response stays narrowed. */
/* Per cluster when the wire says so: whoami's `visibility.clusters[id].scope` is the decision
   for THAT cluster, and a reader wide on the host may be narrow on a remote. Silence or a
   missing entry stays narrowed, as before. */
function scopeFor(w, cluster) {
  const vis = w && w.visibility;
  if (!vis) return null;
  const c = vis.clusters && cluster && vis.clusters[cluster];
  return c ? c.scope : vis.scope;
}
function narrowedFor(w) {
  if (!w || !w.authenticated) return false;
  return scopeFor(w, view.cluster) !== "all";
}
function narrowedReader() {
  const w = data.whoami;
  if (!w || !w.authenticated) return false;
  return scopeFor(w, view.cluster) !== "all";
}
/* The HOST's decision, whatever cluster is selected: reports are documents over the whole
   snapshot, minted by /api/report/ticket on the host's tier — so the Reports tab must not refuse a
   host administrator who happens to have a narrowed remote selected (review of D2, Cursor). */
function narrowedOnHost() {
  const w = data.whoami;
  if (!w || !w.authenticated) return false;
  return scopeFor(w, null) !== "all";
}

/* A withheld view is a NAMED refusal, never a blank: an empty audit tab reads as a healthy
   cluster, which is a lie of layout. So it says what exists and that it is reserved — and
   deliberately NOT how to obtain it.

   It used to name the widening grant (stock `cluster-reader`) and point at the chart README.
   Both were removed on the operator's instruction, and the reasoning is worth keeping: this
   card renders for the person being REFUSED. They cannot read the chart, they cannot grant
   themselves anything, and naming the role that would widen their access turns a refusal into
   a shopping list — an escalation path advertised to exactly the reader it is withheld from.
   Worse, `cluster-reader` was the wrong role to advertise even to an operator: it satisfies
   the default check as a side effect of granting cluster-wide read on everything.

   The configurable check lives in `visibility.adminSar` and is documented in the chart values
   and README, which is where an operator looks and a reader does not.

   `withBack` for drill-downs, so a refusal is a detour rather than a dead end — the same rule
   the error card follows. */
function refusalCard(title, what, withBack) {
  return `<section class="card">
    ${withBack ? `<button class="back" id="back-groups">${backLabel()}</button>` : ""}
    <h2${withBack ? ' class="mt-5"' : ""}>${esc(title)}</h2>
    <div class="scope-refusal"><strong>Withheld, not empty.</strong> ${what}
      <strong>For administrators only.</strong> Nothing on this page is broken and nothing is
      missing from the cluster — this view is simply not part of yours.</div>
  </section>`;
}

/* Cluster access, scoped to the viewer: their OWN admission status and nothing else —
   the gate DN is directory structure and the member lists are other people's data.
   `in_access_group` is three-valued for the same reason the wide panel's rows are: false
   is a statement, unknown is the absence of one, and rendering unknown as false would
   assert a non-membership the data cannot support. */
function accessSelfCard(d) {
  if (!d.gated) {
    return `<section class="card">
      <h2>Your cluster access</h2>
      <div class="empty-note">No login gate is configured on this cluster, so there is no
        gate membership to report — any account the identity provider matches can sign
        in.</div>
    </section>`;
  }
  const badge = d.in_access_group === true
    ? `<span class="badge ok"><span class="glyph" aria-hidden="true"></span>in the login gate group</span>`
    : d.in_access_group === false
      ? `<span class="badge warning"><span class="glyph" aria-hidden="true"></span>not in the login gate group</span>`
      : `<span class="badge unknown"><span class="glyph" aria-hidden="true"></span>cannot tell</span>`;
  return `<section class="card">
    <div class="section-head"><h2>Your cluster access</h2><span class="flush"></span>${badge}</div>
    <div class="filterbar-note mt-4">
      ${d.in_access_group === false
        ? `Membership of the gate group <code>${esc(d.group_name || "")}</code> is required
           to sign in, and you are not in it — any access you hold cannot be used until
           you are.`
        : d.in_access_group === true
          ? `Membership of <code>${esc(d.group_name || "")}</code> is what allows you to
             sign in to this cluster.`
          : `The gate group is known but not synced onto this cluster, so there is no
             membership to check yours against.`}
      Who else is or is not in the gate group is the administrator tier.
    </div>
  </section>`;
}

/* Namespace audit, scoped to the viewer: their own direct grants and no cluster KPIs.
   "People exposed" or "Namespaces at risk" recomputed over one person keeps its label and
   changes its meaning — the count-versus-page defect made permanent (requirements Q5) —
   so none of the wide view's aggregates render here at all. */
function selfGrantsView(ub) {
  const rows = ub.bindings || [];
  return `<section class="card">
    <h2>Namespace audit</h2>
    ${scopeBanner("grants", ub)}
    ${rows.length === 0
      ? `<div class="empty-note">No role is granted directly to
           <strong>${esc(ub.viewer || "you")}</strong> on this cluster. Your access, if
           any, arrives through synced groups — the goal state this audit exists to reach.
           This says nothing about whether OTHER accounts hold direct grants; that
           worklist is the administrator tier.</div>`
      : `<div class="scroll-x"><table>
          <thead><tr><th>Grants</th><th>Scope</th><th>Binding</th></tr></thead>
          <tbody>${rows.map((b) => `<tr>
            <td><code class="priv">${esc(b.role_name)}</code>
              <span class="muted">${esc(b.role_kind)}</span></td>
            <td>${b.binding_namespace ? esc(b.binding_namespace)
                  : `<strong class="err">cluster-wide</strong>`}</td>
            <td class="muted">${esc(b.binding_name)}</td>
          </tr>`).join("")}</tbody>
        </table></div>
        <div class="filterbar-note mt-4">
          A direct grant survives offboarding. Consider asking for the equivalent group
          membership and having the binding removed — the runbook on the administrator's
          view of this tab is the same one that applies to yours.</div>`}
  </section>`;
}

/* ── Search boxes ────────────────────────────────────────────────────────────────────────
   One implementation for every as-you-type filter in the bar. Each entry is keyed by the `view`
   field that holds its query; `id` is what the focus restore and the IME guard find the element by.
   Never an aria-label: it would REPLACE the accessible name, so a screen reader would announce the
   help sentence where the visible label says "Find" — WCAG 2.5.3 Label in Name, and a voice user
   saying "click Find" would hit nothing. The help text is a DESCRIPTION, so it sits behind
   aria-describedby in an .sr-only span. */
const SEARCH_BOXES = {
  groupSearch: {
    id: "f-group-search", label: "Find", placeholder: "filter by name",
    title: 'Filters by name as you type. Several words are ANDed — "alpha admin" finds app-ocp-rbac-alpha-ns-admin. Escape clears.',
    help: "Filters the group list by name as you type. Several words are combined with AND, so every word must appear. Press Escape to clear.",
  },
  userSearch: {
    id: "f-user-search", label: "Find", placeholder: "filter by id or name",
    title: 'Filters by username or full name as you type. Several words are ANDed — "alice cooper" finds alice · Alice Cooper. Escape clears.',
    help: "Filters the user list by username or full name as you type. Several words are combined with AND, so every word must appear in one or the other. Press Escape to clear.",
  },
  bindingSearch: {
    id: "f-binding-search", label: "Find", placeholder: "filter by group, role, namespace or binding",
    title: 'Filters every section by group, role, namespace or binding name as you type. Several words are ANDed — "alpha admin" finds admin granted to app-ocp-rbac-alpha-ns-admin. Escape clears.',
    help: "Filters the binding sections by group name, role, namespace or binding name as you type. Several words are combined with AND, so every word must appear. Press Escape to clear.",
  },
  lookupSearch: {
    id: "f-lookup-search", label: "Find", placeholder: "search groups, users and namespaces",
    title: 'Searches groups, users and namespaces at once. Several words are ANDed — "alice zzz" finds nothing. Escape clears.',
    help: "Searches groups by name, users by id or name, and namespaces by name or label, all at once. Several words are combined with AND, so every word must appear. Press Escape to clear.",
  },
  nsSearch: {
    id: "f-ns-search", label: "Find namespace", placeholder: "filter by name or label",
    title: 'Filters namespaces by name or by a label value as you type. Several words are ANDed — "demo prod" finds demo-prod and demo-production. Escape clears.',
    help: "Filters the namespace list by name or by the value of a captured label as you type. Several words are combined with AND, so every word must appear. Press Escape to clear.",
    // The list this box narrows is PAGED (#261): the view key that holds its page, reset to 1 on every
    // change here, because a reader on page 3 of 5 would otherwise be shown an empty page 3 of 1.
    // Declared by the box rather than written by the shared handler, so typing in the Groups tab's box
    // cannot drop the page a reader left the namespace index on (review of #264, Cursor C1).
    page: "nsIndexPage",
  },
  memberSearch: {
    id: "f-member-search", label: "Find member", placeholder: "filter by id or name",
    title: "Filters this group's members by username or full name as you type. Several words are ANDed. Escape clears.",
    help: "Filters this group's members by username or full name as you type. Several words are combined with AND, so every word must appear in one or the other. Press Escape to clear.",
  },
};

function searchBoxHtml(key) {
  const b = SEARCH_BOXES[key];
  // type=search rather than text: it gets the platform's clear affordance and, on iOS, a keyboard
  // with no autocorrect — which would otherwise "fix" a group name like `ns-admin` while it is typed.
  // The value is esc()'d into an attribute like every other interpolation on this page.
  return `<label for="${b.id}">${esc(b.label)}</label>
      <input id="${b.id}" type="search" inputmode="search" autocomplete="off"
             spellcheck="false" placeholder="${esc(b.placeholder)}"
             aria-describedby="${b.id}-help"
             title="${esc(b.title)}"
             value="${esc(view[key])}">
      <span id="${b.id}-help" class="sr-only">${esc(b.help)}</span>`;
}

/* #174: the one box, typed where no list has its own — ONE position change to the lookup, where the
   matches render; not one per keystroke, and not for whitespace (a query of spaces matches nothing and
   would push an entry for a page showing the doors). Returns true when it navigated, so the caller
   repaints only when it did not. Called from BOTH the input handler and compositionend: Chromium
   fires no `input` after `compositionend` (measured: input×3 with isComposing=true, then
   compositionend, nothing after), so a CJK reader's committed query otherwise sat in the box on the
   Overview and opened nothing until a further, uncomposed keystroke (review of #174, OB1). */
function openLookupFor(key) {
  if (key !== "lookupSearch" || view.page === "lookup" || !view[key].trim()) return false;
  navigate({ page: "lookup", group: null, user: null, ns: null, groupsync: null });
  refresh();
  return true;
}

function wireSearchBox(key) {
  const b = SEARCH_BOXES[key];
  const el = $(b.id);
  if (!el) return;
  // `input`, not `change`: it has to filter as the reader types. render() rather than refresh()
  // because every list these boxes filter is already in the browser in full — filtering is a repaint
  // and costs no round trip, and a request per keystroke would be both slower and wrong.
  //
  // Except mid-IME-composition: those input events describe an unfinished conversion, and a repaint
  // here replaces the node the IME is composing into (see the guard above the innerHTML swap in
  // renderFilters). The state still updates, so the compositionend render loses nothing.
  // A box that narrows a paged list names the page it resets (SEARCH_BOXES[key].page); every other
  // box touches nothing beyond its own value.
  const resetPage = () => { if (b.page) view[b.page] = 1; };
  el.oninput = (e) => {
    view[key] = e.target.value;
    resetPage();
    if (e.isComposing) return;   // an unfinished conversion: the state is kept, compositionend paints
    if (!openLookupFor(key)) render();
  };
  // addEventListener, not on-properties: composition events have no IDL handler attribute, so
  // `el.oncompositionstart = …` is a silent no-op expando — the slot would never be set. The node is
  // freshly created on every rebuild, so listeners never stack on one element.
  el.addEventListener("compositionstart", () => { searchComposingIn = b.id; });
  el.addEventListener("compositionend", (e) => {
    searchComposingIn = null;
    view[key] = e.target.value;
    resetPage();
    if (!openLookupFor(key)) render();
  });
  // compositionend fires before blur in every engine, but a missed one would freeze this bar
  // forever (the guard would always return), so blur clears the slot as a backstop.
  el.addEventListener("blur", () => { searchComposingIn = null; });
  el.onkeydown = (e) => {
    // Escape clears rather than blurring, which is what a reader expects of a filter box and what
    // type=search does natively on the platforms that render its clear button. Mid-composition it
    // belongs to the IME — cancel the kana, keep the query — so it is left alone.
    if (e.key === "Escape" && !e.isComposing && view[key]) {
      e.preventDefault();
      view[key] = "";
      resetPage();
      render();
    }
  };
}

function renderFilters() {
  const clusters = data.clusters;
  // The selector says when a cluster is narrowed for THIS reader — read off the row's
  // server-decided `visibility`, never derived here (docs/ACCESS_CONTROL.md §11). A reader who
  // is wide on the host and narrow on a remote would otherwise switch clusters and see the
  // table shrink with nothing to say why. `!== "all"`, the same fail-closed rule as the pill
  // and the narrowing helpers (review of D2, second pass).
  const opts = clusters.map((c) =>
    `<option value="${esc(c.id)}"${c.id === view.cluster ? " selected" : ""}>${esc(c.id)}${
      c.visibility && c.visibility.scope !== "all" ? " — your view" : ""}</option>`).join("");
  // Usage is a property of the DASHBOARD, not of a cluster. Leaving the cluster selector
  // up would say these numbers are scoped to crc-local, and changing it would appear to
  // filter them while silently doing nothing.
  // #172: on the Overview "all clusters" is a position of its own (the fleet view), so the
  // selector offers it there and nowhere else — a drill-down needs a cluster.
  // A pasted link to a retired or unknown id renders the detour; the selector then showed its first
  // option — "all clusters" — for a page that is not the fleet. The id gets its own selected option,
  // named for what it is (Grok, pass 2).
  const known = !view.cluster || clusters.some((c) => c.id === view.cluster);
  const goneOption = known ? "" : `<option value="${esc(view.cluster)}" selected>${esc(view.cluster)} — not configured</option>`;
  const fleetOption = view.page === "overview" && !view.groupsync
    ? `<option value=""${view.cluster ? "" : " selected"}>all clusters</option>` : "";
  // Fleet-wide pages have no cluster to select: Usage (per-pod activity) and the KPI page (#157),
  // which reads every served cluster at once and would otherwise claim a scope it does not have.
  const fleetWide = view.page === "usage" || view.page === "kpi";
  let html = fleetWide ? "" : `<label for="f-cluster">Cluster</label>
    <select id="f-cluster">${fleetOption}${goneOption}${opts}</select>`;
  if (view.page === "bindings" && !narrowedReader()) {
    html += searchBoxHtml("bindingSearch");
    html += `<label for="f-binding">Show</label>
      <select id="f-binding">
        <option value="review"${view.bindingFilter === "review" ? " selected" : ""}>granted + needs review</option>
        <option value="all"${view.bindingFilter === "all" ? " selected" : ""}>all bindings</option>
        <option value="ok"${view.bindingFilter === "ok" ? " selected" : ""}>granted (group exists)</option>
        <option value="built_in"${view.bindingFilter === "built_in" ? " selected" : ""}>built-in</option>
        <option value="unmanaged"${view.bindingFilter === "unmanaged" ? " selected" : ""}>unmanaged</option>
      </select>`;
  }
  if (view.page === "nsaudit" && !view.ns) html += searchBoxHtml("nsSearch");
  if (view.page === "logins") {
    // Built from the outcomes actually PRESENT plus the current selection, not from a fixed
    // list of all ten. A cluster on OpenLDAP can never produce the four AD sub-code outcomes,
    // and offering them would invite the reader to filter to a guaranteed-empty table and
    // conclude something from it. The current selection is always included so a filter that
    // has just emptied its own bucket still shows what it is filtering to.
    const present = Object.keys((data.logins && data.logins.summary
      && data.logins.summary.by_outcome) || {});
    const choices = ["all", ...present.filter((o) => o !== "all").sort()];
    if (view.loginOutcome !== "all" && !choices.includes(view.loginOutcome)) {
      choices.push(view.loginOutcome);
    }
    html += `<label for="f-outcome">Outcome</label>
      <select id="f-outcome">${choices.map((o) =>
        `<option value="${esc(o)}"${o === view.loginOutcome ? " selected" : ""}>${
          o === "all" ? "all outcomes" : esc(OUTCOME_LABEL[o] || o)}</option>`).join("")}</select>`;
  }
  // The group box belongs to the group LIST. It used to render on the group and user detail pages
  // too, filtering nothing; that slot now holds the box for whatever list the page actually shows.
  if (view.page === "groups" && !view.group && !view.user) html += searchBoxHtml("groupSearch");
  if (view.page === "users" && !view.user) html += searchBoxHtml("userSearch");
  // In the BAR, not in the members card, and not only because of the rule above .filters: render()
  // replaces #main with no focus or caret restore, so a box inside the card would lose focus after
  // every character. The bar is the one place a text field survives the repaint.
  if (view.page === "groups" && view.group && !view.user) html += searchBoxHtml("memberSearch");
  // #174: wherever no list has its own box — the lookup, a user or namespace page, every other tab —
  // the one box searches all three kinds; typing on a page with nothing to filter opens the lookup once.
  const listBoxInScope = (view.page === "groups" && !view.user) || (view.page === "users" && !view.user)
    || (view.page === "nsaudit" && !view.ns) || (view.page === "bindings" && !narrowedReader());
  if (!listBoxInScope) html += searchBoxHtml("lookupSearch");
  if (view.page === "groups") {
    html += `<label for="f-state">Group state</label>
      <select id="f-state">
        <option value="all"${view.groupFilter === "all" ? " selected" : ""}>all</option>
        <option value="empty"${view.groupFilter === "empty" ? " selected" : ""}>empty</option>
        <option value="unattributed"${view.groupFilter === "unattributed" ? " selected" : ""}>unattributed</option>
      </select>`;
  }
  html += exportControlHtml();
  // aria-current, not just a class: it is what tells a screen reader which section is
  // open. The visual bar and the bolder label are the sighted half of the same signal.
  //
  // The id exists for the focus restore below, which finds elements by id alone — without it a
  // keyboard user resting on a tab is dropped to <body> by every timed repaint, losing their place
  // in the tab order.
  const tab = (id, label) =>
    `<button class="tab" id="tab-${id}" data-nav="${id}"${view.page === id || (id === "reports" && view.page === "reporting") ? ' aria-current="page"' : ""}>${label}</button>`;   // #149: the status page is Reports' child
  html += `<span class="spacer"></span>
    <nav class="tabs" aria-label="Dashboard sections">
      ${tab("home", "Home")}
      ${tab("overview", "Overview")}
      ${tab("kpi", "KPIs")}
      ${tab("groups", "Groups")}
      ${tab("users", "Users")}
      ${tab("bindings", "Access granted")}
      ${tab("policy", "RBAC policy")}
      ${tab("kyverno", "Kyverno")}
      ${tab("nsaudit", "Namespace audit")}
      ${tab("logins", "Logins")}
      ${tab("usage", "Usage")}
      ${reportingEnabled() ? tab("reports", "Reports") : ""}
      ${reportingEnabled() ? tab("library", "Library") : ""}
      ${ccMayView() ? tab("clusters", "Cluster Configurations") : ""}
    </nav>`;
  // FOCUS AND CARET SURVIVE THE REBUILD, and this is load-bearing rather than polish. This function
  // replaces the whole bar's innerHTML, render() calls it before every repaint, and the page repaints
  // itself every 60 SECONDS. Without this a text field in here is unusable: the element the reader is
  // typing into is destroyed and replaced, so focus goes to the body and the caret is lost — after one
  // character when the input re-renders on its own event, and mid-word when the poll fires.
  //
  // Captured by id, because the new element is a different object. selectionStart is read defensively:
  // it is null on an <input> that does not support selection and throws on some element types, and
  // losing the caret position is a far smaller failure than throwing inside a render.
  const active = document.activeElement;
  // A repaint mid-IME-composition destroys more than focus: the composition session is bound to the
  // NODE, so replacing it commits half-composed kana as literal text and the IME's next update opens a
  // second session on the replacement — typing かんり lands as かかんかんり. No after-the-fact restore
  // can repair that, so while a composition is live in this box the bar keeps its existing DOM and the
  // caller still repaints the data below; the compositionend handler runs the catch-up render.
  if (searchComposingIn && active && active.id === searchComposingIn) return;
  let restore = null;
  if (active && active.id && $("filters").contains(active)) {
    restore = { id: active.id, start: null, end: null };
    try {
      restore.start = active.selectionStart;
      restore.end = active.selectionEnd;
    } catch (e) { /* not a selectable input; focus alone is enough */ }
  }
  $("filters").innerHTML = html;
  // Drives the accent for the whole page — tab, bloom, card edge, focus ring.
  document.body.dataset.page = view.page;

  const cl = $("f-cluster");
  if (cl) cl.onchange = (e) => {
    // A drill-down is scoped to its cluster. Carrying `group`, `user` or `ns` across a cluster
    // switch would re-request that name against the new cluster — a different object with
    // the same name, or a 404 — so the drill-down is dropped from the new position.
    //
    // A history ENTRY, and the trail is no longer wiped. It used to be (`trail.length = 0`),
    // which was right when the trail was private: it stopped a later Back offering a
    // pre-switch position that no longer made sense. With the browser's stack that erasure is
    // both impossible and wrong — the reader pressed Back expecting the cluster they were
    // reading, and every entry carries its own cluster, so returning to one is well defined.
    navigate({ cluster: e.target.value, groupsync: null, group: null, user: null, ns: null });
    refresh();
  };
  Object.keys(SEARCH_BOXES).forEach(wireSearchBox);
  const st = $("f-state");
  if (st) st.onchange = (e) => { view.groupFilter = e.target.value; refresh(); };
  const bf = $("f-binding");
  if (bf) bf.onchange = (e) => { view.bindingFilter = e.target.value; refresh(); };
  // refresh(), not render(): the outcome filter is applied SERVER-side so the page is one
  // bounded slice of the record rather than the whole of it filtered in the browser — the same
  // reason the namespace picker refetches.
  const of = $("f-outcome");
  if (of) of.onchange = (e) => { view.loginOutcome = e.target.value; refresh(); };
  const ec = $("export-csv");
  if (ec) ec.onclick = () => runExport("csv");
  const ej = $("export-json");
  if (ej) ej.onclick = () => runExport("json");
  if (restore) {
    const el = $(restore.id);
    if (el) {
      // preventScroll: the bar sits at the top of the page, and a bare focus() scrolls it into view —
      // so with focus parked in the search box, every timed poll would yank a reader who had scrolled
      // into the table back to the top. Focus is being RESTORED here, not moved; the viewport must not
      // know the element was ever replaced.
      el.focus({ preventScroll: true });
      // Put the caret back where it was, rather than at the end: a reader correcting a typo in the
      // middle of a term would otherwise have every subsequent keystroke jump to the end of the field.
      if (restore.start !== null && el.setSelectionRange) {
        try { el.setSelectionRange(restore.start, restore.end); } catch (e) { /* not selectable */ }
      }
    }
  }
  document.querySelectorAll("[data-nav]").forEach((b) => {
    b.onclick = () => {
      // Tabs are navigation. They pushed nothing before — and actively CLEARED the trail —
      // which is the single biggest reason browser-Back used to leave the dashboard: every
      // page but the one you were on was unreachable backwards. A drill-down is dropped
      // because it belongs to the page being left, not to the one being opened.
          // #172: the Overview tab opens the FLEET; a cluster is reached from a tile or the selector.
          navigate({ page: b.dataset.nav, groupsync: null, group: null, user: null, ns: null, report: null,
                     ...(b.dataset.nav === "overview" ? { cluster: null } : {}) });
      // PAINT THE DESTINATION FIRST, then fetch. refresh() used to await every endpoint
      // before rendering, and its first visible act dimmed the tab being LEFT — so the
      // destination appeared only after the whole round trip: re-measured 2026-08-10
      // (benchmark doc §6a), first destination paint at median 271-337 ms with 40 ms of
      // per-request latency, the proxy path — the exact "did that register?" pause the
      // user reported. With render() first it is 2-4 ms in the same setup.
      //
      // render() here is synchronous and costs 0.5-2.7 ms. A tab whose data is already in
      // `data` (any revisit) appears complete, instantly; a first visit shows its own
      // chrome and "Loading…", which is the right answer because it confirms the click and
      // puts the destination's layout on screen. The fetch then fills it in. Painting from
      // `data` is safe across cluster switches because applyPosition() drops every
      // cluster-scoped payload the moment the cluster changes.
      render();
      refresh();
    };
  });
}

/* A silenced alert is shown, not hidden: the row stays, dimmed, with a tag naming what
   silenced it (the Group's annotation or the chart's values), and the hero counts only the
   active ones. Hiding it would train readers that "0 alerts" means healthy when it means
   "somebody chose not to look". The severity badge stays a severity word — the UI test
   holds badge labels to critical|warning — so "silenced" is a separate tag, not a badge. */
/* #172 — the Overview follows the fleet. Thresholds are the design: at three the tiles are the
   page; past eight the alerts lead; past twenty-four a cluster is one table row. */
const DENSITY_TIERS = [[3, "full"], [8, "medium"], [24, "compact"], [Infinity, "dense"]];
const densityFor = (n) => DENSITY_TIERS.find(([max]) => n <= max)[1];
const FLEET_TABLES_MAX = 8;
const ALERT_PAGE = 8;
/* Every non-ok state says what it costs, in words the reader acts on — under the badge, never in
   a tooltip. The vocabulary is state.py's: `late` is one interval past the schedule (plus grace),
   `overdue` is past two. `unknown` on the wire has exactly two causes — api.enrich() calls
   compute_state() without `reachable`, so a CR is never `unknown` for its cluster being down: it
   has never synced, or its schedule is unusable (no interval to measure). The row knows which. */
const MEANS = {
  sync_late: "one interval has passed without a sync — not broken yet, but the next missed fire makes it overdue; the state to act on",
  sync_overdue: "the schedule has stopped firing — every group it owns is frozen at its last sync, and nobody has been added or removed since",
  sync_unknown: "never observed a sync — a freshly created CR looks like this until its first fire, which is not the same as a sync that failed",
  sync_unknown_schedule: "the schedule is unusable, so no interval can be measured — the operator cannot fire it until it is fixed",
  cfg_failing: "RBAC has quietly stopped reconciling — new namespaces receive nothing and drift goes uncorrected",
  cl_bad: "the poller cannot reach it — every count on this tile is the last one observed, not the current one",
  cl_never: "never polled — there are no counts yet, which is not the same as zero",
};
/* The consequence for one CR row, from the fields the row carries: `schedule_valid` is enrich()'s
   own verdict, so an `unknown` with an invalid schedule is the schedule case — with or without a
   last sync: "until its first fire" is false of a cron that cannot fire (Grok, pass 2). */
function syncMeans(r) {
  if (r.state === "unknown" && r.schedule_valid === false) return MEANS.sync_unknown_schedule;
  return MEANS["sync_" + r.state] || MEANS.sync_unknown;
}

function alertsCard(all, clusterCount) {
  const active = all.filter((x) => !x.silenced);
  const quiet = all.length - active.length;
  const crit = active.filter((x) => x.severity === "critical").length;
  // Worst first: critical, then warning, silenced last — page 1 must be the page worth reading.
  const rank = (a) => (a.silenced ? 2 : 0) + (a.severity === "critical" ? 0 : 1);
  const rows = all.slice().sort((x, y) => rank(x) - rank(y));
  const pages = Math.max(1, Math.ceil(rows.length / ALERT_PAGE));
  const page = Math.min(Math.max(1, view.alertPage || 1), pages);
  const slice = rows.slice((page - 1) * ALERT_PAGE, page * ALERT_PAGE);
  // Kinds are a summary, never a replacement for the rows.
  const kinds = {};
  active.forEach((a) => { kinds[a.kind] = (kinds[a.kind] || 0) + 1; });
  const body = all.length === 0
    ? `<div class="empty-note">No alerts. Nothing overdue, empty, unattributed, stale, collapsed, or failing.</div>`
    : `${Object.keys(kinds).length ? `<div class="kinds">${Object.entries(kinds).sort((a, b) => b[1] - a[1])
        .map(([k, n]) => `<span class="kind">${esc(k.replace(/_/g, " "))} · ${n}</span>`).join("")}</div>` : ""}`
      + slice.map((x) => `<div class="alert-row sev-${x.severity === "critical" ? "critical" : "warning"}${x.silenced ? " silenced" : ""}">
        ${sevBadge(x.severity)}
        <div class="who">${esc(x.subject)}<div class="muted fw-normal text-xs">${esc(x.cluster)} · ${esc(x.kind)}</div></div>
