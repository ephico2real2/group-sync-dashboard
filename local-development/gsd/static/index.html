function usagePage() {
  const d = data.usage;
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;

  // Disabled is a DIFFERENT state from "nobody has visited yet", and conflating them sends
  // the reader looking for users who were never going to be recorded. Say which it is.
  if (!d.enabled) {
    // The config keys are shown to an ADMINISTRATOR only. This is a diagnostic rather than a
    // lever — the feature is off for everyone, so naming the settings is not advertising an
    // escalation the way refusalCard's old grant advice was — but an ordinary reader still
    // cannot act on a chart value, and telling them the state is the whole of what they need.
    return `<section class="card">
      <h2>Dashboard usage</h2>
      <div class="empty-note">
        Not being recorded on this cluster.${narrowedReader() ? "" : ` This needs
        <strong>both</strong> <code>oauthProxy.enabled=true</code> — identity comes from the
        proxy, and with it off there is no authentication and the username header would be
        whatever the caller typed — and <code>config.userActivity.enabled=true</code>.`}
      </div>
    </section>`;
  }

  const rows = d.activity || [];
  // The headline numbers come from the server's summary, which is computed over the whole
  // set. `rows` is ONE PAGE of it: counting them reports the page, and at 1,092 stored rows
  // that said 167 days and 5,000 interactions where the truth was 364 and 10,920. The
  // fallbacks only fire against a build that predates the summary.
  const s = d.summary || {};
  const days = s.days != null ? s.days : new Set(rows.map((r) => r.day)).size;
  const users = s.distinct_users != null
    ? s.distinct_users : new Set(rows.map((r) => r.user_name)).size;
  const requests = s.interactions != null
    ? s.interactions : rows.reduce((n, r) => n + r.request_count, 0);
  const today = new Date().toISOString().slice(0, 10);
  // Safe to take from `rows`: the API orders day DESC, so today is on the first page unless
  // more people used the dashboard in one day than the limit.
  const activeToday = rows.filter((r) => r.day === today).length;

  const selfOnly = d.scope !== "all";
  return `<section class="card">
    <h2>Dashboard usage</h2>
    ${selfOnly
      // No config key named here, for the reason refusalCard records: the reader seeing this
      // is the one being scoped down, and naming the setting that would widen it hands them a
      // lever they cannot pull. The operator-facing form is in the chart values, where an
      // operator looks. Saying WHY the scoping exists is still worth it — that is not a lever.
      ? `<div class="filterbar-note" style="margin-bottom:8px">Showing
          <strong>${esc(d.viewer || "your")}</strong> activity only. This is identifiable
          personnel data, so each person sees their own.</div>`
      // Two DIFFERENT causes now reach the wide view — the deployment recording usage for
      // everyone, or this reader passing the Usage tab's own administrator check — and the
      // page cannot tell which from `scope` alone. So it states the fact and asserts neither
      // cause, rather than naming one and being wrong half the time.
      : `<div class="filterbar-note" style="margin-bottom:8px">Showing
          <strong>all users</strong>, not only your own activity.</div>`}
    <div class="hero">
      <span class="value mono">${activeToday}</span>
      <span class="label">${selfOnly
        ? (activeToday ? "active today" : "no activity today")
        : `${activeToday === 1 ? "person" : "people"} used the dashboard today`}</span>
    </div>
    <div class="kpis">
      ${selfOnly ? "" : `<div class="kpi"><div class="label">Distinct users</div>
        <div class="value mono">${users}</div></div>`}
      <div class="kpi"><div class="label">Days recorded</div>
        <div class="value mono">${days}</div></div>
      <div class="kpi"><div class="label">Interactions</div>
        <div class="value mono">${requests.toLocaleString()}</div></div>
      <div class="kpi"><div class="label">Retention</div>
        <div class="value mono muted">${d.retention_days} days</div></div>
    </div>
  </section>
  <section class="card">
    <h3>By user and day</h3>
    ${rows.length === 0
      ? `<div class="empty-note">Nothing recorded yet. Rows appear after the first flush,
           which runs on the configured interval rather than per request.</div>`
      : `<div class="scroll-x"><table>
          <thead><tr><th>User</th><th>Day (UTC)</th><th>First seen</th><th>Last seen</th>
            <th class="num">Interactions</th></tr></thead>
          <tbody>${rows.map((r) => `<tr>
            <td>${esc(r.user_name)}${r.email
              ? ` <span class="muted">· ${esc(r.email)}</span>` : ""}</td>
            <td class="mono">${esc(r.day)}</td>
            <td class="mono">${esc(fmtClock(r.first_seen_at))}</td>
            <td class="mono">${esc(fmtClock(r.last_seen_at))}</td>
            <td class="num">${r.request_count}</td>
          </tr>`).join("")}</tbody>
        </table></div>`}
    ${d.truncated ? `<div class="filterbar-note truncation-note" style="margin-top:8px">
      Showing the <strong>${rows.length}</strong> most recent of <strong>${d.total}</strong>
      rows. The counts above cover all of them.
    </div>` : ""}
    <div class="filterbar-note" style="margin-top:8px">
      Times render in the server's timezone; the <strong>Day</strong> column is a
      <strong>UTC</strong> date. That split is deliberate rather than an oversight: the day
      is a stored bucket, computed server-side when the activity was recorded, so
      re-labelling it local would misstate rows already written, and re-bucketing would make
      the same column mean one thing before a deploy and another after. Near midnight a
      session can therefore sit on the following UTC day.
      An interaction is one deliberate action — opening the dashboard,
      switching tab, drilling in, changing a filter — not one HTTP request: the page
      refreshes itself every 60s and counting those measured how long a tab was left open
      rather than whether anyone used it. Reading time is invisible, so a long look at one
      page counts once. These are not logins either: the proxy owns this dashboard's session, so
      nothing here records a sign-in to it. Logins to the <strong>cluster</strong> are a separate
      record with a separate source — the oauth-server's own log — and they are on the
      <strong>Logins</strong> tab.
    </div>
  </section>`;
}

/* ── Logins ───────────────────────────────────────────────────────────────────────────────
   Names are the PARSER's vocabulary, restated for a reader. Each string says what happened to
   the person, not what the directory returned: "LDAP Result Code 49" is what the log carries
   and it is not an explanation of anything. `rejected` deliberately covers two cases that the
   log cannot separate — the identity provider's search filter carries the login-gate group, so
   a real person outside that group and a username that does not exist produce byte-identical
   lines. Splitting them here would be an invention. */
const OUTCOME_LABEL = {
  success: "signed in",
  bad_password: "wrong password",
  rejected: "no match",
  password_expired: "password expired",
  must_change_password: "must change password",
  account_locked: "account locked",
  account_disabled: "account disabled",
  account_expired: "account expired",
  logon_not_permitted: "logon not permitted",
  failed: "failed — no reason given",
};

/* Badge severity answers ONE question: who has to act? `critical` is the set an administrator
   must clear — locked, disabled, expired, not permitted — because the person cannot get in
   until somebody does something, and those are the rows worth a help-desk ticket before it is
   raised. A wrong password or a name the directory does not match is the system working as
   designed, however often it happens, so it is `warning`. `failed` is `unknown`: the parser saw
   a failure it could not attribute, and claiming a severity for it would be a guess.
   Shape and text carry this as well as colour — see .badge. */
const OUTCOME_BADGE = {
  success: "ok",
  bad_password: "warning",
  rejected: "warning",
  password_expired: "critical",
  must_change_password: "critical",
  account_locked: "critical",
  account_disabled: "critical",
  account_expired: "critical",
  logon_not_permitted: "critical",
  failed: "unknown",
};

/* Attempts requested per page. The server orders newest-first and applies it, so a truncated
   page is the top of the chronology rather than a slice of its middle. */
const LOGIN_PAGE = 200;

/* What a `no match` refusal actually was, once the gate group's membership is known.

   THE ONE THING THE LOG CANNOT SAY, answered from data we already hold. A refused directory login
   writes `no entries matching (<filter>)`, and because the filter carries the login-gate group, a real
   person outside that group and a username that does not exist produce byte-identical lines. The
   parser records `rejected` for both and refuses to choose — correctly. With the gate group synced,
   there is something to choose with.

   Wording matters here. `no_record` says what WE lack, not that the account does not exist: this
   dashboard reads OpenShift, not the directory, so "unknown account" would be a claim it cannot make.
   `membership_disagrees` is the one that is a fault in our own data rather than in somebody's access,
   so it reads as a warning and names the likely cause. */
const REFUSAL = {
  not_gated: {
    text: "a real person, not in the gate group",
    why: "This account is in at least one synced group, so the directory knows them and this cluster "
       + "governs them \u2014 and they are not in the login-gate group. The refusal is the gate working "
       + "as configured; the finding is that they hold access they cannot use.",
    cls: "warning",
  },
  no_record: {
    text: "no record of this name",
    why: "No synced group and no membership history for this username. Consistent with a typo, a "
       + "probe, or somebody from a directory branch this cluster does not sync. It is NOT proof the "
       + "account does not exist \u2014 this dashboard reads OpenShift, not the directory.",
    cls: "unknown",
  },
  membership_disagrees: {
    text: "our membership data disagrees",
    why: "The synced group says this person IS in the gate group, and the directory search found "
       + "nothing. Most often a sync that has not caught up with a removal \u2014 worth knowing, "
       + "because every other view on this dashboard trusts that same data.",
    cls: "critical",
  },
};

function refusalBadge(reason) {
  const r = REFUSAL[reason];
  if (!r) return "";
  return ` <span class="badge ${r.cls}" title="${esc(r.why)}"><span class="glyph" aria-hidden="true"></span>${esc(r.text)}</span>`;
}

function outcomeBadge(outcome) {
  const cls = OUTCOME_BADGE[outcome] || "unknown";
  return `<span class="badge ${cls}"><span class="glyph" aria-hidden="true"></span>${
    esc(OUTCOME_LABEL[outcome] || outcome)}</span>`;
}

/* A username is drillable only when the user page has something to show.
   /api/clusters/{c}/users/{name} 404s for a name with no current groups AND no membership
   history — which is precisely the most interesting row here, an account nobody has ever
   governed. Making every name a link would send the reader from the most valuable finding on
   the page straight into an error card, so the affordance is offered only where it leads
   somewhere. `has_history` is what makes it lead somewhere: the removal is in the timeline. */
function loginUser(row) {
  const name = row.user_name;
  const full = row.full_name ? ` <span class="muted">· ${esc(row.full_name)}</span>` : "";
  if (!row.known_user && !row.has_history) {
    return `<span class="mono">${esc(name)}</span>${full}`;
  }
  return `<button type="button" class="drill mono" data-user="${esc(name)}">${esc(name)}</button>${full}`;
}

/* Login attempts read from the oauth-server's log: who tried, when, and what happened.

   THE WHOLE PAGE IS ABOUT A WINDOW, and both of its edges are on screen at all times. Login
   lines naming a person exist only while the authentication operator is at Debug, and a pod's
   log dies with the pod, so nothing before capture began was ever written down anywhere and no
   amount of asking will produce it. An empty table therefore means NOTHING WAS OBSERVED — it
   is not a statement that nobody signed in, and a page that let it read as one would be worse
   than no page. That is why the window banner is unconditional rather than an empty-state note.

   Accounts in no synced group come FIRST, above the chronology. They are the finding this
   feature exists to produce, and the chronology is where a finding goes to hide: 200 rows
   ordered by time bury the one name that matters among the 199 that are fine. */
function loginsPage() {
  const d = data.logins;
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  // The access panel comes from a DIFFERENT endpoint and needs no logs — it is derived from synced
  // group membership, so it is just as true on a cluster that has never enabled Debug logging. It is
  // therefore rendered in every branch below, including the capture-disabled one.
  return captureSection(d, accessCard(data.access));
}

function captureSection(d, access) {
  // Scope as the RESPONSE declares it. At "self" the record on screen is the viewer's own
  // slice: the whole-record summary and the ungoverned-accounts finding are not in the
  // payload at all, and nothing here may compute a stand-in — "accounts in no synced
  // group: 0" recomputed over one person would be the count-versus-page defect made
  // permanent (requirements Q5).
  const self = d.scope === "self";
  // Off is a DIFFERENT state from on-and-quiet, and conflating them sends the reader hunting
  // for logins that were never going to be recorded. Both halves are named because either one
  // alone records nothing: the module has to be running, and the operand has to be verbose.
  if (!d.enabled) {
    return `<section class="card">
      <h2>Login attempts</h2>
      <div class="empty-note">
        Not being captured. This needs <strong>both</strong>
        <code>config.loginCapture.enabled=true</code> — the module that reads the log — and the
        authentication <em>operator</em> at <code>spec.logLevel: Debug</code>, which is what
        makes the oauth-server write a username at all. At the default verbosity the lines this
        page parses do not exist, so capture would run and find nothing.
      </div>
      <div class="filterbar-note">Both are one <code>helm upgrade</code>:
        <code>loginCapture.enabled</code> and <code>authLogLevel.manage</code>. See
        <code>docs/LOGIN_CAPTURE_QUICKCHECK.md</code> for the five commands that prove the path
        end to end.</div>
    </section>` + access;
  }

  const s = d.summary || {};
  const rows = d.attempts || [];
  const ungoverned = d.ungoverned || [];

  // Overdue is measured against the cadence the SERVER reports, not a number invented here:
  // capture rides the poll thread, so `last_read_at` should advance every poll interval. Five
  // intervals is late beyond argument, with a 5-minute floor so a fast poll does not raise this
  // on one slow cycle. The threshold is stated on screen rather than implied by a red badge.
  const interval = d.read_interval_seconds || 60;
  const staleAfter = Math.max(300, interval * 5);
  const readAge = d.last_read_at
    ? Math.floor((Date.now() - new Date(d.last_read_at).getTime()) / 1000) : null;
  const stalled = readAge !== null && readAge > staleAfter;

  // Compared as INSTANTS, not as strings, and with a second of tolerance. The two fields do not
  // share a format: `capture_started_at` is stamped by now_iso() to whole seconds, while
  // `retained_since` is an attempt's `at` and carries microseconds. Lexicographically "…:00.5Z"
  // sorts BEFORE "…:00Z" ('.' < 'Z'), so a string compare would announce that the record
  // predates capture whenever the first attempt landed in the same second the watch began.
  const startedMs = d.capture_started_at ? new Date(d.capture_started_at).getTime() : NaN;
  const retainedMs = d.retained_since ? new Date(d.retained_since).getTime() : NaN;
  const predatesStart = retainedMs < startedMs - 1000;

  // Each edge is stated only when it HAS a value. Before the first successful read all three are
  // null, and "Watching since —. Oldest attempt still retained —. Last read —." is three em-dashes
  // of noise in front of the one sentence that state actually needs. The caveat below them is
  // unconditional, because it is true in every state and is the whole point of the banner.
  const edges = [
    d.capture_started_at
      && `Watching since <strong>${esc(fmtTime(d.capture_started_at))}</strong> (${
           esc(ago(d.capture_started_at))})`,
    d.retained_since
      && `oldest attempt still retained <strong>${esc(fmtTime(d.retained_since))}</strong>`,
    d.last_read_at
      && `last read <strong>${esc(fmtTime(d.last_read_at))}</strong> (${
           esc(ago(d.last_read_at))})`,
  ].filter(Boolean);
  const window_ = `<div class="filterbar-note" style="margin-top:8px">
    ${edges.length ? edges.join("; ") + "." : ""}
    Nothing before capture began was ever recorded — the oauth-server's log dies with its pod and
    cannot be read backwards — so an empty list here means nothing was <em>observed</em>, never
    that nobody signed in.
    ${predatesStart
      ? `The oldest attempt predates the first read because that read looked back an hour, which
         is expected rather than a fault.` : ""}
  </div>`;

  const stalledNote = stalled
    ? `<div class="truncation-note">
        <strong>Capture has stopped.</strong> The last successful read was
        ${esc(ago(d.last_read_at))}, and reads are expected every ${interval}s — anything past
        ${Math.round(staleAfter / 60)} minutes is overdue. Attempts made since then are being
        lost, and they cannot be recovered later. Check the dashboard pod's log for a refused
        <code>pods/log</code> read, and that an oauth-server pod is Running.
      </div>` : "";

  // Nothing recorded yet is the state most likely to be MISREAD, so it gets the whole card and
  // says which of the three reasons applies rather than leaving the reader to guess. At the
  // narrowed tier "no rows" means no rows FOR YOU — the two operational diagnoses below answer
  // a question the scoped reader did not ask, so the scoped state says whose record is empty
  // instead, and the capture-health note still carries the operational truth.
  if (!d.total) {
    return `<section class="card">
      <h2>Login attempts</h2>
      ${scopeBanner("logins", d)}
      ${self
        ? `<div class="empty-note">No sign-in attempts recorded for
            <strong>${esc(d.viewer || "you")}</strong> since capture began. This view is
            scoped to you; it says nothing about whether anyone else signed in.</div>`
        : d.last_read_at ? `<div class="empty-note">
          Reads are working — the log was last read ${esc(ago(d.last_read_at))} — and
          <strong>no login lines matched</strong>. Either nobody has signed in since watching
          began, or the authentication operator is not at Debug, in which case the oauth-server
          never writes a username. One command decides which:
          <code>oc get authentications.operator.openshift.io cluster -o jsonpath='{.spec.logLevel}'</code>
          must print <code>Debug</code>.
        </div>`
        : `<div class="empty-note">
          <strong>No successful read yet.</strong> Capture is enabled but has not managed to
          read a log, so this is a cluster-access problem rather than a quiet one. The
          dashboard's ServiceAccount needs <code>pods</code> list and the
          <code>pods/log</code> subresource in the oauth-server's namespace
          (<code>openshift-authentication</code> unless configured otherwise), and at least one
          oauth-server pod has to be Running. Note that
          <code>oc auth can-i get pods/log</code> answers <code>no</code> even on a correct
          grant — it reads <code>pods/log</code> as a resource <em>name</em>. Use
          <code>--subresource=log</code>.
        </div>`}
      ${stalledNote}
      ${window_}
    </section>` + access;
  }

  const failures = s.failures || 0;
  const ungovernedCount = s.ungoverned_users || 0;
  // The hero is the finding, not the volume — at the wide tier. At the narrowed tier the
  // finding is withheld along with the rest of the whole-record numbers, so the hero is
  // the one number that IS the viewer's: their own attempt count. No zeros stand in for
  // the suppressed summary — a zero with the old label would be a lie with an axis.
  const headline = self
    ? `<div class="hero">
      <span class="value mono">${(d.total || 0).toLocaleString()}</span>
      <span class="label">sign-in attempt${d.total === 1 ? "" : "s"} recorded for you</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Most recent</div>
        <div class="value mono muted" style="font-size:var(--text-lg)">${
          esc(rows[0] ? ago(rows[0].at) : "—")}</div></div>
    </div>`
    : `<div class="hero">
      <span class="value mono">${ungovernedCount}</span>
      <span class="label">${ungovernedCount
        ? `${ungovernedCount === 1 ? "account" : "accounts"} in no synced group`
        : "every account seen is in a synced group"}</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Attempts</div>
        <div class="value mono">${(d.total || 0).toLocaleString()}</div></div>
      <div class="kpi"><div class="label">Distinct users</div>
        <div class="value mono">${s.distinct_users || 0}</div></div>
      <div class="kpi"><div class="label">Signed in</div>
        <div class="value mono">${(s.successes || 0).toLocaleString()}</div></div>
      <div class="kpi ${failures ? "flag-warning" : ""}"><div class="label">Failed</div>
        <div class="value mono ${failures ? "" : "muted"}">${failures.toLocaleString()}</div></div>
      <div class="kpi"><div class="label">Most recent</div>
        <div class="value mono muted" style="font-size:var(--text-lg)">${esc(ago(s.last_at))}</div></div>
    </div>`;
  return `<section class="card">
    <h2>Login attempts</h2>
    ${scopeBanner("logins", d)}
    ${headline}
    ${stalledNote}
    ${window_}
  </section>
  ${access}
  ${self ? "" : ungovernedCard(d, ungoverned)}
  <section class="card">
    <div class="section-head"><h3>${self ? "Your attempts" : "Every attempt"}</h3><span class="flush"></span>
      ${view.loginOutcome !== "all"
        ? `<span class="chip">filtered to ${esc(OUTCOME_LABEL[view.loginOutcome]
            || view.loginOutcome)}</span>` : ""}
    </div>
    ${rows.length === 0
      ? `<div class="empty-note">No attempt matches this filter. The counts above cover the
           whole record, not this view.</div>`
      : `<div class="scroll-x"><table>
          <thead><tr><th>When</th><th>User</th><th>Outcome</th><th>Provider</th>
            <th>Detail</th><th>Replica</th></tr></thead>
          <tbody>${rows.map((r) => `<tr>
            <td class="mono" style="white-space:nowrap">${esc(fmtTime(r.at))}</td>
            <td>${loginUser(r)}${r.in_access_group === false && !r.break_glass
              ? ` <span class="chip" title="Not a member of the login-gate group, so this account cannot authenticate at all. With that known, a `+"`"+`no match`+"`"+` here is a real person outside the group rather than a username that does not exist.">not in access group</span>`
              : ""}${r.break_glass
              ? ` <span class="chip" title="${r.outcome === "success"
                  ? "A break-glass sign-in: a local HTPasswd account, not a directory identity, so there is no synced group to govern it and nobody to offboard."
                  : "An attempt against the local HTPasswd provider. The name may not exist — HTPasswd reports no reason — so this says which provider was tried and nothing about the account."}">${
                  r.outcome === "success" ? "break-glass" : "local provider"}</span>`
              : (r.known_user ? "" : ` <span class="chip">${r.has_history
                  ? "removed from every group" : "no synced group"}</span>`)}</td>
            <td>${outcomeBadge(r.outcome)}${refusalBadge(r.refusal_reason)}</td>
            <td class="mono muted">${esc(r.provider || "—")}</td>
            <td class="muted">${esc(r.detail || "")}${r.ldap_result_code != null
              ? ` <span class="mono">(LDAP ${r.ldap_result_code})</span>` : ""}</td>
            <td class="mono muted" style="white-space:nowrap">${
              esc((r.pod_name || "").replace(/^oauth-openshift-/, ""))}</td>
          </tr>`).join("")}</tbody>
        </table></div>`}
    ${d.truncated ? `<div class="truncation-note">
      Showing the <strong>${rows.length}</strong> most recent of <strong>${d.total}</strong>
      retained attempts. Every number above covers all of them.
    </div>` : ""}
    <div class="filterbar-note" style="margin-top:8px">
      <strong>No match</strong> covers two cases this log cannot separate: a real person who is
      not in the login-gate group, and a username that does not exist. The identity provider's
      search filter carries the gate group, so both produce the same
      <code>no entries matching</code> line — telling them apart from the log alone would need a
      directory read this dashboard does not make. Where a <strong>second badge</strong> appears
      beside it, that ambiguity HAS been resolved, from synced group membership rather than from any
      new read: hover it for the reasoning. Where no second badge appears, no login gate is known and
      the honest answer is still that we cannot tell.
      <strong>Detail</strong> is the directory's own diagnostic, passed through rather than
      interpreted. On Active Directory it carries a <code>data &lt;hex&gt;</code> sub-code, which
      is what distinguishes an expired password from a locked account — the LDAP result code
      alone does not: <code>49</code> is returned for all of them. OpenLDAP leaves the field
      empty and signals expiry with code <code>53</code> instead.
      <strong>Replica</strong> is which oauth-server pod saw it, with the common prefix trimmed;
      the two replicas serve different attempts, so a name here is the pod whose log to read.
    </div>
  </section>`;
}

/* Who can actually LOG IN, against who holds access.

   THE ONE VIEW IN THIS DASHBOARD THAT DOES NOT START FROM RBAC, which is exactly why it sees something
   none of the others can: a role granted to somebody who cannot authenticate is access that can never
   be used. Measured on the reference cluster — 10 people held access through synced groups, 7 were in
   the login-gate group, so 3 held access they could not exercise, one of them through 26 groups.

   IT NEEDS NO LOGS. Membership comes from synced Group objects, so this panel is as true on a cluster
   that has never enabled Debug logging as on one that has — which is why loginsPage renders it in every
   branch, including the capture-disabled one.

   `synced: false` IS NOT ZERO FINDINGS. The gate group has to be pulled into OpenShift by the
   group-sync-operator before there is any membership to compare against, and a panel that rendered
   "0 people affected" when the answer is "we have no data" would be the worst thing on this page. */
function accessCard(d) {
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;

  // The narrowed shape, declared by the response itself: the viewer's own gate status,
  // rendered without the DN, the lists or the summary the payload no longer carries.
  if (d.scope === "self") return accessSelfCard(d);

  // No gate at all. A finding in itself rather than an absence, and stated as one: with no membership
  // clause in any identity provider's filter, everyone in its search base can sign in.
  if (!d.gated) {
    return `<section class="card">
      <h2>Cluster access</h2>
      <div class="empty-note"><strong>No login gate is configured.</strong> No identity provider's
        search filter carries a <code>memberOf</code> or <code>isMemberOf</code> clause, so any
        account in its search base can sign in — there is no group whose membership to check against.
      </div>
      <div class="filterbar-note">That is a finding, not a gap in this page. If the gate lives
        somewhere this cannot see — or the dashboard may not read the OAuth CR — name it explicitly
        with <code>clusterAccess.group</code>, set to the group's full DN.</div>
    </section>`;
  }

  // The DN is known and the Group is not synced: no membership to compare against. Say what is
  // missing and what to do, and do NOT render a zero.
  if (!d.synced) {
    return `<section class="card">
      <h2>Cluster access</h2>
      <div class="empty-note">
        The login gate is <code>${esc(d.dn)}</code>${d.source === "oauth"
          ? ", discovered from the identity provider's filter" : ", from configuration"},
        and <strong>no synced group matches it</strong> — so there is no membership to compare
        against. This is missing data, not a clean result.
      </div>
      <div class="filterbar-note">${esc(d.note)}</div>
    </section>`;
  }

  const s = d.summary || {};
  const rows = d.access_without_login || [];
  const gatedOnly = d.login_without_access || [];
  const stranded = s.access_without_login || 0;
  return `<section class="card">
    <div class="section-head"><h2>Cluster access</h2><span class="flush"></span>
      <span class="chip" title="${d.source === "oauth"
        ? "Discovered from the identity provider's search filter. Set clusterAccess.group to state it explicitly instead."
        : "From clusterAccess.group."}">${d.source === "oauth" ? "discovered" : "configured"}</span>
    </div>
    <div class="hero">
      <span class="value mono">${stranded}</span>
      <span class="label">${stranded
        ? `${stranded === 1 ? "person holds" : "people hold"} access they cannot use`
        : "everyone with access can log in"}</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Gate group</div>
        <div class="value mono" style="font-size:var(--text-lg)">${esc(d.group_name)}</div></div>
      <div class="kpi"><div class="label">Allowed to log in</div>
        <div class="value mono">${s.gated_members || 0}</div></div>
      <div class="kpi"><div class="label">Hold access</div>
        <div class="value mono">${s.with_access || 0}</div></div>
      <div class="kpi ${stranded ? "flag-critical" : ""}"><div class="label">Cannot log in</div>
        <div class="value mono ${stranded ? "" : "muted"}">${stranded}</div></div>
      <div class="kpi"><div class="label">Gated, no access</div>
        <div class="value mono ${s.login_without_access ? "" : "muted"}">${
          s.login_without_access || 0}</div></div>
    </div>
    <div class="filterbar-note" style="margin-top:8px">
      Membership of <code>${esc(d.dn)}</code> is required to authenticate, so anybody outside it
      cannot use access they hold. Both spellings of the membership attribute are read when the DN is
      discovered — <code>memberOf</code> on OpenLDAP and Active Directory,
      <code>isMemberOf</code> on 389-ds and Oracle DSEE — because neither is standardised.
    </div>
  </section>
  ${stranded ? `<section class="card">
    <h3>Access that cannot be used</h3>
    <div class="scroll-x"><table>
      <thead><tr><th>User</th><th class="num">Groups</th><th>Through</th>
        <th>Member since</th><th>Tried to log in</th></tr></thead>
      <tbody>${rows.map((r) => `<tr>
        <td><button type="button" class="drill mono" data-user="${esc(r.user_name)}">${
          esc(r.user_name)}</button>${r.full_name
            ? ` <span class="muted">· ${esc(r.full_name)}</span>` : ""}</td>
        <td class="num">${r.group_count}</td>
        <td class="muted">${(r.groups || []).slice(0, 2).map((g) =>
          `<code>${esc(g)}</code>`).join(" ")}${(r.groups || []).length > 2
            ? ` <span class="muted">+${r.groups.length - 2} more</span>` : ""}</td>
        <td class="mono" style="white-space:nowrap">${esc(fmtTime(r.first_seen_at))}</td>
        <td>${r.has_tried
          ? `<span class="badge warning"><span class="glyph" aria-hidden="true"></span>yes, and was refused</span>`
          : `<span class="muted">not since capture began</span>`}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    ${d.truncated ? `<div class="truncation-note">
      Showing <strong>${rows.length}</strong> of <strong>${stranded}</strong>. The counts above cover
      all of them.</div>` : ""}
    <div class="filterbar-note" style="margin-top:8px">
      Every one of these holds access through a synced group and is not in the gate group, so the
      access is unusable until either the person is added to the gate group or the grant is removed —
      <strong>which of those is right is the access review's decision, not this page's</strong>.
      <strong>Tried to log in</strong> reads the login record, so it only sees attempts since capture
      began; <em>not since capture began</em> is not evidence that nobody tried.
      A name here that is <em>also</em> in the login record with <code>no match</code> is the case the
      oauth log cannot resolve on its own: a real person, outside the gate group, rather than a
      username that does not exist.
    </div>
  </section>` : ""}
  ${gatedOnly.length ? `<section class="card">
    <h3>Allowed to log in, holds no access</h3>
    <div class="scroll-x"><table>
      <thead><tr><th>User</th><th>In the gate group since</th><th>Tried to log in</th></tr></thead>
      <tbody>${gatedOnly.map((r) => `<tr>
        <td class="mono">${esc(r.user_name)}${r.full_name
          ? ` <span class="muted">· ${esc(r.full_name)}</span>` : ""}</td>
        <td class="mono" style="white-space:nowrap">${esc(fmtTime(r.first_seen_at))}</td>
        <td>${r.has_tried ? `<span class="badge ok"><span class="glyph" aria-hidden="true"></span>yes</span>`
          : `<span class="muted">not since capture began</span>`}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="filterbar-note" style="margin-top:8px">
      Not automatically a problem — a new joiner looks exactly like this, and so does somebody who
      only needs what <code>system:authenticated</code> already grants. It is worth reading because it
      is also where a SERVICE identity inside the gate group shows up: on the reference directory the
      group's own LDAP bind account carries a <code>uid</code>, so it syncs like a person and can
      authenticate with its bind password.
    </div>
  </section>` : ""}`;
}

/* Accounts that reached the login page and belong to no synced group.

   The one table on this page that is a FINDING rather than a record, which is why it sits above
   the chronology and not inside it. Two columns turn it from a curiosity into something
   actionable: `last_outcome` separates "still getting in" from "trying and failing", and
   `has_history` separates an account whose access was REMOVED and is still being used from a
   name this cluster has never governed at all. Those are different problems with different
   owners — the first is an offboarding that did not finish, the second is usually a person
   pointed at the wrong cluster, or someone who should not be there. */
function ungovernedCard(d, rows) {
  const total = (d.summary || {}).ungoverned_users || 0;
  if (!total) {
    return `<section class="card">
      <h3>Accounts in no synced group</h3>
      <div class="empty-note">None. Every account seen signing in — successfully or not — is a
        member of at least one synced group. Attempts on a local HTPasswd provider are excluded by
        configuration (<code>loginCapture.htpasswdProviders</code>), because a break-glass account has
        no synced group to belong to and nowhere to migrate to.</div>
    </section>`;
  }
  return `<section class="card">
    <h3>Accounts in no synced group</h3>
    <div class="scroll-x"><table>
      <thead><tr><th>User</th><th class="num">Attempts</th><th>First seen</th><th>Last seen</th>
        <th>Last outcome</th><th>Ever governed</th></tr></thead>
      <tbody>${rows.map((r) => `<tr>
        <td>${loginUser({ user_name: r.user_name, has_history: r.has_history, known_user: false })}</td>
        <td class="num">${r.attempts}</td>
        <td class="mono" style="white-space:nowrap">${esc(fmtTime(r.first_at))}</td>
        <td class="mono" style="white-space:nowrap">${esc(fmtTime(r.last_at))}</td>
        <td>${outcomeBadge(r.last_outcome)}</td>
        <td>${r.has_history
          ? `<span class="err">was, and no longer is</span>`
          : `<span class="muted">never</span>`}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    ${rows.length < total ? `<div class="truncation-note">
      Showing <strong>${rows.length}</strong> of <strong>${total}</strong>. The rest are in the
      chronology below, marked the same way.
    </div>` : ""}
    <div class="filterbar-note" style="margin-top:8px">
      Membership is checked against what this dashboard has SYNCED, so an account here is in no
      group the operator manages — it may still hold access granted by a binding made by hand,
      which the <strong>Access granted</strong> tab is where to look. <strong>Ever governed</strong>
      reads the membership timeline: <em>was, and no longer is</em> means the removal is recorded
      and the account is still being used, which is an offboarding that did not finish.
      Attempts on a local HTPasswd provider are excluded, so an account that only ever signs in that
      way — <code>kubeadmin</code>, <code>developer</code> — never appears here. The exclusion is per
      ATTEMPT, not per name: if somebody types a break-glass name at the <em>directory</em> provider
      it does appear, on the strength of that attempt, which is worth seeing rather than hiding.
    </div>
  </section>`;
}

/* Group drill-down: who is in it, since when, and what has changed. */
function groupDetail() {
  const d = data.group;
  // A DESIGNED refusal: at the narrowed tier a group outside your membership answers a
  // 403 that is byte-identical for a real group and a nonexistent one — no existence
  // oracle — so this card must not claim to know which it was.
  if (d && d.forbidden) {
    return refusalCard(view.group || "This group",
      `Only groups you belong to are visible at your tier. This one is outside your view —
       or does not exist; the two are deliberately indistinguishable.`, true);
  }
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;

  const members = d.members || [];
  // The whole list before the filter narrows it, so the header can report what was hidden — the
  // same denominator rule as the Groups and Users tabs. Both fields, so a member is findable by
  // the display name a reader knows as well as the id the cluster knows.
  const shown = members.filter((m) => matchesSearch([m.user_name, m.full_name], view.memberSearch));
  const memberSearching = (view.memberSearch || "").trim().length > 0;
  const memberQuery = (view.memberSearch || "").trim();
  const memberBody = shown.length
    ? `<div class="scroll-x"><table>
        <thead><tr><th>User</th><th>In this group since</th><th>First ever granted</th>
          <th>Last confirmed</th></tr></thead>
        <tbody>${shown.map((m) => {
          // Distinguished on purpose: if a user left and rejoined, "since" is the current
          // unbroken stretch while "first ever" is the original grant. Showing only the
          // former would tell an auditor access is newer than it is.
          const rejoined = m.original_first_seen_at
            && m.original_first_seen_at !== m.first_seen_at;
          return `<tr class="rowlink" data-user="${esc(m.user_name)}">
          <td><button type="button" class="drill">${esc(m.user_name)}</button>${m.full_name
            ? ` <span class="muted">· ${esc(m.full_name)}</span>` : ""}</td>
          <td class="mono">${esc(fmtTime(m.first_seen_at))} <span class="muted">(${esc(ago(m.first_seen_at))})</span></td>
          <td class="mono ${rejoined ? "" : "muted"}">${esc(fmtTime(m.original_first_seen_at))}${
            rejoined ? ` <span class="badge warning" style="margin-left:4px"><span class="glyph" aria-hidden="true"></span>rejoined</span>` : ""}</td>
          <td class="mono muted">${esc(ago(m.last_seen_at))}</td>
        </tr>`;}).join("")}</tbody>
      </table></div>`
    : (memberSearching && members.length > 0
        // Only blame the filter when it IS the filter: an empty group stays "no members" whatever
        // is typed, or the reader clears the box expecting rows and gets the same empty table.
        ? `<div class="empty-note">No member's id or name contains
            <strong>${esc(memberQuery)}</strong>. ${members.length === 1
            ? `1 member is in this group, so it is the search hiding them`
            : `${members.length} members are in this group, so it is the search hiding them`}
            rather than the group being empty.</div>`
        : `<div class="empty-note">This group has no members. If it is operator-managed, the
            LDAP-side members either do not resolve or were filtered out — no object is created
            for a member that cannot be resolved, so nothing else on the cluster shows this.</div>`);

  const changes = d.changes || [];
  const changeBody = changes.length
    ? `<div class="scroll-x"><table>
        <thead><tr><th>Change</th><th>User</th><th>Observed</th><th>Sync that carried it</th></tr></thead>
        <tbody>${changes.map((c) => `<tr>
          <td class="change-${esc(c.change)}">${c.change === "added" ? "+ joined" : "− left"}</td>
          <td><button type="button" class="drill"
                data-user="${esc(c.user_name)}">${esc(c.user_name)}</button></td>
          <td class="mono">${esc(fmtTime(c.observed_at))}</td>
          <td class="mono muted">${esc(c.group_synced_at ? fmtTime(c.group_synced_at) : "—")}</td>
        </tr>`).join("")}</tbody>
      </table></div>`
    : `<div class="empty-note">No membership changes seen yet. This timeline is accumulated
        by polling, so it starts when this dashboard does — it is not a history of the group.</div>`;

  return `<section class="card">
    <button class="back" id="back-groups">${backLabel()}</button>
    <h2 style="margin-top:10px">${esc(d.name)}
      ${d.deleted ? sevBadge("warning", "deleted") : ""}</h2>
    ${d.deleted ? `<div class="filterbar-note" style="margin-top:6px">
      This group no longer exists on the cluster. It is still reachable from the membership
      history below, which is why this page is not an error — the record of who was in it,
      and when it went, is the answer to the click.</div>` : ""}
    <div class="kpis">
      <div class="kpi"><div class="label">Members</div><div class="value">${d.member_count}</div></div>
      <div class="kpi"><div class="label">Owner</div>
        <div class="value" style="font-size:15px">${d.owner
          ? ownerCell(d.sync_provider) : `<span class="err">unattributed</span>`}</div></div>
      <div class="kpi"><div class="label">Schedule</div>
        <div class="value" style="font-size:15px"><code>${esc(d.owner ? d.owner.schedule : "—")}</code></div></div>
      <div class="kpi"><div class="label">Last refreshed</div>
        <div class="value" style="font-size:15px">${esc(ago(d.group_synced_at))}</div></div>
    </div>
    ${d.ldap_uid ? `<div style="margin-top:12px"><h3>Source DN</h3>
      <code>${esc(d.ldap_uid)}</code></div>` : ""}
  </section>
  <section class="card">
    <h2>Members <span class="muted" style="font-weight:400">· ${memberSearching
      ? `${shown.length} of ${members.length} shown` : members.length}</span></h2>
    <div class="filterbar-note" style="margin:4px 0 8px">
      <strong>Select a user to see every group they belong to.</strong>
      "Member since" is when this dashboard first observed the user in the group — not when
      LDAP added them. It cannot predate this dashboard.
    </div>
    ${memberSearching ? `<div class="filterbar-note" style="margin:0 0 8px">Filtered by
      <strong>${esc(memberQuery)}</strong> — every word must appear in the id or the name.${members.length > 0
      ? ` Clear the box, or press Escape in it, to see all ${members.length}.` : ""}</div>` : ""}
    ${memberBody}
  </section>
  ${bindingsCard(d.bindings, "This group")}
  <section class="card">
    <h2>Membership changes</h2>
    ${changeBody}
  </section>`;
}

/* Direct bindings only. The heading and the note both say so, because a reader who thinks
   this is an effective-permission calculation could conclude access is absent when it is
   not — a false negative here gets an incident closed wrongly. */
function bindingsCard(bindings, who) {
  const rows = bindings || [];
  const ns = rows.filter((b) => b.binding_kind === "RoleBinding");
  const cluster = rows.filter((b) => b.binding_kind === "ClusterRoleBinding");
  const namespaces = [...new Set(ns.map((b) => b.binding_namespace))];

  const table = (list, scoped) => `<div class="scroll-x"><table>
      <thead><tr>${scoped ? "<th>Namespace</th>" : ""}<th>Role</th><th>Binding</th>
        ${list[0] && list[0].via_group ? "<th>Via group</th>" : ""}</tr></thead>
      <tbody>${list.map((b) => `<tr>
        ${scoped ? `<td>${esc(b.binding_namespace)}</td>` : ""}
        <td><code>${esc(b.role_name)}</code> <span class="muted">${esc(b.role_kind)}</span></td>
        <td class="muted">${esc(b.binding_name)}</td>
        ${b.via_group ? `<td><button type="button" class="drill" data-group="${esc(b.via_group)}">${esc(b.via_group)}</button></td>` : ""}
      </tr>`).join("")}</tbody></table></div>`;

  return `<section class="card">
    <h2>Access granted <span class="muted" style="font-weight:400">· direct role bindings</span></h2>
    <div class="filterbar-note" style="margin:4px 0 10px">
      ${esc(who)} is named by these bindings. Role rules are <strong>not</strong> evaluated,
      so this is what has been granted, not a computed list of permitted actions.
    </div>
    ${rows.length === 0
      ? `<div class="empty-note">No RoleBindings or ClusterRoleBindings name this group.
          It grants no access on this cluster — which, for a synced group, usually means
          the binding was never created.</div>`
      : `<div class="kpis" style="margin-top:0">
          <div class="kpi"><div class="label">Namespaces</div><div class="value">${namespaces.length}</div></div>
          <div class="kpi"><div class="label">Cluster-wide roles</div>
            <div class="value ${cluster.length ? "" : "muted"}">${cluster.length}</div></div>
        </div>
        ${cluster.length ? `<h3 style="margin-top:14px">Cluster-wide</h3>${table(cluster, false)}` : ""}
        ${ns.length ? `<h3 style="margin-top:14px">Namespaced</h3>${table(ns, true)}` : ""}`}
  </section>`;
}

/* Reverse lookup — the "why does this person have access?" view. */
function userDetail() {
  const d = data.user;
  if (d && d.forbidden) {
    return refusalCard(view.user || "This user",
      `Only your own profile is visible at your tier.`, true);
  }
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  const groups = d.groups || [];
  return `<section class="card">
    <button class="back" id="back-groups">${backLabel()}</button>
    <h2 style="margin-top:10px">${esc(d.user)}${d.full_name
      ? ` <span class="muted">· ${esc(d.full_name)}</span>` : ""}</h2>
    <div class="kpis">
      <div class="kpi"><div class="label">Groups</div><div class="value">${groups.length}</div></div>
      <div class="kpi"><div class="label">Logged in</div><div class="value">${d.logged_in ? "yes" : "no"}</div></div>
      ${d.first_login_at ? `<div class="kpi"><div class="label">First login</div><div class="value mono" style="font-size:1rem">${esc(fmtTime(d.first_login_at))}</div></div>` : ""}
      ${d.login_capture === "off" ? "" : `<div class="kpi"><div class="label">Last captured login</div><div class="value mono" style="font-size:1rem">${d.last_login_at ? esc(fmtTime(d.last_login_at)) : "none"}</div></div>`}
    </div>
    <div class="filterbar-note" style="margin-top:8px">
      ${d.logged_in
        ? `Has logged in to this cluster${(d.providers || []).length ? ` through <span class="mono">${d.providers.map(esc).join(", ")}</span>` : ""}.`
        : `Has <strong>never logged in</strong> to this cluster — OpenShift has no User object for this id.
           Membership below comes from group sync, which does not depend on a login.`}
      Every group this user belongs to on this cluster is listed below; the cluster itself can only
      answer this by scanning every Group object.
    </div>
  </section>
  <section class="card">
    <h2>Group memberships</h2>
    ${groups.length === 0
      ? ((d.changes || []).length
          ? `<div class="empty-note">This user is currently in no groups on this cluster. They
              were in at least one before — see the history below. That is the answer to
              "did they lose everything, or just this one?", not an error.</div>`
          // A User who logged in and was never in a synced group: the row exists because of the
          // login, and there is no history to point at. Administrators and service identities
          // land here; so does anyone granted access outside group sync.
          : `<div class="empty-note">This user has never been in a synced group on this cluster.
              Whatever access they hold was granted outside group sync — see the bindings below.</div>`)
      : `<div class="scroll-x"><table>
          <thead><tr><th>Group</th><th>Owner</th><th>Member since</th></tr></thead>
          <tbody>${groups.map((g) => `<tr class="rowlink" data-group="${esc(g.group_name)}">
            <td><button type="button" class="drill" data-group="${esc(g.group_name)}">${esc(g.group_name)}</button></td>
            <td>${ownerCell(g.sync_provider)}</td>
            <td class="mono">${esc(fmtTime(g.first_seen_at))}</td>
          </tr>`).join("")}</tbody>
        </table></div>`}
  </section>
  ${bindingsCard(d.bindings, esc(d.user))}
  <section class="card">
    <h2>History</h2>
    ${(d.changes || []).length === 0
      ? `<div class="empty-note">No membership changes observed for this user yet.</div>`
      : `<div class="scroll-x"><table>
          <thead><tr><th>Change</th><th>Group</th><th>Observed</th></tr></thead>
          <tbody>${d.changes.map((c) => `<tr class="rowlink" data-group="${esc(c.group_name)}">
            <td class="change-${esc(c.change)}">${c.change === "added" ? "+ joined" : "− left"}</td>
            <td><button type="button" class="drill" data-group="${esc(c.group_name)}">${esc(c.group_name)}</button></td>
            <td class="mono">${esc(fmtTime(c.observed_at))}</td>
          </tr>`).join("")}</tbody>
        </table></div>`}
  </section>`;
}


/* Every group-subject binding on the cluster, classified, filtered by the row above.
   Defaults to "needs review" because that is the only part nothing else reports — but the
   healthy majority is one filter away, so the page describes the cluster rather than only
   its faults. An earlier version showed ONLY the non-resolving rows under the same
   "Bindings" label, which misrepresented 228 bindings as 154. */
function bindingsPage() {
  const d = data.findings;
  // A DESIGNED 403 (the binding surface is the administrator tier), phrased — never the
  // generic error card, and never a blank that reads as a healthy cluster.
  if (d && d.forbidden) {
    return refusalCard("Access granted",
      `Every group-subject binding on this cluster — who has been granted what — is the
       cluster's RBAC surface.`);
  }
  if (!d) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  const c = d.counts || {};
  const review = (c.dangling || 0) + (c.unresolved || 0);

  const header = `<section class="card">
    <div class="kpis" style="margin-top:0">
      <div class="kpi"><div class="label">Group bindings on this cluster</div>
        <div class="value">${d.total || 0}</div></div>
      <div class="kpi"><div class="label">Grant a real group</div>
        <div class="value muted">${c.ok || 0}</div></div>
      <div class="kpi"><div class="label">Need review</div>
        <div class="value ${review ? "" : "muted"}">${review}</div></div>
      <div class="kpi"><div class="label">Built-in</div>
        <div class="value muted">${c.built_in || 0}</div></div>
    </div>
    <div class="filterbar-note" style="margin-top:10px">
      Direct RoleBindings and ClusterRoleBindings whose subject is a Group. Role rules are
      <strong>not</strong> evaluated, so this is what has been granted, not a computed list
      of permitted actions.
    </div>
  </section>`;

  // The policy-operator strip is part of the page, not of a filter: these CRs template
  // the bindings this page shows, so their health belongs beside them whichever tier is
  // selected. It was originally rendered only on the default filter, where nobody found it.
  if (view.bindingFilter === "unmanaged") {
    return header + bindingSection("Unmanaged",
      `The group is operator-synced, other bindings on this cluster carry the policy
       operator's <code>config-source</code> label, and this one carries none — somebody
       granted access by hand, outside the policy system. A deliberate one can be
       acknowledged with the <code>rbac.ocp.io/unmanaged-exception</code> annotation on the
       binding itself, which records the justification next to the object and clears it
       from this list.`,
      d.unmanaged || [], sevBadge("warning", "unmanaged"));
  }
  if (view.bindingFilter === "ok") {
    return header + bindingSection("Granted",
      "The group named by each of these exists, so the access reaches its members.",
      d.ok || []);
  }
  if (view.bindingFilter === "built_in") {
    return header + bindingSection("Built-in",
      `Kubernetes virtual groups such as <code>system:authenticated</code> and
       <code>system:serviceaccounts:*</code>. They authorise real access and no Group object
       exists for them by design, so their absence is expected and not a fault.`,
      d.built_in || []);
  }
  if (view.bindingFilter === "all") {
    return header
      + bindingSection("Dangling", "The group was operator-managed and has disappeared — this "
          + "binding now grants nobody.", d.dangling || [], sevBadge("critical", "dangling"))
      + bindingSection("Unresolved", "Names a group that has never existed here.",
          d.unresolved || [], sevBadge("warning", "unresolved"))
      + bindingSection("Unmanaged", "Hand-made grant on an operator-synced group, outside the "
          + "policy system.", d.unmanaged || [], sevBadge("warning", "unmanaged"))
      + bindingSection("Granted", "The group exists; access reaches its members.", d.ok || [])
      + bindingSection("Built-in", "Virtual groups; no Group object is expected.", d.built_in || []);
  }

  // default: needs review. The header goes here too — without it this view would show a
  // subset with no statement of the whole, which is the exact misrepresentation the filter
  // was added to fix.
  return header + `<section class="card">
    <div class="hero">
      <div class="value">${review}</div>
      <div class="label">binding${review === 1 ? "" : "s"} that grant nobody</div>
    </div>
    <div class="filterbar-note">
      Each names a Group that does not exist, so the access it grants reaches no one.
      Nothing on the cluster reports this — <code>oc get rolebinding</code> shows a
      perfectly healthy object. Switch the filter above to see all ${d.total || 0} group
      bindings.
    </div>
  </section>
  ${bindingSection("Dangling", "The group was operator-managed and has disappeared.",
      d.dangling || [], sevBadge("critical", "dangling"))}
  ${bindingSection("Unresolved",
      `These do not raise alerts: a group that has never been seen cannot be told apart
       from one that simply has not synced yet. They still grant nobody — typically a
       misspelled group name, or an onboarding that stopped halfway.`,
      d.unresolved || [], sevBadge("warning", "unresolved"))}
  ${bindingSection("Unmanaged",
      `Hand-made grants on operator-synced groups, outside the policy system. Acknowledge
       a deliberate one with the <code>rbac.ocp.io/unmanaged-exception</code> annotation on
       the binding; the justification then lives next to the object and clears it here.`,
      d.unmanaged || [], sevBadge("warning", "unmanaged"))}`;
}

/* Binding table + section card, at module scope so both the Access-granted and the
   RBAC-policy pages render bindings identically. These were local to bindingsPage(), and
   calling them from the new page failed at runtime with "section is not defined" — caught
   by a screenshot, not by the suite, because no test opened that tab. tests/test_ui.py
   now does. */
function bindingTable(rows) {
  return `<div class="scroll-x"><table>
      <thead><tr><th>Group named by the binding</th><th>Grants</th><th>Scope</th>
        <th>Binding</th></tr></thead>
      <tbody>${rows.map((r) => `<tr>
        <td><button type="button" class="drill" data-group="${esc(r.group_name)}">${esc(r.group_name)}</button></td>
        <td><code>${esc(r.role_name)}</code> <span class="muted">${esc(r.role_kind)}</span></td>
        <td>${r.binding_namespace
              ? esc(r.binding_namespace)
              : `<span class="muted">cluster-wide</span>`}</td>
        <td class="muted">${esc(r.binding_name)}</td>
      </tr>`).join("")}</tbody></table></div>`;
}

function bindingSection(title, note, rows, badge) {
  return `<section class="card">
    <h2>${badge || ""} ${esc(title)} <span class="muted" style="font-weight:400">· ${rows.length}</span></h2>
    ${note ? `<div class="filterbar-note" style="margin:4px 0 8px">${note}</div>` : ""}
    ${rows.length ? bindingTable(rows) : `<div class="empty-note">None.</div>`}
  </section>`;
}

/* RBAC policy: who governs the grants, rather than what the grants are.
   Split out of the Access-granted tab because it answers a different question — that page
   asks "who has access?", this one asks "is the system that decides access working, and is
   anything bypassing it?". Two concerns that happen to share a data source. */
function policyPage() {
  const oc = data.operatorConfigs;
  // The findings 403 is DESIGNED; the CR health beside it is governance data and still
  // renders. A named refusal, never a blank — an empty policy tab reads as "nothing
  // bypasses the policy system", which at the narrowed tier is not knowledge anyone has.
  if (data.findings && data.findings.forbidden) {
    return refusalCard("RBAC policy",
      `The grants that bypass the policy system name other people's access.`)
      + configHealth(oc);
  }
  const f = data.findings || {};
  const unmanaged = f.unmanaged || [];
  const stamped = unmanaged.filter((r) => r.audit_stamped).length;

  if (oc && !oc.present) {
    return `<section class="card">
      <h2>RBAC policy</h2>
      <div class="empty-note">
        The namespace-configuration-operator is not installed on <code>${esc(view.cluster)}</code>.
        This page reports the health of its NamespaceConfig and GroupConfig CRs and finds
        grants that bypass them; without the operator there is no policy system to report on.
      </div>
    </section>`;
  }

  return `<section class="card">
    <h2>RBAC policy</h2>
    <div class="hero">
      <span class="value mono">${unmanaged.length}</span>
      <span class="label">grant${unmanaged.length === 1 ? "" : "s"} outside the policy system</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Policy CRs</div>
        <div class="value mono">${(oc && oc.configs || []).length}</div></div>
      <div class="kpi ${unmanaged.length ? "flag-warning" : ""}">
        <div class="label">Unmanaged</div>
        <div class="value mono ${unmanaged.length ? "" : "muted"}">${unmanaged.length}</div></div>
      <div class="kpi"><div class="label">Audit-stamped</div>
        <div class="value mono ${stamped ? "" : "muted"}">${stamped}</div></div>
    </div>
    <div class="filterbar-note" style="margin-top:10px">
      A grant is <strong>unmanaged</strong> when it names an operator-synced group but
      carries none of the policy operator's provenance — somebody granted access by hand.
      Acknowledge a deliberate one with the
      <code>rbac.ocp.io/unmanaged-exception</code> annotation on the binding; the
      justification then lives next to the object and clears it here.
      ${stamped ? `<br>Audit stamping is enabled, so the current set is also selectable
        straight from the cluster:
        <br><code>oc get rolebindings,clusterrolebindings -A -l rbac.ocp.io/unmanaged=true</code>`
      : ""}
    </div>
  </section>
  ${configHealth(oc)}
  ${bindingSection("Grants outside the policy system",
      `Each names a group the operator syncs, and nothing templates the grant itself.`,
      unmanaged, sevBadge("warning", "unmanaged"))}`;
}

/* Roles granted directly to a person, rolled up per namespace: the migration worklist.
   A direct user binding is the violation this whole dashboard is shaped around — it
   survives offboarding, because revoking an LDAP group membership does nothing to a
   binding that names the person. Presented per namespace because that is the unit the
   migration is done in, and because "which namespaces still do this?" is the question an
   owner actually asks. */
function nsAuditPage() {
  const ub = data.userBindings;
  if (!ub) return `<section class="card"><div class="empty-note">Loading…</div></section>`;
  // Both narrowed shapes are the SERVER's call, read off the wire: a scoped payload
  // renders the viewer's own grants, a designed 403 a named refusal. The page never
  // decides which applies.
  if (ub.forbidden) return refusalCard("Namespace audit",
    `The per-namespace worklist of direct user grants names people and their access.`);
  if (ub.scope === "self") return selfGrantsView(ub);
  return directUserGrants(ub);
}

/* Risk tier for one namespace's worst grant. Ranked on PRIVILEGE and SCOPE, never on
   count: one forgotten cluster-admin outranks twenty view grants, and a page sorted by
   volume puts the twenty first and buries the one. */
function riskTier(row) {
  const p = row.worst_privilege || 1;
  const clusterWide = !!row.cluster_scoped;
  if (clusterWide && p >= 3) return { key: "critical", label: "Critical", rank: 4 };
  if (p >= 4) return { key: "critical", label: "Critical", rank: 4 };
  if (p >= 3 || clusterWide) return { key: "high", label: "High", rank: 3 };
  if (p >= 2) return { key: "medium", label: "Medium", rank: 2 };
  return { key: "low", label: "Low", rank: 1 };
}

/* The exposed-user list for one namespace, bounded.
   A namespace with forty direct grants would otherwise put forty names in one cell and the
   column would decide the width of the whole table — on the view that is supposed to be the
   scannable one. Show the first few, then an honest count and a way to see the rest.

   WHO_PREVIEW is small on purpose. The question this table answers is "which namespaces are
   exposed and how badly"; the names are corroboration, and the full roster lives one section
   down in Every grant. */
const WHO_PREVIEW = 4;

function whoCell(row) {
  const users = row.users || [];
  if (!users.length) return '<span class="muted">—</span>';
  const open = view.nsWhoOpen.has(row.namespace);
  const shown = open ? users : users.slice(0, WHO_PREVIEW);
  const hidden = users.length - shown.length;
  const names = shown.map((u) => `<span class="who-name">${esc(u)}</span>`).join("");
  if (!hidden && !open) return names;
  return names + `<button type="button" class="linkish who-more" data-who="${esc(row.namespace)}">`
    + (open ? "show fewer" : `+${hidden} more`) + "</button>";
}

const PRIVILEGE_NAME = { 4: "cluster-admin", 3: "admin", 2: "edit", 1: "view" };
const PRIVILEGE_RANK = { "cluster-admin": 4, admin: 3, edit: 2, view: 1 };

/* How many grants the detail list asks for. Not a display cap — the server applies it, so
   the rows never cross the wire. 200 is well past what anyone reads in one sitting and
   still small enough to render instantly; the server orders worst-first before limiting,
   so a truncated page is the top of the list rather than a slice of the middle. */
const NS_GRANT_PAGE = 200;

/* Same idea for the binding tiers. Unbounded until now: measured at 2,280 rows / 545,800
   bytes on a cluster ten times the reference size, re-fetched every 30 seconds by the
   auto-refresh. The response's `counts` are computed server-side over the whole cluster, so
   the tier totals the page displays stay correct while only the rows are a page. */
const FINDINGS_PAGE = 500;

/* Sort a copy, never the array the renderer was handed — sorting in place would reorder
   `data.userBindings` itself, so the store's risk ranking would be lost after the first
   click and could never be restored without a refetch. */
function sortBy(rows, keyFn, dir) {
  const sign = dir === "asc" ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = keyFn(a), y = keyFn(b);
    if (x === y) return 0;
    // Numbers compare numerically, strings alphabetically. Comparing "10" < "9" as strings
    // is the classic way a count column sorts wrongly and nobody notices.
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sign;
  });
}

/* A sortable column header.
   A <button> inside the <th>, not a click handler on the <th> itself: a bare th is not
   focusable and not announced as actionable, so header sorting becomes mouse-only. The
   arrow is text rather than a glyph so it survives forced-colors, and aria-sort tells a
   screen reader which column is ordering the table and in which direction. */
function sortableTh(label, key, activeKey, dir, group, extraClass) {
  const active = key === activeKey;
  const next = active && dir === "desc" ? "asc" : "desc";
  const aria = active ? (dir === "asc" ? "ascending" : "descending") : "none";
  const arrow = active ? (dir === "asc" ? " ▲" : " ▼") : "";
  return `<th class="${extraClass || ""}" aria-sort="${aria}">
    <button type="button" class="th-sort${active ? " is-active" : ""}"
            data-sort-group="${group}" data-sort-key="${key}" data-sort-dir="${next}"
            title="Sort by ${esc(label)}">${esc(label)}${arrow}</button>
  </th>`;
}

/* Roles granted directly to a person, ranked by risk. */
function directUserGrants(ub) {
  if (!ub) return "";
  const rows = (ub.by_namespace || []).map((r) => ({ ...r, risk: riskTier(r) }));
  const bindings = ub.bindings || [];
  // `total` is the server's count BEFORE its limit. Falling back to the returned length
  // would make a truncated page claim to be complete, which is the one failure this whole
  // change exists to avoid.
  const total = ub.total != null ? ub.total : bindings.length;
  // Cluster-wide grant count, summed from the rollup because that is the one part of the
  // response neither paged NOR filtered. `ub.total` is the total for the CURRENT filter,
  // which is right for the detail list's own labelling and wrong for a headline KPI.
  const totalAllNamespaces = rows.reduce((n, r) => n + (r.bindings || 0), 0);
  const critical = rows.filter((r) => r.risk.key === "critical");
  const high = rows.filter((r) => r.risk.key === "high");
  // Distinct PEOPLE, unioned from the rollup rather than counted from `bindings`.
  //
  // Two wrong ways to get this number, both of which were briefly in this file. Counting
  // `bindings` is correct only while nothing is paged — once the detail list is truncated
  // or filtered to one namespace it silently reports the page, not the cluster. Summing
  // `distinct_users` across namespaces double-counts anyone with grants in more than one:
  // on the reference cluster jdoe holds grants in three, so the sum says 6 where the truth
  // is 4. The rollup's `users` list is never paged, so the union of it is both complete and
  // distinct.
  const people = new Set(rows.flatMap((r) => r.users || [])).size;

  const NS_SORT = {
    risk: (r) => r.risk.rank * 10 + (r.cluster_scoped ? 1 : 0),
    namespace: (r) => r.namespace,
    priv: (r) => r.worst_privilege || 0,
    people: (r) => r.distinct_users || 0,
    grants: (r) => r.bindings || 0,
  };
  const GRANT_SORT = {
    person: (b) => b.user_name,
    // Sort the ROLE by privilege, not alphabetically: "admin" < "edit" < "view" as text
    // puts the dangerous grants in the middle, which is the opposite of useful.
    risk: (b) => (PRIVILEGE_RANK[b.role_name] || 0) * 10 + (b.binding_namespace ? 0 : 1),
    scope: (b) => b.binding_namespace || "",
    binding: (b) => b.binding_name,
  };
  const sorted = sortBy(rows, NS_SORT[view.nsSort] || NS_SORT.risk, view.nsDir);
  const sortedGrants = sortBy(
    bindings, GRANT_SORT[view.nsGrantSort] || GRANT_SORT.risk, view.nsGrantDir);

  if (!rows.length) {
    return `<section class="card">
      <h2>Namespace audit</h2>
      <div class="hero"><span class="value mono">0</span>
        <span class="label">namespaces grant access to a person</span></div>
      <div class="filterbar-note">
        Every role on this cluster is granted to a group. That is what makes offboarding
        a single action: removing someone from an LDAP group revokes their access
        everywhere at once.
        ${ub.excluded_platform ? `<br><span class="muted">${ub.excluded_platform} platform
          identit${ub.excluded_platform === 1 ? "y" : "ies"} excluded — system components
          and <code>kubeadmin</code> are break-glass, with nowhere to migrate to.</span>` : ""}
      </div>
    </section>`;
  }

  const worst = rows[0].risk;
  return `<section class="card">
    <h2>Namespace audit</h2>
    <div class="risk-headline">
      <span class="risk-pill risk-${worst.key}">${esc(worst.label)} exposure</span>
      <span class="muted">highest risk on this cluster</span>
    </div>
    <div class="kpis" style="margin-top:14px">
      <div class="kpi big ${critical.length ? "flag-critical" : ""}">
        <div class="label">Namespaces at risk</div>
        <div class="value mono">${rows.length}</div></div>
      <div class="kpi big"><div class="label">People exposed</div>
        <div class="value mono">${people}</div></div>
      <div class="kpi big"><div class="label">Grants to migrate</div>
        <!-- Cluster-wide, never bindings.length. The list below is paged and may be
             filtered to one namespace; a headline count taken from it reports the page
             rather than the cluster, and shrinks when the reader narrows the filter, which
             reads as the problem getting smaller because they looked at it closely. -->
        <div class="value mono">${totalAllNamespaces}</div></div>
      <div class="kpi big ${critical.length ? "flag-critical" : ""}">
        <div class="label">Critical</div>
        <div class="value mono ${critical.length ? "err" : "muted"}">${critical.length}</div></div>
      <div class="kpi big ${high.length ? "flag-warning" : ""}">
        <div class="label">High</div>
        <div class="value mono ${high.length ? "" : "muted"}">${high.length}</div></div>
    </div>
  </section>

  <section class="card">
    <h3>Why this is a risk</h3>
    <div class="risk-grid">
      <div class="risk-item">
        <div class="risk-item-h">Offboarding does not revoke it</div>
        Removing someone from an LDAP group revokes their access everywhere at once. A
        binding that names the <strong>person</strong> keeps granting after they leave the
        team, change role, or leave the company — until somebody remembers it exists.
      </div>
      <div class="risk-item">
        <div class="risk-item-h">Invisible to access review</div>
        Every group-based review — including the rest of this dashboard — answers
        “who is in the group?”. These grants are attached to no group, so a clean review
        can coexist with standing access nobody approved.
      </div>
      <div class="risk-item">
        <div class="risk-item-h">No approval trail</div>
        Group membership is granted in the enterprise directory, with a request and an
        approver. A hand-made binding records only who ran <code>oc</code>, and only for as
        long as the audit log is retained.
      </div>
    </div>
  </section>

  <section class="card">
    <h3>Exposure by namespace</h3>
    <div class="filterbar-note" style="margin-bottom:8px">
      Ranked by the <strong>worst privilege granted</strong>, not by count — one forgotten
      <code>cluster-admin</code> matters more than twenty <code>view</code> grants.
      ${view.nsSort !== "risk" || view.nsDir !== "desc"
        ? `<button type="button" class="linkish" data-ns-reset>Restore risk order</button>`
        : ""}
    </div>
    <div class="scroll-x"><table class="audit-table">
      <thead><tr>
        ${sortableTh("Risk", "risk", view.nsSort, view.nsDir, "ns")}
        ${sortableTh("Namespace", "namespace", view.nsSort, view.nsDir, "ns")}
        ${sortableTh("Highest privilege", "priv", view.nsSort, view.nsDir, "ns")}
        ${sortableTh("People", "people", view.nsSort, view.nsDir, "ns", "num")}
        ${sortableTh("Grants", "grants", view.nsSort, view.nsDir, "ns", "num")}
        <th>Who is exposed</th>
      </tr></thead>
      <tbody>${sorted.map((r) => `<tr class="risk-row risk-${r.risk.key}">
        <td><span class="risk-pill risk-${r.risk.key}">${esc(r.risk.label)}</span></td>
        <td class="ns-cell">${r.namespace === "(cluster-scoped)"
            ? `<strong class="err">CLUSTER-WIDE</strong>` : `<strong>${esc(r.namespace)}</strong>`}</td>
        <td><code class="priv">${esc(PRIVILEGE_NAME[r.worst_privilege] || "view")}</code></td>
        <td class="num strong">${r.distinct_users}</td>
        <td class="num">${r.bindings}</td>
        <td class="muted who">${whoCell(r)}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    ${ub.excluded_platform ? `<div class="filterbar-note" style="margin-top:8px">
      ${ub.excluded_platform} platform identit${ub.excluded_platform === 1 ? "y" : "ies"}
      excluded — system components and <code>kubeadmin</code> are break-glass and
      cluster-internal, with nowhere to migrate to.</div>` : ""}
  </section>

  <section class="card">
    <h3>How to close it</h3>
    <div class="filterbar-note" style="margin-bottom:10px">
      Work top-down: the table above is already in the order to do it in.
    </div>
    <ol class="runbook">
      <li><strong>Identify the role.</strong> Match the grant to the LDAP group the
        operator already syncs for that privilege — the naming convention encodes it
        (<code>&lt;app&gt;-ns-admin</code>, <code>-ns-developer</code>,
        <code>-ns-audit</code>).</li>
      <li><strong>Add the person to that group</strong> in the enterprise directory, through
        the normal request-and-approve path. Access now has an owner and an audit trail.</li>
      <li><strong>Wait one sync</strong> and confirm on the Groups tab that they appear as a
        member. Do not skip this — deleting first leaves them locked out.</li>
      <li><strong>Delete the direct binding.</strong>
        <code>oc delete rolebinding &lt;name&gt; -n &lt;namespace&gt;</code></li>
      <li><strong>Confirm it is gone</strong> here on the next refresh.</li>
    </ol>
    <div class="filterbar-note" style="margin-top:10px">
      <strong>Operational goal:</strong> zero rows on this page. At zero, one directory
      change offboards a person from the entire cluster, and an access review that reads
      clean <em>is</em> clean.
    </div>
  </section>

  <section class="card">
    <div class="section-head">
      <h3 class="flush">Every grant</h3>
      <button type="button" class="disclose" data-ns-grants
              aria-expanded="${view.nsGrantsOpen}" aria-controls="every-grant">
        <span class="disclose-arrow" aria-hidden="true">${view.nsGrantsOpen ? "▾" : "▸"}</span>
        ${view.nsGrantsOpen ? "Hide" : "Show"} ${total} grant${total === 1 ? "" : "s"}
      </button>
    </div>
    <div class="filterbar-note" style="margin-bottom:10px">
      The per-namespace table above is the view to work from. This is the flat detail
      list — collapsed by default on purpose, because on a cluster with thousands of
      direct grants rendering every row costs time nobody gets value from.
    </div>
    <div class="ns-controls">
      <label for="ns-pick">Namespace</label>
      <select id="ns-pick" data-ns-pick>
        <option value="all"${view.nsNamespace === "all" ? " selected" : ""}>
          All namespaces (${rows.length})</option>
        ${rows.map((r) => `<option value="${esc(r.namespace)}"${
          view.nsNamespace === r.namespace ? " selected" : ""}>${
          r.namespace === "(cluster-scoped)" ? "cluster-wide" : esc(r.namespace)
        } — ${r.bindings} grant${r.bindings === 1 ? "" : "s"}</option>`).join("")}
      </select>
      ${view.nsNamespace !== "all"
        ? `<button type="button" class="linkish" data-ns-pick-clear>Clear filter</button>` : ""}
    </div>
    <div id="every-grant"${view.nsGrantsOpen ? "" : " hidden"}>
      ${!bindings.length
        ? `<div class="empty-note">No direct grants${
             view.nsNamespace === "all" ? "" : ` in ${esc(view.nsNamespace)}`}.</div>`
        : `<div class="scroll-x"><table class="audit-table">
        <thead><tr>
          ${sortableTh("Person", "person", view.nsGrantSort, view.nsGrantDir, "grant")}
          ${sortableTh("Grants", "risk", view.nsGrantSort, view.nsGrantDir, "grant")}
          ${sortableTh("Scope", "scope", view.nsGrantSort, view.nsGrantDir, "grant")}
          ${sortableTh("Binding", "binding", view.nsGrantSort, view.nsGrantDir, "grant")}
        </tr></thead>
        <tbody>${sortedGrants.map((b) => {
          const crit = ["cluster-admin", "admin"].includes(b.role_name) || !b.binding_namespace;
          return `<tr class="${crit ? "risk-row risk-high" : ""}">
            <td><strong>${esc(b.user_name)}</strong></td>
            <td><code class="priv">${esc(b.role_name)}</code>
              <span class="muted">${esc(b.role_kind)}</span></td>
            <td>${b.binding_namespace ? esc(b.binding_namespace)
                  : `<strong class="err">cluster-wide</strong>`}</td>
            <td class="muted">${esc(b.binding_name)}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>`}
      ${ub.truncated ? `<div class="filterbar-note truncation-note">
        Showing the <strong>${bindings.length}</strong> highest-privilege of
        <strong>${total}</strong> grants${view.nsNamespace === "all" ? ""
          : ` in ${esc(view.nsNamespace)}`}. The rest are not hidden findings — they are
        ranked below these. Narrow with the namespace selector to see them.
      </div>` : ""}
    </div>
  </section>`;
}
