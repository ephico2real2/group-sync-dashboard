{#- block["items"], not block.items: on a dict Jinja resolves `.items` to the METHOD first. -#}
<div class="block"><h3>{{ block.title }}</h3><table class="kv">
{%- for item in block["items"] %}<tr><th>{{ item[0] }}</th><td>{% if item[1] is not none %}{{ item[1] }}{% endif %}</td></tr>{% endfor %}</table></div>
