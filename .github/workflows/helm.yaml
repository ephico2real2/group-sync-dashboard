# Package the chart and publish it to the gh-pages Helm repository.
#
# The same shape as group-sync-operator-helm-chart's helm.yaml, deliberately: one pattern to
# learn, and chart-releaser is the tool the Helm project itself ships for this.
#
# What this gives a consumer:
#   helm repo add group-sync-dashboard https://ephico2real2.github.io/group-sync-dashboard
#   helm install gsd group-sync-dashboard/group-sync-dashboard
#
# It does NOT replace publish.yml, which builds the container image. That runs on every push to
# main; this runs only when the chart changes, because a code-only change produces an identical
# chart and republishing it would be noise.
name: Release Charts

on:
  push:
    branches:
      - main
    # Only when the chart itself changes. chart-releaser skips a version it has already
    # published, so this filter is about not running at all rather than about correctness — it
    # keeps the Actions history readable and means a green run corresponds to a chart change.
    #
    # Anything not matched here is still validated: ci.yml has its own push-to-main trigger with
    # no path filter.
    paths:
      - 'charts/**'

  # So a release can be forced without an empty commit — after bumping only Chart.yaml's
  # version, or to retry a run that failed on something transient.
  workflow_dispatch:

jobs:
  # The same checks that run on every pull request, CALLED rather than copied. A chart that
  # cannot render must not become a published release.
  validate:
    uses: ./.github/workflows/ci.yml
    # ci.yml's image job requests security-events: write (advisory SARIF upload to code scanning).
    # A called workflow can only DOWNGRADE the caller's token, and the repo default is
    # contents: read, so GitHub would refuse the nested job at plan time unless the caller grants
    # security-events: write explicitly here.
    permissions:
      contents: read
      security-events: write

  release:
    needs: validate
    permissions:
      # chart-releaser pushes the packaged chart and the index to gh-pages, and creates a
      # GitHub release per chart version. Both need write.
      contents: write
      # For the chart's provenance attestation (the last two steps): the OIDC token Fulcio
      # exchanges for a signing certificate, and the store the statement is written to. Neither
      # widens what this job can do to the repository.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # chart-releaser needs the full history: it decides what to publish by looking for a
          # tag matching each chart version, and a shallow clone has no tags.
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # SAY SO WHEN THERE IS NOTHING TO DO. chart-releaser's skip_existing means a chart change
      # WITHOUT a Chart.yaml version bump publishes nothing and still succeeds — a green run
      # that shipped no chart, which is the silent no-op this repo keeps finding elsewhere. This
      # cannot fail the build (the version legitimately stays put when only a README changes)
      # but it puts the answer in the run summary instead of leaving it to be inferred.
      - name: Report what this run will publish
        # Also the DECISION the attestation steps at the end key on: only a NEW release has a
        # package to attest, and attesting on a skipped run would claim provenance for bytes this
        # run did not publish.
        id: plan
        run: |
          set -uo pipefail
          # EVERY chart chart-releaser packages (it walks charts/): the app chart's version feeds the
          # image-label step below; `new` is true when ANY chart is unreleased, so the attestation
          # step runs for the packages this run creates (review of #209: openshift-grafana was
          # packaged and released with no provenance while only the app chart was attested).
          version=$(grep -E '^version:' charts/group-sync-dashboard/Chart.yaml | awk '{print $2}')
          echo "Chart.yaml version: $version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          new=false
          subjects=""
          for chart in charts/*/; do
            name=$(awk '/^name:/{print $2; exit}' "$chart/Chart.yaml")
            cv=$(awk '/^version:/{print $2; exit}' "$chart/Chart.yaml")
            if git rev-parse --verify --quiet "refs/tags/${name}-${cv}" >/dev/null; then
              echo "::warning::${name}-${cv} is already released; chart-releaser will skip it. Bump"
              echo "::warning::the version field in ${chart}Chart.yaml to release the current chart."
            else
              echo "will publish a new release: ${name}-${cv}"
              new=true
              # The attestation's subjects are exactly the packages this run uploads: chart-releaser
              # also packages a changed-but-unbumped chart and then skips its upload, and a `*.tgz`
              # glob would attest bytes nobody can `helm pull` (review of #209, OB3 G10).
              subjects="${subjects:+${subjects},}.cr-release-packages/${name}-${cv}.tgz"
            fi
          done
          echo "new=${new}" >> "$GITHUB_OUTPUT"
          echo "subjects=${subjects}" >> "$GITHUB_OUTPUT"

      # ── Label the image this chart version deploys ────────────────────────────────────────────
      #
      # WHY HERE AND NOT IN publish.yml, which is where it was first proposed. Two measured
      # reasons, both of which make the tag lie if it is created there:
      #
      #   1. publish.yml runs on every image-input merge. It would move `:0.4.4` while the
      #      ALREADY-PUBLISHED chart 0.4.4 still deploys the older image — a correspondence that
      #      states something false about a release that shipped.
      #   2. A template-only change never enters publish.yml's path filter (charts/** is absent
      #      from it, deliberately), so `:0.5.0` would simply not exist while `helm search` showed
      #      chart 0.5.0.
      #
      # Creating it at the chart-release boundary makes the tag mean exactly one thing: "the image
      # this chart version deploys". RETAG, NEVER REBUILD — a rebuild here would ship different bits
      # under a chart version claiming to package an existing application release.
      #
      # NO CROSS-WORKFLOW ORCHESTRATION. This job and publish.yml are independent, so the image
      # this needs may not exist yet. It VERIFIES rather than waits, and fails loudly with the
      # manual command. That is deliberate: #37 was a cross-workflow timing assumption, and its
      # failure mode was reporting `success` while publishing nothing. A missing image must be a red
      # run, not a silent skip.
      #
      # AN IMAGE THAT EXISTS IS NOT YET THE RIGHT ONE (#410, SPEC_E8). `:<appVersion>` is a tag, and a tag can
      # name another build: `:0.39.0` was a chart-version label on application 0.24.0 before application 0.39.0
      # existed, and the existence check above passed on it. So before anything is copied, both images the chart
      # resolves through appVersion must carry it as their org.opencontainers.image.version label, on every Linux
      # image behind the tag: the reading and the comparison release-crc.sh makes before it hands a branch to
      # Argo CD (#414), made here with skopeo, because the runner carries skopeo and not oc. A pinned tag is the
      # operator's choice for that image and is not checked, as there. And because chart versions and application
      # versions share this repository's tags, the copy never lands on a tag that is another application's own
      # alias: chart 1.0.0 would otherwise overwrite application 1.0.0's `:1.0.0`. Both refusals are red runs
      # that copy nothing, so chart-releaser and the attestation, which run only after a green step, publish
      # nothing either.
      - name: Label the image this chart version deploys
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY || 'quay.io' }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ephico2real' }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          # -e as well: without it a refused `skopeo copy --preserve-digests` would be ignored and the
          # digest comparison could pass on a tag that already existed (review of A2, second pass).
          # Every deliberate exit below is explicit, and the `if !` guard keeps -e off the probe.
          set -euo pipefail
          CHART=charts/group-sync-dashboard/Chart.yaml
          VALUES=charts/group-sync-dashboard/values.yaml
          # Exactly the forms prepare-release.py writes (SEMVER = three numbers, appVersion quoted):
          # review of A3, routed here; tests/test_workflow_pins.py runs the real patterns through sed.
          # Portable basic regex on purpose, because that test runs on macOS (BSD sed) too: `[0-9][0-9]*`
          # not the GNU-only `\+`, and `[[:blank:]]` not `[ \t]` — BSD sed reads `\t` in a bracket as
          # a literal `t`, so the old class refused a tab and accepted `1.2.3t`. The appVersion class
          # is the semver itself, not `..*`, which is greedy and would have captured `0.15.0" garbage`.
          CHART_VERSION=$(sed -n 's/^version: \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)[[:blank:]]*$/\1/p' "$CHART" | head -1)
          APP_VERSION=$(sed -n 's/^appVersion: "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' "$CHART" | head -1)
          PINNED=$(sed -n 's/^  tag: "\(.*\)"[[:blank:]]*$/\1/p' "$VALUES" | head -1)
          REPO="${REGISTRY}/${REGISTRY_NAMESPACE}/group-sync-dashboard"
          # reporting.image.tag, walked with release-crc.sh's own code (tests/test_supply_chain.py holds the two
          # equal): four spaces deep with a trailing comment, where a 4-space sed would meet secretsMint's tag first.
          REPORT_PINNED=$(python3 -c '
          import sys
          in_reporting = in_image = False
          for raw in sys.stdin.read().splitlines():
              line = raw.split("#", 1)[0].rstrip()
              if line == "reporting:":
                  in_reporting, in_image = True, False
                  continue
              if in_reporting and line and not line.startswith(" "):
                  in_reporting = in_image = False
              if in_reporting and line == "  image:":
                  in_image = True
                  continue
              if in_image and line.startswith("    tag:"):
                  print(line.split(":", 1)[1].strip().strip("\"'\''"))
                  break
              if in_image and line.startswith("  ") and not line.startswith("    "):
                  in_image = False
          ' < "$VALUES")

          # The org.opencontainers.image.version label of every Linux image behind <repository><:tag or @digest>,
          # sorted and joined: what release-crc.sh reads with `oc image info --filter-by-os='linux/.*'`.
          # `skopeo inspect --config` on a list answers for the runner's platform alone, so a list is walked child
          # by child, by digest. A list with no Linux image prints "", which no appVersion equals.
          image_versions() {
            python3 - "$1" "$2" <<'PY'
          import json, subprocess, sys
          repo, reference = sys.argv[1], sys.argv[2]
          def raw(*args):
              done = subprocess.run(["skopeo", "inspect", "--raw", *args], capture_output=True, text=True)
              if done.returncode != 0:
                  sys.exit(done.stderr.strip() or "skopeo inspect --raw " + " ".join(args) + " failed")
              return json.loads(done.stdout)
          top = raw(f"docker://{repo}{reference}")
          refs = ([f"docker://{repo}@{m['digest']}" for m in top["manifests"] if (m.get("platform") or {}).get("os") == "linux"]
                  if "manifests" in top else [f"docker://{repo}{reference}"])
          images = [{"config": raw("--config", ref)} for ref in refs]
          print(", ".join(sorted({(i.get("config", {}).get("config", {}).get("Labels") or {}).get("org.opencontainers.image.version", "") for i in images})))
          PY
          }

          if [ -z "${REGISTRY_USERNAME}" ] || [ -z "${REGISTRY_PASSWORD}" ]; then
            echo "::warning::registry credentials are not set, so chart ${CHART_VERSION} will be"
            echo "::warning::published without an image alias. The chart still deploys"
            echo "::warning::${APP_VERSION}; only the convenience tag is missing."
            exit 0
          fi

          # The chart deploys whatever gsd.image resolves: an explicit pin if values.yaml carries
          # one, otherwise appVersion. Follow the same rule so the alias always points at the image
          # this chart version actually runs, not at what we assume it runs.
          SOURCE="${PINNED:-$APP_VERSION}"
          echo "chart ${CHART_VERSION} deploys ${SOURCE}; labelling it"

          # Unreachable is not absent (Orchestrator's note 6) here too: only the registry's "manifest unknown" means
          # the image was never published. Any other failure (DNS, 401, 429, a timeout) is "cannot tell", and the
          # remedy is a re-run, never the disaster-recovery push the message below prescribes.
          probe_err=$(mktemp)
          trap 'rm -f "${probe_err}"' EXIT
          if ! SOURCE_DIGEST=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://${REPO}:${SOURCE}" 2>"${probe_err}"); then
            if ! grep -qi 'manifest unknown' "${probe_err}"; then
              echo "::error::cannot tell whether ${REPO}:${SOURCE} exists, so chart ${CHART_VERSION} is NOT published"
              echo "::error::and nothing was copied:"
              echo "::error::$(head -c 400 "${probe_err}")"
              echo "::error::Re-run this workflow once the registry answers."
              exit 1
            fi
            echo "::error::${REPO}:${SOURCE} does not exist, so chart ${CHART_VERSION} cannot be"
            echo "::error::labelled, and this job stops here: the chart is NOT published until the"
            echo "::error::image exists (re-run this workflow once it does)."
            echo "::error::This means the application release was never published — check the"
            echo "::error::publish workflow, then from a clean checkout run:"
            echo "::error::  cd local-development && ./build-and-push-external.sh --release-tags"
            echo "::error::  cd local-development && ./build-and-push-report.sh --release-tags"
            exit 1
          fi

          # Both images, each against its own pin. The dashboard's label is read at the digest just read, which
          # is the digest the copy below must reproduce, so the image checked is the image aliased even if the
          # tag moves between the two reads.
          for spec in "${REPO}|${PINNED}" "${REPO}-report|${REPORT_PINNED}"; do
            name="${spec%%|*}" this_pin="${spec#*|}"
            if [ -n "${this_pin}" ]; then
              echo "image   : ${name}:${this_pin} (pinned in values.yaml; not checked against appVersion)"
              continue
            fi
            reference=":${APP_VERSION}"
            if [ "${name}" = "${REPO}" ]; then
              reference="@${SOURCE_DIGEST}"
            fi
            if ! version=$(image_versions "${name}" "${reference}"); then
              echo "::error::${name}:${APP_VERSION} is not in the registry, or cannot be read, so chart"
              echo "::error::${CHART_VERSION} is NOT published. publish.yml pushes the :${APP_VERSION} aliases of both"
              echo "::error::images on the merge that moved pyproject's version: wait for that run, then re-run this"
              echo "::error::workflow. If that run is red, from a clean checkout of the release commit run:"
              echo "::error::  cd local-development && ./build-and-push-external.sh --release-tags"
              echo "::error::  cd local-development && ./build-and-push-report.sh --release-tags"
              exit 1
            fi
            if [ "${version}" != "${APP_VERSION}" ]; then
              echo "::error::${name}:${APP_VERSION} is application ${version:-unknown}, not ${APP_VERSION} (#410), so"
              echo "::error::chart ${CHART_VERSION} is NOT published and nothing was copied. The tag exists but names"
              echo "::error::another build: an alias publish.yml has not moved yet, or a chart-version label on an"
              echo "::error::old image. Wait for publish.yml on the release merge, then re-run this workflow. Never"
              echo "::error::retag or delete the old tag by hand: a cluster, a mirror or a Helm release may pin it."
              exit 1
            fi
            echo "image   : ${name}:${APP_VERSION} is application ${version}"
          done

          # Never over another application's alias. A tag that does not exist yet is created; one at the source's
          # digest is copied again unchanged (publish.yml's --release-tags writes :<chartVersion> too); one that
          # names some other build is relabelled, as before. Only a tag that IS application <chartVersion> is
          # refused. Unreachable is not absent: only the registry's "manifest unknown" lets the copy create it.
          if TARGET_DIGEST=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://${REPO}:${CHART_VERSION}" 2>"${probe_err}"); then
            if [ "${TARGET_DIGEST}" != "${SOURCE_DIGEST}" ]; then
              if ! target_version=$(image_versions "${REPO}" "@${TARGET_DIGEST}"); then
                echo "::error::${REPO}:${CHART_VERSION} exists at ${TARGET_DIGEST} and its label cannot be read, so"
                echo "::error::this run cannot tell whether it is application ${CHART_VERSION}'s own alias. Nothing"
                echo "::error::was copied. Re-run this workflow once the registry answers."
                exit 1
              fi
              case ", ${target_version}, " in
                *", ${CHART_VERSION}, "*)
                  echo "::error::${REPO}:${CHART_VERSION} is application ${CHART_VERSION}'s own alias (labelled"
                  echo "::error::${target_version}), and chart ${CHART_VERSION} would copy ${SOURCE} over it (#410):"
                  echo "::error::chart and application versions share this repository's tags. Nothing was copied"
                  echo "::error::and the chart is NOT published. Give the chart a version no application release"
                  echo "::error::has used (the version field of charts/group-sync-dashboard/Chart.yaml, in a pull"
                  echo "::error::request). Never retag or delete the existing tag: something may pin it."
                  exit 1 ;;
              esac
            fi
          elif ! grep -qi 'manifest unknown' "${probe_err}"; then
            echo "::error::cannot tell whether ${REPO}:${CHART_VERSION} exists, so nothing was copied:"
            echo "::error::$(head -c 400 "${probe_err}")"
            echo "::error::Re-run this workflow once the registry answers."
            exit 1
          fi

          printf '%s' "${REGISTRY_PASSWORD}" \
            | skopeo login --username "${REGISTRY_USERNAME}" --password-stdin "${REGISTRY}" >/dev/null
          # Copy rather than pull-tag-push: skopeo moves the manifest between tags in the registry
          # without materialising the image on this runner. --preserve-digests makes "the same bits"
          # a checked contract rather than skopeo's default "source format, with fallbacks", and the
          # digest is read back and compared — the same rule as build-and-push-external.sh's aliases,
          # because this tag is one the signed digest must resolve to (review of A2).
          skopeo copy --all --preserve-digests "docker://${REPO}:${SOURCE}" "docker://${REPO}:${CHART_VERSION}"
          ALIAS_DIGEST=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://${REPO}:${CHART_VERSION}")
          if [ "${ALIAS_DIGEST}" != "${SOURCE_DIGEST}" ]; then
            echo "::error::${REPO}:${CHART_VERSION} resolves to ${ALIAS_DIGEST}, not ${SOURCE_DIGEST} — the"
            echo "::error::alias is not the image ${SOURCE} names. Inspect both before retrying."
            exit 1
          fi
          echo "labelled: ${REPO}:${CHART_VERSION} -> ${SOURCE} (${SOURCE_DIGEST})"

      # charts_dir defaults to `charts`, which is where this chart lives, so no configuration is
      # needed. packages_with_index keeps the .tgz next to index.yaml on gh-pages, which is what
      # `helm repo add` against a Pages site expects.
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          skip_existing: true
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # ── Chart provenance ──────────────────────────────────────────────────────────────────────
      #
      # A GITHUB ATTESTATION OF THE .tgz, NOT `helm package --sign`. GPG signing needs a private
      # key held as a repository secret for years, a keyring handed to every consumer out of band,
      # and `helm verify` on their side; keyless needs none of that and is the same identity the
      # image is signed with (publish.yml). Not cosign sign-blob either: chart-releaser publishes
      # the package to gh-pages and a GitHub Release, and a bundle beside it would need a second
      # upload path that `helm pull` would never fetch. `gh attestation verify <file>` is the check.
      #
      # THE SUBJECT IS THE FILE chart-releaser UPLOADED — its package directory, .cr-release-packages,
      # is where cr packages and what it copies to gh-pages — so the attestation is over the bytes
      # `helm pull` returns. Only for a NEW release (steps.plan), and only with the same switch as
      # the image signing, so one variable turns every attestation this repository makes on or off.
      - name: Attest the provenance of the packaged chart
        if: steps.plan.outputs.new == 'true' && vars.SUPPLY_CHAIN_SIGNING != 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Every package this run created and nothing else — both charts when both are new; the
          # plan step's comma-separated list (the action takes a list of paths).
          subject-path: ${{ steps.plan.outputs.subjects }}

      - name: Read the chart attestation back
        if: steps.plan.outputs.new == 'true' && vars.SUPPLY_CHAIN_SIGNING != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          SUBJECTS: ${{ steps.plan.outputs.subjects }}
        run: |
          set -euo pipefail
          for pkg in ${SUBJECTS//,/ }; do
            gh attestation verify "$pkg" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/helm.yaml"
          done
