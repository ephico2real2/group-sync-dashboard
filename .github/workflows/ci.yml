# Everything that was previously only ever run by hand.
#
# The suite, the chart guards, the WCAG contrast check and the image scan all existed and
# all found real defects — a leader election that had never worked, a Helm guard that let
# two pods open one SQLite file, nine contrast failures. None of them ran anywhere except a
# terminal, which meant a green pull request proved nothing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Vulnerability data changes without the code changing. A weekly run is how an
  # unfixable CVE becoming fixable gets noticed.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches ubi9/python-311 in the Containerfile
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .
      - name: Unit and integration tests
        # 285 of 340. test_ui.py needs a Playwright browser and test_live_smoke.py needs a
        # real cluster, so both are deselected here — which is exactly why the count differs
        # from a local run, and why a green CI is not a substitute for running the UI tests
        # before shipping a front-end change.
        run: pytest tests/ -q --deselect tests/test_ui.py --deselect tests/test_live_smoke.py

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/group-sync-dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render guards must still refuse the unsafe combinations
        working-directory: local-development
        run: |
          pip install pytest
          pytest tests/test_chart_strategy.py -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: local-development
        run: docker build -f Containerfile -t gsd:ci .

      # --ignore-unfixed is load-bearing, not laziness. The base carries ten HIGH curl CVEs
      # with no available patch; without this flag the gate is red on every run for
      # something nobody can act on, and a permanently-red gate gets ignored — which is
      # worse than no gate. This fails only on findings somebody can actually fix.
      - name: Scan for FIXABLE vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gsd:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln

      # Separate, non-blocking, so the unfixable inventory is visible without gating.
      - name: Full inventory (informational)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gsd:ci
          exit-code: "0"
          severity: CRITICAL,HIGH
          scanners: vuln
