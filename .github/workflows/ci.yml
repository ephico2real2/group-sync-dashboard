# Everything that was previously only ever run by hand.
#
# The suite, the chart guards, the WCAG contrast check and the image scan all existed and
# all found real defects — a leader election that had never worked, a Helm guard that let
# two pods open one SQLite file, nine contrast failures. None of them ran anywhere except a
# terminal, which meant a green pull request proved nothing.
name: ci

# ACTION PINS. Every third-party action is referenced by the full commit of a released version,
# with the version beside it as a comment — the form GitHub's own guidance calls the safest for
# stability and security, and the one Dependabot (.github/dependabot.yml) knows how to move.
# A major tag such as @v4 is mutable, and it is also how the runtime moved under us: on
# 2026-09-04 every job printed "Node.js 20 is deprecated. The following actions target Node.js
# 20 but are being forced to run on Node.js 24" for checkout@v4, setup-node@v4, setup-python@v5
# and setup-helm@v4, because runners default to Node 24 since 2026-06-16 and Node 20 leaves them
# on 2026-09-23. Each is now on its Node 24 major (runs.using: node24 in its action.yml — read,
# not assumed). To bump one: take the release's commit from `gh api repos/<action>/git/ref/tags/<tag>`
# (resolve an annotated tag to its commit), update the SHA and the comment together.
on:
  push:
    branches: [main]
  pull_request:
  # Vulnerability data changes without the code changing. A weekly run is how an
  # unfixable CVE becoming fixable gets noticed.
  schedule:
    - cron: "0 6 * * 1"
  # Called by helm.yaml as the gate in front of publishing the chart, so the checks are
  # defined once here rather than duplicated there. Without this a direct push to main — or a
  # merge landing while branch protection is off — would publish a chart nothing had validated.
  workflow_call:

permissions:
  contents: read

jobs:
  # A CHART CHANGE THAT DOES NOT BUMP THE VERSION PUBLISHES NOTHING AND REPORTS SUCCESS.
  # chart-releaser skips a version it has already released, so the release run goes green having
  # shipped no chart. This repo has paid for that twice: the three template changes in #27 published
  # nothing while the Helm repo kept serving the previous chart, and #34 shipped a chart without the
  # self-tier fix that withholds directory DNs from narrowed readers.
  #
  # The bump used to be automated — publish.yml's pin commit moved the patch on every image build —
  # and that automation is gone with the pin commit, along with the three defects it caused. This
  # check is the replacement: a human bumps the version in the PR, and CI refuses the PR if they
  # forget. Ported from group-sync-operator-helm-chart, which has run it long enough to have
  # documented the base-resolution traps below.
  #
  # PR-ONLY, deliberately. `main` is branch protected with pull requests required, so nothing reaches
  # it without this having run. Extending it to `push` would add a post-merge repeat of a check that
  # already passed, with extra base-ref edge cases to get wrong.
  version-bump:
    name: Chart changes bump the chart version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHART: charts/group-sync-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needs real history: the check compares this PR's chart against its base commit.
          fetch-depth: 0
      - name: A change under charts/ requires a new Chart.yaml version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          # VALIDATE THE BASE BEFORE USING IT. Both bad values fail in ways that look like a pass,
          # or like an unrelated crash — measured on the repo this check came from:
          #
          #   BASE empty        `git diff "" HEAD` prints `fatal: bad revision ''` and falls into
          #                     the `|| true` below, so `changed` is empty and this reports "no
          #                     chart content changed": a VACUOUS PASS. Worse, `git show ":$CHART/..."`
          #                     with an empty base reads the INDEX, so `was` comes back as the
          #                     WORKING version and the comparison compares a value to itself.
          #   BASE unresolvable `git show` exits 128 and, under the `-e` GitHub gives every `run:`
          #                     block, kills the step at the `was=` assignment with no explanation.
          #
          # A base we cannot resolve is a BROKEN CHECK, not a passing one.
          if [ -z "$BASE" ] || ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
            echo "::error::the base commit is '${BASE}' and cannot be resolved, so this check has"
            echo "::error::nothing to compare the chart against. On a PR it comes from"
            echo "::error::github.event.pull_request.base.sha and needs fetch-depth: 0, set above."
            exit 1
          fi

          # Chart.yaml itself is excluded: bumping the version IS a change under charts/, and
          # counting it would make every version bump look like content needing another bump.
          changed=$(git diff --name-only "$BASE" HEAD -- "$CHART" | grep -v '/Chart.yaml$' || true)
          if [ -z "$changed" ]; then
            echo "no chart content changed — nothing to publish, no bump needed"
            exit 0
          fi
          echo "chart content changed:"; printf '  %s\n' $changed

          if ! git cat-file -e "$BASE:$CHART/Chart.yaml" 2>/dev/null; then
            echo "Chart.yaml does not exist at the base — this PR creates the chart, so there is no"
            echo "previous version to bump. Nothing to check."
            exit 0
          fi
          # No 2>/dev/null here: the absent-file case is handled above, so any error now is real.
          was=$(git show "$BASE:$CHART/Chart.yaml" | awk '/^version:/{print $2; exit}')
          now=$(awk '/^version:/{print $2; exit}' "$CHART/Chart.yaml")
          echo "version: $was -> $now"

          if [ "$was" = "$now" ]; then
            echo "::error file=$CHART/Chart.yaml::chart content changed but version is still $now, so"
            echo "::error file=$CHART/Chart.yaml::chart-releaser will skip the release and report"
            echo "::error file=$CHART/Chart.yaml::success while publishing nothing. Bump it."
            exit 1
          fi
          echo "version was bumped"

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-development
    # BOTH ENDS, not one. This tested only 3.11, with the comment "matches ubi9/python-311",
    # long after the image moved to python3.14 — so CI was exercising an interpreter that had
    # not shipped for weeks while never running the one that had.
    #
    # It cost a real failure in both directions. Two tests used typing's private
    # __protocol_attrs__, which exists only on 3.12+: they passed on a 3.13 developer machine
    # and broke on 3.11 for a reason unrelated to the code they guard. Testing one version
    # would have caught that in only one of the two possible orderings.
    #
    # 3.11 is the floor pyproject declares (requires-python = ">=3.11"); 3.14 is what the
    # Containerfile ships. If either moves, move it here in the same commit.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .
      - name: Unit and integration tests
        # test_ui.py is deselected HERE because it runs in the `ui` job below — once, with a
        # browser — rather than twice across this matrix, whose variable is the interpreter and
        # not the page. test_live_smoke.py is deselected everywhere: it polls a real cluster
        # through a token (GSD_LIVE_CONFIG), and a runner has neither.
        #
        # No hardcoded count in this comment: the last one said "285 of 340" and was stale by
        # a hundred and fifty tests, which makes it worse than no number at all.
        run: pytest tests/ -q --deselect tests/test_ui.py --deselect tests/test_live_smoke.py

  ui:
    # THE BROWSER TESTS, IN CI AT LAST. A stray backtick inside a template literal once blanked
    # the whole page while this workflow was green: index.html is one file with no build step
    # and no type checker, and only a browser executes it. tests/test_ui.py starts the real app
    # (uvicorn, a seeded Store, the poller off) and drives it with Playwright, and until now it
    # ran only on a laptop that remembered to run it.
    #
    # A JOB OF ITS OWN, not a third leg of the `tests` matrix. That matrix proves the interpreter
    # floor and ceiling, and the page does not change with the interpreter; once, on the version
    # the Containerfile ships, keeps the matrix fast and the evidence in one place.
    #
    # THE SWITCH: repository variable CI_UI_TESTS. The value false turns the job off — in any
    # letter case, because GitHub ignores case when it compares strings — and anything else,
    # including the variable not existing at all, runs it.
    # ON by default because it needs no credential, no cluster and no second image — only a
    # Chromium download — and a green run that skips tests which exist is the failure this repo
    # keeps naming. A fork or a self-hosted runner that cannot fetch browsers sets it to false;
    # the `tests` job above is byte-identical either way.
    #
    # NO --no-sandbox CONFIG, unlike the diagrams job below. Playwright launches Chromium with
    # sandboxing OFF unless asked (chromium_sandbox "Defaults to false" in its launch options),
    # so the AppArmor user-namespace restriction that broke puppeteer never reaches it.
    #
    # NO BROWSER CACHE, deliberately. The Chromium download is ~150 MB and takes about as long
    # as restoring a cache of the same bytes, --with-deps has to run apt either way, and a stale
    # cache is one more way for a green run to have tested yesterday's browser.
    name: Browser tests (Playwright, Chromium)
    if: vars.CI_UI_TESTS != 'false'
    runs-on: ubuntu-latest
    # Finite. Locally the file runs in a few minutes; a hung browser would otherwise hold the
    # runner for the six-hour default.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: local-development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # What the Containerfile ships. The page is the variable in this job, not the interpreter.
          python-version: "3.14"
      - name: Install, with the browser driver pinned
        # pyproject's dev extra says pytest-playwright>=0.5 so a developer takes what pip has.
        # CI PINS BOTH PACKAGES: `playwright install` fetches the Chromium build that matches
        # the installed playwright package, so pinning the package pins the browser — and a
        # browser that moves under a green run is a variable this job exists to remove. Move
        # the two together, by hand, after a local run of tests/test_ui.py on the new pair;
        # Dependabot reads `uses:` lines, not pins inside a run: block.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' 'playwright==1.62.0' 'pytest-playwright==0.8.0'
      - name: Install Chromium and its system libraries
        run: python -m playwright install --with-deps chromium
      - name: Browser tests
        # EVIDENCE ON FAILURE ONLY. A screenshot and a Playwright trace per failed test land
        # under test-results/ (pytest-playwright's default --output, already gitignored) and the
        # next step uploads them; a green run writes and uploads nothing. No rerun plugin: a
        # test that passes on the second try is a flake, and hiding one is how it becomes a habit.
        run: >
          pytest tests/test_ui.py -q --browser chromium
          --screenshot only-on-failure --tracing retain-on-failure
      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: local-development/test-results/
          if-no-files-found: ignore
          retention-days: 7

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: helm lint charts/group-sync-dashboard
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"   # keep in step with the tests job and the Containerfile
      - name: Render guards must still refuse the unsafe combinations
        working-directory: local-development
        run: |
          # PyYAML because TestNoPatchVerbAtAnyAuditMode PARSES the rendered manifests rather
          # than grepping them — rbac.yaml keeps the removed `patch` grant's history in its
          # comments and Helm emits those verbatim, so a text search would trip on them.
          #
          # Named explicitly rather than installing the package: this job deliberately has no
          # application dependencies, so it stays a chart-rendering job that a Python change
          # cannot break. PyYAML being a runtime dependency of the app is NOT why it is
          # available here, which is the assumption that made this job fail.
          pip install pytest PyYAML
          pytest tests/test_chart_strategy.py -q

  diagrams:
    # The GROUND TRUTH for the mermaid blocks. tests/test_docs_diagrams.py checks the
    # constructs known to break a render and runs in half a second; this actually renders
    # them, which is the only way to be sure. One diagram shipped broken for an unknown
    # length of time — `;` terminated a `Note over` statement — and was found by a human
    # looking at the page, so a real render earns its minute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Render every mermaid block
        run: |
          set -euo pipefail
          python3 - <<'EXTRACT'
          import pathlib, re
          out = pathlib.Path("mmd"); out.mkdir(exist_ok=True)
          n = 0
          for md in sorted(pathlib.Path(".").rglob("*.md")):
              if any(s in md.parts for s in (".venv", "node_modules", ".agents", ".claude")):
                  continue
              for body in re.findall(r"```mermaid\n(.*?)```", md.read_text(), re.S):
                  n += 1
                  (out / f"{md.stem}-{n:02d}.mmd").write_text(body)
          print(f"extracted {n} diagrams")
          assert n >= 9, f"only {n} diagrams found — the extractor is probably broken"
          EXTRACT
          # mermaid-cli renders through headless Chromium, and Chromium cannot start in its
          # default sandbox on the ubuntu-latest runner: Ubuntu 23.10+ restricts unprivileged
          # user namespaces through AppArmor, so every render died with "No usable sandbox!"
          # before reading a single diagram. Every file reported FAIL for the same reason,
          # which reads exactly like nine broken diagrams and is actually zero.
          #
          # --no-sandbox is safe HERE and would not be elsewhere: the input is this
          # repository's own markdown, on a single-use runner, with no untrusted content.
          cat > puppeteer.json <<'PUPPETEER'
          { "args": ["--no-sandbox", "--disable-setuid-sandbox"] }
          PUPPETEER
          fail=0
          rendered=0
          for f in mmd/*.mmd; do
            if npx --yes @mermaid-js/mermaid-cli@11 -p puppeteer.json \
                 -i "$f" -o "${f%.mmd}.svg" >/dev/null 2>err.txt; then
              echo "ok    $f"; rendered=$((rendered+1))
            else
              echo "FAIL  $f"; sed 's/^/        /' err.txt; fail=1
            fi
          done
          # A renderer that cannot start makes every diagram "fail" and a `continue-on-error`
          # away from making every diagram silently pass. Assert that something was actually
          # produced, so a broken toolchain can never read as a clean run.
          echo "rendered ${rendered} diagram(s)"
          if [ "$rendered" -eq 0 ]; then
            echo "::error::no diagram rendered at all — the toolchain failed, not the diagrams"
            exit 1
          fi
          exit $fail

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        working-directory: local-development
        run: docker build -f Containerfile -t gsd:ci .

      # The pack stage is built and scanned ON ITS OWN. bash, curl, jq and coreutils are installed
      # there, with dnf, and copied into the shipped image as files; the shipped image's RPM
      # database never lists them, and a scanner sees them there only through the ELF package
      # notes Red Hat's builds carry. Scanning the stage they were installed in is the reading
      # that cannot miss one. docs/image-vulnerability-scan.md has the measurements.
      - name: Build the pack stage
        working-directory: local-development
        run: docker build -f Containerfile --target pack -t gsd:pack .

      # GRYPE, NOT TRIVY — measured, not preferred. The image is on Hummingbird OS (Red Hat
      # Hardened Images), which Trivy does not recognise: it reports no OS, reads no RPM
      # database, and scans the Python packages alone; told --distro redhat/10 it reads the
      # database and matches nothing, because the packages are Hummingbird builds. Grype
      # identifies the distribution, reads the database and Red Hat's advisory data for it,
      # and is the scanner Red Hat's own documentation names for these images.
      #
      # The action is pinned by commit (v7.4.2), as its own README recommends for a security
      # gate: a moving major tag can change what a green run means.
      #
      # grype-version is PINNED, and the pin is the difference between a gate and a green
      # light. The action's own default (v0.110.0 on 2026-09-04) predates Grype's Hummingbird
      # support (source-RPM filtering in v0.113.0, the distro marked rolling in v0.115.0) and
      # reported "0 vulnerability matches across 84 packages" on an image where v0.118.0 finds
      # 12 Medium and 2 Low, and 26 High on the pack stage. Move the pin forward deliberately;
      # never let it fall back to the default. The blindness check below catches the day the
      # pinned version stops identifying the distribution.
      #
      # only-fixed is load-bearing, not laziness. A base can carry HIGH CVEs with no available
      # patch (four util-linux advisories on 2026-09-04, state Affected, no fixed build); without
      # this flag the gate is red on every run for something nobody can act on, and a
      # permanently-red gate gets ignored — which is worse than no gate. This fails only on
      # findings somebody can actually fix.
      - name: Scan the shipped image for FIXABLE vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: gsd:ci
          grype-version: v0.118.0
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: table

      - name: Scan the pack stage for FIXABLE vulnerabilities (bash, curl, jq, coreutils)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: gsd:pack
          grype-version: v0.118.0
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: table

      # Separate, non-blocking, so the unfixable inventory is visible without gating.
      - name: Full inventory, shipped image (informational)
        if: always()
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: gsd:ci
          grype-version: v0.118.0
          fail-build: false
          severity-cutoff: medium
          output-format: table

      - name: Full inventory, pack stage (informational)
        id: pack-inventory
        if: always()
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: gsd:pack
          grype-version: v0.118.0
          fail-build: false
          severity-cutoff: medium
          output-format: json
          output-file: pack-inventory.json

      # THE BLINDNESS CHECK. A scanner that does not recognise the operating system matches no
      # OS package and reports a clean image it has not assessed — Trivy does exactly that on
      # this base, and so did the action's default Grype. The pack stage always has an RPM
      # database and /etc/os-release, so if Grype did not name the distribution here, the two
      # gates above passed on nothing. This step also prints what the table format would have,
      # by severity, so the inventory stays readable in the log.
      - name: Grype identified the distribution
        if: always()
        run: |
          distro=$(jq -r '.distro.name // ""' pack-inventory.json)
          echo "distro: ${distro:-<none>} $(jq -r '.distro.version // ""' pack-inventory.json)"
          jq -r '[.matches[] | .vulnerability.severity] | group_by(.) | map("\(.[0]): \(length)") | join(", ")' pack-inventory.json
          jq -r '.matches[] | select(.vulnerability.severity=="High" or .vulnerability.severity=="Critical") | "\(.vulnerability.severity)\t\(.artifact.name) \(.artifact.version)\t\(.vulnerability.id)\tfix: \(.vulnerability.fix.state // "none")"' pack-inventory.json | sort -u
          if [ "$distro" != "hummingbird" ]; then
            echo "::error::Grype did not identify the pack stage as Hummingbird OS (got '${distro:-<none>}'); the scans above matched no OS package and prove nothing"
            exit 1
          fi
