# Everything that was previously only ever run by hand.
#
# The suite, the chart guards, the WCAG contrast check and the image scan all existed and
# all found real defects — a leader election that had never worked, a Helm guard that let
# two pods open one SQLite file, nine contrast failures. None of them ran anywhere except a
# terminal, which meant a green pull request proved nothing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Vulnerability data changes without the code changing. A weekly run is how an
  # unfixable CVE becoming fixable gets noticed.
  schedule:
    - cron: "0 6 * * 1"
  # Called by helm.yaml as the gate in front of publishing the chart, so the checks are
  # defined once here rather than duplicated there. Without this a direct push to main — or a
  # merge landing while branch protection is off — would publish a chart nothing had validated.
  workflow_call:

permissions:
  contents: read

jobs:
  # A CHART CHANGE THAT DOES NOT BUMP THE VERSION PUBLISHES NOTHING AND REPORTS SUCCESS.
  # chart-releaser skips a version it has already released, so the release run goes green having
  # shipped no chart. This repo has paid for that twice: the three template changes in #27 published
  # nothing while the Helm repo kept serving the previous chart, and #34 shipped a chart without the
  # self-tier fix that withholds directory DNs from narrowed readers.
  #
  # The bump used to be automated — publish.yml's pin commit moved the patch on every image build —
  # and that automation is gone with the pin commit, along with the three defects it caused. This
  # check is the replacement: a human bumps the version in the PR, and CI refuses the PR if they
  # forget. Ported from group-sync-operator-helm-chart, which has run it long enough to have
  # documented the base-resolution traps below.
  #
  # PR-ONLY, deliberately. `main` is branch protected with pull requests required, so nothing reaches
  # it without this having run. Extending it to `push` would add a post-merge repeat of a check that
  # already passed, with extra base-ref edge cases to get wrong.
  version-bump:
    name: Chart changes bump the chart version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHART: charts/group-sync-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          # Needs real history: the check compares this PR's chart against its base commit.
          fetch-depth: 0
      - name: A change under charts/ requires a new Chart.yaml version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          # VALIDATE THE BASE BEFORE USING IT. Both bad values fail in ways that look like a pass,
          # or like an unrelated crash — measured on the repo this check came from:
          #
          #   BASE empty        `git diff "" HEAD` prints `fatal: bad revision ''` and falls into
          #                     the `|| true` below, so `changed` is empty and this reports "no
          #                     chart content changed": a VACUOUS PASS. Worse, `git show ":$CHART/..."`
          #                     with an empty base reads the INDEX, so `was` comes back as the
          #                     WORKING version and the comparison compares a value to itself.
          #   BASE unresolvable `git show` exits 128 and, under the `-e` GitHub gives every `run:`
          #                     block, kills the step at the `was=` assignment with no explanation.
          #
          # A base we cannot resolve is a BROKEN CHECK, not a passing one.
          if [ -z "$BASE" ] || ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
            echo "::error::the base commit is '${BASE}' and cannot be resolved, so this check has"
            echo "::error::nothing to compare the chart against. On a PR it comes from"
            echo "::error::github.event.pull_request.base.sha and needs fetch-depth: 0, set above."
            exit 1
          fi

          # Chart.yaml itself is excluded: bumping the version IS a change under charts/, and
          # counting it would make every version bump look like content needing another bump.
          changed=$(git diff --name-only "$BASE" HEAD -- "$CHART" | grep -v '/Chart.yaml$' || true)
          if [ -z "$changed" ]; then
            echo "no chart content changed — nothing to publish, no bump needed"
            exit 0
          fi
          echo "chart content changed:"; printf '  %s\n' $changed

          if ! git cat-file -e "$BASE:$CHART/Chart.yaml" 2>/dev/null; then
            echo "Chart.yaml does not exist at the base — this PR creates the chart, so there is no"
            echo "previous version to bump. Nothing to check."
            exit 0
          fi
          # No 2>/dev/null here: the absent-file case is handled above, so any error now is real.
          was=$(git show "$BASE:$CHART/Chart.yaml" | awk '/^version:/{print $2; exit}')
          now=$(awk '/^version:/{print $2; exit}' "$CHART/Chart.yaml")
          echo "version: $was -> $now"

          if [ "$was" = "$now" ]; then
            echo "::error file=$CHART/Chart.yaml::chart content changed but version is still $now, so"
            echo "::error file=$CHART/Chart.yaml::chart-releaser will skip the release and report"
            echo "::error file=$CHART/Chart.yaml::success while publishing nothing. Bump it."
            exit 1
          fi
          echo "version was bumped"

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-development
    # BOTH ENDS, not one. This tested only 3.11, with the comment "matches ubi9/python-311",
    # long after the image moved to python3.14 — so CI was exercising an interpreter that had
    # not shipped for weeks while never running the one that had.
    #
    # It cost a real failure in both directions. Two tests used typing's private
    # __protocol_attrs__, which exists only on 3.12+: they passed on a 3.13 developer machine
    # and broke on 3.11 for a reason unrelated to the code they guard. Testing one version
    # would have caught that in only one of the two possible orderings.
    #
    # 3.11 is the floor pyproject declares (requires-python = ">=3.11"); 3.14 is what the
    # Containerfile ships. If either moves, move it here in the same commit.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .
      - name: Unit and integration tests
        # test_ui.py needs a Playwright browser and test_live_smoke.py needs a real cluster,
        # so both are deselected — which is why the count here is lower than a local run, and
        # why a green CI is NOT a substitute for running the UI tests before shipping a
        # front-end change. A stray backtick once blanked the whole page while the suite was
        # green, and only the browser tests could have caught it.
        #
        # No hardcoded count in this comment: the last one said "285 of 340" and was stale by
        # a hundred and fifty tests, which makes it worse than no number at all.
        run: pytest tests/ -q --deselect tests/test_ui.py --deselect tests/test_live_smoke.py

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/group-sync-dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # keep in step with the tests job and the Containerfile
      - name: Render guards must still refuse the unsafe combinations
        working-directory: local-development
        run: |
          # PyYAML because TestNoPatchVerbAtAnyAuditMode PARSES the rendered manifests rather
          # than grepping them — rbac.yaml keeps the removed `patch` grant's history in its
          # comments and Helm emits those verbatim, so a text search would trip on them.
          #
          # Named explicitly rather than installing the package: this job deliberately has no
          # application dependencies, so it stays a chart-rendering job that a Python change
          # cannot break. PyYAML being a runtime dependency of the app is NOT why it is
          # available here, which is the assumption that made this job fail.
          pip install pytest PyYAML
          pytest tests/test_chart_strategy.py -q

  diagrams:
    # The GROUND TRUTH for the mermaid blocks. tests/test_docs_diagrams.py checks the
    # constructs known to break a render and runs in half a second; this actually renders
    # them, which is the only way to be sure. One diagram shipped broken for an unknown
    # length of time — `;` terminated a `Note over` statement — and was found by a human
    # looking at the page, so a real render earns its minute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render every mermaid block
        run: |
          set -euo pipefail
          python3 - <<'EXTRACT'
          import pathlib, re
          out = pathlib.Path("mmd"); out.mkdir(exist_ok=True)
          n = 0
          for md in sorted(pathlib.Path(".").rglob("*.md")):
              if any(s in md.parts for s in (".venv", "node_modules", ".agents", ".claude")):
                  continue
              for body in re.findall(r"```mermaid\n(.*?)```", md.read_text(), re.S):
                  n += 1
                  (out / f"{md.stem}-{n:02d}.mmd").write_text(body)
          print(f"extracted {n} diagrams")
          assert n >= 9, f"only {n} diagrams found — the extractor is probably broken"
          EXTRACT
          # mermaid-cli renders through headless Chromium, and Chromium cannot start in its
          # default sandbox on the ubuntu-latest runner: Ubuntu 23.10+ restricts unprivileged
          # user namespaces through AppArmor, so every render died with "No usable sandbox!"
          # before reading a single diagram. Every file reported FAIL for the same reason,
          # which reads exactly like nine broken diagrams and is actually zero.
          #
          # --no-sandbox is safe HERE and would not be elsewhere: the input is this
          # repository's own markdown, on a single-use runner, with no untrusted content.
          cat > puppeteer.json <<'PUPPETEER'
          { "args": ["--no-sandbox", "--disable-setuid-sandbox"] }
          PUPPETEER
          fail=0
          rendered=0
          for f in mmd/*.mmd; do
            if npx --yes @mermaid-js/mermaid-cli@11 -p puppeteer.json \
                 -i "$f" -o "${f%.mmd}.svg" >/dev/null 2>err.txt; then
              echo "ok    $f"; rendered=$((rendered+1))
            else
              echo "FAIL  $f"; sed 's/^/        /' err.txt; fail=1
            fi
          done
          # A renderer that cannot start makes every diagram "fail" and a `continue-on-error`
          # away from making every diagram silently pass. Assert that something was actually
          # produced, so a broken toolchain can never read as a clean run.
          echo "rendered ${rendered} diagram(s)"
          if [ "$rendered" -eq 0 ]; then
            echo "::error::no diagram rendered at all — the toolchain failed, not the diagrams"
            exit 1
          fi
          exit $fail

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: local-development
        run: docker build -f Containerfile -t gsd:ci .

      # --ignore-unfixed is load-bearing, not laziness. The base carries ten HIGH curl CVEs
      # with no available patch; without this flag the gate is red on every run for
      # something nobody can act on, and a permanently-red gate gets ignored — which is
      # worse than no gate. This fails only on findings somebody can actually fix.
      - name: Scan for FIXABLE vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gsd:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln

      # Separate, non-blocking, so the unfixable inventory is visible without gating.
      - name: Full inventory (informational)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gsd:ci
          exit-code: "0"
          severity: CRITICAL,HIGH
          scanners: vuln
