# Build the image on main, push it to Quay, and pin the tag in the chart.
#
# Until now the only way to publish was a laptop running local-development/build-and-push-external.sh,
# which means the published image came from whatever was in one person's working tree and the
# tag in values.yaml was pinned by hand. This runs the SAME script on merge to main, so the
# published artefact is the merge commit and the chart says which one.
#
# WHY THE SCRIPT AND NOT INLINE STEPS. The tag scheme (<version>-<10-char sha>), the stamp
# verification, and the values.yaml rewrite all live in that script and are already tested by
# hand. Reimplementing them here would give two definitions of "what tag does this commit
# produce" that drift silently. The script also refuses a dirty tree and refuses a placeholder
# password, and both guards are worth having in CI.
#
# The manual path is unchanged: run the script locally and it still builds, pushes and rewrites
# values.yaml exactly as before.
name: publish

on:
  push:
    branches: [main]
    # ONLY WHEN SOMETHING THAT GOES INTO THE IMAGE CHANGED.
    #
    # Without this every push to main built and pushed an image and committed a pin, including
    # pushes that cannot affect the image at all. Measured over five consecutive merges: two were
    # documentation-only (a reference-architecture edit, and one Cursor rules file) and each still
    # produced a build, a registry push, and a `pin image tag` commit on main. helm.yaml has always
    # scoped itself with `paths: charts/**`; this workflow never did.
    #
    # AN ALLOWLIST, NOT paths-ignore, and derived from the Containerfile rather than guessed. The
    # naive `paths-ignore: ['**/*.md']` is WRONG here: `COPY pyproject.toml README.md ./` puts
    # local-development/README.md INSIDE the image, so ignoring markdown would skip a rebuild that
    # is genuinely needed. The list is every COPY source, plus the three files that decide what a
    # COPY may see or how it is built.
    #
    # .containerignore IS ONE OF THOSE THREE, and it was missing from the first version of this
    # filter — caught in review. Podman applies it to the build context before any COPY runs, so
    # editing it changes the image with no change to any other listed path. Verified rather than
    # assumed: a probe build of `COPY pkg /pkg` shipped both files, and the same build with
    # `pkg/drop.txt` in .containerignore shipped only one. It currently excludes tests/, docs/,
    # *.db and the local cluster config, so an edit there can add or remove whole trees.
    #
    # tests/test_publish_paths.py holds this list against the Containerfile's COPY lines, because
    # the failure mode is forgetting to extend it when a new input appears — and that failure is
    # silent: the image simply stops tracking the code, with a green run every time.
    #
    # WHAT THIS GIVES UP, deliberately: main's pinned tag no longer always embeds main's HEAD sha.
    # After a docs-only merge the pin names the last commit that actually changed the image, which
    # is the more truthful statement of where the running code came from — `gsd_build_info` reports
    # provenance, not what the tip of main happens to be. Nothing tests the tag-equals-HEAD
    # property; the tag still embeds the commit its image WAS built from, which is the invariant
    # that matters.
    paths:
      - 'local-development/gsd/**'                     # COPY gsd ./gsd
      - 'local-development/pyproject.toml'             # COPY pyproject.toml README.md ./
      - 'local-development/README.md'                  # ...and it really is in the image
      - 'local-development/Containerfile'              # the recipe
      - 'local-development/.containerignore'           # filters what every COPY is allowed to see
      - 'local-development/build-and-push-external.sh' # the tag scheme and the stamp check
      - '.github/workflows/publish.yml'                # this file
  # The escape hatch the filter makes necessary. A rebuild is occasionally wanted for a reason the
  # paths cannot see — a base-image CVE, a registry that lost a tag, a stamp to re-verify — and
  # without this the only way to force one would be an empty commit touching a listed path.
  workflow_dispatch:

# One publish at a time. Two concurrent runs would both rewrite values.yaml and the second
# push would be rejected as non-fast-forward — or worse, land and pin the older image.
# cancel-in-progress is deliberately FALSE: cancelling mid-run can leave an image pushed to
# Quay with no matching commit in the chart, which is the one inconsistency this job exists to
# prevent.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    # THREE guards, each closing a different failure:
    #
    # [skip publish]  — this job pushes a commit to main, which triggers this workflow again.
    #                   The pin commit carries that marker, so the loop terminates after one
    #                   iteration. Checked on the message rather than the actor because a
    #                   `github-actions[bot]` check would also skip legitimate bot merges.
    # repository      — a fork has no access to these secrets, so every push to a fork's main
    #                   would fail the run. Skipping is the honest outcome there.
    # secrets present — configured per-repo, so a clone that has not set them gets a skipped
    #                   job rather than a red X nobody can fix.
    if: >-
      !contains(github.event.head_commit.message, '[skip publish]')
      && github.repository == 'ephico2real2/group-sync-dashboard'
    runs-on: ubuntu-latest

    permissions:
      # To push the pin commit (values.yaml's tag + Chart.yaml's version) back to main.
      contents: write
      # To dispatch Release Charts afterwards. A push made with GITHUB_TOKEN does NOT trigger
      # workflows — GitHub suppresses it to stop recursive runs — so the pin commit cannot
      # publish the chart by landing on main. workflow_dispatch is the documented exception
      # that DOES fire from a token-authenticated caller, which is why the step below exists
      # and why this scope is needed.
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The script derives the tag from `git rev-parse HEAD` and reads the branch name, so
          # it needs real git history rather than a detached export.
          fetch-depth: 0
          # Persist the token so the pin commit can be pushed from the same checkout.
          persist-credentials: true

      # NAMED TO MATCH THE SCRIPT, not the registry. build-and-push-external.sh reads
      # REGISTRY_USERNAME / REGISTRY_PASSWORD from .env locally, so the same name means the same
      # thing in .env, in the script and in Actions — no mapping to remember and nothing to
      # rename if the registry ever changes. This repo has already lost time to one variable
      # name meaning two different files.
      - name: Check the publish credentials are configured
        id: creds
        # STEP-level env, not job-level. GitHub's docs suggest job-level env as the way to make
        # secrets testable in an `if:`; this narrows it further so the credentials exist only in
        # the two steps that actually need them, instead of in the environment of every step
        # including the ones that run git. Same effect on the conditional, less exposure.
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          # Never echo the values. Presence only, so a missing secret is a legible message
          # rather than a podman login failure 40 lines into a build log.
          #
          # `-z` is exactly the right test, per the docs: "If a secret has not been set, the
          # return value of an expression referencing the secret will be an empty string." So
          # unset and empty are indistinguishable here, and both mean "cannot publish".
          #
          # Quoted, because a token can contain characters the shell would otherwise act on —
          # the documented reason to quote secret expansions.
          if [ -z "${REGISTRY_USERNAME}" ] || [ -z "${REGISTRY_PASSWORD}" ]; then
            echo "::warning::REGISTRY_USERNAME / REGISTRY_PASSWORD are not set; skipping publish."
            echo "  Set them under Settings > Secrets and variables > Actions > Secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight — the tools the script needs
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          # Fails fast and legibly if the runner image ever drops podman, rather than midway
          # through a build. The script is podman-only by design: it is daemonless, so it
          # needs no privileged docker socket.
          podman --version
          python3 --version

      - name: Build, push, and rewrite the chart's image tag
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        working-directory: local-development
        env:
          # Registry and namespace are repo VARIABLES, not secrets — they are not sensitive and
          # putting them in secrets makes them invisible in logs when you most want to see which
          # registry a run pushed to. Defaults match .env.example.
          REGISTRY: ${{ vars.REGISTRY || 'quay.io' }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ephico2real' }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          # --update-values rewrites ONLY image.repository and image.tag in the chart's
          # values.yaml; the script asserts it matched exactly one of each and exits non-zero
          # otherwise, so a values.yaml reshuffle cannot silently produce an unpinned chart.
          #
          # No --allow-dirty. A CI checkout is clean by definition, so a dirty tree here means
          # something earlier in the job modified tracked files and the tag would no longer
          # describe the commit.
          ./build-and-push-external.sh --update-values

      - name: Pin the published tag on main
        id: pin
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        env:
          # Needed for the commit message only. Without it in scope the message would say
          # quay.io however the run was actually configured — a small lie in the one record of
          # where the image went.
          REGISTRY: ${{ vars.REGISTRY || 'quay.io' }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ephico2real' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- charts/group-sync-dashboard/values.yaml; then
            # Re-running the same commit produces the same tag, so there is nothing to pin.
            # Not an error: the tag embeds the commit sha, so an identical tag means an
            # identical source, and the image just pushed is the one already recorded.
            echo "values.yaml already pins this tag; nothing to commit."
            exit 0
          fi

          TAG=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("charts/group-sync-dashboard/values.yaml").read_text()
          print(re.search(r'(?m)^  tag: "?([^"\n]+)"?$', text).group(1))
          PY
          )

          # WRITE THE LINE ONTO THE CURRENT TIP, rather than committing first and rebasing.
          #
          # The previous order was commit -> pull --rebase -> push, justified as "this commit
          # touches one line nobody else edits". That premise is false: the PREVIOUS PUBLISH RUN
          # edits exactly this line, so the contended case is two publishes, not two humans. The
          # second run rebased its pin onto the first one's and got
          #
          #   CONFLICT (content): Merge conflict in charts/group-sync-dashboard/values.yaml
          #   error: could not apply … chore(chart): pin image tag 0.6.0-d5d1959d47
          #
          # Rebase cannot resolve that: nothing in the history says the later tag should win.
          #
          # THE CONCURRENCY GROUP ABOVE DOES NOT PREVENT THIS, and it is worth being precise
          # about why, because "one publish at a time" sounds like it should. It does serialize —
          # measured, both times this happened the second job started AFTER the first finished:
          #
          #   2026-08-09  #15 05:41:43-05:42:13   #16 started 05:42:22  -> failed
          #   2026-08-10  #18 16:31:25-16:32:01   #19 started 16:32:04  -> failed
          #
          # The problem is not overlap, it is the CHECKOUT: actions/checkout takes github.sha,
          # the commit that triggered the run, not the branch tip. So the second run is always
          # checked out at a commit that predates the first run's pin. Serialization does not
          # help — it guarantees the pin is already on main by the time the second run reaches
          # this step, which makes the divergence reliable rather than rare.
          #
          # THE COST IS QUIETER THAN A RED RUN: the image is pushed to the registry before this
          # step runs, so a failure here loses only the pin, and main keeps pointing at the
          # PREVIOUS image. 0.6.0-6f88f2a9aa (2026-08-09) appears in no commit in this
          # repository's history — built, pushed, never referenced. The 2026-08-10 case
          # self-corrected only because a third merge followed. Had either been the last push,
          # the chart would deploy code one merge behind with a failed workflow as the only hint.
          #
          # So: fetch, reset to the tip, and re-apply the pin there. There is no conflict to
          # resolve because there is no divergent commit — the newest run simply writes the
          # newest tag last, which is the intended outcome. The retry covers the remaining narrow
          # race where another run pushes between our fetch and our push.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # FETCH_HEAD, not origin/main. `git fetch origin main` updates the remote-tracking ref
            # only opportunistically; FETCH_HEAD is the one ref an explicit-refspec fetch always
            # writes, so resetting to it cannot silently land on a stale tip.
            git fetch origin main
            # HARD, not --soft. A soft reset leaves the index describing the OLD head's tree, so
            # the commit below would carry a revert of everything that landed between this run's
            # checkout and the tip — turning a one-line pin into a silent rollback of other
            # people's merges. Nothing local needs preserving: the tag lives in $TAG, captured
            # above, and the image is already in the registry.
            git reset --hard FETCH_HEAD
            python3 - "$TAG" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("charts/group-sync-dashboard/values.yaml")
          text = path.read_text()
          new, n = re.subn(r'(?m)^(  tag: )"?[^"\n]+"?$', rf'\1"{sys.argv[1]}"', text)
          assert n == 1, f"expected exactly one tag line, rewrote {n}"
          path.write_text(new)
          PY

            if git diff --quiet -- charts/group-sync-dashboard/values.yaml; then
              echo "origin/main already pins ${TAG}; nothing to do."
              exit 0
            fi

            # BUMP THE CHART VERSION IN THE SAME COMMIT, because without it the new pin never
            # reaches a consumer. chart-releaser skips a version it has already published, so
            # rewriting the tag under an already-released version publishes NOTHING and reports
            # success — the trap Chart.yaml's own comment names.
            #
            # Measured on this repository, 2026-08-12: published chart 0.4.0 pinned
            # 0.6.0-424b3fdd63 while main pinned 0.6.0-d0c0edaeea, two merges newer. A consumer
            # running `helm install` from the Helm repo got an image missing BOTH the wide-tier
            # threshold fix (#32) and the self-tier projection (#33) — the second of which
            # withholds directory DNs from narrowed readers, so the gap was a data exposure and
            # not just staleness.
            #
            # Inside the loop, AFTER the reset and AFTER the already-pinned check: the version to
            # bump is whatever the freshly fetched tip carries, which another publish run may have
            # moved, and a run that changes no tag must not bump anything.
            #
            # PATCH, and only patch. The chart's MINOR/MAJOR keep meaning "the templates changed
            # behaviour" — a human decision recorded in Chart.yaml's comments. This is the third
            # component precisely because an image pin is a defaults change and nothing more.
            python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path("charts/group-sync-dashboard/Chart.yaml")
          text = path.read_text()
          # `^version:` at column zero, so appVersion (and any commented example) cannot match.
          found = re.search(r"(?m)^version: (\d+)\.(\d+)\.(\d+)[ \t]*$", text)
          assert found, "no `version: X.Y.Z` line in Chart.yaml"
          major, minor, patch = (int(g) for g in found.groups())
          new, n = re.subn(
              r"(?m)^version: \d+\.\d+\.\d+[ \t]*$", f"version: {major}.{minor}.{patch + 1}", text
          )
          assert n == 1, f"expected exactly one version line, rewrote {n}"
          path.write_text(new)
          print(f"chart version {major}.{minor}.{patch} -> {major}.{minor}.{patch + 1}")
          PY

            git add charts/group-sync-dashboard/values.yaml charts/group-sync-dashboard/Chart.yaml
            # [skip publish] is now the SECOND of two guards against this commit re-triggering the
            # workflow, and the comment used to credit it as the only one. The paths filter is
            # first: this commit touches charts/… alone, which is not an image input, so the
            # workflow does not fire for it at all. The marker is kept because it is the guard
            # that does not depend on the filter's contents — add charts/** to those paths for
            # any reason and the loop is back without it.
            git commit -m "chore(chart): pin image tag ${TAG} [skip publish]" \
                       -m "Published ${REGISTRY}/${REGISTRY_NAMESPACE}/group-sync-dashboard:${TAG} for commit ${GITHUB_SHA}, so the chart deploys the image built from that commit rather than whatever was last pinned by hand." \
                       -m "Automated by .github/workflows/publish.yml."

            if git push origin HEAD:main; then
              echo "pinned ${TAG} on main"
              # Signals the dispatch step below. Set ONLY on a push that actually landed a new
              # pin — the already-pinned early exit above leaves it unset, because there is no
              # new chart version to publish and a dispatch would package an unchanged chart
              # that chart-releaser then skips, turning a no-op into a red-looking run.
              #
              # Defaulted so the step body stays runnable outside Actions: tests/
              # test_publish_pin_step.py executes this exact script in a sandbox where
              # GITHUB_OUTPUT does not exist, and an unguarded redirect would fail there for a
              # reason that has nothing to do with pinning.
              echo "pinned=true" >> "${GITHUB_OUTPUT:-/dev/null}"
              exit 0
            fi
            # Says "retrying" only when there is actually another attempt. The log is the only
            # account of what happened here, so it should not promise a fourth try that the loop
            # will not make.
            if [ "${attempt}" -lt 3 ]; then
              echo "::warning::push rejected on attempt ${attempt}; another run moved main. Retrying."
            else
              echo "::warning::push rejected on attempt ${attempt}; no attempts left."
            fi
            # No reset needed here: the next iteration hard-resets onto the freshly fetched tip,
            # which discards this commit anyway.
          done

          echo "::error::could not pin ${TAG} after 3 attempts. The image IS published;"
          echo "::error::only the chart's tag is unpinned, so main may deploy an older image."
          exit 1

      # WHY A DISPATCH AND NOT THE PUSH ITSELF. helm.yaml triggers on `push` to main under
      # `paths: charts/**`, and the pin commit matches that filter — but it still never fires,
      # because a push made with the repository's GITHUB_TOKEN does not create workflow runs.
      # GitHub suppresses it deliberately, to stop a workflow from re-triggering itself:
      #
      #   "When a workflow run pushes code using the repository's GITHUB_TOKEN, a new workflow
      #    will not run even when the repository contains a workflow configured to run when push
      #    events occur … with the following exceptions: workflow_dispatch and
      #    repository_dispatch events always create workflow runs."
      #   https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
      #
      # Measured here rather than taken on faith: across the three pin commits on main
      # (e740cc5, 28e29fe, 284a45d) `gh run list --workflow="Release Charts"` shows no run at
      # all, while every run it does show sits on a human merge commit.
      #
      # So the chart was only ever released from the MERGE commit — which by construction pins
      # the PREVIOUS image, since the pin for this merge's image is the child commit this job
      # creates. That is the second half of the staleness: one image behind on a chart-changing
      # merge, and frozen indefinitely on a code-only one.
      #
      # workflow_dispatch is the documented exception, so it fires with the same token, and no
      # PAT or GitHub App has to be introduced to make releases work.
      - name: Publish the chart that pins the image just built
        if: steps.pin.outputs.pinned == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --ref main, not the triggering sha: the point is to package the tip that CARRIES the
          # pin commit. github.sha predates it by definition.
          gh workflow run helm.yaml --ref main
          echo "dispatched Release Charts for main"
