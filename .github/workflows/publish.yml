# Build the image on main and push it to Quay. NOTHING HERE WRITES TO THIS REPOSITORY.
#
# That sentence is the whole design. The previous version of this file pushed a commit back to
# `main` after every build, rewriting the chart's image.tag and bumping Chart.yaml's patch. One
# write-back, three defects:
#
#   #34  the published chart was released from the MERGE commit while the pin for that merge's
#        image landed in a CHILD commit, so the chart always pinned the previous image — and froze
#        entirely on a code-only merge, because chart-releaser skips a version already released.
#        It shipped a chart without the self-tier fix that withholds directory DNs.
#   #37  the dispatch added to fix #34 resolved `--ref main` to the pre-push tip. Of four runs,
#        two packaged the pin commit, one packaged the merge commit and published NOTHING, and all
#        four reported `success`.
#   —    `main` could not be branch protected at all, because any rule that blocks direct pushes
#        blocks this workflow, and a user-owned repository cannot allowlist the writer:
#          ruleset bypass    -> 422 "Actor GitHub Actions integration must be part of the ruleset
#                                    source or owner organization"
#          push restrictions -> 422 "Only organization repositories can have users and team
#                                    restrictions"
#
# So the pin is gone. `charts/group-sync-dashboard/values.yaml` ships `image.tag: ""` and
# `gsd.image` resolves `.Chart.AppVersion` — the fallback that helper ALREADY had. See
# docs/DESIGN_decouple_chart_and_app_release.md for the review that settled it.
#
# WHY THE SCRIPT AND NOT INLINE STEPS, unchanged from before: the tag scheme, the stamp
# verification and the release-alias rule all live in build-and-push-external.sh. Reimplementing
# them here would give two definitions of "what tag does this commit produce" that drift silently.
# The script also refuses a dirty tree and a placeholder password, and both guards are worth having
# in CI. It remains the disaster-recovery path — a laptop can do everything this workflow does,
# which matters on the day Actions is down.
name: publish

on:
  push:
    branches: [main]
    # ONLY WHEN SOMETHING THAT GOES INTO THE IMAGE CHANGED.
    #
    # Without this every push to main built and pushed an image, including pushes that cannot
    # affect the image at all. Measured over five consecutive merges: two were documentation-only
    # (a reference-architecture edit, and one Cursor rules file) and each still produced a build and
    # a registry push.
    #
    # AN ALLOWLIST, NOT paths-ignore, and derived from the Containerfile rather than guessed. The
    # naive `paths-ignore: ['**/*.md']` is WRONG here: `COPY pyproject.toml README.md ./` puts
    # local-development/README.md INSIDE the image, so ignoring markdown would skip a rebuild that
    # is genuinely needed. The list is every COPY source, plus the three files that decide what a
    # COPY may see or how it is built.
    #
    # .containerignore IS ONE OF THOSE THREE, and it was missing from the first version of this
    # filter — caught in review. Podman applies it to the build context before any COPY runs, so
    # editing it changes the image with no change to any other listed path. Verified rather than
    # assumed: a probe build of `COPY pkg /pkg` shipped both files, and the same build with
    # `pkg/drop.txt` in .containerignore shipped only one.
    #
    # tests/test_publish_paths.py holds this list against the Containerfile's COPY lines, because
    # the failure mode is forgetting to extend it when a new input appears — and that failure is
    # silent: the image simply stops tracking the code, with a green run every time.
    #
    # NOTE charts/** is deliberately ABSENT. A template-only change publishes no image; the chart
    # release is helm.yaml's job, and it retags rather than rebuilds so a chart version can never
    # claim to package bits that were built for it.
    paths:
      - 'local-development/gsd/**'                     # COPY gsd ./gsd
      - 'local-development/pyproject.toml'             # COPY pyproject.toml README.md ./
      - 'local-development/README.md'                  # ...and it really is in the image
      - 'local-development/Containerfile'              # the recipe
      - 'local-development/.containerignore'           # filters what every COPY is allowed to see
      - 'local-development/build-and-push-external.sh' # the tag scheme and the stamp check
      - '.github/workflows/publish.yml'                # this file
  # The escape hatch the filter makes necessary. A rebuild is occasionally wanted for a reason the
  # paths cannot see — a base-image CVE, a registry that lost a tag, a stamp to re-verify.
  workflow_dispatch:

# One publish at a time. Two concurrent runs would race on the same tags in the registry.
# cancel-in-progress is deliberately FALSE: cancelling mid-run can leave a half-pushed manifest,
# and a build that finishes is cheaper than one abandoned at 90%.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    # TWO guards now, where there used to be three. The `[skip publish]` marker is GONE with the
    # commit it defended against: this job no longer pushes to main, so it cannot re-trigger
    # itself, and a guard against a loop that cannot happen is a guard that misleads the next
    # reader into thinking one can.
    #
    # repository — a fork has no access to these secrets, so every push to a fork's main would
    #              fail the run. Skipping is the honest outcome there.
    if: github.repository == 'ephico2real2/group-sync-dashboard'
    runs-on: ubuntu-latest

    permissions:
      # READ ONLY, and that is the point of this whole change. This job writes to the registry and
      # to nothing else — no contents:write to push a pin, no actions:write to dispatch a release.
      # If a future edit needs either scope back, the branch protection on main breaks with it.
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # The script derives the tag from `git rev-parse HEAD` and reads the branch name, so it
          # needs real git history rather than a detached export. It also needs the PREVIOUS commit
          # to answer "did appVersion change?", which decides whether the release alias moves.
          fetch-depth: 0
          # NOT persisted. Nothing in this job pushes to the repository, and a token left in the
          # local git config is a credential sitting in a build that has no use for it.
          persist-credentials: false

      # NAMED TO MATCH THE SCRIPT, not the registry. build-and-push-external.sh reads
      # REGISTRY_USERNAME / REGISTRY_PASSWORD from .env locally, so the same name means the same
      # thing in .env, in the script and in Actions — no mapping to remember and nothing to rename
      # if the registry ever changes. This repo has already lost time to one variable name meaning
      # two different files.
      - name: Check the publish credentials are configured
        id: creds
        # STEP-level env, not job-level. GitHub's docs suggest job-level env as the way to make
        # secrets testable in an `if:`; this narrows it further so the credentials exist only in the
        # steps that actually need them. Same effect on the conditional, less exposure.
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          # Never echo the values. Presence only, so a missing secret is a legible message rather
          # than a podman login failure 40 lines into a build log.
          #
          # `-z` is exactly the right test, per the docs: "If a secret has not been set, the return
          # value of an expression referencing the secret will be an empty string." So unset and
          # empty are indistinguishable here, and both mean "cannot publish".
          if [ -z "${REGISTRY_USERNAME}" ] || [ -z "${REGISTRY_PASSWORD}" ]; then
            echo "::warning::REGISTRY_USERNAME / REGISTRY_PASSWORD are not set; skipping publish."
            echo "  Set them under Settings > Secrets and variables > Actions > Secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight — the tools the script needs
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          # Fails fast and legibly if the runner image ever drops podman, rather than midway
          # through a build. The script is podman-only by design: it is daemonless, so it needs no
          # privileged docker socket.
          podman --version
          python3 --version

      # ── Did this push change the application version? ────────────────────────────────────────
      #
      # THIS DECIDES WHETHER THE RELEASE ALIAS MOVES, so it is a step of its own rather than a line
      # buried in the build.
      #
      # `:<appVersion>` is what the chart resolves by default, and both reviewers refused to let it
      # move on every merge. `values.yaml#image.pullPolicy` is `Always`, so every container
      # creation — crash, drain, liveness kill, scale-out — re-resolves that tag. A moving alias
      # would let the running binary change while the chart version on the cluster stayed put, and
      # the reader of /api/version would learn about it afterwards rather than consenting to it.
      # It also cannot honour this repo's own rule, stated in release-crc.sh: "a given
      # <version>-<sha> tag always means the same source."
      #
      # So the alias moves only when a human bumps `version` in pyproject.toml, in a PR. Ordinary
      # merges publish the immutable <appVersion>-<sha> and nothing else.
      - name: Decide whether this is an application release
        id: release
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          read_version() {
            git show "$1:local-development/pyproject.toml" 2>/dev/null \
              | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1
          }
          NOW=$(read_version HEAD)
          if [ -z "$NOW" ]; then
            echo "::error::could not read version from pyproject.toml at HEAD"
            exit 1
          fi

          # FAIL CLOSED, LOUDLY. On workflow_dispatch there is no `before`; on a first push it is
          # all zeros; and a force-push can leave a commit the runner cannot read. In every one of
          # those the honest answer is "cannot tell", and the safe action is NOT to move an alias
          # that consumers resolve — but silence would then look like "no release", so it says so
          # and names the manual route. The immutable tag is published either way.
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::warning::cannot read the previous commit (${BEFORE:-unset}), so this run will"
            echo "::warning::NOT move the :${NOW} release alias. The immutable tag is still"
            echo "::warning::published. If this WAS an application release, publish the alias from"
            echo "::warning::a checkout with: ./build-and-push-external.sh --release-tags"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WAS=$(read_version "${BEFORE}")
          if [ "$NOW" != "$WAS" ]; then
            echo "application version ${WAS:-none} -> ${NOW}: this is a release"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "application version unchanged at ${NOW}: immutable tag only"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the image
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        working-directory: local-development
        env:
          # Registry and namespace are repo VARIABLES, not secrets — they are not sensitive, and
          # putting them in secrets makes them invisible in logs when you most want to see which
          # registry a run pushed to. Defaults match .env.example.
          REGISTRY: ${{ vars.REGISTRY || 'quay.io' }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ephico2real' }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IS_RELEASE: ${{ steps.release.outputs.is_release }}
        run: |
          set -euo pipefail
          # NO --update-values. That flag rewrites the chart's image.tag, which is exactly the pin
          # this change removes — but the flag itself is PRESERVED for the local and enterprise
          # path, where somebody building into their own registry genuinely needs the chart to
          # point at their own image. CI simply does not use it.
          #
          # No --allow-dirty either. A CI checkout is clean by definition, so a dirty tree here
          # means something earlier in the job modified tracked files and the tag would no longer
          # describe the commit.
          if [ "${IS_RELEASE}" = "true" ]; then
            ./build-and-push-external.sh --release-tags
          else
            ./build-and-push-external.sh
          fi
