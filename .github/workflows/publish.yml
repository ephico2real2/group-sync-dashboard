# Build the image on main and push it to Quay. NOTHING HERE WRITES TO THIS REPOSITORY.
#
# That sentence is the whole design. The previous version of this file pushed a commit back to
# `main` after every build, rewriting the chart's image.tag and bumping Chart.yaml's patch. One
# write-back, three defects:
#
#   #34  the published chart was released from the MERGE commit while the pin for that merge's
#        image landed in a CHILD commit, so the chart always pinned the previous image — and froze
#        entirely on a code-only merge, because chart-releaser skips a version already released.
#        It shipped a chart without the self-tier fix that withholds directory DNs.
#   #37  the dispatch added to fix #34 resolved `--ref main` to the pre-push tip. Of four runs,
#        two packaged the pin commit, one packaged the merge commit and published NOTHING, and all
#        four reported `success`.
#   —    `main` could not be branch protected at all, because any rule that blocks direct pushes
#        blocks this workflow, and a user-owned repository cannot allowlist the writer:
#          ruleset bypass    -> 422 "Actor GitHub Actions integration must be part of the ruleset
#                                    source or owner organization"
#          push restrictions -> 422 "Only organization repositories can have users and team
#                                    restrictions"
#
# So the pin is gone. `charts/group-sync-dashboard/values.yaml` ships `image.tag: ""` and
# `gsd.image` resolves `.Chart.AppVersion` — the fallback that helper ALREADY had. See
# docs/DESIGN_decouple_chart_and_app_release.md for the review that settled it.
#
# WHY THE SCRIPT AND NOT INLINE STEPS, unchanged from before: the tag scheme, the stamp
# verification and the release-alias rule all live in build-and-push-external.sh. Reimplementing
# them here would give two definitions of "what tag does this commit produce" that drift silently.
# The script also refuses a dirty tree and a placeholder password, and both guards are worth having
# in CI. It remains the disaster-recovery path — a laptop can do everything this workflow does,
# which matters on the day Actions is down.
#
# TWO IMAGES FROM ONE PUSH. The dashboard image and the report image (C3) are built from the same
# commit, tagged <appVersion>-<sha>, and their release aliases move on the same decision; each
# build step records the digest the registry acknowledged as a job output of its own.
#
# TWO JOBS FOLLOW THE PUSH, and neither touches this repository either. `sbom` catalogues each
# pushed image by digest (Syft, SPDX JSON, kept as a workflow artifact); `attest` signs each digest
# keyless with cosign through GitHub's OIDC identity, attaches the SBOM as an attestation, records
# SLSA build provenance in GitHub's attestation store, and READS EACH ONE BACK with the commands
# the install guide gives operators, so a signature nobody could verify is a red run here. Both
# run as a two-leg matrix over the two images — one definition, so the report image cannot drift
# to a weaker chain than the dashboard's. They are separate jobs so that `publish` keeps holding
# exactly `contents: read` — the property tests/test_publish_release_decision.py calls
# load-bearing — while only `attest` holds `id-token: write`. Each has a repository-variable
# switch, documented on the job.
name: publish

on:
  push:
    branches: [main]
    # ONLY WHEN SOMETHING THAT GOES INTO THE IMAGE CHANGED.
    #
    # Without this every push to main built and pushed an image, including pushes that cannot
    # affect the image at all. Measured over five consecutive merges: two were documentation-only
    # (a reference-architecture edit, and one Cursor rules file) and each still produced a build and
    # a registry push.
    #
    # AN ALLOWLIST, NOT paths-ignore, and derived from the Containerfile rather than guessed. The
    # naive `paths-ignore: ['**/*.md']` is WRONG here: `COPY pyproject.toml README.md ./` puts
    # local-development/README.md INSIDE the image, so ignoring markdown would skip a rebuild that
    # is genuinely needed. The list is every COPY source, plus the three files that decide what a
    # COPY may see or how it is built.
    #
    # .containerignore IS ONE OF THOSE THREE, and it was missing from the first version of this
    # filter — caught in review. Podman applies it to the build context before any COPY runs, so
    # editing it changes the image with no change to any other listed path. Verified rather than
    # assumed: a probe build of `COPY pkg /pkg` shipped both files, and the same build with
    # `pkg/drop.txt` in .containerignore shipped only one.
    #
    # tests/test_publish_paths.py holds this list against the Containerfile's COPY lines, because
    # the failure mode is forgetting to extend it when a new input appears — and that failure is
    # silent: the image simply stops tracking the code, with a green run every time.
    #
    # NOTE charts/** is deliberately ABSENT. A template-only change publishes no image; the chart
    # release is helm.yaml's job, and it retags rather than rebuilds so a chart version can never
    # claim to package bits that were built for it.
    paths:
      - 'local-development/gsd/**'                     # COPY gsd ./gsd
      - 'local-development/pyproject.toml'             # COPY pyproject.toml README.md ./
      - 'local-development/README.md'                  # ...and it really is in the image
      - 'local-development/uninstall-lists.py'         # COPY uninstall-lists.py (pack stage)
      - 'local-development/image-proof.py'             # COPY image-proof.py (runtime proof)
      - 'local-development/Containerfile'              # the recipe
      - 'local-development/.containerignore'           # filters what every COPY is allowed to see
      - 'local-development/build-and-push-external.sh' # the tag scheme and the stamp check
      - 'local-development/Containerfile.report'        # the report image's recipe
      - 'local-development/report-image-proof.py'       # COPY report-image-proof.py (report proof)
      - 'local-development/build-and-push-report.sh'    # the wrapper that names the second image
      - '.github/workflows/publish.yml'                # this file
  # The escape hatch the filter makes necessary. A rebuild is occasionally wanted for a reason the
  # paths cannot see — a base-image CVE, a registry that lost a tag, a stamp to re-verify.
  workflow_dispatch:

# One publish at a time. Two concurrent runs would race on the same tags in the registry.
# cancel-in-progress is deliberately FALSE: cancelling mid-run can leave a half-pushed manifest,
# and a build that finishes is cheaper than one abandoned at 90%.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    # TWO guards now, where there used to be three. The `[skip publish]` marker is GONE with the
    # commit it defended against: this job no longer pushes to main, so it cannot re-trigger
    # itself, and a guard against a loop that cannot happen is a guard that misleads the next
    # reader into thinking one can.
    #
    # repository — a fork has no access to these secrets, so every push to a fork's main would
    #              fail the run. Skipping is the honest outcome there.
    if: github.repository == 'ephico2real2/group-sync-dashboard'
    runs-on: ubuntu-latest
    # What the two jobs below need, one pair per image: the digest the registry acknowledged and
    # the repository it lives in. Empty when nothing was pushed, and both jobs key on that.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.build.outputs.image }}
      report_digest: ${{ steps.build-report.outputs.digest }}
      report_image: ${{ steps.build-report.outputs.image }}

    permissions:
      # READ ONLY, and that is the point of this whole change. This job writes to the registry and
      # to nothing else — no contents:write to push a pin, no actions:write to dispatch a release.
      # If a future edit needs either scope back, the branch protection on main breaks with it.
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script derives the tag from `git rev-parse HEAD` and reads the branch name, so it
          # needs real git history rather than a detached export. It also needs the PREVIOUS commit
          # to answer "did appVersion change?", which decides whether the release alias moves.
          fetch-depth: 0
          # NOT persisted. Nothing in this job pushes to the repository, and a token left in the
          # local git config is a credential sitting in a build that has no use for it.
          persist-credentials: false

      # NAMED TO MATCH THE SCRIPT, not the registry. build-and-push-external.sh reads
      # REGISTRY_USERNAME / REGISTRY_PASSWORD from .env locally, so the same name means the same
      # thing in .env, in the script and in Actions — no mapping to remember and nothing to rename
      # if the registry ever changes. This repo has already lost time to one variable name meaning
      # two different files.
      - name: Check the publish credentials are configured
        id: creds
        # STEP-level env, not job-level. GitHub's docs suggest job-level env as the way to make
        # secrets testable in an `if:`; this narrows it further so the credentials exist only in the
        # steps that actually need them. Same effect on the conditional, less exposure.
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          # Never echo the values. Presence only, so a missing secret is a legible message rather
          # than a podman login failure 40 lines into a build log.
          #
          # `-z` is exactly the right test, per the docs: "If a secret has not been set, the return
          # value of an expression referencing the secret will be an empty string." So unset and
          # empty are indistinguishable here, and both mean "cannot publish".
          if [ -z "${REGISTRY_USERNAME}" ] || [ -z "${REGISTRY_PASSWORD}" ]; then
            echo "::warning::REGISTRY_USERNAME / REGISTRY_PASSWORD are not set; skipping publish."
            echo "  Set them under Settings > Secrets and variables > Actions > Secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight — the tools the script needs
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          # Fails fast and legibly if the runner image ever drops podman, rather than midway
          # through a build. The script is podman-only by design: it is daemonless, so it needs no
          # privileged docker socket.
          podman --version
          python3 --version
          skopeo --version   # the release aliases are server-side copies made by skopeo

      # ── Did this push change the application version? ────────────────────────────────────────
      #
      # THIS DECIDES WHETHER THE RELEASE ALIAS MOVES, so it is a step of its own rather than a line
      # buried in the build.
      #
      # `:<appVersion>` is what the chart resolves by default, and both reviewers refused to let it
      # move on every merge. `values.yaml#image.pullPolicy` is `Always`, so every container
      # creation — crash, drain, liveness kill, scale-out — re-resolves that tag. A moving alias
      # would let the running binary change while the chart version on the cluster stayed put, and
      # the reader of /api/version would learn about it afterwards rather than consenting to it.
      # It also cannot honour this repo's own rule, stated in release-crc.sh: "a given
      # <version>-<sha> tag always means the same source."
      #
      # So the alias moves only when a human bumps `version` in pyproject.toml, in a PR. Ordinary
      # merges publish the immutable <appVersion>-<sha> and nothing else.
      - name: Decide whether this is an application release
        id: release
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          read_version() {
            git show "$1:local-development/pyproject.toml" 2>/dev/null \
              | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1
          }
          NOW=$(read_version HEAD)
          if [ -z "$NOW" ]; then
            echo "::error::could not read version from pyproject.toml at HEAD"
            exit 1
          fi

          # FAIL CLOSED, LOUDLY. On workflow_dispatch there is no `before`; on a first push it is
          # all zeros; and a force-push can leave a commit the runner cannot read. In every one of
          # those the honest answer is "cannot tell", and the safe action is NOT to move an alias
          # that consumers resolve — but silence would then look like "no release", so it says so
          # and names the manual route. The immutable tag is published either way.
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::warning::cannot read the previous commit (${BEFORE:-unset}), so this run will"
            echo "::warning::NOT move the :${NOW} release aliases. The immutable tags are still"
            echo "::warning::published. If this WAS an application release, publish the aliases of"
            echo "::warning::BOTH images from a clean checkout of this commit:"
            echo "::warning::  ./build-and-push-external.sh --release-tags"
            echo "::warning::  ./build-and-push-report.sh --release-tags"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WAS=$(read_version "${BEFORE}")
          if [ "$NOW" != "$WAS" ]; then
            echo "application version ${WAS:-none} -> ${NOW}: this is a release"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "application version unchanged at ${NOW}: immutable tag only"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the image
        id: build
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        working-directory: local-development
        env:
          # Where the script writes the digest the registry acknowledged for the immutable tag.
          # The attest job signs THAT, by digest, never a tag.
          DIGEST_FILE: ${{ runner.temp }}/pushed.digest
          # Registry and namespace are repo VARIABLES, not secrets — they are not sensitive, and
          # putting them in secrets makes them invisible in logs when you most want to see which
          # registry a run pushed to. Defaults match .env.example.
          REGISTRY: ${{ vars.REGISTRY || 'quay.io' }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ephico2real' }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IS_RELEASE: ${{ steps.release.outputs.is_release }}
        run: |
          set -euo pipefail
          # NO --update-values. That flag rewrites the chart's image.tag, which is exactly the pin
          # this change removes — but the flag itself is PRESERVED for the local and enterprise
          # path, where somebody building into their own registry genuinely needs the chart to
          # point at their own image. CI simply does not use it.
          #
          # No --allow-dirty either. A CI checkout is clean by definition, so a dirty tree here
          # means something earlier in the job modified tracked files and the tag would no longer
          # describe the commit.
          if [ "${IS_RELEASE}" = "true" ]; then
            ./build-and-push-external.sh --release-tags
          else
            ./build-and-push-external.sh
          fi
          digest=$(tr -d '\r\n' < "${DIGEST_FILE}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${REGISTRY_NAMESPACE}/group-sync-dashboard" >> "$GITHUB_OUTPUT"

      # THE SECOND IMAGE, SAME RUN, SAME DECISION. The report image is built from the same commit
      # and tagged <appVersion>-<sha>; its release aliases move exactly when the dashboard's do
      # (steps.release decided that once, above), so the two images a chart resolves by appVersion
      # are always the same source. The wrapper sets IMAGE_NAME/CONTAINERFILE and refuses the two
      # flags that target the dashboard's values.
      #
      # IN THIS JOB, NOT A LATER ONE. The first version of this step sat under `sbom`, reading
      # `steps.creds` and `steps.release` — which exist only here: step outputs are job-local, so
      # its condition could never hold and CI would never have pushed the report image (review of
      # C3, Codex). tests/test_publish_paths.py holds every `steps.<id>.` reference to a step
      # defined earlier in the same job.
      #
      # AFTER the dashboard's push. A report build that fails here leaves the dashboard's
      # immutable tag in the registry and this job red — which withholds BOTH images' catalogue
      # and signatures, because the two jobs below key on this job's result: the run is the unit,
      # and a half-signed pair would be a run that looks finished. On an ordinary merge a
      # workflow_dispatch rebuilds both. On a RELEASE push the dashboard's aliases have already
      # moved (its step ran --release-tags before this one) to a digest this run never signs, and
      # a dispatch cannot move them (no `before`, so the release decision fails closed): the
      # recovery is a corrective application release, or the two-script route that decision's
      # warning names, which publishes unsigned aliases. docs/DESIGN_supply_chain.md D10.
      - name: Build and push the report image
        id: build-report
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        working-directory: local-development
        env:
          # Its own file, never the dashboard's: the script overwrites whatever DIGEST_FILE names.
          DIGEST_FILE: ${{ runner.temp }}/pushed-report.digest
          REGISTRY: ${{ vars.REGISTRY || 'quay.io' }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ephico2real' }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IS_RELEASE: ${{ steps.release.outputs.is_release }}
        run: |
          set -euo pipefail
          if [ "${IS_RELEASE}" = "true" ]; then
            ./build-and-push-report.sh --release-tags
          else
            ./build-and-push-report.sh
          fi
          digest=$(tr -d '\r\n' < "${DIGEST_FILE}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          # The wrapper's default IMAGE_NAME, and a test holds the two strings together.
          echo "image=${REGISTRY}/${REGISTRY_NAMESPACE}/group-sync-dashboard-report" >> "$GITHUB_OUTPUT"

  # ── The SBOM ─────────────────────────────────────────────────────────────────────────────────
  #
  # SWITCH: repository variable SUPPLY_CHAIN_SBOM; anything but 'false' runs it. ON by default: it
  # reads the image that was just pushed with the credential the publish job already holds, writes
  # one file, and changes nothing that is published. Off on a runner that cannot reach the registry
  # anonymously-plus-credential, or when an SBOM is produced elsewhere.
  #
  # BY DIGEST, so the catalogue describes the bytes that were pushed and not whatever a tag
  # resolves to a minute later. Syft is pinned to the version docs/image-vulnerability-scan.md
  # measured identifying Hummingbird OS; a test holds the two together, because a Syft that does
  # not recognise the base produces an SBOM with no OS packages in it — a document that is
  # complete-looking and wrong, the failure this repo has met with Trivy and with Grype's default.
  sbom:
    name: SBOM of the ${{ matrix.name }} image
    needs: publish
    # No status function in this condition, so GitHub applies its default `success()`: a red
    # publish job — a report build that failed after the dashboard's push — skips this job (the
    # expressions reference: "A default status check of success() is applied unless you include
    # one of these functions"). Adding `!cancelled()` here would change that; the test that pins
    # this line is the guard.
    if: needs.publish.outputs.digest != '' && vars.SUPPLY_CHAIN_SBOM != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # ONE LEG PER IMAGE, ONE DEFINITION. `include` reads the publish job's outputs — the `needs`
    # context is one a job's `strategy` may read — so each leg is exactly the <image, digest>
    # pair the registry acknowledged, never a tag. The job-level `if` above keys on the
    # dashboard's digest alone, because `matrix` is not a context a job-level `if` can read
    # (GitHub's context-availability table); the report digest is written by the same job under
    # the same condition, so one being present means both are. fail-fast is off so that one
    # image's failed catalogue never cancels the other's.
    #
    # The two legs are repeated verbatim on `attest`, and a test holds the two matrices equal —
    # the artifact name in particular, which is also the file name the attest job reads.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dashboard
            image: ${{ needs.publish.outputs.image }}
            digest: ${{ needs.publish.outputs.digest }}
            artifact: sbom-${{ github.sha }}
          - name: report
            image: ${{ needs.publish.outputs.report_image }}
            digest: ${{ needs.publish.outputs.report_digest }}
            artifact: sbom-report-${{ github.sha }}
    steps:
      - name: Catalogue the image, by digest
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # The action prefixes `registry:` itself when a username is given, so Syft reads the
          # registry directly — there is no daemon on this runner holding the image.
          image: ${{ matrix.image }}@${{ matrix.digest }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          syft-version: v1.51.1
          format: spdx-json
          output-file: sbom.spdx.json
          # Also the FILE name inside the artifact (see the attest job), and a run holds one
          # artifact per name — so the two legs cannot share `sbom-<sha>`.
          artifact-name: ${{ matrix.artifact }}
          upload-artifact: true
          upload-artifact-retention: 90
          # A push has no release to attach assets to, and the dependency graph is for source
          # manifests, not image inventories.
          upload-release-assets: false
          dependency-snapshot: false

  # ── Signature, SBOM attestation, provenance ──────────────────────────────────────────────────
  #
  # SWITCH: repository variable SUPPLY_CHAIN_SIGNING; anything but 'false' runs it. ON by default
  # because keyless signing needs NO SECRET: the job's OIDC token (id-token: write) is exchanged
  # with Fulcio for a certificate that lives minutes, and the signature is recorded in Rekor's
  # public transparency log — which is a public entry naming this repository, the workflow and the
  # digest, appropriate for a public image. What it needs instead of a secret: egress to
  # fulcio.sigstore.dev, rekor.sigstore.dev and tuf-repo-cdn.sigstore.dev, and a run in THIS
  # repository (a fork never gets an OIDC token for this identity, and is already skipped by the
  # publish job's repository guard). A self-hosted runner without that egress sets the variable
  # to false; nothing else in the workflow changes.
  #
  # A JOB OF ITS OWN so that `publish` keeps holding exactly contents: read. Everything here signs
  # or attests the digest the publish job reported — never a tag, which is a name somebody can move.
  #
  # THE SBOM IS A DEPENDENCY, NOT A REQUIREMENT. `needs: sbom` with !cancelled() means this job
  # runs when the sbom job was skipped by its own switch; the two attach steps then do not run and
  # a step says so by name, so "signed, no SBOM attached" is a stated outcome and not a guess.
  #
  # EVERY ARTEFACT IS READ BACK before the job is green, with the flags the install guide gives
  # operators. If the registry cannot hold the bundle, or the identity string is wrong, this run
  # is red — not a consumer's `cosign verify` on a cluster.
  attest:
    name: Sign the ${{ matrix.name }} image and attest its provenance
    needs: [publish, sbom]
    if: >-
      !cancelled()
      && needs.publish.result == 'success'
      && needs.publish.outputs.digest != ''
      && vars.SUPPLY_CHAIN_SIGNING != 'false'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token Fulcio exchanges for a short-lived signing certificate.
      id-token: write
      # To store the provenance statement in this repository's attestation store.
      attestations: write
    # THE SAME TWO LEGS as `sbom`, from the same outputs. GitHub reports one `needs.<job>.result`
    # per job, not per leg (the contexts reference documents nothing finer), and with fail-fast
    # off a failed leg makes that one result `failure` — so if either image's catalogue failed,
    # neither leg attaches an SBOM and both say so. A stated outcome, chosen over a per-leg
    # artifact probe that would make "signed, no SBOM" depend on a download error's wording; to
    # be confirmed on the first run with a red sbom leg. fail-fast is off so that one image's
    # failed signature never cancels the other's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dashboard
            image: ${{ needs.publish.outputs.image }}
            digest: ${{ needs.publish.outputs.digest }}
            artifact: sbom-${{ github.sha }}
          - name: report
            image: ${{ needs.publish.outputs.report_image }}
            digest: ${{ needs.publish.outputs.report_digest }}
            artifact: sbom-report-${{ github.sha }}
    env:
      IMAGE: ${{ matrix.image }}
      DIGEST: ${{ matrix.digest }}
      # The certificate's subject for a GitHub-issued keyless signature: this workflow FILE on
      # main — PINNED, not `github.ref`, and the job runs only on main (the `if` above). A
      # workflow_dispatch from another branch would otherwise sign under that branch's identity,
      # pass its own read-back, and fail the one command the install guide gives operators; such a
      # dispatch now pushes an unsigned image, which the design record states (review of A2).
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned: the installer's own default trails releases, and the bundle format a cosign
          # writes is what a consumer's cosign must read. Move it with the install guide.
          cosign-release: v3.1.3

      - name: Log in to the registry, for the signature push
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY || 'quay.io' }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          # --password-stdin, never on the command line — the same rule as the build script.
          printf '%s' "${REGISTRY_PASSWORD}" \
            | cosign login "${REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin

      - name: Sign the digest, keyless
        shell: bash
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Read the signature back
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "signature verifies for ${IMAGE}@${DIGEST} as ${IDENTITY}"

      - name: Fetch the SBOM the sbom job produced
        if: needs.sbom.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: downloaded-sbom

      - name: Attach the SBOM as an attestation, and read it back
        if: needs.sbom.result == 'success'
        shell: bash
        env:
          # sbom-action names the FILE inside the artifact after `artifact-name`, not after
          # `output-file` (its uploadSbomArtifact writes `${tempDir}/${artifactName}`), and
          # download-artifact extracts without renaming — so the file here is `sbom-<sha>` (or
          # `sbom-report-<sha>` on the report leg), not `sbom.spdx.json`. Review of A2 (Codex):
          # the first run would have failed at `test -s`.
          SBOM_FILE: downloaded-sbom/${{ matrix.artifact }}
        run: |
          set -euo pipefail
          test -s "${SBOM_FILE}"
          cosign attest --yes --type spdxjson --predicate "${SBOM_FILE}" "${IMAGE}@${DIGEST}"
          cosign verify-attestation --type spdxjson \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "SBOM attestation verifies for ${IMAGE}@${DIGEST}"

      - name: Say so when there is no SBOM to attach
        if: needs.sbom.result != 'success'
        shell: bash
        env:
          SBOM_RESULT: ${{ needs.sbom.result }}
        run: |
          echo "::notice::the sbom job's result is '${SBOM_RESULT}' (SUPPLY_CHAIN_SBOM off, or one of its legs failed),"
          echo "::notice::so ${IMAGE}@${DIGEST} is signed and its provenance attested, with no SBOM attached."

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          # GitHub's store is what `gh attestation verify` reads; a second copy in the registry
          # would need a docker login inside the action and serve no verifier this repo documents.
          push-to-registry: false

      - name: Read the provenance back
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish.yml"
