# CRC — local development cluster.
#
# Pass with every upgrade:
#   helm upgrade --install group-sync-dashboard charts/group-sync-dashboard \
#     -n group-sync-dashboard -f environments/crc.yaml
#
# ingress.host is deliberately absent: the chart derives it from the cluster's own apps
# domain, which on CRC gives group-sync-dashboard.apps-crc.testing. Setting it here would
# pin a value that the chart already gets right, and pinning it is what made a changed
# default appear not to work.

# Bearer-token access to /api, for cluster-report.py and any external aggregator.
# The caller still needs cluster-wide RBAC read; see docs/api-access.md.
oauthProxy:
  apiTokenAccess:
    enabled: true

# Unmanaged-grant discovery. `log` is the chart default now, so this is redundant — kept
# explicit because a release file should state what it wants rather than inherit it, and
# because that keeps the intent if the default ever moves again.
config:
  unmanagedAudit:
    mode: "log"

# Login capture, on for this lab. Two halves that are deliberately separate decisions:
#
#   authLogLevel  raises `spec.logLevel` on the authentication OPERATOR CR — NOT the OAuth CR — so the
#                 oauth-server names the person logging in. Without it the line does not exist at all.
#                 A cluster-scoped write, so it runs under its own ServiceAccount, never the dashboard's.
#   loginCapture  lets the DASHBOARD read those pod logs. A Role in openshift-authentication, because
#                 `pods/log` in a ClusterRole would read every pod on the cluster.
#
# ON A SHARED CLUSTER, READ THIS FIRST: toggling the level rolls oauth-openshift, which at one replica
# is a login outage rather than a rolling update. CRC has one replica. See
# docs/LOGIN_CAPTURE_QUICKCHECK.md, which is also how to verify the whole path end to end.
#
# Turning it off is two steps: set enabled=false and let it converge, THEN manage=false. Going straight
# to manage=false removes the revert Job with it and strands the cluster in Debug.
authLogLevel:
  manage: true
  enabled: true

loginCapture:
  enabled: true
