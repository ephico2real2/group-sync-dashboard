# CRC — local development cluster.
#
# Pass with every upgrade:
#   helm upgrade --install group-sync-dashboard charts/group-sync-dashboard \
#     -n group-sync-dashboard -f environments/crc.yaml
#
# No host is set here, deliberately. The chart's default Route asks the router for
# <fullname>.<apps domain> via spec.subdomain, which on CRC gives
# group-sync-dashboard.apps-crc.testing — the same URL the Ingress path used to derive by
# lookup. Setting route.host would pin a value the cluster already gets right, and pinning it
# is what once made a changed default appear not to work.

# Bearer-token access to /api, for cluster-report.py and any external aggregator.
# The caller still needs cluster-wide RBAC read; see docs/api-access.md.
oauthProxy:
  apiTokenAccess:
    enabled: true

# Unmanaged-grant discovery. `log` is the chart default now, so this is redundant — kept
# explicit because a release file should state what it wants rather than inherit it, and
# because that keeps the intent if the default ever moves again.
config:
  unmanagedAudit:
    mode: "log"

# THE DASHBOARD'S OWN log level, on DEBUG for this lab at the operator's request. This is a severity
# for this Python process. Audit capture needs no OAuth verbosity change.
logLevel: DEBUG

# Login capture uses the audit log at default OAuth verbosity.
# Read-only nodes/proxy grant; see docs/LOGIN_CAPTURE_QUICKCHECK.md.
loginCapture:
  enabled: true
  source: audit-log

# The M5 Pro's CRC (28 GB, 10 CPUs) runs full cluster monitoring, and user-workload monitoring was
# switched on 2026-09-19 (openshift-monitoring/cluster-monitoring-config: enableUserWorkload: true).
# Everything the KPI page's doors and the Grafana board need is the chart's DEFAULT since 0.36.0:
# the ServiceMonitor, the rules, the board's ConfigMap and — because this cluster serves
# grafana.integreatly.org/v1beta1 (the openshift-grafana chart runs in this namespace as release
# `grafana`, #162) — the GrafanaDashboard CR bound to its datasource by uid (#161); `grafana.url`
# and `console.url` are discovered (the release's Route by label, console-public). Nothing to set
# here, and that is the point: this file must not carry what a default install already does.

# ---------------------------------------------------------------------------
# Reporting — the namespace-access multi-dimension selector (P2, 0.21.0+)
# ---------------------------------------------------------------------------
# This cluster's namespaces carry enterprise metadata — company.net/mnemonic (the app mnemonic)
# and company.net/app-environment (prod/qa/uat/...). Capture BOTH keys on the poll and offer BOTH
# as selector DIMENSIONS in the Reports form, so the namespace-access report can be scoped by
# "mnemonic in {demo, beta} AND app-environment in {prod}" — AND across dimensions, OR within.
# The dropdown VALUES are auto-discovered from the namespaces; nothing is hard-coded here.
#
# rbac.namespaces is REQUIRED: without the grant to list Namespace objects the poller never reads
# their labels, so the selector would always be empty (the chart guard refuses the combination).
rbac:
  namespaces: true

# The Kyverno policy module (#170): the lab runs Kyverno v1.19.1 in `kyverno`; the three report breakers
# live on three endpoints (discovery §4), all reachable from the pod's network.
kyverno:
  metricsUrl: "http://kyverno-svc-metrics.kyverno.svc:8000/metrics,http://kyverno-reports-controller-metrics.kyverno.svc:8000/metrics,http://kyverno-background-controller-metrics.kyverno.svc:8000/metrics"

reporting:
  namespaceMetadata:
    # The poller CAPTURES these label keys from every Namespace (bounded set).
    labels:
      - company.net/mnemonic
      - company.net/app-environment
  # #149 R7: the exact-group label; the poller captures it and the forms resolve mnemonics through it.
  namespaceGroupLabel: company.net/oud-group
  namespaceSelector:
    # The Reports form OFFERS these as selector dimensions (must be a subset of the captured keys).
    labels:
      - company.net/mnemonic
      - company.net/app-environment
  # P4 — the global reporting window, ON per the mandate to turn on every reporting feature we added.
  # It gates AUTOMATED runs (schedules and service-token callers) to a night window; a human's manual
  # run from the Reports tab is NEVER gated. The CronJob below gets spec.timeZone = this zone so its
  # schedule time lands inside the window (else the run would 409-skip).
  window:
    enabled: true
    timezone: "America/New_York"
    start: "22:00"
    end: "06:00"
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
  # One nightly schedule to exercise the window + the CronJob. namespace-access scoped by the mnemonic
  # dimension (P2), so the schedule shows both features working together. Fires 22:00 New York, inside
  # the window; a manual trigger outside the window would 409 -> the Job records a skip, not a failure.
  # #149: the first is cluster-agnostic (no `cluster:` — the service fans it out to every enabled
  # cluster in its snapshot), the second is paused (its CronJob stays, suspended) — the two shapes the
  # status page has to show and the live checks exercise.
  schedules:
    - name: nightly-namespace-access
      schedule: "0 22 * * *"
      report: namespace-access
      params:
        selectors:
          company.net/mnemonic: [demo, beta]
    - name: quarterly-compliance
      schedule: "0 6 1 1,4,7,10 *"
      report: compliance-snapshot
      retention: {keepPerSchedule: 12, days: 2555}
    - name: biweekly-groups
      schedule: "0 6 1,16 * *"
      report: groups
      enabled: false

# ---------------------------------------------------------------------------
# Clusters the dashboard polls
# ---------------------------------------------------------------------------
# `dashboard` is this cluster and the declared controller (#249). The mock OpenShift API server
# (local-development/mock-app, Service mock-openshift:6443) is added as a SECOND cluster so the
# namespace-access report and the P2 multi-dimension selector can be exercised against its fixture
# namespaces too. Its token + CA live in the mock-cluster-creds Secret, mounted at /etc/gsd/mock by
# the mock-creds volume (patched onto the Deployment; preserved across `helm upgrade` by 3-way merge).
clusters:
  # HELM REPLACES LISTS, IT DOES NOT MERGE THEM. values.yaml's `clusters` default is discarded the
  # moment this file declares its own, so the host stanza is REPEATED here deliberately — dropping it
  # does not inherit it, it deletes it, and the first enabled entry silently becomes the controller
  # (measured: removing it made shared-rnd the host and the render refused, naming exactly that).
  - name: dashboard
    dashboardController: true
    apiUrl: https://kubernetes.default.svc
    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    caBundleFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    enabled: true
  # shared-rnd is RETRIEVED, not hand-made: the stanza declares saTokenLookup, and the dashboard logs
  # in as clusterConfig.fleetAccount, reads that cluster's poller ServiceAccount token and writes
  # gsd-cluster-shared-rnd itself (SPEC_S4b, #284).
  - name: shared-rnd
    apiUrl: https://api.crc.testing:6443
    saTokenLookup: true
    # NO PER-CLUSTER CA ON PURPOSE — this is the path a real remote cluster takes. With nothing
    # declared, ClusterConfig.verify() falls back to the bundle OpenShift injects
    # (GSD_TRUSTED_CA_FILE), which carries the system trust merged with proxy/cluster's trustedCA.
    # That bundle now also carries this cluster's own CA, because proxy/cluster.spec.trustedCA was
    # pointed at `enterprise-and-cluster-ca-bundle` (the enterprise root plus kube-root-ca), so the
    # injected bundle verifies api.crc.testing and the OAuth route as well as enterprise-signed
    # endpoints. Declaring a caBundleFile here would OVERRIDE that and stop exercising the real path.
    # NO visibility / identity ON PURPOSE. A remote that states neither is asked about the reader
    # itself — `remote-sar` + `same-as-host` (SPEC_D2b) — so shared-rnd's OWN RBAC decides who sees it
    # wide, and the Secret the lookup writes follows this stanza for as long as it is the lookup's own.
    # `mock` sets `inherit` explicitly because it is a toy. Copying mock's keys here would widen
    # shared-rnd's membership to every host cluster-admin — a decision, not a consistency fix.
    enabled: true
  - name: mock
    apiUrl: https://mock-openshift:6443
    tokenFile: /etc/gsd/mock/token
    caBundleFile: /etc/gsd/mock/ca.crt
    enabled: true
    # The mock is a demo cluster whose fixture makes kubeadmin cluster-admin and developer a report
    # auditor. A second cluster that states nothing takes remote-sar + same-as-host — its own RBAC
    # decides. Here we STATE `inherit` instead: the host's tier decides the mock's rows, as a toy's
    # should, and the reader is matched by OpenShift username.
    visibility: inherit
    identity: same-as-host


# The Cluster Configurations tab writes its own Secrets here (#230 S2). ON for the lab at the
# operator's instruction (2026-09-20): the LDAP account exists on this cluster, is a member of the
# login-gate group, and its credentials are already on the controller — so a cluster can be
# onboarded from the GUI rather than by hand. The chart still ships this OFF, a stated exception:
# it is the decision to let the dashboard mint cluster access.
clusterConfig:
  secrets:
    writes:
      enabled: true
  # The fleet account, stated explicitly rather than inherited: the LDAP identity the dashboard
  # authenticates to a TARGET cluster as, to read that cluster's poller ServiceAccount token
  # (SPEC_S4b). Measured on this cluster: `oc get user ocp-oauth-bind-serviceid` exists, so the
  # account authenticates, and the estate's token-reader Role already binds it.
  fleetAccount:
    username: ocp-oauth-bind-serviceid
    passwordSecret:
      namespace: openshift-config
      name: ldap-oauth-bind-secret
      key: bindPassword

# The estate's own platform namespaces (#255), the reference answer values.yaml's comment documents — measured on
# this cluster: `-operator` catches cert-manager-operator, group-sync-operator and namespace-configuration-operator,
# `-manager` cert-manager, `-provisioner` hostpath-provisioner, and kyverno and group-sync-dashboard match no
# pattern and are named. Since #353 a ServiceAccount in one of these is the platform's own — built-in, never an
# unmanaged finding (SPEC_U1 §5 step 7: 124 finding rows on 117 bindings under the shipped defaults → 49 on 46).
platformNamespaces:
  additionalSuffixes: ["-operator", "-manager", "-provisioner"]
  additionalNames: ["kyverno", "group-sync-dashboard"]
