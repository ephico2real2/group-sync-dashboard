# CRC — local development cluster.
#
# Pass with every upgrade:
#   helm upgrade --install group-sync-dashboard charts/group-sync-dashboard \
#     -n group-sync-dashboard -f environments/crc.yaml
#
# ingress.host is deliberately absent: the chart derives it from the cluster's own apps
# domain, which on CRC gives group-sync-dashboard.apps-crc.testing. Setting it here would
# pin a value that the chart already gets right, and pinning it is what made a changed
# default appear not to work.

# Bearer-token access to /api, for cluster-report.py and any external aggregator.
# The caller still needs cluster-wide RBAC read; see docs/api-access.md.
oauthProxy:
  apiTokenAccess:
    enabled: true

# ---------------------------------------------------------------------------
# Unmanaged-grant audit: log mode
# ---------------------------------------------------------------------------
# `log` computes the full stamp plan every binding refresh and writes it to the pod log,
# patching nothing. It needs ZERO write access — the chart renders the `patch` RBAC grant only
# in `annotate` mode — so the ServiceAccount stays read-only.
#
# WHY NOT `annotate`. Measured on this cluster: it planned 4 stamps and landed 0. Kubernetes
# privilege-escalation prevention requires the writer of an RBAC object to already hold every
# permission that object grants, even for a metadata-only patch, so the API server demanded
# 175 extra rule sets to label a binding granting nothing but `view`, and a full wildcard for
# the cluster-admin one. Making that work means giving a read-only auditing tool the most
# privilege on exactly the most dangerous grants. See docs/unmanaged-audit-design.md.
#
# `log` therefore costs nothing and loses nothing that matters: the findings themselves are
# already in the UI and at /api/clusters/{id}/bindings/findings. The only thing `annotate`
# would add is the on-object label for `oc get -l rbac.ocp.io/unmanaged=true`, which a
# privileged CI job or `oc annotate` can apply instead.
config:
  unmanagedAudit:
    mode: "log"
